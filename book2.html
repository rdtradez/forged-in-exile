${F("askedKeystone")?`<p>${say(`"A keystone,"`)} Wren says, ${say(`"is the stone at the top of an arch. Without it, the arch falls. With it, everything leans on everything else, and holds. The Elders made people like you to hold the pieces together. And to take them apart again, if they had to."`)}</p>`:""}
${F("askedChild")?`<p>Wren is quiet for a long time. ${say(`"Your child,"`)} Wren says at last, ${say(`"is something the Elders tried to make and never could. I'll tell you when I'm sure. I'm nearly sure."`)}</p>`:""}
<p>Four days to get ready. Kell is ten days' march north${S.lv.northwatch>0?", or six from Northwatch":""}.</p>`,
choices:[{label:"Plan the first day.", go:"plan"}]},
c6d1:{ title:"The Envoy of Orsenne", text:()=>`
<p>An envoy arrives on the first day from a kingdom none of you have ever visited: Orsenne, three months' sail to the west. She is tall and dark and her hands are bandaged. Her name is Yselde Moro.</p>
<p>${say(`"We had a mirror,"`)} she says. ${say(`"A great one, on a hill over our capital. Elder work. We thought it was a monument. Last summer it woke and turned to face the sun."`)} She unwraps one hand. The burns are old and terrible. ${say(`"We lost a third of the city. We heard there was someone in the east who could put these things to sleep."`)}</p>`,
choices:[
  {label:"Promise to come to Orsenne when Kell is done.", hint:"Renown +4 · a long promise", fx:{renown:4, orsenne:"promise"}, go:"nextday"},
  {label:"Send Fen to Orsenne with her now.", hint:"Renown +3 · Fen will be gone a year · Fen ◆", fx:{renown:3, orsenne:"fen", aff_fen:1}, go:"nextday"},
  {label:"Teach her yourself, for a day: how to Listen.", hint:"Craft +1 · she may have the gift", fx:{craft:1, orsenne:"taught"}, go:"nextday"}
]},
c6d2:{ title:"Fen Listens", text:()=>`
<p>Fen sits in the Deep Forge for a day and a night with his hands on the rim of the shaft. When he comes out he can barely stand, and he draws you a map on the back of a ledger: the mountains north of Northwatch, a valley, a lake, and a fortress on an island in the lake.</p>
<p>${say(`"Kell,"`)} he says. ${say(`"It's under the fortress. Varga's men are three floors from it. I could hear them digging."`)} He looks at his hands. ${say(`"I could hear something else, too. Very faint. Coming from your house."`)}</p>`,
choices:[
  {label:"Make Fen rest. Take the map.", hint:"Fen ◆", fx:{aff_fen:1, kellMap:true}, go:"nextday"},
  {label:"Ask what he heard from the house.", hint:"You already know", fx:{kellMap:true, sawSpark:true}, go:"nextday"}
]},
c6d3:{ title:"The Old King", text:()=>`
<p>A man walks into Northwatch on the third day and asks for you by name. He is one of Varga's officers: Captain Mael Duskin, thinner than ever, his frostbitten ear grey. ${F("duskinHeld")?"The same Duskin you held as a hostage through the first winter.":""} He has walked for nine days.</p>
<p>${say(`"King Oskar is dead,"`)} he says. ${say(`"He died two winters ago, in the fortress at Kell. The Duke has kept him in the ice cellar, and sealed letters with his ring, and told the men the King is ill. I helped him. I can't anymore."`)} He sits down in the snow. ${say(`"The Duke doesn't want Kastrel back. He wants the Lantern. He wants to be what the Elders were."`)}</p>`,
choices:[
  {label:"Give Duskin a warm bed and a pardon.", hint:"Unity +3 · he'll guide you into Kell", fx:{unity:3, duskinGuide:true, n_c6:1}, go:"nextday"},
  {label:"Send word of Oskar's death to every one of Varga's camps.", hint:"His men may leave him", fx:{oskarNews:true, n_c6:1}, go:"nextday"}
]},
c6d4:{ title:"The Child Hums", text:()=>`
<p>On the last night before you march, ${CHILD()} won't go to sleep. ${CPc("sub")} sits up in bed and hums, one note, low and steady, and the whole manor hums back: the walls, the floor, the stone of the hearth, the arches of the great hall. ${SPN()?`${SPN()} stands in the doorway with ${SPp("pos")} hand over ${SPp("pos")} mouth.`:"Your father stands in the doorway, very pale."}</p>
<p>It's the same note you heard from the Deep Forge. The same note as the Tide Gate. The same note the Storm Engine made the day it woke.</p>`,
choices:[
  {label:"Sit on the bed and hum it with the child, softly, until sleep comes.", hint:"Morale +2 · something passes between you", fx:{morale:2, humTogether:true}, go:"nextday"},
  {label:"Ask Wren to watch over the child while you're gone.", hint:"Wren ◆", fx:{wrenWatch:true}, go:"nextday"},
  {label:"Take the child to Northwatch with you, and no further.", hint:"The child will be closer · and so will Varga", fx:{kidNorth:true}, go:"nextday"}
]},
c6c1:{ title:"The March to Kell", enter(){ crisisEnter(); }, text:()=>`
<p>You march north with four hundred Wardens, Tamsin's riders, a hundred Realm Builders with picks, and ${F("ending")==="keeper"?"Wren's pages in your coat":"Wren, who walks the whole way and never seems tired"}. ${S.lv.northwatch>0?"From Northwatch it is six days through the mountains.":"It is ten days through the mountains."} The valley of Kell, when you finally see it, is a long black lake under snowy peaks, and in the middle of the lake on an island, the old fortress, and above the fortress, very faint, a glow.</p>
<p>The Lantern is already half awake.</p>
${sys("CRISIS",`[The Lantern of Kell]<br>Varga is three floors above it, and digging`,"warn")}`,
choices:()=>[
  {label:"Freeze a road across the lake in one night, and attack at dawn.", hint:"Keystone · Craft", fx:{n_c6:S.stats.craft>=17?2:1}, go:"c6c2"},
  ...(F("duskinGuide")?[{label:"Let Duskin lead you in through the Elder drains under the lake.", hint:"He knows the way", fx:{n_c6:2, drains:true}, go:"c6c2"}]:[]),
  {label:"Surround the lake and call on Varga's men to surrender.", hint:F("oskarNews")?"They know about Oskar now":"They don't know about Oskar", fx:{n_c6:F("oskarNews")?2:1}, go:"c6c2"}
]},
c6c2:{ title:"The Fortress", text:()=>`
<p>${F("drains")?`The drains are a thousand years old and dry as bone, and they bring you up through the floor of the fortress cellars, past an ice room where an old man in a crown lies very still under a fur. King Oskar.`:`The fortress gates are ice and old iron. Inside, half of Varga's men have already thrown down their weapons. The other half are fighting like people who have nothing left to go home to.`}</p>
<p>Below, through the stone, you can feel the Lantern. It is very close to waking now. It is looking. You can feel it looking at you, and past you, south, toward your house.</p>`,
choices:[
  {label:"Go down, now, alone if you have to.", hint:"Fast", fx:{n_c6:1, wentDown:"alone"}, go:"c6c3"},
  {label:"Go down with Fen and Wren.", hint:"Together", fx:{n_c6:2, wentDown:"together"}, go:"c6c3"}
]},
c6c3:{ title:"The Lantern", text:()=>`
<p>The Lantern of Kell is a sphere of clear stone the size of a cart, hanging in the air in a round chamber with no visible support, and it is full of light, and in the light you can see things: a garden, a storm, a forge, a wall in the sea, a mirror on a burning hill in a country you have never visited. Every Wonder in the world, all at once.</p>
<p>Duke Brannoch Varga has both hands on it. He is laughing and weeping. His eyes are full of light. ${say(`"I can see everything,"`)} he says. ${say(`"Everything. Your forge. Your gate. Your child, mason. I can see your child. ${CPc("sub")} is singing."`)}</p>`,
choices:()=>[
  {label:"Put your hands on the Lantern beside his and tell it to sleep.", hint:"Craft · the Keystone way", fx:{n_c6:S.stats.craft>=17?2:1, c6end:"sleep"}, go:"c6c4"},
  {label:"Pull Varga's hands off it.", hint:"Fast · he is very strong", fx:{n_c6:1, c6end:"pull"}, go:"c6c4"},
  ...(F("humTogether")?[{label:"Hum the note. The child's note.", hint:"You learned it together", fx:{n_c6:2, c6end:"hum"}, go:"c6c4"}]:[])
]},
c6c4:{ title:"Dark", enter(){ const o=outcome("c6"); S.flags.c6result=o; if(o==="great") add({unity:5, renown:5, craft:1}); else if(o==="good") add({unity:2, renown:3}); else add({morale:-2}); S.phase="open"; }, text:()=>`
<p>${F("c6end")==="hum"?`You hum the note, the one ${CHILD()} hummed in bed, and the Lantern hears it, and you feel it turn away from Varga like a child turning toward a parent's voice. It sighs. The light goes out of it, slowly, like a fire banked for the night.`:F("c6end")==="sleep"?`You lay your hands on the stone and tell it, sleep. It fights you. It wants to see. You hold on until your hands go numb, and at last, slowly, the light goes out.`:`You tear Varga's hands off the Lantern, and he screams, and the light goes out all at once, like a door slamming.`}</p>
<p>Varga is gone when you can see again. ${({great:"His men surrender, all of them, and Duskin carries the old king's body out of the ice for a proper burial. You find Varga's tracks in the snow going north, alone, over the mountains, toward nowhere.",good:"Most of his men surrender. Varga and a hundred riders break out over the ice and vanish into the mountains.",hard:"Varga's men fight their way out with him across the lake, and you lose good Wardens on the ice. He is gone into the mountains with half his army."})[F("c6result")]}</p>
${sys("CRISIS OVER",`[The Lantern sleeps]<br>${({great:"Varga flees alone",good:"Varga escapes with a hundred riders",hard:"Varga escapes with half his army"})[F("c6result")]} · he saw your child`)}`,
choices:[{label:"Go home.", go:"c6season"}]},
c6season:{ title:"Part Two: Summer of Wonders", enter(){ seasonEnter(); if(S.lv.northwatch===0) S.lv.northwatch=1; }, text:()=>`
<p>You get home in high summer. ${CHILD()} meets you at the gate and says, before you can even get off the horse: ${say(`"The big light went to sleep. I felt it."`)}</p>
${sys("SUMMER",`Five weeks · three works a week · Northwatch guards the north · the guild works faster now<br>${nextTierText()}`)}`,
choices:[{label:"Plan the first week.", go:"plan"}]},
c6w1:{ title:"The Northern Clans", text:()=>`
<p>The mountain clans of the north, who served Varga because he fed them and King Oskar because there was no one else, send their chiefs down to Northwatch in the first week. Eleven of them, in furs, with their hands open.</p>
<p>${say(`"The King is dead,"`)} the eldest says. ${say(`"The Duke is mad. We have no one. We hear ${RN()} takes in people who have no one."`)}</p>`,
choices:[
  {label:"Welcome them into the Accord, with a seat on the council.", hint:"Unity +6 · Northwatch grows", fx:{unity:6, clans:"accord"}, then:()=>{ if(S.lv.northwatch<maxLv()) S.lv.northwatch++; }, go:"nextweek"},
  {label:"Make them a treaty of friendship, but keep them independent.", hint:"Defense +3 · Renown +2", fx:{defense:3, renown:2, clans:"treaty"}, go:"nextweek"},
  {label:"Send them grain for the winter and an invitation to come back next year.", hint:"Grain −10 · Unity +2", req:()=>S.stats.grain>=10, fx:{grain:-10, unity:2, clans:"later"}, go:"nextweek"}
]},
c6w2:{ title:"Listeners", text:()=>`
<p>Fen comes to you in the second week with a list of names: thirty people from both banks who can Listen, a little. A shepherd from Highmeadow. A smith from Karsk. Two children from the two-tongue school. ${F("orsenne")==="taught"?"Yselde Moro, writing from Orsenne, who has taught herself to hear her mirror.":""}</p>
<p>${say(`"There are more of us than we thought,"`)} Fen says. ${say(`"Since the Engine woke. It's like the stones are teaching people."`)}</p>`,
choices:[
  {label:"Train them all at the Deep Forge, under Fen.", hint:"Craft +2 · Fen ◆", fx:{craft:2, aff_fen:1, listeners:true}, go:"nextweek"},
  {label:"Send them to watch every Elder site in the realm.", hint:"Defense +2 · Craft +1", fx:{defense:2, craft:1, listeners:true}, go:"nextweek"}
]},
c6w3:{ title:"Another?", text:()=>`
${SPN()?`<p>${SPN()} brings it up on the manor roof, in the warm dark, the way ${SPp("sub")} brought up the first one. ${say(`"I was thinking,"`)} ${SPp("sub")} says. ${say(`"About another. ${CHILD()} keeps asking for a brother or a sister. Or a dog. I'd settle for either."`)}</p>`
:`<p>A letter comes from the camp warden at Karsk. There's a baby. A miner's child, from the fall at Ironvale, whose mother died in the spring. The warden remembers you. He thought you'd want to know.</p>`}`,
choices:()=>[
  {label:SPN()?`"Yes. Let's have another."`:"Ride to Karsk.", hint:"A second child arrives in Chapter Nine", fx:{child2Path:SPN()?"expecting":"adopt", morale:2}, go:"nextweek"},
  {label:SPN()?`"A dog first. Then we'll see."`:"Write back that you can't, not now, with Varga still out there.", hint:SPN()?"Morale +2 · there is a dog":"Morale −1", fx:SPN()?{morale:2, dog:true}:{morale:-1}, go:"nextweek"}
]},
c6w4:{ title:"Ostrow's Offer", text:()=>`
<p>Ostrow comes to the manor in the fourth week, which he has never done uninvited. He is greyer than he was. He sits in your library and accepts a glass of something and does not drink it.</p>
<p>${say(`"I'm sixty eight,"`)} he says. ${say(`"I have no children. I have more money than the realm. When I die it goes to whoever my lawyers like best, and I don't like my lawyers."`)} He sets down the glass. ${say(`"Make me Chancellor of the Realm. Officially. Let me do it properly for ten years, in the open. And when I die it all goes to the realm. Every coin."`)}</p>`,
choices:[
  {label:"Make him Chancellor.", hint:"Coin +10 · Ostrow ◆◆◆ · Marren will need convincing", fx:{coin:10, aff_ostrow:3, chancellor:true, aff_marren:-1}, go:"nextweek"},
  {label:"Make him Chancellor, under the council's eye, with Marren signing everything.", hint:"Coin +6 · Unity +2 · Ostrow ◆", fx:{coin:6, unity:2, aff_ostrow:1, chancellor:true}, go:"nextweek"},
  {label:"Refuse him, kindly.", hint:"Ostrow ◆◆ hurt", fx:{aff_ostrow:-2}, go:"nextweek"}
]},
c6w5:{ title:"Midsummer on the Bridge", text:()=>`
<p>Midsummer, and the realm holds its feast on the Bridge of Two Banks, a single long table from one end to the other. ${F("clans")==="accord"?"The northern chiefs sit in their furs and sweat and refuse to take them off.":""} ${F("dog")?"The dog steals a whole ham.":""}</p>
<p>${CHILD()} falls asleep in your lap before the fireworks, and wakes up for them, and falls asleep again. Across the table your father is telling ${F("ending")==="keeper"?"Fen":"Wren"} a long story about Highcrown, and laughing, and then coughing, for a long time.</p>`,
choices:[{label:"Watch him. Say nothing yet.", hint:"Morale +2", fx:{morale:2, edricCough:true}, go:"nextweek"}]},
c6close:{ title:"The Sound in the Night", text:()=>`
<p>At the end of summer, in the middle of the night, every bell in Brackenfold rings at once. Nobody is pulling the ropes.</p>
<p>You run to the nursery. ${CHILD()} is standing at the window in ${CP("pos")} nightclothes, singing. Outside, in the moonlight, the cracked old stone of the well in the manor courtyard has knitted itself whole, and from the top of it, slowly, like a plant growing, a flower of stone is opening.</p>`,
choices:[{label:"End of Chapter Six.", go:"summary6"}]},
summary6: chapterSummary(6, ()=>`<p>The Lantern of Kell sleeps. King Oskar is buried. Varga is somewhere in the mountains ${({great:"alone",good:"with a hundred riders",hard:"with half an army"})[F("c6result")]}, and he has seen your child. ${F("chancellor")?"Ostrow is Chancellor of the Realm, and very pleased with himself.":""} And ${CHILD()}'s magic has woken.</p>`, "Chapter Seven: The Child's Spark", "c7open"),

/* ============================ CHAPTER SEVEN: THE CHILD'S SPARK ============================ */
c7open:{ title:"The Child's Spark", enter(){ chapterEnter(7); S.flags.childSpark=true; }, text:()=>`
<p>By morning there are four stone flowers in the courtyard, and a fifth growing out of the garden wall. ${CHILD()} is very proud of them and very tired, and falls asleep at breakfast with ${CP("pos")} face in the porridge.</p>
<p>${F("ending")==="keeper"?"Fen":"Wren"} kneels by the well for a long time with ${F("ending")==="keeper"?"his":"their"} hands on the flower. ${say(`"I was nearly sure,"`)} ${F("ending")==="keeper"?"Fen reads, from the page Wren's voice gave him that morning":"Wren says"}. ${say(`"Now I am. The Elders had a word for it in their oldest books. Cantor. One who sings stone awake. Not mending it, like you. Waking it. Telling it what it could become. They tried to make one for a thousand years. They never did."`)}</p>
<p>${say(`"Your child,"`)} ${F("ending")==="keeper"?"the page says":"Wren says"}, ${say(`"can wake every Wonder in the world. Or sing them all to sleep."`)}</p>
${sys("THE CHILD",`[${CHILD()}: CANTOR]<br>A power no one has had since the Elders · not mending, but waking`)}`,
choices:[
  {label:"Keep it quiet. The world doesn't need to know yet.", hint:"Defense +2 · Morale +1", fx:{defense:2, morale:1, sparkKnown:"secret"}, go:"c7days"},
  {label:"Tell the council, and the realm. No secrets in this house.", hint:"Unity +4 · everyone will know, including Varga", fx:{unity:4, sparkKnown:"public"}, go:"c7days"},
  {label:"Ask the child what they want.", hint:"Morale +3 · the child is four", fx:{morale:3, sparkKnown:"asked"}, go:"c7days"}
]},
c7days:{ title:"A Spring of Songs", enter(){ daysEnter(); }, text:()=>`
<p>${F("sparkKnown")==="asked"?`${CHILD()} thinks about it very seriously, eating an apple. ${say(`"I want to make a flower for Grandfather,"`)} ${CP("sub")} says at last. ${say(`"A big one. He's tired."`)}`:F("sparkKnown")==="public"?"The news is across both banks by the evening. By morning there are pilgrims at the manor gate, wanting to see the stone flowers.":"The flowers are moved into the walled garden, where nobody sees them but the family."}</p>`,
choices:[{label:"Plan the first day.", go:"plan"}]},
c7d1:{ title:"The Spire's Letter", text:()=>`
<p>A letter from the Academy of the Spire in Highcrown, signed by Archmagister Morrow himself. The Academy has heard of a child in ${RN()} with a new kind of magic. It would be honored to test the child. To rank ${CP("obj")}. To give ${CP("obj")} a place.</p>
<p>The last time the Academy tested a Valcrest, it ranked you as worthless and your family sent you into exile.</p>`,
choices:[
  {label:"Refuse. Politely. Very politely.", hint:"Resentment +1 · Morale +1", fx:{resent:1, morale:1, spire:"refused"}, go:"nextday"},
  {label:"Invite Morrow to come here, as a guest, not an examiner.", hint:"Renown +2 · Morrow is old and blind and may surprise you", fx:{renown:2, spire:"invited"}, go:"nextday"},
  {label:`Write back: "Ranked by whom?"`, hint:"Renown +3 · Resentment +1 · the Academy is not amused", fx:{renown:3, resent:1, spire:"rude"}, go:"nextday"}
]},
c7d2:{ title:"A Teacher", text:()=>`
<p>A four year old who can wake stone needs a teacher. The trouble is that nobody alive knows how to teach it.</p>`,
choices:()=>[
  {label:"Fen. He was your apprentice. Now he can have one.", hint:"Fen ◆◆ · Craft +1", fx:{teacher:"fen", aff_fen:2, craft:1}, go:"nextday"},
  {label:"You. Every morning, in the workshop tower.", hint:has("manorWorkshop")?"Morale +3 · the workshop is ready":"Morale +2", fx:{teacher:"you", morale:has("manorWorkshop")?3:2}, go:"nextday"},
  ...(F("ending")!=="keeper"?[{label:"Wren, who has waited four hundred years for this.", hint:"Craft +2", fx:{teacher:"wren", craft:2}, go:"nextday"}]:[]),
  {label:"Nobody. Let the child play, and learn by playing.", hint:"Morale +2 · Resentment −1", fx:{teacher:"play", morale:2, resent:-1}, go:"nextday"}
]},
c7d3:{ title:"A Flower for Grandfather", text:()=>`
<p>${CHILD()} makes the flower for ${CP("pos")} grandfather on the third day, in the manor garden, at the end of the lawn by his bench. It takes the whole morning and a great deal of humming, and when it is finished it is a stone rose as tall as a man, white, with veins of silver through it, opening and closing very slowly with the sun.</p>
<p>${F("fatherHere")?`Your father sits on his bench and looks at it for a long time. He does not say anything. He holds his grandchild's hand. He coughs, and keeps holding it.`:""}</p>`,
choices:[
  {label:"Sit with them.", hint:"Morale +3", fx:{morale:3, stoneRose:true}, go:"nextday"},
  {label:"Send for the physician from Marrow Ford, quietly.", hint:"The cough is worse", fx:{morale:1, stoneRose:true, physician:true}, go:"nextday"}
]},
c7d4:{ title:"The Collar Bell", text:()=>`
<p>${F("collarBell")?"It is the day the Collar Bell of Karsk rings, once a year, for the day the collars came off.":"It is the anniversary of the day the collars came off in Karsk."} The whole family goes. ${CHILD()} sits on Ruslan's shoulders in the square, and when the moment comes, before anyone can pull the rope, ${CP("sub")} starts to sing.</p>
<p>${F("collarBell")?"The bell rings by itself. Once, twice, a hundred times, every collar that went into it ringing out together":"Every anvil in Karsk rings by itself, all at once, every one that ever held a collar"}, and the whole square, three thousand people, is weeping.</p>
<p>And fifty miles away on the border, in the Cage of Arches, the Storm Engine hears the song, and answers.</p>`,
choices:[{label:"Look up. The sky is changing.", go:"nextday"}]},
c7c1:{ title:"The Waking", enter(){ crisisEnter(); }, text:()=>`
<p>The storm comes from the west in an hour. Not an ordinary storm: a wall of black cloud the height of the sky, moving against the wind, with lightning running along it like stitching. The Storm Engine is waking. It heard the Cantor sing, and it thinks it has been called.</p>
<p>${CHILD()} is in your arms, white and frightened, and ${CP("sub")} is still humming, ${CP("sub")} can't stop, and every time ${CP("sub")} hums the storm comes faster.</p>
${sys("CRISIS",`[The Waking]<br>The Storm Engine answers the child · the realm is under the storm`,"warn")}`,
choices:()=>[
  {label:"Hold the child close and hum along, lower, slower, until the song changes.", hint:F("humTogether")?"You've done this before":"Morale decides", fx:{n_c7:F("humTogether")?2:S.stats.morale>=20?2:1}, go:"c7c2"},
  {label:"Get the child under the stone of the Collar Bell tower, away from the sky.", hint:"Safe · the storm still comes", fx:{n_c7:1}, go:"c7c2"},
  {label:`Give the child to ${SPN()||"Ruslan"} and ride for the Engine yourself.`, hint:"Fast · the child will be alone with this", fx:{n_c7:1, rodeAlone:true}, go:"c7c2"}
]},
c7c2:{ title:"The Cage of Arches", text:()=>`
<p>${F("rodeAlone")?"You reach the Cage of Arches in the worst of it, alone.":`You reach the Cage of Arches in the worst of it, with ${CHILD()} in front of you on the saddle, ${CP("pos")} face pressed into your coat.`} The seam in the Engine you once closed is glowing. It is opening, slowly, like an eye.</p>
<p>${F("ending")==="keeper"?say(`"Keystone,"`)+" says Wren's voice, from inside the stone. "+say(`"It wants the child. It thinks the child is its keeper. Help me."`):F("ending")==="last"?"You remember the inside of it: a year of light. You do not want to go back.":"You put your hands on the seam. It is hot as the Deep Forge."}</p>`,
choices:()=>[
  {label:"Close the seam the way you did before.", hint:"Craft decides", fx:{n_c7:S.stats.craft>=18?2:1, c7how:"you"}, go:"c7c3"},
  ...(!F("rodeAlone")?[{label:"Put the child's hand on the seam beside yours.", hint:"Together", fx:{n_c7:2, c7how:"together"}, go:"c7c3"}]:[]),
  {label:"Talk to it. Tell it the child isn't ready.", hint:"Listening", fx:{n_c7:1, c7how:"talk"}, go:"c7c3"}
]},
c7c3:{ title:"The Lullaby", text:()=>`
<p>${F("c7how")==="together"?`${CHILD()}'s small hand goes flat on the glowing stone beside yours. ${CPc("sub")} isn't frightened anymore. ${say(`"It's sad,"`)} ${CP("sub")} says. ${say(`"It's been asleep so long it forgot how to wake up properly."`)}`:"The seam fights you. It wants the song."}</p>
<p>And you understand, all at once, what to do. You can't close it against the Cantor. But the Cantor can sing it to sleep.</p>`,
choices:()=>[
  {label:`"Sing it a lullaby, love. The one ${SPN()||"Grandfather"} sings to you."`, hint:"Trust the child", fx:{n_c7:2, c7end:"lullaby"}, go:"c7c4"},
  {label:"Sing it together, both of you, the note you hummed in the nursery.", hint:"Together", fx:{n_c7:F("humTogether")?2:1, c7end:"duet"}, go:"c7c4"},
  {label:"Hold it shut yourself, as long as it takes, and let the child go home.", hint:"Craft · a long night", fx:{n_c7:1, craft:1, c7end:"hold"}, go:"c7c4"}
]},
c7c4:{ title:"Clear Skies", enter(){ const o=outcome("c7"); S.flags.c7result=o; if(o==="great") add({morale:5, craft:2, unity:3}); else if(o==="good") add({morale:3, craft:1}); else add({morale:-1, defense:-2}); S.phase="open"; }, text:()=>`
<p>${F("c7end")==="lullaby"?`${CHILD()} sings the lullaby ${SPN()?SPN():"your father"} sings every night, the one about the miller and the moon, in a small cracked voice, with ${CP("pos")} hand on the stone. The seam listens. Slowly, slowly, it closes, like an eye going heavy, and the storm overhead breaks up into ordinary rain.`:F("c7end")==="duet"?"You sing it together, the low note and the high one, and the Engine hears both, and settles between them like a cat between two people on a sofa, and sleeps.":"You hold it all night, and the child goes home with Tamsin, and in the morning the Engine is shut and you can't feel your hands for a week."}</p>
<p>${({great:"Not a single roof was lost in the realm. The farmers say it was the best rain in years.",good:"The storm took roofs off in Marrow Ford and Coldwater, and flooded the lower quays at Overbrack. Nobody was killed.",hard:"The storm tore through the west bank before it broke. Three villages need rebuilding."})[F("c7result")]}</p>
${sys("CRISIS OVER",`[The Engine sleeps]<br>${CHILD()} sang it to sleep · ${({great:"the realm is untouched",good:"some damage",hard:"heavy damage on the west bank"})[F("c7result")]}`)}`,
choices:[{label:"Carry the child home.", go:"c7season"}]},
c7season:{ title:"Part Two: Lessons", enter(){ seasonEnter(); }, text:()=>`
<p>${CHILD()} sleeps for two days. When ${CP("sub")} wakes up, the first thing ${CP("sub")} says is, ${say(`"Is it still asleep?"`)} and the second is, ${say(`"I'm hungry."`)}</p>
${sys("SPRING INTO SUMMER",`Five weeks · three works a week · the Spark School can be built<br>${nextTierText()}`)}`,
choices:[{label:"Plan the first week.", go:"plan"}]},
c7w1:{ title:"The First Lesson", text:()=>`
<p>${({fen:"Fen",you:"You",wren:"Wren",play:"Nobody"})[F("teacher")||"you"]} ${F("teacher")==="play"?"teaches the child, in the end, except the child. It goes well.":"start the lessons in the first week."} The first lesson, everyone agrees, should be the most important one. The trouble is deciding what that is.</p>`,
choices:[
  {label:"How to stop. How to be quiet. How to let things sleep.", hint:"Defense +2 · the safest lesson", fx:{defense:2, lesson:"stop"}, go:"nextweek"},
  {label:"How to Listen before you sing.", hint:"Craft +1 · the wisest lesson", fx:{craft:1, lesson:"listen"}, go:"nextweek"},
  {label:"How to ask. Every stone, every time.", hint:"Morale +2 · Resentment −1 · the kindest lesson", fx:{morale:2, resent:-1, lesson:"ask"}, go:"nextweek"}
]},
c7w2:{ title:()=>F("spire")==="invited"?"Morrow's Visit":"A Letter from Morrow", text:()=>`
${F("spire")==="invited"?`<p>Archmagister Morrow arrives in the second week, very old now, blind, on the arm of a young Academy scholar. He asks to sit in the garden by the stone rose. ${CHILD()} climbs into his lap without being asked and tells him about the Engine.</p>
<p>Morrow listens for an hour. Then he puts a book into your hands: ancient, bound in grey leather, from the Spire's locked library. ${say(`"The Silent Choir,"`)} he says. ${say(`"The Academy has hidden it for six hundred years. It's about Cantors. I was told as a boy that it was a fairy tale. I'm very glad to be wrong before I die."`)}</p>`
:`<p>A letter from Archmagister Morrow, in a shaky hand that someone else has guided: ${say(`"I was wrong about Artifice when you were a child, and I let the Academy send you away. I will not be wrong about your child. I am sending a book. The Academy will be furious. I am too old to mind."`)} The book is called The Silent Choir.</p>`}`,
choices:[{label:"Read it, that night, all of it.", hint:"Craft +2 · now you know what a Cantor is for", fx:{craft:2, silentChoir:true}, go:"nextweek"}]},
c7w3:{ title:"Your Father Is Tired", text:()=>`
<p>The physician from Marrow Ford comes in the third week${F("physician")?", for the third time":""}. He listens to your father's chest for a long time, and then asks to speak to you in the hall.</p>
<p>It is his heart. It has been tired for a long time. There is nothing to mend; it is not broken, only old. If he rests, the physician says, years yet. If he goes on as he has been, not many.</p>
<p>Your father, when you go back in, is already putting his coat on. ${say(`"I heard him,"`)} he says. ${say(`"The walls in this house are very thin. You should speak to the builder."`)}</p>`,
choices:[
  {label:"Sit down with him and tell him the truth, all of it.", hint:"Morale +1 · he prefers it", fx:{morale:1, aff_edric:2, edricKnows:true}, go:"nextweek"},
  {label:"Clear your calendar. Every afternoon, for him.", hint:"Morale +2 · the realm will wait", fx:{morale:2, aff_edric:2, edricAfternoons:true}, go:"nextweek"},
  {label:"Ask the child to sing for him.", hint:"It can't mend a heart · it helps anyway", fx:{morale:2, aff_edric:1}, go:"nextweek"}
]},
c7w4:{ title:"The Spark School", text:()=>`
<p>The news of the child has gone across both banks, and across the border, and families start arriving at the manor gate with their own children: a girl from Hollin Cross who can make wood grow back, a boy from Overbrack who makes it rain indoors when he cries, twins from Karsk who can hear iron singing in the ground. None of them fit the old houses. None of them have anywhere to go.</p>
<p>${say(`"There are more of them every year,"`)} Fen says. ${say(`"Since the Engine woke."`)}</p>`,
choices:[
  {label:"Open the manor's great hall to them as a school, until a real one is built.", hint:"Morale +2 · Craft +1 · the manor is very loud", fx:{morale:2, craft:1, sparkHall:true}, go:"nextweek"},
  {label:"Ask the Realm Builders to put the school at the top of their list.", hint:"Stone +6 · Timber +6 toward it", fx:{stone:6, timber:6}, go:"nextweek"}
]},
c7w5:{ title:"A Family Portrait", text:()=>`
<p>Seren sends a painter from Highcrown, an old woman who painted your father as a young man, and refuses to leave until she has painted the family. It takes all week. Nobody sits still. ${F("dog")?"The dog eats a brush.":""}</p>
<p>In the finished portrait your father sits in the middle in his good coat with ${CHILD()} on his knee, and ${SPN()?`you and ${SPN()} stand behind him`:"you stand behind him with your hand on his shoulder"}, and the stone rose is in the background, and everyone is almost smiling except your father, who is smiling completely, for the first time in any portrait ever painted of him.</p>`,
choices:[{label:"Hang it in the great hall.", hint:"Morale +3", fx:{morale:3, portrait:true}, go:"nextweek"}]},
c7close:{ title:"A Letter from Seren", text:()=>`
<p>At the end of summer, a rider comes from Highcrown at a gallop, with a letter from Seren sealed in black.</p>
<p>${say(`"The king is dying,"`)} she writes. ${say(`"Days, the physicians say. Prince Corvin is already measuring the throne room for new curtains. He has told the great houses that his father's Accord was a mistake, and that he will not honor it. Father must come. You must come. Bring the child; Aldric asked."`)}</p>
<p>Your father reads it over your shoulder. Then he goes to put his coat on.</p>`,
choices:[{label:"End of Chapter Seven.", go:"summary7"}]},
summary7: chapterSummary(7, ()=>`<p>${CHILD()} is a Cantor, the first in a thousand years. ${({great:"${CHILD()} sang the Storm Engine to sleep without a single roof lost.",good:"${CHILD()} sang the Storm Engine to sleep, and the realm mended what the storm broke.",hard:"The Storm Engine sleeps again, and the west bank is rebuilding."})[F("c7result")].replace("${CHILD()}",CHILD())} Your father is tired. And in Highcrown, a king is dying.</p>`, "Chapter Eight: The Two Crowns", "c8open")
});

/* ================================================================
   BOOK TWO, CHAPTERS EIGHT TO TEN, THE ENDINGS, AND THE CHAPTER TABLE
   ================================================================ */
Object.assign(SCENES, {
/* ============================ CHAPTER EIGHT: THE TWO CROWNS ============================ */
c8open:{ title:"The Two Crowns", enter(){ chapterEnter(8); }, text:()=>`
<p>You leave for Highcrown at dawn: you, ${SPN()?SPN()+", ":""}${CHILD()}, and your father in the carriage with a blanket over his knees, refusing to admit that he needs it. Behind you, Marren and the council will hold the realm, and Fen will hold the Realm Builders, and Ostrow will hold, as he puts it, everything else.</p>
<p>It is four days to Highcrown. You haven't been back since the Stone Trial. The last time you lived there, you were sixteen, and your family sent you away in a cart.</p>
<p>${say(`"Corvin,"`)} your father says, somewhere on the second day, looking out at the rain. ${say(`"I taught him to ride, you know, when he was a boy. Aldric asked me to. He was a frightened child. Frightened children become one of two things. We are about to find out which."`)}</p>`,
choices:[
  {label:"Ask him what he'll say to Corvin.", hint:"Your father's counsel", fx:{c8ask:"corvin"}, go:"c8days"},
  {label:"Ask him how he's feeling, really.", hint:"He tells you the truth", fx:{c8ask:"health", aff_edric:1}, go:"c8days"},
  {label:"Let him sleep with his head on your shoulder.", hint:"Morale +2", fx:{morale:2, c8ask:"sleep"}, go:"c8days"}
]},
c8days:{ title:"Highcrown", enter(){ daysEnter(); S.flags.away=true; }, text:()=>`
<p>${F("c8ask")==="corvin"?`${say(`"I'll tell him the truth,"`)} your father says. ${say(`"It is the only weapon I have left that he hasn't seen."`)}`:F("c8ask")==="health"?`${say(`"Tired,"`)} he says. ${say(`"Very tired. But I would like to see this through. And then I would like to sit on my bench."`)}`:"He sleeps all afternoon, and wakes up as the carriage comes over the last hill, and sees the Spire."}</p>
<p>Highcrown hasn't changed: white walls, slate roofs, the Spire of the Academy rising over everything like a needle. Seren meets you at the gates of House Valcrest with her son, who is six now and bows to you very correctly and then sets your sleeve on fire.</p>
${sys("AWAY",`[In Highcrown]<br>One work a day, by letter · the council and the Realm Builders hold the realm`)}`,
choices:[{label:"Plan the first day, by letter.", go:"plan"}]},
c8d1:{ title:"The City That Sent You Away", text:()=>`
<p>You walk through Highcrown on the first morning with ${CHILD()} holding your hand. People stare. Some of them bow. One old man at the market spits on the ground as you pass, and another old man knocks his hat off for it.</p>
<p>${CHILD()} wants to see the house you grew up in. You stand outside the Valcrest gates and look at the window of the room you slept in until you were sixteen. ${say(`"Was it nice?"`)} ${CHILD()} asks. You think about it for a long time.</p>`,
choices:[
  {label:`"No. But it taught me what I wanted to build instead."`, hint:"Resentment −1 · Morale +1", fx:{resent:-1, morale:1}, go:"nextday"},
  {label:"Take the child up the Spire, to see the whole city.", hint:"Renown +2 · the Academy can't stop you", fx:{renown:2}, go:"nextday"},
  {label:"Go to the market and buy the child the worst sweets in Highcrown, the ones you loved.", hint:"Morale +2", fx:{morale:2}, go:"nextday"}
]},
c8d2:{ title:"King Aldric", text:()=>`
<p>The king receives you in his bedchamber. He is very thin and very yellow and his hands shake on the coverlet, but his eyes are clear. He sends everyone out but you, and your father, and the child.</p>
<p>${say(`"I made one good decision as king,"`)} Aldric says. ${say(`"I gave away land. Nobody ever does that. They'll put it on my tomb as a joke."`)} He holds out a sealed letter. ${say(`"For my son. Give it to him after. He won't read it if I give it to him."`)} He looks at ${CHILD()}. ${say(`"Come here, little one. Sing me something. I hear you're good at it."`)}</p>`,
choices:[
  {label:"Let the child sing for the king.", hint:"Morale +2 · Aldric smiles", fx:{morale:2, sangForAldric:true}, go:"nextday"},
  {label:"Promise him you'll keep the peace with his son, whatever it costs.", hint:"Renown +2 · a heavy promise", fx:{renown:2, promisedAldric:true}, go:"nextday"},
  {label:"Thank him. Just thank him.", hint:"Unity +2", fx:{unity:2}, go:"nextday"}
]},
c8d3:{ title:"Prince Corvin", text:()=>`
<p>Prince Corvin receives you in the throne room, standing beside the empty throne, not on it. He is thirty, tall, thin, beautifully dressed, with his father's eyes and none of his father's warmth.</p>
<p>${say(`"My father gave you half a province,"`)} he says. ${say(`"Marrow Ford, Hollin Cross, Woodsedge, Greenreach: Aurendell land for three hundred years. When I am king, I will want it back. I don't want a war. I want what is mine."`)} He glances at the window, toward the Spire. ${say(`"And I hear you have a child who can wake Elder Wonders. The Academy is very interested in that child. So am I."`)}</p>`,
choices:[
  {label:`"The west bank chose ${RN()}. Ask them."`, hint:"Unity decides how firmly they stand", fx:{n_c8:S.stats.unity>=70?2:1}, go:"nextday"},
  {label:`"You'll never touch my child."`, hint:"Resentment +1 · honest", fx:{resent:1, n_c8:1}, go:"nextday"},
  {label:`"What are you afraid of, Corvin?"`, hint:"Your father's question", fx:{n_c8:2, askedCorvin:true}, go:"nextday"}
]},
c8d4:{ title:"Seren's Council", text:()=>`
<p>Seren gathers the great houses in the Valcrest library on the fourth night: twelve lords and ladies, half of whom testified against you at the Stone Trial. They are frightened. A king is dying, his heir wants a war nobody else wants, and there is a ${TITLE()} in the room whose child can wake the Storm Engine.</p>
<p>${say(`"Corvin needs the houses to go to war,"`)} Seren says. ${say(`"If enough of us say no, he can't. The question is what we say yes to instead."`)}</p>`,
choices:[
  {label:"Offer the houses a share in the Realm Road, when it's built: trade from the mountains to the sea.", hint:"Renown +2 · Coin −6 · greed is reliable", req:()=>S.stats.coin>=6, fx:{renown:2, coin:-6, n_c8:2, offeredRoad:true}, go:"nextday"},
  {label:"Offer them the Deep Forge's iron at a fair price.", hint:F("forge")==="sealed"?"It's sealed · they won't believe you":"They want iron", fx:{n_c8:F("forge")==="sealed"?0:2, offeredIron:true}, go:"nextday"},
  {label:"Let Seren speak. They're more afraid of her than of you.", hint:"Seren decides", fx:{n_c8:(F("aff_seren")||0)>=3?2:1}, go:"nextday"}
]},
c8c1:{ title:"The King Is Dead", enter(){ crisisEnter(); }, text:()=>`
<p>King Aldric dies on the fifth morning, quietly, with the window open. The bells of Highcrown ring all day. By evening, Corvin has been crowned, in a hurry, in the Spire chapel, with half the great houses absent.</p>
<p>The next morning he summons the whole court, and you, and your father. He sits on the throne now. He looks smaller on it. He reads a proclamation: the Accord of ${RN()} was made by a dying man under the influence of an exiled Valcrest. The west bank lands will be returned to Aurendell within the year, or Aurendell will take them.</p>
${sys("CRISIS",`[The Two Crowns]<br>King Corvin wants the west bank back`,"warn")}`,
choices:()=>[
  {label:"Give him his father's letter, in front of the whole court.", hint:"Aldric's last words", fx:{n_c8:2, gaveLetter:"public"}, go:"c8c2"},
  {label:"Give him the letter privately, after.", hint:"Kinder · slower", fx:{n_c8:1, gaveLetter:"private"}, go:"c8c2"},
  {label:"Answer him in front of the court: no.", hint:"Renown +2", fx:{n_c8:1, renown:2}, go:"c8c2"}
]},
c8c2:{ title:"Lord Edric", text:()=>`
<p>Before anyone else can speak, your father stands up.</p>
<p>It takes him a long time. He leans on his cane and on Seren's arm, and the whole court watches the old Lord of House Valcrest, once the most feared man in this room, haul himself to his feet. When he is up, he lets go of Seren and stands on his own.</p>
<p>${say(`"Your Majesty,"`)} he says. ${say(`"I taught you to ride. You fell off a great deal. You were afraid of the horse, and you were afraid of your father, and you were afraid of being a disappointment, and you got back on anyway. I was proud of you then."`)}</p>
<p>${say(`"I sent my own child away for having the wrong kind of magic,"`)} he says. ${say(`"I was afraid too. It was the worst thing I ever did. Don't do it to a kingdom, Corvin. You'll spend the rest of your life trying to be forgiven, and you'll be lucky if you are."`)}</p>`,
choices:[
  {label:"Go and stand beside him.", hint:"Together", fx:{n_c8:2, stoodWithEdric:true}, go:"c8c3"},
  {label:"Let him have the room. It's his moment.", hint:"His alone", fx:{n_c8:2}, go:"c8c3"}
]},
c8c3:{ title:"King Corvin", text:()=>`
<p>The throne room is silent. Corvin looks at your father for a long time. ${F("gaveLetter")==="public"?"His father's letter is open in his lap. His hands are shaking the way his father's did.":""} ${F("askedCorvin")?say(`"You asked me what I was afraid of,"`)+" he says to you. "+say(`"Your child. A child who can wake the Storm Engine on a whim, next door to my kingdom. Wouldn't you be?"`):""}</p>
<p>Then he looks at you. ${say(`"What do you offer me,"`)} he says, ${say(`"instead of the west bank?"`)}</p>`,
choices:()=>[
  {label:`"An alliance. The Realm Road runs to your border. Build the other half and it runs to your sea."`, hint:F("offeredRoad")?"The houses already want it":"A big promise", fx:{n_c8:F("offeredRoad")?2:1, c8end:"road"}, go:"c8c4"},
  {label:`"A promise: my child will never wake a Wonder against Aurendell. Written, sealed, in your chapel."`, hint:"He wants this most", fx:{n_c8:2, c8end:"promise"}, go:"c8c4"},
  {label:`"Nothing. The west bank isn't mine to trade. It chose."`, hint:"Unity decides", fx:{n_c8:S.stats.unity>=75?2:0, c8end:"nothing"}, go:"c8c4"},
  ...(F("ending")==="storm"?[{label:"Look out of the window at the clouds, and say nothing at all.", hint:"The Storm Crown · everyone understands", fx:{n_c8:2, resent:2, c8end:"storm"}, go:"c8c4"}]:[])
]},
c8c4:{ title:"Peace", enter(){ const o=outcome("c8"); S.flags.c8result=o; if(o==="great") add({unity:6, renown:6}); else if(o==="good") add({unity:3, renown:3}); else add({renown:-2, defense:2}); S.phase="open"; S.flags.away=false; }, text:()=>`
<p>${({road:"Corvin is quiet for a long time. Then he says, slowly, that a road to the sea would be worth more to Aurendell than four villages that hate him. The great houses, who already want it, murmur yes.",promise:"Corvin reads the promise three times. Then he signs a treaty beneath it, recognizing the Accord for his whole reign, and his heirs' reigns, in exchange.",nothing:"Corvin stares at you. The great houses stare at Corvin. Nobody moves to support him. In the end he waves a hand: the matter is closed, for now.",storm:"Above Highcrown, very gently, it begins to rain, on a cloudless day. Corvin looks at the window, and then at you, and signs the Accord's recognition with a hand that does not quite shake."})[F("c8end")||"nothing"]}</p>
<p>${({great:"By evening, Aurendell and "+RN()+" are allies, in writing, for a generation. Corvin comes to find you alone afterward and says, stiffly, that his father's letter made him cry, and that if you tell anyone he will declare war after all.",good:"The peace holds. It is not friendship. It is a beginning.",hard:"The peace holds, barely, and Corvin's eyes follow you out of the throne room. You will be watching the western border for a long time."})[F("c8result")]}</p>
${sys("CRISIS OVER",`[Two crowns, one peace]<br>${({great:"An alliance for a generation",good:"Peace with Aurendell",hard:"An uneasy peace"})[F("c8result")]}`)}`,
choices:[{label:"Take your father home.", go:"c8father"}]},
c8father:{ title:"The Bench", enter(){ S.flags.edricRetired=true; }, text:()=>`
<p>Your father collapses on the steps of the throne room, an hour after the treaty is signed. Not dramatically. He simply sits down on the top step, very carefully, and says, ${say(`"I think I would like to stay here a moment,"`)} and then doesn't get up.</p>
<p>The royal physicians come running. So, to everyone's surprise, does King Corvin. For three days your father lies in his old room in House Valcrest with the curtains drawn, and you and Seren take turns in the chair beside the bed, and ${CHILD()} sits on the end of it and sings very quietly, a lullaby, not a Cantor's song, and every stone in the old house hums along.</p>
<p>On the fourth morning he opens his eyes and asks for tea. Then for breakfast. Then for his cane.</p>
<p>${say(`"I am not dying in Highcrown,"`)} he says, when the physician tells him to rest. ${say(`"I have a bench."`)}</p>`,
choices:[{label:"Take him home.", go:"c8home"}]},
c8home:{ title:"Lord Edric Valcrest", text:()=>`
<p>He sleeps most of the way home. He wakes as the carriage crosses the Bridge of Two Banks, and asks you to stop, and sits for a while looking at the river, both banks, the roads going out in every direction, the realm you built.</p>
<p>${say(`"It is very good work,"`)} he says. Then: ${say(`"I am going to retire. Properly. No more courts, no more kings. I am going to sit on my bench, and correct my grandchild's reading, and be insufferable about roses. Will you let me?"`)}</p>
${sys("FAMILY",`[Lord Edric retires]<br>He stays in the manor, slower now, and very much alive`)}`,
choices:[
  {label:`"Only if you let me build you a better bench."`, hint:"Morale +3 · your father's garden can be planted", fx:{morale:3, aff_edric:2}, go:"c8season"},
  {label:`"Only if you teach the children everything you know about Highcrown, so they never have to learn it the hard way."`, hint:"Renown +2 · Morale +2", fx:{renown:2, morale:2, edricTeaches:true}, go:"c8season"},
  {label:"Hold his hand the rest of the way across the bridge.", hint:"Morale +2 · Resentment −1", fx:{morale:2, resent:-1}, go:"c8season"}
]},
c8season:{ title:"Part Two: The Quiet Summer", enter(){ seasonEnter(); }, text:()=>`
<p>The summer goes on. Your father is slower than he was. He walks to his bench in the mornings with the cane and with ${CHILD()} holding his other hand, and stays there until lunch, and everyone in the manor finds reasons to walk past.</p>
${sys("SUMMER",`Five weeks · three works a week · Edric's Bridge and your father's garden can be built<br>${nextTierText()}`)}`,
choices:[{label:"Plan the first week.", go:"plan"}]},
c8w1:{ title:"The Cane", text:()=>`
<p>Your father's cane has a crack in it, from the throne room steps. He refuses to let you mend it. ${say(`"It has earned the crack,"`)} he says. Then, the next morning, you find ${CHILD()} sitting on his bench with the cane across ${CP("pos")} knees, very seriously polishing the silver handle with a sleeve, and humming, and the crack is gone.</p>
<p>Your father looks at the cane for a long time. ${say(`"Well,"`)} he says at last. ${say(`"I suppose I can't argue with a Cantor."`)}</p>`,
choices:[
  {label:"Laugh.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"},
  {label:"Carve the child's initials into the handle, small, next to his.", hint:"Morale +2 · Craft +1", fx:{morale:2, craft:1}, go:"nextweek"}
]},
c8w2:{ title:"Seren", text:()=>`
<p>Seren comes to stay for two weeks, with her son, ostensibly to see the Realm Road plans and actually to watch your father breathe. She sits with him on the bench in the evenings, and they argue about House Valcrest's accounts, happily, for hours.</p>
<p>${say(`"He wrote to me every week,"`)} she tells you, on the last night. ${say(`"For ten years. About you. Every single week. What you'd built. What you'd said. I was so jealous, at first."`)} She laughs. ${say(`"Then I wasn't. Then I just liked hearing about you."`)}</p>`,
choices:[
  {label:"Ask her to stay longer. Her son and yours could grow up together.", hint:"Seren ◆◆ · Morale +2", fx:{aff_seren:2, morale:2, serenStays:true}, go:"nextweek"},
  {label:"Promise to bring Father to Highcrown every winter.", hint:"Renown +2 · Seren ◆", fx:{renown:2, aff_seren:1}, go:"nextweek"}
]},
c8w3:{ title:"The Child Asks", text:()=>`
<p>${say(`"Is Grandfather going to die?"`)} ${CHILD()} asks, at bedtime, in the third week. ${SPN()?`${SPN()} looks at you across the bed.`:""}</p>
<p>${say(`"The stones in the garden hum differently when he sits on them now,"`)} ${CP("sub")} adds. ${say(`"Softer. Like they're being careful."`)}</p>`,
choices:[
  {label:`"Someday, love. Not for a long time, if we take care of him."`, hint:"Morale +2", fx:{morale:2}, go:"nextweek"},
  {label:`"Then let's be careful too. You can help."`, hint:"Morale +2 · the child appoints a guard of one", fx:{morale:2, kidGuard:true}, go:"nextweek"}
]},
c8w4:{ title:"A Letter from the King", text:()=>`
<p>A letter comes from Highcrown in the fourth week, in King Corvin's own hand. It begins by asking after your father's health, which it does in four careful lines. Then: ${({great:say(`"I read my father's letter again. I would like to come and see the road you're building. Privately. I would like to bring my daughter. She makes things grow."`),good:say(`"The great houses want the Realm Road. I want what the great houses want, for now. We should talk."`),hard:say(`"I have not forgotten the west bank."`)})[F("c8result")]}</p>`,
choices:[
  {label:"Write back warmly, and invite him to the opening of the Realm Road.", hint:"Renown +2", fx:{renown:2, corvinInvited:true}, go:"nextweek"},
  {label:"Write back carefully, and double the watch on the western border.", hint:"Defense +3", fx:{defense:3}, go:"nextweek"}
]},
c8w5:{ title:"Edric's Letters", text:()=>`
<p>At the end of summer your father gives you a bundle of letters tied with a black ribbon, each one sealed with the Valcrest signet and addressed in his careful hand: ${say(`"For ${CHILD()}, on ${CP("pos")} eighteenth birthday."`)} ${say(`"For ${CHILD()}, on ${CP("pos")} wedding day, if there is one."`)} ${say(`"For ${CHILD()}, the first time ${CP("sub")} builds something that falls down."`)} ${F("child2Path")?`And a second bundle, smaller, addressed to ${say(`"the next one, whoever you are."`)}`:""}</p>
<p>${say(`"I fully intend to be there for all of these,"`)} he says. ${say(`"But I was at court for forty years. I know the value of having things in writing."`)} At the bottom of the pile there is one addressed to you. ${say(`"Don't open that one,"`)} he says. ${say(`"I'm going to tell you what it says myself, every day, until you're sick of it."`)}</p>`,
choices:[{label:"Put the letters somewhere safe.", hint:"Morale +3 · Resentment −1", fx:{morale:3, resent:-1, edricLetters:true}, go:"nextweek"}]},
c8close:{ title:"Something Useful", text:()=>`
<p>At the end of the summer, the council meets in the Accord Hall and Marren lays a long roll of paper on the table: the Realm Road. One road from the mountains at Stonegate to the sea at Saltford, through every town in the realm. It has been talked about for years. Nobody has had the nerve.</p>
<p>Your father, at the back of the chamber in his usual seat, clears his throat. ${say(`"The best things my child ever built,"`)} he says, ${say(`"were roads. Because they go to other people."`)} Then he pretends he didn't say anything.</p>`,
choices:[{label:"End of Chapter Eight.", go:"summary8"}]},
summary8: chapterSummary(8, ()=>`<p>King Aldric is dead, and King Corvin reigns in Highcrown, ${({great:"as your ally",good:"in peace with "+RN(),hard:"watching the western border"})[F("c8result")]}. Lord Edric Valcrest stood up before the whole court and stopped a war, and then came home to his bench, slower, and very much alive.</p>`, "Chapter Nine: The Realm Road", "c9open"),

/* ============================ CHAPTER NINE: THE REALM ROAD ============================ */
c9open:{ title:"The Realm Road", enter(){ chapterEnter(9); if(S.lv.stonegate===0) S.lv.stonegate=1; }, text:()=>`
<p>The council votes for the Realm Road unanimously, which has never happened before on anything, and everyone looks slightly alarmed afterward.</p>
<p>It will run from the pass at Stonegate in the eastern mountains, through Coldwater and across the marshes, to the sea at Saltford: a hundred miles, three great stages, the longest work anyone in the realm has ever attempted. ${F("child2Path")?`And in the middle of it, ${SPN()?"in the autumn, a new baby":"the papers for a second child from Karsk"}.`:""}</p>
<p>The only question is how to pay for it.</p>
${sys("THE REALM ROAD",`[Three great stages]<br>Cut the Stonegate pass · the long causeway · the great arch at Saltford · Stonegate is founded`)}`,
choices:()=>[
  ...(F("chancellor")||(F("aff_ostrow")||0)>=3?[{label:"Ostrow's bank pays for it.", hint:"Coin +16 · Ostrow ◆", fx:{coin:16, aff_ostrow:1, roadPaid:"ostrow"}, go:"c9days"}]:[]),
  ...(F("c8result")!=="hard"?[{label:"Aurendell pays half, and gets a road to the sea.", hint:"Coin +10 · Stone +8 · Corvin's engineers help", fx:{coin:10, stone:8, roadPaid:"corvin"}, go:"c9days"}]:[]),
  {label:"The realm pays for it, town by town, so everyone owns a mile.", hint:"Unity +6 · Coin +4", fx:{unity:6, coin:4, roadPaid:"realm"}, go:"c9days"}
]},
c9days:{ title:"The Survey", enter(){ daysEnter(); }, text:()=>`
<p>Four days of surveying before the work begins. You walk the line of the road with Fen, Garth, Ruslan, and ${CHILD()}, who is five and insists on carrying the measuring chain.</p>`,
choices:[{label:"Plan the first day.", go:"plan"}]},
c9d1:{ title:"The Surveyors", text:()=>`
<p>The line of the Realm Road is a matter of a hundred small arguments. Coldwater wants it through the village square. Velm wants a spur. The marsh villages want it to go around the marsh, which would add thirty miles. Garth wants it straight, through everything, because straight roads are beautiful.</p>
<p>${CHILD()} sits down in the middle of the marsh and puts both hands in the mud and says the stones underneath are very old and very deep and would like to be a road.</p>`,
choices:[
  {label:"Straight across the marsh, on an Elder causeway.", hint:"Craft +1 · the hard way, and the best", fx:{craft:1, roadLine:"straight"}, go:"nextday"},
  {label:"Around the marsh, with a spur to every village.", hint:"Unity +4 · longer", fx:{unity:4, roadLine:"around"}, go:"nextday"},
  {label:"Ask the child where the stones want it to go.", hint:"Morale +2 · surprisingly good advice", fx:{morale:2, roadLine:"child"}, go:"nextday"}
]},
c9d2:{ title:"Ostrow's Last Deal", text:()=>`
${(F("aff_ostrow")||0)>=3?`<p>Ostrow comes to the survey camp in a carriage, very old now, wrapped in furs in midsummer. He has his books with him. ${say(`"I've been reading them again,"`)} he says. ${say(`"All of them. Forty years. Do you know, I never built anything? I bought things, and sold them, and owned them. Not one thing I made."`)}</p>
<p>He pushes a ledger across the camp table. ${say(`"The causeway,"`)} he says. ${say(`"The whole second stage. My money. Put my name on one stone, somewhere small, where nobody will see it."`)}</p>`
:`<p>Tamsin's people catch a clerk from Ostrow's bank in the survey camp on the second night, with a lantern and a pot of paint, moving the survey stakes. Not far. Just enough that the road would run across land Ostrow bought last month, at a price he would set.</p>
<p>Ostrow, when you ride to Velm to see him, is very old and very calm. ${say(`"Business,"`)} he says. ${say(`"Only business. You would be disappointed in me if I'd stopped."`)}</p>`}`,
choices:()=>(F("aff_ostrow")||0)>=3 ? [
  {label:"Shake his hand, and put his name on the keystone of the great arch instead.", hint:"Coin +12 · Ostrow ◆◆", fx:{coin:12, aff_ostrow:2, ostrowStone:true}, go:"nextday"},
  {label:"Thank him, and tell him his name goes on a stone in the middle of the causeway, where everyone walks.", hint:"Coin +12 · Unity +2", fx:{coin:12, unity:2, ostrowStone:true}, go:"nextday"}
] : [
  {label:"Move the stakes back, and say nothing more.", hint:"Ostrow ◆ · he respects that", fx:{aff_ostrow:1}, go:"nextday"},
  {label:"Take him to court.", hint:"Unity +3 · Coin +6 in fines", fx:{unity:3, coin:6, aff_ostrow:-1}, go:"nextday"}
]},
c9d3:{ title:"Bandits at Stonegate", text:()=>`
<p>The surveyors at the Stonegate pass come running back down on the third day. There are men in the high passes: ragged, armed, living in the old Elder galleries in the rock. Some of them wear black and silver under their furs.</p>
<p>${say(`"Varga's,"`)} Tamsin says. ${say(`"What's left of them. He's not with them. They say he went over the mountains two winters ago and nobody's seen him since. They're just starving men with swords."`)}</p>`,
choices:[
  {label:"Offer them work on the road, with pay, like the prisoners in the first winter.", hint:F("prisoners")==="crews"?"The first ones became good masons":"Unity +3", fx:{unity:3, bandits:"hired", n_c9:1}, go:"nextday"},
  {label:"Send the Wardens to clear the passes.", hint:"Defense +2", fx:{defense:2, bandits:"cleared"}, go:"nextday"},
  {label:"Go up yourself, alone, unarmed, and talk.", hint:"Renown +3 · risky", fx:{renown:3, bandits:"talked", n_c9:1}, go:"nextday"}
]},
c9d4:{ title:()=>SPN()?"A Day Off":"The Camp at Night", text:()=>`
${SPN()?`<p>${SPN()} rides out to the survey camp on the fourth day with a picnic and a firm expression, and confiscates your measuring chain. ${F("child2Path")==="expecting"?`${say(`"The baby is due in two months,"`)} ${SPp("sub")} says. ${say(`"You will spend one day before then doing nothing. This one."`)}`:say(`"You'll spend one day this summer doing nothing,"`)+" "+SPp("sub")+" says. "+say(`"This one."`)}</p>`
:`<p>At night in the survey camp, ${CHILD()} sleeps in your tent with ${CP("pos")} hand pressed against the ground. Somewhere far below, you can feel the old road the Elders built here, buried under a thousand years of marsh, humming in time with ${CP("pos")} breathing.</p>`}`,
choices:[
  {label:"Do nothing, all day. Lie in the grass.", hint:"Morale +3", fx:{morale:3}, go:"nextday"},
  {label:"Teach the child to skip stones on the river.", hint:"Morale +2 · the stones skip forever", fx:{morale:2}, go:"nextday"}
]},
c9c1:{ title:"The Avalanche at Stonegate", enter(){ crisisEnter(); }, text:()=>`
<p>The work on the Stonegate pass begins on the fifth morning, with two hundred workers on the mountain. At noon, the mountain moves.</p>
<p>It starts high up, a crack like a cannon, and then the whole north face of the pass is coming down: rock and snow and old ice, a river of it, straight toward the cutting where the workers are. ${F("bandits")==="hired"?"Varga's old soldiers are in the cutting too, working beside the masons.":""}</p>
${sys("CRISIS",`[The Avalanche at Stonegate]<br>Two hundred workers in the pass`,"warn")}`,
choices:()=>[
  {label:"Raise a wall of rock across the cutting, faster than you've ever built anything.", hint:"Craft · everything you have", fx:{n_c9:S.stats.craft>=20?2:1}, go:"c9c2"},
  {label:"Split the slide with a wedge, so it goes around the cutting on both sides.", hint:"Clever · the Elder way", fx:{n_c9:2}, go:"c9c2"},
  {label:"Shout everyone into the Elder galleries in the rock.", hint:F("bandits")==="hired"||F("bandits")==="talked"?"Varga's men know the galleries":"Nobody knows the galleries", fx:{n_c9:F("bandits")==="hired"||F("bandits")==="talked"?2:1}, go:"c9c2"}
]},
c9c2:{ title:"The Second Slide", text:()=>`
<p>The first slide goes past. The cutting holds. Dust everywhere, people coughing, counting heads. And then, from higher up, a second crack. The whole upper face is hanging now, loosened by the first slide, ready to come down on all of you.</p>
<p>${CHILD()} is at the camp below, a mile away. ${CPc("sub")} can hear it. You know ${CP("sub")} can hear it.</p>`,
choices:()=>[
  {label:"Hold the upper face yourself while everyone gets out.", hint:"Craft · long", fx:{n_c9:S.stats.craft>=20?2:1, c9how:"hold"}, go:"c9c3"},
  {label:"Trust the child. Let the child sing the mountain still.", hint:F("lesson")==="stop"?"The first lesson was how to stop":"Has the child learned enough?", fx:{n_c9:F("lesson")==="stop"?2:1, c9how:"child"}, go:"c9c3"},
  {label:"Send Fen and the Realm Builders up to pin it with iron.", hint:"Iron −6", fx:{n_c9:2, iron:-6, c9how:"fen"}, go:"c9c3"}
]},
c9c3:{ title:"The Last Ones Out", text:()=>`
<p>${F("c9how")==="child"?`From a mile away, very faint, you hear ${CHILD()} singing. The lullaby. The miller and the moon. And the mountain, which has been waiting a thousand years to fall, decides it can wait a little longer.`:F("c9how")==="fen"?"Fen's crew goes up the face on ropes with iron pins as long as a man, and drives them into the stone, and the whole face groans and settles.":"You put your hands on the mountain and you hold it. It is the heaviest thing you have ever held."}</p>
<p>The workers are coming out. There are twelve still in the cutting, the furthest in.</p>`,
choices:[
  {label:"Go in for them.", hint:"Together", fx:{n_c9:2}, go:"c9c4"},
  {label:"Hold the door open and call them out one by one by name.", hint:"Slower · calmer", fx:{n_c9:1}, go:"c9c4"}
]},
c9c4:{ title:"The Pass", enter(){ const o=outcome("c9"); S.flags.c9result=o; if(o==="great") add({unity:5, renown:5}); else if(o==="good") add({unity:2, renown:3}); else add({morale:-2}); S.phase="open"; }, text:()=>`
<p>${({great:"All two hundred come out. Every one. When the dust settles, the slide has cut a clean new face on the mountain exactly where the road needs to go, as if it was trying to help.",good:"Two hundred go in. One hundred and ninety seven come out.",hard:"The mountain takes twenty. The road will go through anyway, and their names will be carved in the gallery, and every wagon that passes will read them."})[F("c9result")]}</p>
${F("c9how")==="child"?`<p>When you get back to the camp, ${CHILD()} is sitting outside the tent, very tired, with ${CP("pos")} hands in ${CP("pos")} lap. ${say(`"It was frightened,"`)} ${CP("sub")} says. ${say(`"It just wanted someone to tell it to wait."`)}</p>`:""}
${sys("CRISIS OVER",`[The pass holds]<br>${({great:"Everyone came home",good:"Three lost",hard:"Twenty lost"})[F("c9result")]} · the Realm Road goes on`)}`,
choices:[{label:"Build.", go:"c9season"}]},
c9season:{ title:"Part Two: The Road", enter(){ seasonEnter(); }, text:()=>`
<p>Five weeks. Three great stages. Every Realm Builder in the realm, and half of Aurendell's masons, and the shipwrights from Saelmar, and the northern clans, all working on one road.</p>
${sys("THE REALM ROAD",`Five weeks · build the three stages of the Realm Road<br>${nextTierText()}`)}`,
choices:[{label:"Plan the first week.", go:"plan"}]},
c9w1:{ title:"The Causeway", text:()=>`
<p>The causeway across the marshes goes down in Elder concrete that sets underwater, a mile a week, and the marsh people come out of their reed villages to watch it come. ${F("roadLine")==="child"?"It follows the line the child chose, which turns out to be the line of the Elders' own buried road, so the new causeway is built on top of the old one.":""}</p>`,
choices:[
  {label:"Give the marsh villages a station every five miles, with a well and an inn.", hint:"Unity +3 · Coin −4", fx:{unity:3, coin:-4}, go:"nextweek"},
  {label:"Put milestones the whole way, carved in both languages.", hint:"Unity +2 · Renown +2", fx:{unity:2, renown:2}, go:"nextweek"}
]},
c9w2:{ title:()=>F("child2Path")?(F("child2Path")==="expecting"?"The Second Child":"The Second Child Comes Home"):"Children of the Road", text:()=>`
${F("child2Path")==="expecting"?`<p>The second baby comes in the second week, a month early, in the middle of a rainstorm, while you are forty miles away at the causeway. You ride all night. You arrive at dawn, soaked, to find ${SPN()} asleep and ${CHILD()} sitting on the end of the bed holding the baby very carefully, singing to the little one, and every stone in the house humming along.</p>`
:F("child2Path")==="adopt"?`<p>The papers come through in the second week. You ride to Karsk and come home with a baby from the fall at Ironvale, a miner's child, a year old, who stares at everything with enormous dark eyes and doesn't cry once on the whole ride home. ${CHILD()} meets you at the gate and holds out ${CP("pos")} arms. ${say(`"Mine,"`)} ${CP("sub")} says, firmly.</p>`
:`<p>The road crews have children, and the children follow the road. By the second week there are forty of them in the camps, running between the wagons. ${CHILD()} organizes them into a gang within a day and leads them on raids against the cook tent.</p>`}`,
choices:()=>F("child2Path") ? [{label:"Hold the baby.", hint:"Name the child", go:"c9naming"}]
  : [{label:"Start a school in the camp.", hint:"Morale +2 · Unity +2", fx:{morale:2, unity:2}, go:"nextweek"},
     {label:"Let them run.", hint:"Morale +3", fx:{morale:3}, go:"nextweek"}]},
c9naming:{ title:"A Second Name", input:{placeholder:"Edric", max:18, init:()=>S.family.child2||""}, text:()=>`
<p>${CHILD()} has an opinion about the name, of course. ${say(`"Grandfather,"`)} ${CP("sub")} says. ${say(`"Name it after Grandfather. He'll pretend to hate it."`)}</p>`,
choices:[{label:"Give the baby this name.", hint:"Type it above", useInput:"child2", go:"nextweek"}]},
c9w3:{ title:"A King on the Road", text:()=>`
${F("corvinInvited")||F("c8result")==="great"?`<p>King Corvin comes to see the road in the third week, with a small escort and his daughter, who is seven and makes grass grow wherever she walks. He walks a mile of the causeway in silence. ${CHILD()} and the princess race each other to the next milestone and come back covered in mud and best friends.</p>
<p>${say(`"My father was right,"`)} Corvin says at last, very quietly. ${say(`"Don't tell anyone I said so."`)}</p>`
:`<p>Aurendell's engineers arrive in the third week with a letter from King Corvin: he will build the western half of the road to the sea, if ${RN()} builds the eastern half. It is not friendship. It is a road. Your father would have said that roads come first, and friendship follows them.</p>`}`,
choices:[
  {label:"Give the king a milestone with his father's name on it.", hint:"Renown +3 · Corvin ◆", fx:{renown:3, aff_corvin:2}, go:"nextweek"},
  {label:"Show the princess the stone flowers.", hint:"Morale +2 · a friendship that will matter", fx:{morale:2, princessFriend:true}, go:"nextweek"}
]},
c9w4:{ title:"Ostrow's Ledger", text:()=>`
<p>Chancellor Ostrow dies in the fourth week, at his desk in Velm, with his pen in his hand, in the middle of a column of figures. ${F("chancellor")?"His will leaves everything to the realm, as he promised. Every coin. It is a very great deal of money.":"His will leaves his fortune to the Bank of the Realm, and a note to you."}</p>
<p>In his desk there is one last ledger, addressed to you. It is not money. It is information: forty years of letters, payments, names. And on the last page, in his tidy hand: ${say(`"Varga is in the north of the mountains, at the old Elder observatory at Kell's Crown. He has two thousand men and he is waiting for something. I have paid him to stay there for six years. The payments stop with me. I'm sorry. Business."`)}</p>`,
choices:[
  {label:"Give Ostrow a funeral in the Accord Hall, with honors.", hint:"Unity +3 · Coin +12 from his estate", fx:{unity:3, coin:12, ostrowHonored:true}, go:"nextweek"},
  {label:"Send Tamsin's scouts north, today.", hint:"Defense +3 · Coin +8", fx:{defense:3, coin:8, vargaFound:true}, go:"nextweek"}
]},
c9w5:{ title:"The Road Opens", text:()=>`
<p>${has("realmRoad3")?"The Realm Road opens on the last day of summer.":"The Realm Road isn't finished, but the council opens what there is of it on the last day of summer anyway, because the whole realm has been waiting."} A procession goes the whole length of it, from the mountains to the sea: the council, the Realm Builders, the northern clans, the shipwrights, Aunt Hesk on a mule. ${CHILD()} rides at the front on your saddle${S.family.child2?`, and ${CHILD2()} rides in a basket on ${SPN()||"Tamsin"}'s`:""}.</p>
<p>At the sea, at Saltford, ${has("realmRoad3")?"under the great arch":"on the quay"}, ${CHILD()} gets down and puts both hands on the road and listens. ${say(`"It's happy,"`)} ${CP("sub")} says. ${say(`"It goes all the way. It likes going all the way."`)}</p>`,
choices:[{label:"Look out to sea.", hint:"Unity +4 · Renown +3", fx:{unity:4, renown:3}, go:"nextweek"}]},
c9close:{ title:"The Night Everything Woke", text:()=>`
<p>That night, at midnight, every Wonder in the world wakes up at once.</p>
<p>You feel it in your bones in your bed. The Storm Engine roars on the border. The Garden blooms in the dark, every tree at once. The Deep Forge breathes fire up its shaft. Far away, the Tide Gate rings like a bell, and the Lantern of Kell blazes so bright it lights the northern sky like dawn. And under your feet, under the manor, under Brackenfold, under the Bridge of Two Banks, something you never knew was there begins, very slowly, to turn.</p>
<p>${CHILD()} is standing in your doorway. ${say(`"They're all calling,"`)} ${CP("sub")} says. ${say(`"They're calling me."`)}</p>`,
choices:[{label:"End of Chapter Nine.", go:"summary9"}]},
summary9: chapterSummary(9, ()=>`<p>The Realm Road ${has("realmRoad3")?"runs from the mountains to the sea":"is begun, and the realm will finish it"}. ${({great:"Everyone came home from the Stonegate pass.",good:"The Stonegate pass cost three lives.",hard:"The Stonegate pass cost twenty lives, and their names are carved in the gallery."})[F("c9result")]} ${S.family.child2?`${CHILD2()} has joined the family.`:""} Ostrow is gone, and he left you a map to Varga. And every Wonder in the world is awake.</p>`, "Chapter Ten: The Keystone Crown", "c10open"),

/* ============================ CHAPTER TEN: THE KEYSTONE CROWN ============================ */
c10open:{ title:"The Keystone Crown", enter(){ chapterEnter(10); }, text:()=>`
<p>${F("ending")==="keeper"?"Wren's voice comes up through the stones of the manor floor before dawn, clear as if Wren were in the room.":"Wren comes before dawn, running, for the first time since you've known them."} ${say(`"I was wrong,"`)} ${F("ending")==="keeper"?"the voice says":"Wren says"}. ${say(`"I thought the Elders broke their Wonder into pieces so nobody could hold it. They didn't. They broke it so it could be put back together. By the right person. At the right place."`)}</p>
<p>${say(`"The pieces all lean on one stone,"`)} ${F("ending")==="keeper"?"the voice says":"Wren says"}. ${say(`"The keystone of the whole thing. It's under the river. Under the Bridge of Two Banks. It's been under your feet the whole time. That's why the Engine woke when you came here. That's why your child was born here. The Elders' crown has been waiting for a Keystone and a Cantor in the same place, at the same time."`)}</p>
<p>And then Tamsin is at the door, mud to the knees. ${say(`"Varga,"`)} she says. ${say(`"Coming south out of the mountains with everything he has. Four thousand men. He saw the Lantern light up. He knows where the heart is. He's coming for it."`)}</p>`,
choices:[
  {label:"Call every Warden in the realm to Brackenfold.", hint:"Defense +5", fx:{defense:5, c10start:"defend"}, go:"c10days"},
  {label:"Send riders to Corvin, Saelmar and the northern clans: the Accord's friends.", hint:"Renown +3 · allies may come", fx:{renown:3, c10start:"allies", calledAllies:true}, go:"c10days"},
  {label:"Go down under the bridge first, and see the heart for yourself.", hint:"Craft +2", fx:{craft:2, c10start:"heart", sawHeart:true}, go:"c10days"}
]},
c10days:{ title:"Four Days", enter(){ daysEnter(); }, text:()=>`
<p>Varga is four days away. Four days to finish whatever you are going to finish.</p>
${F("sawHeart")?`<p>Under the third pier of the Bridge of Two Banks, the very pier someone tried to cut on the day of the vote, there is a door, and behind the door a round chamber, and in the center of the chamber a single stone the size of a house, carved with every mark you have ever seen: the mason's square, the Garden's knot, the Engine's spiral, the Forge's flame. It is turning, slowly, in the air.</p>`:""}`,
choices:[{label:"Plan the first day.", go:"plan"}]},
c10d1:{ title:"Every Wonder at Once", text:()=>`
<p>The Wonders don't sleep again. Storms walk up and down the border, never quite breaking. The Garden's trees are flowering and fruiting at the same time. The river runs warm. In Karsk, the Collar Bell rings every hour by itself.</p>
<p>The realm is frightened. People come to the manor gate in crowds, not angry, just frightened, wanting to be told what is happening. Wanting you to tell them.</p>`,
choices:[
  {label:"Go out to the gate and tell them the truth.", hint:"Unity +4", fx:{unity:4}, go:"nextday"},
  {label:"Send the Listeners to every town to calm the stones.", hint:F("listeners")?"Fen trained them for this":"There are only a few", fx:{defense:F("listeners")?3:1, craft:1}, go:"nextday"},
  {label:"Ask the child to sing to the realm, once, from the bridge.", hint:"Morale +4 · the stones go quiet for a day", fx:{morale:4, sangFromBridge:true}, go:"nextday"}
]},
c10d2:{ title:"Allies", text:()=>`
${F("calledAllies")?`<p>They come. ${F("c8result")!=="hard"?"From the west, King Corvin himself at the head of a thousand Aurendell horse, his daughter's banner beside his.":"From the west, nobody. Corvin sends a letter: he will not fight for you. He will not fight against you either."} ${F("tamsin")==="realm"||F("tamsin")==="both"?"From the sea, Tamsin's ships up the river.":"From the sea, the Saelmar admirals' ships, Tamsin on the foremost."} ${F("clans")==="accord"||F("clans")==="treaty"?"From the north, the mountain clans, who know exactly where Varga is.":""} ${F("c5how")==="kade"?"And from the south, flying a white sail with a laughing face painted on it, Absalom Kade.":""}</p>`
:`<p>You didn't send for anyone. They come anyway, in ones and twos: Ruslan with every smith in Karsk, Aunt Hesk with the highlanders and their crooks, the Realm Builders from every lodge in the realm with picks over their shoulders. ${say(`"You built our roads,"`)} Ruslan says. ${say(`"We came down them."`)}</p>`}`,
choices:[
  {label:"Put the allies on the bridge, and the Builders on the banks.", hint:"Defense +3", fx:{defense:3, n_c10:1}, go:"nextday"},
  {label:"Have the Builders raise earthworks on the north road overnight.", hint:"Defense +2 · Stone −8", req:()=>S.stats.stone>=8, fx:{defense:2, stone:-8, n_c10:1, earthworks:true}, go:"nextday"}
]},
c10d3:{ title:"The Child Sings", text:()=>`
<p>${CHILD()} won't eat. ${CPc("sub")} sits on the manor steps all day with ${CP("pos")} hands on the stone, listening. ${SPN()?`${SPN()} sits beside ${CP("obj")} and doesn't try to make ${CP("obj")} come in.`:""}</p>
<p>${say(`"They want me to wake them all the way,"`)} ${CHILD()} says, when you sit down too. ${say(`"All of them at once. They want to be one thing again. They say I could. They say I'm the only one who ever could."`)} ${CPc("sub")} looks up at you. ${say(`"I don't know if I want to."`)}</p>`,
choices:[
  {label:`"You don't have to decide anything. That's my job."`, hint:"Morale +2", fx:{morale:2, c10talk:"mine"}, go:"nextday"},
  {label:`"Whatever we decide, we decide together."`, hint:"Morale +3 · the child holds your hand", fx:{morale:3, c10talk:"together"}, go:"nextday"},
  {label:`"What do you think they should be?"`, hint:"The child thinks for a long time", fx:{morale:2, craft:1, c10talk:"ask"}, go:"nextday"}
]},
c10d4:{ title:"The Night Before", text:()=>`
<p>On the last night, everyone eats together in the great hall of the manor, under the portrait${F("portrait")?" of your father with the child on his knee":""}: Fen and Lise, Tamsin, Marren, Ruslan, Aunt Hesk, Bren who is very old now and has been asleep in his chair since the soup, and your father at the head of the table, because nobody would dream of putting him anywhere else. ${F("serenStays")?"Seren, who refused to go home.":""} ${S.family.child2?`${CHILD2()} asleep in a basket by the fire.`:""}</p>
<p>Fen raises a glass at the end. ${say(`"To the Keystone,"`)} he says. ${say(`"Who taught a whole kingdom to build. Whatever happens tomorrow, that stays built."`)}</p>`,
choices:[
  {label:"Raise yours back: to the Realm Builders.", hint:"Unity +3", fx:{unity:3, n_c10:1}, go:"nextday"},
  {label:"Raise it to your father.", hint:"Morale +3", fx:{morale:3, n_c10:1}, go:"nextday"}
]},
c10c1:{ title:"The Battle of the Two Banks", enter(){ crisisEnter(); }, text:()=>`
<p>Varga comes down the north road at dawn with four thousand men, black and silver, under the old banner of Kastrel. He has no king now. He doesn't need one. He rides at the front on a black horse, white haired, huge, and his eyes still have a little of the Lantern's light in them.</p>
<p>${S.stats.defense>=30?"The realm is ready for him.":"The realm is as ready as it can be."} ${F("earthworks")?"The Builders' earthworks run across the north road like a dam.":""}</p>
${sys("CRISIS",`[The Keystone Crown]<br>Varga marches on the heart of the realm`,"warn")}`,
choices:()=>[
  {label:"Hold the north road.", hint:`Defense ${S.stats.defense} · decides it`, fx:{n_c10:S.stats.defense>=35?2:S.stats.defense>=24?1:0}, go:"c10c2"},
  {label:"Let every Listener in the realm make the ground itself rise against them.", hint:F("listeners")?"Fen trained them":"Craft decides", fx:{n_c10:F("listeners")?2:S.stats.craft>=22?2:1}, go:"c10c2"},
  {label:"Ride out and talk to his men. Some of them were farm boys once.", hint:"Unity decides", fx:{n_c10:S.stats.unity>=80?2:1, talkedToMen:true}, go:"c10c2"}
]},
c10c2:{ title:"Under the Bridge", text:()=>`
<p>${F("talkedToMen")?"Half of Varga's army stops on the north road and sits down, the way the soldiers in the highland meadow did years ago, and watches the soup pots.":"The line holds on the north road, and then it bends, and then it holds again."} But Varga is not with his army. He never meant to fight. While the battle was on the road, he came down the river at night in a black boat, with fifty men, and he is under the bridge.</p>
<p>You run. ${CHILD()} runs with you; you can't stop ${CP("obj")}; the stones are calling.</p>`,
choices:()=>[
  {label:"Take the child's hand and go in together.", hint:"Together", fx:{n_c10:2, heartTogether:true}, go:"c10c3"},
  {label:`Leave the child with ${SPN()||"Fen"} at the door, and go in alone.`, hint:"Safer for the child", fx:{n_c10:1}, go:"c10c3"}
]},
c10c3:{ title:"The Heart", text:()=>`
<p>The great stone at the heart of the realm is turning faster now, and glowing, and every mark carved into it is lit. Varga stands before it with both hands on it, the way he held the Lantern. He is very old. He is shaking. The light is going into him and through him and it is far too much.</p>
<p>${say(`"I can feel all of it,"`)} he says, not looking around. ${say(`"Every Wonder. Every storm. Every forge. Mason, I could remake the whole world."`)} He laughs, and blood runs from his nose. ${say(`"But it won't let me. It's waiting for someone. It keeps saying a word I don't know."`)}</p>
<p>${CHILD()}, ${F("heartTogether")?"at your side":"who has followed you in after all"}, says softly: ${say(`"Cantor."`)}</p>`,
choices:[
  {label:"Pull Varga away from the stone before it kills him.", hint:"Mercy", fx:{n_c10:2, varga:"saved"}, go:"c10choice"},
  {label:"Let the stone decide.", hint:"Varga has made his choices", fx:{n_c10:1, varga:"stone"}, go:"c10choice"}
]},
c10choice:{ title:"The Keystone Crown", enter(){ const o=outcome("c10"); S.flags.c10result=o; S.phase="open"; }, text:()=>`
