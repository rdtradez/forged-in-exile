<p>${F("varga")==="saved"?`You drag Varga off the stone and he falls, and lies on the floor of the chamber looking up at you with ordinary eyes, all the light gone out of them. ${say(`"A mason,"`)} he whispers. ${say(`"They sent a mason."`)} He closes his eyes. He is still breathing. Tamsin's people take him out.`:`The stone decides. The light goes through Varga one last time, and when it is gone, so is he: only his coat on the floor, and a little dust, and an old silver ring with the arms of Kastrel.`}</p>
<p>${({great:"Outside, the battle is over. Varga's army has laid down its banners on the north road, and the realm has lost almost no one.",good:"Outside, the battle is over. It cost the realm dearly, but it held.",hard:"Outside, the battle is over, and it cost more than any day in the realm's history."})[F("c10result")]}</p>
<p>And now there is only the stone, turning, waiting, and the two of you. The Keystone and the Cantor. Every Wonder in the world is listening. You can feel all of them, and you understand at last what the Elders built: a crown. Not for a head. For the world. Whoever closes it decides what it is for.</p>
<p>${CHILD()} looks up at you. ${F("c10talk")==="together"?say(`"Together,"`)+" "+CP("sub")+" says. "+say(`"You said."`):F("c10talk")==="ask"?say(`"I thought about it,"`)+" "+CP("sub")+" says. "+say(`"I think they should be for everyone."`):say(`"What do we do?"`)}</p>`,
choices:()=>[
  {label:"Wake it all the way, and give it to the world: every Wonder working for every kingdom.", hint:S.stats.unity>=75?"The Open Hand":"Needs a realm united enough to trust it (Unity 75)", req:()=>S.stats.unity>=75, fx:{book2end:"open"}, go:"end10open"},
  {label:"Let the child sing every Wonder to sleep, forever.", hint:"The Quiet Stone", fx:{book2end:"quiet"}, go:"end10quiet"},
  {label:"Close it, and make it wait until the child is grown and can choose.", hint:"The Heir of Stone", fx:{book2end:"heir"}, go:"end10heir"},
  {label:"Become its keeper yourself: the Keystone in the crown, holding it all together.", hint:"The Living Keystone", fx:{book2end:"living"}, go:"end10living"}
]},
end10open:{ title:"The Open Hand", text:()=>`
<p>You put your hand on the great stone, and ${CHILD()} puts ${CP("pos")} hand beside yours, and ${CP("sub")} sings, and you hold, and the Elders' crown wakes up all the way for the first time in a thousand years.</p>
<p>It doesn't roar. It sighs, the way a building sighs when the last stone goes into an arch and everything settles. And then, across the world, every Wonder turns outward. The Storm Engine sends rain to Orsenne's burned hills. The Tide Gate breathes for every harbor on the southern sea. The Deep Forge's heat runs through the iron hills to warm villages that have never had a winter fire. The mirror in Orsenne turns away from the sun.</p>
<p>And every kingdom that has one of the pieces finds, the next morning, that it can only use it if it asks the others.</p>
${sys("ENDING",`[THE OPEN HAND]<br>The Elders' crown is awake, and belongs to everyone · ${RN()} becomes the meeting place of the world`)}`,
choices:[{label:"Afterward.", go:"c10epilogue"}]},
end10quiet:{ title:"The Quiet Stone", text:()=>`
<p>${CHILD()} sings the lullaby. The miller and the moon. Not to the great stone only, but through it, to every piece: the Engine, the Garden, the Forge, the Gate, the Lantern, the mirror in Orsenne, and others you never knew about, under deserts and seas and ice.</p>
<p>One by one, all over the world, they go to sleep. Not the old restless sleep. A real one. You can feel them settle like children after a long day.</p>
<p>The great stone stops turning. It is just a stone now, a very large one, under a bridge. ${CHILD()} yawns enormously and falls asleep in your arms.</p>
${sys("ENDING",`[THE QUIET STONE]<br>Every Wonder sleeps · the world will have to build its own wonders now, the slow way, the way you taught it`)}`,
choices:[{label:"Afterward.", go:"c10epilogue"}]},
end10heir:{ title:"The Heir of Stone", text:()=>`
<p>You close it. Not to sleep: to wait. You and ${CHILD()} together, hands on the stone, telling the crown: not yet. Not us. Not now. Wait for ${CP("obj")} to grow up. Let ${CP("obj")} choose, when ${CP("sub")} knows what ${CP("sub")} is choosing.</p>
<p>The crown listens. The great stone slows, and settles, and its light goes down to a single steady glow at its heart, like a lamp left in a window for someone coming home late. Across the world, the Wonders go quiet, and wait with it.</p>
<p>${CHILD()} looks at the light for a long time. ${say(`"Will it wait for me?"`)} ${CP("sub")} asks. ${say(`"As long as it takes,"`)} you say.</p>
${sys("ENDING",`[THE HEIR OF STONE]<br>The Elders' crown waits for ${CHILD()} to grow up · Book Three belongs to the child`)}`,
choices:[{label:"Afterward.", go:"c10epilogue"}]},
end10living:{ title:"The Living Keystone", text:()=>`
<p>You send ${CHILD()} out of the chamber, to ${SPN()||"Fen"}, at the door. Then you put both hands on the great stone and take the weight of it.</p>
<p>All of it. Every Wonder, every storm, every forge, every tide, held together in you, the way a keystone holds an arch: not by strength, but by being in exactly the right place. It doesn't kill you. It isn't the Engine; it doesn't want to swallow anyone. It just wants someone to lean on.</p>
<p>When you walk out of the chamber at dawn, you are still yourself. But you can feel the whole world, faintly, the way you once felt the grain of a cracked axle, and you will be able to for the rest of your life. You will never quite be alone again. You find you don't mind.</p>
${sys("ENDING",`[THE LIVING KEYSTONE]<br>You hold the Elders' crown together · every Wonder leans on you, and is gentle`)}`,
choices:[{label:"Afterward.", go:"c10epilogue"}]},
c10epilogue:{ title:"Epilogue: The Realm of Two Banks", text:()=>`
<p>${F("book2end")==="open"?"A year later, the first Congress of Wonders meets in the Keystone Hall: envoys from eleven kingdoms, some of which you had never heard of, sitting at a round table with no head.":F("book2end")==="quiet"?"A year later, the realm is quieter. The storms are only storms. The forge in Karsk burns coal again. Nobody minds as much as they expected.":F("book2end")==="heir"?`A year later, the light under the bridge is still glowing, steady, and ${CHILD()} goes down to visit it every week, and tells it about school.`:"A year later, you still feel the world turning under your hands when you close your eyes. It is a good feeling. Like holding someone's hand in the dark."}</p>
<p>${RN()} has ${pop().toLocaleString()} people in ${alive().length} settlements, joined by ${S.roads.length} roads${S.paved.length?` and ${S.paved.length} highways`:""}${has("realmRoad3")?", and one Realm Road from the mountains to the sea":""}. The manor stands ${({hill:"on the hill above Brackenfold",island:"on the river island under the Bridge of Two Banks",garden:"at the edge of the Garden"})[F("manorSite")||"hill"]}, ${manorStage()}, and ${has("manorGate")?"its great gate has no doors":"its doors are always open"}.</p>
<p>${SPN()?`${SPN()} is reading in the library.`:""} ${kidLine()} ${S.family.child2?"are":"is"} in the garden by the stone rose and your father, who is asleep on his bench in the sun with a book about bridges open on his chest, ${S.family.child2?"arguing about":"building"} something out of stones that hums. Fen is running the Realm Builders and complaining about it. Marren is still First Speaker, and says she will retire every spring, and never does.</p>
<p>And you are on the manor roof, where you go to think, looking out at the whole realm: both banks, every road, every light. A kingdom that started as a punishment, in a dying village, with the magic everyone said was worthless.</p>
<p>It is very good work.</p>`,
choices:[{label:"End of Book Two.", go:"summary10"}]},
summary10: chapterSummary(10, ()=>`<p>${({open:"The Open Hand: the Elders' crown is awake and shared with the world.",quiet:"The Quiet Stone: every Wonder sleeps, and the world builds its own.",heir:"The Heir of Stone: the crown waits for "+CHILD()+".",living:"The Living Keystone: you hold the world's Wonders together, gently."})[F("book2end")||"quiet"]} Varga ${F("varga")==="saved"?"lives, in a quiet room in Northwatch, and sometimes asks to see the child":"is gone"}. ${RN()} is ${realmTier().name}.</p>
<p>Thank you for building it.</p>`, null, null)
});

/* ================================================================
   WHAT YOU BUILT MATTERS: each crisis offers extra choices when the realm
   has the right works in place, and the final battle counts everything.
   ================================================================ */
function addOptions(id, extra){ const sc=SCENES[id], orig=sc.choices; sc.choices=()=>[...extra().map(o=>({...o, cls:(o.cls||"")+" built-pays"})), ...val(orig)]; }

addOptions("c2c2", ()=>[
  ...(has("wardensCitadel")?[{label:"Send in the Wardens from the Citadel, trained for exactly this.", hint:"Because you built the Wardens' Citadel", fx:{n_c2:3}, go:"c2c3"}]:[]),
  ...(has("capitalWalls")&&!has("wardensCitadel")?[{label:"Pull the highland families back behind Brackenfold's new walls while Tamsin holds the meadow.", hint:"Because you built the capital's walls", fx:{n_c2:2}, go:"c2c3"}]:[])
]);
addOptions("c4c1", ()=>[
  ...(has("lm:stonegate")||has("lm:ironvale")?[{label:has("lm:stonegate")?"Bring the Stonegate cranes up the valley to lift the fallen beams.":"Use the Ironvale smelters' bellows to blow fresh air into the gallery.", hint:has("lm:stonegate")?"Because you built the Stonegate cranes":"Because you built the Ironvale smelters", fx:{n_c4:3}, go:"c4c2"}]:[])
]);
addOptions("c5c2", ()=>[
  ...(has("realmFleet")?[{label:"Signal the realm's own ships, waiting outside the Gate.", hint:"Because you built the realm's first ships", fx:{n_c5:3, c5how:"ships"}, go:"c5c3"}]:[])
]);
addOptions("c6c1", ()=>[
  ...(S.lv.northwatch>=3||has("lm:northwatch")?[{label:`March from the fortress at Northwatch${pavedTo("northwatch")?", down the paved highway":""}, rested and supplied.`, hint:"Because you built up Northwatch", fx:{n_c6:pavedTo("northwatch")?3:2}, go:"c6c2"}]:[]),
  ...(has("wonderWatch")||has("keystoneAcademy")?[{label:"Let the Listeners find the one weak stone in the fortress foundations.", hint:has("keystoneAcademy")?"Because you founded the Keystone Academy":"Because you raised the Wonder Watch", fx:{n_c6:2}, go:"c6c2"}]:[])
]);
addOptions("c7c1", ()=>[
  ...(has("manorSongRoom")?[{label:"Carry the child down into the singing room, where the old stone can't be woken.", hint:"Because you built the singing room", fx:{n_c7:3, humTogether:true}, go:"c7c2"}]:[]),
  ...(has("sparkSchool")?[{label:"Call the Spark School children. Let them sing with the child, so the song is shared.", hint:"Because you founded the Spark School", fx:{n_c7:2}, go:"c7c2"}]:[])
]);
addOptions("c8c3", ()=>[
  ...(has("royalMint")||has("realmBank")?[{label:`"A trade treaty: our coin and yours, one value, both banks of the border."`, hint:"Because you built the "+(has("royalMint")?"Royal Mint":"Bank of the Realm"), fx:{n_c8:2, c8end:"road"}, go:"c8c4"}]:[])
]);
addOptions("c9c1", ()=>[
  ...(has("lm:stonegate")?[{label:"Swing the Stonegate cranes over the cutting and lift the workers out.", hint:"Because you built the Stonegate cranes", fx:{n_c9:3}, go:"c9c2"}]:[]),
  ...(has("mineShoring")?[{label:"Get everyone under the Elder arches you shored the mines with.", hint:"Because you shored the mines", fx:{n_c9:2}, go:"c9c2"}]:[])
]);
/* the final battle counts everything that was built to hold the realm */
function warChest(){
  const out=[];
  const g=specCount("garrison"); if(g) out.push([`${g} garrison cit${g>1?"ies":"y"}`, Math.min(3,g)]);
  if(has("wardensCitadel")) out.push(["the Wardens' Citadel",2]);
  if(has("capitalWalls")) out.push(["Brackenfold's walls",1]);

function choose(c){
  if(c.restart){ const m=S.mode; S=START(); S.mode=m; for(let i=1;i<=10;i++) lsDel(cpKey(SLOT,i)); return render(); }
  S.surgeMsg="";
  if(c.work){
    if(F("surgeNext")) S.surgeMsg=sys("KEYSTONE SURGE",`[${val(W[c.work].name)}]<br>Raised without a single stone from the stores.`);
    doWork(c.work); S.buildsLeft--; S.scene="built"; S.builtBy="you"; return render();
  }
  if(c.guild){ guildDo(c.guild); S.scene="built"; S.builtBy="guild"; S.buildsLeft=S.buildsLeft; return render(); }
  if(c.petition){ petitionDo(c.petition); S.scene="built"; S.builtBy="town"; return render(); }
  if(c.toggleMore){ S.showMore=!S.showMore; S.keepScroll=true; return render(); }
  if(c.toggleLocked){ S.showLocked=!S.showLocked; S.keepScroll=true; return render(); }
  if(c.surge){ S.flags.surgeNext=true; S.flags.surgeKey=`${S.chapter}-${S.phase}`; S.keepScroll=true; return render(); }
  if(c.trade){ add(c.trade); S.keepScroll=true; return render(); }
  if(c.reserve){ drawReserve(c.reserve); S.keepScroll=true; sfx("build"); return render(); }
  if(c.skip){ S.buildsLeft=0; c={go:"event"}; }
  if(c.useInput){
    const el=document.getElementById("sceneInput"); const v=(el&&el.value||"").trim().replace(/\s+/g," ");
    if(c.useInput==="realmName") S.realmName = v || "Riverland";
    if(c.useInput==="child") S.family.child = v || null;
    if(c.useInput==="child2") S.family.child2 = v || "Edric";
  }
  if(c.setRealm) S.realmName=c.setRealm;
  if(c.fx) add(c.fx);
  if(c.then) c.then();
  if(F("familyPath")) S.family.path=F("familyPath");
  let go=c.go;
  const C=CH[S.chapter];
  if(go==="event") go = S.phase==="season" ? C.weeks[S.week] : C.days[S.day];
  if(go==="nextday"){ daily(); S.day++; S.buildsLeft=perDay(); go = S.day>C.dayLen ? C.afterDays : "plan"; }
  if(go==="nextweek"){ weekly(); S.week++; S.buildsLeft=perWeek(); go = S.week>C.weekLen ? C.afterWeeks : "plan"; }
  S.scene=go;
  const sc=SCENES[S.scene];
  if(sc&&sc.enter) sc.enter();
  if(OPEN_OF[S.scene]) saveCheckpoint(OPEN_OF[S.scene]);
  S.newMarks = /^summary/.test(S.scene) ? awardMarks() : null;
  render();
}

let rmN=0;
function hullOf(pts){
  pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); if(pts.length<3) return pts;
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[],up=[];
  for(const p of pts){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for(const p of pts.slice().reverse()){ while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  return lo.slice(0,-1).concat(up.slice(0,-1));
}

const GICON = {road:"═", found:"✦", grow:"▲", great:"◆", manor:"⌂", idle:"…", town:"★", landmark:"◆", pave:"═"};
function townCard(){

function guildCard(){
  const g=S.guildLast; if(!F("realmGuild")||!g) return "";
  if(g.ch!==undefined && (g.ch!==S.chapter || g.phase!==S.phase)) return "";   // only this part of this chapter
  return `<section class="guild" aria-label="Realm Builders report">
    <div class="guild-head"><span>Realm Builders${F("guildFocus")?` · ${({roads:"Garth",growth:"Fen",east:"Ruslan"})[F("guildFocus")]}`:""}</span><span>${g.when}</span></div>

let toastTimer=null;
function guildToast(){
  if(S.scene!=="plan"){ const t0=document.getElementById("toast"); if(t0) t0.className=""; }
  const g=S.guildLast; if(!g || S.guildSeen || S.scene!=="plan") return;
  S.guildSeen=true;
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  if(g.ch!==undefined && (g.ch!==S.chapter || g.phase!==S.phase)) return;
  const idle = g.ent.length===1 && g.ent[0].kind==="idle";
  t.innerHTML=`<b>${idle?"The Realm Builders: "+g.ent[0].what.toLowerCase():"The Realm Builders finished"}</b>${g.ent.filter(e=>e.kind!=="idle").map(e=>`<span>${GICON[e.kind]} ${e.what}</span>`).join("")}<small>Tap to close</small>`;
  t.className="show"; t.onclick=()=>{ t.className=""; };
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.className=""; }, 6500);
  if(!idle) sfx("build");
}

function drawChapters(){
  const ROM=["I","II","III","IV","V","VI","VII","VIII","IX","X"];
  const done = n => n < S.chapter || (n===S.chapter && /^summary/.test(S.scene));
  document.getElementById("chaptersBox").innerHTML=`<div class="sheet chapters"><h3>BOOK TWO · TEN CHAPTERS</h3>${BOOK_TWO.map((c,ix)=>{
    const st = S.scene==="title" ? "Ahead" : done(c.id) ? "Complete" : c.id===S.chapter ? "Playing" : "Ahead";
    return `<div class="chap ${c.id===S.chapter?"now":""} ${c.id>S.chapter?"soon":""}"><div class="chap-n">${ROM[ix]}</div>
      <div class="chap-body"><b>${c.t}</b><span>${c.season} · ${st}</span><p>${c.line}</p>${c.id<=S.chapter&&hasCheckpoint(c.id)&&S.scene!=="title"?`<button type="button" class="ghost replay" data-replay="${c.id}">Replay from the start of this chapter</button>`:""}</div></div>`;}).join("")}</div>`;
  document.querySelectorAll("#chaptersBox [data-replay]").forEach(b=>b.onclick=()=>{
    if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent="Tap again: this replaces your progress in this slot"; return; }
    const id=+b.dataset.replay; let d=null; try{ d=JSON.parse(lsGet(cpKey(SLOT,id))); }catch(e){} if(!d) return;
    S=fixSave(d); S.scene=CH[id].open; S.newMarks=null; closePanels(); render(); });
}
const cpKey = (n,id) => `fie2_cp_${n}_${id}`;
function saveCheckpoint(id){ lsSet(cpKey(SLOT,id), JSON.stringify(S)); }
function hasCheckpoint(id){ return !!lsGet(cpKey(SLOT,id)); }
function drawSaves(){
  const box=document.getElementById("savesBox");
  const line=n=>{ const d=readSlot(n); if(!d) return {empty:true,line:"Empty"}; return {empty:false, line:`${esc(d.name||"Unnamed")} · ${d.scene==="title"?"Not started":`Chapter ${CH_WORD[d.chapter||1]}${d.phase==="season"?` · week ${d.week}`:d.day?` · day ${d.day}`:""}`} · ${d.mode==="builder"?"Builder":"Story"}`}; };
  box.innerHTML=`<div class="sheet"><h3>SAVES · BOOK TWO · EACH SLOT AUTOSAVES</h3>${Array.from({length:SLOTS},(_,i)=>{ const n=i+1, info=line(n), act=n===SLOT;
    return `<div class="slot ${act?"now":""}"><div class="slot-info"><b>Slot ${n}${act?" · playing":""}</b><span>${info.line}</span></div>
      <div class="slot-btns">${act?"":`<button type="button" class="ghost" data-slot="play" data-n="${n}">${info.empty?"New story":"Play"}</button>`}
      ${info.empty||act?"":`<button type="button" class="ghost" data-slot="clear" data-n="${n}">Clear</button>`}</div></div>`;}).join("")}
    <div class="slot-new"><button type="button" class="ghost" data-slot="restart">Start Book Two again in this slot</button>
    <span class="note">Book One saves are kept separately and are never changed.</span></div></div>`;
  box.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.slot, n=+b.dataset.n;
    if((a==="clear"||a==="restart") && !b.dataset.armed){ b.dataset.armed="1"; b.textContent="Tap again to confirm"; return; }
    if(a==="play"){ save(); SLOT=n; lsSet("fie2_active",String(n)); S=readSlot(n)||START(); closePanels(); render(); }
    if(a==="clear"){ lsDel(slotKey(n)); for(let i=1;i<=10;i++) lsDel(cpKey(n,i)); drawSaves(); }
    if(a==="restart"){ const m=S.mode; S=START(); S.mode=m; for(let i=1;i<=10;i++) lsDel(cpKey(SLOT,i)); closePanels(); render(); }
  });
}
function refreshPanels(){
  if(!document.getElementById("chaptersBox").hidden) drawChapters();

  if(!document.getElementById("savesBox").hidden) drawSaves();

  const m=document.getElementById("mapBox");
  if(!m.hidden) m.innerHTML = S.scene!=="title" ? realmSVG()+(F("manorSite")?`<div style="height:12px"></div>`+manorSVG():"") : `<div class="sheet"><div class="note">Begin Book Two first.</div></div>`;
}
function toggle(btnId,boxId){ const box=document.getElementById(boxId), b=document.getElementById(btnId); box.hidden=!box.hidden; b.setAttribute("aria-pressed",!box.hidden); refreshPanels(); }
function closePanels(){
  ["mapBox","sheetBox","chaptersBox","marksBox","savesBox"].forEach(id=>{ const el=document.getElementById(id); if(el) el.hidden=true; });
  ["btnMap","btnStats","btnChapters","btnMarks","btnSaves"].forEach(id=>{ const el=document.getElementById(id); if(el) el.setAttribute("aria-pressed","false"); });

const CAST_MATCH = [
  ["edric",/\b(Lord Edric|your father|Father)\b/], ["aurel",/\bAurel\b/], ["pell",/\bGranny Pell\b/], ["tobin",/\bTobin\b/],
  ["bren",/\bBren\b/], ["fen",/\bFen\b/], ["wren",/\bWren\b/], ["tamsin",/\bTamsin\b/], ["seren",/\bSeren\b/],
  ["caelan",/\bCaelan\b/], ["isolde",/\bIsolde\b/], ["oda",/\bOda\b/], ["garth",/\bGarth\b/], ["marisol",/\bMarisol\b/],
  ["quill",/\bQuill\b/], ["hale",/\bHale\b/], ["morrow",/\bMorrow\b/], ["vane",/\bVane\b/], ["marren",/\bMarren\b/],
  ["ostrow",/\bOstrow\b/], ["ruslan",/\bRuslan\b/], ["hesk",/\bAunt Hesk\b/], ["varga",/\b(Varga|the Duke)\b/], ["corvin",/\bCorvin\b/], ["aldric",/\b(King Aldric|Aldric)\b/], ["kade",/\bKade\b/], ["duskin",/\bDuskin\b/], ["moro",/\b(Yselde|Moro)\b/], ["lise",/\bLise\b/], ["nell",/\bNell\b/], ["halla",/\bHalla\b/], ["adeline",/\bAdeline\b/]
];
function castIn(html){
  const t=String(html).replace(/<[^>]+>/g," ");
  return CAST_MATCH.map(([id,re])=>{ const m=t.match(re); return m?[id,m.index]:null; }).filter(Boolean)
    .sort((a,b)=>a[1]-b[1]).slice(0,3).map(x=>x[0]);
}

function castStrip(html){
  if(NO_CAST.includes(S.scene)) return "";
  const ids=castIn(html); if(!ids.length) return "";
  return `<div class="cast">${ids.map(id=>`<figure>${portrait(id)}<figcaption>${CAST[id].n}</figcaption></figure>`).join("")}</div>`;
}

  if(S.phase==="crisis") return "storm";
  if(/^(arrival|naming|grandfather|c7open|c7song|c10heart|end10|c8father|c8last)/.test(S.scene)) return "dream";
  if(F("away")||/^(d2tolls|accord1|accord2|voteEnd|d5ostrow|c8open|c8d)/.test(S.scene)) return "court";
  if(F("winter")) return "winter";
  if(S.chapter===5) return "sea";
  return "hearth";
}
function audioInit(){
  if(AUDIO.ctx) return true;
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return false;
  try{ AUDIO.ctx=new C(); }catch(e){ return false; }
  AUDIO.master=AUDIO.ctx.createGain(); AUDIO.master.gain.value=.55; AUDIO.master.connect(AUDIO.ctx.destination);
  AUDIO.music=AUDIO.ctx.createGain(); AUDIO.music.gain.value=.32;
  const lp=AUDIO.ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1800;
  AUDIO.music.connect(lp); lp.connect(AUDIO.master);
  return true;
}
function note(freq, dur, opt={}){
  const a=AUDIO.ctx, t=a.currentTime+(opt.at||0), o=a.createOscillator(), g=a.createGain();
  o.type=opt.type||"sine"; o.frequency.value=freq;
  const v=opt.vol||.2, att=opt.attack||.01;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(opt.bus||AUDIO.master); o.start(t); o.stop(t+dur+.05);
}
function noise(dur, opt={}){
  const a=AUDIO.ctx, len=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,opt.decay||3);
  const s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter();
  f.type=opt.filter||"bandpass"; f.frequency.value=opt.freq||1200; g.gain.value=opt.vol||.3;
  s.buffer=buf; s.connect(f); f.connect(g); g.connect(AUDIO.master); s.start(a.currentTime+(opt.at||0));
}
function sfx(kind){
  if(!AUDIO.on||!AUDIO.ctx) return;
  if(kind==="build"){ noise(.12,{freq:900,vol:.35}); note(110,.25,{type:"triangle",vol:.25}); noise(.1,{freq:1400,vol:.25,at:.18}); note(98,.2,{type:"triangle",vol:.18,at:.18}); }
  if(kind==="turn"){ noise(.08,{freq:2600,vol:.06,decay:2}); }
  if(kind==="system"){ note(880,.5,{vol:.08}); note(1318.5,.6,{vol:.06,at:.06}); }
  if(kind==="chapter"){ [0,4,7,12].forEach((s,i)=>note(261.63*Math.pow(2,s/12),1.4,{vol:.12,at:i*.14,type:"triangle"})); }
  if(kind==="mark"){ [0,7,12,16,19].forEach((s,i)=>note(523.25*Math.pow(2,s/12),1.1,{vol:.08,at:i*.09})); }
  if(kind==="drum"){ note(55,.9,{type:"sine",vol:.45,attack:.005}); noise(.4,{filter:"lowpass",freq:200,vol:.3}); }
}
function musicTick(){
  if(!AUDIO.on||!AUDIO.ctx) return;
  const M=MOODS[AUDIO.mood||"hearth"], a=AUDIO.ctx; AUDIO.step++;
  const hz=s=>M.root*Math.pow(2,s/12);
  if(AUDIO.step%4===1) M.pad.forEach(s=>note(hz(s)/2, M.beat*4.2, {vol:.05, attack:1.2, bus:AUDIO.music}));
  if(Math.random()<.72){ const s=M.scale[Math.floor(Math.random()*M.scale.length)]+(Math.random()<.3?12:0); note(hz(s), M.beat*1.6, {type:"triangle", vol:.07, attack:.02, bus:AUDIO.music}); }
  if(AUDIO.mood==="storm" && AUDIO.step%2===0) note(hz(0)/4, .7, {vol:.18, attack:.005, bus:AUDIO.music});
  clearTimeout(AUDIO.timer); AUDIO.timer=setTimeout(musicTick, M.beat*1000);
}
function setSound(on){
  AUDIO.on=on; lsSet("fie_sound", on?"on":"off");
  const b=document.getElementById("btnSound"); if(b){ b.setAttribute("aria-pressed", on); b.textContent = on ? "Sound on" : "Sound off"; }
  if(on){ if(!audioInit()) return; if(AUDIO.ctx.state==="suspended") AUDIO.ctx.resume(); AUDIO.mood=curMood(); clearTimeout(AUDIO.timer); musicTick(); }
  else { clearTimeout(AUDIO.timer); if(AUDIO.ctx) AUDIO.ctx.suspend(); }
}
function audioOnRender(html){
  if(!AUDIO.on||!AUDIO.ctx) { AUDIO.lastScene=S.scene; return; }
  const m=curMood(); if(m!==AUDIO.mood){ AUDIO.mood=m; }
  if(S.scene!==AUDIO.lastScene){
    if(S.scene==="built") sfx("build");
    else if(/^summary/.test(S.scene)) { sfx("chapter"); if(S.newMarks&&S.newMarks.length) setTimeout(()=>sfx("mark"),900); }
    else if(S.scene==="prologue"||S.scene==="seasonOpen") sfx("chapter");
    else if(m==="storm" && AUDIO.lastScene && !/^vote/.test(AUDIO.lastScene)) sfx("drum");
    else if(String(html).includes('class="sys')) sfx("system");
    else sfx("turn");
  }
  AUDIO.lastScene=S.scene;
}
document.addEventListener("visibilitychange", ()=>{ if(!AUDIO.ctx) return; if(document.hidden){ clearTimeout(AUDIO.timer); AUDIO.ctx.suspend(); } else if(AUDIO.on){ AUDIO.ctx.resume(); musicTick(); } });
/* ------------------------- INSTALLABLE APP ------------------------- */
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
let installEvt=null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installEvt=e; document.getElementById("btnInstall").hidden=false; });
document.getElementById("btnInstall").onclick=async()=>{ if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(()=>{}); installEvt=null; document.getElementById("btnInstall").hidden=true; };
window.addEventListener("appinstalled", ()=>{ document.getElementById("btnInstall").hidden=true; });

/* ======================= BOOT ======================= */
if(AUDIO.on){ const b=document.getElementById("btnSound"); if(b){ b.textContent="Sound on"; b.setAttribute("aria-pressed","true"); } }
render();
</script>
