  ${F("surgeNext")?sys("KEYSTONE SURGE","[Primed]<br>Your next work costs nothing"):""}
  <p class="chapter">${S.buildsLeft} work${S.buildsLeft===1?"":"s"} left ${S.phase==="season"?"this week":"today"}</p>`;
}
function builtText(){
  const w=W[S.lastBuilt];
  const msg = w.kind==="road" ? `<p>${w.bridge?`A bridge goes up over the river between ${SITES[w.a].name} and ${SITES[w.b].name}, Elder arches on concrete piers, the kind that will stand for a thousand years if nobody cuts into them.`:`A road is laid from ${SITES[w.a].name} to ${SITES[w.b].name}: a deep bed of rubble, then gravel, then fitted stone with a crown in the middle so the rain runs off. The Elders built roads like this across half a continent.`}</p>`
    : w.kind==="found" ? `<p>${SITES[w.site].name} is founded: a well, a meeting house, the first dozen homes, and a cart track that is already being argued about.</p>`
    : w.kind==="grow" ? `<p>${SITES[w.site].name} grows into a ${LVL_NAME[S.lv[w.site]].toLowerCase()}. ${["","",`New streets, a second well, a market day.`,`A town wall with open gates, a guild lodge, and a square with a fountain.`,`A city: paved streets, a hall, an Elder aqueduct bringing water from the hills.`,`A great city: seven hundred people, three markets, a university someone is already arguing about, and lamps on every street at night.`][S.lv[w.site]]}</p>`
    : val(w.after)||"";
  return `${S.surgeMsg||""}${msg}${w.kind==="manor"?manorSVG():realmSVG()}`;
}

/* ================================================================
   BOOK TWO, CHAPTERS TWO TO FOUR
   ================================================================ */
function chapterEnter(n){ S.chapter=n; S.phase="open"; S.day=0; S.week=0; S.snapMap=realmSVG(true); S.snapManor=manorSVG();
  S.showMore=false; S.showLocked=false; S.flags.surgeNext=false; S.flags.away=false; S.weekReport=null; S.lastYield=null; S.guildNote=""; }
function daysEnter(){ S.phase="days"; S.day=1; S.buildsLeft=perDay(); S.lastYield=null; S.guildNote=""; }
function seasonEnter(){ S.phase="season"; S.week=1; S.buildsLeft=perWeek(); S.weekReport=null; S.flags.away=false; }
function crisisEnter(){ S.phase="crisis"; }
const outcome = key => { const v=F("n_"+key)||0; return v>=5 ? "great" : v>=3 ? "good" : "hard"; };
const beforeAfter = cap => `<div class="beforeafter"><figure>${S.snapMap||""}<figcaption>Start of the chapter</figcaption></figure><figure>${realmSVG(true)}<figcaption>${cap||"Now"}</figcaption></figure></div>`;
function chapterSummary(n, story, nextLabel, nextGo){
  return { title:()=>`Book Two, Chapter ${CH_WORD[n]} Complete: ${BOOK_TWO[n-1].t}`, enter(){ S.phase="done"; }, text:()=>`
${val(story)}
${beforeAfter(RN())}
${sys(`CHAPTER ${CH_WORD[n].toUpperCase()}`,`[${realmTier().name}]<br>${pop().toLocaleString()} people · ${alive().length} settlements · ${S.roads.length} roads${S.paved.length?` · ${S.paved.length} highways`:""} · Unity ${S.stats.unity}<br>Manor: ${manorStage()}${nextLabel?`<br>Next: ${nextLabel}`:""}`)}`,
  choices: nextGo ? [{label:`Begin ${nextLabel}`, go:nextGo}] : [{label:"Start Book Two again", restart:true}] };
}
const kidLine = () => S.family.child2 ? `${CHILD()} and ${CHILD2()}` : CHILD();

Object.assign(SCENES, {
/* ============================ CHAPTER TWO: THE FIRST WINTER OF THE REALM ============================ */
c2open:{ title:"The First Winter of the Realm", enter(){ chapterEnter(2); S.flags.winter=true; }, text:()=>`
<p>The snow comes early, three weeks before anyone expects it, and it does not stop. By the first week of winter the passes to the east are shoulder deep, and ${CHILD()} is a month old and has opinions about all of it, mostly at night.</p>
<p>The letter comes on the back of a half frozen rider from the north. It is sealed in the black and silver of old Kastrel. It is signed by Brannoch Varga, Duke of the Northern Marches, Marshal of King Oskar of Kastrel, who has not been king of anything for two years but is still, apparently, being written to.</p>
<p>${say(`"The east bank is the King's,"`)} the letter says. ${say(`"It was lent to traitors. When the snow lies deep, the King will come down and take it back."`)}</p>
<p>${F("fatherHere")?`Your father reads it with the baby asleep on his shoulder. ${say(`"Varga,"`)} he says. ${say(`"I fought him at Thornmere when I was young. He is not clever. He is something worse: he is patient."`)}`:""}</p>
${sys("WINTER",`[The realm's first winter]<br>Farms yield less, everyone eats more · roads to the east bank matter twice as much · Northwatch can be founded on the northern ridge`,"warn")}`,
choices:[
  {label:"Send Marren north under a flag of truce to talk to Varga.", hint:"Unity +3 · you'll learn what he wants", fx:{unity:3, c2start:"talk"}, go:"c2days"},
  {label:"Call the Wardens in from every town and drill them through the snow.", hint:"Defense +4", fx:{defense:4, c2start:"drill"}, go:"c2days"},
  {label:"Write back that the east bank belongs to the people who live on it, and go back to the nursery.", hint:"Morale +2 · Renown +2", fx:{morale:2, renown:2, c2start:"defy"}, go:"c2days"}
]},
c2days:{ title:"Snow Days", enter(){ daysEnter(); }, text:()=>`
<p>${F("c2start")==="talk"?`Marren rides north with two councillors and a white flag. She will be gone a week.`:F("c2start")==="drill"?`The Wardens drill in the square every morning in the snow, and the children of Brackenfold drill behind them with sticks.`:`Varga's rider goes north with your answer. Bren makes a copy of it for the Accord Hall, framed.`}</p>
<p>Four days before the passes close completely. Four days to get the realm ready for whatever is coming down from the hills.</p>`,
choices:[{label:"Plan the first day.", go:"plan"}]},
c2d1:{ title:"Hearth Fires", text:()=>`
<p>Coldwater runs out of firewood on the first day. Not low: out. The village burned its fences last week and its barn doors this morning, and the headman rides in with frost in his beard to ask, very politely, whether the realm has any opinion about people freezing.</p>
<p>${say(`"Karsk has coal,"`)} he says. ${say(`"Under the hill. Ostrow bought the rights in the autumn. He's selling it at a price I'd call theft if I weren't so cold."`)}</p>`,
choices:[
  {label:"Send timber from Woodsedge by sledge, today.", hint:"Timber −6 · Unity +4", req:()=>S.stats.timber>=6, fx:{timber:-6, unity:4}, go:"nextday"},
  {label:"Buy Ostrow's coal for every village on the east bank.", hint:"Coin −8 · Unity +3 · Ostrow is pleased", req:()=>S.stats.coin>=8, fx:{coin:-8, unity:3, aff_ostrow:1}, go:"nextday"},
  {label:"Declare the coal under Karsk the realm's, and open it to anyone with a shovel.", hint:"Unity +5 · Resentment +1 · Ostrow will not forget", fx:{unity:5, resent:1, aff_ostrow:-2, coalFree:true}, go:"nextday"}
]},
c2d2:{ title:"Night Feeds", text:()=>`
<p>${CHILD()} does not sleep. Not at night, anyway. ${CHILD()} sleeps beautifully all day, in the council chamber, through arguments about grain. At night, ${CP("sub")} looks at the ceiling and shouts about it.</p>
<p>${SPN()?`At three in the morning you find ${SPN()} walking the long hall with the baby, singing something tuneless, ${S.family.partner==="isolde"?"a tiny blue spark running along her sleeve to make the baby watch it":"a pen still in his other hand from the letters he was writing"}.`:"At three in the morning you walk the long hall yourself, singing something tuneless, because it is the only thing that works."} ${F("fatherHere")?`Your father's door opens. He comes out in his dressing gown and holds out his arms. ${say(`"Go to bed,"`)} he says. ${say(`"I have not slept through a night in forty years. I may as well be useful."`)}`:""}</p>`,
choices:()=>[
  ...(F("fatherHere")?[{label:"Let your father take the night.", hint:"Morale +2 · he is good at this, which surprises both of you", fx:{morale:2, aff_edric:1}, go:"nextday"}]:[]),
  {label:"Build the baby a cradle that rocks itself, with a little Elder counterweight.", hint:"Craft +1 · Morale +1 · it works too well and the baby gets seasick", fx:{craft:1, morale:1}, go:"nextday"},
  {label:"Stay up together, and talk until dawn.", hint:SPN()?"Morale +2 · "+SPN()+" ◆":"Morale +1", fx:{morale:2, ...(S.family.partner?{["aff_"+S.family.partner]:1}:{})}, go:"nextday"}
]},
c2d3:{ title:"Varga's Envoy", text:()=>`
<p>${F("c2start")==="talk"?`Marren comes back with an envoy riding beside her:`:`An envoy rides down from the north under a black and silver flag:`} Captain Mael Duskin, one of Varga's officers, a thin grey man with a frostbitten ear and very good manners. He bows to you, correctly, as one bows to someone whose title you do not recognize.</p>
<p>${say(`"The Duke offers terms,"`)} Duskin says. ${say(`"The east bank returns to the King. The west bank is yours, with the Duke's blessing. No one need die in the snow."`)}</p>
<p>${F("c2start")==="talk"?say(`"He has two thousand men up there,"`)+` Marren says to you afterward, very quietly. `+say(`"And no food. That's what scares me. Hungry men in winter don't wait for spring."`):""}</p>`,
choices:[
  {label:`"No. But any soldier who comes down the hill will be fed and given work."`, hint:"Unity +3 · some of his men may listen", fx:{unity:3, amnesty:true, n_c2:1}, go:"nextday"},
  {label:"Send him back with a cart of grain for Varga's men, and the same answer.", hint:"Grain −10 · Renown +3 · a strange kind of message", req:()=>S.stats.grain>=10, fx:{grain:-10, renown:3, grainGift:true, n_c2:2}, go:"nextday"},
  {label:"Hold Duskin as a hostage until spring.", hint:"Defense +2 · Resentment +1 · it may make Varga careful", fx:{defense:2, resent:1, duskinHeld:true, n_c2:1}, go:"nextday"}
]},
c2d4:{ title:"A Fire on the Hill", text:()=>`
<p>On the fourth night, a beacon goes up on the highland ridge. Then another. Aunt Hesk's signal fires, which she built for wolves.</p>
<p>A shepherd boy arrives at dawn, blue with cold, having run all night. Varga's men came down out of the snow and burned the outer barns of ${S.lv.highmeadow>0?"Highmeadow":"the highland camps"}. They took the sheep. They are still there, dug in around the meadow, and Aunt Hesk has barricaded sixty families in the ${S.lv.highmeadow>0?"village hall":"great stone fold"} with every crook and kitchen knife in the hills.</p>
${sys("CRISIS",`[The Siege of ${S.lv.highmeadow>0?"Highmeadow":"the Highlands"}]<br>Varga has come down the hill`,"warn")}`,
choices:[{label:"Ride.", go:"c2c1"}]},
c2c1:{ title:"Through the Snow", enter(){ crisisEnter(); }, text:()=>`
<p>The road up to the highlands is gone under the snow. ${connected().has("highmeadow")?"Your new road is there somewhere underneath, which helps: you can feel its stones through the drifts, the way you feel bones under skin.":"There is no road at all, only a shepherd's track that disappears every hundred paces."} Tamsin rides beside you with forty Wardens, and behind you, because nobody could stop them, Fen and twenty of the Realm Builders with picks and timber.</p>`,
choices:()=>[
  {label:"Melt and pack the snow ahead of you into a hard road, with your power.", hint:"Craft decides · you'll arrive exhausted", fx:{n_c2:S.stats.craft>=13?2:1, craft:1}, go:"c2c2"},
  {label:"Follow the shepherd boy's paths along the ridges, where the wind has blown the snow away.", hint:"Slower, but nobody sees you coming", fx:{n_c2:2, flank:true}, go:"c2c2"},
  {label:"Wait for the storm to pass, then go fast.", hint:"Safe for you · hard on the people in the hall", fx:{n_c2:0, morale:-1}, go:"c2c2"}
]},
c2c2:{ title:"The Meadow", text:()=>`
<p>${F("flank")?`You come over the ridge above the meadow at dawn, behind Varga's lines, and they never see you.`:`You come up into the meadow at dawn, and Varga's sentries see you at once and shout.`} Three hundred men in black and silver are dug into the snow around the ${S.lv.highmeadow>0?"village":"stone fold"}. They are thin. Many of them have rags around their hands instead of gloves. They have been starving in the hills for two years for a king who left them there.</p>
<p>The ${S.lv.highmeadow>0?"hall door":"fold gate"} is splintered. You can hear Aunt Hesk shouting from inside, words you would not use in front of the baby.</p>`,
choices:()=>[
  {label:"Raise a wall of packed ice and stone between the soldiers and the hall, overnight work done in an hour.", hint:"Keystone · Defense matters", fx:{n_c2:S.stats.defense>=14?2:1}, go:"c2c3"},
  {label:"Send Tamsin around their flank while the Builders make noise in front.", hint:"Tamsin knows her business", fx:{n_c2:2}, go:"c2c3"},
  ...(F("amnesty")||F("grainGift")?[{label:"Stand up in the open and shout the amnesty across the snow.", hint:"Some of them have heard of it", fx:{n_c2:2, shouted:true}, go:"c2c3"}]:[]),
  {label:"Charge.", hint:"Brave, and very bloody", fx:{n_c2:1, resent:1}, go:"c2c3"}
]},
c2c3:{ title:"Varga", text:()=>`
<p>${F("shouted")?`Men start coming out of the trenches with their hands up. Ten. Fifty. A hundred. Their own officers shout at them, and they keep walking toward the smell of the Builders' soup pot.`:`The fight in the snow is short and ugly, and then it is over on your side of the meadow.`}</p>
<p>Duke Brannoch Varga comes out onto the ridge above you on a black horse. He is old and huge and white haired, and he looks at your Wardens and your Builders and you, the one in the middle with snow on their coat and no sword, and he laughs. ${say(`"A mason,"`)} he says. ${say(`"They sent a mason."`)}</p>
<p>Behind him, the whole north face of the ridge is hanging snow, a cornice the size of a cathedral, waiting.</p>`,
choices:[
  {label:"Bring the cornice down on the empty slope beside him: no one hurt, his road home buried.", hint:"Craft · the cleverest answer", fx:{n_c2:2, c2end:"cornice"}, go:"c2c4"},
  {label:`"Go home, Duke. Take your men. We'll send food."`, hint:"Renown +3 · mercy, in front of everyone", fx:{n_c2:1, renown:3, c2end:"mercy"}, go:"c2c4"},
  {label:"Take his supply train while he watches.", hint:"Grain +10 · Iron +4", fx:{n_c2:1, grain:10, iron:4, c2end:"supply"}, go:"c2c4"}
]},
c2c4:{ title:"The Meadow Holds", enter(){ const o=outcome("c2"); S.flags.c2result=o;
    if(o==="great") add({unity:6, renown:4, defense:2}); else if(o==="good") add({unity:3, renown:2}); else add({unity:-2, morale:-2}); S.phase="open"; }, text:()=>`
<p>${F("c2end")==="cornice"?`You lay one hand on the snow and Listen, and the whole ridge is talking. You find the place where it wants to break and you let it. The cornice comes down like a white wave, a quarter mile wide, and buries the pass behind Varga's camp to the depth of three men. Nobody is under it. Everybody understands it.`:F("c2end")==="mercy"?`The Duke looks at you for a long time. Then he turns his horse and rides north, and most of his men follow him. Not all. Some stay sitting in the snow, watching the soup pot.`:`Tamsin's riders take the wagons while Varga watches from the ridge. Without food, his men will not last a week in the hills. He knows it. He turns north.`}</p>
<p>${({great:"Aunt Hesk comes out of the hall with a carving knife in each hand and is disappointed there is nobody left to use them on. Not one of the sixty families was hurt.", good:"Aunt Hesk comes out of the hall and counts heads. Everyone is there. Three barns are gone, and most of the sheep, but everyone is there.", hard:"It costs too much. Two of the Wardens do not come home, and one of Aunt Hesk's grandsons. She does not blame you. That is somehow worse."})[F("c2result")]}</p>
${F("amnesty")||F("shouted")?`<p>By evening a hundred and forty of Varga's soldiers are sitting around the Builders' fires in borrowed coats, eating. Fen is already asking which of them can lay stone.</p>`:""}
${sys("CRISIS OVER",`[${({great:"A clean victory",good:"The meadow holds",hard:"A hard winter"})[F("c2result")]}]<br>Varga retreats into the north · the passes close behind him`)}`,
choices:[{label:"Go home to the baby.", go:"c2season"}]},
c2season:{ title:"Part Two: Deep Winter", enter(){ seasonEnter(); }, text:()=>`
<p>You get home after midnight. ${SPN()?`${SPN()} is asleep in the nursery chair with ${CHILD()}, and you stand in the door for a long time before you wake them.`:`${CHILD()} is asleep in your father's arms by the fire. Neither of them wakes up.`}</p>
<p>The rest of the winter is long. The realm has to get through it.</p>
${sys("DEEP WINTER",`Five weeks · three works a week · winter yields · the Realm Builders build too<br>${nextTierText()}`)}`,
choices:[{label:"Plan the first week.", go:"plan"}]},
c2w1:{ title:"The Prisoners", text:()=>`
<p>${F("amnesty")||F("shouted")?"A hundred and forty":"Sixty"} of Varga's men are in the realm now: some who surrendered, some who were left behind in the snow. They sit in the barracks at Velm and eat everything they are given. Most of them are farm boys from the north of old Kastrel who joined the king's army at fifteen because there was nothing else, and have been marching ever since.</p>
<p>The council argues about them for a whole day. Velm wants them gone. Karsk wants them working. Ostrow wants them sold back to Varga, which he points out would be very profitable.</p>`,
choices:[
  {label:"Give them a place on the road crews, with pay, and land after a year.", hint:"Unity +4 · Timber +6 · Stone +6", fx:{unity:4, timber:6, stone:6, prisoners:"crews"}, go:"nextweek"},
  {label:"Ransom them back to Varga for coin.", hint:"Coin +12 · Resentment +1", fx:{coin:12, resent:1, prisoners:"ransom", aff_ostrow:1}, go:"nextweek"},
  {label:"Let any who want to go home walk north, with food for the road.", hint:"Grain −8 · Renown +3 · some will come back to you", req:()=>S.stats.grain>=8, fx:{grain:-8, renown:3, prisoners:"free"}, go:"nextweek"}
]},
c2w2:{ title:"Ostrow's Coal", text:()=>`
<p>${F("coalFree")?`Ostrow sends you a bill. It is beautifully written, on heavy paper, and itemizes every sack of coal taken from the mines under Karsk since you opened them, at winter prices, with interest. At the bottom, in his own hand: ${say(`"With my compliments, and my lawyers."`)}`:`Ostrow's coal is the only fuel left in the eastern villages by the second week. The price goes up every day. He explains, very reasonably, that coal is scarce in winter, which is why it is called a winter price.`}</p>
<p>Marren comes to you in the Accord Hall. ${say(`"He's making himself the person nobody can do without,"`)} she says. ${say(`"That's how the old king started, too."`)}</p>`,
choices:[
  {label:"Pay him fairly, and quietly start building the realm its own mines.", hint:"Coin −6 · Ostrow ◆", req:()=>S.stats.coin>=6, fx:{coin:-6, aff_ostrow:1}, go:"nextweek"},
  {label:"Take him to the new court.", hint:"Unity +3 · Resentment +1 · the court is very new", fx:{unity:3, resent:1, aff_ostrow:-1, ostrowCourt:true}, go:"nextweek"},
  {label:"Invite him to dinner at the manor. Bring the baby.", hint:"Ostrow ◆◆ · he is unexpectedly good with children", fx:{aff_ostrow:2, morale:1}, go:"nextweek"}
]},
c2w3:{ title:"The First Laugh", text:()=>`
<p>It happens at breakfast, in the middle of an argument about roof tiles. ${F("fatherHere")?"Your father":"Bren"} sneezes, very loudly, the way old men do, and ${CHILD()} looks at ${F("fatherHere")?"him":"Bren"} with total astonishment, and laughs. A real laugh, a big one, the first.</p>
<p>${F("fatherHere")?`Your father sneezes again on purpose. Then again. By the end of breakfast Lord Edric Valcrest, once the most feared man at the court of Highcrown, is sneezing at a baby while the entire household watches and nobody says a word about it, ever, on pain of death.`:`Bren spends the rest of the winter trying to sneeze on command.`}</p>`,
choices:[
  {label:"Write it down. Start a book of firsts.", hint:"Morale +2 · the book will matter later", fx:{morale:2, firstsBook:true}, go:"nextweek"},
  {label:"Carve the day into the nursery doorframe, where the heights will go.", hint:"Morale +1 · Craft +1", fx:{morale:1, craft:1}, go:"nextweek"},
  {label:"Take the afternoon off. All of it.", hint:"Morale +3 · the realm survives an afternoon", fx:{morale:3}, go:"nextweek"}
]},
c2w4:{ title:"The Frost Fair", text:()=>`
<p>In the fourth week the river freezes, solid, from bank to bank. Nobody has seen it happen in sixty years. By noon there are children sliding across it, and by evening there are people walking from Overbrack to Brackenfold and back again just because they can, without paying anyone, without a bridge, on the water that used to be a border.</p>
<p>Someone sets up a chestnut stall in the middle. Then a fiddler. Then a whole fair.</p>`,
choices:[
  {label:"Let it happen, and pay for the bonfires and the music.", hint:"Coin −5 · Unity +6 · Morale +2", req:()=>S.stats.coin>=5, fx:{coin:-5, unity:6, morale:2, frostFair:true}, go:"nextweek"},
  {label:"Join it. Bring the family. Skate badly in front of everyone.", hint:"Unity +4 · Renown +2 · Morale +2", fx:{unity:4, renown:2, morale:2, frostFair:true}, go:"nextweek"},
  {label:"Have the Wardens test the ice first, and close the thin parts.", hint:"Defense +1 · sensible · nobody falls in", fx:{defense:1, unity:2}, go:"nextweek"}
]},
c2w5:{ title:"The Thaw", text:()=>`
<p>The thaw comes all at once in the fifth week, with a warm wind from the south and a sound across the whole valley like a thousand doors opening. The river breaks up and roars. The passes open. The roads are mud to the axles.</p>
<p>Fen finds you on the manor roof, where you go to think. He has a ledger under his arm. ${say(`"We built more this winter than in the whole of the summer,"`)} he says. ${say(`"Do you know why? Nobody had anything else to do."`)} He looks out at the realm. ${say(`"Marren wants to talk about a bank. Ostrow wants to talk about a bank. I think it's going to be a long year."`)}</p>`,
choices:[{label:"Go down and see the spring in.", go:"nextweek"}]},
c2close:{ title:"Spring", enter(){ S.flags.winter=false; }, text:()=>`
<p>Spring comes into ${RN()} like an apology. The fields go green in a week. ${CHILD()} sits up for the first time, in the grass by the manor, and looks around at everything as if ${CP("sub")} built it.</p>
<p>In the north, the passes are open again. Nobody has seen Varga's black and silver since the meadow. Nobody thinks that means he is gone.</p>`,
choices:[{label:"End of Chapter Two.", go:"summary2"}]},
summary2: chapterSummary(2, ()=>`<p>${RN()} survived its first winter. ${({great:"The siege of the highlands ended without a single death among Aunt Hesk's people, and the story is already being sung in two languages.",good:"The highlands held, and Varga went back north.",hard:"The highlands held, at a price, and the realm remembers it."})[F("c2result")]} ${F("prisoners")==="crews"?"Varga's former soldiers are building roads in Ironvale and complaining about the food, which is a sign of trust.":""}</p>`, "Chapter Three: The Heir's Year", "c3open"),

/* ============================ CHAPTER THREE: THE HEIR'S YEAR ============================ */
c3open:{ title:"The Heir's Year", enter(){ chapterEnter(3); }, text:()=>`
<p>On both banks of the river there is an old custom: when a child of a great house turns one, they are carried through the town and shown to everyone, so that the people can decide whether they like the look of them. In Kastrel it was called the Showing. In Aurendell it was called the Presentation. In ${RN()}, after an argument in council lasting most of a morning, it is called the Showing and the Presentation, and it happens twice.</p>
<p>${CHILD()} is carried across the Bridge of Two Banks on ${SPN()?SPN()+"'s":"your"} shoulders, waving at everyone with both hands, and is liked very much.</p>
<p>That evening, Marren comes to the manor with a question the council has been avoiding. ${F("role")==="crown"?say(`"When you're gone,"`)+" she says, "+say(`"does the crown go to the child? Because if it does, we need to say so. And if it doesn't, we need to say that even louder."`):say(`"Your office,"`)+" she says. "+say(`"When you're gone, does it go to your child? People are asking. Ostrow is asking loudest."`)}</p>`,
choices:[
  {label:`"Yes. ${CHILD()} is the heir."`, hint:"Renown +4 · Ostrow approves · Marren is uneasy", fx:{heir:"child", renown:4, aff_ostrow:1}, go:"c3days"},
  {label:`"No. The council chooses who comes after me. Not my blood."`, hint:"Unity +6 · Marren is moved · Ostrow is alarmed", fx:{heir:"council", unity:6, aff_marren:2, aff_ostrow:-1}, go:"c3days"},
  {label:`"Let ${CP("obj")} grow up first. Ask me again when ${CP("sub")} can argue back."`, hint:"Morale +2 · nobody is satisfied, which is fair", fx:{heir:"later", morale:2}, go:"c3days"}
]},
c3days:{ title:"The Spring Council", enter(){ daysEnter(); }, text:()=>`
<p>The council sits for the spring in the ${has("accordHall")?"Accord Hall":"old hall on the square"}, four days of business before the summer. Ostrow has brought a proposal in a leather folder. Marren has brought a longer one in a bigger folder. Everyone has brought lunch.</p>`,
choices:[{label:"Plan the first day.", go:"plan"}]},
c3d1:{ title:"An Envoy from Highcrown", text:()=>`
${SPN()?`<p>A letter from King Aldric: a seat on the Aurendell council for ${RN()}'s envoy, and a request that the envoy be ${SPN()}, ${S.family.partner==="caelan"?"whose family has kept the royal archives for nine generations":"whose lightning the king remembers from the Stone Trial"}.</p>
<p>${SPN()} reads it twice, then puts it down. ${say(`"I'd be in Highcrown half the year,"`)} ${SPp("sub")} says. ${say(`"I'd miss things. First words. First everything."`)}</p>`
:`<p>King Aldric's new envoy to ${RN()} rides across the bridge on the first morning of the council, and you recognize the way they sit a horse before you can see their face.</p>
<p>${F("envoyChoice")?"":`It is Caelan Ardane, ink on his cuffs as always. And riding behind him, because she refused to be left out, is Isolde Varrin, a spark jumping between her fingers when she sees you. ${say(`"The king couldn't decide which of us to send,"`)} Caelan says. ${say(`"So we both came. That was a mistake on his part."`)}`}</p>`}`,
choices:()=>SPN() ? [
  {label:`"Go. We'll manage. I'll write down every first for you."`, hint:"Renown +4 · Unity +2 · "+SPN()+" ◆◆", fx:{renown:4, unity:2, partnerEnvoy:true, ["aff_"+S.family.partner]:2}, go:"nextday"},
  {label:`"Ask the king for someone else. I need you here."`, hint:"Morale +3 · "+SPN()+" ◆", fx:{morale:3, ["aff_"+S.family.partner]:1}, go:"nextday"},
  {label:`"Take the baby with you sometimes. Highcrown should meet the heir."`, hint:"Renown +2 · Morale +1 · the court will be charmed", fx:{renown:2, morale:1, partnerEnvoy:true, babyCourt:true}, go:"nextday"}
] : [
  {label:"Spend the evening with Caelan, in the library, the way you used to.", hint:"Caelan ◆◆ · something may come of it", fx:{aff_caelan:2, court3:"caelan"}, go:"nextday"},
  {label:"Spend the evening with Isolde, on the walls, the way you used to.", hint:"Isolde ◆◆ · something may come of it", fx:{aff_isolde:2, court3:"isolde"}, go:"nextday"},
  {label:"Have dinner with both of them as old friends, and keep it that way.", hint:"Renown +2 · friendship", fx:{renown:2, court3:"friends"}, go:"nextday"}
]},
c3d2:{ title:"The Bank", text:()=>`
<p>Ostrow opens his leather folder on the second day. The realm has two currencies, he points out: Aurendell crowns on the west bank and Kastrel marks on the east, and every trader on the river loses a tenth of their money changing one for the other. What ${RN()} needs is a bank. One coin. One treasury. One set of very careful books.</p>
<p>${say(`"And who keeps the books?"`)} Marren asks.</p>
<p>Ostrow smiles. ${say(`"Someone who has done it before."`)}</p>`,
choices:[
  {label:"Ostrow runs the bank. He's the best there is at this.", hint:"Unlocks the Bank of the Realm · Coin +8 · Ostrow ◆◆ · Marren is unhappy", fx:{bankFounded:"ostrow", coin:8, aff_ostrow:2, aff_marren:-1}, go:"nextday"},
  {label:"The council runs the bank, with Ostrow as an adviser.", hint:"Unlocks the Bank of the Realm · Unity +3", fx:{bankFounded:"council", unity:3}, go:"nextday"},
  {label:"No bank yet. Two currencies won't kill anyone.", hint:"Ostrow is offended · Resentment −1", fx:{resent:-1, aff_ostrow:-1}, go:"nextday"}
]},
c3d3:{ title:"First Steps", text:()=>`
<p>${CHILD()} walks for the first time on the third day, in the council chamber, in the middle of a debate on river tolls. ${CPc("sub")} lets go of the leg of Marren's chair, takes four steps across the floor toward you, sits down very suddenly, and looks around to make sure everyone saw.</p>
<p>Everyone saw. The debate on river tolls does not resume. ${F("fatherHere")?`Your father, at the back of the chamber where he sits in on every session and pretends not to, has to leave the room for a while.`:""}</p>`,
choices:[
  {label:"Write it in the minutes of the council.", hint:"Unity +2 · it's still there, in the record", fx:{unity:2}, go:"nextday"},
  {label:"Pick the child up and carry on with the tolls.", hint:"Renown +1 · nobody can focus", fx:{renown:1}, go:"nextday"},
  {label:"Adjourn the council for the day.", hint:"Morale +3", fx:{morale:3}, go:"nextday"}
]},
c3d4:{ title:"Fen's Question", text:()=>`
<p>Fen comes to the manor on the last evening of the council in a clean shirt, which is how you know something is wrong.</p>
<p>${say(`"I'm getting married,"`)} he says, all at once. ${say(`"To Lise. The glassmaker from Karsk, with the burned hands, you've met her. In the summer. And I don't have any family, not really, and I thought, I mean, I wondered,"`)} He stops. ${say(`"Would you stand for me? At the wedding. Where family stands."`)}</p>`,
choices:[
  {label:`"Fen. I've been your family since the day you burned my eyebrows off."`, hint:"Morale +3 · Fen ◆◆", fx:{morale:3, aff_fen:2, fenWedding:"stand"}, go:"nextday"},
  {label:"Say yes, and build them a house as a wedding gift.", hint:"Timber −6 · Stone −6 · Fen ◆◆◆", req:()=>S.stats.timber>=6&&S.stats.stone>=6, fx:{timber:-6, stone:-6, aff_fen:3, fenWedding:"house"}, go:"nextday"},
  {label:"Say yes, and give him your own copy of the Codex.", hint:"Craft +1 · Fen ◆◆ · he'll need it", fx:{craft:1, aff_fen:2, fenWedding:"codex"}, go:"nextday"}
]},
c3c1:{ title:"The Motion", enter(){ crisisEnter(); }, text:()=>`
<p>On the morning the council is meant to close, Councillor Brask of Velm stands up. Brask is young, sharp, and was Ostrow's clerk for nine years. He reads a motion from a sheet of paper that does not shake at all.</p>
<p>The council has no confidence in the ${TITLE()}. The highlands cost too much. The winter cost too much. The ${TITLE()} spends the east bank's money on west bank roads and the realm's time on ${P("pos")} own child. Velm, Brask says, will leave the Accord and govern itself, unless the council chooses a new ${F("role")==="builder"?"Master Builder":"head of the realm"} today.</p>
<p>The chamber goes very quiet. Everyone looks at Ostrow. Ostrow looks at his fingernails.</p>`,
choices:()=>[
  {label:"Answer every charge, one by one, with the ledgers.", hint:"Works built matter here", fx:{n_c3:S.built.length+S.roads.length>=14?2:1}, go:"c3c2"},
  {label:"Ask the gallery: let anyone from Velm stand up and say what the realm has done for them.", hint:"Unity decides", fx:{n_c3:S.stats.unity>=60?2:S.stats.unity>=45?1:0, gallery:true}, go:"c3c2"},
  {label:"Say nothing. Let Marren answer.", hint:"Marren decides", fx:{n_c3:(F("aff_marren")||0)>=2?2:1, marrenSpoke:true}, go:"c3c2"}
]},
c3c2:{ title:"The Debate", text:()=>`
<p>${F("gallery")?`A woman stands up in the gallery. Then a smith from Karsk. Then a boy from Coldwater who rode into Brackenfold in the hunger with no saddle, older now. They do not make speeches. They just say what happened.`:F("marrenSpoke")?`Marren stands up slowly. She was First Speaker of the free council in Velm when Brask was still copying Ostrow's letters. She speaks for a quarter of an hour, in Kastrel, without notes, and by the end of it half of Velm's delegates are looking at the floor.`:`You go through it all. The roads. The grain. The bridges. The winter. Every coin, both banks. It is not exciting. It is very convincing.`}</p>
<p>Brask is not finished. He produces a second sheet of paper: a letter, he says, proving that the ${TITLE()} promised Aurendell's king the east bank's iron in exchange for his recognition.</p>`,
choices:()=>[
  {label:"Ask to see the letter, and read it aloud.", hint:"Something about it is wrong", fx:{n_c3:1, readLetter:true}, go:"c3c3"},
  ...((F("aff_ostrow")||0)>=2?[{label:"Look straight at Ostrow.", hint:"You've earned something with him", fx:{n_c3:2, ostrowTurns:true}, go:"c3c3"}]:[]),
  ...(F("tamsinGeneral")?[{label:"Nod to Tamsin, in the back of the hall.", hint:"She's been watching Brask for a month", fx:{n_c3:2, tamsinProof:true}, go:"c3c3"}]:[]),
  {label:"Call it a forgery and demand the vote now.", hint:"Bold", fx:{n_c3:S.stats.renown>=40?1:0}, go:"c3c3"}
]},
c3c3:{ title:"The Vote", text:()=>`
<p>${F("ostrowTurns")?`Ostrow sighs, stands, and says in a bored voice that the letter is forged, that he knows because Brask learned forgery from him, and that he is very disappointed in the quality. Brask goes white.`:F("tamsinProof")?`Tamsin walks to the front of the hall and lays down the forger: a scribe from Velm, very frightened, who wrote the letter for Brask for forty marks and has already confessed twice.`:F("readLetter")?`You read it aloud. It is dated the day of the Accord vote, when you were kneeling on the bridge holding up the third pier, which half the people in this room saw. The laughter starts at the back.`:`The chamber argues for an hour. Nobody can prove anything. It comes down to the vote.`}</p>
<p>Marren calls it. ${RN()}'s councillors stand up one by one.</p>`,
choices:[{label:"Wait.", go:"c3c4"}]},
c3c4:{ title:"Confidence", enter(){ const o=outcome("c3"); S.flags.c3result=o; if(o==="great") add({unity:8, renown:3}); else if(o==="good") add({unity:3}); else add({unity:-6}); S.phase="open"; }, text:()=>`
<p>${({great:"The motion fails by every vote but one: Brask's. Velm's own delegates vote against him. He leaves the chamber before the count is finished, and Velm's council removes him by the end of the week.",good:"The motion fails, by four votes. Velm stays in the Accord. Brask keeps his seat, and smiles at you across the chamber every time he sees you, which is worse than shouting.",hard:"The motion fails by one vote, and only because the highland delegates walk forty miles to cast it. Velm stays in the Accord, sulking. You have a lot of building to do on the east bank."})[F("c3result")]}</p>
${F("ostrowTurns")?`<p>Ostrow catches you on the way out. ${say(`"Don't thank me,"`)} he says. ${say(`"Brask would have been a dreadful ruler. Far too honest about wanting it."`)}</p>`:""}
${sys("CRISIS OVER",`[${({great:"Complete confidence",good:"Confidence, narrowly",hard:"One vote"})[F("c3result")]}]<br>Velm stays · Unity ${S.stats.unity}`)}`,
choices:[{label:"Go out into the summer.", go:"c3season"}]},
c3season:{ title:"Part Two: The Summer of the Heir", enter(){ seasonEnter(); }, text:()=>`
<p>Summer is hot and long and green. The roads are dry. The council is not sitting. You have five weeks to build, and a one year old who has discovered stairs.</p>
${sys("SUMMER",`Five weeks · three works a week · highways and landmarks are open now<br>${nextTierText()}`)}`,
choices:[{label:"Plan the first week.", go:"plan"}]},
c3w1:{ title:"Fen's Wedding", text:()=>`
<p>Fen marries Lise in the Garden, under the old thorn trees that are orchards now, on the hottest day of the year. ${F("fenWedding")==="house"?"They walk home afterward to a little stone house by the Woodsedge road with a glassmaker's kiln in the yard, which you built, and which Fen keeps touching as if it might not be real.":F("fenWedding")==="codex"?"Fen has the Codex copy in his coat pocket the whole time. You see him touch it during the vows.":"Fen is so nervous he forgets his own name in the vows, and Lise says it for him."}</p>
<p>You stand where family stands. ${CHILD()} throws petals at the wrong moment and then at the right one.</p>`,
choices:[
  {label:"Make a toast.", hint:"Morale +2 · Fen ◆", fx:{morale:2, aff_fen:1}, go:"nextweek"},
  {label:"Dance with everyone. Badly.", hint:"Unity +2 · Morale +2", fx:{unity:2, morale:2}, go:"nextweek"},
  {label:"Slip away with your family and watch from the hill.", hint:"Morale +3", fx:{morale:3}, go:"nextweek"}
]},
c3w2:{ title:"Drought", text:()=>`
<p>No rain for three weeks. Then four. The Marrow stream drops so low the mill wheel stops. Coldwater's terraces crack. In Greenreach they are carrying water to the orchards in buckets.</p>
<p>The river is still full: the mountains feed it. It is just in the wrong place.</p>`,
choices:[
  {label:"Raise an Elder aqueduct from the river to the western farms, with your own power.", hint:"Craft +1 · Stone −8 · Grain +10 now", req:()=>S.stats.stone>=8, fx:{craft:1, stone:-8, grain:10, aqueduct:true}, go:"nextweek"},
  {label:"Send the Realm Builders to dig cisterns in every farm village.", hint:"Timber −4 · Coin −4 · Unity +3", fx:{timber:-4, coin:-4, unity:3}, go:"nextweek"},
  {label:"Buy grain from Saelmar until the rain comes.", hint:"Coin −8 · Grain +12", req:()=>S.stats.coin>=8, fx:{coin:-8, grain:12}, go:"nextweek"}
]},
c3w3:{ title:()=>SPN()?"Midsummer":F("court3")==="friends"?"A Quiet Night":"Midsummer Night", text:()=>`
${SPN()?`<p>${F("partnerEnvoy")?`${SPN()} comes home from Highcrown for midsummer. ${SPp("sub").charAt(0).toUpperCase()+SPp("sub").slice(1)} has been gone six weeks, and ${CHILD()} hides behind your legs for a whole minute before running at ${SPp("obj")}.`:`It is your anniversary, and you both forget, and then you both remember at the same moment in the middle of a council dinner, and have to leave.`}</p>
<p>You sit on the manor roof together after the child is asleep, the realm below you full of lights. ${say(`"Do you ever think about the old manor?"`)} ${SPN()} asks. ${say(`"In Brackenfold, the first year. When it was just a broken house and a village that hated you."`)}</p>`
:F("court3")&&F("court3")!=="friends"?`<p>${F("court3")==="caelan"?"Caelan":"Isolde"} stays in ${RN()} through the summer, officially as Aurendell's envoy, unofficially because the envoy's lodgings are a five minute walk from the manor. On midsummer night you walk the bridge together, all the way across and back again, twice.</p>
<p>${say(`"I used to wonder what would have happened,"`)} ${F("court3")==="caelan"?"he":"she"} says, ${say(`"if you'd stayed in Highcrown. If they'd never sent you away."`)}</p>`
:`<p>A quiet night in the manor, for once. Your father plays chess with Bren in the library and loses on purpose. ${CHILD()} is asleep. You sit on the roof alone with the realm below you full of lights, and it is enough.</p>`}`,
choices:()=>SPN() ? [
  {label:`"Every day. And I wouldn't change any of it."`, hint:"Morale +3 · "+SPN()+" ◆◆", fx:{morale:3, ["aff_"+S.family.partner]:2}, go:"nextweek"},
  {label:"Kiss them instead of answering.", hint:"Morale +2 · "+SPN()+" ◆◆", fx:{morale:2, ["aff_"+S.family.partner]:2}, go:"nextweek"}
] : F("court3")&&F("court3")!=="friends" ? [
  {label:`"I'd never have met you properly. Stay. Not as an envoy."`, hint:"Romance · "+(F("court3")==="caelan"?"Caelan":"Isolde")+" stays in "+RN(), fx:{romance2:F("court3"), ["aff_"+F("court3")]:2, morale:2}, go:"nextweek"},
  {label:`"I'd have been miserable. I'm glad you came."`, hint:"Friendship, warmly", fx:{morale:2}, go:"nextweek"}
] : [{label:"Go to bed early, for once.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"}]},
c3w4:{ title:"The Highcrown Invitation", text:()=>`
<p>An invitation from King Aldric: the heir of ${RN()} is invited to Highcrown for the king's birthday. ${F("babyCourt")?"The court remembers the baby from the envoy's visits and has been asking.":""} Aldric writes in his own hand, and the hand is shakier than it was.</p>
<p>${F("fatherHere")?`${say(`"He's ill,"`)} your father says, reading it. ${say(`"He wants to see the child before. Well. Before."`)}`:""}</p>`,
choices:[
  {label:"Go, all of you.", hint:"Renown +4 · Unity −1 · Aldric is delighted", fx:{renown:4, unity:-1, highcrownVisit:true, aff_aldric:2}, go:"nextweek"},
  {label:"Send your father with the child. He knows the court.", hint:"Renown +2 · Morale +1 · your father comes back ten years younger", fx:{renown:2, morale:1, highcrownVisit:true, aff_aldric:1, aff_edric:1}, go:"nextweek"},
  {label:"Invite the king to come here instead.", hint:"Unity +3 · he is too ill to come, and writes back sadly", fx:{unity:3}, go:"nextweek"}
]},
c3w5:{ title:"One Year Old", text:()=>`
<p>${CHILD()}'s first birthday. There is a cake that Granny Pell, who is ninety and insists on it, bakes herself. There are presents from both banks: a wooden horse from Karsk, a tiny pair of boots from Hollin Cross, a sheep from Aunt Hesk, alive, which nobody knows what to do with.</p>
<p>${F("fatherHere")?`Your father gives ${CP("obj")} the Valcrest signet ring, on a chain. ${say(`"It was my father's,"`)} he says. ${say(`"It is far too heavy for a child, and it has been on far too many bad letters. Perhaps ${CP("sub")} will seal some good ones."`)}`:"Seren sends the Valcrest signet ring from Highcrown, on a chain, with a note in your father's hand."}</p>`,
choices:[{label:"Blow out the candle together.", hint:"Morale +3", fx:{morale:3, signet:true}, go:"nextweek"}]},
c3close:{ title:"The Year Turns", text:()=>`
<p>${F("romance2")?`At the end of the summer, ${F("romance2")==="caelan"?"Caelan":"Isolde"} resigns as Aurendell's envoy and moves into the manor, into the room in the family wing that you had very carefully not called anything. ${CHILD()} approves.`:""} The year turns. ${CHILD()} is walking everywhere now, and climbing, and has found the way up to your workshop.</p>
<p>And in the iron hills, in the deepest gallery of the new mine at Ironvale, a miner's pick goes through a wall into a space that has not seen light in a thousand years.</p>`,
enter(){ if(F("romance2")&&!S.family.partner){ S.family.partner=F("romance2"); S.flags.lateMarriage=true; } },
choices:[{label:"End of Chapter Three.", go:"summary3"}]},
summary3: chapterSummary(3, ()=>`<p>The heir's year is over. ${({great:"Velm stayed in the Accord with its whole heart.",good:"Velm stayed in the Accord, narrowly.",hard:"Velm stayed in the Accord by one vote."})[F("c3result")]} ${F("bankFounded")?`The realm has a bank, run by ${F("bankFounded")==="ostrow"?"Ostrow":"the council"}.`:"The realm still has two currencies."} Fen is married. ${CHILD()} can walk, and can say three words, one of which is ${say(`"no."`)}</p>`, "Chapter Four: The Iron Hills", "c4open"),

/* ============================ CHAPTER FOUR: THE IRON HILLS ============================ */
c4open:{ title:"The Iron Hills", enter(){ chapterEnter(4); if(S.lv.ironvale===0) S.lv.ironvale=1; }, text:()=>`
<p>Ruslan's message reaches you at breakfast. It is three words long, scratched on a slate in charcoal, carried down from the hills by a boy on a mule: ${say(`"Door. Your mark."`)}</p>
<p>You ride to Ironvale that afternoon. The new mine runs a quarter mile into the hill. At the end of the deepest gallery, where the miners' picks broke through, there is a wall that is not rock. It is cut stone, perfectly fitted, warm to the touch. And in the middle of it, the size of a door, is a mason's square inside a circle: the mark on Aurel's ring. Your mark.</p>
<p>${say(`"It's been getting warmer,"`)} Ruslan says. ${say(`"Every day since we found it. The whole mountain is getting warmer."`)}</p>
${sys("ELDER SITE",`[Deepforge]<br>A sealed Elder work under the iron hills · Deepforge can now be founded`)}`,
choices:[
  {label:"Lay your hands on the door and Listen.", hint:"Craft +1", fx:{craft:1, c4start:"listen"}, go:"c4days"},
  {label:"Close the mine and get everyone out until you understand it.", hint:"Defense +2 · Iron −2", fx:{defense:2, iron:-2, c4start:"close"}, go:"c4days"},
  {label:"Send for Fen. He's better at listening than you are now.", hint:"Fen ◆", fx:{aff_fen:1, c4start:"fen"}, go:"c4days"}
]},
c4days:{ title:"Under the Mountain", enter(){ daysEnter(); }, text:()=>`
<p>${F("c4start")==="listen"?`The stone is talking. Not like a bridge, proud and simple. Like a furnace, enormous and patient and very, very hot, and somewhere deep inside it, a held breath, like the Storm Engine before it woke.`:F("c4start")==="close"?`The miners come out grumbling. The heat follows them out of the gallery like a dog.`:`Fen arrives the next morning with Lise and his notebooks. He sits with his hands on the door for an hour without moving.`}</p>
<p>Four days in the hills, while the iron towns decide whether to be frightened.</p>`,
choices:[{label:"Plan the first day.", go:"plan"}]},
c4d1:{ title:"The Deep Forge", text:()=>`
<p>The door opens for you. Of course it does. It slides aside without a sound, on hinges a thousand years old, and behind it is a hall bigger than the Accord Hall, carved out of the living rock. There are forges along both walls, forty of them, cold. And in the center of the floor there is a shaft, a perfect circle, going down further than your lantern can reach, and out of it comes heat, steady as breath.</p>
<p>${say(`"It's a forge,"`)} Fen says, ${F("c4start")==="fen"?"who heard it before you did":"behind you"}. ${say(`"The Elders built a forge on top of the fire under the world. They didn't need coal. They didn't need anything."`)}</p>`,
choices:[
  {label:"Copy everything into the Codex. Every forge, every vent.", hint:"Craft +2", fx:{craft:2}, go:"nextday"},
  {label:"Light one forge, just to see.", hint:"Iron +6 · Craft +1 · the mountain grumbles", fx:{iron:6, craft:1, forgeLit:true}, go:"nextday"},
  {label:"Leave it alone tonight. Post a guard.", hint:"Defense +1", fx:{defense:1}, go:"nextday"}
]},
c4d2:{ title:"The Chain", text:()=>`
<p>${F("quill")==="ally"||F("quill")==="kin"?`Maelor Quill rides into Ironvale on the second day, uninvited, the old collar scar livid in the heat. ${say(`"Do you know why it's waking?"`)} he asks. ${say(`"Because you woke the Storm Engine. They're linked. The Elders didn't build Wonders. They built one Wonder, in pieces, all over the world."`)}`:`Fen spends the night in the Deep Forge with his notebooks and comes out in the morning grey with tiredness. ${say(`"It's linked,"`)} he says. ${say(`"To the Storm Engine. I can hear it. Very faint, under everything, like two bells that were cast together. When the Engine woke, this started waking too."`)}`}</p>
<p>${say(`"How many more are there?"`)} you ask. Nobody knows.</p>`,
choices:[
  {label:"Start a list. Every Elder site anyone has ever heard of.", hint:"Craft +1 · Renown +1", fx:{craft:1, renown:1, wonderList:true}, go:"nextday"},
  {label:"Write to Wren.", hint:F("ending")==="keeper"?"Wren is inside the Engine now · you write anyway":"Wren will know", fx:{wroteWren:true}, go:"nextday"},
  {label:"Tell no one yet. The realm has enough to worry about.", hint:"Morale +1", fx:{morale:1}, go:"nextday"}
]},
c4d3:{ title:"Mining Rights", text:()=>`
<p>${F("bankFounded")==="ostrow"?"The Bank of the Realm":"Ostrow"} buys the mining rights to every gallery in the Ironvale hills on the third day, all of them, legally, through four different companies with four different names. By the time anyone notices, the paperwork is filed in Velm.</p>
<p>${say(`"I'm not going to touch the Elder door,"`)} Ostrow tells you, when you ride to Velm to ask him what he thinks he is doing. ${say(`"I'm not mad. I'm only going to own everything around it."`)}</p>`,
choices:[
  {label:"Buy half of it back from him, for the realm.", hint:"Coin −10 · Ostrow ◆", req:()=>S.stats.coin>=10, fx:{coin:-10, aff_ostrow:1, hillsShared:true}, go:"nextday"},
  {label:"Declare Elder sites the property of the whole realm, by law, today.", hint:"Unity +3 · Ostrow ◆◆ angry", fx:{unity:3, aff_ostrow:-2, elderLaw:true}, go:"nextday"},
  {label:"Let him have it. His mines will need workers, and pay them.", hint:"Iron +4 · Coin +4 · Ostrow ◆◆", fx:{iron:4, coin:4, aff_ostrow:2}, go:"nextday"}
]},
c4d4:{ title:"A Word", text:()=>`
<p>You ride home for one night in the middle of it all, because you promised. ${CHILD()} is waiting at the gate with ${SPN()||"your father"}, and as you get off the horse ${CP("sub")} points at the gatepost and says, very clearly, ${say(`"Stone."`)}</p>
<p>Then ${CP("sub")} puts ${CP("pos")} hand flat on the gatepost the way you do, and holds it there, frowning, as if ${CP("sub")} is listening.</p>`,
choices:[
  {label:"Laugh, and pick the child up.", hint:"Morale +2", fx:{morale:2}, go:"nextday"},
  {label:"Kneel down and put your hand beside the small one.", hint:"Something to remember", fx:{morale:1, firstListen:true}, go:"nextday"}
]},
c4c1:{ title:"The Fall at Ironvale", enter(){ crisisEnter(); }, text:()=>`
<p>The tremor comes at dawn on the fifth day. You feel it in your teeth, back in the manor. By the time you reach Ironvale at a gallop the dust is still coming out of the mine mouth in a long brown plume.</p>
<p>The main gallery has come down. Forty miners are behind it. Ruslan is one of them. And under all of it, you can feel the Deep Forge breathing faster, the heat rising up the shaft like a fever.</p>
${sys("CRISIS",`[The Fall at Ironvale]<br>Forty miners trapped · the mountain is waking`,"warn")}`,
choices:()=>[
  {label:"Shore the gallery as you go, arch by arch, with your power.", hint:has("mineShoring")?"The Elder arches you built are holding":"Stone −6", fx:{n_c4:has("mineShoring")?2:1, stone:has("mineShoring")?0:-6}, go:"c4c2"},
  {label:"Get every Realm Builder in the hills here, now, with timber.", hint:"Timber −6 · many hands", fx:{n_c4:F("realmGuild")?2:1, timber:-6}, go:"c4c2"},
  {label:"Go in alone, fast, and feel your way to them.", hint:"Craft decides · dangerous", fx:{n_c4:S.stats.craft>=15?2:1, wentAlone:true}, go:"c4c2"}
]},
c4c2:{ title:"The Heat", text:()=>`
<p>You reach them in the second hour. They are in a pocket behind the fall, forty men and women in the dark, Ruslan holding up a cracked beam with his own back like something out of a story. And the air is getting hotter. The Deep Forge's shaft runs right under them. Something down there is waking up.</p>`,
choices:()=>[
  {label:"Go down to the Deep Forge and ask it to wait.", hint:F("firstListen")||F("c4start")==="listen"?"You've Listened to it before":"You don't know its voice yet", fx:{n_c4:F("firstListen")||F("c4start")==="listen"?2:1, askedForge:true}, go:"c4c3"},
  {label:"Divert the river stream into the old drainage galleries to cool the rock.", hint:"Clever · Craft +1", fx:{n_c4:2, craft:1, cooled:true}, go:"c4c3"},
  {label:"Get them out first. Worry about the mountain after.", hint:"Fast", fx:{n_c4:1}, go:"c4c3"}
]},
c4c3:{ title:"The Last Six", text:()=>`
<p>${F("askedForge")?`You kneel at the lip of the shaft, in heat like an oven, and put your hands on the rim, and you tell it: not yet. Not now. There are people above you. And it hears you. Slowly, the breathing slows.`:F("cooled")?`The stream goes roaring into the old galleries, and the whole mountain steams like a kettle, and the heat in the pocket drops enough to breathe.`:`You start bringing them out in a chain, hand to hand through the gap.`} Thirty four are out. Six are left, the ones furthest in, and Ruslan, who will not leave until they are.</p>
<p>The gap is closing. It will hold for one more trip.</p>`,
choices:[
  {label:"Go yourself.", hint:"The Keystone holds the stone", fx:{n_c4:2, lastTrip:"you"}, go:"c4c4"},
  {label:"Send Fen. He can hold it as well as you now.", hint:(F("aff_fen")||0)>=3?"Fen is ready":"Fen is nearly ready", fx:{n_c4:(F("aff_fen")||0)>=3?2:1, lastTrip:"fen"}, go:"c4c4"},
  {label:"Hold the gap open and let Ruslan bring them.", hint:"Trust him", fx:{n_c4:1, lastTrip:"ruslan", aff_ruslan:2}, go:"c4c4"}
]},
c4c4:{ title:"Daylight", enter(){ const o=outcome("c4"); S.flags.c4result=o; if(o==="great") add({unity:5, renown:4}); else if(o==="good") add({unity:2, renown:2}); else add({morale:-2, unity:-2}); S.phase="open"; if(S.lv.deepforge===0&&o!=="hard") S.lv.deepforge=1; }, text:()=>`
<p>${({great:"All forty come out into the daylight, black with dust, and sit down on the slope and laugh like madmen. Ruslan is the last one out. He walks up to you, puts both arms around you, and lifts you off the ground.",good:"Thirty nine come out. One of the older miners, a woman named Vesna who worked the foundries in the collar years, does not. Ruslan carries her out himself.",hard:"Thirty six come out. The mountain keeps the rest. Ruslan sits on the slope with his face in his hands for a long time, and you sit beside him."})[F("c4result")]}</p>
<p>${F("lastTrip")==="fen"?`Fen comes out last, holding the stone open with his bare hands the way you taught him, and when the gap closes behind him he looks at his palms as if they belong to someone else. He is a Master now. Everyone saw it.`:""}</p>
<p>Under the mountain, the Deep Forge breathes slowly again, like something going back to sleep. Not all the way.</p>
${sys("CRISIS OVER",`[${({great:"Everyone came home",good:"Thirty nine came home",hard:"The mountain kept some"})[F("c4result")]}]<br>${S.lv.deepforge>0?"Deepforge is founded at the Elder door":"Deepforge can be founded"}`)}`,
choices:[{label:"Go home.", go:"c4season"}]},
c4season:{ title:"Part Two: The Iron Autumn", enter(){ seasonEnter(); }, text:()=>`
<p>Autumn in the iron hills. The beeches turn red and the forges in Karsk run day and night. You have a Wonder under a mountain, and five weeks to decide what to do with it.</p>
${sys("AUTUMN",`Five weeks · three works a week · Deepforge and the workshop tower are open<br>${nextTierText()}`)}`,
choices:[{label:"Plan the first week.", go:"plan"}]},
c4w1:{ title:"What the Forge Is For", text:()=>`
<p>The council comes up to Ironvale to see the Deep Forge for themselves. Marren stands at the edge of the shaft for a long time. Ostrow measures the forges with a tape. Aunt Hesk, who came because nobody told her not to, warms her hands at the vent and says it would make a fine oven.</p>
<p>The question is simple, and nobody wants to answer it. A forge that needs no fuel could make the realm the richest in the world. It could also make it the most dangerous.</p>`,
choices:[
  {label:"Relight it for the realm: tools, ploughs, rails, bridges. No weapons. Carve that over the door.", hint:"Iron +8 · Craft +1", fx:{iron:8, craft:1, forge:"realm"}, go:"nextweek"},
  {label:"Share it: Aurendell and Saelmar may send smiths, and everyone watches everyone.", hint:"Unity +3 · Renown +4", fx:{unity:3, renown:4, forge:"shared"}, go:"nextweek"},
  {label:"Seal it again until you know what it's linked to.", hint:"Defense +3 · Morale +1", fx:{defense:3, morale:1, forge:"sealed"}, go:"nextweek"}
]},
c4w2:{ title:"Ruslan's Bell", text:()=>`
<p>Ruslan comes to see you in the second week with a cart and something heavy under a tarpaulin. ${say(`"Every collar in Karsk,"`)} he says, pulling it off. ${say(`"We kept them. In a cellar. Nobody wanted to look at them, nobody wanted to throw them away."`)}</p>
<p>${say(`"I want to make them into a bell,"`)} he says. ${say(`"For the square in Karsk. It rings once a year, on the day they came off. I want you to cast it with me."`)}</p>`,
choices:[
  {label:"Cast it with him, in the Deep Forge.", hint:"Unity +4 · Ruslan ◆◆ · Resentment −1", fx:{unity:4, aff_ruslan:2, resent:-1, collarBell:true}, go:"nextweek"},
  {label:"Cast it in Karsk's own old foundry, where the collars were made.", hint:"Unity +5 · Ruslan ◆", fx:{unity:5, aff_ruslan:1, collarBell:true}, go:"nextweek"}
]},
c4w3:{ title:"Spies in the Hills", text:()=>`
<p>Tamsin's scouts catch two men in the hills above Deepforge in the third week, with maps, very good maps, of every gallery in the iron hills. They are wearing miners' clothes and soldiers' boots.</p>
<p>${say(`"Varga's,"`)} Tamsin says. ${say(`"He's heard about the forge. Of course he has. Everyone has. He's not interested in ploughs."`)}</p>`,
choices:[
  {label:"Build Northwatch: a fort on the northern ridge, before the snow.", hint:"Found Northwatch free · Defense +3", fx:{defense:3}, then:()=>{ if(S.lv.northwatch===0) S.lv.northwatch=1; }, go:"nextweek"},
  {label:"Send the spies back to Varga with a message: come and see it for yourself, under a flag of truce.", hint:"Renown +3 · a bold invitation", fx:{renown:3, vargaInvite:true}, go:"nextweek"},
  {label:"Keep them, and find out what Varga knows.", hint:"Craft +1 · Defense +1 · Varga is looking for something in the north too", fx:{craft:1, defense:1, vargaLantern:true}, go:"nextweek"}
]},
c4w4:{ title:()=>F("lateMarriage")&&!F("weddingDone")?"A Wedding at the Manor":"The Workshop", text:()=>`
${F("lateMarriage")&&!F("weddingDone")?`<p>You marry ${SPN()} in the manor gardens in the fourth week of autumn, under the beech trees, with the whole realm's council in the back rows pretending they are not crying. ${CHILD()} carries the rings and drops them twice. ${F("fatherHere")?`Your father gives a speech. It is short, for him. It ends: ${say(`"I was wrong about a great many things. Not about this."`)}`:""}</p>`
:`<p>You spend a whole week in your workshop for the first time in a year, mending things that don't matter: a clock for the kitchen, a toy cart, a cracked bowl Granny Pell has had since she was a girl. It is the best week you have had in a long time.</p>
<p>${CHILD()} sits on a stool beside you the whole time and hammers nails into a block of wood, very seriously, in rows.</p>`}`,
choices:()=>F("lateMarriage")&&!F("weddingDone") ? [{label:"Say the vows.", hint:"Married · Morale +4", fx:{morale:4, weddingDone:true, ["aff_"+S.family.partner]:2}, go:"nextweek"}]
  : [{label:"Make the child a set of real tools, child sized.", hint:"Morale +2 · Craft +1", fx:{morale:2, craft:1, kidTools:true}, go:"nextweek"},
     {label:"Teach the child to Listen to the wood.", hint:"Something stirs · Morale +1", fx:{morale:1, firstListen:true}, go:"nextweek"}]},
c4w5:{ title:"Harvest Home", text:()=>`
<p>The harvest is the best either bank has had in ten years. ${F("aqueduct")?"The western farms, watered by your aqueduct, bring in so much grain that Marrow Ford runs out of barns.":"Every barn in the realm is full."} The whole realm holds the Harvest Home on the same night, both banks, both languages, with the bonfires lit along the river from the mountains to the sea, so you can stand on the manor roof and see the whole realm burning gold.</p>
<p>${F("fatherHere")?`Your father stands next to you on the roof and counts the fires out loud. He gets to ninety before he loses track. ${say(`"When I was your age,"`)} he says, ${say(`"I owned a house. That was all. I thought it was a great deal."`)}`:""}</p>`,
choices:[{label:"Light the manor's fire too.", hint:"Unity +3 · Morale +3", fx:{unity:3, morale:3}, go:"nextweek"}]},
c4close:{ title:"A Ship in the River", text:()=>`
<p>On the last day of autumn, a ship comes up the river from the sea. A tall ship, a Saelmar ship, with a blue and silver flag, the first deep sea ship ever to come so far upriver. It ties up at ${S.lv.saltford>0?"Saltford":"Overbrack"} and a single passenger comes down the gangplank, salt in her hair, wearing a general's coat.</p>
<p>${say(`"I need a favor,"`)} Tamsin says. ${say(`"Saelmar needs a favor. I told them you'd say yes. Don't make a liar of me."`)}</p>`,
choices:[{label:"End of Chapter Four.", go:"summary4"}]},
summary4: chapterSummary(4, ()=>`<p>The iron hills gave up their secret. ${({great:"Every miner came home from the fall at Ironvale.",good:"The fall at Ironvale cost one life, and Ruslan carved her name on the Collar Bell.",hard:"The fall at Ironvale cost six lives."})[F("c4result")]} The Deep Forge is ${({realm:"burning for the realm, with no weapons carved over its door",shared:"burning for three kingdoms, under everyone's eyes",sealed:"sealed again, breathing slowly under the mountain"})[F("forge")||"sealed"]}. And Fen is a Master Artificer.</p>`, "Chapter Five: The Tide Calls", "c5open")
});

/* ================================================================
   BOOK TWO, CHAPTERS FIVE TO SEVEN
   ================================================================ */
Object.assign(SCENES, {
/* ============================ CHAPTER FIVE: THE TIDE CALLS ============================ */
c5open:{ title:"The Tide Calls", enter(){ chapterEnter(5); }, text:()=>`
<p>Tamsin tells it at the manor table, with ${CHILD()} on her knee stealing bread from her plate.</p>
<p>The Tide Gate, the mile long Elder wall across Saelmar's harbor that you mended years ago, has started moving on its own. It closed for a whole day last month with the fishing fleet outside, and opened at midnight in a storm surge, and the lower city flooded to the second floor. ${say(`"It's waking,"`)} she says. ${say(`"Like your forge. Like everything, apparently."`)}</p>
<p>${say(`"And there's a corsair,"`)} she adds. ${say(`"Absalom Kade. Calls himself a prince. He's been taking our ships, and he's paying his crews in Kastrel silver. Black and silver."`)}</p>
<p>Varga. Again.</p>
${sys("ELDER CITIES",`[Great cities]<br>Any city can now grow into a great city of 700 people`)}`,
choices:[
  {label:"Go to Saelmar, and take the family. The child should see the sea.", hint:"Morale +3 · everyone together", fx:{morale:3, c5family:"all"}, go:"c5days"},
  {label:"Go to Saelmar with Fen. Leave the family safe at home.", hint:"Craft +1 · Fen ◆", fx:{craft:1, aff_fen:1, c5family:"home"}, go:"c5days"},
  {label:"Go alone with Tamsin, fast.", hint:"Renown +2 · Tamsin ◆", fx:{renown:2, aff_tamsin:1, c5family:"alone"}, go:"c5days"}
]},
c5days:{ title:"Across the Sea", enter(){ daysEnter(); S.flags.away=true; }, text:()=>`
<p>You sail from ${S.lv.saltford>0?"Saltford":"Overbrack"} on Tamsin's ship with the spring wind behind you. ${F("c5family")==="all"?`${CHILD()} spends the whole crossing at the rail, shouting at the waves, and is sick only once, on Tamsin's boots.`:"The crossing takes three days. You spend most of it writing letters home."}</p>
${sys("AWAY",`[In Saelmar]<br>One work a day, by letter · the Realm Builders and the council run the realm`)}`,
choices:[{label:"Plan the first day, by letter.", go:"plan"}]},
c5d1:{ title:"The White City", text:()=>`
<p>Saelmar climbs out of the sea in white stairs and blue roofs, the same as you remember, and the harbor is enclosed by the Tide Gate: a curved wall a mile long, with great bronze gates in the middle that should open and close with the tide and now open and close as they please.</p>
<p>The lower city is drying out from the last flood. People are hanging carpets from every balcony. A woman you mended a cistern for, years ago, recognizes you in the street and starts crying, and then a crowd gathers, and then Tamsin has to get you out through a bakery.</p>`,
choices:[
  {label:"Go straight out to the Gate and Listen.", hint:"Craft +1", fx:{craft:1, c5listen:true}, go:"nextday"},
  {label:"Help the lower city first: pumps, drains, dry walls.", hint:"Renown +4 · Saelmar will remember", fx:{renown:4, c5help:true}, go:"nextday"},
  {label:"Visit the keeper's chair in the Gate tower.", hint:"Where the Gate is controlled · Craft +1", fx:{craft:1, c5chair:true}, go:"nextday"}
]},
c5d2:{ title:"The Admirals' Council", text:()=>`
<p>Saelmar is ruled by nine admirals who sit in a round room over the harbor and disagree about everything except the sea. ${F("tamsinGeneral")?"Tamsin sits among them in her general's coat; they defer to her, which is new.":""}</p>
<p>The eldest admiral, a woman with a face like a walnut, puts it plainly. ${say(`"If the Gate can close on its own, it can close when we want it to. On Kade's fleet. With Kade's fleet inside the harbor."`)} She looks at you. ${say(`"You could make it do that. Couldn't you?"`)}</p>`,
choices:[
  {label:`"No. I don't make Elder works into weapons."`, hint:"Resentment −1 · some admirals are angry", fx:{resent:-1, c5weapon:"no"}, go:"nextday"},
  {label:`"Only if Kade attacks the city itself. Not before."`, hint:"Renown +2 · a hard line", fx:{renown:2, c5weapon:"defense"}, go:"nextday"},
  {label:`"Let me build you something better: a harbor chain, raised from the seabed."`, hint:"Craft +1 · Stone −6 · Iron −4", req:()=>S.stats.stone>=6&&S.stats.iron>=4, fx:{craft:1, stone:-6, iron:-4, c5chain:true, n_c5:1}, go:"nextday"}
]},
c5d3:{ title:"The Corsair Prince", text:()=>`
<p>Absalom Kade asks for a parley on a rock in the outer bay, with one boat each and no guns. He is younger than you expected, very handsome, very tanned, with silver in his ears and a laugh you can hear across the water.</p>
<p>${say(`"The Duke pays me to keep Saelmar busy,"`)} he says cheerfully, ${say(`"while he digs for something in the north. A lantern, he says. I don't ask. He pays in silver."`)} He leans forward. ${say(`"You could pay me in something better. That forge of yours, for instance. Or I could just keep sinking ships."`)}</p>`,
choices:[
  {label:"Offer him a harbor of his own, and a pardon, if he stops.", hint:"Renown +2 · he might take it", fx:{renown:2, kadeOffer:true, n_c5:1}, go:"nextday"},
  {label:"Tell him exactly what the Tide Gate will do to his fleet.", hint:"Defense +2 · he stops laughing", fx:{defense:2, n_c5:1}, go:"nextday"},
  {label:"Ask him about the lantern.", hint:"Learn what Varga wants", fx:{vargaLantern:true}, go:"nextday"}
]},
c5d4:{ title:"Letters from Home", text:()=>`
${F("c5family")==="all"?`<p>On the fourth day you take ${CHILD()} down to the beach below the Gate, where the sand is white. ${CPc("sub")} builds a castle, the way children do, a lump with a tower. The tide comes in. Every other castle on the beach melts. ${CHILD()}'s does not. The water goes around it, politely, as if it isn't there.</p>
<p>${CHILD()} looks up at you, very pleased. You look at the castle for a long time.</p>`
:`<p>A letter comes from home, in your father's hand: ${CHILD()} has said a whole sentence, which was ${say(`"Where is the stone person,"`)} meaning you. ${F("fatherHere")?`And underneath, smaller: ${say(`"The child sings to the walls at night. They hum back. I am not imagining it. Come home soon."`)}`:""}</p>`}`,
choices:[
  {label:"Say nothing about it. Not yet.", hint:"Morale +1", fx:{morale:1, sawSpark:true}, go:"nextday"},
  {label:"Write it in the book of firsts.", hint:"Craft +1", fx:{craft:1, sawSpark:true}, go:"nextday"}
]},
c5c1:{ title:"The Spring Tide", enter(){ crisisEnter(); }, text:()=>`
<p>The highest tide of the year comes on the fifth night, with a storm behind it, and the Tide Gate wakes up all at once. You feel it from your bed in the harbor tower: a mile of stone stretching like a waking animal.</p>
<p>The great bronze gates begin to swing shut. Outside them, running for the harbor ahead of the storm, are thirty Saelmar fishing boats. And behind the fishing boats, using them as cover, are Kade's black sails.</p>
${sys("CRISIS",`[The Spring Tide]<br>The Gate is closing · the fleet is outside · the corsairs are coming`,"warn")}`,
choices:()=>[
  {label:"Run out along the wall and hold the gates open with your hands on the hinges.", hint:"Keystone · Craft", fx:{n_c5:S.stats.craft>=16?2:1}, go:"c5c2"},
  {label:"Get to the keeper's chair in the tower and ask the Gate to wait.", hint:F("c5chair")?"You've sat there before":"You don't know the way", fx:{n_c5:F("c5chair")?2:1}, go:"c5c2"},
  {label:"Light every lamp on the wall so the fishing boats can find the gap.", hint:"Tamsin's sailors know this", fx:{n_c5:1}, go:"c5c2"}
]},
c5c2:{ title:"Black Sails", text:()=>`
<p>The fishing boats come through the gap one after another, the last one so close the bronze scrapes paint off its stern. And right behind them, Kade's fleet: nine ships, low and fast, guns run out, heading for the harbor while the Gate stands half open.</p>
<p>The eldest admiral is beside you on the wall, shouting over the wind. ${say(`"Close it on them! Close it now!"`)}</p>`,
choices:()=>[
  ...(F("c5chain")?[{label:"Raise the harbor chain.", hint:"You built it for this", fx:{n_c5:2, c5how:"chain"}, go:"c5c3"}]:[]),
  {label:"Close the Gate on them, as the admirals ask.", hint:"It will work · not everyone will live", fx:{n_c5:2, resent:1, c5how:"gate"}, go:"c5c3"},
  {label:"Let Tamsin take the Saelmar ships out to meet them.", hint:"A sea fight", fx:{n_c5:1, c5how:"ships"}, go:"c5c3"},
  ...(F("kadeOffer")?[{label:"Signal Kade: the offer still stands.", hint:"Will he take it now?", fx:{n_c5:2, c5how:"kade"}, go:"c5c3"}]:[])
]},
c5c3:{ title:"The Gate Itself", text:()=>`
<p>${({chain:"The chain rises out of the water in a long silver line, every link as thick as a man, and Kade's lead ship hits it at full speed and stops dead. The others turn, too late, and strike their sails.",gate:"The bronze gates close like a fist. Two of Kade's ships are caught in them. The sound is terrible. The other seven strike their colors at once.",ships:"Tamsin's ships go out into the storm and the fight is long and close and lit by lightning, and at the end of it Kade's flagship is burning and the rest are running.",kade:"For a long moment nothing happens. Then Kade's flagship drops its black sail, and runs up a white one, and the others follow. Across the water, you can hear him laughing."})[F("c5how")||"ships"]}</p>
<p>But the Gate is still awake. It is still moving, opening and closing by itself, a mile of Elder stone that doesn't know what it's for anymore, and the storm surge is coming up the harbor.</p>`,
choices:[
  {label:"Sit in the keeper's chair and Listen until it remembers.", hint:"The Keystone way", fx:{n_c5:2, c5end:"listen"}, go:"c5c4"},
  {label:"Teach Saelmar's own engineers to work the Gate by hand, tonight, in the storm.", hint:"Renown +3 · it will be theirs", fx:{n_c5:1, renown:3, c5end:"teach"}, go:"c5c4"},
  {label:"Close it for good. No more tides.", hint:"Safe · Saelmar's harbor will silt up in fifty years", fx:{n_c5:1, c5end:"close"}, go:"c5c4"}
]},
c5c4:{ title:"Morning in the Harbor", enter(){ const o=outcome("c5"); S.flags.c5result=o; if(o==="great") add({renown:6, unity:2}); else if(o==="good") add({renown:3}); else add({renown:1, morale:-1}); S.phase="open"; S.flags.away=false; }, text:()=>`
<p>${F("c5end")==="listen"?`You sit in the keeper's chair until dawn with your palms on the stone, and in the grey light you finally hear it: it was built to breathe with the moon, and it lost count. You count with it, out loud, like teaching a child, until it remembers.`:F("c5end")==="teach"?`By dawn there are twelve Saelmar engineers who can work the Gate by hand, soaked to the skin, laughing, and the Gate is theirs again, as it should have been all along.`:`The Gate closes and stays closed. Saelmar's harbor is safe. It is also, for the first time in a thousand years, still.`}</p>
<p>${({great:"Not a single Saelmar ship is lost. The admirals give you the freedom of the city, which turns out to mean you never have to pay for fish again.",good:"Saelmar lost two ships and the lower quay, but the city stands, and the admirals sign anything you put in front of them.",hard:"Saelmar lost half its fishing fleet. The admirals thank you, stiffly, and Tamsin does not speak for a whole day."})[F("c5result")]}</p>
${F("c5how")==="kade"?`<p>Kade comes ashore under his white flag, bows to you, and asks where his harbor is. You give him Saltford's old fishing quay, and a pardon, and a job. ${say(`"Escort for every realm ship on the southern sea,"`)} you tell him. He laughs for a whole minute.</p>`:""}
${sys("CRISIS OVER",`[${({great:"Saelmar saved",good:"Saelmar stands",hard:"A costly tide"})[F("c5result")]}]<br>Kade's fleet is broken · Varga loses his sea`)}`,
choices:[{label:"Sail home.", go:"c5season"}]},
c5season:{ title:"Part Two: Spring at Home", enter(){ seasonEnter(); }, text:()=>`
<p>You come home up the river on a Saelmar ship, and the realm comes out on both banks to watch it pass. ${F("c5family")!=="all"?`${CHILD()} is waiting on the quay with ${SPN()||"your father"}, and runs at you so hard you both fall down.`:""}</p>
${sys("SPRING",`Five weeks · three works a week · great cities are open<br>${nextTierText()}`)}`,
choices:[{label:"Plan the first week.", go:"plan"}]},
c5w1:{ title:"Shipwrights", text:()=>`
<p>Saelmar's admirals send you a gift in the first week: forty shipwrights, with their families and their tools, who have agreed to live in ${RN()} for five years and teach anyone who wants to learn how to build ships that can cross an ocean.</p>`,
choices:[
  {label:"Settle them at Saltford and start a shipyard.", hint:S.lv.saltford>0?"Saltford grows":"Found Saltford free", fx:{renown:2}, then:()=>{ if(S.lv.saltford===0) S.lv.saltford=1; else if(S.lv.saltford<maxLv()) S.lv.saltford++; }, go:"nextweek"},
  {label:"Settle them in Overbrack, at the bridge, between both banks.", hint:"Unity +4", fx:{unity:4}, go:"nextweek"},
  {label:"Ask them to teach the Realm Builders first.", hint:"Craft +1 · Timber +6", fx:{craft:1, timber:6}, go:"nextweek"}
]},
c5w2:{ title:"The Saelmar Treaty", text:()=>`
<p>The Saelmar treaty arrives by ship in the second week, forty pages long, in three languages, beautifully illuminated. It offers ${RN()} free passage for its ships in every Saelmar port, and Saelmar free passage on the river, and a promise: if anyone attacks either, the other comes.</p>
<p>Marren reads all forty pages. Ostrow reads the last page first. ${say(`"There's a clause about iron,"`)} he says. ${say(`"There's always a clause about iron."`)}</p>`,
choices:[
  {label:"Sign it as it is.", hint:"Renown +3 · Coin +6 a week for this season", fx:{renown:3, coin:6, treaty:"signed"}, go:"nextweek"},
  {label:"Strike the iron clause, then sign.", hint:"Renown +2 · Ostrow ◆", fx:{renown:2, aff_ostrow:1, treaty:"amended"}, go:"nextweek"},
  {label:"Sign it, and add a clause: the Tide Gate's engineers may study at the Deep Forge.", hint:"Craft +1 · Renown +3", fx:{craft:1, renown:3, treaty:"study"}, go:"nextweek"}
]},
c5w3:{ title:"A Royal Charter", text:()=>`
<p>The council meets in the third week to decide which city will be the first great city of the realm. It takes six hours. Everyone wants it to be theirs. In the end, Marren suggests, wearily, that it should be the one with the most roads leading into it, and everyone looks at the map, and everyone sighs.</p>`,
choices:()=>[
  {label:"Brackenfold, the capital.", hint:S.lv.brack>=4&&S.lv.brack<5?"Brackenfold grows into a great city":"Renown +3", fx:{renown:3}, then:()=>{ if(S.lv.brack===4) S.lv.brack=5; }, go:"nextweek"},
  {label:"Velm, on the east bank, so the east has the first one.", hint:S.lv.velm>=4?"Velm grows into a great city · Unity +4":"Unity +4", fx:{unity:4}, then:()=>{ if(S.lv.velm===4) S.lv.velm=5; else if(S.lv.velm>0&&S.lv.velm<4) S.lv.velm++; }, go:"nextweek"},
  {label:"Neither. Every town grows at its own pace.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"}
]},
c5w4:{ title:"Tamsin's Choice", text:()=>`
<p>Tamsin finds you on the quay at Saltford at the end of the fourth week, watching the shipwrights work. ${say(`"The admirals have offered me a seat,"`)} she says. ${say(`"The tenth seat. They made a new one."`)} She does not look at you. ${say(`"I said I'd think about it. I've been thinking about it for three weeks. I keep thinking about your kid's sandcastle instead."`)}</p>`,
choices:[
  {label:`"Take the seat. Saelmar needs you. Come home for every birthday."`, hint:"Renown +3 · Tamsin goes home, an admiral", fx:{renown:3, tamsin:"saelmar"}, go:"nextweek"},
  {label:`"Stay. Be the realm's first admiral. We'll build you a fleet."`, hint:"Defense +4 · Tamsin stays", fx:{defense:4, tamsin:"realm", aff_tamsin:2}, go:"nextweek"},
  {label:`"Do both. Be the bridge between us."`, hint:"Unity +2 · Renown +2", fx:{unity:2, renown:2, tamsin:"both"}, go:"nextweek"}
]},
c5w5:{ title:"Planting", text:()=>`
<p>In the last week of spring you plant the manor's kitchen garden with ${CHILD()}, who is three now, and has strong views about where the beans go. ${CPc("sub")} pats the earth down over every seed and then puts ${CP("pos")} ear to the ground to listen.</p>
<p>${say(`"What are you listening for?"`)} you ask.</p>
<p>${say(`"The stones,"`)} ${CHILD()} says, as if it's obvious. ${say(`"They're all talking. They've been talking since the boat. They're excited."`)}</p>`,
choices:[{label:"Kneel down and listen too.", hint:"Morale +2", fx:{morale:2, sawSpark:true}, go:"nextweek"}]},
c5close:{ title:"A Visitor at Night", text:()=>`
${F("ending")==="keeper"?`<p>On the last night of spring, the Storm Engine sings. Not a storm: a note, one long low note from the Cage of Arches on the border, that you can feel in the floor of the manor fifty miles away. Fen rides to the Engine at dawn and lays his hands on the seam, and comes back with three pages of writing in a hand that isn't his. Wren's hand.</p>
<p>The first line says: ${say(`"Tell the Keystone. They're all waking. Come and see."`)}</p>`
:`<p>On the last night of spring, someone knocks at the manor door at midnight. You open it, and Wren is standing there in a hooded coat, exactly the same as the day you first met in the Garden, not a day older, holding a lantern that isn't lit.</p>
<p>${say(`"Hello, Keystone,"`)} Wren says. ${say(`"I should have come sooner. I needed to be sure. They're all waking, every one of them. I think it's time I told you what they're for."`)}</p>`}`,
choices:[{label:"End of Chapter Five.", go:"summary5"}]},
summary5: chapterSummary(5, ()=>`<p>The Tide Gate breathes with the moon again${F("c5end")==="close"?", or rather it doesn't: it is closed for good":""}. ${({great:"Saelmar didn't lose a single ship.",good:"Saelmar lost little, and remembers who came.",hard:"Saelmar paid dearly, but it stands."})[F("c5result")]} ${({saelmar:"Tamsin sits on the admirals' council.",realm:"Tamsin is the realm's first admiral.",both:"Tamsin sails between both, and complains about it constantly."})[F("tamsin")||"both"]} And ${CHILD()} hears the stones.</p>`, "Chapter Six: The Sleeping Wonders", "c6open"),

/* ============================ CHAPTER SIX: THE SLEEPING WONDERS ============================ */
c6open:{ title:"The Sleeping Wonders", enter(){ chapterEnter(6); }, text:()=>`
<p>${F("ending")==="keeper"?"Fen reads Wren's pages aloud in the manor library, by candlelight.":"Wren sits by the fire in the manor library and talks until dawn."} You listen, and so does Fen, and so does ${SPN()||"your father"}, and somewhere above you ${CHILD()} is asleep with ${CP("pos")} hand flat against the nursery wall.</p>
<p>${say(`"The Elders didn't build Wonders,"`)} ${F("ending")==="keeper"?"Wren writes":"Wren says"}. ${say(`"They built one Wonder, and broke it into pieces, and hid the pieces all over the world so no one could ever hold all of it. The Garden. The Storm Engine. The Tide Gate. The Deep Forge. A dome over the old college. And in the north, under the mountains, the Lantern of Kell, which is the eye. Whoever wakes the Lantern can see every other piece. And speak to it."`)}</p>
<p>${say(`"Varga is digging for it,"`)} you say. ${say(`"Yes,"`)} says Wren. ${say(`"He has been for three years. And he's close."`)}</p>`,
choices:[
  {label:`"Then we go north. Now."`, hint:"Defense +2", fx:{defense:2, c6start:"now"}, go:"c6days"},
  {label:`"What is a Keystone, Wren? Really?"`, hint:"Craft +1 · the answer matters", fx:{craft:1, c6start:"ask", askedKeystone:true}, go:"c6days"},
  {label:`"What about my child?"`, hint:"Wren goes quiet", fx:{c6start:"child", askedChild:true}, go:"c6days"}
]},
c6days:{ title:"Preparations", enter(){ daysEnter(); }, text:()=>`
