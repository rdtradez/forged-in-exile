<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="description" content="An exiled noble, the magic of builders, and a frontier town to raise. Book Two: found a realm, build a manor, start a family.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>html{color-scheme:dark}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Forged in Exile II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cinzel+Decorative:wght@700&family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow reading column like a manhwa panel strip; glowing "system windows" for stats; the village appears as an ink survey sketch on parchment. Dark only, by design. */
:root{
  --ink:#0e1116; --panel:#171b23; --paper:#e8e3d6; --muted:#8f97a6;
  --ember:#e0a54a; --rune:#6fd3ff; --danger:#e0605a; --line:#2a303c;
  --sk-paper:#e4d9bf; --sk-ink:#2e261a; --sk-ghost:rgba(46,38,26,.32); --sk-wash:#c9873a; --sk-water:#6f95a8;
  --display:"Cinzel Decorative","Trajan Pro",Georgia,serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  --sys:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:18px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;padding-block:24px 96px;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mark{font-family:var(--display);font-size:15px;color:var(--ember);letter-spacing:.06em}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--sys);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:4px}
.ghost:hover,.ghost:focus-visible{color:var(--paper);border-color:var(--muted);outline:none}
.ghost[aria-pressed=true]{color:var(--rune);border-color:var(--rune)}
.chapter{font-family:var(--sys);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-size:clamp(32px,8vw,52px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:24px;line-height:1.25;margin:0;color:var(--ember);text-wrap:balance}
.story{display:flex;flex-direction:column;gap:16px}
.story p{margin:0}
.story em{color:#f3dfb8}
.say{color:#f3dfb8}
.sys{border:1px solid var(--rune);background:linear-gradient(180deg,rgba(111,211,255,.10),rgba(111,211,255,.03));
  box-shadow:0 0 0 1px rgba(111,211,255,.15),0 0 24px rgba(111,211,255,.18);border-radius:3px;padding:12px 14px;
  font-family:var(--sys);font-size:14px;line-height:1.5;color:var(--rune);animation:pop .5s ease-out}
.sys b{display:block;font-size:11px;letter-spacing:.18em;opacity:.75;margin-bottom:4px}
.sys.warn{border-color:var(--danger);color:#ffb3ae;background:rgba(224,96,90,.08);box-shadow:0 0 20px rgba(224,96,90,.15)}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.choice{text-align:left;background:var(--panel);color:var(--paper);border:1px solid var(--line);border-left:3px solid var(--ember);
  padding:14px 16px;border-radius:2px;font-size:17px;line-height:1.45;transition:background .15s,border-color .15s}
.choice:hover,.choice:focus-visible{background:#1f2430;border-color:var(--ember);outline:none}
.choice small{display:block;font-family:var(--sys);font-size:11px;letter-spacing:.05em;color:var(--muted);margin-top:4px;line-height:1.5}
.choice[disabled]{opacity:.42;cursor:not-allowed;border-left-color:var(--line)}
.choice.build{border-left-color:var(--rune)}
.choice.claim{border-left:3px double var(--ember);background:linear-gradient(90deg,rgba(224,165,74,.10),transparent 60%),var(--panel)}
.choice.trade{border-left-color:var(--muted);font-size:15px;padding:10px 14px}
.choice.build:hover,.choice.build:focus-visible{border-color:var(--rune)}
.field{display:flex;flex-direction:column;gap:6px}
label{font-family:var(--sys);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text]{font:inherit;background:var(--panel);color:var(--paper);border:1px solid var(--line);padding:12px;border-radius:2px;width:100%;box-sizing:border-box}
input[type=text]:focus{outline:2px solid var(--ember);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 90px;background:var(--panel);color:var(--paper);border:1px solid var(--line);padding:10px;border-radius:2px}
.seg button[aria-pressed=true]{border-color:var(--ember);color:var(--ember)}
.primary{background:var(--ember);color:#1a1206;border:0;padding:14px 18px;border-radius:2px;font-weight:600;font-size:17px}
.primary:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.res{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--sys);font-size:12px;color:var(--muted);letter-spacing:.04em}
.res span b{color:var(--paper);font-variant-numeric:tabular-nums}
.crews{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.crew-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--sys);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rune)}
.crew-head span:last-child{color:var(--muted);letter-spacing:.06em}
.crew-row{display:grid;grid-template-columns:1fr auto 74px;align-items:center;gap:10px}
.crew-name{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.crew-name strong{font-size:16px;font-weight:600}
.crew-name span{font-family:var(--sys);font-size:11px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.step{width:34px;height:34px;border-radius:2px;border:1px solid var(--line);background:#11151c;color:var(--paper);font-family:var(--sys);font-size:18px;line-height:1}
.step:hover:not([disabled]),.step:focus-visible{border-color:var(--rune);color:var(--rune);outline:none}
.step[disabled]{opacity:.35;cursor:not-allowed}
.stepper output{min-width:18px;text-align:center;font-family:var(--sys);font-variant-numeric:tabular-nums}
.crew-out{font-family:var(--sys);font-size:12px;color:var(--rune);text-align:right;font-variant-numeric:tabular-nums}
.crew-last{font-family:var(--sys);font-size:12px;color:var(--ember)}
.codex{background:var(--sk-paper);color:var(--sk-ink);border-radius:2px;padding:14px;box-shadow:inset 0 0 40px rgba(120,90,40,.35),0 6px 18px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px}
.codex h3{margin:0;font-family:var(--hand);font-size:22px;font-weight:700;line-height:1.2}
.page{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start;border-top:1px solid rgba(46,38,26,.25);padding-top:12px}
.page-art svg{width:100%;height:auto;display:block}
.page-art text{font-family:var(--hand);fill:var(--sk-ink)}
.page h4{margin:0;font-family:var(--hand);font-size:22px;line-height:1.1}
.page h4 span{font-size:16px;opacity:.6;font-style:italic}
.page p{margin:4px 0 0;font-size:15px;line-height:1.5}
.page .unl{font-family:var(--sys);font-size:11px;letter-spacing:.04em;color:#7a4a12}
.page.locked{opacity:.55}
@media (max-width:420px){.page{grid-template-columns:1fr}.page-art{max-width:160px}}
.tierbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 14px}
.tierbar b{display:block;font-family:var(--display);color:var(--ember);font-size:17px}
.tierbar span{font-family:var(--sys);font-size:11px;color:var(--muted)}
.pips{display:flex;gap:5px}.pips i{width:12px;height:12px;border:1px solid var(--ember);transform:rotate(45deg)}.pips i.on{background:var(--ember)}
.res small{color:var(--muted)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare figure{margin:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.compare figcaption{font-family:var(--sys);font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em}
@media (max-width:520px){.compare{grid-template-columns:1fr}}
.chapters{display:flex;flex-direction:column;gap:12px}
.chap{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;color:var(--paper)}
.chap-n{font-family:var(--display);color:var(--ember);font-size:16px;text-align:center;padding-top:2px}
.chap-body{min-width:0}
.chap-body b{font-family:var(--body);font-size:16px}
.chap-body span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.chap-body p{margin:4px 0 0;font-family:var(--body);font-size:14px;line-height:1.5;color:var(--muted)}
.chap.now .chap-body b{color:var(--rune)}
.chap.soon{opacity:.6}
.chron{background:var(--sk-paper);color:var(--sk-ink);border-radius:2px;padding:16px 18px;box-shadow:inset 0 0 40px rgba(120,90,40,.35),0 6px 18px rgba(0,0,0,.4)}
.chron h3{margin:0;font-family:var(--hand);font-size:26px}
.chron-sub{margin:2px 0 10px;font-size:13px;font-style:italic;opacity:.7}
.chron ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.45}
.chron-sign{margin:12px 0 0;font-family:var(--hand);font-size:20px}
.cast{display:flex;gap:10px;flex-wrap:wrap}
.cast figure{margin:0;width:88px;display:flex;flex-direction:column;gap:4px;animation:pop .45s ease-out}
.cast svg{width:88px;height:auto;display:block;border-radius:2px;box-shadow:0 4px 12px rgba(0,0,0,.45)}
.cast figcaption{font-family:var(--sys);font-size:10px;letter-spacing:.06em;color:var(--muted);text-align:center;line-height:1.3}
.seg.mode button{display:flex;flex-direction:column;gap:2px;text-align:left;flex:1 1 200px;padding:12px}
.seg.mode button b{font-size:16px}
.seg.mode button small{font-family:var(--sys);font-size:11px;color:var(--muted);line-height:1.45}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.slot.now .slot-info b{color:var(--ember)}
.slot-info{min-width:0;display:flex;flex-direction:column;gap:2px}
.slot-info b{font-family:var(--body);font-size:15px;color:var(--paper)}
.slot-info span{font-size:12px;color:var(--muted)}
.slot-btns{display:flex;gap:6px}
.slot-new{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.replay{margin-top:6px}
@media (prefers-reduced-motion:reduce){.cast figure{animation:none}}
.maptabs{display:flex;gap:6px;margin-bottom:-6px}
.guild{border:1px solid var(--ember);background:linear-gradient(180deg,rgba(224,165,74,.10),rgba(224,165,74,.03));border-radius:3px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;animation:pop .5s ease-out}
.guild-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--sys);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember)}
.guild-head span:last-child{color:var(--muted);letter-spacing:.06em}
.guild-row{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.guild-row i{font-style:normal;color:var(--ember);font-size:15px;line-height:1.3;text-align:center}
.guild-row b{display:block;font-weight:600;font-size:16px;line-height:1.35}
.guild-row small{display:block;font-family:var(--sys);font-size:11px;color:var(--muted);line-height:1.45}
.guild-row.idle b{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);width:min(560px,calc(100% - 32px));box-sizing:border-box;
  background:var(--panel);border:1px solid var(--ember);border-radius:4px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.55);
  display:flex;flex-direction:column;gap:4px;z-index:50;transition:transform .35s ease-out;cursor:pointer;color:var(--paper)}
#toast.show{transform:translate(-50%,0)}
#toast b{font-family:var(--sys);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ember)}
#toast span{font-size:15px;line-height:1.4}
#toast small{font-family:var(--sys);font-size:10px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.guild{animation:none}}
.crew-note{font-size:14px;color:var(--muted);font-style:italic}
/* stat sheet */
.sheet{background:var(--panel);border:1px solid var(--rune);border-radius:3px;padding:16px;font-family:var(--sys);font-size:13px;color:var(--rune);box-shadow:0 0 24px rgba(111,211,255,.15)}
.sheet h3{margin:0 0 10px;font-size:11px;letter-spacing:.2em}
.row{display:grid;grid-template-columns:100px 1fr 28px;align-items:center;gap:10px;margin:6px 0}
.bar{height:6px;background:#0b1a22;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rune)}
.row.bad .bar i{background:var(--danger)}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.sheet .note{color:var(--muted);margin-top:10px;font-size:12px}
/* survey sketch */
.survey{background:var(--sk-paper);border-radius:2px;padding:10px;box-shadow:inset 0 0 40px rgba(120,90,40,.35),0 6px 18px rgba(0,0,0,.4);transform:rotate(-.4deg)}
.survey svg{display:block;width:100%;height:auto}
.survey text{font-family:var(--hand);fill:var(--sk-ink)}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
.smoke{animation:drift 3.5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-3px);opacity:.35}}
.ad{border:1px dashed var(--muted);color:var(--muted);font-family:var(--sys);font-size:12px;text-align:center;padding:28px 12px;border-radius:2px}
.fade{animation:fade .45s ease-out}
@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sys,.fade,.wheel,.smoke{animation:none}}
.choice.build.manor{border-left-color:var(--ember);background:linear-gradient(90deg,rgba(224,165,74,.08),transparent 60%),var(--panel)}
svg.realm,svg.manor{display:block;width:100%;height:auto;border-radius:2px;box-shadow:inset 0 0 40px rgba(120,90,40,.35),0 6px 18px rgba(0,0,0,.4)}
svg.realm text,svg.manor text{paint-order:stroke;stroke:var(--sk-paper);stroke-width:3px;stroke-linejoin:round}
.beforeafter{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.beforeafter figure,.manor-fig{margin:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.beforeafter figcaption,.manor-fig figcaption{font-family:var(--sys);font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em}
@media (max-width:520px){.beforeafter{grid-template-columns:1fr}}
#toast:not(.show){visibility:hidden;transition:transform .35s ease-out,visibility 0s .35s}
.guild.town{border-color:var(--rune);background:linear-gradient(180deg,rgba(111,211,255,.08),rgba(111,211,255,.02))}.guild.town .guild-head span:first-child,.guild.town .guild-row i{color:var(--rune)}
.choice.guildpick{border-left-color:var(--ember);background:linear-gradient(90deg,rgba(224,165,74,.12),transparent 70%),var(--panel)}
.choice.petition{border-left-color:var(--rune);background:linear-gradient(90deg,rgba(111,211,255,.10),transparent 70%),var(--panel)}
.choice.special{border-left:3px double var(--rune)}
.choice.built-pays{border-left:3px solid #8fd18a;background:linear-gradient(90deg,rgba(143,209,138,.10),transparent 70%),var(--panel)}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">Forged in Exile II</div>
    <div class="hbtns">
      <button class="ghost" id="btnMap" type="button" aria-pressed="false">Realm</button>
      <button class="ghost" id="btnChapters" type="button" aria-pressed="false">Chapters</button>
      <button class="ghost" id="btnMarks" type="button" aria-pressed="false">Marks</button>
      <button class="ghost" id="btnStats" type="button" aria-pressed="false">Status</button>
      <button class="ghost" id="btnSaves" type="button" aria-pressed="false">Saves</button>
      <button class="ghost" type="button" onclick="location.href='index.html'">Book One</button>
      <button class="ghost" type="button" onclick="location.href='book3.html'">Book Three</button>
      <button class="ghost" type="button" onclick="location.href='transfer.html'">Move saves</button>
      <button class="ghost" id="btnSound" type="button" aria-pressed="false">Sound off</button>
      <button class="ghost" id="btnInstall" type="button" hidden>Install</button>
    </div>
  </header>
  <div id="mapBox" hidden></div>
  <div id="chaptersBox" hidden></div>
  <div id="marksBox" hidden></div>
  <div id="savesBox" hidden></div>
  <div id="sheetBox" hidden></div>
  <main id="view" aria-live="polite"></main>
</div>

<script>
/* ================================================================
   FORGED IN EXILE, BOOK TWO: THE REALM ENGINE
   Book One built a town. Book Two builds a kingdom.
   1. S holds the realm: settlements, roads, resources, unity,
      the family and the manor.
   2. Each week every settlement produces by its kind and size,
      but only at full strength if a road links it to the capital.
   3. Works are region-scale: roads and bridges, founding and
      growing settlements, paving highways, each settlement's own
      landmark, great works, and the manor.
   4. CH describes each chapter: its days, its crisis, its season.
   ================================================================ */
const SITES = {
  brack:     {name:"Brackenfold",   x:132, y:150, bank:"w", kind:"trade", start:4},
  marrow:    {name:"Marrow Ford",   x:74,  y:98,  bank:"w", kind:"farm",  start:2},
  hollin:    {name:"Hollin Cross",  x:58,  y:42,  bank:"w", kind:"trade", start:3},
  woodsedge: {name:"Woodsedge",     x:126, y:62,  bank:"w", kind:"timber",start:1},
  greenreach:{name:"Greenreach",    x:44,  y:178, bank:"w", kind:"farm",  start:0},
  over:      {name:"Overbrack",     x:246, y:156, bank:"e", kind:"trade", start:3},
  velm:      {name:"Velm",          x:300, y:110, bank:"e", kind:"trade", start:3},
  karsk:     {name:"Karsk",         x:346, y:58,  bank:"e", kind:"iron",  start:1},
  coldwater: {name:"Coldwater",     x:300, y:208, bank:"e", kind:"farm",  start:1},
  ironvale:  {name:"Ironvale",      x:370, y:134, bank:"e", kind:"iron",  start:0},
  highmeadow:{name:"Highmeadow",    x:258, y:58,  bank:"e", kind:"farm",  start:0},
  stonegate: {name:"Stonegate",     x:360, y:200, bank:"e", kind:"stone", start:0},
  saltford:  {name:"Saltford",      x:198, y:262, bank:"w", kind:"port",  start:0},
  northwatch:{name:"Northwatch",    x:176, y:30,  bank:"w", kind:"stone", start:0, ch:2},
  deepforge: {name:"Deepforge",     x:392, y:100, bank:"e", kind:"iron",  start:0, ch:4},
  gullhaven: {name:"Gullhaven",     x:268, y:250, bank:"e", kind:"port",  start:0, ch:5},
  reedmere:  {name:"Reedmere",      x:236, y:212, bank:"e", kind:"farm",  start:0, ch:9}
};
const EDGES = [["brack","over"],["brack","marrow"],["brack","hollin"],["brack","woodsedge"],["marrow","hollin"],["marrow","greenreach"],["brack","greenreach"],
  ["brack","saltford"],["over","saltford"],["over","velm"],["velm","karsk"],["velm","highmeadow"],["karsk","ironvale"],["velm","ironvale"],["over","coldwater"],
  ["coldwater","stonegate"],["velm","stonegate"],["woodsedge","highmeadow"],["coldwater","saltford"],["karsk","highmeadow"],
  ["woodsedge","northwatch"],["hollin","northwatch"],["northwatch","highmeadow"],["ironvale","deepforge"],["karsk","deepforge"],
  ["coldwater","gullhaven"],["saltford","gullhaven"],["over","reedmere"],["reedmere","coldwater"],["reedmere","gullhaven"]];
const LVL_NAME = ["Site","Hamlet","Village","Town","City","Great City"];
const LVL_POP  = [0,20,60,150,350,700];
const maxLv = k => k==="brack" ? (S.chapter>=5?5:4) : S.chapter>=7 ? 5 : S.chapter>=5 ? (has("lm:"+k)?5:4) : S.chapter>=3 ? 4 : 3;   // towns may grow bigger as the book goes on; early great cities need their landmark
const lvName = k => k==="brack"&&S.lv[k]>=4 ? (S.lv[k]>=5?"Royal Capital":"Capital") : LVL_NAME[S.lv[k]];

function yieldOf(k){
  const L=S.lv[k], s=SITES[k], y={};
  if(!L) return y;
  const base = {farm:{grain:5*L}, timber:{timber:4*L}, iron:{iron:2*L, stone:L}, trade:{coin:Math.round(1.5*L)}, port:{coin:Math.round(1.5*L), grain:2*L}, stone:{stone:4*L}}[s.kind];
  Object.assign(y, base);
  const plus=(r,v)=>{ y[r]=(y[r]||0)+v; };
  if(k==="brack"){ plus("stone",8); plus("timber",10); plus("grain",10); }
  if(s.kind==="farm"||s.kind==="stone") plus("timber",L);
  if(F("manorSite")==="garden" && k==="brack") plus("grain",2);
  if(F("manorSite")==="island" && k==="brack") plus("coin",2);
  if(F("tolls")==="free" && s.kind==="trade") y.coin=Math.max(0,y.coin-1);
  if(F("tolls")==="treasury" && k==="brack") plus("coin",3);
  if(has("karskWorks") && k==="karsk") plus("iron",4);
  if(has("granaries") && s.kind==="farm") plus("grain",2);
  if(has("riverHarbor") && k==="saltford") plus("coin",4);
  if(has("realmBank") && k==="brack") plus("coin",4);
  if(k==="brack"){ if(has("royalMint")) plus("coin",4); if(has("bridgePalace")) plus("coin",3); if(has("conservatory")) plus("grain",4); }
  if(S.spec && S.spec[k]) for(const r in SPEC[S.spec[k]].y) plus(r, SPEC[S.spec[k]].y[r]);
  if(has("lm:"+k)) for(const r in LANDMARK[k].y) plus(r, LANDMARK[k].y[r]);
  const pv=S.paved.filter(e=>e.split("~").includes(k)).length; if(pv) plus("coin",pv);
  if(F("winter") && s.kind==="farm") y.grain=Math.round(y.grain*.4);
  const m = (connected().has(k) ? 1 : 0.5) * unityMul(s.bank) * modeMul();
  for(const r in y) y[r]=Math.round(y[r]*m);
  return y;
}

const KINDS = ["manor","capital","special","road","found","grow","landmark","pave","great"];
const WORK_ORDER = () => KINDS.flatMap(k=>Object.keys(W).filter(id=>W[id].kind===k));
function costOf(id, guild){
  const c={...val(W[id].cost)};
  if(F("surgeNext") && !guild) return {};
  if(S.mode==="builder") for(const k in c) if(c[k]>0) c[k]+=1;
  return c;
}
const workDone = id => W[id].done ? W[id].done() : has(id);
function doWork(id, guild){
  const w=W[id], cost=costOf(id,guild);
  for(const k in cost) S.stats[k]-=cost[k];
  if(F("surgeNext") && !guild){ S.flags.surgeNext=false; }
  if(w.kind==="road") S.roads.push(edgeKey(w.a,w.b));
  else if(w.kind==="pave") S.paved.push(edgeKey(w.a,w.b));
  else if(w.kind==="found") S.lv[w.site]=1;
  else if(w.kind==="grow") S.lv[w.site]=Math.min(5,S.lv[w.site]+1);
  else if(w.kind==="special"){ if(!S.spec) S.spec={}; S.spec[w.site]=w.spec; }
  else S.built.push(id);
  if(w.fx) add(w.fx);
  S.lastBuilt=id;
}
const prefix = w => ({road:w.bridge?"Bridge: ":"Road: ", pave:"Highway: ", found:"Found: ", grow:"Grow: ", great:"Great work: ", manor:"Manor: ", landmark:"Landmark: ", capital:"Capital: ", special:"Great city: "})[w.kind];
function workLabel(id){ const w=W[id];
  return w.kind==="road"||w.kind==="pave" ? `${SITES[w.a].name} to ${SITES[w.b].name}` : w.kind==="found" ? SITES[w.site].name

/* works that make no sense to show yet: anything at a place that isn't settled, highways without roads, and so on */
function relevant(id){ const w=W[id];
  if(!chOK(w) || workDone(id) || (w.show && !w.show())) return false;
  if(w.kind==="grow") return S.lv[w.site]>0;
  if(w.kind==="road") return S.lv[w.a]>0 && S.lv[w.b]>0;
  if(w.kind==="pave") return S.roads.includes(edgeKey(w.a,w.b));
  if(w.kind==="landmark") return S.lv[w.site]>=2;
  if(w.kind==="special") return S.lv[w.site]>=5;
  return true; }

    const roads=of("road"), joining=roads.filter(id=>conn.has(W[id].a)!==conn.has(W[id].b));

      : focus==="east" ? [joining, eastFirst(of("found")), eastFirst(villageGrows), eastFirst(roads), of("landmark"), of("great"), of("pave")]

    const offer=[]; groups.forEach(g=>{ if(offer.length<3 && g.length){ const pick=g[Math.floor(Math.random()*Math.min(2,g.length))]; if(!offer.includes(pick)) offer.push(pick); } });
    S.guildOffer=offer;
  }
  return (S.guildOffer||[]).filter(id=>W[id]&&relevant(id)&&(!W[id].req||W[id].req()));

function guildDo(id){

const CH_WORD = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"];

/* ---------- each town's own stores ----------
   Hamlets and villages send everything to the national stores. Towns and cities keep half of what they make, plus their own market dues,
   or all of it if no road joins them to Brackenfold, and grow themselves when their own stores can pay. */
const RVAL = {timber:1, stone:1, coin:1, grain:.5, iron:1.5};
const KEEPS = k => k!=="brack" && S.lv[k]>=3;
function localOf(k){ if(!S.local) S.local={}; if(!S.local[k]) S.local[k]={timber:0, stone:0, coin:0, grain:0, iron:0}; return S.local[k]; }
const valueOf = o => Object.entries(o).reduce((t,[r,v])=>t+v*(RVAL[r]||1),0);
/* pay a cost from a town's stores: matching goods first, then the town sells what else it has to cover the rest */
function payLocal(k, cost, limit){
  const L=localOf(k); let need=Math.min(limit===undefined?Infinity:limit, valueOf(cost)), paid=0;
  for(const r in cost){ const take=Math.min(L[r], cost[r], Math.floor(need/(RVAL[r]||1))); L[r]-=take; paid+=take*(RVAL[r]||1); need-=take*(RVAL[r]||1); }
  for(const r of ["coin","grain","timber","stone","iron"]){ if(need<=0) break; const take=Math.min(L[r], Math.ceil(need/RVAL[r])); L[r]-=take; paid+=take*RVAL[r]; need-=take*RVAL[r]; }
  return paid;
}
// the builders help a town that has saved at least half the cost itself; the realm covers the rest
const canShare = (k,cost) => { const lv=valueOf(localOf(k)), cv=valueOf(cost); if(lv < cv/2 || lv >= cv) return false; /* a town that can pay in full builds for itself */ const f=Math.max(0,1-lv/cv); return Object.entries(cost).every(([r,v])=>S.stats[r]>=Math.ceil(v*f)); };
function payShared(k, cost){
  const total=valueOf(cost), paid=payLocal(k,cost,total), f=Math.max(0,1-paid/total), nat={};
  for(const r in cost){ nat[r]=Math.ceil(cost[r]*f); S.stats[r]-=nat[r]; }
  const natTxt=Object.entries(nat).filter(([r,v])=>v>0).map(([r,v])=>`${v} ${LABEL[r]}`).join(", ");
  return `${SITES[k].name} paid ${Math.round(paid/total*100)}% from its own stores${natTxt?` · the realm paid ${natTxt}`:""}`;
}
/* split a settlement's output between its own stores and the realm's */
function produce(scale){
  const tot={}, conn=connected();
  alive().forEach(k=>{ const y=yieldOf(k);
    for(const r in y){ const v=Math.round(y[r]*scale); if(!v) continue;
      const keep = !conn.has(k) ? v : KEEPS(k) ? Math.round(v/2) : 0;
      if(keep){ localOf(k)[r]=(localOf(k)[r]||0)+keep; }
      tot[r]=(tot[r]||0)+v-keep; }
    if(KEEPS(k)) localOf(k).coin += Math.round(LVL_POP[S.lv[k]]/25*modeMul()*scale);   // the town's own market dues
    // a hamlet or village that was cut off sends its stockpile to the realm once a road reaches it
    else if(conn.has(k) && S.local && S.local[k]){ for(const r in S.local[k]){ if(S.local[k][r]>0){ tot[r]=(tot[r]||0)+S.local[k][r]; S.local[k][r]=0; } } }
  });
  for(const r in tot) S.stats[r]+=tot[r];
  return tot;
}
/* ---------- the towns petition you: a town that has saved enough asks to build; one that has saved half asks for help ---------- */
function townNext(k){ for(const id of ["grow:"+k, "lm:"+k]){ const w=W[id]; if(relevant(id) && (!w.req||w.req())) return id; } return null; }
function petitions(){
  return alive().filter(KEEPS).map(k=>{ const id=townNext(k); if(!id) return null; const cost=costOf(id,true), lv=valueOf(localOf(k)), cv=valueOf(cost);
      if(lv>=cv) return {k, id, self:true, save:lv/cv}; if(canShare(k,cost)) return {k, id, self:false, save:lv/cv}; return null; })
    .filter(Boolean).sort((a,b)=>b.save-a.save).slice(0,3);
}
function petitionDo(p){
  const cost=costOf(p.id,true), w=W[p.id]; let fx;
  if(p.self){ payLocal(p.k,cost); fx="Paid from its own stores"; } else fx=payShared(p.k,cost);
  if(w.kind==="grow") S.lv[p.k]=Math.min(5,S.lv[p.k]+1); else { S.built.push(p.id); if(w.fx) add(w.fx); }
  const what = w.kind==="grow" ? `${SITES[p.k].name} grew into a ${LVL_NAME[S.lv[p.k]].toLowerCase()}` : `${SITES[p.k].name} built ${LANDMARK[p.k].n}`;
  const when=S.phase==="season"?`Week ${S.week}`:`Day ${S.day}`;
  if(S.townLast && S.townLast.when===when && S.townLast.ch===S.chapter && S.townLast.phase===S.phase) S.townLast.ent.push({kind:"town", what, fx});
  else S.townLast={when, ent:[{kind:"town", what, fx}], ch:S.chapter, phase:S.phase};
  S.lastBuilt=p.id;
}

function buildChoices(){
  const list = WORK_ORDER().filter(relevant).map(id=>{
    const w=W[id], reqOK=!w.req||w.req(), pay=canPay(costOf(id));
    const lock = !reqOK ? ` · Locked: ${w.reqText||""}` : !pay ? " · Not enough materials" : "";
    return {label:prefix(w)+workLabel(id), hint:`${val(w.gain)} · Cost: ${costText(costOf(id))}${lock}`, req:()=>reqOK&&pay, work:id, cls:w.kind==="manor"||w.kind==="capital"?"build manor":w.kind==="special"?"build special":"build"};
  });
  const conn=connected();
  const urgent = c => ["manor","capital","special"].includes(W[c.work].kind) || W[c.work].kind==="great" && W[c.work].ch===S.chapter || (W[c.work].kind==="road" && conn.has(W[c.work].a)!==conn.has(W[c.work].b));
  const readyAll=list.filter(c=>c.req()), locked=list.filter(c=>!c.req());
  const seen={}, ready=[], more=[];
  readyAll.forEach(c=>{ const k=W[c.work].kind; if(urgent(c)) ready.push(c); else if((seen[k]=(seen[k]||0)+1)<=2) ready.push(c); else more.push(c); });
  // the guild's proposals and the towns' petitions come first: they don't use your own works
  const offers=guildOffers().map(id=>{ const w=W[id], pay=canPay(costOf(id,true));
    return {label:`Realm Builders propose: ${prefix(w)}${workLabel(id)}`, hint:`${val(w.gain)} · Cost: ${costText(costOf(id,true))} · the guild builds it, not one of your works · ${S.guildPicks||0} crew${S.guildPicks===1?"":"s"} free ${S.phase==="season"?"this week":"today"}`, req:()=>pay&&(S.guildPicks||0)>0, guild:id, cls:"build guildpick"}; });
  const pets=petitions().map(p=>{ const w=W[p.id], cost=costOf(p.id,true), what = w.kind==="grow" ? `grow into a ${LVL_NAME[Math.min(5,S.lv[p.k]+1)].toLowerCase()}` : `build ${LANDMARK[p.k].n}`;
    const f=Math.max(0,1-valueOf(localOf(p.k))/valueOf(cost)), nat=Object.entries(cost).map(([r,v])=>[r,Math.ceil(v*f)]).filter(([r,v])=>v>0).map(([r,v])=>`${v} ${LABEL[r]}`).join(", ");
    return p.self ? {label:`${SITES[p.k].name} asks to ${what}`, hint:`Paid entirely from its own stores · approve it, or leave it for another day`, petition:p, cls:"build petition"}
      : {label:`${SITES[p.k].name} asks for help to ${what}`, hint:`It pays ${Math.round((1-f)*100)}% from its own stores · the realm pays ${nat}`, petition:p, cls:"build petition"}; });
  const out=[...pets, ...offers, ...ready];
  if(more.length) out.push({label:S.showMore?`Hide ${more.length} more works`:`Show ${more.length} more works you can start`, hint:"More roads, settlements and great works", toggleMore:true, cls:"trade"});
  if(S.showMore) out.push(...more);
  if(!readyAll.length) out.push({label:"Nothing you can afford right now", hint:"Trade below, or rest and let the realm's stores fill", req:()=>false, cls:"build"});
  if(locked.length) out.push({label:S.showLocked?`Hide the ${locked.length} works you can't start yet`:`Show ${locked.length} works you can't start yet`, hint:"Locked by materials or by requirements", toggleLocked:true, cls:"trade"});
  if(S.showLocked) out.push(...locked);
  out.push(
    {label:"Keystone Surge", hint:"Your next work costs nothing · once each part of a chapter", req:()=>F("surgeKey")!==`${S.chapter}-${S.phase}`&&!F("surgeNext"), surge:true, cls:"build manor"},
    ...(S.reserve&&reserveLeft()>0&&trainWorthIt()?[{label:"Send for a wagon train from Brackenfold's old stores", hint:`${reserveText(reserveCart("train"))} · a share of what's left · once ${S.phase==="season"?"a week":"a day"} instead of a cartload`, req:()=>F("reserveKey")!==turnKey(), reserve:"train", cls:"build manor"}]:[]),
    ...(S.reserve&&reserveLeft()>0?[{label:"Draw a cartload from Brackenfold's old stores", hint:`${reserveText(reserveCart())} · once ${S.phase==="season"?"a week":"a day"} · left from Book One: ${reserveText(S.reserve)}`, req:()=>F("reserveKey")!==turnKey(), reserve:"cart", cls:"build manor"}]:[]),
    {label:"Buy iron from Saelmar traders", hint:"Coin −4 → Iron +3", req:()=>S.stats.coin>=4, trade:{coin:-4, iron:3}, cls:"trade"},
    {label:"Sell surplus grain downriver", hint:"Grain −8 → Coin +4", req:()=>S.stats.grain>=8, trade:{grain:-8, coin:4}, cls:"trade"},
    {label:"Buy timber and stone from the west", hint:"Coin −4 → Timber +4, Stone +4", req:()=>S.stats.coin>=4, trade:{coin:-4, timber:4, stone:4}, cls:"trade"},
    {label: S.phase==="season" ? "Let the realm work, and start no more this week." : "Rest today.", hint:"Save your materials for something bigger", skip:true});
  return out;
}

/* ---------- Brackenfold's old stores: everything Book One's town stockpiled, drawn a cartload at a time ---------- */
const turnKey = () => `${S.chapter}-${S.phase}-${S.day}-${S.week}`;
const reserveLeft = () => S.reserve ? Object.values(S.reserve).reduce((a,b)=>a+b,0) : 0;
function reserveCart(size){ const big = S.mode==="builder" ? 8 : 12; const c={timber:big, stone:big, coin:Math.round(big*.7), grain:big};
  // a wagon train takes a share of whatever is left: big stores send big trains, and they shrink as the stores run down
  if(size==="train"){ const share = S.mode==="builder" ? .02 : .03; for(const k in c) c[k]=Math.max(c[k], Math.round((S.reserve[k]||0)*share)); }
  for(const k in c) c[k]=Math.min(c[k], S.reserve[k]||0); return c; }
const trainWorthIt = () => S.reserve && ["timber","stone","coin","grain"].some(k=>(S.reserve[k]||0)*(S.mode==="builder"?.02:.03) > 24);
const reserveText = r => ["timber","stone","coin","grain"].filter(k=>r[k]>0).map(k=>`${LABEL[k]} ${r[k]===undefined?0:r[k].toLocaleString()}`).join(" · ") || "empty";
function drawReserve(size){ const c=reserveCart(size); for(const k in c){ S.stats[k]+=c[k]; S.reserve[k]-=c[k]; } S.flags.reserveKey=turnKey(); }
function reserveFromBookOne(d){ const st=d.stats||{}; return {timber:Math.max(0,st.timber|0), stone:Math.max(0,st.stone|0), coin:Math.max(0,st.coin|0), grain:Math.max(0,st.food|0)}; }

/* ---------- one week of the realm ---------- */
function weekly(){
  const tot=produce(1);
  S.stats.unity=Math.min(100,S.stats.unity);
  const need=upkeep(); S.stats.grain-=need;
  const lines=[`To the national stores: Grain +${tot.grain||0} · Timber +${tot.timber||0} · Stone +${tot.stone||0} · Iron +${tot.iron||0} · Coin +${tot.coin||0}`, `The realm ate ${need} grain${F("winter")?" (winter: farms yield less, people eat more)":""}`];
  if(S.stats.grain<0){ S.stats.grain=0; if(S.mode!=="story"){ S.stats.unity=Math.max(0,S.stats.unity-3); lines.push("Short rations in the villages · Unity −3"); } else lines.push("A lean week. The villages shared what they had."); }
  const cut=alive().filter(k=>!connected().has(k)); if(cut.length) lines.push(`Cut off from the capital (half output, all kept locally): ${cut.map(k=>SITES[k].name).join(", ")}`);
  const asks=petitions().length; if(asks) lines.push(`${asks} town${asks>1?"s are":" is"} asking to build · see the top of the list`);
  S.weekReport=lines.join("<br>");
}
function daily(){
  const tot=produce(1/3);
  S.stats.grain=Math.max(0, S.stats.grain-Math.ceil(upkeep()/3));
  S.lastYield=tot; S.guildNote="";
}

/* ================================================================
   BOOK TWO, CHAPTER ONE: THE ACCORD
   Prologue → the Accord is proposed → role, family, realm name, manor site
   Part One: five Accord days (two works a day) → the Vote on the Bridge
   Part Two: the first season (six weeks, three works a week) → the child arrives
   ================================================================ */
const ENDLINE = {
  builder:"The Storm Engine sleeps, healed, and Brackenfold is the Free City of Artificers.",
  keeper:"The Storm Engine sleeps with Wren inside it, and Brackenfold is the Free City of Artificers.",
  heir:"The Storm Engine sleeps under the council's key, and you hold a seat on the king's council.",
  storm:"The storm answers to you, and the great houses say your name very carefully.",
  last:"You closed the Engine from the inside, and slept a year in the light."
};
const partnerLine = () => !SPN() ? "" : S.family.partner==="caelan"
  ? `Caelan, ink on ${SPp("pos")} cuffs as always, reading over your shoulder`
  : `Isolde, a spark jumping between ${SPp("pos")} fingers when ${SPp("sub")} is impatient`;
const fatherWord = () => F("fatherHere") ? "your father" : "Lord Edric";

/* the five Accord days: one event each, after the day's work */
const DAY_EV = {1:"d1hesk", 2:"d2tolls", 3:"d3stone", 4:"d4guild", 5:"d5eve"};
/* the six weeks of the first season */
const WEEK_EV = {1:"w1settlers", 2:"w2hunger", 3:"w3nursery", 4:"w4barges", 5:"w5seren", 6:"w6waiting"};

const SCENES = {
/* ---------------------------- PROLOGUE ---------------------------- */
prologue:{ title:"A Year After the Storm", enter(){ S.phase="open"; S.chapter=1; }, text:()=>`
${F("ending")==="last" ? `<p>You wake in light. Not the white roar of the seam, but plain morning light through a window, and the smell of Bren's terrible tea.</p>
<p>A year, they tell you. You slept a whole year inside the Engine, and Fen spent that year learning to Listen to it, until he heard what it was asking for. It did not need a keeper. It needed a thousand masons' marks cut into its cage, one for every hand that helped build the wall, so that the closing belonged to everyone and not to one heart. Fen cut the last one himself. Then he opened the seam and walked you out by the hand.</p>
<p>${say(`"You're thinner,"`)} Fen says, and then he is crying, and then so are you.</p>`
: `<p>A year after the storm went to sleep, Brackenfold is the busiest town between the mountains and the sea. ${ENDLINE[F("ending")]||ENDLINE.builder}</p>
<p>From the manor window you can see the Bridge of Two Banks, the last thing the thousand masons built before they went home. Every morning carts cross it in both directions. A year ago they were shooting at each other across that water.</p>`}
${SPN()?`<p>${partnerLine()}, says, ${say(`"There's a rider from Velm. And another from the king. At the same time. That's never good."`)}</p>`:`<p>Bren knocks with his cane. ${say(`"There's a rider from Velm,"`)} he says, ${say(`"and another from the king. At the same time. That is never good."`)}</p>`}
${S.imported?sys("BOOK ONE",`[Your story carries on]<br>${esc(S.imported)}`):""}`,
choices:[{label:"See the riders.", go:"accord1"}]},

accord1:{ title:"Two Letters", text:()=>`
<p>The first letter is from Ilse Marren, First Speaker of the free council in Velm. Kastrel's crown is gone. Its king fled north with the last of his court the winter after the storm, and for a year the east bank towns have governed themselves: Overbrack, Velm, the foundry town of Karsk, the farms at Coldwater. They have voted, Marren writes, town by town. They do not want to belong to a crown again. They want to belong to Brackenfold.</p>
<p>The second letter is sealed in Aurendell blue, in King Aldric's own hand. The king cannot take the east bank without a war he does not want. He cannot leave it ungoverned on his border. So he proposes something no king of Aurendell has ever proposed. Release the west bank lands around Brackenfold from his crown, join them to the east, and let a new realm stand between the two old kingdoms. Independent. Allied. Built, he writes, ${say(`"by the only person on either bank both sides seem willing to trust."`)}</p>
<p>${F("fatherHere")?`Your father reads the king's letter twice, takes off his spectacles, and says nothing for a long time. Then: ${say(`"Aldric has been thinking about this for a year. He wants a wall made of people instead of stone."`)}`:`Bren reads the king's letter twice. ${say(`"Your father will have heard,"`)} he says. ${say(`"He'll be on the road by morning, cane or no cane."`)}`}</p>
${sys("THE ACCORD",`Both banks of the river, one realm<br>Capital: Brackenfold · the region becomes the thing you build`)}`,
choices:[
  {label:"Answer the king as a friend: an independent realm, allied to Aurendell.", hint:"Unity +4 · Aurendell will help when it can", fx:{unity:4, kingFriend:true}, go:"accord2"},
  {label:"Answer the king as an equal: independent, allied to no one.", hint:"Renown +4 · Resentment +1 · nobody owns you", fx:{renown:4, resent:1, kingEqual:true}, go:"accord2"},
  {label:"Ask your father to answer the king for you.", hint:"Your father negotiates · Coin +6 from Aurendell's treasury", fx:{coin:6, fatherNegotiates:true}, go:"accord2"}
]},

accord2:{ title:"What Kind of Realm", text:()=>`
<p>Marren comes across the bridge herself two days later, with Chancellor Ostrow at her side. Ostrow ran Kastrel's treasury for the old king, and when the king fled he simply kept running it. He is round, polite, and dressed better than anyone in Brackenfold. He shakes your hand as if he is weighing it.</p>
<p>${say(`"The towns have voted for you,"`)} Marren says. ${say(`"Not for a council. Not for Aldric. For you. So you need to tell us what you are."`)}</p>
<p>${say(`"A crown is simple,"`)} Ostrow says pleasantly. ${say(`"People understand crowns. Councils argue."`)} Marren looks at him as if he has said something very old and very stupid.</p>`,
choices:()=>[
  {label:`Take the crown. ${P("ruler")} of a new realm, with a council that can say no.`, hint:`Renown +5 · Ostrow approves · Marren is wary`, fx:{role:"crown", renown:5, aff_ostrow:1}, go:"accord3"},
  {label:"Be First Warden: you hold the realm's defense and its works, the council holds the law.", hint:"Unity +5 · Marren approves", fx:{role:"warden", unity:5, aff_marren:1}, go:"accord3"},
  {label:"Be Master Builder only. Let Marren lead the council, and build.", hint:"Unity +8 · Renown −2 · Ostrow is delighted, which should worry you", fx:{role:"builder", unity:8, renown:-2, aff_marren:2}, go:"accord3"}
]},

accord3:{ title:"The Family", text:()=>`
${SPN()?`<p>That night, on the manor roof where you go to think, ${SPN()} sits beside you with ${SPp("pos")} knees pulled up.</p>
<p>${say(`"If we're going to build a kingdom,"`)} ${SPp("sub")} says, ${say(`"I'd like there to be a reason. Someone to build it for."`)} And then, before you can answer: ${say(`"I mean a child. I've been trying to say it for a month."`)}</p>`
:`<p>That night you walk down to the Accord camp by the bridge, where east bank families sleep in wagons while the towns argue. A child is asleep on a bale of wool under a lantern, a small one, perhaps a year old, wrapped in a foundry apron. Pinned to the apron is a tin tag stamped with a number. Karsk used to tag artificers' children that way, before the collars.</p>
<p>${say(`"Nobody's claimed that one,"`)} the camp warden says. ${say(`"Third week. The mother was a smith. She didn't come back from the foundry fire."`)}</p>`}`,
choices:()=>SPN() ? [
  {label:`"Yes. Let's have a child."`, hint:"You and "+SPN()+" are expecting · the child arrives at the end of this chapter", fx:{familyPath:"expecting", morale:2, ["aff_"+S.family.partner]:2}, go:"accord4"},
  {label:`"Yes. And there's a child in the Accord camp who needs a home."`, hint:"You adopt a foundling from Karsk · Unity +3", fx:{familyPath:"adopt", unity:3, ["aff_"+S.family.partner]:2}, go:"accord4"}
] : [
  {label:"Pick the child up.", hint:"You adopt a foundling from Karsk · Unity +3 · the papers take a season", fx:{familyPath:"adopt", unity:3}, go:"accord4"},
  {label:"Ask the warden to send for you when the papers are ready.", hint:"The same, but slower and more careful · Morale +1", fx:{familyPath:"adopt", morale:1, carefulAdopt:true}, go:"accord4"}
]},

accord4:{ title:"A Name for the Realm", input:{placeholder:"Riverland", max:22, init:()=>S.realmName}, text:()=>`
<p>The council argues for a whole afternoon about the name. Overbrack wants something in Kastrel. Hollin Cross wants something in Aurendell. Karsk wants it called Karsk, which nobody takes seriously. Bren suggests ${say(`"Brackenfold and Some Other Places,"`)} and is not invited back.</p>
<p>In the end, Marren pushes the paper across the table to you. ${say(`"You name it. Then they can all be angry at you together. That's unity, of a kind."`)}</p>`,
choices:[
  {label:"Name it with what you've written above.", hint:"Type a name in the box, or keep Riverland", useInput:"realmName", go:"accord5"},
  {label:"Name it the Two Banks.", fx:{}, setRealm:"the Two Banks", go:"accord5"},
  {label:"Name it Valcrest March, after your family.", hint:"Renown +2 · the east bank grumbles · Unity −2", setRealm:"Valcrest March", fx:{renown:2, unity:-2}, go:"accord5"},
  {label:"Name it Aurelmark, after the ancestor who left you the Codex.", hint:"Craft +1", setRealm:"Aurelmark", fx:{craft:1}, go:"accord5"}
]},

accord5:{ title:"Where to Build a Home", text:()=>`
<p>For years you have lived in the old manor on the square, which was rebuilt three times and still has a draught that Bren calls historic. If ${RN()} is going to have a capital, it needs a house where the council can meet in winter, where ambassadors can be impressed, where ${S.family.path==="expecting"||F("familyPath")==="expecting"?"a child can be born":"a child can grow up"} and run in the halls.</p>
<p>You spread the survey maps on the table. Three places keep catching your eye.</p>`,
choices:[
  {label:"The hill above Brackenfold, looking down on both banks.", hint:"Defense +3 · the manor sees the whole realm", fx:{manorSite:"hill", defense:3}, go:"accord6"},
  {label:"The river island under the Bridge of Two Banks, between east and west.", hint:"Unity +4 · Brackenfold +2 coin a week from the bridge market", fx:{manorSite:"island", unity:4}, go:"accord6"},
  {label:"The edge of the Elder Garden, where the old thorns have turned to orchard.", hint:"Morale +2 · Brackenfold +2 grain a week", fx:{manorSite:"garden", morale:2}, go:"accord6"}
]},

accord6:{ title:"The Accord Days", enter(){ S.phase="days"; S.day=1; S.buildsLeft=perDay(); S.snapMap=realmSVG(true); }, text:()=>`
<p>The Accord will be signed in five days, on the Bridge of Two Banks, with every town's delegates standing on it together. Until then, everything is argument and preparation. And you, as always, build.</p>
${sys("REALM",`[Build the region, not just the city]<br>Each settlement produces by its size and kind · a settlement cut off from Brackenfold by road produces half · Unity raises everything on the east bank<br>Two works a day for five days, then the vote`)}`,
choices:[{label:"Plan the first day.", go:"plan"}]},

/* --------------------------- THE BUILD SCREENS --------------------------- */
plan:{ title:()=>S.phase==="season"?`Week ${S.week}: ${CH[S.chapter].seasonName}`:`Day ${S.day}: ${CH[S.chapter].dayName}`, text:()=>planText(), choices:()=>buildChoices()},
built:{ title:()=>S.builtBy==="guild"?"The Realm Builders finished":S.builtBy==="town"?"A town built for itself":`${prefix(W[S.lastBuilt]).replace(": ","")} finished`, text:()=>builtText(), choices:()=>[
  ...(S.buildsLeft>0||(S.guildPicks||0)>0||petitions().length?[{label:`Back to the plans (${S.buildsLeft} work${S.buildsLeft===1?"":"s"} of yours left${(S.guildPicks||0)>0?`, ${S.guildPicks} guild crew${S.guildPicks===1?"":"s"} free`:""})`, go:"plan"}]:[]),
  {label: S.buildsLeft>0||(S.guildPicks||0)>0 ? (S.phase==="season" ? "That's enough for this week." : "That's enough for today.") : "Go on.", go:"event"}
]},

/* ---------------------------- THE ACCORD DAYS ---------------------------- */
d1hesk:{ title:"The Highland Delegation", text:()=>`
<p>The highland shepherds come down from the eastern hills on the first day, forty of them in grey wool, led by a broad old woman named Aunt Hesk who walks with a crook taller than she is. The highlands were never Kastrel's, she says, and never Aurendell's. They are thinking about being ${RN()}'s, if ${RN()} is worth being part of.</p>
<p>${say(`"There's a meadow up there,"`)} Aunt Hesk says, ${say(`"high enough that the old king's tax men never found it. Sixty families could live there if anyone built a road. Nobody ever has."`)}</p>`,
choices:[
  {label:"Promise her a village at Highmeadow, and a road to it.", hint:"Found Highmeadow now · Unity +3", fx:{unity:3, hesk:"promised", aff_hesk:2}, then:()=>{ S.lv.highmeadow=Math.max(1,S.lv.highmeadow); }, go:"nextday"},
  {label:"Send seed grain and timber up the hill, and visit in the spring.", hint:"Grain −6 · Timber −4 · Unity +2 · Highmeadow later", fx:{grain:-6, timber:-4, unity:2, hesk:"helped", aff_hesk:1}, go:"nextday"},
  {label:`"Come to the vote. Then we'll talk."`, hint:"Nothing spent · Aunt Hesk is not impressed", fx:{hesk:"waiting"}, go:"nextday"}
]},

d2tolls:{ title:"Ostrow's Tolls", text:()=>`
<p>Chancellor Ostrow invites you to supper on the east bank, which in Velm is a meal of eleven courses and one question. The river tolls. For two hundred years every barge on the river has paid Kastrel to pass the narrows below Velm. That money paid the old king's soldiers, and the collars, and the foundry guards. Now it pays nothing, because nobody knows whose it is.</p>
<p>${say(`"The east bank's tolls should stay with the east bank,"`)} Ostrow says, carving a pheasant with surgical care. ${say(`"For the sake of unity, naturally."`)}</p>
<p>Marren, at the far end of the table, does not look up from her plate. That is how you know she cares about the answer.</p>`,
choices:[
  {label:"Split the tolls equally between the two banks.", hint:"Unity +5 · Coin −4", fx:{tolls:"split", unity:5, coin:-4, aff_marren:1}, go:"nextday"},
  {label:"Abolish the tolls. The river is free.", hint:"Renown +4 · Unity +3 · trade settlements earn 1 less coin a week · Ostrow is furious", fx:{tolls:"free", renown:4, unity:3, aff_ostrow:-2}, go:"nextday"},
  {label:"Tolls go to the realm's treasury in Brackenfold.", hint:"Brackenfold +3 coin a week · Unity −5 · Resentment +1", fx:{tolls:"treasury", unity:-5, resent:1, aff_ostrow:-1}, go:"nextday"}
]},

d3stone:{ title:"The First Stone", enter(){ S.flags.fatherHere=true; }, text:()=>`
<p>${F("fatherNegotiates")||F("fatherReconciled")?`Your father comes back from the king's court on the third day with Aldric's signature on the treaty and mud to his knees.`:`Lord Edric arrives on the third day in a hired carriage, with one trunk and his cane, and announces that he has come to see his ${({he:"son",she:"daughter",they:"child"})[S.p]} found a kingdom and will be staying until it is done.`} He is slower than he was. He leans on the cane more. But his eyes are as sharp as they were the day he sent you away, and they have changed in every other way.</p>
<p>${has("manorFound")?`He walks the foundations of the new manor twice, slowly, tapping the stones with his cane. ${say(`"Down to rock,"`)} he says. ${say(`"Good. Your great grandmother built the Highcrown house on sand. It still leans."`)}`:`He walks up to the manor site with you and stands for a long time where the foundations will go. ${say(`"I would like to lay a stone,"`)} he says. ${say(`"If the builder permits."`)}`}</p>`,
choices:[
  {label:`Ask him what a crown costs.`, hint:"Your father's counsel · Renown +2", fx:{renown:2, edricCounsel:"crown"}, go:"d3b"},
  {label:"Show him the plans for the nursery.", hint:"Morale +2 · he goes very quiet", fx:{morale:2, edricCounsel:"nursery"}, go:"d3b"},
  {label:"Hand him the mason's hammer.", hint:"Morale +1 · Resentment −1", fx:{morale:1, resent:-1, edricCounsel:"hammer"}, go:"d3b"}
]},
d3b:{ title:"The First Stone", text:()=>`
${F("edricCounsel")==="crown"?`<p>${say(`"Everything,"`)} he says. ${say(`"And then a little more each year. A crown is a promise you make to people who are not born yet. I made mine badly. I kept the house, and I lost my child."`)} He looks at you. ${say(`"Don't keep the house."`)}</p>`
:F("edricCounsel")==="nursery"?`<p>He studies the drawing of the little room at the end of the family wing for a long time, the window, the place you've marked for a cradle. ${say(`"I was not there when you were small,"`)} he says at last. ${say(`"I was at court. I thought there would be time later."`)} He folds the plan very carefully. ${say(`"I would like to be there, this time. If you'll have me underfoot."`)}</p>`
:`<p>He weighs the hammer in his hand. He has never held one; Valcrests do not. He sets a stone, crooked, and taps it into place, and then looks so pleased with himself that the masons applaud. ${say(`"Don't you dare straighten it,"`)} he tells you. You never do.</p>`}
${sys("FAMILY",`[Lord Edric stays in ${RN()}]<br>He will be here for the child`)}`,
choices:[{label:"The next day.", go:"nextday"}]},

d4guild:{ title:"The Realm Builders", text:()=>`
<p>The old Builders' Guild in Brackenfold has two hundred members and a hall that is far too small. Fen walks in on the fourth morning with a roll of paper under his arm and spreads it across your workbench: a charter for a new guild. The Realm Builders. Lodges in every town on both banks, Kastrel smiths and Aurendell masons on the same crews, the same pay.</p>
<p>${say(`"It works without you,"`)} Fen says. ${say(`"That's the point. You can't be in thirteen places. We can."`)} He has grown taller in a year. He has also, you notice, started talking like you.</p>
<p>The only question left is who leads it, because whoever leads it decides what gets built first.</p>`,
choices:[
  {label:"Garth leads it: roads first, every settlement joined to every other.", hint:"The Realm Builders favor roads and bridges", fx:{realmGuild:true, guildFocus:"roads"}, go:"d4b"},
  {label:"Fen leads it: grow the settlements we already have.", hint:"The Realm Builders favor growing towns · Craft +1", fx:{realmGuild:true, guildFocus:"growth", craft:1}, go:"d4b"},
  {label:"Ruslan, the freed Karsk smith, leads it: the east bank first.", hint:"The Realm Builders favor the east bank · Unity +1 for every east bank work", fx:{realmGuild:true, guildFocus:"east", unity:3, aff_ruslan:2}, go:"d4b"}
]},
d4b:{ title:"The Realm Builders", text:()=>`
<p>${F("guildFocus")==="east"?`Ruslan is a huge, quiet man with collar scars on his neck that he does not hide. When you ask him to lead the guild, he does not say anything for a while. Then he goes outside and sits on the step, and Fen goes out after him, and when they come back in Ruslan's eyes are red and he is already arguing about lodge sizes.`:F("guildFocus")==="growth"?`Fen turns very red, and then very serious, and asks for a desk. Bren gives him the one Aurel's notes were found in. Nobody tells Fen that, until he finds the initials carved under the drawer.`:`Garth spits on his palm and shakes your hand, which is how Garth signs things. ${say(`"Roads,"`)} he says. ${say(`"Roads are the realm. Everything else is just places roads go."`)}`}</p>
${sys("REALM BUILDERS",`[Guild founded]<br>The Realm Builders work every other day and every week, using the realm's stores · their reports appear on the build screen`)}`,
choices:[{label:"The next day.", go:"nextday"}]},

d5eve:{ title:"The Eve of the Vote", text:()=>`
<p>On the last night before the vote, Tamsin finds you on the bridge. ${F("tamsinGeneral")?`She is in her Saelmar coat again, the general's one, which she only wears when she thinks something is going to happen.`:`She has her old sword on, which she only wears when she thinks something is going to happen.`}</p>
<p>${say(`"Someone's been under the bridge,"`)} she says. ${say(`"Boats at night, no lanterns. Twice. Could be smugglers. Could be someone who doesn't want tomorrow to go well."`)}</p>
<p>Across the water, the lights are still on in Ostrow's house in Overbrack.</p>`,
choices:[
  {label:"Double the guard on the bridge tonight.", hint:"Defense +2 · the vote begins safer", fx:{defense:2, n_vote:1, eve:"guard"}, go:"vote1"},
  {label:"Go across and talk to Ostrow, alone.", hint:"Something to learn · risky", fx:{eve:"ostrow", aff_ostrow:1}, go:"d5ostrow"},
  {label:"Check the bridge yourself, with your hands on the stone.", hint:"Your Keystone sense · Craft +1", fx:{eve:"stone", craft:1}, go:"d5stone"}
]},
d5ostrow:{ title:"Ostrow's House", text:()=>`
<p>Ostrow receives you in a dressing gown, entirely unsurprised. He pours two glasses of something expensive. ${say(`"You want to know if I'm going to stop the vote,"`)} he says. ${say(`"No. I'm going to lose it. Graciously. And then I'm going to spend twenty years making sure the east bank's money stays on the east bank, legally, in every way your new council forgets to forbid."`)}</p>
<p>He smiles. ${say(`"The boats under the bridge aren't mine. I would never do anything so crude. But I know whose they are: the old king's men, the ones who didn't go north. They'd like the bridge to fall during the vote. It would be very hard to unite two banks with no bridge."`)}</p>`,
choices:[{label:"Thank him, and run.", hint:"You know the plot · the vote will go better", fx:{n_vote:2, knowPlot:true}, go:"vote1"}]},
d5stone:{ title:"The Voice of the Bridge", text:()=>`
<p>You kneel at the center of the bridge and lay your palms on the keystone of the great arch, and Listen, the way Wren taught you. The bridge is proud of itself. It hums with the weight of carts. But under the third pier, something is wrong: a cold, tight feeling, like a held breath. Someone has cut into the pier below the waterline and packed the cut with something that does not belong there.</p>
${sys("KEYSTONE",`[Flaw found]<br>Third pier, below the waterline · the bridge was meant to fall tomorrow`)}`,
choices:[{label:"Get Fen and a crew. Quietly.", hint:"The flaw is half mended before dawn", fx:{n_vote:2, knowPlot:true, pierMended:true}, go:"vote1"}]},

/* ---------------------------- THE CRISIS: THE VOTE ON THE BRIDGE ---------------------------- */
vote1:{ title:"The Vote on the Bridge", enter(){ S.phase="crisis"; }, text:()=>`
<p>Every town sends its delegates to the bridge: forty from the highlands in grey wool, Marrow Ford's farmers in their Sunday coats, Karsk's smiths with their collar scars, Velm's councillors in black. A thousand more crowd both banks. ${F("fatherHere")?"Your father stands at the western end, leaning on his cane, in the blue of the king's envoy.":""} ${SPN()?`${SPN()} stands beside you.`:""}</p>
<p>Marren reads the Accord aloud, once in each language. The first town to vote is Hollin Cross. Yes. Overbrack. Yes. Karsk's delegate is halfway through the word when the bridge moves.</p>
<p>It is a small movement, a shiver under your feet, and then a sound like a great bone cracking from below the water. The third pier.</p>
${F("pierMended")?sys("KEYSTONE",`[Third pier: half mended]<br>It is holding. Barely.`):sys("KEYSTONE",`[Third pier: failing]<br>The bridge has minutes`,"warn")}`,
choices:()=>[
  {label:"Kneel and hold the bridge with your power while everyone gets off.", hint:F("pierMended")?"With the pier half mended, you can hold it":"Everything you have", fx:{n_vote:F("pierMended")?2:1, craft:1, held:true}, go:"vote2"},
  {label:"Shout for everyone to keep still, and send Fen's crew down to the pier.", hint:F("realmGuild")?"The Realm Builders are already on the bridge":"There may not be time", fx:{n_vote:F("realmGuild")?2:0, crewSaved:true}, go:"vote2"},
  {label:"Clear the bridge. The vote can wait.", hint:"Safe, but the moment passes", fx:{n_vote:0, cleared:true}, go:"vote2"}
]},
vote2:{ title:"The Vote on the Bridge", text:()=>`
<p>${F("cleared")?`The bridge empties in a long, frightened rush. It holds. When the crowds look back from the banks, the delegates are on opposite sides of the river again, and the old shouting starts at once: the west did this, the east did this.`:F("held")?`You feel the pier's pain as if it were your own leg. You do not let go. You feel the stone want to fall and you tell it, quietly, no. And it listens. A thousand people stand on a bridge that is being held up by one person kneeling at its center, and they know it.`:`Fen's crew goes over the rail on ropes, and for three long minutes there is nothing but the sound of hammers below the water. Then Fen's voice comes up: ${say(`"Holding! It's holding!"`)} The crowd breathes again.`}</p>
<p>And then, from the east bank, someone shouts that this was Brackenfold's doing. That the west wants an excuse. The crowd turns, the way crowds do.</p>`,
choices:()=>[
  {label:"Speak to the east bank in Kastrel, the language they grew up with.", hint:F("aff_marren")>=1||F("guildFocus")==="east"?"Marren has been teaching you":"Your Kastrel is terrible", fx:{n_vote:(F("aff_marren")||0)>=1||F("guildFocus")==="east"?2:1}, go:"vote3"},
  ...(F("knowPlot")?[{label:"Name the old king's men, and send Tamsin to the boats.", hint:"You know who did it", fx:{n_vote:2, plotCaught:true}, go:"vote3"}]:[]),
  {label:"Ask Ostrow to speak.", hint:"A gamble · he wants a seat at the table", fx:{n_vote:(F("aff_ostrow")||0)>=1?2:0, ostrowSpoke:true, aff_ostrow:1}, go:"vote3"}
]},
vote3:{ title:"The Vote on the Bridge", text:()=>`
<p>${F("plotCaught")?`Tamsin's boat comes back out from under the bridge with three men in it, soaked and furious, wearing the old king's colors under their coats. The crowd goes quiet. Then it goes loud, in a different direction.`:F("ostrowSpoke")?`Ostrow climbs onto the parapet, which no one expected, and says in a voice that carries like a bell that he has opposed this Accord for a month, and he still does, and he will be voting yes, because the people who cut that pier want the old king back, and he would rather have twenty years of arguing with ${N()}. People laugh. The laugh turns the crowd.`:`You say what you came to say: that there are no west and east bank stones in this bridge. That it was built by a thousand masons from both banks, and every one of them cut a mark into it, and you can show them where.`}</p>
<p>Marren raises the Accord again. ${say(`"Karsk,"`)} she says. ${say(`"You were saying."`)}</p>`,
choices:[{label:"Hold your breath.", go:"voteEnd"}]},
voteEnd:{ title:"The Accord", enter(){ const v=F("n_vote")||0; S.flags.voteResult = v>=5?"unanimous":v>=3?"carried":"divided";
    if(S.flags.voteResult==="unanimous") add({unity:10, renown:4}); else if(S.flags.voteResult==="carried") add({unity:4, renown:2}); else add({unity:-4});
    if(F("held")||F("crewSaved")) add({renown:2}); S.phase="crowned"; }, text:()=>`
${F("voteResult")==="unanimous"?`<p>Karsk: yes. Coldwater: yes. Velm, Marrow Ford, Woodsedge, the highlands in their grey wool, one after another, all of them. Thirteen towns and every one says yes. The sound when the last one does is not a cheer. It is something bigger and stranger than that, a thousand people realizing at the same moment that they are one thing now.</p>`
:F("voteResult")==="carried"?`<p>Karsk votes yes. Coldwater, after a long argument among its four delegates, votes yes. Velm votes yes by one voice. Two of the small hamlets abstain. It is not a triumph. It is a beginning, which is better, because it is real.</p>`
:`<p>The vote carries, barely, and only because the highlands vote yes at the very end. Velm votes no. Coldwater walks off the bridge. The Accord is signed by a realm that is half sure it wants to exist. You will have to build the other half.</p>`}
<p>${F("role")==="crown"?`Marren sets a plain iron circlet on your head, made in Karsk from a melted collar. ${say(`"So you don't forget,"`)} she says.`:F("role")==="warden"?`Marren pins the Warden's badge on your coat: a mason's square inside a ring. ${say(`"You build it and you guard it,"`)} she says. ${say(`"We'll argue about everything else."`)}`:`Marren takes the First Speaker's chair, and hands you a new set of mason's tools with ${RN()} stamped on every handle.`} ${F("fatherHere")?`At the western end of the bridge, your father bows. Not the bow a Valcrest gives a king. The deep one, from the waist, the one he gave you the day you came home.`:""}</p>
${sys("ACCORD SIGNED",`[${RN()} is founded]<br>${TITLE()} ${N()} · Vote: ${({unanimous:"unanimous",carried:"carried",divided:"divided"})[F("voteResult")]} · Unity ${S.stats.unity}`)}`,
choices:[{label:"Begin the first season.", go:"seasonOpen"}]},

/* ---------------------------- PART TWO: THE FIRST SEASON ---------------------------- */
seasonOpen:{ title:"Part Two: The First Season", enter(){ S.phase="season"; S.week=1; S.buildsLeft=perWeek(); S.weekReport=null; }, text:()=>`
<p>${F("familyPath")==="expecting"?`Six weeks after the Accord, the midwife from Marrow Ford comes to the manor and says, cheerfully, that the baby will come in about six weeks more, and that you should stop climbing scaffolds. ${SPN()} laughs until ${SPp("sub")} has to sit down.`:`The foundling's papers will take six weeks, Marren says, because ${RN()} has no laws for adoption yet, and she refuses to make an exception for the person who has to obey them first.`}</p>
<p>Six weeks, then. Six weeks to turn a vote into a realm. The roads need building. The towns need growing. And ${has("manorNursery")?"the nursery is ready, which leaves everything else.":"the nursery is not built yet."}</p>
${sys("THE FIRST SEASON",`Six weeks · three works a week · the Realm Builders build too<br>${nextTierText()}`)}`,
choices:[{label:"Plan the first week.", go:"plan"}]},

w1settlers:{ title:"Settlers", text:()=>`
<p>They come across the bridge and down the king's road both: families from Aurendell who heard there was land, families from the north of old Kastrel who heard there were no collars. Three hundred people in a week. They camp in the meadows around Brackenfold and wait for someone to tell them where to go.</p>
<p>Bren unrolls the survey maps. ${say(`"You could put them anywhere,"`)} he says. ${say(`"That's the trouble with a kingdom. Too many anywheres."`)}</p>`,
choices:()=>[
  ...(S.lv.greenreach===0?[{label:"Send them west to Greenreach, the empty farmland past Marrow Ford.", hint:"Found Greenreach free · Grain +6", fx:{grain:6, settled:"greenreach"}, then:()=>{ S.lv.greenreach=1; }, go:"nextweek"}]:[]),
  ...(S.lv.ironvale===0?[{label:"Send them east to Ironvale, the iron hills past Karsk.", hint:"Found Ironvale free · Unity +3 · Iron +3", fx:{unity:3, iron:3, settled:"ironvale"}, then:()=>{ S.lv.ironvale=1; }, go:"nextweek"}]:[]),
  ...(S.lv.saltford===0?[{label:"Send them south to Saltford, where the river meets the sea.", hint:"Found Saltford free · a port at last", fx:{settled:"saltford", coin:3}, then:()=>{ S.lv.saltford=1; }, go:"nextweek"}]:[]),
  {label:"Spread them through the towns that already exist.", hint:"Grow your smallest settlement free · Morale +1", fx:{morale:1, settled:"spread"}, then:()=>{ const k=alive().filter(x=>S.lv[x]<maxLv(x)).sort((a,b)=>S.lv[a]-S.lv[b])[0]; if(k) S.lv[k]++; }, go:"nextweek"}
]},

w2hunger:{ title:"Hunger at Coldwater", text:()=>`
<p>A boy from Coldwater rides into Brackenfold on a farm horse with no saddle. The east bank harvest failed the year of the storm and again this year, and the old king's granaries were emptied when he fled. Coldwater has eaten its seed grain. ${S.lv.highmeadow>0?"Highmeadow has been sharing what it can, which is not much.":""}</p>
<p>${say(`"Ostrow's warehouses in Velm are full,"`)} the boy says. ${say(`"He says he'll sell. At winter prices."`)}</p>`,
choices:[
  {label:"Send grain from the western farms, free.", hint:"Grain −10 · Unity +6", req:()=>S.stats.grain>=10, fx:{grain:-10, unity:6, hunger:"fed"}, go:"nextweek"},
  {label:"Buy Ostrow's grain at his price, and send it.", hint:"Coin −12 · Unity +3 · Ostrow gets rich", req:()=>S.stats.coin>=12, fx:{coin:-12, unity:3, hunger:"bought", aff_ostrow:1}, go:"nextweek"},
  {label:"Order Ostrow to open his warehouses at fair prices.", hint:F("role")==="crown"?"Your right, as "+P("ruler")+" · Unity +4 · Ostrow will remember":"You don't have the authority · Unity +2", fx:{unity:F("role")==="crown"?4:2, coin:-4, hunger:"ordered", aff_ostrow:-2}, go:"nextweek"},
  {label:"Send them timber and stone for granaries instead, and a promise.", hint:"Timber −4 · Stone −4 · Unity −2 now, but the granaries help later", fx:{timber:-4, stone:-4, unity:-2, hunger:"granary"}, go:"nextweek"}
]},

w3nursery:{ title:"The Nursery", text:()=>`
${F("familyPath")==="expecting"?`<p>${SPN()} has started making lists. Lists of names, lists of things the baby will need, lists of things that are dangerous in a house built by artificers, which is a long list, because the manor has a staircase that moves if you ask it to. ${has("manorNursery")?`The nursery is done, and ${SPp("sub")} has rearranged it four times.`:`The nursery isn't built yet, and ${SPp("sub")} has started looking at you meaningfully every time you leave for a building site.`}</p>`
:`<p>You go to the Accord camp every evening now. The child knows you. The child holds out both arms when you come, and pulls your hair, and falls asleep on your shoulder while the camp warden talks about paperwork. ${has("manorNursery")?"The nursery at the manor is ready, and very empty.":"The nursery at the manor isn't built yet, and you feel it every night."}</p>`}
<p>Your father, of all people, has started knitting. Badly. ${say(`"Seren's nurse taught me,"`)} he says, when you catch him. ${say(`"It is extremely difficult and I refuse to discuss it."`)}</p>`,
choices:()=>[
  {label:"Build the cradle with your own hands, no magic.", hint:"Morale +2 · it takes all week", fx:{morale:2, cradle:"hands"}, go:"nextweek"},
  {label:"Wake a little Elder ward over the nursery: warm in winter, cool in summer, always quiet.", hint:"Craft +1 · Morale +1", fx:{craft:1, morale:1, cradle:"ward"}, go:"nextweek"},
  {label:`Ask your father to help you paint it.`, hint:"Morale +1 · Resentment −1 · he is terrible at this too", fx:{morale:1, resent:-1, cradle:"paint"}, go:"nextweek"}
]},

w4barges:{ title:"Barges on the River", text:()=>`
<p>On the fourth week the river stops. Forty of Ostrow's grain barges have tied up across the narrows below Velm, end to end, and nothing can pass. Ostrow is very apologetic. The bargemen, he explains, are protesting ${F("tolls")==="free"?"the end of the tolls, which paid their guild":F("tolls")==="treasury"?"tolls going west to Brackenfold":"the new toll rules, which nobody understands"}. He has no control over them at all. He says this from the deck of the largest barge.</p>
<p>Saltford's ${S.lv.saltford>0?"new docks are empty":"fishing boats can't come up the river"}. Brackenfold's markets are half full. Everyone is looking at you.</p>`,
choices:()=>[
  {label:"Build a road around the narrows, overnight, with your own power.", hint:"Craft +1 · Renown +3 · Stone −6 · the barges become pointless", req:()=>S.stats.stone>=6, fx:{stone:-6, craft:1, renown:3, barges:"bypass", aff_ostrow:-1}, go:"nextweek"},
  {label:"Sit down with the bargemen, not Ostrow.", hint:"Unity +4 · Coin −4 · their guild gets a seat on the council", fx:{unity:4, coin:-4, barges:"talked"}, go:"nextweek"},
  {label:"Give Ostrow a seat on the council. That is what he wants.", hint:"The barges move · Unity +2 · Ostrow joins the council", fx:{unity:2, barges:"seat", ostrowCouncil:true, aff_ostrow:3}, go:"nextweek"},
  ...(F("tamsinGeneral")?[{label:"Ask Tamsin to bring Saelmar's ships up the river.", hint:"A show of force from a friend · Defense +2 · Unity −2", fx:{defense:2, unity:-2, barges:"ships"}, go:"nextweek"}]:[])
]},

w5seren:{ title:"Seren Comes to Visit", text:()=>`
<p>Your sister arrives in the fifth week, with a nurse, two guards, four trunks, and her son on her hip. He is two now, with Seren's red hair and Seren's temper, and the first thing he does in your manor is set a curtain on fire.</p>
<p>${say(`"He's early with it,"`)} Seren says proudly, beating out the flames with a cushion. ${say(`"Fire mages always are. Yours will probably be early with something too. Bricks, maybe."`)}</p>
<p>She runs House Valcrest now. She has opinions about everything you have built, most of them good. On the last night she sits with you on the manor steps. ${say(`"I was so jealous of you,"`)} she says, ${say(`"when they sent you away. Isn't that strange? I thought you'd got out."`)}</p>`,
choices:[
  {label:`"I did get out. And now look. I've built a whole new cage."`, hint:"Seren laughs · Morale +2", fx:{morale:2, aff_seren:2}, go:"nextweek"},
  {label:"Ask her to be the child's guardian, if anything happens to you.", hint:"Seren cries, then denies it · Renown +1", fx:{renown:1, aff_seren:3, serenGuardian:true}, go:"nextweek"},
  {label:"Ask her for the cradle her son has outgrown.", hint:"Seren sends it from Highcrown · Morale +1", fx:{morale:1, cradleGift:true, aff_seren:1}, go:"nextweek"}
]},

w6waiting:{ title:"The Waiting", text:()=>`
<p>In the sixth week you stop building anything you don't have to. You walk the realm instead. You ride the new roads${S.roads.length>5?`, all ${S.roads.length} of them,`:""} and stop in villages that did not exist a season ago, and nobody bows, which you like, and everyone tells you what is wrong with their well, which you like even more.</p>
<p>Fen rides with you most days. On the last one, at the top of the pass above Stonegate, he says: ${say(`"Do you think the baby will have it? The power?"`)} You say you don't know. ${say(`"I hope it's something else,"`)} he says. ${say(`"Something new. It's been builders long enough."`)}</p>
${sys("REALM",`[${realmTier().name}]<br>People: ${pop().toLocaleString()} · Settlements: ${alive().length} · Roads: ${S.roads.length} · Unity ${S.stats.unity}`)}`,
choices:[{label:"Ride home.", go:"nextweek"}]},

/* ---------------------------- THE ARRIVAL ---------------------------- */
arrival:{ title:()=>F("familyPath")==="expecting"?"The Child Is Born":"The Child Comes Home", enter(){ S.phase="arrival"; }, text:()=>`
${F("familyPath")==="expecting"?`<p>The baby comes in the middle of a thunderstorm, which Bren says is a sign, and which you say is autumn. It is a long night. ${SPN()} holds your hand${F("cradle")==="ward"?" in the warm quiet of the warded nursery":""} until neither of you can feel your fingers, and the midwife from Marrow Ford swears at both of you in two languages, and then, a little before dawn, there is a new voice in the house.</p>`
:`<p>The papers are signed on a Tuesday, in the Accord Hall${has("accordHall")?"":" that isn't built yet, so on a table in the square"}, by Marren, who signs her name very slowly and then hugs you, which she has never done. The camp warden gives you the tin tag. ${say(`"You'll want to throw that in the river,"`)} he says. You don't. You keep it.</p>`}
<p>${SPN()?`${SPN()} puts the child in your arms.`:`You carry the child home over the Bridge of Two Banks.`} So small. So heavy. Warm as a stone in the sun.</p>`,
choices:[
  {label:"A daughter.", fx:{childP:"she"}, go:"naming"},
  {label:"A son.", fx:{childP:"he"}, go:"naming"},
  {label:"Just a child. The rest is theirs to tell you, later.", fx:{childP:"they"}, go:"naming"}
]},
naming:{ title:"A Name", input:{placeholder:"Aurelie", max:18, init:()=>S.family.child||""}, text:()=>`
<p>${F("familyPath")==="adopt"?"The child came to you with a number and no name. That ends now.":"You and "+(SPN()||"the midwife")+" have argued about names for six weeks. None of them are right. Then you look down and one is."}</p>`,
choices:[{label:"Give the child this name.", hint:"Type it above", useInput:"child", go:"grandfather"}]},
grandfather:{ title:"Three Generations", enter(){ if(!S.family.child) S.family.child=({she:"Aurelie",he:"Aurel",they:"Wren"})[F("childP")]||"Aurelie"; }, text:()=>`
<p>Your father comes in at dawn, still in yesterday's coat. He has not slept either. He stops in the doorway as if there were a line on the floor he is not sure he is allowed to cross.</p>
<p>You hold out ${CHILD()}. He takes the child the way people take things that are far too valuable, with both hands and his whole body, his cane forgotten against the wall.</p>
<p>${say(`"${CHILD()},"`)} he says, trying the name. And then, to the child, very quietly, in a voice you have never once heard him use: ${say(`"I was not a good father. I am going to be an excellent grandfather. Your parent will tell you otherwise. Don't listen."`)}</p>
<p>Outside, ${RN()} is waking up: carts on the bridge, smoke from Karsk, the bells in Velm${S.lv.highmeadow>0?", and very faintly, from up the hill, the highland shepherds singing":""}.</p>
${sys("FAMILY",`[${CHILD()} Valcrest]<br>Born to the realm of ${RN()} · Lord Edric, grandfather · ${SPN()?SPN()+", parent":"raised by you, and by everyone"}`)}`,
choices:[{label:"Look at what you've built.", go:"c1after"}]},

c1after:{ title:"Before and After", text:()=>`
<p>The day the Accord was proposed, and the day ${CHILD()} came home.</p>
<div class="beforeafter"><figure>${S.snapMap||""}<figcaption>Before: the Accord lands</figcaption></figure><figure>${realmSVG(true)}<figcaption>After: ${RN()}</figcaption></figure></div>
<figure class="manor-fig">${manorSVG()}<figcaption>The manor, ${manorStage()}</figcaption></figure>`,
choices:[{label:"End of Chapter One.", go:"summary1"}]},

summary1:{ title:"Book Two, Chapter One Complete: The Accord", enter(){ S.phase="done"; }, text:()=>`
<p>${RN()} is a realm. ${({unanimous:"Every town voted for it",carried:"Most towns voted for it",divided:"Half the towns voted for it, and the other half are watching"})[F("voteResult")]}. You are its ${TITLE()}. ${CHILD()} is asleep in the nursery${F("cradleGift")?" in Seren's old cradle":F("cradle")==="hands"?" in the cradle you built with your own hands":""}, and your father is asleep in the chair beside it.</p>
<p>Winter is coming. The east bank has never had a winter without a king. Ostrow ${F("ostrowCouncil")?"has a seat on your council now, and has already asked for a bigger chair":"is counting something in his house in Overbrack"}. And somewhere north, the old king of Kastrel is listening for news of the Accord.</p>
${sys("CHAPTER ONE",`[${realmTier().name}]<br>${pop().toLocaleString()} people · ${alive().length} settlements · ${S.roads.length} roads · Unity ${S.stats.unity}<br>Manor: ${manorStage()} · ${TITLE()} ${N()}<br>Next: Chapter Two, The First Winter of the Realm`)}`,
choices:[{label:"Begin Chapter Two: The First Winter of the Realm", go:"c2open"}]}
};

/* ---------- text for the build screens ---------- */
function planText(){
  const conn=connected(), cut=alive().filter(k=>!conn.has(k));
  const intro = S.phase==="season"
    ? (S.weekReport?sys(`WEEK ${S.week-1} REPORT`,S.weekReport):"")
    : (S.lastYield&&S.day>1?sys(`DAY ${S.day-1}`,`Grain +${S.lastYield.grain||0} · Timber +${S.lastYield.timber||0} · Stone +${S.lastYield.stone||0} · Iron +${S.lastYield.iron||0} · Coin +${S.lastYield.coin||0}${S.guildNote?`<br>${S.guildNote}`:""}`):"");
  return `${intro}
  ${mapPanel()}
  <div class="res">${["grain","timber","stone","iron","coin"].map(k=>`<span>${LABEL[k]} <b>${S.stats[k]}</b></span>`).join("")}<span>Unity <b>${S.stats.unity}</b></span><span>People <b>${pop().toLocaleString()}</b></span></div>
  <p class="chapter">${realmTier().name} · ${nextTierText()}</p>
  ${cut.length?`<p class="chapter">Cut off (half output): ${cut.map(k=>SITES[k].name).join(", ")}</p>`:""}
