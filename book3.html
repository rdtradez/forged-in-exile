${sys("THIS CHAPTER",`[Both of you]<br>You play the odd days as ${N()}, the even days as ${CHILD()} · Trust between you: ${S.stats.trust}`)}`,
choices:()=>[{label:"Begin.", go:"c11days"}]},
c11days:{ title:"Two Roads", enter(){ daysEnter(); }, text:()=>`<p>Four days. On the fifth, you will both be at the heart, and one of you will have to give way.</p>`, choices:()=>[{label:"Plan the first day.", go:"plan"}]},
c11d1:{ title:`The Seal`, text:()=>`
<p>(You are ${N()}.) Fen lays the seal on your workshop table: a ring of seal-stones around the heart, and the Song of Sleeping sung to every Wonder at once, and the crown closed, and the heart mended, forever. ${say(`"It works,"`)} Fen says. ${say(`"I'd bet my life on it. The trouble is it also means nobody can ever open it again. Not even to finish it."`)}</p>`,
choices:()=>[
  {label:"Ask your child to come and look at it with you.", hint:"Trust +5", fx:{trust:5}, go:"nextday"},
  {label:"Order the seal-stones cut.", hint:"Trust −5 · it begins", fx:{trust:-5, sealOrdered:true}, go:"nextday"}
]},
c11d2:{ title:"The Finishing", text:()=>`
<p>(You are ${CHILD()}.) You walk your ${HP()}'s realm with Elowen on the second day: Brackenfold half grey, the refuges full, the river running grey under the bridge. ${say(`"If it works,"`)} Elowen says, ${say(`"there's land for every one of these people. A whole world. If it doesn't..."`)} She doesn't finish.</p>
<p>${F("sealOrdered")?`You hear the stonecutters in the yard behind the Accord Hall. Your ${HP()} has already started.`:""}</p>`,
choices:()=>[
  {label:`Go to your ${HP()} and explain it again, slowly, the way Grandfather taught you.`, hint:"Trust +5", fx:{trust:5}, go:"nextday"},
  {label:"Start rehearsing the Choir, whatever happens.", hint:"Song +1 · Trust −3", fx:{song:1, trust:-3, rehearsing:true}, go:"nextday"}
]},
c11d3:{ title:"Marren", text:()=>`
<p>(You are ${N()}.) Marren is ninety. She hasn't left her house in Velm in a year. She comes to Brackenfold anyway, in a cart, wrapped in blankets, to say one thing.</p>
<p>${say(`"Thirty years ago,"`)} she says, ${say(`"a council in Highcrown decided what a child was worth, and they were very sure, and they were wrong. I've spent my whole life since then making sure nobody gets to be that sure again."`)} She looks at you. ${say(`"Including you."`)}</p>`,
choices:()=>[
  {label:"Thank her, and go to find your child.", hint:"Trust +6", fx:{trust:6, marrenHeard:true}, go:"nextday"},
  {label:`"I'm trying to keep everyone alive, Marren."`, hint:"She nods · Trust +1", fx:{trust:1}, go:"nextday"}
]},
c11d4:{ title:"The Night Before", text:()=>`
<p>(You are ${CHILD()}.) ${CHILD2()} finds you on the manor roof, where your ${HP()} goes to think. ${say(`"I'm on your side,"`)} ${C2s()} says. ${say(`"I just want you to know. I built the Choir's Stair plans already. In case."`)} A pause. ${say(`"I'm on ${HP()==="parent"?"our parent's":HP()==="father"?"Dad's":"Mum's"} side too. I hate this."`)}</p>`,
choices:()=>[
  {label:`"So do I. Thank you."`, hint:"Sibling ◆ · Trust +3", fx:{aff_sib:1, trust:3}, go:"nextday"},
  {label:"Ask your sibling to talk to your parent for you.", hint:"Sibling ◆ · Trust +4", fx:{aff_sib:1, trust:4}, go:"nextday"}
]},
c11c1:{ title:"At the Heart", enter(){ crisisEnter(); if(EMP()) add({trust:-10}); if(F("legion9")||F("legionOrsenne")) add({trust:-8}); }, text:()=>`
<p>(You are ${N()}.) You go down to the heart at midnight with the first seal-stone. Your child is already there, sitting on the cracked stone with ${CP("pos")} knees pulled up, the way you used to sit on the manor roof.</p>
<p>${say(`"I knew you'd come tonight,"`)} ${CHILD()} says. ${say(`"You always do the hard things at night so nobody has to watch."`)}</p>
${sys("CRISIS",`[Keystone and Cantor]<br>Trust between you: ${S.stats.trust}${EMP()?" · the Empire weighs on it":""}`,"warn")}`,
choices:()=>[
  {label:`Sit down beside ${CP("obj")}.`, hint:"Listen first", fx:{trust:5, n_c11:2}, go:"c11c2"},
  {label:`"I'm sealing it. I'm sorry."`, hint:"Trust −15", fx:{trust:-15, n_c11:0}, go:"c11c2"},
  {label:`"Show me. Sing me the song."`, hint:"Trust +8", fx:{trust:8, n_c11:2, heardSong:true}, go:"c11c2"}
]},
c11c2:{ title:"The Song", text:()=>`
<p>(You are ${CHILD()}.) ${F("heardSong")?`You sing your ${HP()} the first lines of the Song of Finishing, there on the cracked heart, and you watch ${P("pos")} face as the grey under the bridge goes quiet, and listens, and for a moment, a small piece of it turns to warm new stone.`:`Your ${HP()} is looking at you the way ${P("sub")} looked at the heart: like something too heavy to hold, that ${P("sub")} has to hold anyway.`}</p>`,
choices:()=>[
  {label:`"Hold it for me. I'll sing. If it goes wrong, seal it, with me inside if you have to."`, hint:"Everything", fx:{n_c11:S.stats.trust>=70?3:1, trust:6}, go:"c11c3"},
  {label:`"Then seal it. I won't fight you."`, hint:"Giving way", fx:{n_c11:1, gaveWay:"heir"}, go:"c11c3"},
  {label:"Walk out, and take the Choir with you.", hint:"Trust −20", fx:{trust:-20, n_c11:0, walkedOut:true}, go:"c11c3"}
]},
c11c3:{ title:"Keystone and Cantor", enter(){ const t=S.stats.trust; S.flags.c11accord = F("walkedOut")||t<40 ? "split" : t>=70&&!F("gaveWay") ? "embrace" : "compromise"; }, text:()=>`
<p>(You are ${N()}.) ${({embrace:`You look at your child for a long time. Then you put the seal-stone down on the floor of the chamber, and put your hand on top of ${CP("pos")} hand on the heart. ${say(`"Together, then,"`)} you say. ${say(`"I hold. You sing. And if it goes wrong, we fix it together."`)} ${CHILD()} cries, which ${CP("sub")} hasn't done since ${CP("sub")} was eight.`,
compromise:`You talk until dawn. It isn't a yes. It isn't a no. It's a plan: you'll build both, the Ring of Seals and the Choir's Stair, and when the day comes, you'll decide together, at the heart, with everything ready.`,
split:`${CHILD()} walks out of the chamber, and up the stair, and out into the morning, and the Choir follows. You stand alone at the heart with a seal-stone in your hands. It's the loneliest you have been since the day they put you in the cart to Brackenfold.`})[F("c11accord")]}</p>`,
choices:()=>[{label:"Go on.", go:"c11c4"}]},
c11c4:{ title:"Morning", enter(){ S.flags.c11result = ({embrace:"great",compromise:"good",split:"hard"})[F("c11accord")]; S.phase="open"; }, text:()=>`
${sys("THE HEART OF THE BOOK",`[${({embrace:"Together",compromise:"A plan for both",split:"Apart"})[F("c11accord")]}]<br>Trust between you: ${S.stats.trust}`)}`,
choices:()=>[{label:"Begin the summer.", go:"c11season"}]},
c11season:{ title:"Part Two: Together, or Not", enter(){ seasonEnter(); }, text:()=>`<p>Three weeks of summer.</p>${sys("SUMMER",`Three weeks · three decisions a week · the council handles the rest<br>${nextTierText()}`)}`, choices:()=>[{label:"Plan the first week.", go:"plan"}]},
c11w1:{ title:"After", text:()=>`
${F("c11accord")==="split"?`<p>Your child is in Velm, with Marren, and the Choir. ${CPc("sub")} writes once. One line: ${say(`"I still love you. I still think I'm right."`)}</p>`:`<p>Your child comes to dinner every night now, and argues about the Choir's Stair with ${CHILD2()}, and steals food off your plate, and you have never been happier to be stolen from. Torin and Ilsa come down from Highcrown for the summer, the way they always did, and the five of them sleep on the manor roof again, all of them, grown up, talking until dawn.</p>`}`,
choices:()=>F("c11accord")==="split" ? [
  {label:`Write back: "So do I. On both counts. Come home."`, hint:"Trust +10", fx:{trust:10}, go:"nextweek"},
  {label:"Go to Velm yourself.", hint:"Trust +15 · it's not easy", fx:{trust:15, wentVelm:true}, go:"nextweek"}
] : [
  {label:"Ask your child to teach you the first line of the song.", hint:"Trust +5 · Song +1", fx:{trust:5, song:1}, go:"nextweek"},
  {label:"Just enjoy dinner.", hint:"Morale +3", fx:{morale:3}, go:"nextweek"}
]},
c11w2:{ title:"Ysolt Writes to Your Child", text:()=>`
<p>A letter comes for your eldest in the second week, on wine colored paper: Empress Ysolt, inviting ${CP("obj")} aboard her ship at Seagate, alone. She has something to offer, the letter says. Something your ${HP()} cannot.</p>`,
choices:()=>[
  {label:`Tell your child: "Go. Hear her out. I trust you."`, hint:"Trust +6", fx:{trust:6, c12blessed:true}, go:"nextweek"},
  {label:`"Don't go."`, hint:"Trust −6 · your child goes anyway", fx:{trust:-6}, go:"nextweek"}
]},
c11w3:{ title:"Both Works", text:()=>`<p>The stonecutters cut seal-stones in one yard and stair stones in the other. ${CHILD2()} runs between them both with ${C2("pos")} plans, the only person in the realm who is working for both sides at once, and happy about it.</p>`,
choices:()=>[{label:"Watch them work.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"}]},
c11close:{ title:"Seagate", text:()=>`<p>At the end of summer, your eldest rides to Seagate to meet an empress, and you stand on the bridge and watch ${CP("obj")} go, again.</p>`, choices:()=>[{label:"End of Chapter Eleven.", go:"summary11"}]},
summary11: chapterSummary(11, ()=>`<p>Keystone and Cantor met at the heart, and ${({embrace:"chose each other",compromise:"made a plan for both",split:"went separate ways, for now"})[F("c11accord")]}. Trust between you: ${S.stats.trust}.</p>`, "Chapter Twelve: The Empress's Bargain", "c12open"),

/* ============================ CHAPTER TWELVE: THE EMPRESS'S BARGAIN (the heir) ============================ */
c12open:{ title:"The Empress's Bargain", enter(){ chapterEnter(12); }, text:()=>`
<p>You are ${CHILD()}, and Empress Ysolt of Caradun is pouring you tea in a cabin the size of your ${HP()}'s great hall, on a ship anchored off Seagate, with the grey sea all around.</p>
<p>${nation("caradun").stance==="ally"?"She is your "+HP()+"'s ally now, and she speaks to you as one.":"She was your "+HP()+"'s enemy once. She speaks to you as if that was a long time ago."} ${say(`"Your ${HP()} wants to seal it,"`)} she says. ${say(`"You want to finish it. I want my people to have somewhere to live. I think you and I want the same thing."`)}</p>`,
choices:()=>[{label:"Listen.", go:"c12days"}]},
c12days:{ title:"Aboard", enter(){ expEnter("Ysolt's ship","caradun"); }, text:()=>`<p>Four days aboard the empress's ship. Ysolt invited you alone. You brought ${CHILD2()}, who said ${say(`"Absolutely not"`)} when you tried to leave without ${C2("obj")}, and Torin, who simply walked up the gangplank behind you and dared anyone to say anything, and Elowen and Jory, who didn't ask.</p>`, choices:()=>[{label:"Make camp in the guest cabin.", go:"camp"}]},
c12d1:{ title:"Caradun", text:()=>`
<p>Ysolt shows you her people on the first day: the decks below, crowded with families from the lost colonies, grey dust still in their hair. ${say(`"Three hundred thousand,"`)} she says. ${say(`"My capital goes grey by winter. I have nowhere to put them. Your ${HP()} has offered land. It isn't enough land. Nothing up here is."`)}</p>`,
choices:()=>[
  {label:"Sing for the children below decks.", hint:"Song +1 · Ysolt watches", fx:{song:1, sangCaradun:true}, go:"nextday"},
  {label:"Ask her about the relics she used to wear.", hint:"She tells the truth, or not", fx:{askedYsolt:true}, go:"nextday"}
]},
c12d2:{ title:"The Offer", text:()=>`
<p>${say(`"Sing the world finished,"`)} Ysolt says, ${say(`"and I will hold the line for you while you do it. All my fleets, all my Wonders, all my people, around the river. Nothing will reach you while you sing. And when it's done, the first new land that rises from the sea is Caradun's. That is all I ask."`)}</p>
${nation("caradun").stance==="rival"?"<p>Something in the way she says it makes the back of your neck go cold.</p>":""}`,
choices:()=>[
  {label:`"If the land rises, it's for everyone who's lost theirs. Caradun first, if you like. Not Caradun only."`, hint:"A counteroffer", fx:{n_c12:1, counter:true}, go:"nextday"},
  {label:`"Yes."`, hint:"A real alliance, if she means it", fx:{acceptedYsolt:true}, go:"nextday"},
  {label:`"I need to ask my ${HP()}."`, hint:"Trust +5 · she smiles, a little sadly", fx:{trust:5}, go:"nextday"}
]},
c12d3:{ title:"Elowen's Warning", text:()=>`
<p>Elowen comes to your cabin on the third night with mud on her boots. ${say(`"I went down to the hold,"`)} she says. ${F("watched")?say(`"With Jory. You saw it too. That machine. It's built to hold the heart. Not hers. Ours."`):say(`"There's a locked room. Jory's working on it. Something in there hums like the relics did."`)}</p>`,
choices:()=>[
  {label:"Confront Ysolt tonight.", hint:"Bold", fx:{n_c12:1, confronted:true}, go:"nextday"},
  {label:"Wait, and watch, and say nothing.", hint:"The crisis goes better if you know more", fx:{n_c12:F("watched")?1:0}, go:"nextday"}
]},
c12d4:{ title:"A Letter from Home", text:()=>`
<p>A letter from home on the fourth day, carried by a fast cutter. ${S.stats.trust>=70?`From your ${HP()}: ${say(`"Whatever you decide out there, decide it. I'll stand behind it. I've been thinking about Grandfather, and believing yourself first."`)}`:S.stats.trust>=40?`From your ${HP()}: ${say(`"Be careful. She is cleverer than both of us. Come home."`)}`:`From ${CHILD2()}: ${say(`"They don't say it, but they're scared. Come home."`)}`}</p>`,
choices:()=>[{label:"Put it in your pocket, next to Grandfather's.", hint:"Trust +3", fx:{trust:3}, go:"nextday"}]},
c12c1:{ title:"The Bargain", enter(){ crisisEnter(); }, text:()=>`
<p>On the fifth morning Ysolt asks for your answer, on deck, in front of her admirals. And behind her, through the open hatch, you can see the machine in the hold, humming, three relics in its sockets, and the fourth socket empty, waiting for the heart.</p>
${sys("CRISIS",`[The Empress's Bargain]<br>Caradun: ${STANCE_WORD[nation("caradun").stance]}`,"warn")}`,
choices:()=>[
  {label:`"What's the machine for, Ysolt?"`, hint:F("watched")||F("confronted")?"You know already":"Ask it straight", fx:{n_c12:F("watched")||F("confronted")?2:1, askedMachine:true}, go:"c12c2"},
  {label:`"Yes. Hold the line. And take that machine out of your hold and throw it in the sea."`, hint:"Yes, on your terms", fx:{n_c12:2, terms:true}, go:"c12c2"},
  {label:`"No."`, hint:"Refuse", fx:{n_c12:1, refused12:true}, go:"c12c2"}
]},
c12c2:{ title:"The Machine", text:()=>`
<p>${nation("caradun").stance==="ally"||F("sangCaradun")?`Ysolt looks at the machine for a long time. ${say(`"It was built to take the heart if your ${HP()} sealed it,"`)} she says quietly. ${say(`"So that Caradun would have the crown, and could open it again, for its own people. I've never been sure I would use it."`)} She turns to her admirals. ${say(`"Throw it in the sea."`)}`
:`Ysolt doesn't answer. Two of her admirals move toward you, and the machine in the hold begins to hum louder, and the grey sea around the ship begins to churn.`}</p>`,
choices:()=>nation("caradun").stance==="ally"||F("sangCaradun") ? [
  {label:"Help them throw it over.", hint:"An alliance made", fx:{n_c12:2, ysoltPact:"ally"}, go:"c12c3"}
] : [
  {label:"Sing the Song of Sleeping to the machine.", hint:knowsSong("sleeping")?"You know it":"You half know it", fx:{n_c12:knowsSong("sleeping")?2:1, ysoltPact:"won"}, go:"c12c3"},
  {label:"Signal Kade's ship.", hint:F("kadeB3")?"He's close":"Nobody's close", fx:{n_c12:F("kadeB3")?2:0, ysoltPact:"escape"}, go:"c12c3"},
  {label:`Torin sets the machine's boiler alight while ${CHILD2()} pulls its relics out.`, hint:"The cousins", fx:{n_c12:(F("aff_torin")||0)>=2&&(F("aff_sib")||0)>=3?3:1, ysoltPact:"won"}, go:"c12c3"},
  {label:`"Ysolt. Your people below decks. I sang to their children. Look at me."`, hint:"One last try", fx:{n_c12:F("sangCaradun")?2:1, ysoltPact:"turned"}, go:"c12c3"}
]},
c12c3:{ title:"The Empress", enter(){ const o=outcome("c12"); S.flags.c12result=o; const p=F("ysoltPact"); if(p==="ally"||p==="turned"&&o!=="hard"||p==="won"&&o==="great"){ setStance("caradun","ally"); S.flags.ysoltPact="ally"; add({unity:4}); } else { setStance("caradun","rival"); } S.phase="open"; }, text:()=>`
<p>${nation("caradun").stance==="ally"?`The machine goes over the side and sinks into the grey sea without a sound. Ysolt stands at the rail watching the place where it went down. ${say(`"My fleets will be at the river,"`)} she says. ${say(`"Whatever you decide. Yours or your ${HP()}'s. I'm tired of deciding things alone."`)}`
:`You get off the ship with Elowen and Jory and ${CHILD2()} in a rowing boat, in the confusion, with the machine still humming in the hold behind you. Ysolt watches you go from the rail. She doesn't stop you. You don't know what that means.`}</p>
${sys("CRISIS OVER",`[The Empress's Bargain]<br>Caradun: ${STANCE_WORD[nation("caradun").stance]}`)}`,
choices:()=>[{label:"Go home. Everyone is coming.", go:"c12close"}]},
c12close:{ title:"Everyone Is Coming", text:()=>`<p>When you reach the river, the roads are full. Every road in the realm, all of them paved, all of them full: carts, banners, soldiers, singers, smiths, shepherds. Everyone you have ever met, and everyone your ${HP()} has. Coming to the bridge.</p>`, choices:()=>[{label:"End of Chapter Twelve.", go:"summary12"}]},
summary12: chapterSummary(12, ()=>`<p>Empress Ysolt made ${CHILD()} an offer, alone, and ${nation("caradun").stance==="ally"?"they made an alliance instead, and threw her machine into the sea":"they did not come to terms. Her machine is still in her hold."}.</p>`, "Chapter Thirteen: The Last Muster", "c13open"),

/* ============================ CHAPTER THIRTEEN: THE LAST MUSTER (both) ============================ */
c13open:{ title:"The Last Muster", enter(){ chapterEnter(13); }, text:()=>`
<p>They come from everywhere.</p>
<p>Seren, with House Valcrest's banners and Torin at the head of the whole Ember Guard, four hundred fire mages in red, and Ilsa riding beside him on the wind. Ruslan, white haired, with every smith in Karsk and the Collar Bell on a cart. Aunt Hesk's grandchildren with the highlanders and their crooks. The eleven chiefs of the northern clans. Tamsin, with a stick in one hand and Saelmar's fleet in the other. King Corvin, ${EMP()?"under your banner":"under his own, beside yours"}. The Spark School. The Academy's Listeners, with Hale in a carriage. The Sun Council of Orsenne, with Yselde. ${nation("caradun").stance==="ally"?"And wine colored sails at Seagate: Ysolt, as she promised.":""} ${F("c6result")==="great"?"Mother Vey, with the Hollow Court, in grey, singing.":""}</p>
<p>And the Realm Builders, from every lodge you ever founded, with picks on their shoulders, because Fen sent word that there were two last things to build.</p>
${sys("THIS CHAPTER",`[Both of you]<br>Four days, then four weeks of the last works: the Ring of Seals and the Choir's Stair · then the march to the river`)}`,
choices:()=>[{label:"Go down to meet them.", go:"c13days"}]},
c13days:{ title:"Everyone Comes", enter(){ daysEnter(); }, text:()=>`<p>Four days of arrivals.</p>`, choices:()=>[{label:"Plan the first day.", go:"plan"}]},
c13d1:{ title:"Old Friends", text:()=>`
<p>(You are ${N()}.) Bren dies on the first night, at a hundred and two, asleep in his chair in the manor kitchen with a cup of terrible tea going cold beside him. He had said he was waiting to see how it all came out. ${say(`"I've seen enough,"`)} he said at supper. ${say(`"It's coming out fine."`)}</p>`,
choices:()=>[
  {label:"Bury him beside your father, by the rose.", hint:"Morale +3", fx:{morale:3}, go:"nextday"},
  {label:"Carve his name on the first stone of the Ring.", hint:"Unity +3", fx:{unity:3}, go:"nextday"}
]},
c13d2:{ title:"Rehearsal", text:()=>`
<p>(You are ${CHILD()}.) The Choir rehearses in the Cathedral of Arches${has("cathedralArches")?"":", or what you'd call it if anyone had built it, which is the empty hill where it should be"}: ${choirN()} voices, and you in the middle. They sing the Song of Finishing all the way through, and on the last line the stones of the hill turn, for a moment, warm and new.</p>`,
choices:()=>[
  {label:"Again. From the top.", hint:"Song +2", fx:{song:2}, go:"nextday"},
  {label:"Let them rest, and sing the lullaby instead.", hint:"Morale +2 · Choir +2", fx:{morale:2}, then:()=>addChoir(2), go:"nextday"}
]},
c13d3:{ title:"What's Coming", text:()=>`
<p>(You are ${N()}.) The Listeners bring the news on the third day. ${F("c6result")==="great"?"The Undertow is rising by itself: every rift in the world at once, all of them reaching toward the river, toward the heart, toward the only place anyone has ever heard it.":"Mother Vey has come out of the Ashlands with the Hollow Court and every Unmade in the north, walking south toward the river. She means to open the heart herself, and let the world rest."} ${nation("caradun").stance==="rival"?"And Caradun's fleet is off Seagate, with a machine in its flagship's hold.":""}</p>`,
choices:()=>[
  {label:"Muster the whole Host on the north road.", hint:"Wardens +1,200", then:()=>{ hostAdd("wardens",4); }, go:"nextday"},
  {label:"Send the Listeners to every rift to slow it.", hint:"Listeners spread out · the crisis goes better", fx:{n_c13:1}, go:"nextday"}
]},
c13d4:{ title:"Elowen", text:()=>`
<p>(You are ${CHILD()}.) ${F("inLove")?`Elowen asks you to marry her on the fourth night, on the Bridge of Two Banks, over the heart, with a ring she grew out of a white rose. ${say(`"In case,"`)} she says. ${say(`"And also not in case. Also forever."`)}`:`Elowen sits with you on the bridge on the fourth night. She holds out her hand, and a white rose grows in it, and she gives it to you. ${say(`"In case,"`)} she says.`}</p>`,
choices:()=>F("inLove") ? [
  {label:`"Yes. Forever."`, hint:"Elowen ◆◆", fx:{aff_elowen:2, engaged:true}, go:"nextday"},
  {label:`"Ask me again after. I want to say yes to you in a finished world."`, hint:"Elowen ◆", fx:{aff_elowen:1, engagedAfter:true}, go:"nextday"}
] : [
  {label:"Take the rose, and her hand.", hint:"Elowen ◆◆", fx:{aff_elowen:2}, go:"nextday"},
  {label:"Kiss her.", hint:"Elowen ◆◆◆", fx:{aff_elowen:3, inLove:true}, go:"nextday"}
]},
c13season:{ title:"The Last Works", enter(){ seasonEnter(); }, text:()=>`
<p>Four weeks before whatever is coming reaches the river. Two last works to build: the Ring of Seals, which would close every rift in the realm, and the Choir's Stair, which would let a hundred singers stand at the heart at once.</p>
${sys("THE LAST WORKS",`Four weeks · three decisions a week · the council handles the rest · the Ring of Seals and the Choir's Stair are on the build list`)}`,
choices:()=>[{label:"Plan the first week.", go:"plan"}]},
c13w1:{ title:"Building Together", text:()=>`<p>Every Realm Builder in the world is in Brackenfold, and the ${has("ringOfSeals")?"Ring rises":"stones are piling up"} faster than anyone has ever built anything. Ruslan rings the Collar Bell every time a stone is set.</p>`, choices:()=>[{label:"Keep building.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"}]},
c13w2:{ title:"The Last Musters", text:()=>`<p>The Host drills on the north road every morning. Tamsin, at sixty three, outshouts everyone.</p>`,
choices:()=>[
  {label:"Drill the Host yourself.", hint:"Wardens +1,200", then:()=>{ hostAdd("wardens",4); }, go:"nextweek"},
  {label:"Spend the week with your family instead.", hint:"Trust +5 · Morale +3", fx:{trust:5, morale:3}, go:"nextweek"}
]},
c13w3:{ title:"The Letter", text:()=>`<p>You take your father's last letter out of your coat, the one that says ${say(`"For the end."`)} It isn't the end yet. You put it back. Your hands are shaking a little.</p>`, choices:()=>[{label:"Not yet.", go:"nextweek"}]},
c13w4:{ title:"The Night Before", text:()=>`
<p>The whole family eats together on the last night, in the great hall under your father's portrait: ${SPN()?SPN()+", ":""}${CHILD()}, ${CHILD2()}, Elowen, Seren and Torin and Ilsa, Fen and Lise and Jory, Tamsin, Ruslan. Nobody talks about tomorrow. Everybody talks about Brackenfold the first year, when it was a broken village, and you laugh until you can't breathe.</p>`,
choices:()=>[{label:"Raise a glass to the village.", hint:"Morale +3 · Unity +3", fx:{morale:3, unity:3}, go:"nextweek"}]},
c13c1:{ title:"The March to the River", enter(){ crisisEnter(); }, text:()=>`
<p>It comes down the north road at dawn: a tide of grey, a mile wide, with the Unmade walking at its front in their thousands, ${F("c6result")==="great"?"and nobody leading them at all":"and Mother Vey walking at the head of them, singing her lullaby"}.</p>
${sys("CRISIS",`[The Last Muster]<br>The Host: ${hostLine()}`,"warn")}`,
choices:()=>[
  {label:"Hold the north road with everything.", hint:`Strength ${hostPower()}`, fx:{n_c13:hostTest(160)}, go:"c13c2"},
  {label:"Send the Ember Guard to burn a wall of light across the road, with Torin at the front.", hint:"Torin · the cousins", fx:{n_c13:(F("aff_torin")||0)>=3?2:1, torinWall:true}, go:"c13c2"},
  {label:"Close the Ring of Seals around the city.", hint:has("ringOfSeals")?"You built it":"It isn't finished", fx:{n_c13:has("ringOfSeals")?3:0}, go:"c13c2"}
]},
c13c2:{ title:"Allies", text:()=>`<p>${natCount("ally")+natCount("province")>=4?"And from every side, they come: banners from every nation in the "+(EMP()?"Empire":"League")+", in lines that stretch to the horizon.":"Your allies come, the ones you have. It's not as many as you hoped."} ${nation("caradun").stance==="ally"?"Wine colored sails come up the river, and Ysolt's Wonders blaze on her decks.":nation("caradun").stance==="rival"?"Caradun's fleet holds off Seagate, waiting.":""}</p>`,
choices:()=>[{label:"Stand with them.", fx:{n_c13:natCount("ally")+natCount("province")>=4?2:1}, go:"c13c3"}]},
c13c3:{ title:"The Heart Opens", text:()=>`<p>At noon, under the bridge, the heart breaks open all the way, and the Undertow comes up through it, and the whole world holds its breath.</p>`, choices:()=>[{label:"Go down to the heart. Both of you.", go:"c13c4"}]},
c13c4:{ title:"The River", enter(){ const o=outcome("c13"); S.flags.c13result=o; S.phase="open"; }, text:()=>`
<p>${({great:"The line on the north road holds. Every one of them. The grey stops at the Ring.",good:"The line on the north road bends, and holds. The grey is in the outer city.",hard:"The line breaks. The grey is in Brackenfold."})[F("c13result")]}</p>`,
choices:()=>[{label:"End of Chapter Thirteen.", go:"summary13"}]},
summary13: chapterSummary(13, ()=>`<p>Everyone came. ${({great:"The line held.",good:"The line bent and held.",hard:"The line broke."})[F("c13result")]} And the heart is open.</p>`, "Chapter Fourteen: The Unfinished World", "c14open"),

/* ============================ CHAPTER FOURTEEN: THE UNFINISHED WORLD (both) ============================ */
c14open:{ title:"The Unfinished World", enter(){ chapterEnter(14); }, text:()=>`
<p>The chamber under the bridge is gone. In its place is a well of grey light going down forever, and at the top of it, the heart, cracked in two, floating, turning slowly, holding on.</p>
<p>${SPN()?`${SPN()} is at the top of the stair. `:""}${CHILD2()} is at the Ring, with ${C2("pos")} folding stones, Jory beside ${C2("obj")} with the ropes. Torin has lit a fire at the top of the well so there will always be a light to climb toward, and Ilsa is standing on the parapet with her arms out, holding back the wind. Elowen is beside your eldest. The Choir is on the Stair${has("choirStair")?", all "+choirN()+" of them, in a spiral going down into the light":", what of it there is"}.</p>
<p>You put your hands on one half of the heart. Your child puts ${CP("pos")} hands on the other.</p>
${sys("THE LAST CRISIS",`[The Unfinished World]<br>You'll switch between you and ${CHILD()} · everything you built in three books counts here`)}`,
choices:()=>[{label:"Hold.", go:"c14c1"}]},
c14c1:{ title:"Holding", enter(){ crisisEnter(); add({n_c14:Math.min(3,greats())}); }, text:()=>`
<p>(You are ${N()}.) It's the heaviest thing you have ever held. Heavier than the bridge on the day of the Vote, heavier than the heart on the night of the Breaking. Every Wonder in the world leaning on you at once, and under them a world that was never finished, pushing up.</p>
<p>${greats()>=6?"But you've held things before. A great many things. You know how.":""}</p>`,
choices:()=>[
  {label:"Hold the way you held the first bridge in Brackenfold: patiently.", hint:`Craft ${S.stats.craft}`, fx:{n_c14:S.stats.craft>=45?2:1}, go:"c14c2"},
  {label:"Call every Listener to sing the holding song with you.", hint:`Listeners ${hostFmt("listeners")}`, fx:{n_c14:S.host.listeners>=30?2:1}, go:"c14c2"}
]},
c14c2:{ title:"Singing", text:()=>`
<p>(You are ${CHILD()}.) You start to sing. ${knowsSong("finishing")?"The Song of Finishing.":"What you have of the Song of Finishing."} ${has("choirStair")?"Behind you, all the way down the Stair, the Choir picks it up, line after line, until the well is full of voices.":"Behind you, the Choir picks it up, as many as can fit around the heart."}</p>
<p>And the Undertow hears. You feel it stop pushing. You feel it turn toward the song the way the Unmade shepherd turned toward his name. ${say(`"IS THAT ME,"`)} it says.</p>`,
choices:()=>[
  {label:`"Yes. That's you. Listen."`, hint:`Song ${S.stats.song} · Choir ${choirN()}`, fx:{n_c14:S.stats.song>=31&&choirN()>=10?2:1}, go:"c14c3"},
  {label:"Look up at your parent.", hint:`Trust ${S.stats.trust}`, fx:{n_c14:S.stats.trust>=75?2:1}, go:"c14c3"},
  {label:`Look for ${CHILD2()}, at the Ring.`, hint:`Sibling ${"◆".repeat(Math.min(6,F("aff_sib")||0))}`, fx:{n_c14:(F("aff_sib")||0)>=5?2:1, sibFinal:true}, go:"c14c3"}
]},
c14c3:{ title:"Roots", text:()=>`
<p>(You are ${CHILD()}.) ${F("sibFinal")?`${CHILD2()} catches your eye across the well and does the thing with ${C2("pos")} eyebrows that has meant "you've got this" since ${C2s()} was six. You laugh, in the middle of the song, and the song gets stronger. `:""}Elowen kneels at the edge of the well and puts her hands in the grey light, and green goes down into it: roots, a thousand miles of roots, following your song down into the unfinished world, holding what it makes so it stays made.</p>`,
choices:()=>[
  {label:"Sing to her roots.", hint:`Elowen ${"◆".repeat(Math.min(6,F("aff_elowen")||0))}`, fx:{n_c14:(F("aff_elowen")||0)>=6?2:1}, go:"c14c4"}
]},
c14c4:{ title:"The Letter", enter(){ S.flags.readLetter=true; }, text:()=>`
<p>(You are ${N()}.) Somewhere in the middle of it, with your hands on the heart and your child singing beside you, you remember the letter in your coat. For the end. You'll know when.</p>
<p>You can't take your hands off the heart. ${SPN()?SPN()+" takes it out of your coat and reads it to you":CHILD2()+" takes it out of your coat and reads it to you"}, shouting over the song:</p>
<p>${say(`"My dear child. If you are reading this, it is the end of something, and you are frightened. I was frightened every day of my life, and I hid it, and it made me cruel. You were frightened every day of yours, and you built things anyway, and it made you kind. Whatever you are deciding now, decide it the way you built Brackenfold: with your hands, and with everyone. I am so proud of you. I was always proud of you. I am sorry it took me so long to say. Your father, Edric."`)}</p>`,
choices:()=>[{label:"Look at your child.", fx:{trust:5}, go:"c14choice"}]},
c14choice:{ title:"The Keystone and the Cantor", enter(){ const o=outcome("c14"); S.flags.c14result=o; S.phase="open"; }, text:()=>`
<p>The heart is in your hands. The song is in your child's mouth. The unfinished world is listening, waiting, the whole of it, for the two of you to decide what it will be.</p>
<p>${({great:"Everything you built in three books is holding. You have all the time you need.",good:"It's holding. Not for long.",hard:"It's barely holding. Decide now."})[F("c14result")]}</p>`,
choices:()=>[
  {label:"Finish it. Your child sings, you hold, Elowen's roots keep it made: a new world under the old.", hint:S.stats.trust>=75&&choirN()>=8&&knowsSong("finishing")&&(F("aff_elowen")||0)>=6&&F("c11accord")!=="split"?"The Finished World":"Needs Trust 75, a Choir of 8, the whole Song of Finishing, and Elowen", req:()=>S.stats.trust>=75&&choirN()>=8&&knowsSong("finishing")&&(F("aff_elowen")||0)>=6&&F("c11accord")!=="split", fx:{b3end:"finished"}, go:"end14finished"},
  {label:"Seal it forever. Your child sings it to sleep, you close the heart, and every Wonder holds.", hint:"The Eternal Seal", fx:{b3end:"seal"}, go:"end14seal"},
  ...(EMP()?[{label:"Take the crown. Hold the Undertow by holding the whole world, yourself, forever.", hint:"The Keystone Emperor", fx:{b3end:"emperor"}, go:"end14emperor"}]:[]),
  ...(!EMP()?[{label:"Give the crown to the League: every nation takes its turn holding it.", hint:S.stats.unity>=85?"The League of the Arch":"Needs Unity 85", req:()=>S.stats.unity>=85, fx:{b3end:"league"}, go:"end14league"}]:[]),
  {label:"Go down into the Undertow yourself, and become its foundation, so your child can finish it above.", hint:"The Last Mason", fx:{b3end:"lastmason"}, go:"end14lastmason"}
]},
end14finished:{ title:"The Finished World", text:()=>`
<p>You hold. Your child sings. Elowen's roots go down. And the Undertow, for the first time in a thousand years, is finished.</p>
<p>It doesn't happen all at once. It happens the way building happens: a stone, and then another. The half made mountains finish. The river that stopped in midair runs on. Grey ground turns to earth, and the earth turns green where Elowen's roots reach it. And far out to sea, beyond Seagate, in the grey water, land rises: a new coast, white cliffs, valleys still steaming, a whole new country coming up into the morning.</p>
<p>The voice speaks one last time, very quietly, from everywhere. ${say(`"THANK YOU. I AM."`)} And then it is quiet, the ordinary quiet of land, which is never really silent.</p>
${sys("ENDING",`[THE FINISHED WORLD]<br>The Undertow is land · the grey is gone from the world · there is room for everyone`)}`,
choices:()=>[{label:"Afterward.", go:"c14epilogue"}]},
end14seal:{ title:"The Eternal Seal", text:()=>`
<p>Your child sings the Song of Sleeping, softly, the way ${CP("pos")} grandfather sang the miller and the moon, and the Choir sings it with ${CP("obj")}, and the Undertow listens, and lies down.</p>
<p>You close the heart. The two halves come together under your hands like a broken bowl mended, and you feel every Wonder in the world settle at once: the Engine, the Garden, the Forge, the Gate, the Mirror, the Lantern. Asleep, all of them. For good.</p>
<p>${CHILD()} is crying, quietly. ${say(`"It'll be all right down there,"`)} you say. ${say(`"It's asleep."`)} ${say(`"I know,"`)} ${CP("sub")} says. ${say(`"I promised I'd come back. I'll go down and sing to it, sometimes."`)} You think that's probably a very good idea.</p>
${sys("ENDING",`[THE ETERNAL SEAL]<br>The Undertow sleeps forever · the grey slowly fades · the world builds its own wonders from now on`)}`,
choices:()=>[{label:"Afterward.", go:"c14epilogue"}]},
end14emperor:{ title:"The Keystone Emperor", text:()=>`
<p>You take the crown. Not a circlet. The whole of it: every Wonder in the world, every seal, every stone that leans on the heart, held in you, the way you held it on the night of the Breaking, only now forever.</p>
<p>The Undertow goes quiet under your hands. It knows you. You will hold it until you die, and then someone else will have to.</p>
<p>${S.stats.resent>=8?"And every kingdom in the world is yours, now, because nobody can stand against someone who holds the world's foundation in their hands. You tell yourself you'll give them back.":"And the kingdoms of the world stay in your Empire, because the person who holds the foundation should be the person who answers for it. You try to be kind. You mostly are."}</p>
<p>${CHILD()} watches you from the top of the Stair. ${S.stats.trust>=60?CPc("sub")+" comes down, after a while, and stands beside you.":CPc("sub")+" doesn't come down."}</p>
${sys("ENDING",`[THE KEYSTONE EMPEROR]<br>The Undertow is held, by you, forever · one ruler, one peace`)}`,
choices:()=>[{label:"Afterward.", go:"c14epilogue"}]},
end14league:{ title:"The League of the Arch", text:()=>`
<p>You close the heart enough to hold, and then you do something no Keystone has ever done: you share it.</p>
<p>A seat at the heart for every nation. Keystones from Aurendell and Orsenne and Saelmar, Cantors from the Choir, Listeners from every university, taking their turns under the bridge, a year at a time, holding the Undertow quiet together. Nobody holds it alone. Nobody ever has to.</p>
<p>The Hall of the Arch fills up the next spring with envoys from fourteen nations. Marren lives just long enough to see it, and says it's the worst run thing she's ever seen, and dies very happy.</p>
${sys("ENDING",`[THE LEAGUE OF THE ARCH]<br>The Undertow is held by everyone, taking turns · no one rules · everyone answers`)}`,
choices:()=>[{label:"Afterward.", go:"c14epilogue"}]},
end14lastmason:{ title:"The Last Mason", text:()=>`
<p>${say(`"Keep singing,"`)} you tell your child. ${say(`"Whatever happens. Don't stop."`)} And you let go of the heart, and step off the edge, down into the grey light.</p>
<p>It's like the year in the Engine, if you ever slept there: falling, and not falling. At the bottom, you put your hands on the unfinished world, and you do the only thing you have ever really known how to do. You hold. You become the stone everything else leans on: the foundation of a world.</p>
<p>Above you, very far away, you hear your child singing, and the Choir with ${CP("obj")}, and Elowen's roots coming down to meet you, and you feel the world being finished, stone by stone, on your shoulders. It's not heavy. It's the lightest thing you have ever held.</p>
${sys("ENDING",`[THE LAST MASON]<br>You are the foundation of the finished world · ${CHILD()} sang it whole above you`)}`,

const view=document.getElementById("view");
const perDay = () => F("away") ? 1 : 2, perWeek = () => 3;

function render(){
  if(S.scene==="title") return renderTitle();
  const sc=SCENES[S.scene];
  const choices=val(sc.choices).filter(c=>!(c.hide&&c.hide()));
  const body=sc.text();
  const C=CH[S.chapter]||CH[1];
  const where = S.phase==="days" ? ` · Part One · Day ${S.day}` : S.phase==="season" ? ` · Part Two · Week ${Math.min(S.week,C.weekLen)}` : S.phase==="expedition" ? ` · ${S.exp?S.exp.place:""} · Day ${S.day}` : S.phase==="crisis" ? " · The Crisis" : "";
  const pov = S.scene.startsWith("years") ? "The Fourteen Years" : `Chapter ${chName()}${C.pov==="heir"?` · ${CHILD()}`:C.pov==="both"?"":""}`;
  const inp=val(sc.input);
  view.innerHTML=`<div class="story fade ${C.pov==="heir"&&!S.scene.startsWith("years")?"heirpov":""}">
    <div class="chapter">Book Three · ${pov}${where}</div>
    ${castStrip(body)}
    ${S.scene==="plan"?guildCard()+townCard():""}
    <h2>${val(sc.title)}</h2>
    ${body}
    ${inp?`<div class="field"><label for="sceneInput">Name</label><input id="sceneInput" type="text" maxlength="${inp.max}" placeholder="${inp.placeholder}" value="${esc(val(inp.init)||"")}"></div>`:""}
    ${/^summary/.test(S.scene)?marksHTML(S.newMarks):""}
    <div class="choices">${choices.map((c,i)=>{
      const ok=!c.req||c.req();
      return `<button class="choice ${c.cls||""}" type="button" data-i="${i}" ${ok?"":"disabled"}>${c.label}${c.hint?`<small>${c.hint}</small>`:""}</button>`;
    }).join("")}</div></div>`;
  view.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(choices[+b.dataset.i]));
  bindMapTabs();
  refreshPanels();
  if(!S.keepScroll) window.scrollTo({top:0}); S.keepScroll=false;
  audioOnRender(body);
  guildToast();
  save();
}

function choose(c){
  if(c.restart){ const m=S.mode; S=START(); S.mode=m; for(let i=0;i<=14;i++) lsDel(cpKey(SLOT,i)); return render(); }
  S.surgeMsg="";
  if(c.work){
    if(F("surgeNext")) S.surgeMsg=sys("KEYSTONE SURGE",`[${val(W[c.work].name)}]<br>Raised without a single stone from the stores.`);
    doWork(c.work); S.buildsLeft--; S.scene="built"; S.builtBy="you"; return render();
  }
  if(c.camp){ doAct(c.camp); S.scene="actDone"; return render(); }
  if(c.cq){ S.cqNow=c.cq; S.scene="cq"; return render(); }
  if(c.guild){ guildDo(c.guild); S.scene="built"; S.builtBy="guild"; return render(); }
  if(c.petition){ petitionDo(c.petition); S.scene="built"; S.builtBy="town"; return render(); }
  if(c.toggleExtra){ S.showExtra=!S.showExtra; S.keepScroll=true; return render(); }
  if(c.toggleMore){ S.showMore=!S.showMore; S.keepScroll=true; return render(); }
  if(c.toggleLocked){ S.showLocked=!S.showLocked; S.keepScroll=true; return render(); }
  if(c.surge){ S.flags.surgeNext=true; S.flags.surgeKey=`${S.chapter}-${S.phase}`; S.keepScroll=true; return render(); }
  if(c.trade){ add(c.trade); S.keepScroll=true; return render(); }
  if(c.reserve){ drawReserve(c.reserve); S.keepScroll=true; sfx("build"); return render(); }
  if(c.skip){ S.buildsLeft=0; c={go:"event"}; }
  if(c.useInput){
    const el=document.getElementById("sceneInput"); const v=(el&&el.value||"").trim().replace(/\s+/g," ");
    if(c.useInput==="child2") S.family.child2 = v || "Rowan";
  }
  if(c.fx) add(c.fx);
  if(c.then) c.then();
  S.stats.trust=Math.max(0,Math.min(100,S.stats.trust));
  let go=c.go;
  const C=CH[S.chapter];
  if(go==="event") go = S.phase==="season" ? C.weeks[S.week] : C.days[S.day];
  if(go==="nextday"){ daily(); S.day++; S.buildsLeft=perDay(); if(S.exp) S.exp.actsLeft=2; go = S.day>C.dayLen ? C.afterDays : (S.phase==="expedition" ? "camp" : "plan"); }
  if(go==="nextweek"){ weekly(); S.week++; S.buildsLeft=perWeek(); go = S.week>C.weekLen ? C.afterWeeks : "plan"; }
  S.scene=go;
  const sc=SCENES[S.scene];
  if(!sc) throw new Error("No scene: "+go);
  if(sc.enter) sc.enter();
  if(OPEN_OF[S.scene]) saveCheckpoint(OPEN_OF[S.scene]);
  S.newMarks = /^summary/.test(S.scene) ? awardMarks() : null;
  render();
}

/* ======================= THE REALM MAP =======================
   The river runs north to south; the sea is at the bottom; the iron hills to the east. */
let rmN=0;
function hullOf(pts){
  pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); if(pts.length<3) return pts;
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[],up=[];
  for(const p of pts){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for(const p of pts.slice().reverse()){ while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  return lo.slice(0,-1).concat(up.slice(0,-1));
}
const MANOR_AT = {hill:[104,128], island:[192,148], garden:[150,104]};
function settlementIcon(k){
  const s=SITES[k], L=S.lv[k], x=s.x, y=s.y, ink="var(--sk-ink)";
  if(!L) return `<circle cx="${x}" cy="${y}" r="6" fill="none" stroke="var(--sk-ghost)" stroke-dasharray="2 2"/><path d="M${x-2},${y} h4 M${x},${y-2} v4" stroke="var(--sk-ghost)"/>`;
  const house=(hx,hy,sz=1)=>`<path d="M${hx-3*sz},${hy} v${-3*sz} l${3*sz},${-2.6*sz} l${3*sz},${2.6*sz} v${3*sz} z" fill="var(--sk-paper)" stroke="${ink}" stroke-width="1"/>`;
  const spots=[[0,0],[7,2],[-7,3],[3,-6],[-4,-6],[9,-5],[-9,-3],[1,8],[-6,9],[8,8]];
  const n=[0,3,5,7,10,10][L];
  let g="";
  if(L>=3) g+=`<circle cx="${x}" cy="${y+1}" r="${L>=5?20:L>=4?17:14}" fill="rgba(201,135,58,.10)" stroke="${ink}" stroke-width="${L>=4?1.8:1}" ${L>=4?"":'stroke-dasharray="3 2"'}/>`;
  if(L>=4) [0,72,144,216,288].forEach(a=>{ const r=17, tx=x+r*Math.cos(a*Math.PI/180), ty=y+1+r*Math.sin(a*Math.PI/180); g+=`<rect x="${(tx-2).toFixed(1)}" y="${(ty-2).toFixed(1)}" width="4" height="4" fill="var(--sk-paper)" stroke="${ink}" stroke-width=".9"/>`; });
  g+=spots.slice(0,n).map(([dx,dy],i)=>house(x+dx,y+dy+3,i===0&&L>=3?1.3:1)).join("");
  if(k==="brack") g+=`<path d="M${x},${y-14} v-12 l9,3 l-9,3" fill="var(--sk-wash)" stroke="${ink}" stroke-width="1"/>`;
  if(s.kind==="iron") g+=`<path d="M${x+11},${y-4} q2,-6 0,-10 q3,3 4,0" fill="none" stroke="${ink}" stroke-width=".8" opacity=".6"/>`;
  if(s.kind==="port") g+=`<path d="M${x-12},${y+12} h24" stroke="${ink}" stroke-width="2"/>`;
  return g;
}

  // border of the realm: around every settled place
  const live=alive().map(k=>[SITES[k].x,SITES[k].y]);
  const H=hullOf(live); const cx=H.reduce((t,p)=>t+p[0],0)/H.length, cy=H.reduce((t,p)=>t+p[1],0)/H.length;

  // roads, built and possible
  const road=(a,b,built)=>{ const A=SITES[a], B=SITES[b], mx=(A.x+B.x)/2+(A.y-B.y)*.08, my=(A.y+B.y)/2+(B.x-A.x)*.08;
    let g=`<path d="M${A.x},${A.y} Q${mx.toFixed(1)},${my.toFixed(1)} ${B.x},${B.y}" fill="none" stroke="${built?ink:"var(--sk-ghost)"}" stroke-width="${built?2:1}" ${built?"":'stroke-dasharray="2 4"'} stroke-linecap="round"/>`;
    if(built && crossesRiver(a,b)){ // a bridge where the road crosses the river
      let t=.5; for(let i=0;i<20;i++){ const tt=i/20, px=(1-tt)*(1-tt)*A.x+2*(1-tt)*tt*mx+tt*tt*B.x, py=(1-tt)*(1-tt)*A.y+2*(1-tt)*tt*my+tt*tt*B.y; if(Math.abs(px-riverX(py))<6){ t=tt; break; } }

    return g; };
  const roads = EDGES.map(([a,b])=>{ const built=S.roads.includes(edgeKey(a,b)); if(!built && !(S.lv[a]>0&&S.lv[b]>0)) return ""; return road(a,b,built); }).join("");
  const towns=Object.keys(SITES).map(settlementIcon).join("");

function familyCast(){
  if(S.family&&S.family.child){ CAST.heirkid={n:S.family.child, skin:"#e6c6a6", hair:"#3a2a1e", style:F("childP")==="she"?"long":"soft", eye:"#5a8ab0", cloth:"#3a5a7a", bg:"#c8d8e0", brow:"soft", young:true, spark:true}; }
  if(S.family&&S.family.child2){ CAST.kid2={n:S.family.child2, skin:"#e0c0a0", hair:"#6a4a2a", style:"messy", eye:"#5a4a3a", cloth:"#6a5a44", bg:"#d8c8a8", brow:"kind", young:true}; }
}
function castIn(html){
  familyCast();
  const t0=String(html).replace(/<[^>]+>/g," ");
  const extra=[]; const esc2=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  if(CAST.heirkid){ const m=t0.match(new RegExp("\\b"+esc2(CAST.heirkid.n)+"\\b")); if(m) extra.push(["heirkid",m.index]); }
  if(CAST.kid2){ const m=t0.match(new RegExp("\\b"+esc2(CAST.kid2.n)+"\\b")); if(m) extra.push(["kid2",m.index]); }
  const t=String(html).replace(/<[^>]+>/g," ");
  return CAST_MATCH.map(([id,re])=>{ const m=t.match(re); return m?[id,m.index]:null; }).filter(Boolean).concat(extra)
    .sort((a,b)=>a[1]-b[1]).slice(0,3).map(x=>x[0]);
}

  P.push(front);

const NO_CAST = ["plan","built","title","camp","years"];
function castStrip(html){
  if(NO_CAST.includes(S.scene)) return "";
  const ids=castIn(html); if(!ids.length) return "";
  return `<div class="cast">${ids.map(id=>`<figure>${portrait(id)}<figcaption>${CAST[id].n}</figcaption></figure>`).join("")}</div>`;
}

/* ======================= MUSIC AND SOUND =======================
   Everything is generated live with the Web Audio API: no audio files. */
const AUDIO={ctx:null, master:null, music:null, on:false, timer:null, mood:null, lastScene:null, step:0};
try{ AUDIO.on = lsGet("fie_sound")==="on"; }catch(e){}
const MOODS={
  hearth:{root:220.00, scale:[0,2,4,7,9], beat:1.9, pad:[0,7,16]},   // home, building
  winter:{root:196.00, scale:[0,2,3,7,10], beat:2.6, pad:[0,7,15]},
  court: {root:246.94, scale:[0,2,4,5,7,9,11], beat:1.6, pad:[0,4,7]},
  sea:   {root:174.61, scale:[0,2,5,7,9], beat:2.2, pad:[0,7,14]},
  storm: {root:146.83, scale:[0,1,3,7,8], beat:1.1, pad:[0,3,7]},    // crises
  dream: {root:261.63, scale:[0,4,7,11,14], beat:3.0, pad:[0,7,11]}
};
function curMood(){
  if(S.phase==="crisis") return "storm";
  if(S.chapter===8 || /^(end14|c14|c11c)/.test(S.scene)) return "dream";
  if(S.chapter===5 || S.chapter===2 || S.chapter===12) return "sea";
  if(S.chapter===9) return "winter";
  if(F("away")||/^(c1close|c3open|c4)/.test(S.scene)) return "court";
  return "hearth";
}
function audioInit(){
  if(AUDIO.ctx) return true;
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return false;
  try{ AUDIO.ctx=new C(); }catch(e){ return false; }
  AUDIO.master=AUDIO.ctx.createGain(); AUDIO.master.gain.value=.55; AUDIO.master.connect(AUDIO.ctx.destination);
  AUDIO.music=AUDIO.ctx.createGain(); AUDIO.music.gain.value=.32;
  const lp=AUDIO.ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1800;
  AUDIO.music.connect(lp); lp.connect(AUDIO.master);
  return true;
}
function note(freq, dur, opt={}){
  const a=AUDIO.ctx, t=a.currentTime+(opt.at||0), o=a.createOscillator(), g=a.createGain();
  o.type=opt.type||"sine"; o.frequency.value=freq;
  const v=opt.vol||.2, att=opt.attack||.01;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(opt.bus||AUDIO.master); o.start(t); o.stop(t+dur+.05);
}
function noise(dur, opt={}){
  const a=AUDIO.ctx, len=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,opt.decay||3);
  const s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter();
  f.type=opt.filter||"bandpass"; f.frequency.value=opt.freq||1200; g.gain.value=opt.vol||.3;
  s.buffer=buf; s.connect(f); f.connect(g); g.connect(AUDIO.master); s.start(a.currentTime+(opt.at||0));
}
function sfx(kind){
  if(!AUDIO.on||!AUDIO.ctx) return;
  if(kind==="build"){ noise(.12,{freq:900,vol:.35}); note(110,.25,{type:"triangle",vol:.25}); noise(.1,{freq:1400,vol:.25,at:.18}); note(98,.2,{type:"triangle",vol:.18,at:.18}); }
  if(kind==="turn"){ noise(.08,{freq:2600,vol:.06,decay:2}); }
  if(kind==="system"){ note(880,.5,{vol:.08}); note(1318.5,.6,{vol:.06,at:.06}); }
  if(kind==="chapter"){ [0,4,7,12].forEach((s,i)=>note(261.63*Math.pow(2,s/12),1.4,{vol:.12,at:i*.14,type:"triangle"})); }
  if(kind==="mark"){ [0,7,12,16,19].forEach((s,i)=>note(523.25*Math.pow(2,s/12),1.1,{vol:.08,at:i*.09})); }
  if(kind==="drum"){ note(55,.9,{type:"sine",vol:.45,attack:.005}); noise(.4,{filter:"lowpass",freq:200,vol:.3}); }
}
function musicTick(){
  if(!AUDIO.on||!AUDIO.ctx) return;
  const M=MOODS[AUDIO.mood||"hearth"], a=AUDIO.ctx; AUDIO.step++;
  const hz=s=>M.root*Math.pow(2,s/12);
  if(AUDIO.step%4===1) M.pad.forEach(s=>note(hz(s)/2, M.beat*4.2, {vol:.05, attack:1.2, bus:AUDIO.music}));
  if(Math.random()<.72){ const s=M.scale[Math.floor(Math.random()*M.scale.length)]+(Math.random()<.3?12:0); note(hz(s), M.beat*1.6, {type:"triangle", vol:.07, attack:.02, bus:AUDIO.music}); }
  if(AUDIO.mood==="storm" && AUDIO.step%2===0) note(hz(0)/4, .7, {vol:.18, attack:.005, bus:AUDIO.music});
  clearTimeout(AUDIO.timer); AUDIO.timer=setTimeout(musicTick, M.beat*1000);
}
function setSound(on){
  AUDIO.on=on; lsSet("fie_sound", on?"on":"off");
  const b=document.getElementById("btnSound"); if(b){ b.setAttribute("aria-pressed", on); b.textContent = on ? "Sound on" : "Sound off"; }
  if(on){ if(!audioInit()) return; if(AUDIO.ctx.state==="suspended") AUDIO.ctx.resume(); AUDIO.mood=curMood(); clearTimeout(AUDIO.timer); musicTick(); }
  else { clearTimeout(AUDIO.timer); if(AUDIO.ctx) AUDIO.ctx.suspend(); }
}
function audioOnRender(html){
  if(!AUDIO.on||!AUDIO.ctx) { AUDIO.lastScene=S.scene; return; }
  const m=curMood(); if(m!==AUDIO.mood){ AUDIO.mood=m; }
  if(S.scene!==AUDIO.lastScene){
    if(S.scene==="built") sfx("build");
    else if(/^summary/.test(S.scene)) { sfx("chapter"); if(S.newMarks&&S.newMarks.length) setTimeout(()=>sfx("mark"),900); }
    else if(OPEN_OF[S.scene]!==undefined||S.scene==="years") sfx("chapter");
    else if(m==="storm" && AUDIO.lastScene && !/c\d+c\d/.test(AUDIO.lastScene)) sfx("drum");
    else if(String(html).includes('class="sys')) sfx("system");
    else sfx("turn");
  }
  AUDIO.lastScene=S.scene;
}
document.addEventListener("visibilitychange", ()=>{ if(!AUDIO.ctx) return; if(document.hidden){ clearTimeout(AUDIO.timer); AUDIO.ctx.suspend(); } else if(AUDIO.on){ AUDIO.ctx.resume(); musicTick(); } });
/* ------------------------- INSTALLABLE APP ------------------------- */
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
let installEvt=null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installEvt=e; document.getElementById("btnInstall").hidden=false; });
document.getElementById("btnInstall").onclick=async()=>{ if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(()=>{}); installEvt=null; document.getElementById("btnInstall").hidden=true; };
window.addEventListener("appinstalled", ()=>{ document.getElementById("btnInstall").hidden=true; });

/* ======================= BOOT ======================= */
if(AUDIO.on){ const b=document.getElementById("btnSound"); if(b){ b.textContent="Sound on"; b.setAttribute("aria-pressed","true"); } }
render();
