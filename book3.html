<!doctype html>
<html lang="en">
<head>

<style>html{color-scheme:dark}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Forged in Exile III</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cinzel+Decorative:wght@700&family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow reading column like a manhwa panel strip; glowing "system windows" for stats; the village appears as an ink survey sketch on parchment. Dark only, by design. */
:root{
  --ink:#0e1116; --panel:#171b23; --paper:#e8e3d6; --muted:#8f97a6;
  --ember:#e0a54a; --rune:#6fd3ff; --danger:#e0605a; --line:#2a303c;
  --sk-paper:#e4d9bf; --sk-ink:#2e261a; --sk-ghost:rgba(46,38,26,.32); --sk-wash:#c9873a; --sk-water:#6f95a8;
  --display:"Cinzel Decorative","Trajan Pro",Georgia,serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  --sys:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:18px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;padding-block:24px 96px;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mark{font-family:var(--display);font-size:15px;color:var(--ember);letter-spacing:.06em}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--sys);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:4px}
.ghost:hover,.ghost:focus-visible{color:var(--paper);border-color:var(--muted);outline:none}
.ghost[aria-pressed=true]{color:var(--rune);border-color:var(--rune)}
.chapter{font-family:var(--sys);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-size:clamp(32px,8vw,52px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:24px;line-height:1.25;margin:0;color:var(--ember);text-wrap:balance}
.story{display:flex;flex-direction:column;gap:16px}
.story p{margin:0}
.story em{color:#f3dfb8}
.say{color:#f3dfb8}
.sys{border:1px solid var(--rune);background:linear-gradient(180deg,rgba(111,211,255,.10),rgba(111,211,255,.03));
  box-shadow:0 0 0 1px rgba(111,211,255,.15),0 0 24px rgba(111,211,255,.18);border-radius:3px;padding:12px 14px;
  font-family:var(--sys);font-size:14px;line-height:1.5;color:var(--rune);animation:pop .5s ease-out}
.sys b{display:block;font-size:11px;letter-spacing:.18em;opacity:.75;margin-bottom:4px}
.sys.warn{border-color:var(--danger);color:#ffb3ae;background:rgba(224,96,90,.08);box-shadow:0 0 20px rgba(224,96,90,.15)}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.choice{text-align:left;background:var(--panel);color:var(--paper);border:1px solid var(--line);border-left:3px solid var(--ember);
  padding:14px 16px;border-radius:2px;font-size:17px;line-height:1.45;transition:background .15s,border-color .15s}
.choice:hover,.choice:focus-visible{background:#1f2430;border-color:var(--ember);outline:none}
.choice small{display:block;font-family:var(--sys);font-size:11px;letter-spacing:.05em;color:var(--muted);margin-top:4px;line-height:1.5}
.choice[disabled]{opacity:.42;cursor:not-allowed;border-left-color:var(--line)}
.choice.build{border-left-color:var(--rune)}
.choice.claim{border-left:3px double var(--ember);background:linear-gradient(90deg,rgba(224,165,74,.10),transparent 60%),var(--panel)}
.choice.trade{border-left-color:var(--muted);font-size:15px;padding:10px 14px}
.choice.build:hover,.choice.build:focus-visible{border-color:var(--rune)}
.field{display:flex;flex-direction:column;gap:6px}
label{font-family:var(--sys);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text]{font:inherit;background:var(--panel);color:var(--paper);border:1px solid var(--line);padding:12px;border-radius:2px;width:100%;box-sizing:border-box}
input[type=text]:focus{outline:2px solid var(--ember);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 90px;background:var(--panel);color:var(--paper);border:1px solid var(--line);padding:10px;border-radius:2px}
.seg button[aria-pressed=true]{border-color:var(--ember);color:var(--ember)}
.primary{background:var(--ember);color:#1a1206;border:0;padding:14px 18px;border-radius:2px;font-weight:600;font-size:17px}
.primary:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.res{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--sys);font-size:12px;color:var(--muted);letter-spacing:.04em}
.res span b{color:var(--paper);font-variant-numeric:tabular-nums}
.crews{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.crew-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--sys);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rune)}
.crew-head span:last-child{color:var(--muted);letter-spacing:.06em}
.crew-row{display:grid;grid-template-columns:1fr auto 74px;align-items:center;gap:10px}
.crew-name{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.crew-name strong{font-size:16px;font-weight:600}
.crew-name span{font-family:var(--sys);font-size:11px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.step{width:34px;height:34px;border-radius:2px;border:1px solid var(--line);background:#11151c;color:var(--paper);font-family:var(--sys);font-size:18px;line-height:1}
.step:hover:not([disabled]),.step:focus-visible{border-color:var(--rune);color:var(--rune);outline:none}
.step[disabled]{opacity:.35;cursor:not-allowed}
.stepper output{min-width:18px;text-align:center;font-family:var(--sys);font-variant-numeric:tabular-nums}
.crew-out{font-family:var(--sys);font-size:12px;color:var(--rune);text-align:right;font-variant-numeric:tabular-nums}
.crew-last{font-family:var(--sys);font-size:12px;color:var(--ember)}
.codex{background:var(--sk-paper);color:var(--sk-ink);border-radius:2px;padding:14px;box-shadow:inset 0 0 40px rgba(120,90,40,.35),0 6px 18px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px}
.codex h3{margin:0;font-family:var(--hand);font-size:22px;font-weight:700;line-height:1.2}
.page{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start;border-top:1px solid rgba(46,38,26,.25);padding-top:12px}
.page-art svg{width:100%;height:auto;display:block}
.page-art text{font-family:var(--hand);fill:var(--sk-ink)}
.page h4{margin:0;font-family:var(--hand);font-size:22px;line-height:1.1}
.page h4 span{font-size:16px;opacity:.6;font-style:italic}
.page p{margin:4px 0 0;font-size:15px;line-height:1.5}
.page .unl{font-family:var(--sys);font-size:11px;letter-spacing:.04em;color:#7a4a12}
.page.locked{opacity:.55}
@media (max-width:420px){.page{grid-template-columns:1fr}.page-art{max-width:160px}}
.tierbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 14px}
.tierbar b{display:block;font-family:var(--display);color:var(--ember);font-size:17px}
.tierbar span{font-family:var(--sys);font-size:11px;color:var(--muted)}
.pips{display:flex;gap:5px}.pips i{width:12px;height:12px;border:1px solid var(--ember);transform:rotate(45deg)}.pips i.on{background:var(--ember)}
.res small{color:var(--muted)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare figure{margin:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.compare figcaption{font-family:var(--sys);font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em}
@media (max-width:520px){.compare{grid-template-columns:1fr}}
.chapters{display:flex;flex-direction:column;gap:12px}
.chap{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;color:var(--paper)}
.chap-n{font-family:var(--display);color:var(--ember);font-size:16px;text-align:center;padding-top:2px}
.chap-body{min-width:0}
.chap-body b{font-family:var(--body);font-size:16px}
.chap-body span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.chap-body p{margin:4px 0 0;font-family:var(--body);font-size:14px;line-height:1.5;color:var(--muted)}
.chap.now .chap-body b{color:var(--rune)}
.chap.soon{opacity:.6}
.chron{background:var(--sk-paper);color:var(--sk-ink);border-radius:2px;padding:16px 18px;box-shadow:inset 0 0 40px rgba(120,90,40,.35),0 6px 18px rgba(0,0,0,.4)}
.chron h3{margin:0;font-family:var(--hand);font-size:26px}
.chron-sub{margin:2px 0 10px;font-size:13px;font-style:italic;opacity:.7}
.chron ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.45}
.chron-sign{margin:12px 0 0;font-family:var(--hand);font-size:20px}
.cast{display:flex;gap:10px;flex-wrap:wrap}
.cast figure{margin:0;width:88px;display:flex;flex-direction:column;gap:4px;animation:pop .45s ease-out}
.cast svg{width:88px;height:auto;display:block;border-radius:2px;box-shadow:0 4px 12px rgba(0,0,0,.45)}
.cast figcaption{font-family:var(--sys);font-size:10px;letter-spacing:.06em;color:var(--muted);text-align:center;line-height:1.3}
.seg.mode button{display:flex;flex-direction:column;gap:2px;text-align:left;flex:1 1 200px;padding:12px}
.seg.mode button b{font-size:16px}
.seg.mode button small{font-family:var(--sys);font-size:11px;color:var(--muted);line-height:1.45}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.slot.now .slot-info b{color:var(--ember)}
.slot-info{min-width:0;display:flex;flex-direction:column;gap:2px}
.slot-info b{font-family:var(--body);font-size:15px;color:var(--paper)}
.slot-info span{font-size:12px;color:var(--muted)}
.slot-btns{display:flex;gap:6px}
.slot-new{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.replay{margin-top:6px}
@media (prefers-reduced-motion:reduce){.cast figure{animation:none}}
.maptabs{display:flex;gap:6px;margin-bottom:-6px}
.guild{border:1px solid var(--ember);background:linear-gradient(180deg,rgba(224,165,74,.10),rgba(224,165,74,.03));border-radius:3px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;animation:pop .5s ease-out}
.guild-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--sys);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember)}
.guild-head span:last-child{color:var(--muted);letter-spacing:.06em}
.guild-row{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.guild-row i{font-style:normal;color:var(--ember);font-size:15px;line-height:1.3;text-align:center}
.guild-row b{display:block;font-weight:600;font-size:16px;line-height:1.35}
.guild-row small{display:block;font-family:var(--sys);font-size:11px;color:var(--muted);line-height:1.45}
.guild-row.idle b{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);width:min(560px,calc(100% - 32px));box-sizing:border-box;
  background:var(--panel);border:1px solid var(--ember);border-radius:4px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.55);
  display:flex;flex-direction:column;gap:4px;z-index:50;transition:transform .35s ease-out;cursor:pointer;color:var(--paper)}
#toast.show{transform:translate(-50%,0)}
#toast b{font-family:var(--sys);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ember)}
#toast span{font-size:15px;line-height:1.4}
#toast small{font-family:var(--sys);font-size:10px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.guild{animation:none}}
.crew-note{font-size:14px;color:var(--muted);font-style:italic}
/* stat sheet */
.sheet{background:var(--panel);border:1px solid var(--rune);border-radius:3px;padding:16px;font-family:var(--sys);font-size:13px;color:var(--rune);box-shadow:0 0 24px rgba(111,211,255,.15)}
.sheet h3{margin:0 0 10px;font-size:11px;letter-spacing:.2em}
.row{display:grid;grid-template-columns:100px 1fr 28px;align-items:center;gap:10px;margin:6px 0}
.bar{height:6px;background:#0b1a22;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rune)}
.row.bad .bar i{background:var(--danger)}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.sheet .note{color:var(--muted);margin-top:10px;font-size:12px}
/* survey sketch */
.survey{background:var(--sk-paper);border-radius:2px;padding:10px;box-shadow:inset 0 0 40px rgba(120,90,40,.35),0 6px 18px rgba(0,0,0,.4);transform:rotate(-.4deg)}
.survey svg{display:block;width:100%;height:auto}
.survey text{font-family:var(--hand);fill:var(--sk-ink)}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
.smoke{animation:drift 3.5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-3px);opacity:.35}}
.ad{border:1px dashed var(--muted);color:var(--muted);font-family:var(--sys);font-size:12px;text-align:center;padding:28px 12px;border-radius:2px}
.fade{animation:fade .45s ease-out}
@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sys,.fade,.wheel,.smoke{animation:none}}
.choice.build.manor{border-left-color:var(--ember);background:linear-gradient(90deg,rgba(224,165,74,.08),transparent 60%),var(--panel)}
svg.realm,svg.manor{display:block;width:100%;height:auto;border-radius:2px;box-shadow:inset 0 0 40px rgba(120,90,40,.35),0 6px 18px rgba(0,0,0,.4)}
svg.realm text,svg.manor text{paint-order:stroke;stroke:var(--sk-paper);stroke-width:3px;stroke-linejoin:round}
.beforeafter{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.beforeafter figure,.manor-fig{margin:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.beforeafter figcaption,.manor-fig figcaption{font-family:var(--sys);font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em}
@media (max-width:520px){.beforeafter{grid-template-columns:1fr}}
#toast:not(.show){visibility:hidden;transition:transform .35s ease-out,visibility 0s .35s}
.guild.town{border-color:var(--rune);background:linear-gradient(180deg,rgba(111,211,255,.08),rgba(111,211,255,.02))}.guild.town .guild-head span:first-child,.guild.town .guild-row i{color:var(--rune)}
.choice.guildpick{border-left-color:var(--ember);background:linear-gradient(90deg,rgba(224,165,74,.12),transparent 70%),var(--panel)}
.choice.petition{border-left-color:var(--rune);background:linear-gradient(90deg,rgba(111,211,255,.10),transparent 70%),var(--panel)}
.choice.special{border-left:3px double var(--rune)}
.choice.built-pays{border-left:3px solid #8fd18a;background:linear-gradient(90deg,rgba(143,209,138,.10),transparent 70%),var(--panel)}
.story.heirpov h2{color:#9fd8ff}
.story.heirpov .chapter:first-child{color:#9fd8ff}
svg.world{margin-top:2px}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">Forged in Exile III</div>
    <div class="hbtns">
      <button class="ghost" id="btnMap" type="button" aria-pressed="false">Maps</button>
      <button class="ghost" id="btnChapters" type="button" aria-pressed="false">Chapters</button>
      <button class="ghost" id="btnMarks" type="button" aria-pressed="false">Marks</button>
      <button class="ghost" id="btnStats" type="button" aria-pressed="false">Status</button>
      <button class="ghost" id="btnSaves" type="button" aria-pressed="false">Saves</button>
      <button class="ghost" type="button" onclick="location.href='index.html'">Book One</button>
      <button class="ghost" type="button" onclick="location.href='book2.html'">Book Two</button>
      <button class="ghost" type="button" onclick="location.href='transfer.html'">Move saves</button>
      <button class="ghost" id="btnSound" type="button" aria-pressed="false">Sound off</button>
      <button class="ghost" id="btnInstall" type="button" hidden>Install</button>
    </div>
  </header>
  <div id="mapBox" hidden></div>
  <div id="chaptersBox" hidden></div>
  <div id="marksBox" hidden></div>
  <div id="savesBox" hidden></div>
  <div id="sheetBox" hidden></div>
  <main id="view" aria-live="polite"></main>
</div>

<script>
/* ================================================================
   FORGED IN EXILE, BOOK THREE: THE REALM ENGINE (forked from Book Two)
   Book One built a town. Book Two built a kingdom. Book Three saves the world.
   1. S holds the realm: settlements, roads, resources, unity,
      the family and the manor.
   2. Each week every settlement produces by its kind and size,
      but only at full strength if a road links it to the capital.
   3. Works are region-scale: roads and bridges, founding and
      growing settlements, paving highways, each settlement's own
      landmark, great works, and the manor.
   4. CH describes each chapter: its days, its crisis, its season.
   ================================================================ */
const SITES = {
  brack:     {name:"Brackenfold",   x:132, y:150, bank:"w", kind:"trade", start:4},
  marrow:    {name:"Marrow Ford",   x:74,  y:98,  bank:"w", kind:"farm",  start:2},
  hollin:    {name:"Hollin Cross",  x:58,  y:42,  bank:"w", kind:"trade", start:3},
  woodsedge: {name:"Woodsedge",     x:126, y:62,  bank:"w", kind:"timber",start:1},
  greenreach:{name:"Greenreach",    x:44,  y:178, bank:"w", kind:"farm",  start:0},
  over:      {name:"Overbrack",     x:246, y:156, bank:"e", kind:"trade", start:3},
  velm:      {name:"Velm",          x:300, y:110, bank:"e", kind:"trade", start:3},
  karsk:     {name:"Karsk",         x:346, y:58,  bank:"e", kind:"iron",  start:1},
  coldwater: {name:"Coldwater",     x:300, y:208, bank:"e", kind:"farm",  start:1},
  ironvale:  {name:"Ironvale",      x:370, y:134, bank:"e", kind:"iron",  start:0},
  highmeadow:{name:"Highmeadow",    x:258, y:58,  bank:"e", kind:"farm",  start:0},
  stonegate: {name:"Stonegate",     x:360, y:200, bank:"e", kind:"stone", start:0},
  saltford:  {name:"Saltford",      x:198, y:262, bank:"w", kind:"port",  start:0},
  northwatch:{name:"Northwatch",    x:176, y:30,  bank:"w", kind:"stone", start:0, ch:2},
  deepforge: {name:"Deepforge",     x:392, y:100, bank:"e", kind:"iron",  start:0, ch:4},
  gullhaven: {name:"Gullhaven",     x:268, y:250, bank:"e", kind:"port",  start:0, ch:5},
  reedmere:  {name:"Reedmere",      x:236, y:212, bank:"e", kind:"farm",  start:0, ch:9},
  aurelsrise:{name:"Aurel's Rise",  x:304, y:22,  bank:"e", kind:"trade", start:0},
  freehaven: {name:"Freehaven",     x:140, y:250, bank:"w", kind:"port",  start:0},
  seagate:   {name:"Seagate",       x:330, y:256, bank:"e", kind:"port",  start:0}
};
const EDGES = [["brack","over"],["brack","marrow"],["brack","hollin"],["brack","woodsedge"],["marrow","hollin"],["marrow","greenreach"],["brack","greenreach"],
  ["brack","saltford"],["over","saltford"],["over","velm"],["velm","karsk"],["velm","highmeadow"],["karsk","ironvale"],["velm","ironvale"],["over","coldwater"],
  ["coldwater","stonegate"],["velm","stonegate"],["woodsedge","highmeadow"],["coldwater","saltford"],["karsk","highmeadow"],

  Object.assign(y, base);
  const plus=(r,v)=>{ y[r]=(y[r]||0)+v; };
  if(k==="brack"){ plus("stone",8); plus("timber",10); plus("grain",10); }
  if(s.kind==="farm"||s.kind==="stone") plus("timber",L);
  if(F("manorSite")==="garden" && k==="brack") plus("grain",2);
  if(F("manorSite")==="island" && k==="brack") plus("coin",2);
  if(F("tolls")==="free" && s.kind==="trade") y.coin=Math.max(0,y.coin-1);
  if(F("tolls")==="treasury" && k==="brack") plus("coin",3);
  if(has("karskWorks") && k==="karsk") plus("iron",4);
  if(has("granaries") && s.kind==="farm") plus("grain",2);
  if(has("riverHarbor") && k==="saltford") plus("coin",4);
  if(has("realmBank") && k==="brack") plus("coin",4);
  if(k==="brack"){ if(has("royalMint")) plus("coin",4); if(has("bridgePalace")) plus("coin",3); if(has("conservatory")) plus("grain",4); }
  if(S.spec && S.spec[k]) for(const r in SPEC[S.spec[k]].y) plus(r, SPEC[S.spec[k]].y[r]);
  if(has("lm:"+k)) for(const r in LANDMARK[k].y) plus(r, LANDMARK[k].y[r]);
  const pv=S.paved.filter(e=>e.split("~").includes(k)).length; if(pv) plus("coin",pv);
  if(F("winter") && s.kind==="farm") y.grain=Math.round(y.grain*.4);
  const m = (connected().has(k) ? 1 : 0.5) * unityMul(s.bank) * modeMul() * greyMul(k);
  for(const r in y) y[r]=Math.round(y[r]*m);

}

/* ---------- each town's own stores ----------
   Hamlets and villages send everything to the national stores. Towns and cities keep half of what they make, plus their own market dues,
   or all of it if no road joins them to Brackenfold, and grow themselves when their own stores can pay. */
const RVAL = {timber:1, stone:1, coin:1, grain:.5, iron:1.5};
const KEEPS = k => k!=="brack" && S.lv[k]>=3;
function localOf(k){ if(!S.local) S.local={}; if(!S.local[k]) S.local[k]={timber:0, stone:0, coin:0, grain:0, iron:0}; return S.local[k]; }
const valueOf = o => Object.entries(o).reduce((t,[r,v])=>t+v*(RVAL[r]||1),0);
/* pay a cost from a town's stores: matching goods first, then the town sells what else it has to cover the rest */
function payLocal(k, cost, limit){
  const L=localOf(k); let need=Math.min(limit===undefined?Infinity:limit, valueOf(cost)), paid=0;
  for(const r in cost){ const take=Math.min(L[r], cost[r], Math.floor(need/(RVAL[r]||1))); L[r]-=take; paid+=take*(RVAL[r]||1); need-=take*(RVAL[r]||1); }
  for(const r of ["coin","grain","timber","stone","iron"]){ if(need<=0) break; const take=Math.min(L[r], Math.ceil(need/RVAL[r])); L[r]-=take; paid+=take*RVAL[r]; need-=take*RVAL[r]; }
  return paid;
}
// the builders help a town that has saved at least half the cost itself; the realm covers the rest
const canShare = (k,cost) => { const lv=valueOf(localOf(k)), cv=valueOf(cost); if(lv < cv/2 || lv >= cv) return false; /* a town that can pay in full builds for itself */ const f=Math.max(0,1-lv/cv); return Object.entries(cost).every(([r,v])=>S.stats[r]>=Math.ceil(v*f)); };
function payShared(k, cost){
  const total=valueOf(cost), paid=payLocal(k,cost,total), f=Math.max(0,1-paid/total), nat={};
  for(const r in cost){ nat[r]=Math.ceil(cost[r]*f); S.stats[r]-=nat[r]; }
  const natTxt=Object.entries(nat).filter(([r,v])=>v>0).map(([r,v])=>`${v} ${LABEL[r]}`).join(", ");
  return `${SITES[k].name} paid ${Math.round(paid/total*100)}% from its own stores${natTxt?` · the realm paid ${natTxt}`:""}`;
}
/* split a settlement's output between its own stores and the realm's */
function produce(scale){
  const tot={}, conn=connected();
  alive().forEach(k=>{ const y=yieldOf(k);
    for(const r in y){ const v=Math.round(y[r]*scale); if(!v) continue;
      const keep = !conn.has(k) ? v : KEEPS(k) ? Math.round(v/2) : 0;
      if(keep){ localOf(k)[r]=(localOf(k)[r]||0)+keep; }
      tot[r]=(tot[r]||0)+v-keep; }
    if(KEEPS(k)) localOf(k).coin += Math.round(LVL_POP[S.lv[k]]/25*modeMul()*scale);   // the town's own market dues
    // a hamlet or village that was cut off sends its stockpile to the realm once a road reaches it
    else if(conn.has(k) && S.local && S.local[k]){ for(const r in S.local[k]){ if(S.local[k][r]>0){ tot[r]=(tot[r]||0)+S.local[k][r]; S.local[k][r]=0; } } }
  });
  for(const r in tot) S.stats[r]+=tot[r];
  return tot;
}
/* ---------- the towns petition you: a town that has saved enough asks to build; one that has saved half asks for help ---------- */
function townNext(k){ for(const id of ["grow:"+k, "lm:"+k]){ const w=W[id]; if(relevant(id) && (!w.req||w.req())) return id; } return null; }
function petitions(){
  return alive().filter(KEEPS).map(k=>{ const id=townNext(k); if(!id) return null; const cost=costOf(id,true), lv=valueOf(localOf(k)), cv=valueOf(cost);
      if(lv>=cv) return {k, id, self:true, save:lv/cv}; if(canShare(k,cost)) return {k, id, self:false, save:lv/cv}; return null; })
    .filter(Boolean).sort((a,b)=>b.save-a.save).slice(0,3);
}
function petitionDo(p){
  const cost=costOf(p.id,true), w=W[p.id]; let fx;
  if(p.self){ payLocal(p.k,cost); fx="Paid from its own stores"; } else fx=payShared(p.k,cost);
  if(w.kind==="grow") S.lv[p.k]=Math.min(5,S.lv[p.k]+1); else { S.built.push(p.id); if(w.fx) add(w.fx); }
  const what = w.kind==="grow" ? `${SITES[p.k].name} grew into a ${LVL_NAME[S.lv[p.k]].toLowerCase()}` : `${SITES[p.k].name} built ${LANDMARK[p.k].n}`;
  const when=S.phase==="season"?`Week ${S.week}`:`Day ${S.day}`;
  if(S.townLast && S.townLast.when===when && S.townLast.ch===S.chapter && S.townLast.phase===S.phase) S.townLast.ent.push({kind:"town", what, fx});
  else S.townLast={when, ent:[{kind:"town", what, fx}], ch:S.chapter, phase:S.phase};
  S.lastBuilt=p.id;
}

function buildChoices(){
  const list = WORK_ORDER().filter(relevant).map(id=>{
    const w=W[id], reqOK=!w.req||w.req(), pay=canPay(costOf(id));
    const lock = !reqOK ? ` · Locked: ${w.reqText||""}` : !pay ? " · Not enough materials" : "";
    return {label:prefix(w)+workLabel(id), hint:`${val(w.gain)} · Cost: ${costText(costOf(id))}${lock}`, req:()=>reqOK&&pay, work:id, cls:w.kind==="manor"||w.kind==="capital"?"build manor":w.kind==="special"?"build special":"build"};
  });
  const conn=connected();
  const urgent = c => ["seal","path","manor","capital","special"].includes(W[c.work].kind) || W[c.work].kind==="great" && W[c.work].ch===S.chapter || (W[c.work].kind==="road" && conn.has(W[c.work].a)!==conn.has(W[c.work].b));
  const readyAll=list.filter(c=>c.req()), locked=list.filter(c=>!c.req());
  const seen={}, ready=[], more=[];
  readyAll.forEach(c=>{ const k=W[c.work].kind; if(urgent(c)) ready.push(c); else if((seen[k]=(seen[k]||0)+1)<=2) ready.push(c); else more.push(c); });
  // the guild's proposals and the towns' petitions come first: they don't use your own works
  const offers=guildOffers().map(id=>{ const w=W[id], pay=canPay(costOf(id,true));
    return {label:`Realm Builders propose: ${prefix(w)}${workLabel(id)}`, hint:`${val(w.gain)} · Cost: ${costText(costOf(id,true))} · the guild builds it, not one of your works · ${S.guildPicks||0} crew${S.guildPicks===1?"":"s"} free ${S.phase==="season"?"this week":"today"}`, req:()=>pay&&(S.guildPicks||0)>0, guild:id, cls:"build guildpick"}; });
  const pets=petitions().map(p=>{ const w=W[p.id], cost=costOf(p.id,true), what = w.kind==="grow" ? `grow into a ${LVL_NAME[Math.min(5,S.lv[p.k]+1)].toLowerCase()}` : `build ${LANDMARK[p.k].n}`;
    const f=Math.max(0,1-valueOf(localOf(p.k))/valueOf(cost)), nat=Object.entries(cost).map(([r,v])=>[r,Math.ceil(v*f)]).filter(([r,v])=>v>0).map(([r,v])=>`${v} ${LABEL[r]}`).join(", ");
    return p.self ? {label:`${SITES[p.k].name} asks to ${what}`, hint:`Paid entirely from its own stores · approve it, or leave it for another day`, petition:p, cls:"build petition"}
      : {label:`${SITES[p.k].name} asks for help to ${what}`, hint:`It pays ${Math.round((1-f)*100)}% from its own stores · the realm pays ${nat}`, petition:p, cls:"build petition"}; });
  const out=[...pets, ...offers, ...ready];
  if(more.length) out.push({label:S.showMore?`Hide ${more.length} more works`:`Show ${more.length} more works you can start`, hint:"More roads, settlements and great works", toggleMore:true, cls:"trade"});
  if(S.showMore) out.push(...more);
  if(!readyAll.length) out.push({label:"Nothing you can afford right now", hint:"Trade below, or rest and let the realm's stores fill", req:()=>false, cls:"build"});
  if(locked.length) out.push({label:S.showLocked?`Hide the ${locked.length} works you can't start yet`:`Show ${locked.length} works you can't start yet`, hint:"Locked by materials or by requirements", toggleLocked:true, cls:"trade"});
  if(S.showLocked) out.push(...locked);
  out.push(
    {label:"Keystone Surge", hint:"Your next work costs nothing · once each part of a chapter", req:()=>F("surgeKey")!==`${S.chapter}-${S.phase}`&&!F("surgeNext"), surge:true, cls:"build manor"},
    ...(S.reserve&&reserveLeft()>0&&trainWorthIt()?[{label:"Send for a wagon train from Brackenfold's old stores", hint:`${reserveText(reserveCart("train"))} · a share of what's left · once ${S.phase==="season"?"a week":"a day"} instead of a cartload`, req:()=>F("reserveKey")!==turnKey(), reserve:"train", cls:"build manor"}]:[]),
    ...(S.reserve&&reserveLeft()>0?[{label:"Draw a cartload from Brackenfold's old stores", hint:`${reserveText(reserveCart())} · once ${S.phase==="season"?"a week":"a day"} · left from Book One: ${reserveText(S.reserve)}`, req:()=>F("reserveKey")!==turnKey(), reserve:"cart", cls:"build manor"}]:[]),
    {label:"Buy iron from Saelmar traders", hint:"Coin −4 → Iron +3", req:()=>S.stats.coin>=4, trade:{coin:-4, iron:3}, cls:"trade"},
    {label:"Sell surplus grain downriver", hint:"Grain −8 → Coin +4", req:()=>S.stats.grain>=8, trade:{grain:-8, coin:4}, cls:"trade"},
    {label:"Buy timber and stone from the west", hint:"Coin −4 → Timber +4, Stone +4", req:()=>S.stats.coin>=4, trade:{coin:-4, timber:4, stone:4}, cls:"trade"},
    {label: S.phase==="season" ? "Let the realm work, and start no more this week." : "Rest today.", hint:"Save your materials for something bigger", skip:true});
  return out;
}

/* ---------- Brackenfold's old stores: everything Book One's town stockpiled, drawn a cartload at a time ---------- */
const turnKey = () => `${S.chapter}-${S.phase}-${S.day}-${S.week}`;
const reserveLeft = () => S.reserve ? Object.values(S.reserve).reduce((a,b)=>a+b,0) : 0;
function reserveCart(size){ const big = S.mode==="builder" ? 8 : 12; const c={timber:big, stone:big, coin:Math.round(big*.7), grain:big};
  // a wagon train takes a share of whatever is left: big stores send big trains, and they shrink as the stores run down
  if(size==="train"){ const share = S.mode==="builder" ? .02 : .03; for(const k in c) c[k]=Math.max(c[k], Math.round((S.reserve[k]||0)*share)); }
  for(const k in c) c[k]=Math.min(c[k], S.reserve[k]||0); return c; }
const trainWorthIt = () => S.reserve && ["timber","stone","coin","grain"].some(k=>(S.reserve[k]||0)*(S.mode==="builder"?.02:.03) > 24);
const reserveText = r => ["timber","stone","coin","grain"].filter(k=>r[k]>0).map(k=>`${LABEL[k]} ${r[k]===undefined?0:r[k].toLocaleString()}`).join(" · ") || "empty";
function drawReserve(size){ const c=reserveCart(size); for(const k in c){ S.stats[k]+=c[k]; S.reserve[k]-=c[k]; } S.flags.reserveKey=turnKey(); }
function reserveFromBookOne(d){ const st=d.stats||{}; return {timber:Math.max(0,st.timber|0), stone:Math.max(0,st.stone|0), coin:Math.max(0,st.coin|0), grain:Math.max(0,st.food|0)}; }

/* ---------- one week of the realm ---------- */
function weekly(){
  const tot=produce(1);
  S.stats.unity=Math.min(100,S.stats.unity);
  const need=upkeep(); S.stats.grain-=need;
  const lines=[`To the national stores: Grain +${tot.grain||0} · Timber +${tot.timber||0} · Stone +${tot.stone||0} · Iron +${tot.iron||0} · Coin +${tot.coin||0}`, `The realm ate ${need} grain${F("winter")?" (winter: farms yield less, people eat more)":""}`];
  if(S.stats.grain<0){ S.stats.grain=0; if(S.mode!=="story"){ S.stats.unity=Math.max(0,S.stats.unity-3); lines.push("Short rations in the villages · Unity −3"); } else lines.push("A lean week. The villages shared what they had."); }
  const cut=alive().filter(k=>!connected().has(k)); if(cut.length) lines.push(`Cut off from the capital (half output, all kept locally): ${cut.map(k=>SITES[k].name).join(", ")}`);
  const asks=petitions().length; if(asks) lines.push(`${asks} town${asks>1?"s are":" is"} asking to build · see the top of the list`);
  b3Weekly(lines);
  S.weekReport=lines.join("<br>");
}
function daily(){
  const tot=produce(1/3);
  S.stats.grain=Math.max(0, S.stats.grain-Math.ceil(upkeep()/3));
  S.lastYield=tot; S.guildNote="";
  b3Daily();
}

/* ================================================================
   BOOK THREE SYSTEMS
   1. The world: six nations around the realm, each a province, ally,
      neutral, rival, or lost to the grey.
   2. The grey: rifts open at settlements, grow each week, spread along
      roads, and are closed by seal-stones (or by the heir, in person).
   3. The Host: Wardens, Listeners, engineers and ships, mustered like works.
   4. Empire or League: the path chosen in Chapter One opens its own works.
   ================================================================ */
const HP = () => ({he:"father", she:"mother", they:"parent"})[S.p||"they"];          // the hero, as the heir says it
const HPc = () => HP().charAt(0).toUpperCase()+HP().slice(1);
const C2 = k => PRON[F("child2P")||"they"][k];                                       // the second child's pronouns
const C2s = () => (F("child2P")||"they")==="they" ? CHILD2() : C2("sub");             // "they" as a subject reads as the name
const PATH = () => F("path")==="empire" ? "the Empire" : "the League";
const EMP = () => F("path")==="empire";
const HEIR = () => S.chapter%2===0 && ![11,13,14].includes(S.chapter);               // whose chapter is it

/* ---------- the nations of the world ---------- */
const NATIONS = {
  aurendell:{name:"Aurendell", ruler:"King Corvin", x:60, y:120, r:44, bank:"west"},
  clans:{name:"the Northern Clans", ruler:"the eleven chiefs", x:220, y:36, r:38, bank:"north"},
  saelmar:{name:"Saelmar", ruler:"the Admirals' Council", x:250, y:300, r:36, bank:"south"},
  orsenne:{name:"Orsenne", ruler:"the Sun Council", x:30, y:290, r:30, bank:"far west"},
  caradun:{name:"Caradun", ruler:"Empress Ysolt", x:410, y:260, r:42, bank:"east, across the sea"},
  ashlands:{name:"the Ashlands", ruler:"no one", x:400, y:50, r:36, bank:"far north east"}
};
const STANCE_WORD = {province:"Province", ally:"Ally", neutral:"Neutral", rival:"Rival", lost:"Lost to the grey"};
function nation(k){ if(!S.nations) S.nations={}; if(!S.nations[k]) S.nations[k]={stance:"neutral", grey:0}; return S.nations[k]; }
const natCount = st => Object.keys(NATIONS).filter(k=>nation(k).stance===st).length;
function setStance(k, st){ nation(k).stance=st; }

/* ---------- the grey: rifts at settlements ---------- */
const riftAt = k => (S.rifts&&S.rifts[k])||0;
const greyMul = k => [1,.6,.3,0][Math.min(3,riftAt(k))];
function openRift(k, size){ if(!S.rifts) S.rifts={}; if(!SITES[k]) return; S.rifts[k]=Math.min(3,Math.max(riftAt(k), size||1)); S.flags.riftsOpened=(S.flags.riftsOpened||0)+1; }
function sealRift(k){ if(S.rifts) delete S.rifts[k]; S.flags.riftsSealed=(S.flags.riftsSealed||0)+1; }
const riftList = () => Object.keys(S.rifts||{}).filter(k=>riftAt(k)>0);
Object.keys(SITES).forEach(k=>{
  W["seal:"+k]={kind:"seal", site:k, name:()=>`Raise a seal-stone over the rift at ${SITES[k].name}`,
    gain:()=>`Closes a size ${riftAt(k)} rift · ${SITES[k].name} produces again`,
    cost:()=>{ const z=riftAt(k)||1, m=F("cheapSeals")?.7:1; return {stone:Math.round((8+6*z)*m), iron:Math.round((2+2*z)*m), coin:Math.round((4+2*z)*m)}; }, req:()=>riftAt(k)>0, done:()=>riftAt(k)===0,
    after:()=>`<p>A ring of Elder stones around the grey, each one carved with the mason's square, set so that they lean on one another. When the last one goes in, the grey stops spreading, then slowly, over a day, goes back to ordinary earth. ${SITES[k].name} remembers its own name again.</p>`};
});

/* ---------- the Host ---------- */
const UNIT = {
  wardens:{n:"Wardens", one:"a company of Wardens", amt:3, cost:{grain:10, coin:8, iron:4}, req:()=>true,
    t:"Trained on the drill yards of the Citadel and the garrison cities: they hold lines, dig fast, and never run."},
  listeners:{n:"Listeners", one:"a circle of Listeners", amt:2, cost:{coin:10, grain:6}, req:()=>specCount("university")>0||has("keystoneAcademy")||has("lm:aurelsrise"), reqText:"Needs a university city, the Keystone Academy, or Aurel's Rise",
    t:"They hear the grey coming a day before it arrives, and can tell a seal-stone which way to lean."},
  engineers:{n:"Builders' engineers", one:"a lodge of engineers", amt:2, cost:{timber:10, stone:6, coin:4}, req:()=>!!F("realmGuild"),
    t:"Realm Builders with picks and pontoons: bridges in an hour, walls by morning."},
  ships:{n:"Ships", one:"a squadron of ships", amt:2, cost:{timber:14, iron:6, coin:8}, req:()=>S.lv.saltford>=2||S.lv.freehaven>=2||has("realmFleet"), reqText:"Needs a harbor at Saltford or Freehaven",
    t:"River cutters and deep sea ships built on Saelmar lines with Karsk iron."}
};
const hostSize = () => Object.values(S.host||{}).reduce((a,b)=>a+b,0);
Object.entries(UNIT).forEach(([u,U])=>{
  W["muster:"+u]={kind:"muster", unit:u, amt:U.amt, name:`Muster ${U.one}`, gain:`${U.n} +${U.amt} · ${U.t}`,
    cost:()=>{ const n=(S.flags["mus_"+u]||0), c={}; for(const r in U.cost) c[r]=Math.round(U.cost[r]*(1+n*.15)); return c; },
    req:()=>U.req() && (S.flags[`musch_${u}_${S.chapter}`]||0)<2, reqText:U.reqText||"Twice a chapter at most", done:()=>false, then:()=>{ add({[`musch_${u}_${S.chapter}`]:1}); },
    after:()=>`<p>${U.t} The Host now counts ${S.host[u]} ${U.n.toLowerCase()}.</p>`};
});
/* how strong the realm is when a crisis comes: what you mustered, who stands with you, what you built */
function hostPower(){
  const h=S.host||{};
  return Math.round((h.wardens||0) + (h.listeners||0) + (h.engineers||0)*.5 + (h.ships||0)
    + natCount("province")*3 + natCount("ally")*2 + Math.floor(S.stats.defense/15) + Math.floor((S.heir.ways||0)/2));
}
const powerWord = () => { const p=hostPower(); return p>=110?"overwhelming":p>=80?"strong":p>=55?"ready":p>=30?"thin":"barely there"; };

/* ---------- Empire or League: each path opens its own works ---------- */
const NAT_KEYS = ["aurendell","clans","saelmar","orsenne"];
NAT_KEYS.forEach(k=>{ const N2=NATIONS[k];
  W["pledge:"+k]={kind:"path", path:"empire", nat:k, name:`Take the pledge of ${N2.name}`, gain:`${N2.name} becomes a province: tribute every week, its soldiers join the Host`,
    cost:()=>({coin:20, grain:10}), req:()=>["ally","neutral"].includes(nation(k).stance), reqText:"Must be an ally or neutral", done:()=>nation(k).stance==="province",
    then:()=>{ const was=nation(k).stance; setStance(k,"province"); S.host.wardens+=3; if(was==="neutral") add({resent:2, unity:-3}); else add({resent:1}); },
    after:()=>`<p>${N2.ruler.charAt(0).toUpperCase()+N2.ruler.slice(1)} ${N2.ruler.startsWith("the ")?"kneel":"kneels"} in the Accord Hall and ${N2.ruler.startsWith("the ")?"swear":"swears"} ${N2.name} to the Empire. ${nation(k).stance==="province"&&F("aff_marren")>=2?"Marren watches from the gallery and says nothing at all, which is worse than anything she could have said.":"The hall applauds. Not everyone in it means it."}</p>`};
  W["iroad:"+k]={kind:"path", path:"empire", nat:k, name:`Build an imperial road to ${N2.name}`, gain:"Doubles the province's tribute · Unity +2", cost:()=>({stone:24, timber:10, coin:10}),
    req:()=>nation(k).stance==="province", reqText:`${N2.name} must be a province`, fx:{unity:2},
    after:()=>`<p>An Elder road, paved and crowned, running from the edge of ${RN()} to the heart of ${N2.name}. Imperial couriers ride it in two days. So do imperial soldiers.</p>`};
  W["legion:"+k]={kind:"path", path:"empire", nat:k, name:`Raise a legion fort in ${N2.name}`, gain:"Wardens +4 · Defense +4", cost:()=>({stone:20, iron:8, coin:10}),
    req:()=>nation(k).stance==="province", reqText:`${N2.name} must be a province`, fx:{defense:4}, then:()=>{ S.host.wardens+=4; },
    after:()=>`<p>A square fort of grey concrete, the same in every province, with the Empire's mason's square over the gate.</p>`};
  W["embassy:"+k]={kind:"path", path:"league", nat:k, name:`Open an embassy in ${N2.name}`, gain:`${N2.name} joins the League of the Arch as an ally`,
    cost:()=>({coin:16, stone:8}), req:()=>nation(k).stance==="neutral", reqText:"Must be neutral", done:()=>nation(k).stance==="ally"||nation(k).stance==="province",
    then:()=>{ setStance(k,"ally"); add({unity:2}); },
    after:()=>`<p>A small house with an arch over the door and both flags over the arch. ${N2.ruler.charAt(0).toUpperCase()+N2.ruler.slice(1)} ${N2.ruler.startsWith("the ")?"sign":"signs"} the League's charter, which is one page long and says only that no one in it rules anyone else.</p>`};
  W["lfort:"+k]={kind:"path", path:"league", nat:k, name:`Build a League fortress with ${N2.name}`, gain:"Wardens +3 · Defense +3 · built together, held together", cost:()=>({stone:18, iron:6, timber:6}),
    req:()=>nation(k).stance==="ally", reqText:`${N2.name} must be an ally`, fx:{defense:3}, then:()=>{ S.host.wardens+=3; },
    after:()=>`<p>A fortress on the border between you, built by both, with two gates: one facing each country, and no lock on either.</p>`};
});
Object.assign(W, {
  imperialCapital:{kind:"path", path:"empire", name:"Raise the Imperial Palace over Brackenfold", gain:"Renown +10 · Resentment +1 · an empire needs a seat", cost:()=>({stone:30, timber:14, coin:20, iron:6}), fx:{renown:10, resent:1},
    after:()=>`<p>A palace that takes up the whole north side of the square, with a dome that can be seen from both banks. It is very beautiful. ${CHILD()} walks through it once and does not come back.</p>`},
  leagueHall:{kind:"path", path:"league", name:"Build the Hall of the Arch, where the League meets", gain:"Unity +8 · Renown +4", cost:()=>({stone:24, timber:10, coin:12}), fx:{unity:8, renown:4},
    after:()=>`<p>A round hall on the island under the Bridge of Two Banks, with a seat for every nation and none of them higher than the others. You sit in yours on the first day and find it is exactly as hard as everyone else's.</p>`},
  ringOfSeals:{kind:"great", ch:13, name:"Raise the Ring of Seals around the heart of the realm", gain:"Every rift in the realm closes · Defense +6", cost:()=>({stone:40, iron:12, coin:16}), fx:{defense:6},
    then:()=>{ riftList().forEach(sealRift); },
    after:()=>`<p>A ring of seal-stones twenty miles around Brackenfold, each one leaning on the next, the whole circle leaning on the heart under the bridge. When it is finished, every Listener in the realm hears the grey go quiet at once.</p>`},
  choirStair:{kind:"great", ch:13, name:"Build the Choir's Stair down to the heart", gain:"Song +2 · the Choir can sing at the heart together", cost:()=>({stone:30, timber:12, coin:10}), then:()=>{ S.stats.song+=2; S.flags.choirStair=true; },
    after:()=>`<p>A spiral stair cut down through the island to the chamber under the bridge, wide enough for a hundred singers, its walls of the old Elder stone that carries a voice forever.</p>`},
  refuges:{kind:"great", ch:9, name:"Build refuges for the grey's refugees in every great city", gain:"Unity +6 · Morale +3 · thousands sheltered", cost:()=>({timber:24, stone:16, grain:30}), fx:{unity:6, morale:3},
    after:()=>`<p>Long halls of timber and Elder concrete in every great city, with hearths, kitchens and a school in each. By midwinter they hold forty thousand people from three kingdoms, and the realm somehow feeds them all.</p>`}
});

/* ---------- every week and every day, in Book Three ---------- */
function b3Weekly(lines){
  // the grey grows: each rift deepens every other week, and a deep one spreads along a road
  const rl=riftList();
  if(rl.length){
    S.flags.greyTick=(S.flags.greyTick||0)+1;
    rl.forEach(k=>{ if(S.flags.greyTick%2===0 && S.rifts[k]<3) S.rifts[k]++;
      if(S.rifts[k]>=3 && Math.random()<(S.mode==="builder"?.35:.2)){ const nb=EDGES.filter(e=>e.includes(k)).map(e=>e[0]===k?e[1]:e[0]).filter(x=>S.lv[x]>0&&!riftAt(x));
        if(nb.length){ const t=nb[Math.floor(Math.random()*nb.length)]; openRift(t,1); lines.push(`The grey spread from ${SITES[k].name} to ${SITES[t].name}`); } } });
    lines.push(`Rifts open: ${riftList().map(k=>`${SITES[k].name} (size ${riftAt(k)})`).join(", ")} · raise seal-stones to close them`);
  }
  // and new rifts open on their own, more often as the book goes on
  if(!HEIR() && Math.random() < .12 + S.chapter*.03){ const opts=alive().filter(k=>!riftAt(k)&&k!=="brack"); if(opts.length){ const k=opts[Math.floor(Math.random()*opts.length)]; openRift(k,1); lines.push(`A new rift opened at ${SITES[k].name}`); } }
  // provinces pay tribute; a road to them doubles it
  const prov=Object.keys(NATIONS).filter(k=>nation(k).stance==="province");
  if(prov.length){ const t={coin:0, grain:0, iron:0}; prov.forEach(k=>{ const m=has("iroad:"+k)?2:1; t.coin+=6*m; t.grain+=6*m; t.iron+=2*m; });
    for(const r in t) S.stats[r]+=t[r]; lines.push(`Tribute from the provinces: Coin +${t.coin} · Grain +${t.grain} · Iron +${t.iron}`); }
  // the Host eats
  const eat=Math.ceil(hostSize()/2); if(eat){ S.stats.grain=Math.max(0,S.stats.grain-eat); lines.push(`The Host ate ${eat} grain`); }
}
function b3Daily(){
  // while the heir is away, the council runs the realm: it takes the guild's first proposal and approves towns that pay their own way
  if(HEIR() || F("away")){
    const o=guildOffers().filter(id=>canPay(costOf(id,true)));
    if(o.length && (S.guildPicks||0)>0) guildDo(o[0]);
    petitions().filter(p=>p.self).slice(0,1).forEach(petitionDo);
  }
}
function hostLine(){ const h=S.host; return `Wardens ${h.wardens||0} · Listeners ${h.listeners||0} · Engineers ${h.engineers||0} · Ships ${h.ships||0} · Power ${hostPower()} (${powerWord()})`; }

/* ================================================================
   BOOK THREE: SHARED SCENES AND HELPERS
   The hero's chapters use the build screen (plan) like Book Two.
   The heir's chapters use the camp: two actions a day while traveling.
   ================================================================ */
const SCENES = {};
function chapterEnter(n){ S.chapter=n; S.phase="open"; S.day=0; S.week=0; S.snapMap=realmSVG(true);
  S.showMore=false; S.showLocked=false; S.flags.surgeNext=false; S.flags.away=false; S.weekReport=null; S.lastYield=null; S.guildNote=""; S.exp=null; }
function daysEnter(){ S.phase="days"; S.day=1; S.buildsLeft=perDay(); S.lastYield=null; S.guildNote=""; }
function seasonEnter(){ S.phase="season"; S.week=1; S.buildsLeft=perWeek(); S.weekReport=null; S.flags.away=false; }
function crisisEnter(){ S.phase="crisis"; }
function expEnter(place, nat){ S.phase="expedition"; S.day=1; S.flags.away=true; S.exp={place, nat, actsLeft:2}; S.lastYield=null; }
const outcome = key => { const v=F("n_"+key)||0; return v>=5 ? "great" : v>=3 ? "good" : "hard"; };
const beforeAfter = cap => `<div class="beforeafter"><figure>${S.snapMap||""}<figcaption>Start of the chapter</figcaption></figure><figure>${realmSVG(true)}<figcaption>${cap||"Now"}</figcaption></figure></div>`;
function chapterSummary(n, story, nextLabel, nextGo){
  return { title:()=>`Book Three, Chapter ${CH_WORD[n]} Complete: ${BOOK_THREE[n-1].t}`, enter(){ S.phase="done"; S.flags.away=false; }, text:()=>`
${val(story)}
${beforeAfter(RN())}
${sys(`CHAPTER ${CH_WORD[n].toUpperCase()}`,`[${realmTier().name}]<br>${popN().toLocaleString()} people · ${alive().length} settlements · Unity ${S.stats.unity}<br>The Host: ${hostLine()}<br>${riftList().length?`Rifts open: ${riftList().length}`:"No rifts open in the realm"} · Trust between you and ${CHILD()}: ${S.stats.trust}${nextLabel?`<br>Next: ${nextLabel}`:""}`)}`,
  choices: nextGo ? [{label:`Begin ${nextLabel}`, go:nextGo}] : [{label:"Start Book Three again", restart:true}] };
}
const kidLine = () => S.family.child2 ? `${CHILD()} and ${CHILD2()}` : CHILD();

/* ---------- the heir's songs ---------- */
const SONG = {
  stillness:{n:"the Song of Stillness", t:"tells stone to stop"}, hearing:{n:"the Song of Hearing", t:"lets you hear what stone remembers"},
  asking:{n:"the Song of Asking", t:"asks stone what it wants"}, waking:{n:"the Song of Waking", t:"wakes what sleeps"},
  sleeping:{n:"the Song of Sleeping", t:"puts a Wonder to rest"}, holding:{n:"the Song of Holding", t:"holds the grey back for as long as you can sing"},
  mending:{n:"the Song of Mending", t:"knits broken stone"}, finishing:{n:"the Song of Finishing", t:"the Elders' last song, never sung"}
};
const knowsSong = s => (S.heir.songs||[]).includes(s);
function learnSong(s){ if(!knowsSong(s)){ S.heir.songs.push(s); S.flags.newSong=s; } }
const songSys = () => { const s=F("newSong"); if(!s) return ""; S.flags.newSong=null; return sys("NEW SONG",`[${SONG[s].n.replace(/^the /,"The ")}]<br>It ${SONG[s].t}`); };
const songsText = () => (S.heir.songs||[]).map(s=>SONG[s].n.replace(/^the /,"")).join(", ")||"none yet";

/* ---------- the heir's companions ---------- */
const COMP = {
  elowen:{n:"Elowen", line:"Princess Elowen of Aurendell, who grows things the grey cannot unmake"},
  jory:{n:"Jory", line:"Fen and Lise's son, seventeen, family in everything but blood, who carries the maps"},
  kade:{n:"Captain Kade", line:"Absalom Kade, older and greyer and still laughing, whose ship carries you"},
  torin:{n:"Torin", line:"your cousin Torin Valcrest, twenty one, a Pyromancer who commands the Ember Guard"},
  ilsa:{n:"Ilsa", line:"your cousin Ilsa Valcrest, fifteen, who calls the wind and steals hats with it"},
  sib:{n:"", line:""},
  wren:{n:"Wren", line:"Wren, who has been waiting four hundred years to tell someone the truth"}
};
const compName = k => k==="sib" ? CHILD2() : COMP[k].n;
function compsNow(){ const c=CH[S.chapter].comps||["elowen"]; return c.filter(k=>k!=="kade"||F("c5how")==="kade"||F("kadeB3")); }

/* ---------- the camp: two things a day, then the day's road ---------- */
const PRACTICE = [
  ()=>`<p>You find a flat rock above the camp and sing the Song of Stillness to it until the birds in the trees around you stop moving too. Then you let them go, one by one, by name. You couldn't do that at sixteen. You can now.</p>`,
  ()=>`<p>You practice the hard part of the Song of Asking, the falling note at the end that turns a question into a promise, forty times, until it comes out right forty times in a row. ${compsNow().includes("torin")?"Torin sits on a log and keeps count, and loses count, and starts again.":"Nobody watches. That's the point."}</p>`,
  ()=>`<p>You sing to the stones of ${S.exp.place} and listen to what they remember: rain, mostly, and footsteps, and very far down, older than anything, a kind of hum that isn't theirs. You write it down. You think it might be important.</p>`,
  ()=>`<p>You try singing two songs at once, the way the Elders' journals say a master can: Stillness in the low voice, Hearing in the high one. It comes out as noise. Then, for three breaths, it doesn't. You sit down very suddenly.</p>`,
  ()=>`<p>You sing until your voice goes, then hum until your hum goes, then sit with your hand on the ground and listen. The stones are faster to answer every morning. ${S.stats.song>=20?"These days they sometimes answer before you've finished asking.":"You are getting stronger, and you can feel it."}</p>`
];
const BASE_ACTS = {
  scout:{label:()=>`Scout the road ahead with ${compName(compsNow()[0])}`, hint:"Learn what's coming · the crisis goes better", max:2, fx:()=>({["n_c"+S.chapter]:1, n_scout:1}),
    text:()=>`<p>You go out before dawn and come back after dark, with mud to the knees and a map full of new marks: where the grey is thickest, where the way is safe, and what is waiting ahead in ${S.exp.place}.</p>`},
  practice:{label:"Practice at dawn, until the stones answer", hint:"Song +1", max:2, fx:()=>({song:1}),
    text:()=>PRACTICE[((F("practiced")||0)+S.chapter)%PRACTICE.length]()},
  help:{req:()=>![8,12].includes(S.chapter), label:"Help the people here, and build them a waystation", hint:"A well, a shelter and a singing stone · each waystation supplies the Host at home", max:2,
    then:()=>{ S.heir.ways=(S.heir.ways||0)+1; S.heir.waysAt.push(S.exp.place); if(!S.heir.waysNat) S.heir.waysNat=[]; S.heir.waysNat.push(S.exp.nat); add({unity:1}); if(S.exp.nat&&nation(S.exp.nat).grey>0&&(S.heir.ways%2===0)) nation(S.exp.nat).grey--; },
    text:()=>`<p>You spend the day doing what your ${HP()} would have done: a well dug and lined with stone, a shelter with a hearth, and at the center a singing stone that hums softly and keeps the grey a little further off. ${compsNow().includes("torin")?"Torin fires the bricks for the hearth with his bare hands and pretends it doesn't hurt. ":""}${compsNow().includes("jory")?"Jory hangs the door so it closes on its own. ":""}The people of ${S.exp.place} carve your name on it, badly. That is waystation number ${S.heir.ways}.</p>`},
  talk:{label:()=>`Sit by the fire with ${compName(talkWho())}`, hint:()=>`${compName(talkWho())} ${"◆".repeat(Math.min(6,(F("aff_"+talkWho())||0)+1))}`, max:3,
    fx:()=>({["aff_"+talkWho()]:1}), then:()=>{ S.flags.lastTalk=talkWho(); }, text:()=>campTalk(S.flags.lastTalk)},
  letter:{label:()=>`Write home`, hint:"Trust +3 · and a letter comes back", max:1, fx:()=>({trust:3}),
    text:()=>letterHome()},
  rest:{label:"Rest", hint:"Morale +1 · nothing happens, which is nice", max:9, fx:()=>({morale:1}), text:()=>`<p>You sleep in the afternoon sun for the first time in weeks. Nobody wakes you. When you open your eyes, somebody has put a blanket over you${compsNow().includes("ilsa")?", and somebody else has used the wind to steal your boots and hang them in a tree":""}.</p>`}
};
/* talk to whoever you've talked to least */
const talkWho = () => compsNow().slice().sort((a,b)=>(F("aff_"+a)||0)-(F("aff_"+b)||0))[0];
function letterHome(){
  const n=S.chapter, t=S.stats.trust;
  const fromHome = t>=70 ? `From your ${HP()}: ${say(`"Me too. Keep going. I'm proud of you. Eat something."`)}` : t>=40 ? `From your ${HP()}: ${say(`"Come home safe. That is all I ask, and I know it's a lot."`)}` : `From your ${HP()}, three lines, crossed out twice and written again: ${say(`"I'm sorry. I'm still angry. I love you."`)}`;
  const sib = S.chapter===6 ? "" : `<p>And a second letter, folded into the first, in ${CHILD2()}'s terrible handwriting: ${say(["\"Fixed the kitchen pump. Broke it again. Fixed it again. Come home and be impressed.\"","\"Ilsa and I built a bird that flies. It flew into the river. Tell Torin it was his fault.\"","\"Everybody's pretending they're not worried about you. I'm not pretending. Come back.\"","\"I sleep in your room when you're away. Don't be weird about it.\"","\"I'm building you something for when you get back. You'll hate it. You'll love it.\""][n%5])} It's signed ${SIBNICK()}, which ${CHILD2()} pretends to hate.</p>`;
  return `<p>You write by firelight: where you are, what you've seen, that you are eating properly, which is a lie. You don't write that you're frightened. You find you don't need to.</p><p>The reply catches up with you on the road a week later. ${fromHome}</p>${sib}`;
}
function campTalk(k){
  const a=Math.max(0,(F("aff_"+k)||1)-1);
  const L = {
    elowen:[`<p>Elowen shows you the seeds she carries everywhere, in a leather pouch on a cord: oak, apple, barley, a white rose. ${say(`"In case,"`)} she says, and doesn't say in case of what.</p>`,
      `<p>Elowen asks what it was like growing up with a ${HP()} who could hold up bridges. You ask what it was like growing up with a king. You both laugh, and then neither of you can stop, and Jory pretends to be asleep.</p>`,
      `<p>Elowen tells you what her gift really is: what she grows can't be unmade. Not by fire, not by axes, not by the grey. ${say(`"My father thinks it's for gardens,"`)} she says. ${say(`"I don't think it's for gardens."`)}</p>`,
      `<p>Elowen falls asleep against your shoulder by the fire. A green shoot comes up through the ash where her hand rests, and keeps growing all night.</p>`,
      `<p>You read her one of the letters you wrote at fourteen and never sent. She laughs so hard she cries, and then she asks to keep it.</p>`,
      `<p>${say(`"When this is over,"`)} Elowen says, very quietly, ${say(`"I want to plant something with you. Somewhere it gets to grow old."`)} Her hand finds yours in the dark.</p>`],
    jory:[`<p>Jory takes apart your lantern to see how it works and puts it back together better. ${say(`"${AUNC()} did that to everything in Brackenfold,"`)} he says. ${say(`"Including my dad."`)}</p>`,
      `<p>Jory tells you his father still keeps the very first thing he ever mended, a cracked cup, on the shelf above his bed.</p>`,
      `<p>Jory admits he's afraid of the grey, and you admit you are too, and that helps more than either of you expected.</p>`,
      `<p>Jory says that when he was eight he thought he was actually your brother and nobody had told him. ${say(`"I was a bit upset when I found out,"`)} he says. You tell him he is. He goes quiet for a long time, and then very busy with the maps.</p>`,
      `<p>Jory has started calling you boss. You tell him to stop. He doesn't.</p>`,
      `<p>Jory shows you the map he's been drawing of the whole journey, every camp, every waystation, with little drawings of everyone. You're drawn taller than you are. He refuses to fix it.</p>`],
    torin:[`<p>Torin lights the fire by looking at it, which he does every night, and every night he looks pleased with himself. ${say(`"You'd think it'd get old,"`)} he says. ${say(`"It does not get old."`)}</p>`,
      `<p>Torin tells you about the day he set your ${HP()}'s curtains on fire at the age of two. He's heard the story so often he thinks he remembers it. ${say(`"Your ${HP()} just laughed,"`)} he says. ${say(`"Mum says that's when she knew we'd be all right here."`)}</p>`,
      `<p>Torin spars with you at dusk: his fire against your Song of Stillness. You stop a fireball in midair, and it hangs there, burning, and you both stare at it. ${say(`"Cousin,"`)} he says, ${say(`"never do that to me in public."`)}</p>`,
      `<p>Torin admits, late, that he's scared of the grey for one reason only: fire doesn't touch it. ${say(`"First thing I've ever met I can't burn,"`)} he says. ${say(`"I don't like what that says about me."`)}</p>`,
      `<p>Torin asks you, very seriously, how you knew you wanted to marry Elowen. You say you haven't said that. He says nobody needed you to.</p>`,
      `<p>${say(`"Whatever happens down there,"`)} Torin says, poking the fire, ${say(`"you go first, and I'll be right behind you. That's how it's always been. That's how it's going to be."`)}</p>`],
    ilsa:[`<p>Ilsa steals your hat with the wind, then Jory's, then Elowen's, and lines them up on a branch and charges a fee to get them back. The fee is a story.</p>`,
      `<p>Ilsa wants to know if you can sing the wind. You try. The wind ignores you completely. She is delighted.</p>`,
      `<p>Ilsa tells you that ${CHILD2()} cried for a whole day when you left home, and then made her swear never to tell you. She tells you anyway. ${say(`"I'm a terrible secret keeper,"`)} she says. ${say(`"It's my best quality."`)}</p>`,
      `<p>Ilsa calls a wind to blow the grey back off the road, and for a moment it works: the grey ripples like a field of barley. ${say(`"It doesn't like being moved,"`)} she says. ${say(`"Good."`)}</p>`,
      `<p>Ilsa asks whether she can be a Cantor too, if she practices. You teach her the first line of the Song of Stillness. She can't sing a note. The wind goes completely still anyway.</p>`,
      `<p>Ilsa falls asleep mid sentence with her head on Jory's pack, and the wind, which has been blowing all night, stops so that she can.</p>`],
    kade:[`<p>Captain Kade tells you a story about your ${HP()} that is almost certainly not true and is definitely not suitable for a royal child.</p>`,
      `<p>Kade shows you how to read the sea's color for weather. ${say(`"The grey's got into the water out here,"`)} he says, not laughing for once.</p>`,
      `<p>Kade tells you about the day your ${HP()} gave him a harbor and a pardon instead of a noose. ${say(`"Nobody ever bet on me before,"`)} he says.</p>`,
      `<p>Kade gives you his old compass. ${say(`"Always points home,"`)} he says. ${say(`"Broken that way."`)}</p>`],
    sib:[`<p>${CHILD2()} takes apart your tuning fork to see why it works, and puts it back together so that it hums a little louder. ${say(`"Don't thank me,"`)} ${C2s()} says. ${say(`"I'm just showing off."`)}</p>`,
      `<p>${CHILD2()} admits to having been jealous of you for years. ${say(`"You got the magic that sings,"`)} ${C2s()} says. ${say(`"I got the one that fixes hinges."`)} You say that's what your ${HP()} got too, and look how that turned out. ${CHILD2()} throws a sock at you.</p>`,
      `<p>You and ${CHILD2()} lie on your backs and name the stars wrong on purpose, the way you did on the manor roof when ${CHILD2()} was six and couldn't sleep. ${say(`"That one's called Fen's Beard,"`)} ${C2s()} says. ${say(`"Obviously."`)}</p>`,
      `<p>${CHILD2()} falls asleep with ${C2("pos")} head on your knee, the way ${C2s()} used to when small, and you don't move for two hours so as not to wake ${C2("obj")}.</p>`,
      `<p>${CHILD2()} tells you, very fast, staring at the fire, that the worst week of ${C2("pos")} life was the week you were missing, and that if you ever do that again ${C2s()} will build a machine to follow you. ${say(`"A big one,"`)} ${C2s()} says. ${say(`"With a bell on it."`)}</p>`,
      `<p>${CHILD2()} says you're the bravest person in the family, and then threatens to deny it forever. You say ${SIBNICK()} is the cleverest. ${say(`"Everybody knows that,"`)} ${C2s()} says. ${say(`"Say something new."`)}</p>`],
    wren:[`<p>Wren talks about the Elders as if they were old friends who moved away.</p>`,
      `<p>Wren tells you about the Elder who built the first Wonder: a woman who sang to stone and liked terrible jokes. ${say(`"You'd have liked her,"`)} Wren says. ${say(`"She'd have liked you more."`)}</p>`,
      `<p>Wren, very quietly, tells you about the one who stayed behind, when all the others went down.</p>`,
      `<p>Wren asks you to sing something, anything, and listens with closed eyes. ${say(`"Four hundred years,"`)} Wren says, ${say(`"since anyone sang to me."`)}</p>`]
  };
  const arr=L[k]||L.wren; return arr[Math.min(arr.length-1,a)];
}
/* things that happen around a camp: a small surprise after some of what you do */
const INCIDENT = [
  {t:()=>`<p>A peddler comes through at dusk with a cart of pots and a lot of opinions. He's heard of you. He has a version of the Velm dam story in which you held it shut for a week with one hand. You buy a pot so he'll stop.</p>`, fx:{morale:1}},
  {t:()=>`<p>A little girl from the nearest village follows you back to camp, stands at the edge of the firelight, and asks if you are the one who sings to stones. You sing her one note. She runs home shrieking with joy, and in the morning her whole village is waiting by the road to wave.</p>`, fx:{unity:1}},
  {t:()=>`<p>One of the Unmade wanders into camp at midnight, a grey old man, walking. You hum to him. He stops, and sits by the fire, and stays there until morning, and when he leaves he says one word, which might be his name.</p>`, fx:{song:1}},
  {t:()=>`<p>A storm comes over in the night${compsNow().includes("ilsa")?", and Ilsa goes out into it in her nightshirt, arms wide, and sends it around you. In the morning she is very smug and extremely wet":", and the tents hold, mostly"}.</p>`, fx:{morale:1}},
  {t:()=>`<p>You find an Elder milestone in a ditch, half buried, carved with the mason's square. ${compsNow().includes("jory")?"Jory insists on setting it upright again, and you all help.":"You set it upright again."} It hums when you touch it.</p>`, fx:{song:1}},
  {t:()=>`<p>A village by the road has a feast for its oldest woman's hundredth birthday and insists you come. ${compsNow().includes("torin")?"Torin lights the lanterns. ":""}You dance with the hundred year old woman, who leads.</p>`, fx:{morale:2}},
  {t:()=>`<p>A relay rider finds you on the road with news from home: ${riftList().length?`the council has its hands full with ${riftList().length} rift${riftList().length>1?"s":""}, and is managing`:"the realm is quiet, and the council has it in hand"}. And a parcel from ${CHILD2()}: dry socks and a note that says ${say(`"YOU FORGOT THESE. AGAIN."`)}</p>`, fx:{trust:2}},
  {t:()=>`<p>You wake before dawn to find ${compName(compsNow()[compsNow().length-1])} already up, keeping watch, so that you could sleep. Neither of you mentions it.</p>`, fx:{morale:1}}
];
function campActs(){
  const extra=CH[S.chapter].acts||{};
  const all=Object.assign({}, BASE_ACTS, extra);
  return Object.entries(all).filter(([id,A])=>(F(`act_${S.chapter}_${id}`)||0)<A.max && (!A.req||A.req())).map(([id,A])=>({label:val(A.label), hint:val(A.hint), camp:id, cls:A.cls||"build"}));
}
function doAct(id){
  const A=Object.assign({}, BASE_ACTS, CH[S.chapter].acts||{})[id];
  add({[`act_${S.chapter}_${id}`]:1}); if(id==="practice") add({practiced:1});
  if(A.fx) add(val(A.fx)); if(A.then) A.then();
  S.exp.last=id; S.exp.actsLeft--;
  // a surprise, sometimes: never the same one twice in a chapter
  S.exp.inc=null;
  if(id!=="rest" && ![8,12].includes(S.chapter) && Math.random()<.4){ const used=S.flags["inc_"+S.chapter]||[]; const left=INCIDENT.map((x,i)=>i).filter(i=>!used.includes(i));
    if(left.length){ const i=left[Math.floor(Math.random()*left.length)]; S.flags["inc_"+S.chapter]=used.concat(i); S.exp.inc=i; add(INCIDENT[i].fx); } }
}

Object.assign(SCENES, {
plan:{ title:()=>S.phase==="season"?`Week ${S.week}: ${CH[S.chapter].seasonName}`:`Day ${S.day}: ${CH[S.chapter].dayName}`, text:()=>planText(), choices:()=>buildChoices()},
built:{ title:()=>S.builtBy==="guild"?"The Realm Builders finished":S.builtBy==="town"?"A town built for itself":`${prefix(W[S.lastBuilt]).replace(": ","")} finished`, text:()=>builtText(), choices:()=>[
  ...(S.buildsLeft>0||(S.guildPicks||0)>0||petitions().length?[{label:`Back to the plans (${S.buildsLeft} work${S.buildsLeft===1?"":"s"} of yours left${(S.guildPicks||0)>0?`, ${S.guildPicks} guild crew${S.guildPicks===1?"":"s"} free`:""})`, go:"plan"}]:[]),
  {label: S.buildsLeft>0||(S.guildPicks||0)>0 ? (S.phase==="season" ? "That's enough for this week." : "That's enough for today.") : "Go on.", go:"event"}
]},
camp:{ title:()=>`Day ${S.day}: ${S.exp.place}`, text:()=>`
${songSys()}
${worldSVG()}
<div class="res"><span>Song <b>${S.stats.song}</b></span><span>Songs <b>${(S.heir.songs||[]).length}</b></span><span>Waystations <b>${S.heir.ways||0}</b></span><span>Trust <b>${S.stats.trust}</b></span></div>
<p class="chapter">Songs you know: ${songsText()}</p>
<p class="chapter">With you: ${compsNow().map(compName).join(", ")} · ${S.exp.actsLeft} thing${S.exp.actsLeft===1?"":"s"} you can still do today</p>
<p class="chapter">At home: ${riftList().length?`${riftList().length} rift${riftList().length>1?"s":""} open · `:""}the council has the realm in hand · Host strength ${hostPower()}</p>`,
  choices:()=>[...campActs(), {label: S.exp.actsLeft>0 ? "Press on without stopping." : "Go on.", hint:"The day's events", go:"event"}]},
actDone:{ title:()=>({scout:"Scouting",practice:"Practice",help:"A Waystation",talk:"By the Fire",letter:"A Letter Home",rest:"Rest"})[S.exp.last] || (CH[S.chapter].acts&&CH[S.chapter].acts[S.exp.last]&&val(CH[S.chapter].acts[S.exp.last].title)) || "Done",
  text:()=>{ const A=Object.assign({}, BASE_ACTS, CH[S.chapter].acts||{})[S.exp.last]; return val(A.text)+(S.exp.inc!=null&&INCIDENT[S.exp.inc]?`<p class="chapter">Later</p>`+INCIDENT[S.exp.inc].t():"")+songSys(); },
  choices:()=>[ S.exp.actsLeft>0 ? {label:"Back to camp.", go:"camp"} : {label:"Go on.", go:"event"} ]}
});

/* ---------- the build screen text ---------- */
function planText(){
  const conn=connected(), cut=alive().filter(k=>!conn.has(k));
  const intro = S.phase==="season"
    ? (S.weekReport?sys(`WEEK ${S.week-1} REPORT`,S.weekReport):"")
    : (S.lastYield&&S.day>1?sys(`DAY ${S.day-1}`,`Grain +${S.lastYield.grain||0} · Timber +${S.lastYield.timber||0} · Stone +${S.lastYield.stone||0} · Iron +${S.lastYield.iron||0} · Coin +${S.lastYield.coin||0}${S.guildNote?`<br>${S.guildNote}`:""}`):"");
  return `${intro}
  ${mapPanel()}
  <div class="res">${["grain","timber","stone","iron","coin"].map(k=>`<span>${LABEL[k]} <b>${S.stats[k]}</b></span>`).join("")}<span>Unity <b>${S.stats.unity}</b></span><span>People <b>${popN().toLocaleString()}</b></span></div>
  <p class="chapter">${realmTier().name} · ${nextTierText()}</p>
  <p class="chapter">The Host: ${hostLine()}</p>
  ${riftList().length?`<p class="chapter" style="color:var(--danger)">Rifts: ${riftList().map(k=>`${SITES[k].name} (${riftAt(k)})`).join(", ")}</p>`:""}
  ${cut.length?`<p class="chapter">Cut off (half output): ${cut.map(k=>SITES[k].name).join(", ")}</p>`:""}
  ${F("surgeNext")?sys("KEYSTONE SURGE","[Primed]<br>Your next work costs nothing"):""}
  <p class="chapter">${S.buildsLeft} work${S.buildsLeft===1?"":"s"} left ${S.phase==="season"?"this week":"today"}</p>`;
}
function builtText(){
  const w=W[S.lastBuilt];
  const msg = w.kind==="road" ? `<p>${w.bridge?`A bridge goes up over the river between ${SITES[w.a].name} and ${SITES[w.b].name}, Elder arches on concrete piers.`:`A road is laid from ${SITES[w.a].name} to ${SITES[w.b].name}, the Elder way: rubble, gravel, then fitted stone with a crown in the middle.`}</p>`
    : w.kind==="found" ? `<p>${SITES[w.site].name} is founded: a well, a meeting house, the first dozen homes.</p>`
    : w.kind==="grow" ? `<p>${SITES[w.site].name} grows into a ${LVL_NAME[S.lv[w.site]].toLowerCase()}.</p>`

}

function costOf(id, guild){
  const c={...val(W[id].cost)};
  if(F("surgeNext") && !guild) return {};
  if(hasInv("concrete") && c.stone) c.stone=Math.ceil(c.stone*.9);
  if(S.mode==="builder") for(const k in c) if(c[k]>0) c[k]+=1;

/* ---------- every week, in Book Three: the grey, tribute, inventions ---------- */
function b3Weekly(lines){
  const rl=riftList();
  if(rl.length){
    S.flags.greyTick=(S.flags.greyTick||0)+1;
    const every = hasInv("relay") ? 3 : 2;
    rl.forEach(k=>{ if(S.flags.greyTick%every===0 && S.rifts[k]<3) S.rifts[k]++;
      if(S.rifts[k]>=3 && Math.random()<(S.mode==="builder"?.35:.2)){ const nb=EDGES.filter(e=>e.includes(k)).map(e=>e[0]===k?e[1]:e[0]).filter(x=>S.lv[x]>0&&!riftAt(x));
        if(nb.length){ const t=nb[Math.floor(Math.random()*nb.length)]; openRift(t,1); lines.push(`The grey spread from ${SITES[k].name} to ${SITES[t].name}`); } } });
  }
  if(!HEIR() && Math.random() < .12 + S.chapter*.03){ const opts=alive().filter(k=>!riftAt(k)&&k!=="brack"); if(opts.length){ const k=opts[Math.floor(Math.random()*opts.length)]; openRift(k,1);
    lines.push(hasInv("balloons")||hasInv("relay") ? `The Listeners saw a new rift coming at ${SITES[k].name} and called it in before it spread` : `A new rift opened at ${SITES[k].name}`); } }
  if(riftList().length) lines.push(`Rifts open: ${riftList().map(k=>`${SITES[k].name} (size ${riftAt(k)})`).join(", ")}`);
  const prov=Object.keys(NATIONS).filter(k=>nation(k).stance==="province");
  if(prov.length){ const t={coin:0, grain:0, iron:0}; prov.forEach(k=>{ const m=has("iroad:"+k)?2:1; t.coin+=6*m; t.grain+=6*m; t.iron+=2*m; });
    for(const r in t) S.stats[r]+=t[r]; lines.push(`Tribute from the provinces: Coin +${t.coin} · Grain +${t.grain} · Iron +${t.iron}`); }
  b3Catchup();
  const ny=newAgeYield(); if(Object.keys(ny).length){ for(const r in ny) S.stats[r]+=ny[r]; lines.push(`New landmarks and food works: ${Object.entries(ny).map(([r,v])=>`${LABEL[r]} +${v}`).join(" · ")}`); }
  const iy={}; invList().forEach(I=>{ for(const r in (I.y||{})) iy[r]=(iy[r]||0)+Math.round(I.y[r]*modeMul()); });
  if(Object.keys(iy).length){ for(const r in iy) S.stats[r]+=iy[r]; lines.push(`Inventions: ${Object.entries(iy).map(([r,v])=>`${LABEL[r]} +${v}`).join(" · ")}`); }
  if(hasInv("press") && S.week%2===0) add({unity:1, renown:1});
  const eat=Math.ceil(hostSize()/2); if(eat){ S.stats.grain=Math.max(0,S.stats.grain-eat); lines.push(`The Host ate ${eat} grain`); }
}

/* ---------- 3. the Grand Council ----------
   Every day or week it takes the Realm Builders' proposals, approves the towns' own building,
   seals the small rifts and keeps the Host mustered. It brings you the big decisions, and asks your ruling on two or three questions. */
const SMALL = id => { const w=W[id]; return ["road","pave","found","grow","landmark"].includes(w.kind) || (w.kind==="seal" && riftAt(w.site)<=1); };
const BIG = id => { const w=W[id]; return ["great","capital","special","path","invent","manor","fields","newage"].includes(w.kind) || (w.kind==="seal" && riftAt(w.site)>=2); };
function logCouncil(what, fx, kind){
  const when=S.phase==="season"?`Week ${S.week}`:`Day ${S.day}`;
  if(!S.council || S.council.key!==turnKey()) S.council={key:turnKey(), when, ent:[]};
  S.council.ent.push({what, fx, kind:kind||"council"});
}
function councilTurn(){
  if(S.councilKey===turnKey()) return; S.councilKey=turnKey(); b3Catchup();
  if(!S.council || S.council.key!==turnKey()) S.council={key:turnKey(), when:S.phase==="season"?`Week ${S.week}`:`Day ${S.day}`, ent:[]};
  // the Realm Builders' crews, on whatever the council judges most useful
  guildOffers(); let guard=0; while((S.guildPicks||0)>0 && guard++<4){
    const o=guildOffers().filter(id=>SMALL(id)&&canPay(costOf(id,true))); if(!o.length) break;
    const id=o[0], nm=prefix(W[id])+workLabel(id), gn=val(W[id].gain); guildDo(id); logCouncil(nm, gn, W[id].kind); }
  // more crews in the season: the guild is big now
  if(S.phase==="season"){ for(let i=0;i<2;i++){ const id=WORK_ORDER().find(id=>relevant(id)&&SMALL(id)&&(!W[id].req||W[id].req())&&canPay(costOf(id,true))&&(W[id].kind!=="pave"||Math.random()<.3));
    if(!id) break; const nm=prefix(W[id])+workLabel(id), gn=val(W[id].gain); doWork(id,true); logCouncil(nm, gn, W[id].kind); } }
  // the towns' own building
  petitions().forEach(p=>{ const cost=costOf(p.id,true); if(p.self || Object.entries(cost).every(([r,v])=>S.stats[r]>=v*4)){ petitionDo(p);
    const e=S.townLast&&S.townLast.ent[S.townLast.ent.length-1]; if(e) logCouncil(e.what, e.fx, "town"); } });
  // keep the Host mustered: once a week in the season, every other day in the first part
  if(S.phase==="season" && S.week%2===1){
    const units=Object.keys(UNIT).filter(u=>UNIT[u].req()&&(S.flags[`cmus_${u}_${S.chapter}`]||0)<1);
    const want={wardens:10, listeners:6, engineers:5, ships:4}, u=units.sort((a,b)=>(S.host[a]||0)/want[a]-(S.host[b]||0)/want[b])[0];
    if(u){ const c={}; for(const r in UNIT[u].cost) c[r]=UNIT[u].cost[r]; if(canPay(c) && Object.entries(c).every(([r,v])=>S.stats[r]>=v*3)){
      for(const r in c) S.stats[r]-=c[r]; hostAdd(u, UNIT[u].amt); add({[`cmus_${u}_${S.chapter}`]:1});
      logCouncil(`Host: ${hostAmt(u,UNIT[u].amt)} more ${HOST_NAME[u]}`, `The Host now counts ${hostFmt(u)} ${HOST_NAME[u].toLowerCase()}`, "muster"); } }
  }
  // and the big rifts it brings to you
  riftList().filter(k=>riftAt(k)>=2).slice(0,1).forEach(k=>logCouncil(`The rift at ${SITES[k].name} is size ${riftAt(k)}`, "Too big for the council to seal alone: it needs your order", "warn"));
}
const CICON = {road:"═", pave:"═", found:"✦", grow:"▲", landmark:"◆", seal:"◎", town:"★", muster:"⚑", warn:"!", council:"·"};
function guildCard(){
  const g=S.council; if(!g || g.key!==turnKey() || !g.ent.length) return "";
  return `<section class="guild" aria-label="The Grand Council's report">
    <div class="guild-head"><span>The Grand Council handled</span><span>${g.when}</span></div>
    ${g.ent.map(e=>`<div class="guild-row ${e.kind==="warn"?"idle":"new"}"><i aria-hidden="true">${CICON[e.kind]||"·"}</i><div><b>${e.what}</b><small>${e.fx}</small></div></div>`).join("")}
  </section>`;
}

function cqToday(){

    const asked=S.cqAsked||[], pool=Object.keys(CQ).filter(k=>!asked.includes(k)&&(!CQ[k].req||CQ[k].req()));
    const pick=[]; while(pick.length<n && pool.length){ pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
    S.cq={key:turnKey(), ids:pick, done:[]}; S.cqAsked=asked.concat(pick);

  if(S.showLocked) out.push(...bigLocked);

    {label:"Keystone Surge", hint:"Your next work costs nothing · once each part of a chapter", req:()=>F("surgeKey")!==`${S.chapter}-${S.phase}`&&!F("surgeNext"), surge:true, cls:"build manor"},

    {label: S.phase==="season" ? "Let the council run the realm this week." : "Let the council run the realm today.", hint:"Nothing more needs you", skip:true});

/* fourteen years of peace: everything grows, and the schools and workshops change the world */
function applyYears(){
  S.snapMap=realmSVG(true);
  alive().forEach(k=>{ S.lv[k]=Math.min(5,S.lv[k]+1); });
  ["aurelsrise","freehaven","seagate"].forEach(k=>{ if(!S.lv[k]) S.lv[k]=3; });
  alive().filter(k=>S.lv[k]>=4&&Math.random()<.6).forEach(k=>{ S.lv[k]=5; });
  EDGES.forEach(([a,b])=>{ const e=edgeKey(a,b); if(S.lv[a]>0&&S.lv[b]>0&&!S.roads.includes(e)&&(["aurelsrise","freehaven","seagate"].includes(a)||["aurelsrise","freehaven","seagate"].includes(b)||Math.random()<.5)) S.roads.push(e); });
  S.paved=S.roads.slice();
  ["realmRoad1","realmRoad2","realmRoad3","manorFound","manorHall","manorNursery","manorGarden","manorWing","manorKidRoom","manorWorkshop","manorLibrary","manorSongRoom","manorRemember","granaries","courierPosts","accordHall","twoTongue"]
    .forEach(id=>{ if(W[id]&&!has(id)) S.built.push(id); });
  if(S.family.child2 && !has("manorBabyRoom")) S.built.push("manorBabyRoom");
  if(!S.spec) S.spec={};
  // great cities that never chose what to be chose for themselves
  alive().filter(k=>k!=="brack"&&S.lv[k]>=5&&!S.spec[k]).forEach((k,i)=>{ S.spec[k]=SPEC_FOR(k)[i%SPEC_FOR(k).length]; });
  // fourteen years of mustering: the Host is counted in thousands
  const h=S.host; h.wardens+=6; h.engineers+=3; if(F("realmGuild")) h.engineers+=1; h.listeners+=2; h.ships+=2;
  Object.values(S.spec).forEach(t=>{ if(t==="garrison") h.wardens+=3; if(t==="university") h.listeners+=2; if(t==="harbor") h.ships+=2; });
  if(has("keystoneAcademy")) h.listeners+=2; if(has("wardensCitadel")) h.wardens+=3; if(has("realmFleet")) h.ships+=2;
  if(F("role")==="warden") h.wardens+=3; if(F("role")==="builder") h.engineers+=2;
  // what the schools and workshops made
  S.inv=[]; Object.entries(INV).forEach(([k,I])=>{ if(I.req()) giveInv(k); });
  ["concrete","lanterns","rail"].forEach(k=>{ if(invList().length<5) giveInv(k); });
  const bump=S.mode==="builder"?200:400;
  ["timber","stone","coin","iron"].forEach(r=>S.stats[r]+=Math.round(bump*(r==="iron"?.4:1))); S.stats.grain+=bump*1.5;
  add({unity:10, morale:5, renown:12, craft:4});
  Object.assign(S.flags, {childSpark:true, fatherHere:true, edricRetired:true});
  S.local={};
  // the children are not children any more
  S.heir.songs=[]; ["stillness","hearing","asking"].forEach(learnSong); S.flags.newSong=null;
  S.stats.song=8; S.stats.trust=60;
  // the world, as fourteen years left it
  setStance("aurendell", F("c8result")==="hard" ? "neutral" : "ally");
  setStance("clans", F("clans")==="accord"||F("clans")==="treaty" ? "ally" : "neutral");
  setStance("saelmar", "ally");
  setStance("orsenne", F("book2end")==="open"||F("orsenne") ? "ally" : "neutral");
  setStance("caradun", "neutral"); setStance("ashlands", "neutral"); nation("ashlands").grey=2;
  if(F("book2end")==="open") nation("caradun").grey=1;
}
