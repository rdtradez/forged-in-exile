<p>${({open:`The Congress of Wonders meets in ${RN()} every spring, and Brackenfold fills with envoys from eleven kingdoms, arguing in the Accord Hall and eating everything in the markets. Embassies line the river road. Half the world's treaties are signed on your long table now, and the other half are argued about over it.`,

<p>Every town grows. Villages become towns, and towns become cities with university quarters and steam whistles at shift change. Three new places rise: a university town on the northern ridge named Aurel's Rise, a free port called Freehaven on the western shore, and Seagate, where the Realm Road meets the sea. The Realm Road is paved from end to end, with iron rails laid beside it. Fourteen years of peace, open roads and open doors, and the census counts more people in ${RN()} than lived in all of Aurendell when you were a child.</p>

<p>Fourteen years of peace, and you never once stopped preparing for this. ${F("role")==="warden"?"You were First Warden before you were anything else, and it shows.":F("role")==="crown"?"A crown taught you that peace is something you pay for every year, in advance.":"Every Master Builder knows you build the foundations first, before anyone needs them."}</p>
<p>The Wardens drill on the yards of ${has("wardensCitadel")?"the Citadel":"the garrison cities"} every morning: ${hostFmt("wardens")} of them now, who can hold a line, dig a ditch and pull a family out of a flood before breakfast. The Listeners number ${hostFmt("listeners")}, ${hasInv("relay")?"posted on every relay tower in the realm,":"spread through the universities,"} and can hear a crack in a dam forty miles off. The Realm Builders have ${lodges()} lodges and ${buildersN().toLocaleString()} members, and ${hostFmt("engineers")} of them are engineers who can throw a bridge across a river in an hour. And at Saltford and Freehaven, ${hostFmt("ships")} ships ride at anchor${hasInv("docks")?", half of them steamers":""}.</p>
<p>And you built something you're prouder of than any of it. The Grand Council runs ${RN()} now: Marren's grandchildren, Fen, the mayors of the great cities, the Chancellor, ${F("role")==="crown"?"and your own chair at the head of the table, which you mostly leave empty":"and a chair for you, which you mostly leave empty"}. They mend the roads and grow the towns and muster the Host without asking you. They only send for you when something is too big for them.</p>
${sys("THE GRAND COUNCIL",`[The realm runs itself]<br>Every day or week, the council builds roads, grows towns, seals small rifts and musters the Host on its own<br>It brings you the great decisions, and asks for your ruling on a few questions<br>You can still build anything yourself, from the everyday works list`)}`,
choices:()=>[{label:"And your children grew up.", go:"years2"}]},

years2:{ title:()=>`How ${CHILD()} Was Raised`, text:()=>`
<p>${CHILD()} grew up in the manor you built, in the room ${CP("sub")} chose the colors for, under the singing stone of the workshop tower. And ${CP("sub")} was raised, from the day ${CP("sub")} was born, by some of the best people in the world at what they do.</p>
<p>${CPc("sub")} learned the Cantor's gift from ${teacherWord()}${({fen:", who made "+CP("obj")+" patient: Fen would have "+CP("obj")+" sing to one stone for a whole afternoon until it answered, and it always did",you:", which made "+CP("obj")+" fearless and a little reckless, like you. You taught "+CP("obj")+" the way you learned, by doing it for real, on real bridges",wren:", who taught "+CP("obj")+" Elder songs nobody else alive knows, in the Elders' own words",play:", which means "+CP("sub")+" invents songs nobody taught, and some of them work better than the old ones"})[F("teacher")||"you"]}. ${has("keystoneAcademy")?`At twelve ${CP("sub")} was the youngest student the Keystone Academy ever took, and at fifteen Hale stopped teaching ${CP("obj")} and started taking notes.`:`At twelve ${CP("sub")} was teaching the Listeners things they didn't know.`}</p>
<p>${SPN()?`${SPN()} ${S.family.partner==="caelan"?"raised a reader: "+CHILD()+" argues from books, in three languages, and wins":"raised a fighter: "+CHILD()+" can hold a sword, hold a line and hold a grudge, and is learning to let go of the third"}.`:"The whole household raised "+CP("obj")+": Bren taught "+CP("obj")+" to fish, Tamsin to sail, Fen to measure twice."} ${F("role")==="crown"?`And because ${CP("pos")} ${HP()} wears a crown, ${CP("sub")} sat at the back of the council from the age of nine, and knows exactly which mayor is lying about his granary.`:F("role")==="warden"?`And because ${CP("pos")} ${HP()} is First Warden, ${CP("sub")} has drilled with the Wardens since ${CP("sub")} was ten, and they would follow ${CP("obj")} into a fire.`:`And because ${CP("pos")} ${HP()} is Master Builder, ${CP("sub")} has carried stone on every great work in the realm since ${CP("sub")} could lift one.`}</p>
<p>And ${CP("sub")} grew up with ${CP("pos")} grandfather. Lord Edric taught ${CP("obj")} chess, and court manners, and how to read a room by who stops talking when you come in. ${CHILD()} is the only one in the family who can still make him laugh. Every birthday, ${CP("sub")} opens one of his letters. ${CPc("sub")} has one left.</p>
<p>At sixteen, ${CHILD()} held the Velm dam shut for a whole night in a spring flood, singing, until the engineers came. Half the realm knows the story. ${CPc("sub")} hates it being told. ${F("princessFriend")?`And for twelve years ${CP("sub")} has been writing letters to Princess Elowen of Aurendell, the girl who raced ${CP("obj")} down the Realm Road. Long ones. ${CPc("sub")} doesn't let anyone read them.`:`${CPc("sub")} has met Princess Elowen of Aurendell exactly once, at a state dinner, and they did not get on.`}</p>
<p>${CHILD()} is nineteen now.</p>
${sys(`${CHILD().toUpperCase()} · CANTOR`,`[Nineteen]<br>Song ${S.stats.song} · knows the Songs of Stillness, Hearing and Asking · the best young Cantor in the world, and there are not many`)}`,
choices:()=>[
  {label:`What you most wanted to teach ${CP("obj")}: patience.`, hint:"Trust +5 · Song +1", fx:{trust:5, song:1, raised:"patience"}, go:"years3"},
  {label:`What you most wanted to teach ${CP("obj")}: courage.`, hint:"Song +2 · Trust +2", fx:{song:2, trust:2, raised:"courage"}, go:"years3"},
  {label:`What you most wanted to teach ${CP("obj")}: kindness.`, hint:"Trust +8", fx:{trust:8, raised:"kindness"}, go:"years3"}
]},

years3:{ title:"The Second Child", input:{placeholder:"Rowan", max:18, init:()=>S.family.child2||""}, text:()=>`
${S.family.child2?`<p>${CHILD2()} is fourteen, and an Artificer, like you: the magic that mends, not the magic that sings.</p>`
:`<p>Two years after the Realm Road opened, a second child came into your life${SPN()?`, and ${SPN()}'s`:""}: a baby from Ironvale, after the mine fall, or one of your own, depending on how you tell it, and in your family nobody ever tells it the same way twice. Fourteen now, and an Artificer, like you: the magic that mends, not the magic that sings.</p><p>Type the second child's name above, or keep the one there.</p>`}
<p>Which would be ordinary, except that at twelve this child built a steam carriage out of a broken water pump and an ember stone, drove it down the Realm Road at the speed of a galloping horse, and crashed it, very gently, into the Spark School's front steps. At fourteen, the Spark School has given this child the keys to the big workshop, because it was easier than trying to keep them out of it.</p>
<p>The two of them fought like cats when they were small: the singer and the fixer, the eldest who got all the attention and the youngest who got all the trouble. Somewhere in the last few years that changed. The eldest taught the youngest to read, and to swim, and how to get past the kitchen door after dark. The youngest built the eldest a tuning fork that never goes flat, and a bed that folds into a chest for traveling. They have a whole language of looks across the dinner table that nobody else in the family understands.</p>`,
choices:()=>[
  {label:"Your second son.", fx:{child2P:"he"}, useInput:S.family.child2?null:"child2", go:"years3b"},
  {label:"Your second daughter.", fx:{child2P:"she"}, useInput:S.family.child2?null:"child2", go:"years3b"},
  {label:"Your second child. Just that.", fx:{child2P:"they"}, useInput:S.family.child2?null:"child2", go:"years3b"}
]},
years3b:{ title:"What They Call Each Other", text:()=>`
<p>${CHILD()} has a name for ${CHILD2()} that nobody else is allowed to use. It started as a joke when ${CHILD2()} was four, and it stuck, and if anyone outside the family tries it, ${CHILD()} will look at them in a way that makes them stop.</p>`,
choices:()=>[
  {label:`"Pip," because ${CHILD2()} was so small.`, hint:"Sibling ◆", fx:{sibNick:"Pip", aff_sib:1}, go:"years3c"},
  {label:`"Sprocket," because ${CHILD2()} took apart the nursery clock.`, hint:"Sibling ◆", fx:{sibNick:"Sprocket", aff_sib:1}, go:"years3c"},
  {label:`"Spark," because ${CHILD2()} was born in a thunderstorm.`, hint:"Sibling ◆", fx:{sibNick:"Spark", aff_sib:1}, go:"years3c"}
]},
years3c:{ title:"The Cousins", text:()=>`
<p>Your sister Seren's children spent every summer of the fourteen years at Brackenfold, because Seren ${F("serenGuardian")?"is your children's guardian if anything happens to you, and takes it very seriously":"says Highcrown in summer smells of other people's money"}, and because the four of them, once they were together, could not be separated without a great deal of shouting.</p>
<p><b>Torin Valcrest</b> is twenty one. He is the boy who set fire to your curtains at the age of two, and he grew up into a Pyromancer of the Spark School: a tall, red haired, cheerful young man who can light a forge with a look and has been asked, politely, by every inn on the Realm Road not to. He commands the Ember Guard at Highcrown. He calls ${CHILD()} "cousin" in a voice that means "little brother," and would walk into the grey for either of your children without stopping to think, which is the thing about him that worries Seren most.</p>
<p><b>Ilsa Valcrest</b> is fifteen, and the sharpest person in any room she walks into. She calls the wind, and mostly uses it to steal hats. She and ${CHILD2()} have been inseparable since they could crawl, and run a two person conspiracy that has so far produced a mechanical owl, a kite that can carry a cat, and an incident in the Accord Hall that nobody discusses.</p>
<p>And <b>Jory</b>, Fen and Lise's son, who grew up in your manor's kitchen as much as in his own, isn't a cousin by blood and has never once been treated as anything less. He is seventeen, carries the maps, can fix anything with a hinge, and calls you ${AUNC()} without thinking about it.</p>
<p>Five of them. On summer nights they sleep on the manor roof, all of them, and you can hear them talking until dawn.</p>`,
choices:()=>[
  {label:"The worst trouble they ever got into was Torin's idea.", hint:"Torin ◆", fx:{aff_torin:1}, go:"years4"},
  {label:"The worst trouble they ever got into was Ilsa's idea.", hint:"Ilsa ◆", fx:{aff_ilsa:1}, go:"years4"},
  {label:`The worst trouble they ever got into was ${CHILD()}'s idea, and the other four took the blame.`, hint:"Sibling ◆ · Jory ◆", fx:{aff_sib:1, aff_jory:1}, go:"years4"}
]},

years4:{ title:"What the Realm Became Known For", text:()=>`
<p>Every country is known for something. In fourteen years of peace, ${RN()} became known across the world for one thing above all.</p>`,
choices:()=>[
  {label:"Its scholars: Aurel's Rise, the Keystone Academy, the Listeners.", hint:`Craft +3 · Listeners +${hostAmt("listeners",3)}`, fx:{craft:3, knownFor:"scholars"}, then:()=>hostAdd("listeners",3), go:"c1open"},
  {label:"Its builders and engineers: the Realm Builders build for half the world.", hint:`Engineers +${hostAmt("engineers",2)} · Stone and Timber +200`, fx:{knownFor:"builders", stone:200, timber:200}, then:()=>hostAdd("engineers",2), go:"c1open"},
  {label:"Its open doors: anyone fleeing anything is welcome.", hint:"Unity +10 · a neutral nation becomes an ally", fx:{unity:10, knownFor:"doors"}, then:()=>{ const k=NAT_KEYS.find(x=>nation(x).stance==="neutral"); if(k) setStance(k,"ally"); }, go:"c1open"}
]},

/* ---------------------------- CHAPTER ONE: THE GREY TIDE ---------------------------- */
c1open:{ title:"The Grey Tide", enter(){ chapterEnter(1); }, text:()=>`
${({open:`<p>The letter comes from the Congress of Wonders, in Empress Ysolt's beautiful hand: something is wrong in Caradun's southern colonies. The ground is going grey. Stone crumbles to sand at a touch, and in one harbor town the people woke up one morning unable to remember the town's name.</p><p>Three days later, at Seagate, where the Realm Road meets the sea, the dockworkers find a patch of grey on the quay the size of a table, and growing.</p>`,
 quiet:`<p>It starts in the north, at Kell, where the Lantern sleeps. A shepherd from Northwatch rides in with grey dust in his beard and a look on his face you have only seen once before, on the night the storm came. ${say(`"The ground's gone wrong,"`)} he says. ${say(`"Like it forgot how to be ground."`)}</p><p>Every Wonder in the world is asleep, because you sang them all to sleep. Nothing is holding anything shut.</p>`,
 heir:`<p>On the morning ${CHILD()} turns nineteen, the light under the Bridge of Two Banks goes out.</p><p>Fourteen years it has burned, steady as a lamp in a window. Now the water under the bridge is dark, and on the east bank, in Overbrack, the cobbles of the market square are turning grey and soft, like ash.</p><p>${CHILD()} comes to find you, white faced. ${say(`"It stopped waiting,"`)} ${CP("sub")} says. ${say(`"I heard it stop."`)}</p>`,
 living:`<p>You are in the middle of a council meeting when the floor of the Accord Hall drops out from under you. It doesn't. It only feels that way. Something has pushed up from below the world, hard, against everything you have been holding for fourteen years, and you fall out of your chair.</p><p>When you wake, ${CHILD()} is holding your hand. ${say(`"I felt it too,"`)} ${CP("sub")} says. ${say(`"Under Karsk. Something's coming up."`)}</p>`})[F("book2end")||"quiet"]}
${sys("THE UNDERTOW",`[Book Three]<br>Fourteen chapters · you play the even chapters as ${CHILD()}<br>Grey rifts drain the places they open in · raise seal-stones to close them`,"warn")}`,
choices:()=>[{label:"Go and see it with your own eyes.", go:"c1days"}]},
c1days:{ title:"Four Days", enter(){ daysEnter(); openRift(RIFT_START(),1); }, text:()=>`
<p>${hasInv("relay")?`The relay towers flash it across the realm before noon: grey ground at ${SITES[RIFT_START()].name}. `:""}You go to ${SITES[RIFT_START()].name} ${hasInv("rail")?"on the Iron Way, in the cab of the fastest engine Karsk ever built, ":""}with Fen, a dozen Listeners, and ${CHILD()}, who simply gets on the train and dares anyone to stop ${CP("obj")}. ${F("fatherHere")?"Your father, ninety one this spring, insists on coming as far as the gate, and then stands there on his cane, watching you go, the way he did the day you were sent into exile.":""}</p>
<p>Four days before anyone understands what this is.</p>`,
choices:()=>[{label:"Plan the first day.", go:"plan"}]},
c1d1:{ title:"Grey Sand", text:()=>`
<p>The rift at ${SITES[RIFT_START()].name} is a patch of ground the size of a house where the world has simply stopped. Not burned, not broken: emptied. Grass turns to grey thread. Cobbles crumble to grey sand. A dropped iron nail rusts to nothing while you watch.</p>
<p>You lay your hand on the edge of it and Listen, the way you've Listened to every stone you ever mended. And for the first time in your life, the stone has nothing to say. It isn't silent. It's gone.</p>`,
choices:()=>[
  {label:"Try to mend it.", hint:"It doesn't work · Craft +1 · you learn something", fx:{craft:1, c1tried:"mend"}, go:"nextday"},
  {label:"Have the Listeners map exactly where it ends.", hint:"Listeners learn the grey's shape · the crisis goes better", fx:{n_c1:1}, go:"nextday"},
  {label:"Clear everyone out for a mile around.", hint:"Morale −1 · safe", fx:{morale:-1, c1clear:true}, go:"nextday"},
  {label:`Ask ${CHILD()} to listen to it with you.`, hint:"Trust +3 · the crisis goes better", fx:{trust:3, n_c1:1, c1heirHeard:true}, go:"nextday"}
]},
c1d2:{ title:"The Forgetting", text:()=>`
<p>On the second day, a village near the rift forgets its name. Nobody in it can say it, write it, or remember it. The sign at the crossroads is still there, and they look at it the way you'd look at a word in a language you don't speak.</p>
<p>${F("ending")==="keeper"?"That night, Wren's voice comes up through the floor of the manor, from the Storm Engine fifty miles away, faint and fast: ":"That night, Wren comes to the manor, which Wren has not done in years, and says: "}${say(`"I know what this is. I was hoping I would die before I had to tell you. The Elders called it the Undertow. They built every Wonder you ever touched to keep it down."`)}</p>`,
choices:()=>[
  {label:`"Tell me everything."`, hint:"Wren tells you most of it · Craft +1", fx:{craft:1, wrenTold:true}, go:"nextday"},
  {label:"Write the village's name on every wall in it, so they can learn it again.", hint:"Unity +3 · it works, a little", fx:{unity:3}, go:"nextday"}
]},
c1d3:{ title:"Nineteen", text:()=>`
<p>${CHILD()}'s nineteenth birthday is on the third day. You almost cancel the dinner. ${SPN()?`${SPN()} won't let you.`:"Your father won't let you."} The cousins have all come: Torin up from Highcrown with a crate of fireworks he has promised not to light indoors, Ilsa with him, Jory from the lodge with grey dust still on his boots. ${CHILD2()} gives ${CHILD()} a present wrapped in a map: a brass tuning fork the length of a hand, with a seal-stone's mason's square cut into the handle. ${say(`"For the grey,"`)} ${CHILD2()} says. ${say(`"I worked out the note it doesn't like. Don't tell anyone. They'll make me explain it."`)}</p>
<p>${CHILD()} opens ${CP("pos")} grandfather's last letter at the table, reads it twice, and puts it in ${CP("pos")} coat without saying what it says. Torin lights exactly one firework, in the garden, and Edric applauds.</p>
<p>${F("princessFriend")?"Princess Elowen arrives halfway through, uninvited, mud to the knees, having ridden two days from Highcrown to be there. She and "+CHILD()+" stare at each other across the hall like two people who have written a hundred letters and never quite said the thing.":"A guest arrives halfway through: Princess Elowen of Aurendell, Corvin's daughter, sent with a birthday gift and very obviously not wanting to be here."}</p>
<p>After dinner, ${CHILD()} finds you on the manor roof. ${say(`"The grey is in Orsenne too,"`)} ${CP("sub")} says. ${say(`"Around the Sun Mirror. I can hear it from here. I think I'm the only one who can close it."`)}</p>`,
choices:()=>[
  {label:`"Then we'll go together, when this is under control."`, hint:"Trust +3", fx:{trust:3, c1heir:"together"}, go:"nextday"},
  {label:`"No. Not yet. It's too dangerous."`, hint:"Trust −5 · this will not be the end of it", fx:{trust:-5, c1heir:"no"}, go:"nextday"},
  {label:`"Tell me what you'd need."`, hint:"Trust +6 · Song +1", fx:{trust:6, song:1, c1heir:"plan"}, go:"nextday"}
]},
c1d4:{ title:"The Bench", text:()=>`
<p>Your father is on his bench at the end of the lawn, by the stone rose, where he is every morning. He is ninety one. He reads with a glass now, and walks with two canes. His mind is exactly as sharp as it ever was, which he says is unfair.</p>
<p>${say(`"I hear the ground is going grey,"`)} he says, without looking up from his book. ${say(`"And I hear the kings are writing to you. All of them. At once."`)} He closes the book. ${say(`"When I was young, the king of Aurendell asked my father to rule the east for him. My father said yes. It took our family three generations to stop being hated for it."`)} He looks at you over his glass. ${say(`"I am not telling you what to do. I am telling you that I would like to be alive to see what you choose."`)}</p>`,
choices:()=>[
  {label:"Sit with him until lunch.", hint:"Morale +2", fx:{morale:2}, go:"nextday"},
  {label:"Ask him what he would choose.", hint:"Your father's counsel", fx:{edricAsked:true}, go:"nextday"}
]},
c1c1:{ title:"The First Rift", enter(){ crisisEnter(); if(F("c1heirHeard")) add({n_c1:1}); }, text:()=>`
<p>On the fifth night, the rift at ${SITES[RIFT_START()].name} tears open.</p>
<p>It isn't loud. That's the worst of it. The grey simply runs outward, a quarter mile in a minute, like a tide coming in over flat sand, and everything it touches stops. And out of the middle of it, walking, come people. Shepherds. A woman with a basket. A dog. Grey all through, as if someone had drawn them in ash. Their eyes are open and there is nothing in them.</p>
<p>${say(`"The Unmade,"`)} ${F("wrenTold")?"Wren":"Fen"} says, very quietly. ${say(`"That's what happens to people who stand in it too long."`)}</p>
${sys("CRISIS",`[The First Rift]<br>The grey is running · ${SITES[RIFT_START()].name} is in its path`,"warn")}`,
choices:()=>[
  {label:"Kneel at the edge and hold the ground the way you hold a bridge.", hint:"Craft decides · you've never held nothing before", fx:{n_c1:S.stats.craft>=28?2:1}, go:"c1c2"},
  {label:"Send the engineers to wall it in with whatever stone they can carry.", hint:`Engineers in the Host: ${hostFmt("engineers")}`, fx:{n_c1:S.host.engineers>=6?2:1}, go:"c1c2"},
  {label:"Get the town out first.", hint:F("c1clear")?"You already cleared the mile around":hasInv("rail")?"The Iron Way can carry them":"There may not be time", fx:{n_c1:F("c1clear")?2:hasInv("rail")?1:0}, go:"c1c2"},
  {label:`Stand back to back with ${CHILD()}: you hold the ground, ${CP("sub")} sings it still.`, hint:`Song ${S.stats.song} · Trust ${S.stats.trust}`, fx:{n_c1:S.stats.song>=16&&S.stats.trust>=60?3:2, trust:4, c1together:true}, go:"c1c2"}
]},
c1c2:{ title:"The Unmade", text:()=>`
<p>${F("c1together")?`${CHILD()} sings the Song of Stillness at the edge of it, low and steady, the way ${CP("sub")} held the Velm dam, and where ${CP("pos")} voice reaches, the grey stops dead. Where it doesn't, it keeps coming.`:"The grey slows where you are. It doesn't stop."} And the Unmade keep walking, slowly, toward the lights of ${SITES[RIFT_START()].name}, not angry, not hungry, just walking, the way water runs downhill.</p>
<p>One of them, a young shepherd, walks right past you. You can see the shape of a name still on his lips, as if he were trying to say it.</p>`,
choices:()=>[
  {label:"Have the Wardens stop them gently, with nets and rope, not swords.", hint:`Wardens in the Host: ${hostFmt("wardens")}`, fx:{n_c1:S.host.wardens>=12?2:1, c1nets:true}, go:"c1c3"},
  {label:"Say the shepherd's name. Someone must know it.", hint:"Unity decides", fx:{n_c1:S.stats.unity>=80?2:1, c1name:true}, go:"c1c3"},
  {label:"Let the Listeners lead them away from the town by humming.", hint:`Listeners in the Host: ${hostFmt("listeners")}`, fx:{n_c1:S.host.listeners>=6?2:1}, go:"c1c3"}
]},
c1c3:{ title:"Holding", text:()=>`
<p>${F("c1name")?`An old woman from the town pushes to the front and says it, the shepherd's name, Tomas, over and over, and the young man stops walking. He doesn't wake. But he stops.`:F("c1nets")?`The Wardens bring the Unmade down gently, one by one, and wrap them in blankets, and they lie there looking at the sky.`:`The Listeners hum one long low note, and the Unmade turn toward it like sleepwalkers and follow it away from the houses.`}</p>
<p>And then you feel it, under your hands: the grey stops spreading. Not because of anything you did. Because it has decided, for now, that it is far enough.</p>`,
choices:()=>[{label:"Hold on until dawn anyway.", go:"c1c4"}]},
c1c4:{ title:"Dawn", enter(){ const o=outcome("c1"); S.flags.c1result=o; S.rifts[RIFT_START()] = o==="great"?1:o==="good"?2:3; if(o==="great") add({unity:4, renown:4}); else if(o==="good") add({renown:2}); else add({morale:-3}); S.phase="open"; }, text:()=>`
<p>${({great:`By dawn the rift has shrunk back to the size of a house, and everyone in ${SITES[RIFT_START()].name} is alive, and accounted for, and remembers their name.`,good:`By dawn the rift has stopped growing. Three houses are grey, and a mill, and a field of barley. Nobody died. Seven people from the outlying farms are Unmade, lying in a barn in blankets, staring at the rafters.`,hard:`By dawn the rift is a mile across. ${SITES[RIFT_START()].name} has lost a quarter of its houses. Forty people are Unmade. You don't know if they will ever come back.`})[F("c1result")]}</p>
<p>${CHILD()} sits down on the road next to you, hoarse, with grey dust in ${CP("pos")} hair. ${say(`"It was listening,"`)} ${CP("sub")} says. ${say(`"When I sang. It stopped to listen."`)} Fen sits down on the other side of you. ${say(`"We need something new,"`)} he says. ${say(`"Not mending. You can't mend nothing. Something that holds it shut."`)}</p>
${sys("CRISIS OVER",`[The first rift holds]<br>Rift at ${SITES[RIFT_START()].name}: size ${riftAt(RIFT_START())} · it will grow unless you seal it`)}`,
choices:()=>[{label:"Go home, and start building.", go:"c1season"}]},
c1season:{ title:"Part Two: The Spring of Letters", enter(){ seasonEnter(); }, text:()=>`
<p>Five weeks, while every king in the world writes to you, and the grey keeps growing.</p>
${sys("SEAL-STONES",`[New work]<br>A seal-stone closes a rift: Elder stones set to lean on each other around the grey · the bigger the rift, the more it costs<br>The Host can be mustered from the build list too`)}`,
choices:()=>[{label:"Plan the first week.", go:"plan"}]},
c1w1:{ title:"Seal-stones", text:()=>`
<p>You and Fen work out the seal-stones in the first week, at the workshop table, with ${CHILD2()} handing you tools and ${CHILD()} humming at the stone to tell you which way it wants to lean. It's the Book of Arches all over again: you can't fill nothing, but you can build around it, every stone leaning on the next, so the ring holds itself shut.</p>
<p>${say(`"It's a keystone,"`)} ${CHILD2()} says suddenly. ${say(`"A whole ring of them. Isn't it?"`)} Everyone stops and looks at ${C2("obj")}. ${CHILD2()} goes very red.</p>`,
choices:()=>[
  {label:`Let ${CHILD2()} carve the mark on the first seal-stone.`, hint:"Morale +2 · Trust +2", fx:{morale:2, trust:2, sib1:true}, go:"nextweek"},
  {label:"Write it all down for every Realm Builder lodge in the realm, and print it.", hint:`Engineers +${hostAmt("engineers",2)}`, fx:{}, then:()=>hostAdd("engineers",2), go:"nextweek"}
]},
c1w2:{ title:"A Second Rift", enter(){ const opts=alive().filter(k=>!riftAt(k)&&k!=="brack"); const k=opts[Math.floor(Math.random()*opts.length)]; S.flags.rift2=k; openRift(k,1); }, text:()=>`
<p>In the second week, a second rift opens, at ${SITES[F("rift2")].name}. Smaller. Quieter. It wasn't there yesterday and nobody saw it come.</p>
<p>The Unmade from the first rift are still lying in a barn in blankets. Some of them have started, very faintly, to hum.</p>`,
choices:()=>[
  {label:"Build a house of care for the Unmade, with the best physicians in the realm.", hint:"Coin −10 · Morale +3 · Unity +2", req:()=>S.stats.coin>=10, fx:{coin:-10, morale:3, unity:2, careHouse:true}, go:"nextweek"},
  {label:`Ask ${CHILD()} to sing to them.`, hint:"Song +1 · Trust +3 · something stirs", fx:{song:1, trust:3, sangUnmade:true}, go:"nextweek"},
  {label:"Post Wardens at every rift, day and night.", hint:"Defense +3", fx:{defense:3}, go:"nextweek"}
]},
c1w3:{ title:"Letters from Every Crown", text:()=>`
<p>The letters come all at once in the third week, as if the kings had agreed to it. King Corvin writes that grey has appeared on the Aurendell border. The Saelmar admirals write that the sea is going grey in patches, and fish die in them. Orsenne writes that the Sun Mirror is surrounded by grey and nobody can get near it. The northern clans send a chief on a horse, who says only: ${say(`"The mountains are forgetting."`)}</p>
<p>And Empress Ysolt of Caradun writes, beautifully, at length, offering help, and asking where exactly the Elders' crown is kept.</p>`,
choices:()=>[
  {label:"Answer every letter yourself, the same day.", hint:"Renown +3 · Unity +2", fx:{renown:3, unity:2}, go:"nextweek"},
  {label:"Answer Ysolt's last, and say nothing about the crown.", hint:"Caradun is suspicious · Defense +2", fx:{defense:2, ysoltCold:true}, go:"nextweek"},
  {label:"Invite them all to Brackenfold, to decide together.", hint:"The Council of Crowns · Unity +3", fx:{unity:3, councilCalled:true}, go:"nextweek"}
]},
c1w4:{ title:()=>`${CHILD()} Asks`, text:()=>`
<p>${CHILD()} asks again in the fourth week, properly this time, in your study, with a map. Orsenne. The Sun Mirror. A road there through Aurendell, a ship from Freehaven for the last part. Elowen will go. Jory will go. Torin has already asked Seren for leave from the Ember Guard, and Seren, who knows her son, has already said yes. ${CHILD2()} wants to go and has been told, by everyone, no, and has taken it about as well as you'd expect. ${F("c5how")==="kade"?"Captain Kade has offered his ship, and his crew, and a great deal of advice.":""}</p>
<p>${say(`"I'm not asking because I need you to say yes,"`)} ${CHILD()} says. ${say(`"I'm asking because I'd rather go with your blessing than without it."`)}</p>`,
choices:()=>[
  {label:"Give your blessing, and your own mason's square to carry.", hint:"Trust +8 · the heir leaves well", fx:{trust:8, c2start:"blessing"}, go:"nextweek"},
  {label:"Give your blessing, and send a company of three hundred Wardens with them.", hint:`Trust +3 · Wardens −${hostAmt("wardens",1)} for now`, fx:{trust:3, c2start:"guarded"}, then:()=>hostAdd("wardens",-1), go:"nextweek"},
  {label:"Say no.", hint:"Trust −10 · the heir goes anyway", fx:{trust:-10, c2start:"ran"}, go:"nextweek"}
]},
c1w5:{ title:"The Kings Arrive", text:()=>`
<p>They come in the fifth week, all of them, to Brackenfold: King Corvin with Elowen at his side, and your sister Seren in his train, who hugs you so hard on the steps that something in your back clicks. The admirals of Saelmar, with Tamsin. Eleven chiefs of the northern clans, in furs, in May. The Sun Council of Orsenne, with Yselde Moro, her hands still scarred. And last of all, on a ship with sails the color of wine, Empress Ysolt of Caradun, tall and calm and very young, with three Elder relics on a chain around her neck that hum when she walks.</p>
<p>${F("fatherHere")?`Your father watches them come up the road from his bench, and says to no one in particular: ${say(`"Well. Here it is."`)}`:""}</p>`,
choices:()=>[{label:"Go down to meet them.", go:"nextweek"}]},
c1close:{ title:"The Council of Crowns", text:()=>`
<p>They meet in the Accord Hall, at the long table with no head. Corvin speaks first, which surprises everyone.</p>
<p>${say(`"Every one of us has grey on our borders,"`)} he says. ${say(`"None of us knows what to do about it. ${N()} does. The Elders' crown is under ${P("pos")} bridge, and the only person alive who has ever held it is sitting at this table."`)} He looks around the hall. ${say(`"I propose that we put ourselves under one crown until this is over. ${P("pos").charAt(0).toUpperCase()+P("pos").slice(1)}."`)}</p>
<p>The hall goes quiet. Marren, at the far end of the table, closes her eyes. Ysolt smiles very slightly. ${CHILD()}, in the gallery, has gone completely still.</p>
${sys("THE CHOICE OF THE BOOK",`[Empire or League]<br>${(F("ending")==="storm"||S.stats.resent>=6||F("role")==="crown")?"Everything you've been pushes you toward the crown.":(S.stats.unity>=85||F("book2end")==="open")?"Everything you've built pushes you toward the League.":"Either road is open."}`)}`,
choices:()=>[
  {label:"Accept. Become the Keystone Emperor, until the grey is gone.", hint:"The Empire path · provinces, legions, imperial roads · power, and its price", fx:{path:"empire", renown:10, resent:1}, go:"c1closeE"},
  {label:"Refuse. Offer them a League instead: equals, bound by choice.", hint:"The League path · embassies, the Wardens' Host, allies who choose you", fx:{path:"league", unity:6}, go:"c1closeL"}
]},
c1closeE:{ title:"The Keystone Emperor", text:()=>`
<p>You stand up. ${say(`"Until the grey is gone,"`)} you say. ${say(`"Not one day longer."`)}</p>
<p>Corvin kneels first. Then the clan chiefs, one by one. The admirals of Saelmar confer, and bow, which is not the same thing. Orsenne's Sun Council says it will consider. Ysolt does not move at all, and smiles.</p>
<p>In the gallery, ${CHILD()} gets up and walks out. ${SPN()?`${SPN()} goes after ${CP("obj")}.`:""} Your father, at the back of the hall, closes his eyes.</p>
${sys("THE EMPIRE",`[The Keystone Empire]<br>Empire works open in Chapter Three: pledges, imperial roads, legion forts, the Imperial Palace`)}`,
choices:()=>[{label:"End of Chapter One.", go:"summary1"}], enter(){ if(nation("aurendell").stance!=="rival") setStance("aurendell","province"); if(nation("clans").stance==="ally") setStance("clans","province"); }},
c1closeL:{ title:"The League of the Arch", text:()=>`
<p>${say(`"No,"`)} you say. ${say(`"I was sent into exile by people who thought they knew what was best for everyone. I won't rule you. But I'll stand with any of you who'll stand with me."`)}</p>
<p>Marren laughs out loud, once, at the far end of the table. Corvin looks relieved, which you'll think about later. Saelmar signs at once. The clans sign. Orsenne says it will consider. Ysolt bows politely, and signs nothing.</p>
<p>In the gallery, ${CHILD()} is grinning.</p>
${sys("THE LEAGUE",`[The League of the Arch]<br>League works open in Chapter Three: embassies, League fortresses, the Hall of the Arch`)}`,
choices:()=>[{label:"End of Chapter One.", go:"summary1"}], enter(){ add({trust:5}); }},
summary1: chapterSummary(1, ()=>`<p>The grey has come. ${({great:"The first rift is held, and nobody was lost.",good:"The first rift is held, at a price.",hard:"The first rift cost a town a quarter of its houses."})[F("c1result")]} The kings of the world came to Brackenfold, and you chose ${EMP()?"the crown":"the League"}. ${F("c2start")==="ran"?`And ${CHILD()} is already gone, in the night, toward Orsenne.`:`And ${CHILD()} is packing for Orsenne.`}</p>`, "Chapter Two: The Cantor's Road", "c2open")
});

/* ================================================================
   BOOK THREE, CHAPTERS TWO TO FIVE
   Even chapters are played as the heir: "you" is the eldest child.
   ================================================================ */
const hostTest = need => hostPower()>=need ? 2 : hostPower()>=need*0.6 ? 1 : 0;
CH[2].comps = ["elowen","jory","torin","kade"];
CH[4].comps = ["elowen","jory","ilsa","torin"];
CH[2].acts = {
  mirrorLore:{label:"Study the burned tablets in Orsenne's archive with Yselde", hint:"Learn how the Mirror was built · the crisis goes better", max:1, title:"The Archive", fx:()=>({n_c2:1}),
    text:()=>`<p>Yselde Moro reads the burned tablets aloud with her scarred hands flat on the table. The Mirror was never meant to burn. It was meant to turn sunlight into something that holds: a light that the grey cannot cross. Someone turned it the wrong way, long ago, and it has been a weapon ever since.</p>`}
};
Object.assign(SCENES, {
/* ============================ CHAPTER TWO: THE CANTOR'S ROAD (the heir) ============================ */
c2open:{ title:"The Cantor's Road", enter(){ chapterEnter(2); }, text:()=>`
<p>You are ${CHILD()}, and you are nineteen, and your grandfather's last birthday letter is in your coat pocket. You have read it eleven times. It says:</p>
<p>${say(`"I have written you a letter every year of your life, and this is the last one, because I am ninety one and I have run out of birthdays I can be sure of. So here is the only thing I know. Your ${HP()} was sent away for having the wrong kind of magic, and turned out to have exactly the right kind. When they tell you what you are, and they will, believe yourself first."`)}</p>
<p>${({blessing:`Your ${HP()} gave you ${P("pos")} own mason's square to carry, the old one with Aurel's mark worn almost smooth. You can feel it humming in your other pocket.`,guarded:`Three hundred Wardens ride behind you, which is your ${HP()}'s way of saying I love you, and also your ${HP()}'s way of saying I don't trust anyone.`,ran:`You left at midnight, through the kitchen garden, without saying goodbye. You left a note. It was not a very good note.`})[F("c2start")||"blessing"]}</p>
<p>${CHILD2()} saw you off at the gate at dawn, in a nightshirt and boots, and pressed something into your hand without a word: a brass compass with the needle taken out and a seal-stone chip in its place. It points at grey. ${say(`"Tested it on the rift at ${SITES[RIFT_START()].name},"`)} ${C2s()} said. ${say(`"Don't lose it. Don't die. In that order."`)} Then ${C2s()} turned and walked back up to the manor very fast, so you wouldn't see ${C2("pos")} face.</p>
<p>Elowen rides beside you. Jory rides behind with the maps. Torin rides at the back on a red horse with the Ember Guard's flame on his cloak, singing badly, and making the camp fires light themselves every night, to show off. ${F("c5how")==="kade"?"And at Freehaven, Captain Kade is waiting with his ship, older and greyer and still laughing, to carry you the last of the way.":"At Freehaven, a Saelmar ship is waiting to carry you the last of the way."}</p>
${sys("YOUR CHAPTER",`[You are ${CHILD()}]<br>Each day you can do two things at camp · then the day's events · then the Sun Mirror<br>Songs you know: ${songsText()}`)}`,
choices:()=>[
  {label:"Look back once at Brackenfold from the hill.", hint:"Trust +2", fx:{trust:2}, go:"c2days"},
  {label:"Don't look back. Ride.", hint:"Song +1", fx:{song:1}, go:"c2days"}
]},
c2days:{ title:"The Road to Orsenne", enter(){ expEnter("Orsenne","orsenne"); S.flags.kadeB3=F("c5how")==="kade"; }, text:()=>`
<p>Five days to the Mirror. Two things you can do each day before the road takes you on.</p>`,
choices:()=>[{label:"Make camp.", go:"camp"}]},
c2d1:{ title:"Grey on the Water", text:()=>`
<p>Three days out from Freehaven, the sea goes grey in a patch the size of a town. The ship's crew go quiet. Fish float on it, belly up, and the grey water does not move with the waves.</p>
<p>${F("princessFriend")?`Elowen leans on the rail beside you. You have written to each other for twelve years, and somehow you don't know what to say in person. ${say(`"Can you hear it?"`)} she asks. You can. It sounds like someone trying very hard to remember a word.`:`Elowen leans on the rail at the other end of the ship and pretends you don't exist. Then she asks, without looking over: ${say(`"Can you hear it?"`)} You can. It sounds like someone trying very hard to remember a word.`}</p>`,
choices:()=>[
  {label:"Sing to the grey water, just a little.", hint:`Your first song · Song +1`, fx:{song:1, c2sangSea:true}, go:"nextday"},
  {label:"Ask Elowen what she hears.", hint:"Elowen ◆", fx:{aff_elowen:1}, go:"nextday"},
  {label:"Have the ship steer wide.", hint:"Safe", go:"nextday"}
]},
c2d2:{ title:"Orsenne", text:()=>`
<p>Orsenne is white domes on a red cliff, and half of it is black. Fourteen years ago the Sun Mirror on the hill above the city turned to face the sun and burned a third of Orsenne in an afternoon. They never rebuilt the burned quarter. They just left it, as a warning.</p>
<p>Yselde Moro meets you at the harbor, her hands still scarred, older now and the head of the Sun Council. ${say(`"Your ${HP()} promised to come,"`)} she says. ${say(`"I see ${P("sub")} sent someone better."`)} ${F("orsenne")==="taught"?`She looks at you closely. ${say(`"I learned to Listen from your ${HP()}, for one day, years ago. Let's see what you learned in nineteen years."`)}`:""}</p>`,
choices:()=>[
  {label:"Go to the burned quarter first.", hint:"Unity +2 · the people of Orsenne see you", fx:{unity:2, c2burned:true}, go:"nextday"},
  {label:"Speak to the Sun Council, who don't trust foreigners near the Mirror.", hint:EMP()?"They have heard about your parent's empire":"They have heard about the League", fx:EMP()?{}:{n_c2:1}, go:"nextday"},
  {label:"Go straight up the hill to look at the Mirror.", hint:"Scouting · the crisis goes better", fx:{n_c2:1}, go:"nextday"}
]},
c2d3:{ title:"The Grey Ring", enter(){ learnSong("waking"); }, text:()=>`
<p>The Mirror stands on a hill above the city: a disc of polished Elder bronze the height of four houses, tilted toward the sky. Around the bottom of the hill, in a perfect ring, the ground has gone grey. Things walk in the grey: Unmade goats, an Unmade shepherd, round and round the hill, slowly, like the hands of a clock.</p>
<p>Yselde gives you a fragment of an Elder tablet from the archive, the only one not burned. On it, in a script you have never seen and somehow can read, is a song. ${say(`"We think it's how they woke it,"`)} she says. ${say(`"We've never dared try."`)}</p>
${songSys()}`,
choices:()=>[
  {label:"Hum the new song under your breath, just to learn its shape.", hint:"Song +1", fx:{song:1}, go:"nextday"},
  {label:"Walk into the grey ring, carefully, with Elowen holding your hand.", hint:"Elowen ◆ · dangerous · you learn what the grey feels like", fx:{aff_elowen:1, n_c2:1, walkedGrey:true}, go:"nextday"}
]},
c2d4:{ title:"Elowen's Gift", text:()=>`
<p>${F("walkedGrey")?"Where you and Elowen walked into the grey yesterday,":"At the edge of the grey ring,"} something has happened. A line of green, no wider than a hand, runs into the grey from the edge: grass, clover, a single white flower. Growing where nothing can grow.</p>
<p>Elowen goes very still when she sees it. ${say(`"I didn't mean to,"`)} she says. ${say(`"It just happens. Anything I plant grows. Anywhere. My father calls it a gift. The Academy calls it Rootsinging, and they don't know what it's for."`)} She looks at the line of green in the grey. ${say(`"I think I know now."`)}</p>
${sys("ELOWEN",`[Rootsinger]<br>What she grows, the grey cannot unmake`)}`,
choices:()=>[
  {label:`"It's for this. You and me. I sing, you grow."`, hint:"Elowen ◆◆", fx:{aff_elowen:2, rootPlan:true, n_c2:1}, go:"nextday"},
  {label:"Kneel and touch the flower. It hums.", hint:"Song +1 · Elowen ◆", fx:{song:1, aff_elowen:1}, go:"nextday"}
]},
c2d5:{ title:"The Night Before the Mirror", text:()=>`
<p>The night before you go up the hill, nobody sleeps. Jory checks the ropes three times. Torin sits on the harbor wall throwing little sparks out over the water and watching them go out. ${say(`"If that Mirror turns toward you,"`)} he says, ${say(`"I'm standing in front of you. Fire against fire. Don't argue, cousin, I've already told your ${HP()} I would."`)} ${F("kadeB3")?"Kade tells a very long story about your "+HP()+" that may be true.":""} Yselde sits with you on the steps of the Sun Council's hall and tells you what the Mirror did fourteen years ago. She does not leave anything out.</p>
<p>${say(`"If it turns to the city again,"`)} she says, ${say(`"run. Don't be a hero. Your ${HP()} would never forgive me."`)}</p>`,
choices:()=>[
  {label:"Write to your parent, in case.", hint:"Trust +4", fx:{trust:4}, go:"nextday"},
  {label:"Practice until your throat aches.", hint:"Song +1", fx:{song:1}, go:"nextday"}
]},
c2c1:{ title:"The Sun Mirror", enter(){ crisisEnter(); S.flags.away=true; }, text:()=>`
<p>You go up the hill at dawn: you, Elowen, Jory, Torin, Yselde, and as many of Orsenne's people as will come, which is more than you expected. The grey ring is wider than yesterday. The Unmade are walking faster.</p>
<p>And as the sun comes up over the sea, the Mirror moves. A groan of bronze on stone. It is turning. Slowly, the way it turned fourteen years ago, toward the sun, and toward the city.</p>
${sys("CRISIS",`[The Sun Mirror]<br>It is waking · it is turning toward Orsenne`,"warn")}`,
choices:()=>[
  {label:"Run through the grey ring toward the Mirror, on Elowen's path of green.", hint:F("rootPlan")?"You planned this together":"She grows it as you run", fx:{n_c2:F("rootPlan")?2:1}, go:"c2c2"},
  {label:"Have Jory and the people of Orsenne rope the Mirror's frame to slow it.", hint:"Many hands", fx:{n_c2:1, roped:true}, go:"c2c2"},
  {label:"Torin: burn a firebreak between the hill and the city.", hint:"Torin ◆ · the city is safer", fx:{n_c2:2, aff_torin:1, firebreak:true}, go:"c2c2"},
  {label:`Sing ${SONG[firstSong()].n} from the edge, to calm it.`, hint:"Your first song", fx:{n_c2:S.stats.song>=11?2:1}, go:"c2c2"}
]},
c2c2:{ title:"The Burning Light", text:()=>`
<p>You reach the Mirror's base as the first light hits its face. It catches the sun and throws it, a white bar of heat that sweeps across the hillside and sets the dry grass burning, and moves, slowly, toward the white domes below.</p>
<p>You put both hands on the cold bronze and you hear it, under the groaning: the Mirror is frightened. It was asleep for a thousand years, woken once by people who didn't know what it was, and turned the wrong way. It doesn't want to burn. It doesn't know how to do anything else.</p>`,
choices:()=>[
  {label:"Sing the Song of Waking, all the way, so it wakes properly and can hear you.", hint:"The tablet's song · Song decides", fx:{n_c2:S.stats.song>=12?2:1, c2how:"wake"}, go:"c2c3"},
  {label:`Sing ${SONG[firstSong()].n}.`, hint:"The song you grew up with", fx:{n_c2:1, c2how:"first"}, go:"c2c3"},
  ...(F("roped")?[{label:"Shout to Jory: haul it round, toward the grey, not the city!", hint:"The ropes", fx:{n_c2:2, c2how:"rope"}, go:"c2c3"}]:[])
]},
c2c3:{ title:"Turning", text:()=>`
<p>${F("c2how")==="wake"?"The Mirror wakes all the way, and for a moment it is listening, the way a person listens when they are not sure who called their name.":F("c2how")==="rope"?"Forty people haul on the ropes and the Mirror's great frame groans round, a hand's width, then another.":"The Mirror slows. It does not stop."}</p>
<p>And you understand what it was for. Not burning. It was built to turn sunlight into a light the grey cannot cross. All you have to do is tell it which way to face.</p>`,
choices:()=>[
  {label:"Turn it to face the grey ring, and ask it to hold.", hint:"A seal-stone made of sunlight", fx:{n_c2:2, c2end:"seal"}, go:"c2c4"},
  {label:"Turn it to the sky, and let it sleep.", hint:"Safe · the grey stays", fx:{n_c2:1, c2end:"sleep"}, go:"c2c4"}
]},
c2c4:{ title:"Sunlight", enter(){ const o=outcome("c2"); S.flags.c2result=o; learnSong("holding"); if(o==="great"){ add({renown:5, unity:3, trust:4}); nation("orsenne").grey=0; } else if(o==="good") add({renown:3}); else add({morale:-1});
    if(nation("orsenne").stance==="neutral") setStance("orsenne","ally"); S.phase="open"; }, text:()=>`
<p>${F("c2end")==="seal"?`The Mirror turns, slowly, gently, until its face is toward the grey ring at the foot of the hill. It catches the sun and pours it down, not as fire, but as a gold light like late afternoon. Where the light touches the grey, the grey stops. Then, very slowly, it begins to go back to ordinary earth. The Unmade shepherd stops walking and sits down in the gold light and puts his face in his hands.`:`The Mirror turns its face to the empty sky and goes still. It will not burn again. The grey ring stays where it is, but it stops growing.`}</p>
<p>${({great:(F("firebreak")?"Torin's firebreak holds the burning grass off the city, and n":"N")+"ot a single house in Orsenne burned. Down in the city, people are coming out onto every roof to look up at the hill.",good:"The hillside burned, and two houses at the city's edge. Nobody died. Down in the city, people are coming out to look up at the hill.",hard:"The light reached the city's edge before it turned. A street burned. Yselde stands on the hillside with her scarred hands over her mouth, not crying, just very still."})[F("c2result")]}</p>
<p>When you take your hands off the bronze, there is a new song in your head. You don't know where it came from. The Mirror, maybe. It feels like a thank you.</p>
${songSys()}
${sys("CRISIS OVER",`[The Sun Mirror]<br>${F("c2end")==="seal"?"Turned into a seal: Orsenne's grey goes back":"Put to sleep"} · Orsenne joins ${EMP()?"your parent's side":"the League"} as an ally`)}`,
choices:()=>[{label:"Go down into the city.", go:"c2close"}]},
c2close:{ title:"Orsenne Remembers", text:()=>`
<p>Orsenne holds a feast for you in the burned quarter, among the black walls, because Yselde says that is where it belongs. Elowen plants a white rose in the ash of the old square. ${F("aff_elowen")>=3?"Afterward she kisses you, very quickly, on the cheek, and then walks away so fast she trips over a doorstep.":"Afterward she sits next to you on the steps, closer than she needs to."}</p>
<p>A letter is waiting for you at the harbor, from home, with a second one folded inside it from ${CHILD2()} that just says, in letters an inch high: ${say(`"I HEARD. OF COURSE YOU DID. SHOW OFF."`)} And under it, smaller: ${say(`"Proud of you. Don't tell anyone I said that."`)}</p>
<p>And the first one: ${S.stats.trust>=60?`In your ${HP()}'s handwriting: ${say(`"Everyone in the realm is talking about you. I'm talking about you most. Come home safe."`)}`:`In your ${HP()}'s handwriting, short: ${say(`"Well done. Come home."`)} You read it four times, looking for more.`}</p>`,
choices:()=>[{label:"End of Chapter Two.", go:"summary2"}]},
summary2: chapterSummary(2, ()=>`<p>${CHILD()} turned the Sun Mirror of Orsenne ${F("c2end")==="seal"?"from a weapon into a seal":"to the sky, and let it sleep"}. ${({great:"Orsenne didn't lose a single house.",good:"Orsenne lost little.",hard:"Orsenne lost a street."})[F("c2result")]} Elowen is a Rootsinger. And ${CHILD()} knows ${(S.heir.songs||[]).length} songs now.</p>`, "Chapter Three: Crown or Host", "c3open"),

/* ============================ CHAPTER THREE: CROWN OR HOST (the hero) ============================ */
c3open:{ title:"Crown or Host", enter(){ chapterEnter(3); }, text:()=>`
<p>You are ${N()} again, and the news from Orsenne reaches Brackenfold before your child does. ${F("c2result")==="hard"?"A street burned. Your child turned the Mirror anyway.":"Your child turned the Sun Mirror."} You read the letter in the Accord Hall in front of the whole council and do not quite manage to read the last line out loud.</p>
<p>${EMP()?`The Empire is three months old. Aurendell is a province${nation("clans").stance==="province"?", and the northern clans":""}. Every morning there is a pile of petitions on your desk from people you now rule and have never met. Marren reads them with you, and says, every morning, the same thing: ${say(`"This is how they all started. Every one of them."`)}`:`The League of the Arch is three months old: a one page charter and ${natCount("ally")} nations who signed it. Every morning there is an argument in the Accord Hall about who pays for what. Marren loves it. ${say(`"This is what freedom sounds like,"`)} she says. ${say(`"Unbearable."`)}`}</p>
${sys(EMP()?"THE EMPIRE":"THE LEAGUE",`[${EMP()?"Empire":"League"} works are open]<br>${EMP()?"Take pledges · build imperial roads and legion forts · raise the Imperial Palace":"Open embassies · build League fortresses · raise the Hall of the Arch"}<br>The Host: ${hostLine()}`)}`,
choices:()=>[{label:"Begin.", go:"c3days"}]},
c3days:{ title:"Four Days", enter(){ daysEnter(); }, text:()=>`<p>Four days of council, and then the Unmade come down from the north.</p>`, choices:()=>[{label:"Plan the first day.", go:"plan"}]},
c3d1:{ title:()=>EMP()?"The First Pledge":"The First Envoys", text:()=>`
${EMP()?`<p>King Corvin kneels in the Accord Hall to swear Aurendell to the Empire, formally, in front of everyone. He does it well. He has practiced. When he stands up he says, quietly, so only you can hear: ${say(`"My daughter writes to me that your child is extraordinary. I hope you know what you're doing."`)}</p>`
:`<p>You send the League's first envoys out on the first day: to the northern clans, to Saelmar, to Orsenne, and one, against Marren's advice, to Caradun. They carry the charter and a letter from you that says only: no one in the League rules anyone else, and everyone in it helps everyone else. Fen says it's the shortest treaty in history. Ostrow, if he were alive, would have hated it.</p>`}`,
choices:()=>EMP() ? [
  {label:"Raise Corvin up and seat him at your right hand.", hint:"Aurendell is content · Unity +3", fx:{unity:3, corvinSeat:true}, go:"nextday"},
  {label:"Ask Corvin's soldiers to man the legion forts.", hint:"Wardens +1,200 · Resentment +1", fx:{resent:1}, then:()=>{ hostAdd("wardens",4); }, go:"nextday"}
] : [
  {label:"Send Tamsin to Saelmar herself.", hint:"Ships +30", then:()=>{ hostAdd("ships",2); }, go:"nextday"},
  {label:"Go to the clans yourself.", hint:"The clans become allies if they weren't · Unity +2", fx:{unity:2}, then:()=>{ if(nation("clans").stance==="neutral") setStance("clans","ally"); }, go:"nextday"}
]},
c3d2:{ title:"A Letter from Orsenne", text:()=>`
<p>Your child's letter from Orsenne is four pages long. Three are about the Mirror, and the grey, and a girl from Aurendell who can grow flowers in it. The fourth page is about you.</p>
<p>${say(`"Everyone here asks me about ${EMP()?"the Empire":"the League"},"`)} ${CHILD()} writes. ${EMP()?say(`"I tell them you'll give it back when the grey is gone. You will, won't you?"`):say(`"I tell them it was the bravest thing I ever saw you do, saying no to a crown. I mean it."`)}</p>`,
choices:()=>EMP() ? [
  {label:`Write back: "I promise."`, hint:"Trust +6 · a promise you'll have to keep", fx:{trust:6, promisedReturn:true}, go:"nextday"},
  {label:`Write back: "When it's safe."`, hint:"Trust −4 · honest", fx:{trust:-4}, go:"nextday"}
] : [
  {label:"Write back four pages about the girl who grows flowers.", hint:"Trust +5", fx:{trust:5}, go:"nextday"},
  {label:"Write back one line: Come home soon.", hint:"Trust +2", fx:{trust:2}, go:"nextday"}
]},
c3d3:{ title:"The Mountains Are Forgetting", enter(){ if(!riftAt("northwatch")) openRift("northwatch",1); }, text:()=>`
<p>The chiefs of the northern clans come down to Northwatch with bad news: something is gathering at Kell, where the Lantern sleeps. Hundreds of Unmade, from the mountain villages, standing in the snow in a great ring, facing south. Not moving. Waiting.</p>
<p>${say(`"They're facing you,"`)} the eldest chief says. ${say(`"Whatever is in the grey wants what's under your bridge. And they're the road it will walk down."`)}</p>
<p>That night a rift opens under Northwatch itself.</p>`,
choices:()=>[
  {label:"Send the Host north, all of it, now.", hint:"The crisis goes better if the Host is strong", fx:{n_c3:hostPower()>=50?1:0, hostNorth:true}, go:"nextday"},
  {label:"Have the engineers fortify Northwatch's walls.", hint:`Engineers in the Host: ${hostFmt("engineers")}`, fx:{defense:3, n_c3:S.host.engineers>=8?1:0}, go:"nextday"}
]},
c3d4:{ title:"The Bench", text:()=>`
<p>Your father has read your child's letter from Orsenne so many times the paper is soft. He is on his bench when you come to say you're riding north.</p>
<p>${say(`"I have ruled things,"`)} he says, ${say(`"and I have been ruled. I can tell you which is harder. It's the first."`)} He looks up at you. ${EMP()?say(`"Be careful. Not of the grey. Of liking it."`):say(`"You said no to a crown. I was so proud I couldn't speak. I still can't, really. Go on."`)}</p>`,
choices:()=>[{label:"Kiss his forehead and ride.", hint:"Morale +2", fx:{morale:2}, go:"nextday"}]},
c3c1:{ title:"The Unmade at Northwatch", enter(){ crisisEnter(); }, text:()=>`
<p>They come down the mountain road on the fifth night: hundreds of Unmade, grey all through, walking in silence toward Northwatch, toward the river, toward the bridge. Behind them the snow goes grey as they pass.</p>
<p>The Host is on the walls. ${S.lv.northwatch>=4?"Northwatch is a city now, with Elder walls a horse can ride along.":"Northwatch is still small, and its walls are not what you would want."}</p>
${sys("CRISIS",`[The Unmade at Northwatch]<br>The Host: ${hostLine()}`,"warn")}`,
choices:()=>[
  {label:"Hold the road with the Host.", hint:`Strength ${hostPower()} · decides it`, fx:{n_c3:hostTest(80)}, go:"c3c2"},
  {label:"Have the Listeners hum them off the road, the way they did at the first rift.", hint:`Listeners: ${hostFmt("listeners")}`, fx:{n_c3:S.host.listeners>=10?2:1}, go:"c3c2"},
  {label:"Kneel in the road and hold the ground itself.", hint:"Keystone · Craft decides", fx:{n_c3:S.stats.craft>=34?2:1}, go:"c3c2"}
]},
c3c2:{ title:"The Wall", text:()=>`
<p>The Unmade don't fight. They just keep walking, and wherever they walk, the stone forgets it is a wall. The north gate of Northwatch crumbles to grey sand around them like a sandcastle in the tide.</p>`,
choices:()=>[
  {label:"Raise seal-stones across the gap, all night, with the engineers.", hint:`Engineers: ${hostFmt("engineers")} · Stone −20`, req:()=>S.stats.stone>=20, fx:{stone:-20, n_c3:S.host.engineers>=8?2:1}, go:"c3c3"},
  {label:"Fall back to the second wall, and let them through the first.", hint:"Safer · the town loses its north quarter", fx:{n_c3:1, fellBack:true}, go:"c3c3"},
  ...(has("lm:northwatch")?[{label:"Close the fortress gates: Elder concrete, built for exactly this.", hint:"Because you built the fortress of Northwatch", fx:{n_c3:3}, go:"c3c3"}]:[])
]},
c3c3:{ title:"The Song in the Letter", text:()=>`
<p>At dawn, a rider comes up the south road at a gallop with a letter from Orsenne. Your child's handwriting. Inside, written out in Elder script with a translation underneath: a song. ${say(`"For holding,"`)} the note says. ${say(`"In case you need it before I'm home. It doesn't have to be sung well. It just has to be sung."`)}</p>`,
choices:()=>[
  {label:"Have every Listener on the wall sing it, badly, all at once.", hint:"Trust +4 · the song works", fx:{n_c3:2, trust:4, sangLetter:true}, go:"c3c4"},
  {label:"Sing it yourself, alone, at the gap.", hint:"Trust +6 · Craft decides", fx:{n_c3:S.stats.craft>=34?2:1, trust:6, sangLetter:true}, go:"c3c4"}
]},
c3c4:{ title:"Morning at Northwatch", enter(){ const o=outcome("c3"); S.flags.c3result=o; if(o==="great"){ add({unity:5, renown:5}); S.rifts.northwatch=1; } else if(o==="good"){ add({renown:3}); S.rifts.northwatch=2; } else { add({morale:-3}); S.rifts.northwatch=3; if(S.lv.northwatch>2) S.lv.northwatch--; }
    if(nation("clans").stance==="neutral"&&o!=="hard") setStance("clans", EMP()?"province":"ally"); S.phase="open"; }, text:()=>`
<p>${F("sangLetter")?"The song works. Not beautifully. The Listeners are croaking and you are worse. But the grey hears it, and stops, and the Unmade at the front of the column stand still in the broken gateway, swaying, like people who have heard their name called from very far away.":""}</p>
<p>${({great:"Northwatch holds. By midday the Unmade have turned and walked back up the mountain, slowly, to wherever they came from. The north gate is gone. Nothing else is.",good:"Northwatch holds, but its north quarter is grey: forty houses, the granary, the old chapel. The Unmade turn back at noon.",hard:"Northwatch holds, barely. Half the town is grey. The Unmade turn back at noon, and nobody knows why."})[F("c3result")]}</p>
${sys("CRISIS OVER",`[Northwatch holds]<br>Rift at Northwatch: size ${riftAt("northwatch")} · the northern clans: ${STANCE_WORD[nation("clans").stance]}`)}`,
choices:()=>[{label:"Go home for the autumn.", go:"c3season"}]},
c3season:{ title:"Part Two: The Autumn Muster", enter(){ seasonEnter(); }, text:()=>`
<p>Five weeks of autumn, to build the ${EMP()?"Empire":"League"} and the Host before winter.</p>
${sys("AUTUMN",`Five weeks · three decisions a week · the council handles the rest · ${EMP()?"Empire":"League"} works, seal-stones and the Host are all on the build list<br>${nextTierText()}`)}`,
choices:()=>[{label:"Plan the first week.", go:"plan"}]},
c3w1:{ title:()=>EMP()?"The Provinces' Petitions":"The League Argues", text:()=>`
${EMP()?`<p>The first tribute from the provinces arrives in the first week, along with the first complaint: Aurendell's farmers say the tribute is too high, in a year when the grey is eating their fields.</p>`
:`<p>The League's first council meets in the first week and argues for nine hours about whether Saelmar's ships count as soldiers. Nobody agrees on anything except that the grey is coming, and that they will all stand together when it does, which, Marren points out, is the only thing that matters.</p>`}`,
choices:()=>EMP() ? [
  {label:"Halve the tribute for a year.", hint:"Unity +5 · Coin −10", fx:{unity:5, coin:-10, lightTribute:true}, go:"nextweek"},
  {label:"Keep it. The Empire needs it.", hint:"Coin +20 · Resentment +2", fx:{coin:20, resent:2}, go:"nextweek"}
] : [
  {label:"Agree that every nation sends what it can, and nobody counts.", hint:"Unity +5", fx:{unity:5}, go:"nextweek"},
  {label:"Write it all down, every promise, so nobody can back out.", hint:"Wardens +900 · Unity +1", fx:{unity:1}, then:()=>{ hostAdd("wardens",3); }, go:"nextweek"}
]},
c3w2:{ title:"The Unmade Remember", text:()=>`
<p>In the house of care, in the second week, one of the Unmade from the first rift wakes up. Tomas, the young shepherd. He sits up in his blanket and asks for water, and then asks what day it is, and then cries for an hour.</p>
<p>He says it was like being asleep in a room where someone was trying to remember him. ${say(`"It wasn't angry,"`)} he says. ${say(`"That's the thing I can't get over. It wasn't angry at all."`)}</p>`,
choices:()=>[
  {label:"Write to your child about it at once.", hint:"Trust +3 · Craft +1", fx:{trust:3, craft:1, tomasTold:true}, go:"nextweek"},
  {label:"Have the physicians try the holding song on the others.", hint:"Morale +3 · two more wake", fx:{morale:3}, go:"nextweek"}
]},
c3w3:{ title:"Ysolt's Envoy", text:()=>`
<p>An envoy comes from Caradun in the third week with a polite letter and a chest of gold. Empress Ysolt would like to buy the design of the seal-stones. She is having difficulty, she writes, with the grey in her colonies.</p>
<p>Your Listeners, who have been listening to Caradun's ships for a month, say the grey in her colonies is worst exactly where her three Elder relics are kept.</p>`,
choices:()=>[
  {label:"Give her the design for nothing. The grey is everyone's problem.", hint:"Unity +3 · Caradun warms", fx:{unity:3, sealGift:true}, go:"nextweek"},
  {label:"Sell it, and keep the gold.", hint:"Coin +30", fx:{coin:30, sealSold:true}, go:"nextweek"},
  {label:"Refuse, and ask her why her relics are where the grey is worst.", hint:"Caradun cools · you learn something", fx:{ysoltCold:true, askedRelics:true}, go:"nextweek"}
]},
c3w4:{ title:()=>`${CHILD2()} Wants In`, text:()=>`
<p>${CHILD2()} turns up at the engineers' lodge in the fourth week with ${C2("pos")} own tools and a list of improvements to the seal-stone design, nine of which are good. ${say(`"${CHILD()} gets to go to Orsenne and save a city,"`)} ${CHILD2()} says. ${say(`"I want to do something too."`)}</p>`,
choices:()=>[
  {label:`Let ${C2("obj")} join the engineers, with Fen watching.`, hint:"Engineers +500 · Morale +2", fx:{morale:2, sibEngineer:true}, then:()=>{ hostAdd("engineers",2); }, go:"nextweek"},
  {label:`Say ${C2("sub")}'s too young, and mean it kindly.`, hint:"Safer · this will matter later", fx:{sibRefused:true}, go:"nextweek"}
]},
c3w5:{ title:"Home for the Winter", text:()=>`
<p>Your child comes home in the fifth week on the Iron Way, and ${CHILD2()} runs the whole length of the Brackenfold platform and jumps on ${CP("obj")} before the train has properly stopped, and they both fall over, and Torin, getting down behind them, steps over them both and says ${say(`"Every time."`)} ${CHILD()} is browner, thinner, with a scar on one hand from the Mirror's bronze and a girl from Aurendell who will not stop looking at ${CP("obj")}.</p>
<p>At dinner, ${CHILD()} asks about ${EMP()?"the Empire":"the League"}, carefully, the way ${CP("pos")} grandfather taught ${CP("obj")} to ask questions at court. ${EMP()?say(`"How many provinces now?"`)+" "+CP("sub")+" asks. When you tell "+CP("obj")+", "+CP("sub")+" goes quiet.":say(`"Is it working?"`)+" "+CP("sub")+" asks. You say you don't know yet. "+CPc("sub")+" smiles, and says that's the right answer."}</p>`,
choices:()=>[
  {label:"Tell your child everything, the good and the bad.", hint:"Trust +5", fx:{trust:5}, go:"nextweek"},
  {label:"Change the subject to the girl from Aurendell.", hint:"Morale +2 · everyone laughs", fx:{morale:2}, go:"nextweek"}
]},
c3close:{ title:"The Spire Is Sinking", text:()=>`
<p>At the end of autumn, a letter comes from Highcrown, from the Academy of the Spire: the same Academy that ranked you worthless, thirty years ago, and sent you into exile.</p>
<p>The Spire is sinking. Under it, the old Elder college is filling with grey water, and the dome you mended in Book One is cracking again. The Academy has two hundred students inside. It asks, very politely, in a letter that must have been agony to write, for help. Not from you. From your child.</p>`,
choices:()=>[{label:"End of Chapter Three.", go:"summary3"}]},
summary3: chapterSummary(3, ()=>`<p>${EMP()?`The Empire has ${natCount("province")} province${natCount("province")===1?"":"s"}.`:`The League has ${natCount("ally")} allies.`} ${({great:"Northwatch held without losing a house.",good:"Northwatch held, and lost its north quarter.",hard:"Northwatch held, barely."})[F("c3result")]} An Unmade shepherd woke up and said the grey wasn't angry. And the Academy that exiled you is asking your child for help.</p>`, "Chapter Four: The Drowned College", "c4open"),

/* ============================ CHAPTER FOUR: THE DROWNED COLLEGE (the heir) ============================ */
c4open:{ title:"The Drowned College", enter(){ chapterEnter(4); }, text:()=>`
<p>You are ${CHILD()} again, on the road to Highcrown, in the snow. ${S.stats.trust>=60?`Your ${HP()} saw you off at the gate and said, ${say(`"Be kinder to them than they were to me. It will annoy them terribly."`)}`:`Your ${HP()} saw you off at the gate and didn't say much. You think ${P("sub")} didn't trust ${P("obj")}self to.`}</p>
<p>Highcrown is the city your ${HP()} grew up in and was sent away from. Your grandfather ruled half of it, once. You have heard about it your whole life and never seen it. And in the middle of it, the Spire, the great needle of the Academy, is leaning, very slightly, to the east.</p>`,
choices:()=>[{label:"Ride in through the North Gate.", go:"c4days"}]},
c4days:{ title:"Highcrown", enter(){ expEnter("Highcrown","aurendell"); }, text:()=>`<p>Five days before the dome gives way, the Academy's engineers say. They are not sure. They have never been sure about anything under the Spire.</p>`, choices:()=>[{label:"Make camp at House Valcrest.", go:"camp"}]},
c4d1:{ title:"House Valcrest", text:()=>`
<p>Your aunt Seren meets you at the gates of House Valcrest, grey at the temples now, still terrifying, and hugs you so hard your ribs creak. Torin, home with the Ember Guard, lights every candle in the hall at once to welcome you, and sets the curtains on fire, which is apparently a family tradition, and Seren beats them out with a cushion without even looking. And Ilsa comes down the stairs three at a time and announces that she is coming under the Spire with you, and that she has already packed, and that Seren has already said no, and that it doesn't matter.</p>
<p>Seren puts you in your ${HP()}'s old room. It is very small. There's a scratch on the window frame where someone measured their height, and stopped at sixteen.</p>`,
choices:()=>[
  {label:"Measure yourself against the scratch.", hint:"Trust +3 · you're taller", fx:{trust:3}, go:"nextday"},
  {label:"Ask Seren what your parent was like at sixteen.", hint:"She tells you everything · Song +1", fx:{song:1, serenTold:true}, go:"nextday"},
  {label:"Tell Seren Ilsa can come, if she stays at your side.", hint:"Ilsa ◆◆ · Seren gives in", fx:{aff_ilsa:2, ilsaSpire:true}, go:"nextday"}
]},
c4d2:{ title:"The Academy", text:()=>`
<p>The Archmagister of the Spire is Hale: the same frost mage who once called your ${HP()} a disgrace, old now, white as snow, with frost still forming on his sleeves when he's nervous. It is forming now.</p>
<p>${say(`"Your ${HP()} and I did not part well,"`)} he says. ${say(`"I was wrong about Artifice. I have been wrong about it publicly, in print, for twenty years, which has been very good for my character."`)} He looks at you. ${say(`"There are two hundred students under the Spire. The dome is failing. I would be grateful."`)}</p>`,
choices:()=>[
  {label:`"I'll help. Not for the Academy. For the students."`, hint:"Unity +2 · Hale nods, which costs him something", fx:{unity:2}, go:"nextday"},
  {label:`"My ${HP()} sends regards."`, hint:"He laughs, for the first time in years", fx:{n_c4:1, haleLaughed:true}, go:"nextday"}
]},
c4d3:{ title:"Grandfather's City", text:()=>`
<p>You walk Highcrown with Elowen on the third day: the court where your grandfather was feared, the market where your ${HP()} bought sweets, the square where the Stone Trial was held. Everywhere you go, people stop and look at you. Some of them bow. One old woman grabs your hand and says ${say(`"Edric's grandchild,"`)} and won't let go.</p>
<p>That night, in your coat, you find a letter you didn't know was there. In your grandfather's hand: ${say(`"For when you go to Highcrown."`)} He must have slipped it in before you left.</p>`,
choices:()=>[
  {label:"Read it now.", hint:"Grandfather's letter", fx:{edricHighcrown:true, trust:2}, go:"c4d3b"}
]},
c4d3b:{ title:"For When You Go to Highcrown", text:()=>`
<p>${say(`"You are in the city where I made the worst decision of my life. I want you to know that I have forgiven myself for it, mostly, because your ${HP()} forgave me first. That is the thing about Highcrown nobody tells you: it is only stone. It doesn't remember anything you don't make it remember. Go and make it remember something better. With love, Grandfather. P.S. The sweet shop on Lantern Street is still there. Your ${HP()} owes them money."`)}</p>`,
choices:()=>[{label:"Go to the sweet shop in the morning, and pay the debt.", hint:"Morale +2", fx:{morale:2}, go:"nextday"}]},
c4d4:{ title:"Under the Spire", enter(){ learnSong("mending"); }, text:()=>`
<p>You go down under the Spire on the fourth day with Jory, ${F("ilsaSpire")?"Ilsa, ":""}and a lamp. The old Elder college is down there, in the dark: lecture halls, a library, a great round hall under a dome your ${HP()} mended thirty years ago. Grey water stands knee deep in the corridors, and it is rising.</p>
<p>On the wall of the great hall, under the grey water line, there is a mural: Elders singing to a broken arch, and the arch knitting itself whole. Under it, a song, carved in the script you can read. You sing it under your breath, and a crack in the floor beside your feet closes like a healed cut.</p>
${songSys()}`,
choices:()=>[
  {label:"Map every crack in the dome with Jory.", hint:"Jory ◆ · the crisis goes better", fx:{aff_jory:1, n_c4:1}, go:"nextday"},
  {label:"Mend what you can, tonight, before it gets worse.", hint:"Song +1 · the crisis goes better", fx:{song:1, n_c4:1}, go:"nextday"}
]},
c4d5:{ title:"The King", text:()=>`
<p>King Corvin asks to see you on the fifth day. ${EMP()?"He is your parent's vassal now, which he wears like a coat that doesn't quite fit.":"He is your parent's ally, which he seems to find a relief."} He is kind to you, and careful, and he watches his daughter watching you the whole time.</p>
<p>At the end he says: ${say(`"Elowen tells me she intends to follow you into the grey wherever you go. I have told her she is a princess of Aurendell and has duties. She told me the grey doesn't care about duties."`)} He sighs. ${say(`"She's right, unfortunately. Look after her."`)}</p>`,
choices:()=>[
  {label:`"She looks after me, Your Majesty."`, hint:"Elowen ◆ · Corvin almost smiles", fx:{aff_elowen:1}, go:"nextday"},
  {label:`"With my life."`, hint:"Elowen ◆◆", fx:{aff_elowen:2}, go:"nextday"}
]},
c4c1:{ title:"The Drowned College", enter(){ crisisEnter(); }, text:()=>`
<p>The dome starts to go on the sixth morning, while the students are in the great hall for their examinations. You hear it from the street: a long groan through the stones of the whole city, and then the Spire above it shudders, and leans another hand's breadth east.</p>
<p>Two hundred students are under it. The stairs are flooding with grey water.</p>
${sys("CRISIS",`[The Drowned College]<br>The dome is failing · the grey water is rising · two hundred students`,"warn")}`,
choices:()=>[
  {label:"Sing the Song of Mending into the dome, from the floor of the hall.", hint:"Song decides", fx:{n_c4:S.stats.song>=14?2:1, c4how:"mend"}, go:"c4c2"},
  ...(knowsSong("holding")?[{label:"Sing the Song of Holding, and hold the whole dome up by yourself.", hint:"The Mirror's song", fx:{n_c4:2, c4how:"hold"}, go:"c4c2"}]:[]),
  {label:"Get the students out first, through the old drains Jory mapped.", hint:F("aff_jory")?"Jory knows the way":"Nobody knows the way", fx:{n_c4:F("aff_jory")?2:1, c4how:"out"}, go:"c4c2"},
  {label:"Torin: bring the Ember Guard and boil the grey water back down the stairs.", hint:"The cousins · Torin ◆", fx:{n_c4:2, aff_torin:1, c4how:"fire"}, go:"c4c2"}
]},
c4c2:{ title:"Grey Water", text:()=>`
<p>The dome holds, for now. But the grey water is still coming up the stairs, and where it touches the old Elder walls, they forget themselves and crumble.</p>
<p>Elowen is beside you, her hands in the water up to the wrists, and green is spreading out from her fingers through the grey: roots, moss, tiny white flowers, knitting the cracks in the wall shut from inside.</p>`,
choices:()=>[
  {label:"Sing with her: your mending, her roots.", hint:"Together · Elowen ◆", fx:{n_c4:2, aff_elowen:1, duet:true}, go:"c4c3"},
  {label:"Ask Hale to freeze the water on the stairs.", hint:F("haleLaughed")?"He'll do anything for you now":"He hesitates", fx:{n_c4:F("haleLaughed")?2:1, haleFroze:true}, go:"c4c3"}
]},
c4c3:{ title:"The Last Ones", text:()=>`
<p>${F("duet")?"Where your song and her roots meet, the wall doesn't just mend. It grows: living stone, veined with green, stronger than it was a thousand years ago.":F("haleFroze")?"Hale stands at the top of the stair with frost pouring off his sleeves, an old man doing the hardest thing he has ever done, and the grey water freezes solid in the stairwell.":""} The students are coming up, in twos and threes, soaked and white faced. The last dozen are trapped in the library on the far side of the hall.</p>`,
choices:()=>[
  {label:"Go across for them yourself.", hint:"Song decides", fx:{n_c4:S.stats.song>=13?2:1}, go:"c4c4"},
  {label:"Send Jory with a rope while you hold the dome.", hint:"Jory ◆", fx:{n_c4:1, aff_jory:1}, go:"c4c4"},
  {label:"Ilsa: a wind under the water, to lift them across.", hint:F("ilsaSpire")?"She's at your side · Ilsa ◆":"She's up in the street", fx:{n_c4:F("ilsaSpire")?2:1, aff_ilsa:1}, go:"c4c4"}
]},
c4c4:{ title:"The Spire Stands", enter(){ const o=outcome("c4"); S.flags.c4result=o; if(o==="great"){ add({renown:5, trust:3}); hostAdd("listeners",6); } else if(o==="good"){ add({renown:3}); hostAdd("listeners",4); } else { hostAdd("listeners",2); add({morale:-1}); } S.phase="open"; }, text:()=>`
<p>${({great:"All two hundred students come up into the snow. The Spire stops leaning. It doesn't straighten. You suspect it never will. But it stops.",good:"One hundred and ninety one students come up into the snow. The library is lost, and nine students with it, all alive but Unmade, staring at the falling snow.",hard:"The dome holds, and most of the students come out, but the old college is gone, drowned in grey, and the Spire leans like a broken tooth."})[F("c4result")]}</p>
<p>Archmagister Hale finds you in the snow afterward. He doesn't say anything for a long time. Then he takes off the silver chain of his office and hangs it around your neck. ${say(`"The Academy owes your family a debt,"`)} he says. ${say(`"It has for thirty years. Every Listener we have will answer to your ${HP()} now."`)}</p>
${sys("CRISIS OVER",`[The Spire stands]<br>The Academy's Listeners join the Host · Listeners ${hostFmt("listeners")}`)}`,
choices:()=>[{label:"Write home.", go:"c4close"}]},
c4close:{ title:"A Letter Home", text:()=>`
<p>Seren puts the four of you to bed in the old nursery at House Valcrest, as if you were small, and none of you objects.</p>
<p>You write to your ${HP()} that night from the room with the scratch on the window frame. You tell ${P("obj")} about the dome, and Hale, and the chain. You tell ${P("obj")} about the sweet shop.</p>
<p>Then you write something you didn't plan to: ${say(`"The grey isn't angry. I can hear it now, under everything. It sounds like it's looking for something it lost. I don't think we can fight it. I think we have to understand it."`)}</p>`,
choices:()=>[{label:"End of Chapter Four.", go:"summary4"}]},
summary4: chapterSummary(4, ()=>`<p>The Spire of Highcrown stands, ${({great:"with every student saved",good:"with nine students Unmade",hard:"leaning"})[F("c4result")]}. The Academy that exiled your ${HP()} now answers to ${P("obj")}. ${CHILD()} learned the Song of Mending, and stood in ${CP("pos")} grandfather's city, and made it remember something better.</p>`, "Chapter Five: The Empress of Caradun", "c5open"),

/* ============================ CHAPTER FIVE: THE EMPRESS OF CARADUN (the hero) ============================ */
c5open:{ title:"The Empress of Caradun", enter(){ chapterEnter(5); }, text:()=>`
<p>In the spring, the wine colored sails come up the coast: two hundred ships of Caradun, and in the middle of them a ship as big as a palace, with Empress Ysolt standing alone on its prow, three Elder relics humming on a chain at her throat.</p>
<p>The fleet anchors off Seagate, where the Realm Road meets the sea, and an envoy rows ashore with a letter. It is, like all her letters, beautiful. ${EMP()?say(`"One empire is enough for any world. I propose we decide which."`):say(`"I would join your League gladly. My price is a seat at the heart of it, under your bridge, with my hand on the crown beside yours."`)}</p>
${sys("CARADUN",`[Empress Ysolt]<br>Three Wonders of her own · two hundred ships · she wants the Elders' crown`)}`,
choices:()=>[{label:"Call the council.", go:"c5days"}]},
c5days:{ title:"Four Days", enter(){ daysEnter(); }, text:()=>`<p>Four days before her deadline. The Host: ${hostLine()}</p>`, choices:()=>[{label:"Plan the first day.", go:"plan"}]},
c5d1:{ title:"Ysolt's Terms", text:()=>`
<p>You meet Ysolt on a barge in the river mouth, halfway between her fleet and your shore. Up close she is younger than you thought, perhaps thirty, very calm, and very tired. The relics at her throat hum out of tune.</p>
<p>${say(`"The grey is in my colonies,"`)} she says. ${say(`"Six towns gone. I have three Wonders and I am using them as hard as I can, and it is not enough. You have the crown. Share it, or I will take it, and I will be sorry about it the whole time."`)}</p>
${F("askedRelics")||F("ysoltCold")?`<p>Your Listeners say the grey in her colonies is thickest exactly where she uses her relics. You don't think she knows.</p>`:""}`,
choices:()=>[
  {label:`"Your relics are making it worse. Stop using them, and I'll help you."`, hint:F("askedRelics")?"You've known for months":"A guess · Listeners decide", fx:{n_c5:F("askedRelics")||S.host.listeners>=14?2:1, toldYsolt:true}, go:"nextday"},
  {label:`"No one gets a hand on the crown. Not even me."`, hint:"Honest · she doesn't believe you", fx:{n_c5:0, ysoltRefused:true}, go:"nextday"},
