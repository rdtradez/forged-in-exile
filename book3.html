  ...(!EMP()?[{label:`"Join the League as an equal. No hand on the crown, but every hand helping."`, hint:"Unity decides", fx:{n_c5:S.stats.unity>=85?2:1, offeredLeague:true}, go:"nextday"}]:[])
]},
c5d2:{ title:"Tamsin's Fleet", text:()=>`
<p>Tamsin comes up the river in a cutter with her admiral's coat on, which she only wears when something is going to happen. She is sixty and walks with a stick and is the most dangerous person you know.</p>
<p>${say(`"Two hundred of hers,"`)} she says, looking at the wine colored sails. ${say(`"We have ${hostFmt("ships")}. I've had worse odds. Not many."`)}</p>`,
choices:()=>[
  {label:"Muster every ship in the realm, now.", hint:"Ships +60 · Coin −20 · Timber −20", req:()=>S.stats.coin>=20&&S.stats.timber>=20, fx:{coin:-20, timber:-20}, then:()=>{ hostAdd("ships",4); }, go:"nextday"},
  {label:"Ask Saelmar for its fleet.", hint:nation("saelmar").stance==="ally"||nation("saelmar").stance==="province"?"Saelmar stands with you":"Saelmar hesitates", fx:{}, then:()=>{ if(["ally","province"].includes(nation("saelmar").stance)) hostAdd("ships",6); }, go:"nextday"},
  {label:"Raise the Seagate harbor chain.", hint:"Stone −16 · Iron −8 · Defense +4", req:()=>S.stats.stone>=16&&S.stats.iron>=8, fx:{stone:-16, iron:-8, defense:4, chain5:true}, go:"nextday"}
]},
c5d3:{ title:"The Relics", text:()=>`
<p>Your Listeners spend the third night on the shore at Seagate with their hands on the rocks, listening to Ysolt's ship. In the morning they come back grey faced. The three relics at her throat are pieces of Wonders: a shard of a Tide Gate, a key from a Storm Engine, a lens from a Mirror. She has been using them to push the grey back from her colonies.</p>
<p>And every time she uses them, she tears the seal a little more. The grey in her colonies isn't spreading despite her. It is spreading because of her.</p>`,
choices:()=>[
  {label:"Send her the Listeners' report, every word.", hint:"Unity +2 · she may listen", fx:{unity:2, n_c5:1, sentReport:true}, go:"nextday"},
  {label:"Keep it, and use it if it comes to a fight.", hint:"Defense +2", fx:{defense:2}, go:"nextday"}
]},
c5d4:{ title:"A Letter from Your Child", text:()=>`
<p>A letter from ${CHILD()}, written in Highcrown: the dome, Hale, the sweet shop. And at the end: ${say(`"The grey isn't angry. I don't think we can fight it. I think we have to understand it."`)}</p>
<p>You read it on the shore at Seagate, looking at two hundred wine colored sails.</p>`,
choices:()=>[
  {label:"Think about what that means for Ysolt, too.", hint:"Trust +3 · something to try", fx:{trust:3, n_c5:1}, go:"nextday"},
  {label:"Fold it into your coat. One crisis at a time.", hint:"Defense +1", fx:{defense:1}, go:"nextday"}
]},
c5c1:{ title:"Battle at the River Mouth", enter(){ crisisEnter(); }, text:()=>`
<p>Ysolt's deadline passes at dawn. Her fleet comes in on the tide: two hundred ships under wine colored sails, in a crescent, toward Seagate and the mouth of the river, and the Realm Road, and the bridge.</p>
<p>Tamsin's ships go out to meet them. ${S.host.ships>=10?"There are a lot more of them than Ysolt expected.":"There are not nearly enough."}</p>
${sys("CRISIS",`[Battle at the River Mouth]<br>Ships: ${hostFmt("ships")} against two hundred`,"warn")}`,
choices:()=>[
  {label:"Let Tamsin fight it her way.", hint:`Ships decide · ${hostFmt("ships")}`, fx:{n_c5:S.host.ships>=12?2:S.host.ships>=6?1:0}, go:"c5c2"},
  ...(F("chain5")?[{label:"Raise the harbor chain the moment their lead ships are in.", hint:"You built it for this", fx:{n_c5:2}, go:"c5c2"}]:[]),
  {label:"Have the Listeners sing to the sea and turn the tide against them.", hint:`Listeners: ${hostFmt("listeners")}`, fx:{n_c5:S.host.listeners>=14?2:1}, go:"c5c2"}
]},
c5c2:{ title:"The Relic", text:()=>`
<p>Ysolt's great ship comes through the battle untouched. On its prow, she raises one of the relics, the shard of the Tide Gate, and the sea itself stands up: a wave as tall as a church, rolling toward Seagate.</p>
<p>And behind it, where the relic tore the sea, the water goes grey.</p>`,
choices:()=>[
  {label:"Run out along the Seagate arch and hold the wave with your hands on the stone.", hint:"Keystone · Craft decides", fx:{n_c5:S.stats.craft>=36?2:1}, go:"c5c3"},
  {label:"Raise seal-stones on the quay to catch the grey behind it.", hint:"Stone −20", req:()=>S.stats.stone>=20, fx:{stone:-20, n_c5:2}, go:"c5c3"}
]},
c5c3:{ title:"Ysolt", text:()=>`
<p>The wave breaks on the Seagate arch and falls back. The grey stays, a stain on the sea a mile wide, spreading. Ysolt stands on her prow, staring at it. ${F("sentReport")||F("toldYsolt")?"She knows. You can see her know it: that she did that, that she has been doing it for years.":"She doesn't understand what she's looking at."}</p>
<p>Her ship is beside the arch now. You could reach her.</p>`,
choices:()=>[
  {label:"Board her ship and take the relics.", hint:"Fast · she will hate you for it", fx:{n_c5:2, c5end:"take"}, go:"c5c4"},
  {label:`Call out to her: "You can't fight it. Neither can I. Help me understand it."`, hint:F("sentReport")||F("toldYsolt")?"She might listen now":"Unlikely", fx:{n_c5:F("sentReport")||F("toldYsolt")?2:0, c5end:"talk"}, go:"c5c4"},
  {label:"Let her go. Her fleet is broken.", hint:"She'll be back", fx:{n_c5:1, c5end:"go"}, go:"c5c4"}
]},
c5c4:{ title:"The Grey Sea", enter(){ const o=outcome("c5"); S.flags.c5result=o; openRift("seagate", o==="great"?1:2);
    const e=F("c5end"); if(e==="talk"&&o!=="hard"){ setStance("caradun", EMP()?"rival":"ally"); if(!EMP()) add({unity:4}); } else if(e==="take"){ setStance("caradun","rival"); S.flags.relics=true; add({craft:2}); } else setStance("caradun","rival");
    nation("caradun").grey=Math.min(5,(nation("caradun").grey||0)+(e==="take"?0:1)); if(o==="great") add({renown:6}); else if(o==="hard") add({morale:-3}); S.phase="open"; }, text:()=>`
<p>${({take:"You go over the rail with a squad of Wardens behind you, and the fight on Ysolt's deck is very short. You come back with the three relics in your fist, humming out of tune against your palm. Ysolt watches you go. She says nothing at all.",talk:F("sentReport")||F("toldYsolt")?"Ysolt takes the chain from her throat and holds it out over the water. Her hand is shaking. "+say(`"Show me,"`)+" she says. "+say(`"Show me how to stop."`):"Ysolt laughs at you, not unkindly, and turns her ship for the open sea.",go:"You let her go. Her fleet limps south under its wine colored sails, half of it burning."})[F("c5end")||"go"]}</p>
<p>${({great:"Seagate stands. Tamsin's ships come home with flags flying.",good:"Seagate stands, but its harbor is grey, and the sea beyond it.",hard:"Seagate stands, barely. Tamsin's flagship doesn't come home. Tamsin does, on a borrowed boat, and doesn't speak for two days."})[F("c5result")]}</p>
${sys("CRISIS OVER",`[The river mouth holds]<br>Caradun: ${STANCE_WORD[nation("caradun").stance]}${F("relics")?" · you hold three Elder relics":""}`)}`,
choices:()=>[{label:"Go home for the spring.", go:"c5season"}]},
c5season:{ title:"Part Two: The Spring of Ships", enter(){ seasonEnter(); }, text:()=>`<p>Five weeks of spring, with grey on the sea.</p>${sys("SPRING",`Five weeks · three decisions a week · the council handles the rest<br>${nextTierText()}`)}`, choices:()=>[{label:"Plan the first week.", go:"plan"}]},
c5w1:{ title:"Prisoners of the Sea", text:()=>`
<p>Four hundred sailors of Caradun are in the realm, fished out of the river mouth after the battle. They are frightened and far from home and most of them have family in the colonies where the grey is.</p>`,
choices:()=>[
  {label:"Send them home, with seal-stone plans for their colonies.", hint:"Unity +3 · Caradun softens", fx:{unity:3}, then:()=>{ if(nation("caradun").stance==="rival") setStance("caradun","neutral"); }, go:"nextweek"},
  {label:"Offer them places in the Host.", hint:"Ships +45 · Wardens +600", then:()=>{ hostAdd("ships",3); hostAdd("wardens",2); }, go:"nextweek"}
]},
c5w2:{ title:"The Grey at Sea", enter(){ const opts=["gullhaven","saltford","freehaven"].filter(k=>S.lv[k]>0&&!riftAt(k)); if(opts.length) openRift(opts[0],1); }, text:()=>`
<p>The grey stain on the sea off Seagate spreads along the coast in the second week. Fishing boats come home empty. ${riftList().filter(k=>["gullhaven","saltford","freehaven"].includes(k)).map(k=>SITES[k].name).join(" and ")||"The coast"} starts to go grey at the tideline.</p>`,
choices:()=>[
  {label:"Build seal-stones along the whole coast.", hint:"Stone −30 · closes one coastal rift", req:()=>S.stats.stone>=30, fx:{stone:-30}, then:()=>{ const k=riftList().find(x=>["gullhaven","saltford","freehaven","seagate"].includes(x)); if(k) sealRift(k); }, go:"nextweek"},
  {label:"Feed the fishing towns from the national stores.", hint:"Grain −30 · Unity +4", req:()=>S.stats.grain>=30, fx:{grain:-30, unity:4}, go:"nextweek"},
  {label:"Post Listeners on the coast and wait for spring.", hint:"Nothing spent · Morale −1", fx:{morale:-1}, go:"nextweek"}
]},
c5w3:{ title:()=>EMP()?"The Empire's Price":"The League's Burden", text:()=>`
${EMP()?`<p>In the third week, Orsenne refuses to send its tribute. ${CHILD()} saved their city, their council writes, not the Empire, and they would like to thank ${CP("obj")} directly, by not paying you.</p>`
:`<p>In the third week, the League's council asks you to pay for half of Saelmar's lost ships. Nobody counted, as you agreed. Now everyone is counting.</p>`}`,
choices:()=>EMP() ? [
  {label:"Let it go. They earned it.", hint:"Unity +4 · Resentment −1", fx:{unity:4, resent:-1}, go:"nextweek"},
  {label:"Send a legion to collect.", hint:"Coin +20 · Resentment +3 · your child will hear", fx:{coin:20, resent:3, trust:-6, legionOrsenne:true}, go:"nextweek"}
] : [
  {label:"Pay it. The League is worth it.", hint:"Coin −30 · Unity +5", req:()=>S.stats.coin>=30, fx:{coin:-30, unity:5}, go:"nextweek"},
  {label:"Ask every nation to pay a share.", hint:"Unity +1 · a long argument", fx:{unity:1}, go:"nextweek"}
]},
c5w4:{ title:()=>`${CHILD2()}'s Invention`, text:()=>`
<p>${CHILD2()} comes into your workshop in the fourth week with something wrapped in a cloth, and won't look at you. It is a seal-stone. A small one, the size of a loaf of bread, that folds out into a ring of nine leaning stones when you pull a pin. A seal-stone you can carry.</p>
<p>${say(`"I know it's not singing,"`)} ${CHILD2()} says. ${say(`"I just thought it might help."`)}</p>`,
choices:()=>[
  {label:"Tell your child it's the best thing anyone in the family has built in ten years. Mean it.", hint:"Seal-stones cost less from now on · Morale +3", fx:{morale:3, sibPraised:true, cheapSeals:true}, go:"nextweek"},
  {label:"Take it apart together to see how it works.", hint:"Seal-stones cost less from now on · Craft +1", fx:{craft:1, cheapSeals:true}, go:"nextweek"}
]},
c5w5:{ title:"A Letter from the Ashlands", text:()=>`
<p>In the fifth week, ${CHILD()} comes home from Highcrown, and leaves again almost at once. There is a cult in the Ashlands, beyond the northern mountains, a country already half grey, that worships the Undertow. The Hollow Court, they call themselves. Their leader, Mother Vey, has been sending letters across the border. To young people. To people with new kinds of magic.</p>
<p>${CHILD()} wants to go and see. ${F("sibRefused")?`And ${CHILD2()}, you notice later, has been very quiet since you said ${C2s()} was too young for the engineers.`:`And ${CHILD2()} has been getting letters too.`}</p>`,
choices:()=>[
  {label:`Let ${CHILD()} go, with Kade's ship and Elowen and Jory.`, hint:"Trust +4", fx:{trust:4}, go:"nextweek"},
  {label:`Ask ${CHILD2()} about the letters.`, hint:"The answer matters in Chapter Six", fx:{askedSib:true}, go:"nextweek"}
]},
c5close:{ title:"An Empty Bed", text:()=>`
<p>The morning after ${CHILD()} leaves for the Ashlands, ${CHILD2()}'s bed is empty.</p>
<p>${F("askedSib")?`${C2s().charAt(0).toUpperCase()+C2s().slice(1)} left a note this time, on the kitchen table: ${say(`"Mother Vey says there's a way to close the grey from up here, so nobody has to go down under the world. I'm going to learn it. Don't send anyone. I'll be fine. I love you."`)}`:`There is a note on the kitchen table: ${say(`"Gone to find a way to close it from up here. Don't send anyone. I love you."`)} And on the floor under the bed, a letter on grey paper, signed with a hollow circle: ${say(`"Come and see what your kind of magic could do."`)}`}</p>
<p>${SPN()?`${SPN()} reads it standing in the doorway, and then goes very white, and then very calm, which is worse.`:"You read it standing in the doorway."} Your eldest is already three days ahead, on the same road.</p>`,
choices:()=>[{label:"End of Chapter Five.", go:"summary5"}]},
summary5: chapterSummary(5, ()=>`<p>Empress Ysolt came with two hundred ships and ${F("c5end")==="talk"&&F("c5result")!=="hard"?"left asking how to stop":F("c5end")==="take"?"left without her relics":"left with half her fleet burning"}. The sea is grey off Seagate. ${CHILD2()} built a seal-stone you can carry. And ${CHILD2()} is gone, toward the Hollow Court, three days behind ${CHILD()}.</p>`, "Chapter Six: The Hollow Court", "c6open")
});

const CPc2 = () => { const w=C2s(); return w.charAt(0).toUpperCase()+w.slice(1); };
/* ================================================================
   BOOK THREE, CHAPTERS SIX TO NINE
   ================================================================ */
CH[6].acts = {
  listenNight:{label:"Lie awake and listen to the grey", hint:"Hear what the Hollow says · the crisis goes better", max:2, title:"Listening", fx:()=>({n_c6:1, heardHollow:1}),
    text:()=>`<p>You lie awake with your palm flat on the grey ground outside the tent. At first there is nothing. Then, very faint, under everything, something like a voice trying to make a word out of a sound it has never made before. It isn't saying anything to you. It's just saying. Over and over.</p>`}
};
CH[8].acts = {
  askHollow:{label:"Put your hand on the grey and ask it a question", hint:"The Hollow answers · Song +1", max:2, title:"A Question", fx:()=>({song:1, asked:1}),
    text:()=>`<p>You ask it what it wants. The answer isn't words. It's a feeling, the way you feel a bridge want to hold or a wall want to fall: a reaching. Like a hand in the dark, feeling for a shape it's never touched.</p>`},
  plant:{label:"Help Elowen plant something in the grey", hint:"Elowen ◆ · a little green below the world", max:2, title:"Planting", fx:()=>({aff_elowen:1, planted:1}),
    text:()=>`<p>Elowen kneels and presses an acorn into the grey. You sing to it, softly, the way you'd sing to a child. By the time you stand up there is an oak sapling as tall as your knee, the only green thing for a hundred miles in any direction, and the grey around it has gone still, as if it's watching.</p>`}
};
CH[8].comps=["elowen","wren","sib"];
Object.assign(SCENES, {
/* ============================ CHAPTER SIX: THE HOLLOW COURT (the heir) ============================ */
c6open:{ title:"The Hollow Court", enter(){ chapterEnter(6); }, text:()=>`
<p>You are ${CHILD()}, and you are three days into the Ashlands when the letter catches up with you, carried by a relay rider who looks as if he hasn't slept. It's from your ${HP()}, and the handwriting is not steady: ${CHILD2()} is gone. ${CPc2()} left a note on your bed, not anyone else's. It says: ${say(`"I know how to make it so you don't have to go down there. Back soon. Don't be cross. ${SIBNICK()}."`)}</p>
<p>You read it four times. Then you hand it to Torin, who reads it once and goes very quiet, and the fire in the camp stove goes out on its own.</p>
<p>The Ashlands are a country already half grey. Whole hills of it, ash colored and silent. And people live here, in villages on the green islands between the grey, and they don't seem afraid. They seem peaceful. That frightens you more than anything.</p>
<p>${say(`"A young one came through on a steam carriage,"`)} says a woman at the first village, when you ask. ${say(`"Built it themselves, they said. Asking the way to the Court. Came of their own free will,"`)} she adds. ${say(`"Everyone does. Mother Vey doesn't take anyone. She just tells them the truth."`)}</p>`,
choices:()=>[
  {label:"Ride for the Court.", hint:"Fast", fx:{n_c6:1}, go:"c6days"},
  {label:"Ask the woman what truth.", hint:"Learn what Vey teaches", fx:{veyTeaching:true}, go:"c6days"}
]},
c6days:{ title:"The Ashlands", enter(){ expEnter("the Ashlands","ashlands"); }, text:()=>`
<p>${F("veyTeaching")?`${say(`"That the world is a mistake,"`)} the woman says, gently. ${say(`"That it was never finished, and it hurts, and the grey is how it rests. Mother Vey says we can rest too."`)}`:""}</p>
<p>Five days to the Hollow Court. Torin says he isn't going home without ${CHILD2()}, and says it the way other people say the sun will come up. Ilsa is riding to meet you from Highcrown, as fast as a wind can carry a horse.</p>`,
choices:()=>[{label:"Make camp.", go:"camp"}]},
c6d1:{ title:"The Grey Country", text:()=>`
<p>You pass a village that has gone grey all the way through. The people are still in it. They sit in their doorways in the ash colored afternoon, Unmade, perfectly still, with their faces turned toward the north.</p>
<p>Jory throws up behind a wall. Torin stands in the village square and lights every lantern in it, one after another, as if light might help. It doesn't. Elowen kneels and plants a seed in the grey at the village gate, and it grows, a single sunflower, and every Unmade face in the village turns, very slowly, toward it.</p>`,
choices:()=>[
  {label:"Sing to them. Just in case.", hint:"Song +1", fx:{song:1}, go:"nextday"},
  {label:"Write down every face, so someone can find them later.", hint:"Unity +2", fx:{unity:2}, go:"nextday"}
]},
c6d2:{ title:"An Invitation", text:()=>`
<p>Ilsa catches up with you at noon on a horse that is mostly foam, with the wind still roaring behind her. She slides off and grabs your arm. ${say(`"I know why ${SIBNICK()} went,"`)} she says. ${say(`"We found an Elder journal in the Academy archive. It says a Cantor has to go down under the world to finish it. That's you. Then a letter came from Mother Vey, saying Artificers can close the grey from this side, so nobody has to go down. ${CHILD2()} went to learn how. For you. I was supposed to go too. I overslept."`)} Her face crumples. ${say(`"I overslept."`)}</p>
<p>A girl in grey robes meets you on the road on the second day with a letter, sealed with a hollow circle. It is addressed to you by name.</p>
<p>${say(`"Your sibling is with us, and safe, and welcome. So are you. Come and hear what we have to say. If you still want to leave afterward, you may, and you may take ${CHILD2()} with you, if ${C2s()} wants to go."`)} It is signed: Mother Vey.</p>`,
choices:()=>[
  {label:"Accept the invitation. Walk in the front door.", hint:"Openly · Vey respects it", fx:{c6way:"front", n_c6:1}, go:"nextday"},
  {label:"Accept, but have Kade's crew ready on the river.", hint:F("kadeB3")?"Kade is good at this":"Saelmar sailors will do it", fx:{c6way:"both", n_c6:1}, go:"nextday"},
  {label:"Go in secretly, by night.", hint:"Risky · you'll see what she doesn't want you to", fx:{c6way:"sneak"}, go:"nextday"}
]},
c6d3:{ title:"The Court", enter(){ learnSong("sleeping"); }, text:()=>`
<p>The Hollow Court is a cathedral built of grey: an Elder hall that was swallowed by the Undertow a thousand years ago and is still standing, every stone gone soft and colorless, and a thousand people living in it.</p>
<p>Mother Vey is old, and kind, with eyes gone pale as if the grey had got into them. She gives you tea. ${say(`"Your ${HP()} is a builder,"`)} she says. ${say(`"Builders think everything broken should be mended. But some things were never whole to begin with. The world was never finished, child. It hurts. The grey is how it rests."`)}</p>
<p>That evening you hear her singing to the Unmade in the great hall: a lullaby, very old, in the Elder tongue. It's the most beautiful thing you've ever heard. When it ends you realize you know it.</p>
${songSys()}`,
choices:()=>[
  {label:`"It isn't resting. It's reaching for something."`, hint:"You've heard it · Vey goes quiet", fx:{n_c6:F("heardHollow")?2:1, toldVey:true}, go:"nextday"},
  {label:"Listen to her. All of it. Understand her first.", hint:"Song +1 · she trusts you", fx:{song:1, veyTrust:true}, go:"nextday"}
]},
c6d4:{ title:()=>CHILD2(), text:()=>`
<p>You find ${CHILD2()} on the fourth day, in a workshop at the back of the Court, bent over a ring of grey stones with a notebook, a steam lamp, and the look ${C2s()} gets when something is nearly working. ${CPc2()} doesn't look up when you come in. Then ${C2s()} does, and drops the notebook, and is across the room and holding on to you before either of you has said a word.</p>
<p>${say(`"I read the journal,"`)} ${CHILD2()} says into your coat. ${say(`"A Cantor goes down under the world. That's you. It's always you. You held the Velm dam and everybody cheered and I was sick for a week. Mother Vey says my kind of magic can close the door from up here. If I learn how, you don't have to go down. Somebody has to close the doors. I wanted it to be me."`)}</p>`,
choices:()=>[
  {label:`"You built a seal-stone you can carry. Nobody else in the world could do that. We do this together, or not at all."`, hint:F("sibPraised")?"Your parent told "+C2("obj")+" so too":"Sibling ◆◆", fx:{aff_sib:2, n_c6:F("sibPraised")?2:1}, go:"nextday"},
  {label:`"I've been jealous of you my whole life. You can fix anything. I can only ask nicely."`, hint:"Sibling ◆◆◆", fx:{aff_sib:3, n_c6:1}, go:"nextday"},
  {label:`"${SIBNICK()}. You don't get to trade yourself for me. That's my job. I'm the eldest."`, hint:"Sibling ◆◆ · Trust +2", fx:{aff_sib:2, trust:2}, go:"nextday"}
]},
c6d5:{ title:"The Night Before the Grey Mass", text:()=>`
<p>Tomorrow is the grey mass: once a year, Mother Vey opens a rift in the great hall, and those who want to rest walk into it. ${CHILD2()} has been asked to close the doors behind them. ${F("aff_sib")>=3?CHILD2()+" says "+C2s()+" doesn't want to anymore. But "+C2s()+" promised.":CHILD2()+" says "+C2s()+" promised, and will."}</p>`,
choices:()=>[
  {label:"Plan with all of them: Elowen's roots in the floor, Jory's rope at the door, Torin and Ilsa at the edge.", hint:"The crisis goes better", fx:{n_c6:2, cousinsPlan:true}, go:"nextday"},
  {label:"Go to Vey and ask her not to do it.", hint:F("veyTrust")?"She trusts you":"She won't", fx:{n_c6:F("veyTrust")?2:0}, go:"nextday"}
]},
c6c1:{ title:"The Grey Mass", enter(){ crisisEnter(); }, text:()=>`
<p>The great hall at midnight: a thousand people in grey robes, singing Vey's lullaby, and in the middle of the floor a circle of old Elder stones. Vey lays her hands on them. The grey in the circle deepens and opens like an eye, and the people at the front walk toward it, calmly, smiling.</p>
<p>${CHILD2()} stands at the edge of the circle with ${C2("pos")} hands on the stones, ready to close it behind them.</p>
${sys("CRISIS",`[The Grey Mass]<br>A rift is open in the Hollow Court · ${CHILD2()} is at its edge`,"warn")}`,
choices:()=>[
  {label:"Sing the Song of Holding, and hold the rift from opening wider.", hint:knowsSong("holding")?"You know it":"You only half know it", fx:{n_c6:knowsSong("holding")?2:1}, go:"c6c2"},
  {label:"Sing Vey's own lullaby back to the grey, the Song of Sleeping.", hint:"The song she gave you", fx:{n_c6:S.stats.song>=16?2:1, sangSleep:true}, go:"c6c2"},
  ...(F("c6way")==="both"?[{label:"Signal the crew on the river to come in.", hint:"Kade's people", fx:{n_c6:1, crewIn:true}, go:"c6c2"}]:[])
]},
c6c2:{ title:"The Voice", text:()=>`
<p>The rift shudders. And then Mother Vey's mouth opens and something else speaks with it, in a voice like wind through an empty house:</p>
<p>${say(`"WHERE"`)}</p>
<p>The whole hall goes silent. Vey's pale eyes are wide and frightened. She has served the grey for forty years. It has never spoken.</p>
<p>${say(`"WHERE IS THE REST OF ME"`)}</p>`,
choices:()=>[
  {label:"Answer it. Sing the Song of Asking: what are you?", hint:knowsSong("asking")?"Your first song":"You improvise", fx:{n_c6:knowsSong("asking")||F("heardHollow")?2:1, askedIt:true}, go:"c6c3"},
  {label:`Shout to ${CHILD2()}: close it now!`, hint:"Fast", fx:{n_c6:1}, go:"c6c3"}
]},
c6c3:{ title:CHILD2, text:()=>`
<p>${F("askedIt")?"The voice hears you. For one moment you feel it turn toward you, enormous and lost, like a child in a crowd who has just heard their name. Then it pulls, hard, and the rift lurches open":"The rift lurches open"}, and ${CHILD2()} is at its edge, and the grey is around ${C2("pos")} ankles.</p>`,
choices:()=>[
  ...(F("cheapSeals")?[{label:`"The seal-stone! The one you built!"`, hint:`${CHILD2()} built it for exactly this`, fx:{n_c6:3, sibSaved:"self"}, go:"c6c4"}]:[]),
  {label:"Run in after your sibling.", hint:"Song decides", fx:{n_c6:S.stats.song>=16?2:1, sibSaved:"you"}, go:"c6c4"},
  {label:"Elowen: roots, now, everywhere!", hint:"Elowen", fx:{n_c6:(F("aff_elowen")||0)>=4?2:1, sibSaved:"elowen"}, go:"c6c4"},
  {label:"Ilsa! Wind! Torin, grab the rope!", hint:F("cousinsPlan")?"You planned for this":"The cousins", fx:{n_c6:F("cousinsPlan")?3:1, sibSaved:"cousins"}, go:"c6c4"}
]},
c6c4:{ title:"Closing the Door", enter(){ const o=outcome("c6"); S.flags.c6result=o; if(o==="great") add({trust:6, renown:4}); else if(o==="good") add({trust:3}); else add({trust:-2, morale:-2}); nation("ashlands").grey=Math.max(0,nation("ashlands").grey-(o==="hard"?0:1)); S.phase="open"; }, text:()=>`
<p>${({self:`${CHILD2()} pulls the pin on the little seal-stone at ${C2("pos")} belt and throws it at ${C2("pos")} own feet. It unfolds into a ring of nine leaning stones, and the grey around ${C2("pos")} ankles stops, and goes back, and ${CHILD2()} steps out of it shaking and laughing and furious all at once.`,you:`You go in up to the knees. The grey is cold and it makes you forget, for a moment, what your hands are for. Then you have your sibling's wrist, and you pull, and you both fall backward onto the stone floor of the hall.`,elowen:`Green explodes up through the floor of the Hollow Court: roots, vines, a whole meadow in an instant, and ${CHILD2()} is lifted out of the grey on a living carpet of moss.`,
cousins:`Ilsa throws both arms out and a wind comes through the Hollow Court like a slammed door, straight into the rift, and holds the grey back for three heartbeats. Torin wraps Jory's rope twice round his wrist and goes in after ${CHILD2()} without a single word, burning so bright the grey can't see him, and hauls ${C2("obj")} out by the collar, and falls over backward with ${C2("obj")} on top of him, laughing like an idiot.`})[F("sibSaved")||"you"]}</p>
<p>${({great:`The rift closes. In the silence afterward, Mother Vey sits down on the floor and puts her face in her hands. ${say(`"It spoke,"`)} she says. ${say(`"Forty years. I thought it wanted us to rest. It wants something else."`)}`,good:`The rift closes. Mother Vey is gone in the confusion, and half the Court with her, out into the grey country.`,hard:`The rift closes, but not before forty of the Court's people walked into it. Mother Vey is gone. ${CHILD2()} won't speak for a whole day.`})[F("c6result")]}</p>
${sys("CRISIS OVER",`[The Grey Mass]<br>${CHILD2()} is safe · the Hollow has spoken`)}`,
choices:()=>[{label:"Take your sibling home.", go:"c6close"}]},
c6close:{ title:"The Road Home", text:()=>`
<p>${CHILD2()} rides behind you on the way home, arms around your waist, and doesn't say anything for two days. On the third day, ${C2s()} says, into your back: ${say(`"Don't tell them I was stupid."`)}</p>
<p>${say(`"You weren't stupid,"`)} you say. ${say(`"You were trying to save me. That's the least stupid thing anyone's ever done. Don't ever do it again."`)} A pause. ${say(`"Also you were lonely. So was it."`)}</p>
<p>Behind you, Ilsa and Torin are arguing about who gets to tell the story at home. Jory says nobody does, and then tells it himself, badly, to the first innkeeper you meet.</p>
<p>When you ride into Brackenfold, your ${HP()} is waiting at the gate, and doesn't say anything at all, and holds the two of you so tight that ${CHILD2()} squeaks.</p>
<p>${F("c6result")==="great"?"And behind you, Mother Vey follows at a distance, on foot, alone. She wants to understand what she heard. So do you.":""}</p>`,
choices:()=>[{label:"End of Chapter Six.", go:"summary6"}]},
summary6: chapterSummary(6, ()=>`<p>${CHILD()} went into the Hollow Court and brought ${CHILD2()} home. And the Undertow spoke for the first time in a thousand years: ${say(`"Where is the rest of me?"`)}</p>`, "Chapter Seven: The Breaking", "c7open"),

/* ============================ CHAPTER SEVEN: THE BREAKING (the hero) ============================ */
c7open:{ title:"The Breaking", enter(){ chapterEnter(7); openRift("over",2); }, text:()=>`
<p>You are ${N()}, and both your children are home, and for nine days in the autumn everything is almost ordinary. ${CHILD2()} sleeps for most of them. ${CHILD()} tells you what the grey said, and you don't sleep at all.</p>
<p>On the tenth morning the river runs grey under the Bridge of Two Banks.</p>
<p>You go down to the island with Fen and your eldest, and you see it: the heart, the great stone under the third pier, the keystone of the whole Elder crown, has a crack in it as long as a man. Grey is coming up through the crack like smoke. ${F("book2end")==="living"?"You feel it in your own chest, like a cracked rib.":""}</p>
${sys("THE BREAKING",`[The heart is cracked]<br>Grey is rising in the middle of the realm`,"warn")}`,
choices:()=>[{label:"Call everyone.", go:"c7days"}]},
c7days:{ title:"Four Days", enter(){ daysEnter(); }, text:()=>`<p>Four days. Wren says the crack will open all the way in four days.</p>`, choices:()=>[{label:"Plan the first day.", go:"plan"}]},
c7d1:{ title:"Wren's Truth", text:()=>`
<p>${F("ending")==="keeper"?"Wren's voice comes up through the floor of the island, louder than you've ever heard it, from the Storm Engine fifty miles away":"Wren comes to the island and sits down on the wet stone beside the heart"}. ${say(`"I told you the Elders built the Wonders to keep the Undertow down,"`)} Wren says. ${say(`"That's true. I didn't tell you that they made the Undertow first. Not on purpose. They were building a world. They ran out of time. What they didn't finish is down there, under everything, and it has been trying to finish itself for a thousand years."`)}</p>`,
choices:()=>[
  {label:`"Can it be finished?"`, hint:"Wren doesn't answer · your child does", fx:{trust:3, askedFinish:true}, go:"nextday"},
  {label:`"Can it be stopped?"`, hint:"Wren says yes · forever", fx:{askedSeal:true}, go:"nextday"}
]},
c7d2:{ title:"Lord Edric", text:()=>`
<p>Your father asks for you on the second day. Not urgently. He is on his bench by the stone rose, in a blanket, in the thin autumn sun. He has been very tired for a week.</p>
<p>${say(`"I would like to tell you something before I forget,"`)} he says. ${say(`"Not because I'm going to die. Though I am. Because I am ninety one and I keep forgetting things, and I don't want to forget this."`)} He takes your hand. His is very light. ${say(`"I was wrong about you. I have said so for twenty years and I want to say it once more, properly, with nothing else going on. You were never worthless. I was a coward. You were brave. That's all. Go and mend your bridge."`)}</p>
<p>He gives you a letter, sealed with the Valcrest signet. On the front: ${say(`"For the end. You'll know when."`)}</p>`,
choices:()=>[
  {label:"Stay. The bridge can wait an hour.", hint:"Morale +3", fx:{morale:3, edricStayed:true}, go:"c7d2b"},
  {label:"Call your children, and your partner, to the bench.", hint:"Trust +5", fx:{trust:5, edricFamily:true}, go:"c7d2b"}
]},
c7d2b:{ title:"The Bench", enter(){ S.flags.edricFarewell=true; S.flags.fatherHere=false; }, text:()=>`
<p>${F("edricFamily")?`They come: ${CHILD()}, ${CHILD2()}${SPN()?", "+SPN():""}, Bren on two sticks. ${CHILD()} sits on the grass at ${CP("pos")} grandfather's feet and sings, very softly, the miller and the moon, the lullaby he used to sing badly. He corrects ${CP("pos")} pitch, once, and smiles.`:`You sit with him while the sun moves across the lawn. He talks about Highcrown, and your mother, and a horse he had when he was nine. Then he stops talking, and you just hold his hand.`}</p>
<p>Lord Edric Valcrest dies in the early afternoon, on his bench, in the sun, by the stone rose your child grew for him. The rose closes, in the middle of the day, for the first time since it was made. And every stone in the garden hums, very softly, for a long time.</p>
${sys("FAMILY",`[Lord Edric Valcrest]<br>Father · Grandfather · the last Lord of Highcrown to learn to sneeze on command`)}`,
choices:()=>[{label:"Bury him in his garden, by the rose, where he wanted to be.", hint:"Morale +2", fx:{morale:2}, go:"nextday"}]},
c7d3:{ title:"Two Days", text:()=>`
<p>There is no time to grieve properly, and you grieve anyway. The crack in the heart widens. Brackenfold's oldest street, the one you mended the first week you were exiled, goes grey at one end.</p>
<p>${CHILD()} finds you on the island at night with your hands on the heart. ${say(`"Let me help,"`)} ${CP("sub")} says. ${say(`"I can hold it with you. I've done it before. Not this big, but I've done it."`)}</p>`,
choices:()=>[
  {label:`"Yes. Together."`, hint:"Trust +6 · the crisis goes better", fx:{trust:6, n_c7:1, heirHolds:true}, go:"nextday"},
  {label:`"No. I need you safe."`, hint:"Trust −6", fx:{trust:-6}, go:"nextday"}
]},
c7d4:{ title:"The Evacuation", text:()=>`
<p>You order Brackenfold evacuated on the fourth day: forty thousand people, out along the paved roads to every other city in the realm. It goes better than it should, because every road is paved and every city has room.</p>`,
choices:()=>[
  {label:"Send them to the refuges in the great cities.", hint:has("refuges")?"You built them":"There aren't any yet", fx:{n_c7:has("refuges")?2:1, unity:2}, go:"nextday"},
  {label:"Send them down the Realm Road to Seagate and Freehaven.", hint:"Far from the heart", fx:{n_c7:1}, go:"nextday"}
]},
c7c1:{ title:"The Breaking", enter(){ crisisEnter(); openRift("brack",2); }, text:()=>`
<p>The heart breaks open at midnight on the fifth day.</p>
<p>It isn't loud. A sound like a held breath let out. And then grey pours up out of the island under the bridge like water from a spring, and runs out through the streets of Brackenfold, and everything it touches stops.</p>
${sys("CRISIS",`[The Breaking]<br>The heart is open · Brackenfold is going grey · the Host: ${hostLine()}`,"warn")}`,
choices:()=>[
  {label:"Have the Host hold the streets while the last people get out.", hint:`Strength ${hostPower()}`, fx:{n_c7:hostTest(120)}, go:"c7c2"},
  {label:"Raise seal-stones in a ring around the island, with the engineers.", hint:`Engineers ${hostFmt("engineers")} · Stone −30`, req:()=>S.stats.stone>=30, fx:{stone:-30, n_c7:S.host.engineers>=12?2:1}, go:"c7c2"},
  {label:"Go straight to the heart.", hint:"Keystone · Craft decides", fx:{n_c7:S.stats.craft>=40?2:1}, go:"c7c2"}
]},
c7c2:{ title:"The Heart", text:()=>`
<p>You kneel at the heart with both hands on the crack, the way you knelt on the bridge on the day of the Vote, and you hold.</p>
<p>It's the heaviest thing you've ever held. It isn't a bridge. It isn't a wall. It's the whole Elder crown, every Wonder in the world leaning on this one stone, and the thing under it pushing up.</p>`,
choices:()=>[
  ...(F("heirHolds")?[{label:`Reach out your hand to ${CHILD()}.`, hint:"Together", fx:{n_c7:3, held7:"together"}, go:"c7c3"}]:[]),
  {label:"Hold it alone.", hint:"Craft decides", fx:{n_c7:S.stats.craft>=42?2:1, held7:"alone"}, go:"c7c3"}
]},
c7c3:{ title:"Holding", text:()=>`
<p>${F("held7")==="together"?`${CHILD()} kneels beside you and puts ${CP("pos")} hands on the stone next to yours and sings: the Song of Holding, the one ${CP("sub")} sent you in a letter. You feel it come through the stone: not strength, exactly. Company. The crack stops widening.`:"You hold it alone. You don't know for how long. Hours. The crack stops widening, and then you can't feel your hands."}</p>`,
choices:()=>[{label:"Hold until morning.", go:"c7c4"}]},
c7c4:{ title:"Morning in Brackenfold", enter(){ const o=outcome("c7"); S.flags.c7result=o; S.rifts.brack = o==="great"?1:o==="good"?2:3; if(o==="hard"){ add({morale:-4, unity:-4}); } else add({renown:4}); S.phase="open"; }, text:()=>`
<p>${({great:"By morning the heart is still cracked, but it holds. The grey in the streets stops at the market square. Brackenfold is half empty and very quiet, and still standing.",good:"By morning the heart holds, and a third of Brackenfold is grey: the old quarter, the market, the street you mended the first week. The Accord Hall stands.",hard:"By morning the heart holds, and half of Brackenfold is grey. The manor is untouched, on its hill. Your father's grave is untouched. Almost nothing else is."})[F("c7result")]}</p>
${sys("CRISIS OVER",`[The heart holds, for now]<br>Rift at Brackenfold: size ${riftAt("brack")}`)}`,
choices:()=>[{label:"Go up to the Accord Hall.", go:"c7path"}]},
c7path:{ title:()=>EMP()?"The Crown, Again":"The Crown, Again", text:()=>`
${EMP()?`<p>The provinces' envoys meet you in the Accord Hall, grey dust on their boots. Corvin speaks for them. ${say(`"The Empire held the line,"`)} he says. ${say(`"But the people are asking whether they'll ever have their own countries back. Your child has been asking too."`)}</p><p>This is the moment. You could give the provinces back now: keep them as allies, not subjects. Or you could keep the Empire until the end.</p>`
:`<p>The League's envoys meet you in the Accord Hall, grey dust on their boots. Corvin speaks for them. ${say(`"We argued for three days about who should send what while Brackenfold went grey,"`)} he says. ${say(`"We can't do that again. Take the crown. Just until the end."`)}</p><p>This is the moment. You could take the crown now. Or keep the League, arguing and free, until the end.</p>`}`,
choices:()=>EMP() ? [
  {label:"Give the provinces back. Let them be allies.", hint:"The League path from now on · Unity +8 · Trust +10 · Resentment −3", fx:{path:"league", unity:8, trust:10, resent:-3, switched:true}, then:()=>{ Object.keys(NATIONS).forEach(k=>{ if(nation(k).stance==="province") setStance(k,"ally"); }); }, go:"c7season"},
  {label:"Keep the Empire, until the end.", hint:"Stay on the Empire path · Trust −5", fx:{trust:-5}, go:"c7season"}
] : [
  {label:"Take the crown, until the end.", hint:"The Empire path from now on · Renown +8 · Trust −10", fx:{path:"empire", renown:8, trust:-10, switched:true}, then:()=>{ Object.keys(NATIONS).forEach(k=>{ if(nation(k).stance==="ally") setStance(k,"province"); }); }, go:"c7season"},
  {label:"Keep the League. Argue faster.", hint:"Stay on the League path · Trust +5 · Unity +3", fx:{trust:5, unity:3}, go:"c7season"}
]},
c7season:{ title:"Part Two: After the Breaking", enter(){ seasonEnter(); }, text:()=>`
<p>${F("switched")?(EMP()?"The Empire begins in grief and grey dust.":"The provinces go home as allies, and some of them weep."):""} Five weeks to rebuild what can be rebuilt.</p>
${sys("AUTUMN",`Five weeks · three decisions a week · the council handles the rest · the refuges can be built now<br>${nextTierText()}`)}`,
choices:()=>[{label:"Plan the first week.", go:"plan"}]},
c7w1:{ title:"His Bench", text:()=>`
<p>You go to your father's bench in the first week, for the first time since. The stone rose has opened again. Somebody has left a book on the bench, about bridges, with a pressed flower in it. You don't ask who.</p>`,
choices:()=>[
  {label:"Sit for a while.", hint:"Morale +3", fx:{morale:3}, go:"nextweek"},
  {label:`Open the letter he gave you.`, hint:"No · it says for the end · you put it back", fx:{morale:1}, go:"nextweek"}
]},
c7w2:{ title:"The Whispering", text:()=>`
<p>In the second week the Listeners start hearing it everywhere: under the grey in Brackenfold, under the rifts, under the ordinary ground. One word, over and over, the same one the Hollow said through Mother Vey. Rest. Or rest of. They can't tell which.</p>
<p>${F("c6result")==="great"?"Mother Vey comes to Brackenfold that week, alone, and asks to listen with them. She sits with her hands on the grey for three days, and then says: "+say(`"It's not rest. It's rest of. The rest of it. It wants the rest of itself."`):""}</p>`,
choices:()=>[
  {label:"Set every Listener in the realm to write down what they hear.", hint:"Craft +2", fx:{craft:2}, go:"nextweek"},
  {label:"Ask your child what it means.", hint:"Trust +4", fx:{trust:4}, go:"nextweek"}
]},
c7w3:{ title:"Ysolt's Letter", text:()=>`
<p>A letter from Empress Ysolt in the third week. ${nation("caradun").stance==="ally"?"She writes as a friend now":"She writes as she always has, beautifully"}: Caradun's colonies are gone. All six. Grey from shore to shore. ${F("relics")?"She asks, without much hope, for her relics back.":F("c5end")==="talk"?"She has put her relics away, as you showed her. The grey grew more slowly after that. Not slowly enough.":"She has used her relics every day to hold it back, and it has not been enough."}</p>`,
choices:()=>[
  {label:"Send Caradun seal-stones, and engineers to raise them.", hint:"Engineers −500 · Caradun warms", fx:{}, then:()=>{ hostAdd("engineers",-2); if(nation("caradun").stance==="rival") setStance("caradun","neutral"); else if(nation("caradun").stance==="neutral") setStance("caradun","ally"); }, go:"nextweek"},
  ...(F("relics")?[{label:"Send her relics back, with a warning.", hint:"Caradun becomes neutral · Craft −2", fx:{craft:-2, relics:false}, then:()=>{ setStance("caradun","neutral"); }, go:"nextweek"}]:[]),
  {label:"Offer her people a place in the refuges.", hint:"Unity +3 · Grain −20", req:()=>S.stats.grain>=20, fx:{unity:3, grain:-20}, go:"nextweek"}
]},
c7w4:{ title:"Your Child Asks", text:()=>`
<p>${CHILD()} asks in the fourth week, in your study, standing very straight. ${say(`"I want to go down,"`)} ${CP("sub")} says. ${say(`"Through the crack. Into it. Wren says there's a whole unfinished world down there. I think I'm the only one who can hear what it wants, and I think we need to know before we decide what to do with it."`)}</p>`,
choices:()=>[
  {label:`"Go. Come back."`, hint:"Trust +8", fx:{trust:8, c8start:"blessing"}, go:"nextweek"},
  {label:`"Not without me."`, hint:"Trust +2 · you can't go: you're holding the heart · your child goes anyway, with your blessing", fx:{trust:2, c8start:"worried"}, go:"nextweek"},
  {label:`"No. Absolutely not."`, hint:"Trust −10 · your child goes anyway", fx:{trust:-10, c8start:"ran"}, go:"nextweek"}
]},
c7w5:{ title:"The Descent", text:()=>`
<p>On the last day of autumn, ${CHILD()} goes down into the crack under the bridge on a rope, with Elowen beside ${CP("obj")} and Wren ${F("ending")==="keeper"?"speaking through a Listener's stone":"going first"}. And ${CHILD2()}, who walked into your study the night before and said: ${say(`"We do it together or not at all. That's the rule now. ${CHILD()} made it, at the Hollow Court."`)} ${CHILD()} didn't argue. Torin and Ilsa and Jory stand at the top of the crack with the rope party, and Torin keeps a fire going on the island all night, so there'll be a light to climb toward. You hold the rope. You hold the heart. You hold everything you can.</p>
<p>${CPc("sub")} looks up once, at the bottom of the light, and waves. ${CHILD2()} waves too, with both arms, like an idiot, on purpose, to make you laugh. Then the grey closes over them both.</p>`,
choices:()=>[{label:"Keep holding.", go:"nextweek"}]},
c7close:{ title:"Waiting", text:()=>`<p>You sleep on the island that night, with your hand on the rope. It doesn't move. It doesn't go slack. Somewhere below, both your children are walking in a world nobody finished.</p>`, choices:()=>[{label:"End of Chapter Seven.", go:"summary7"}]},
summary7: chapterSummary(7, ()=>`<p>The heart under the bridge broke, and held. ${({great:"Brackenfold stands.",good:"A third of Brackenfold is grey.",hard:"Half of Brackenfold is grey."})[F("c7result")]} Lord Edric Valcrest died on his bench, in the sun. ${F("switched")?`And you changed your path: ${EMP()?"you took the crown":"you gave the provinces back"}.`:`You kept your path: ${EMP()?"the Empire":"the League"}.`} ${CHILD()} and ${CHILD2()} have gone below, together.</p>`, "Chapter Eight: Below", "c8open"),

/* ============================ CHAPTER EIGHT: BELOW (the heir) ============================ */
c8open:{ title:"Below", enter(){ chapterEnter(8); S.flags.wentBelow=true; }, text:()=>`
<p>You are ${CHILD()}, and you are standing in a world nobody finished.</p>
<p>Below the crack, below the grey, there is light: a pale even light from nowhere, like the inside of a cloud. Mountains stand around you, half made: their tops are perfect, carved stone, and their bottoms trail off into grey thread. A river runs across a plain and stops in midair, a glassy edge of water, going nowhere. There is Elder scaffolding everywhere, on everything, gone grey with a thousand years.</p>
<p>${CHILD2()} turns slowly on the spot with ${C2("pos")} mouth open, looking at the scaffolds. ${say(`"Somebody built this,"`)} ${C2s()} whispers. ${say(`"Somebody built the scaffolds for a world."`)}</p>
<p>${say(`"This is what they were building,"`)} Wren says softly. ${say(`"A second world. Under the first one. For when the first one wore out. They ran out of time."`)}</p>`,
choices:()=>[{label:"Walk.", go:"c8days"}]},
c8days:{ title:"The Unfinished Land", enter(){ expEnter("the Undertow", null); }, text:()=>`<p>Four days. Wren isn't sure days work the same way down here.</p>`, choices:()=>[{label:"Make camp.", go:"camp"}]},
c8d1:{ title:"The Scaffolds", text:()=>`
<p>You climb the Elder scaffolding on the first day, up the side of a half made mountain, and at the top you find their camp: tents gone grey, tools laid out, a cold hearth, a table with a plan on it, weighted down with stones. A world, drawn out in lines, with notes in the margins. Most of the notes say the same thing: not yet, not yet, not yet.</p>`,
choices:()=>[
  {label:"Read the notes, all of them.", hint:"Song +1 · Craft +1", fx:{song:1, craft:1, readNotes:true}, go:"nextday"},
  {label:"Take the plan.", hint:"For your parent · Trust +3", fx:{trust:3, tookPlan:true}, go:"nextday"},
  {label:`Let ${CHILD2()} study the scaffolds: how they hold up something that isn't there.`, hint:"Sibling ◆ · the crisis goes better", fx:{aff_sib:1, n_c8:1, sibScaffold:true}, go:"nextday"}
]},
c8d2:{ title:"The Last Elder", text:()=>`
<p>At the bottom of the camp there is a journal, and a grave: a cairn of stones with a mason's square scratched on the top. The journal is the last Elder's. You read it by the pale light, Elowen reading over your shoulder.</p>
<p>${say(`"The others have gone up. They are going to build the Wonders, to hold this place shut while it sleeps, until someone comes who can finish it. A Keystone to hold it still, and a Cantor to sing it into being. They say it will be a thousand years. I am staying. Someone should keep it company."`)}</p>`,
choices:()=>[
  {label:"Add a stone to the cairn.", hint:"Trust +2 · Song +1", fx:{trust:2, song:1}, go:"nextday"},
  {label:"Read it aloud to the grey, so it hears.", hint:"The crisis goes better", fx:{n_c8:2}, go:"nextday"}
]},
c8d3:{ title:"The Hollow", text:()=>`
<p>On the third day the grey speaks to you. Not through anyone. Directly: the ground, the air, the half made mountains, all at once, the way a whole cathedral hums when you sing one note.</p>
<p>${say(`"YOU CAN HEAR ME"`)}</p>
<p>It isn't a monster. You understand that all at once, with your whole body. It's a world, half made, alone in the dark for a thousand years, reaching up toward the light it can feel above it. Everything it touches it tries to understand, and it doesn't know how to understand anything except by taking it apart. It isn't eating the world above. It's trying to learn what a world is.</p>
<p>${say(`"WHERE IS THE REST OF ME"`)}</p>`,
choices:()=>[
  {label:`"It was never made. I'm sorry."`, hint:"The truth", fx:{n_c8:1, toldTruth:true}, go:"nextday"},
  {label:`"Up there. In the plans. In me."`, hint:"A promise you might keep", fx:{n_c8:2, promisedFinish:true}, go:"nextday"}
]},
c8d4:{ title:"Half a Song", text:()=>`
<p>On the last page of the Elder's journal there is a song, and it stops halfway. The Song of Finishing. The song a Cantor would sing to make this place real: mountains whole, rivers running, ground that stays ground. Underneath, in a hand that shakes: ${say(`"The rest is in the Deep Library. I could not remember it alone. It needs more than one voice."`)}</p>`,
choices:()=>[
  {label:"Learn the half that's here.", hint:"Song +2", fx:{song:2, halfSong:true}, go:"nextday"},
  {label:"Sing the half that's here, out loud, to the grey.", hint:"Something answers", fx:{song:1, n_c8:1, sangHalf:true}, go:"nextday"}
]},
c8c1:{ title:"Don't Go", enter(){ crisisEnter(); }, text:()=>`
<p>When you turn back toward the crack, the grey doesn't want you to go.</p>
<p>It isn't angry. It's like a child holding your sleeve. The ground goes soft under your feet. The way back, the long rope of light up to the crack, starts to fade. ${say(`"STAY,"`)} it says, from everywhere. ${say(`"STAY. YOU ARE THE ONLY ONE WHO HEARS."`)}</p>
${sys("CRISIS",`[Below]<br>The way back is closing`,"warn")}`,
choices:()=>[
  {label:"Sing the Song of Holding, and hold the way open.", hint:knowsSong("holding")?"You know it":"You half know it", fx:{n_c8:knowsSong("holding")&&S.stats.song>=19?2:1}, go:"c8c2"},
  {label:"Sing it the Song of Sleeping, gently, so it lets go.", hint:knowsSong("sleeping")?"Vey's lullaby":"You don't know it", req:()=>knowsSong("sleeping"), fx:{n_c8:2}, go:"c8c2"},
  {label:"Run.", hint:"Fast", fx:{n_c8:0}, go:"c8c2"}
]},
c8c2:{ title:"Roots", text:()=>`
<p>Elowen drops to her knees and buries both hands in the grey, and a road of green comes up out of it ahead of you: moss and clover and white flowers, a path the grey can't unmake, running toward the light.</p>
<p>${say(`"Go,"`)} she says. ${say(`"I'll be right behind you. I'll be right behind you."`)} She isn't moving.</p>`,
choices:()=>[
  {label:"Pick her up and carry her.", hint:"Elowen ◆◆", fx:{n_c8:(F("aff_elowen")||0)>=5?2:1, aff_elowen:2}, go:"c8c3"},
  {label:"Sing with her, so her roots grow faster.", hint:"Together", fx:{n_c8:2, aff_elowen:1}, go:"c8c3"},
  {label:`${SIBNICK()}: a scaffold, like the Elders' ones, under her road!`, hint:F("sibScaffold")?`${CHILD2()} studied how they hold`:"Sibling", fx:{n_c8:F("sibScaffold")?3:1, aff_sib:1, sibBelow:true}, go:"c8c3"}
]},
c8c3:{ title:"A Promise", text:()=>`
<p>At the bottom of the rope, with the crack above you and the grey all around, it speaks one more time. Very quietly. ${say(`"WILL YOU COME BACK"`)}</p>`,
choices:()=>[
  {label:`"Yes. I'll come back and finish you."`, hint:"A promise to finish it", fx:{n_c8:2, hollowPromise:"finish"}, go:"c8c4"},
  {label:`"Yes. I'll come back and help you sleep."`, hint:"A promise to seal it", fx:{n_c8:1, hollowPromise:"sleep"}, go:"c8c4"},
  {label:`"I don't know."`, hint:"The truth", fx:{n_c8:1, hollowPromise:"unknown"}, go:"c8c4"}
]},
c8c4:{ title:"Up", enter(){ const o=outcome("c8"); S.flags.c8result=o; if(o==="great") add({song:2, trust:3}); else if(o==="hard") add({morale:-2}); S.phase="open"; }, text:()=>`
<p>${F("sibBelow")?`${CHILD2()} builds a scaffold of folding seal-stones under Elowen's green road as fast as you can walk it, leaning each one on the next, the way the Elders did, and the road holds. `:""}You come up out of the crack into the grey morning on the island, with ${CHILD2()} gripping the back of your coat the whole last climb, and your ${HP()} is there, on the stone, with the rope wrapped around both arms and ${P("pos")} hands raw. ${P("sub").charAt(0).toUpperCase()+P("sub").slice(1)} hasn't let go in four days.</p>
<p>${({great:"Elowen comes up behind you, laughing, with moss in her hair.",good:"Elowen comes up behind you, white and silent, and sleeps for a day.",hard:"Elowen comes up behind you, and her left hand is grey to the wrist, and she can't feel it."})[F("c8result")]}</p>
${sys("CRISIS OVER",`[You came back]<br>You know what the Undertow is · you know half the Song of Finishing · you promised: ${({finish:"to finish it",sleep:"to help it sleep",unknown:"nothing"})[F("hollowPromise")]}`)}`,
choices:()=>[{label:`Tell your ${HP()} everything.`, go:"c8close"}]},
c8close:{ title:"What It Is", text:()=>`
<p>You tell ${P("obj")} everything, on the island, in the grey morning: the half made mountains, the river that stops in midair, the last Elder's grave, the voice. ${F("tookPlan")?"You give "+P("obj")+" the plan.":""} You tell ${P("obj")} what you promised.</p>
<p>Your ${HP()} listens to all of it without a word. When you're finished, ${P("sub")} says, very slowly: ${say(`"So it could be finished. Or it could be closed forever."`)} And you both know, in that moment, that you don't agree on which.</p>`,
choices:()=>[{label:"End of Chapter Eight.", go:"summary8"}]},
summary8: chapterSummary(8, ()=>`<p>${CHILD()} went below and came back. The Undertow is the unfinished world, alone for a thousand years, trying to learn what a world is by taking one apart. Half of the Song of Finishing is in ${CP("pos")} head. The other half is in the Deep Library. And ${CHILD()} made it a promise.</p>`, "Chapter Nine: The Grey Winter", "c9open"),

/* ============================ CHAPTER NINE: THE GREY WINTER (the hero) ============================ */
c9open:{ title:"The Grey Winter", enter(){ chapterEnter(9); ["aurendell","clans","ashlands","caradun"].forEach(k=>{ nation(k).grey=Math.min(5,(nation(k).grey||0)+1); }); if(nation("ashlands").grey>=4) setStance("ashlands","lost");
    const opts=alive().filter(k=>!riftAt(k)&&k!=="brack"); for(let i=0;i<2&&opts.length;i++) openRift(opts.splice(Math.floor(Math.random()*opts.length),1)[0],1); }, text:()=>`
<p>You are ${N()}, and in the winter, the snow comes down grey.</p>
<p>Not everywhere. In patches, drifting down out of an ordinary white sky, and where it settles, the ground forgets itself. In Aurendell, in the clan country, in the Ashlands, which are ${nation("ashlands").stance==="lost"?"gone now, all of them":"almost gone"}, and in Caradun's colonies across the sea. The world is going grey at the edges.</p>
<p>And the refugees come: across the river, down the Realm Road, off ships at Seagate and Freehaven. Tens of thousands. To ${RN()}, because it is the only place in the world with seal-stones, and Listeners, and a Keystone.</p>
${sys("THE GREY WINTER",`[Refugees from three kingdoms]<br>New rifts have opened · grain will be the hardest thing`,"warn")}`,
choices:()=>[{label:"Open the gates.", go:"c9days"}]},
c9days:{ title:"Four Days", enter(){ daysEnter(); S.flags.winter=true; }, text:()=>`<p>Four days of grey snow.</p>`, choices:()=>[{label:"Plan the first day.", go:"plan"}]},
c9d1:{ title:"Refugees at the Bridge", text:()=>`
<p>Twenty thousand people are camped on both banks by the first morning, in the snow, waiting. Clan families with their sheep. Aurendell farmers. Caradun sailors with their whole families on their backs. A choir of children from the Ashlands, singing to keep warm.</p>`,
choices:()=>[
  {label:"Take them all. Every one.", hint:"Unity +6 · Grain −40 · Morale −1", req:()=>S.stats.grain>=40, fx:{unity:6, grain:-40, morale:-1, tookAll:true}, go:"nextday"},
  {label:"Take them all, and put every one of them to work on seal-stones.", hint:"Engineers +1,000 · Grain −30", req:()=>S.stats.grain>=30, fx:{grain:-30}, then:()=>{ hostAdd("engineers",4); }, go:"nextday"},
  {label:"Take who you can feed. Send the rest on to Saelmar.", hint:"Safe · Unity −3", fx:{unity:-3}, go:"nextday"}
]},
c9d2:{ title:"Finish or Seal", text:()=>`
<p>You and your eldest talk about it on the second day, in the workshop tower, with the grey snow coming down outside the windows. It isn't a fight. Not yet.</p>
<p>${say(`"It could be finished,"`)} ${CHILD()} says. ${say(`"A whole world, under ours. Land for everyone who's lost theirs. The grey would stop because there'd be nothing left unfinished."`)}</p>
<p>${say(`"Or it could be sealed,"`)} you say. ${say(`"Forever. The Wonders could hold it shut if we mend the heart properly. Nobody else would have to go grey."`)}</p>`,
choices:()=>[
  {label:`"Tell me how finishing would work. All of it."`, hint:"Trust +5", fx:{trust:5, listenedFinish:true}, go:"nextday"},
  {label:`"It's too big a risk. I'm sorry."`, hint:"Trust −5", fx:{trust:-5, saidSeal:true}, go:"nextday"},
  {label:`"We don't have to decide today."`, hint:"Trust +1", fx:{trust:1}, go:"nextday"}
]},
c9d3:{ title:"The Empress at the Gate", text:()=>`
<p>On the third day a single ship comes up the river from Seagate with wine colored sails, and Empress Ysolt comes ashore alone, in a plain coat, with nothing at her throat. ${nation("caradun").stance==="ally"?"She is here as your ally.":"She is here, she says, as a refugee."}</p>
<p>${say(`"Caradun's colonies are gone,"`)} she says. ${say(`"My capital will go grey by spring. I have three hundred thousand people. I came to ask what you would do in my place."`)}</p>`,
choices:()=>[
  {label:"Offer Caradun's people land in the realm, and the refuges.", hint:"Caradun becomes an ally · Grain −20 · Unity +3", req:()=>S.stats.grain>=20, fx:{grain:-20, unity:3}, then:()=>{ setStance("caradun","ally"); }, go:"nextday"},
  {label:"Send her home with engineers and a hundred seal-stones.", hint:"Stone −40 · Caradun warms", req:()=>S.stats.stone>=40, fx:{stone:-40}, then:()=>{ if(nation("caradun").stance!=="ally") setStance("caradun","neutral"); nation("caradun").grey=Math.max(0,nation("caradun").grey-1); }, go:"nextday"},
  {label:`"I would ask the person who knows most. That's my child."`, hint:"Trust +4 · Ysolt goes to find your eldest", fx:{trust:4, ysoltMetHeir:true}, go:"nextday"}
]},
c9d4:{ title:"The City", enter(){ const opts=alive().filter(k=>k!=="brack"&&S.lv[k]>=4); const k=opts.sort((a,b)=>riftAt(b)-riftAt(a))[0]||"velm"; S.flags.city9=k; openRift(k,2); }, text:()=>`
<p>On the fourth day the Listeners come to you white faced. The grey snow is falling thickest over ${SITES[F("city9")].name}. A rift has opened under its walls. By tomorrow it will be in the city.</p>`,
choices:()=>[
  {label:`Send the Host to ${SITES[F("city9")].name}.`, hint:"The crisis goes better", fx:{n_c9:hostPower()>=90?1:0}, go:"nextday"},
  {label:`Start evacuating ${SITES[F("city9")].name} now.`, hint:"Safer for the people", fx:{n_c9:1, evac9:true}, go:"nextday"}
]},
c9c1:{ title:()=>`The Fall of ${SITES[F("city9")].name}`, enter(){ crisisEnter(); }, text:()=>`
<p>The grey comes into ${SITES[F("city9")].name} on the fifth night, under the walls, up through the cellars, and the snow comes down grey on the roofs.</p>
${sys("CRISIS",`[${SITES[F("city9")].name}]<br>A great city is going grey · the Host: ${hostLine()}`,"warn")}`,
choices:()=>[
  {label:"Hold the walls with the Host.", hint:`Strength ${hostPower()}`, fx:{n_c9:hostTest(135)}, go:"c9c2"},
  {label:"Raise a ring of seal-stones around the old town.", hint:"Stone −40", req:()=>S.stats.stone>=40, fx:{stone:-40, n_c9:2}, go:"c9c2"},
  {label:"Have the Listeners sing the holding song from every tower.", hint:`Listeners ${hostFmt("listeners")}`, fx:{n_c9:S.host.listeners>=20?2:1}, go:"c9c2"}
]},
c9c2:{ title:"The People", text:()=>`
<p>It's going. You can feel it under your hands: the old town will hold, maybe, but the outer city is too big, and the grey is too fast.</p>`,
choices:()=>[
  {label:"Get everyone out along the paved roads, to the refuges.", hint:has("refuges")?"You built the refuges":"There are no refuges yet", fx:{n_c9:has("refuges")?2:1, saved9:"people"}, go:"c9c3"},
  {label:"Keep the people in the old town, behind the seal-stones, and hold.", hint:"Risky · saves the city's heart", fx:{n_c9:hostPower()>=120?2:0, saved9:"city"}, go:"c9c3"},
  ...(S.heir.ways>=6?[{label:`Send them to ${CHILD()}'s waystations in the country.`, hint:`Because ${CHILD()} built ${S.heir.ways} waystations`, fx:{n_c9:2, saved9:"ways"}, go:"c9c3"}]:[])
]},
c9c3:{ title:"Morning", text:()=>`<p>The grey snow stops falling at dawn. You go up onto the wall to see what's left.</p>`, choices:()=>[{label:"Look.", go:"c9c4"}]},
c9c4:{ title:()=>SITES[F("city9")].name, enter(){ const o=outcome("c9"), k=F("city9"); S.flags.c9result=o; if(o==="great"){ S.rifts[k]=1; add({renown:5}); } else if(o==="good"){ S.rifts[k]=2; S.lv[k]=Math.max(2,S.lv[k]-1); } else { S.rifts[k]=3; S.lv[k]=Math.max(1,S.lv[k]-2); add({morale:-5, unity:-4}); } S.phase="open"; }, text:()=>`
<p>${({great:`${SITES[F("city9")].name} stands. The outer quarter is grey, the old town is whole, and every single person in it is alive. They ring every bell in the city at noon, and keep ringing them for an hour.`,good:`${SITES[F("city9")].name} is half grey. The old town stands. Most of the people got out. Not all.`,hard:`${SITES[F("city9")].name} is gone: grey from wall to wall, its towers soft and colorless in the morning light. ${F("saved9")==="city"?"The people who stayed are Unmade, standing in the streets.":"Most of its people got out, in the night, along the roads."} It is the worst morning of your life.`})[F("c9result")]}</p>
${sys("CRISIS OVER",`[${SITES[F("city9")].name}]<br>${({great:"Saved",good:"Half grey",hard:"Lost to the grey"})[F("c9result")]}`)}`,
choices:()=>[{label:"Go back to the bridge.", go:"c9season"}]},
c9season:{ title:"Part Two: The Grey Winter", enter(){ seasonEnter(); }, text:()=>`<p>Five weeks of grey winter, with the world's refugees in your cities.</p>${sys("WINTER",`Five weeks · three decisions a week · the council handles the rest · farms yield less, everyone eats more · the refuges can be built<br>${nextTierText()}`)}`, choices:()=>[{label:"Plan the first week.", go:"plan"}]},
c9w1:{ title:"Feeding the World", text:()=>`
<p>The national stores are falling by a third every week. The refugees are eating, and so is the Host, and the grey snow has killed the winter barley in half the realm.</p>`,
choices:()=>[
  {label:"Open Brackenfold's old stores from Book One to everyone.", hint:S.reserve&&reserveLeft()>0?"What's left of the old stores goes to the refugees · Unity +6":"There's nothing left in them", req:()=>!!S.reserve&&reserveLeft()>0, fx:{unity:6}, then:()=>{ S.stats.grain+=Math.min(400,S.reserve.grain||0); S.reserve.grain=Math.max(0,(S.reserve.grain||0)-400); }, go:"nextweek"},
  {label:"Ration everyone equally: Host, refugees, the council, you.", hint:"Unity +4 · Morale −2", fx:{unity:4, morale:-2, rationed:true}, go:"nextweek"},
  {label:EMP()?"Order the provinces to send grain.":"Ask the League for grain.", hint:EMP()?"Grain +60 · Resentment +2":"Grain +30 · Unity +2", fx:EMP()?{grain:60, resent:2}:{grain:30, unity:2}, go:"nextweek"}
]},
c9w2:{ title:"The Children's Choir", text:()=>`
<p>The children from the Ashlands, the ones who were singing on the bank to keep warm, are still singing. Every night, in the refuge in Brackenfold. And in the second week, the grey around the refuge starts to go back.</p>
<p>Your eldest goes to listen, and comes back with ${CP("pos")} eyes shining. ${say(`"Three of them are Cantors,"`)} ${CP("sub")} says. ${say(`"Real ones. Like me. Nobody ever told them."`)}</p>`,
choices:()=>[
  {label:`Tell ${CHILD()} to teach them.`, hint:"Trust +4 · the Choir begins", fx:{trust:4, choir:3}, go:"nextweek"},
  {label:"Send them to the Spark School.", hint:"Song +1 · the Choir begins", fx:{song:1, choir:3}, go:"nextweek"}
]},
c9w3:{ title:"The Unmade Wake", text:()=>`
<p>The Listeners try something new in the third week: the holding song, and the Song of Sleeping, and then the half of the Song of Finishing your eldest brought back from below, all three, to the Unmade in the house of care. And forty of them wake up.</p>
<p>They all say the same thing. It didn't want to hurt them. It just wanted to know what they were.</p>`,
choices:()=>[
  {label:"Have every Listener in the realm learn the three songs.", hint:"Listeners +200", then:()=>{ hostAdd("listeners",4); }, go:"nextweek"},
  {label:"Write it all down and send it to every kingdom.", hint:"Unity +3 · Renown +3", fx:{unity:3, renown:3}, go:"nextweek"}
]},
c9w4:{ title:()=>EMP()?"An Empire in Winter":"A League in Winter", text:()=>`
${EMP()?`<p>A province revolts in the fourth week. Not against the grey: against the Empire. ${NATIONS[Object.keys(NATIONS).find(k=>nation(k).stance==="province")||"aurendell"].name} refuses its tribute and closes its borders to imperial couriers. Its people are starving, their envoy says, and the Empire is feeding refugees from other countries first.</p>`
:`<p>The League holds in the fourth week, which nobody expected. Clan grain comes down to the refuges, Saelmar ships carry Caradun's people, Orsenne sends its Mirror's light to Aurendell's border. Nobody ordered it. Everybody just did it.</p>`}`,
choices:()=>EMP() ? [
  {label:"Send grain to the province first.", hint:"Grain −40 · Unity +4 · Resentment −1", req:()=>S.stats.grain>=40, fx:{grain:-40, unity:4, resent:-1}, go:"nextweek"},
  {label:"Send a legion.", hint:"Resentment +3 · Trust −8 · your child will hear", fx:{resent:3, trust:-8, legion9:true}, go:"nextweek"}
] : [
  {label:"Go to the League council and thank them, one by one.", hint:"Unity +6", fx:{unity:6}, go:"nextweek"},
  {label:"Propose that the League hold the crown together, when it comes to it.", hint:"Unity +4 · the League ending opens wider", fx:{unity:4, leagueCrown:true}, go:"nextweek"}
]},
c9w5:{ title:"Thaw", text:()=>`
<p>The grey snow stops in the last week of winter. Real snow falls instead, white and ordinary, and the whole realm goes outside to stand in it.</p>
<p>And your eldest comes to you with a map: the Deep Library, the last Elder archive, in the mountains past the Ashlands, where the other half of the Song of Finishing is kept. ${say(`"I need to go,"`)} ${CHILD()} says. ${say(`"And I need to take the Cantors. All of them. It needs more than one voice."`)}</p>`,
choices:()=>[
  {label:`"Take them. Take ${CHILD2()} too: ${C2s()} can build you seal-stones on the road."`, hint:"Trust +6", fx:{trust:6}, go:"nextweek"},
  {label:`"Go. I'll hold things here."`, hint:"Trust +3", fx:{trust:3}, go:"nextweek"}
]},
c9close:{ title:"Spring Again", enter(){ S.flags.winter=false; }, text:()=>`<p>Spring comes into a world that is grey at the edges, and green in the middle, and full of people who have lost their homes. Your eldest rides north with a choir of children. You stand on the bridge and watch them go.</p>`, choices:()=>[{label:"End of Chapter Nine.", go:"summary9"}]},
summary9: chapterSummary(9, ()=>`<p>The grey winter came, and ${RN()} took in the world. ${SITES[F("city9")].name} was ${({great:"saved",good:"half lost",hard:"lost"})[F("c9result")]}. The first Cantors were found, singing in a refuge. And your eldest has gone to find the other half of the Song of Finishing.</p>`, "Chapter Ten: The Choir", "c10open")
});

/* ================================================================
   BOOK THREE, CHAPTERS TEN TO FOURTEEN, AND THE FIVE ENDINGS
   ================================================================ */
const addChoir = n => { S.flags.choir=(S.flags.choir||0)+n; };
const choirN = () => F("choir")||0;
const greats = () => ["c1","c2","c3","c4","c5","c6","c7","c8","c9","c10","c12","c13"].filter(k=>F(k+"result")==="great").length;
CH[10].acts = {
  recruit:{label:"Search the villages for children who sing to stones", hint:"Find Cantors for the Choir · Choir +2", max:3, title:"A New Voice", then:()=>addChoir(2),
    text:()=>`<p>You find them where you always find them: the children nobody understands. A girl in a mountain village who makes the well sing. Twin boys who hum the cracks out of their mother's pots. You sing a few notes, and they sing them back, and their faces change. The Choir is ${choirN()} voices now.</p>`},
  teach:{label:"Teach the Choir together, at sunset", hint:"Song +1 · the Choir sings as one", max:2, title:"Practice", fx:()=>({song:1, n_c10:1}),
    text:()=>`<p>You stand them in a circle on a hillside and teach them the Song of Holding, one line at a time. By the end, ${choirN()} voices are singing it together, badly, and the grey in the valley below goes still to listen.</p>`}
};
CH[12].acts = {
  watch:{label:"Walk the empress's ship at night and keep your eyes open", hint:"Learn what Caradun is hiding · the crisis goes better", max:2, title:"The Night Watch", fx:()=>({n_c12:1, watched:1}),
    text:()=>`<p>Jory finds the locked hold on the second night. Inside: a machine of brass and Elder stone, three empty sockets in the shape of the relics Ysolt used to wear, and a fourth socket, much larger, shaped like nothing you have ever seen. Except you have. It's shaped like the heart under the bridge.</p>`}
};
Object.assign(SCENES, {
/* ============================ CHAPTER TEN: THE CHOIR (the heir) ============================ */
c10open:{ title:"The Choir", enter(){ chapterEnter(10); if(!choirN()) addChoir(2); }, text:()=>`
<p>You are ${CHILD()}, riding north in the spring with ${choirN()} children who sing to stones, and Elowen, and Jory, and ${CHILD2()} driving a steam wagon full of folding seal-stones of ${C2("pos")} own design, with Ilsa beside ${C2("obj")} on the box, keeping the wind at your backs the whole way.</p>
<p>The Deep Library is in the mountains beyond the Ashlands: the last archive of the Elders, where they wrote down everything before they went to build the Wonders. Half the Song of Finishing is in your head. The other half is there. The last Elder's journal said it needs more than one voice.</p>
<p>You have ${choirN()}. You need more.</p>`,
choices:()=>[{label:"Ride.", go:"c10days"}]},
c10days:{ title:"North", enter(){ expEnter("the road to the Deep Library","ashlands"); }, text:()=>`<p>Five days to the Library. Find every voice you can on the way.</p>`, choices:()=>[{label:"Make camp.", go:"camp"}]},
c10d1:{ title:"The Choir on the Road", text:()=>`
<p>The Choir sings while it walks, because the children can't help it, and the grey along the road goes quiet as you pass. In one village, an old man comes out of his house and follows you for a mile, weeping, because he hasn't heard his own village's name in a year and now he can't stop saying it.</p>`,
choices:()=>[
  {label:"Let them sing. All the way.", hint:"Choir +1 · Song +1", fx:{song:1}, then:()=>addChoir(1), go:"nextday"},
  {label:"Stop and help the village.", hint:"A waystation · Unity +2", fx:{unity:2}, then:()=>{ S.heir.ways++; S.heir.waysAt.push("a mountain village"); (S.heir.waysNat=S.heir.waysNat||[]).push("ashlands"); }, go:"nextday"}
]},
c10d2:{ title:()=>`${CHILD2()}'s Stones`, text:()=>`
<p>${CHILD2()} lays a line of folding seal-stones across a grey river on the second day so the cart can cross, and the Choir sings them into place, and they hold. A bridge across nothing, made by an Artificer and a dozen singing children. ${CHILD2()} stands on the far bank looking at it as if ${C2("sub")} can't believe it.</p>
<p>${say(`"That's what Mum and Dad's magic was always for, isn't it,"`)} ${CHILD2()} says. ${say(`"Not mending. Making something to stand on."`)}</p>`,
choices:()=>[
  {label:`"Tell our ${HP()} that. ${P("sub").charAt(0).toUpperCase()+P("sub").slice(1)}'ll cry."`, hint:"Sibling ◆◆ · Trust +3", fx:{aff_sib:2, trust:3}, go:"nextday"},
  {label:"Ask your sibling to build the Choir a stair, when the time comes.", hint:"Sibling ◆ · the Choir's Stair", fx:{aff_sib:1, sibStair:true}, go:"nextday"},
  {label:"Sit on the bank with your sibling and Ilsa and just look at it.", hint:"Sibling ◆ · Ilsa ◆ · Morale +2", fx:{aff_sib:1, aff_ilsa:1, morale:2}, go:"nextday"}
]},
c10d3:{ title:"Mother Vey", text:()=>`
${F("c6result")==="great"?`<p>Mother Vey meets you at the edge of the Ashlands, on foot, in her grey robes, with forty of her people behind her. ${say(`"I was wrong about what it wanted,"`)} she says. ${say(`"I want to help it get it."`)} Some of her people can sing. Some of them can sing very well.</p>`
:`<p>Mother Vey's people are waiting at the edge of the Ashlands: two hundred of the Hollow Court, in grey, across the road. Vey isn't with them. ${say(`"The world should rest,"`)} their leader says. ${say(`"You want to make more of it. We won't let you."`)}</p>`}`,
choices:()=>F("c6result")==="great" ? [
  {label:"Welcome them into the Choir.", hint:"Choir +4 · Song +1", fx:{song:1}, then:()=>addChoir(4), go:"nextday"},
  {label:"Ask Vey to teach the Choir her lullaby.", hint:"Choir +2 · the Song of Sleeping, sung by many", then:()=>{ addChoir(2); learnSong("sleeping"); }, go:"nextday"}
] : [
  {label:"Sing to them. All of you. Show them what you heard below.", hint:"Choir decides", fx:{n_c10:choirN()>=6?2:0}, then:()=>{ if(choirN()>=6) addChoir(3); }, go:"nextday"},
  {label:"Go around, through the mountains.", hint:"Safe · a day lost", fx:{morale:-1}, go:"nextday"}
]},
c10d4:{ title:"The Deep Library", text:()=>`
<p>The Deep Library is a mountain hollowed out: a thousand rooms of stone shelves, carved with Elder script, every word the Elders ever wrote. And it is under siege. Hundreds of Unmade stand around the mountain in a ring, facing in, perfectly still, the way they stood at Kell. Waiting for something to open.</p>`,
choices:()=>[
  {label:"Scout the old service tunnels with Jory.", hint:"Jory ◆ · the crisis goes better", fx:{aff_jory:1, n_c10:1}, go:"nextday"},
  {label:"Rest the Choir. Tomorrow will be long.", hint:"Morale +2", fx:{morale:2}, go:"nextday"}
]},
c10d5:{ title:"Elowen", text:()=>`
<p>The night before the Library, Elowen finds you on a ledge above the camp, looking at the ring of Unmade in the moonlight. She sits down beside you. Her left hand ${F("c8result")==="hard"?"is still grey to the wrist, and she still can't feel it":"is warm in yours"}.</p>
<p>${(F("aff_elowen")||0)>=5?say(`"I've been trying to say something for twelve years,"`)+" she says. "+say(`"In every letter. I'm going to say it now, in case. I love you. That's all. You don't have to say anything."`):say(`"Whatever happens in there,"`)+" she says, "+say(`"I'm glad it was you."`)}</p>`,
choices:()=>(F("aff_elowen")||0)>=5 ? [
  {label:`"I love you too. I have since the Realm Road."`, hint:"Elowen ◆◆", fx:{aff_elowen:2, inLove:true}, go:"nextday"},
  {label:"Kiss her instead of answering.", hint:"Elowen ◆◆", fx:{aff_elowen:2, inLove:true}, go:"nextday"}
] : [
  {label:"Take her hand.", hint:"Elowen ◆", fx:{aff_elowen:1}, go:"nextday"},
  {label:`"Me too."`, hint:"Elowen ◆◆", fx:{aff_elowen:2}, go:"nextday"}
]},
c10c1:{ title:"The Siege of the Deep Library", enter(){ crisisEnter(); }, text:()=>`
<p>At dawn the ring of Unmade turns, all at once, toward you. And from inside the mountain, through the stone, you hear the Library's doors begin to crack.</p>
${sys("CRISIS",`[The Deep Library]<br>The Choir: ${choirN()} voices · Song ${S.stats.song}`,"warn")}`,
choices:()=>[
  {label:"Sing the Song of Holding with the whole Choir, and walk through them.", hint:`Choir ${choirN()} · it needs many voices`, fx:{n_c10:choirN()>=10?2:choirN()>=6?1:0}, go:"c10c2"},
  {label:"Take the service tunnels.", hint:F("aff_jory")?"Jory mapped them":"Nobody knows the way", fx:{n_c10:F("aff_jory")?2:1}, go:"c10c2"}
]},
c10c2:{ title:"The Vault", text:()=>`
<p>The Song of Finishing is in the deepest room of the Library, carved on the walls of a round vault in a thousand lines. The vault is filling with grey. Every line it touches, it forgets.</p>`,
choices:()=>[
  {label:`${CHILD2()}: seal-stones, around the vault, now.`, hint:"Your sibling's stones", fx:{n_c10:(F("aff_sib")||0)>=3?2:1, sibVault:true}, go:"c10c3"},
  {label:"Elowen: roots over the walls, to hold the words.", hint:"Elowen", fx:{n_c10:(F("aff_elowen")||0)>=6?2:1}, go:"c10c3"},
  {label:"Ilsa: blow the grey back out of the vault door.", hint:"Ilsa", fx:{n_c10:(F("aff_ilsa")||0)>=3?2:1}, go:"c10c3"}
]},
c10c3:{ title:"Every Voice", text:()=>`
<p>You read the song off the walls as fast as you can, and you sing it, and you can't hold it. It's too big for one voice. It's a thousand lines and they all have to be sung at once.</p>
<p>So you turn to the Choir.</p>`,
choices:()=>[
  {label:"Give every voice a line. Sing it together, once, all the way through.", hint:`Choir ${choirN()} · Song ${S.stats.song}`, fx:{n_c10:choirN()>=10&&S.stats.song>=23?3:choirN()>=6?2:1}, go:"c10c4"},
  {label:"Learn it line by line, alone, as fast as you can.", hint:"Song decides", fx:{n_c10:S.stats.song>=27?2:1}, go:"c10c4"}
]},
c10c4:{ title:"The Song of Finishing", enter(){ const o=outcome("c10"); S.flags.c10result=o; if(o!=="hard") learnSong("finishing"); if(o==="great"){ add({song:3, renown:5}); addChoir(2); } else if(o==="hard") add({morale:-2}); S.phase="open"; }, text:()=>`
<p>${({great:`${choirN()} voices sing the Song of Finishing all the way through, once, in the drowning vault, and the whole mountain rings like a bell. When it ends, the grey in the vault is gone. Not sealed. Gone. Where it was, there is new stone, warm, carved with a pattern nobody carved.`,good:"You get through the song, ragged and breathless, with the Choir dropping lines and finding them again. The grey stops at the vault's edge. You have it. All of it. You think.",hard:"The grey takes the last hundred lines before you can read them. You have most of the song. Not the end."})[F("c10result")]}</p>
${songSys()}
${sys("CRISIS OVER",`[The Deep Library]<br>${F("c10result")!=="hard"?"You know the Song of Finishing":"You know most of the Song of Finishing"} · the Choir: ${choirN()} voices`)}`,
choices:()=>[{label:"Go home.", go:"c10close"}]},
c10close:{ title:"Home", text:()=>`<p>You ride home with a Choir of ${choirN()} and a song nobody has sung in a thousand years. All the way home you are thinking of what you'll say to your ${HP()}, and you know ${P("sub")} has been thinking of what to say to you.</p>`, choices:()=>[{label:"End of Chapter Ten.", go:"summary10"}]},
summary10: chapterSummary(10, ()=>`<p>The Choir is ${choirN()} voices. ${F("c10result")!=="hard"?`${CHILD()} knows the whole Song of Finishing.`:`${CHILD()} knows most of the Song of Finishing.`} ${F("inLove")?"And "+CHILD()+" and Elowen said the thing they had been trying to say for twelve years.":""}</p>`, "Chapter Eleven: Keystone and Cantor", "c11open"),

/* ============================ CHAPTER ELEVEN: KEYSTONE AND CANTOR (both) ============================ */
c11open:{ title:"Keystone and Cantor", enter(){ chapterEnter(11); }, text:()=>`
<p>Your child comes home in the summer with a Choir and a song. You meet ${CP("obj")} on the Bridge of Two Banks, over the cracked heart, and hold ${CP("obj")} for a long time.</p>
<p>And then the two of you go up to the Accord Hall and say, in front of the whole council, two different things.</p>
<p>${say(`"We can seal it,"`)} you say. ${say(`"Wren and Fen have the design. Mend the heart, and every Wonder holds it shut forever. Nobody else goes grey."`)}</p>
<p>${say(`"We can finish it,"`)} ${CHILD()} says. ${say(`"I have the song. The Choir can sing it. A whole world, under ours, made whole. The grey stops because there's nothing left unfinished."`)}</p>
<p>The hall is silent. ${EMP()?"Everyone looks at you, because you are the Emperor.":"Everyone looks at both of you, because the League has never had to choose between two people it trusts."}</p>
