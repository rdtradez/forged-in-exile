<p>Then the real winter comes down from the north, and Brackenfold closes its gates and settles in.</p>
<p>Winter changes everything. The fields are frozen, so crews in the fields do nothing until you can grow food under glass. Every house burns firewood every week. Stone is slow to cut in the cold. And the people of Brackenfold are watching to see whether the walls and roofs you built will keep them warm.</p>
${sys("PART TWO",`The Long Winter · 6 weeks · ${perWeek()} projects a week<br>Firewood: every week, the village burns timber to stay warm<br>Food: fields are frozen · store, smoke, or grow under glass<br>Goal: make Brackenfold a Free Town`)}`,
choices:[{label:"Plan the first week of winter.", go:"plan"}]},

blizzard:{ title:"The Great Snow", text:()=>`
<p>The worst blizzard in twenty years buries Brackenfold to the windowsills for three days. ${has("hypoHomes")?"In the cottages with Elder heating, people sleep in their shirtsleeves.":"In the old houses, families huddle around a single fire."} ${has("tiles")?"Not one tiled roof gives way.":"Two thatched roofs collapse under the snow."}</p>
<p>On the third morning, Bren comes to you with frost in his beard. ${say(`"Some of the east row are running low on wood."`)}</p>`,
choices:[
  {label:"Open the hall. Everyone sleeps together around one great fire.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"},
  {label:"Send crews out into the snow for deadwood.", hint:"Timber +6, Morale −1", fx:{timber:6, morale:-1}, go:"nextweek"},
  ...(F("serenHere")?[{label:"Ask Seren to keep the worst houses warm with fire.", hint:"Seren goes house to house", fx:{morale:1, serenHelped:true}, go:"nextweek"}]:[])
]},

marisol:{ title:"The Woman From the Mountains", text:()=>`
<p>She walks in through the snow on the second week of winter: a tiny, very old woman in a monk's robe, with a staff and a pack and no apparent fear of anything.</p>
<p>${say(`"Marisol Venn,"`)} she says. ${say(`"Formerly of House Ardane. Exiled at fourteen for awakening the wrong magic. I have been living on a mountain for forty years, and I heard a rumor that someone was finally building again."`)}</p>
${F("registry")?`<p>Her name is in Seren's archive pages. You check it twice.</p>`:""}
<p>She lays her hand on the hall's wall and nods. ${say(`"Good work. Sloppy joints in the north corner. You'll want to fix that."`)} Then she lays her hand on yours, and goes very still. ${say(`"Oh,"`)} she says quietly. ${say(`"Oh, child. I spent forty years thinking I was strong."`)}</p>`,
choices:[
  {label:"Offer her a home and a place in the workshop school.", hint:"Craft +2 · Marisol teaches", fx:{craft:2, marisolJoin:true, marisol:true}, go:"nextweek"},
  {label:`"Tell me about the Spire."`, hint:"Lore · Learn what they do to artificers", fx:{spireLore:true, marisol:true, marisolJoin:true}, go:"marisolSpire"},
  {label:"Thank her, feed her, and send her on. She could bring the Spire here.", hint:"Resentment +1", fx:{resent:1}, go:"nextweek"}
]},

marisolSpire:{ title:"The Woman From the Mountains", text:()=>`
<p>Marisol's face does not change. ${say(`"They come and test you,"`)} she says. ${say(`"Politely. A magister with a silver glove. They decide whether your magic is 'stable.' If it is weak, they leave you alone. If it is strong, they take you to the Spire for 'correction.'"`)}</p>
<p>${say(`"What happens there?"`)}</p>
<p>${say(`"I don't know,"`)} she says. ${say(`"Nobody who went ever came back to tell me. I ran before they could take me."`)}</p>
${sys("LORE","[Fragment Recovered: Correction]")}`,
choices:[{label:"Sit with that for a long time.", go:"nextweek"}]},

fateGift:{ title:()=>({tamed:"Gifts From the Garden",destroyed:"The Dead Wood",sealed:"Tremors"})[F("thornFate")], text:()=>({
  tamed:`<p>On the third week of winter, Oda comes back from the north wood carrying a basket of fruit. Fresh fruit. In the middle of winter. ${say(`"The Garden's open,"`)} she says, dazed. ${say(`"It's warm in there. The trees are bearing."`)}</p><p>The Gardener stands at the door now, and lets your people pass.</p>`,
  destroyed:`<p>The Thornwood is dead. Every vine has fallen, and the trees they strangled are standing grey and dry: the best seasoned timber anyone has ever seen, a whole forest of it, and nothing left to guard it.</p><p>Garth looks at it the way other men look at gold.</p>`,
  sealed:`<p>On the third week of winter, the ground shivers. Just once, faintly, like something turning over in its sleep. In the north wood, a few thorns have started moving again.</p>`
}[F("thornFate")]),
choices:()=>({
  tamed:[{label:"Send a crew to the Garden every week for winter food.", hint:"Food +4 every week (already counted)", fx:{food:2, morale:1}, go:"nextweek"},
         {label:"Ask Wren and Marisol to study the Garden with you.", hint:"Craft +1", fx:{craft:1}, go:"nextweek"}],
  destroyed:[{label:"Put every spare hand on the dead wood.", hint:"Timber +10", fx:{timber:10}, go:"nextweek"},
             {label:"Leave some standing. The wood will heal on its own.", hint:"Morale +1, Resentment −1", fx:{morale:1, resent:-1}, go:"nextweek"}],
  sealed:[{label:"Go back and strengthen the seal.", hint:"Stone −3, Defense +1", req:()=>S.stats.stone>=3, fx:{stone:-3, defense:1}, go:"nextweek"},
          {label:"Watch it, and build faster.", hint:"Timber +3", fx:{timber:3}, go:"nextweek"}]
})[F("thornFate")]},

midwinter:{ title:"Midwinter", text:()=>`
<p>The longest night of the year. In the old Brackenfold, Bren says, midwinter meant one candle in every window and praying the wood would last.</p>
<p>This year the square is ${has("square")?"paved and swept clean":"trampled snow"}, there are ${has("glassworks")?"glass lanterns":"lanterns"} hanging from the ${has("marketHall")?"beams of the new market hall":"market stalls"}, and somebody has organized a choir, which is mostly enthusiasm.</p>
${F("serenHere")?`<p>Seren lights every lantern in the square at once with a flick of one hand, and the children shriek with delight.</p>`:""}
${F("marisol")?`<p>Marisol sits by the fire with a cup of something hot and watches the children with an expression you cannot read.</p>`:""}`,
choices:[
  {label:"Give a toast to the people who built all this.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"},
  {label:"Slip away and spend the night with the Codex.", hint:"Craft +1", fx:{craft:1}, go:"nextweek"},
  {label:"Invite the tinkers and traders camping on the road to join in.", hint:"Prosperity +1, Coin +2", fx:{prosperity:1, coin:2}, go:"nextweek"}
]},

spireLetter:{ title:"The Silver Seal", text:()=>`
<p>The letter arrives sealed in silver wax, with the mark of a narrow tower: the Spire.</p>
<p><em>By authority of the Royal Academy of Mages, Magister Corvan Hale will attend the holding of Brackenfold before the spring thaw, to examine an irregular practitioner of the Artifice affinity, in accordance with the Statute of Stable Practice.</em></p>
${F("marisol")?`<p>Marisol reads it over your shoulder. ${say(`"Silver glove,"`)} is all she says.</p>`:""}
<p>You have one more week.</p>`,
choices:[
  {label:"Hide the Codex. Let him find a clever mason and nothing more.", hint:"Secrecy", fx:{hideFromSpire:true}, go:"nextweek"},
  {label:"Prepare to show him everything. Make the town too big to hide.", hint:"Openness", fx:{showSpire:true}, go:"nextweek"},
  ...(F("vaneAlly")?[{label:"Write to Assessor Vane for advice.", hint:"Vane's counsel", fx:{vaneAdvice:true}, go:"nextweek"}]:[]),
  ...(F("serenHere")||F("serenSpy")?[{label:"Ask Seren what the Spire is really afraid of.", hint:"Seren's insight", fx:{serenAdvice:true}, go:"nextweek"}]:[])
]},

thaw:{ title:"The First Thaw", text:()=>`
<p>The last week of winter. The icicles on the hall start dripping at noon, and the river makes a sound like distant thunder as the ice begins to crack.</p>
<p>Somewhere on the western road, a magister with a silver glove is riding toward you.</p>`,
choices:[
  {label:"Rehearse what you will say to him.", hint:"Craft +1", fx:{craft:1}, go:"nextweek"},
  {label:"Hide the Codex sketches in the cellar under the hall.", hint:"Secrecy", fx:{hideFromSpire:true}, go:"nextweek"},
  {label:"Spend the last quiet evening with the people who matter.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"}
]},

magister:{ title:"The Silver Glove", text:()=>{
const t=tier();
return `<p>Magister Corvan Hale arrives on the first morning of the thaw with two attendants in grey. He is tall and narrow and very calm, and he wears a single silver glove on his right hand. When he steps down from his horse, the puddles around his boots freeze solid.</p>
<p>He walks the town for a full day without speaking. He stops at the ${has("concrete")?"concrete wall":"walls"}, at the ${has("domeHall")?"Elder dome over the hall, where he stands for a very long time":has("kiln")?"kiln":"workshops"}, at ${has("school")?"the workshop school, where the children stare back at him":"the forge"}.</p>
<div class="compare">
  <figure>${mapSVG({then:"autumn"})}<figcaption>Last autumn</figcaption></figure>
  <figure>${mapSVG()}<figcaption>After the long winter</figcaption></figure>
</div>
${sys("EXAMINATION",`Population ${S.snap?S.snap.pop:"?"} → ${S.pop} · Works ${S.snap?S.snap.built.length:"?"} → ${works()}<br>Rank: ${t.name.toUpperCase()} · Craft rank ${rank()}<br>Thornwood: ${({tamed:"Healed",destroyed:"Destroyed",sealed:"Sleeping"})[F("thornFate")]}`)}
<p>On the evening of the second day, he asks to see you alone. ${say(`"Show me,"`)} he says, and holds out a block of plain grey stone.</p>`;},
choices:[
  {label:"Mend a small crack in it. Nothing more.", hint:F("hideFromSpire")?"As you planned":"Hide your strength", fx:{exam:"weak"}, go:"magister2"},
  {label:"Reshape it into a perfect miniature arch, keystone and all.", hint:"Needs Reshape · Show your strength", req:()=>F("reshape"), fx:{exam:"strong"}, go:"magister2"},
  {label:"Set the stone aside, and show him the Codex instead.", hint:"Show him everything", fx:{exam:"codex"}, go:"magister2"}
]},

magister2:{ title:"The Magister's Verdict", text:()=>{
const t=tier();
const v={
  weak:`<p>You close the crack and set the stone down. Hale looks at it, then at you, then out of the window at the town you built.</p>
    <p>${say(`"A clever mason,"`)} he says, ${say(`"who raised a ${t.name.toLowerCase()} out of a dead hamlet in a single year. Do not insult me, ${P("lord")} ${N()}."`)}</p>`,
  strong:`<p>The stone flows in your hands like clay and sets into a perfect arch the size of your palm. Hale picks it up with his silver glove. Frost spreads across it. ${say(`"Remarkable,"`)} he says quietly. ${say(`"And deeply unstable, by the Statute's definition."`)}</p>`,
  codex:`<p>You lay out the sketches. The arch. The concrete. The kiln. ${has("domeHall")?"The dome.":"The sealed page, half open."} Hale reads every one. When he finishes, his calm has gone somewhere, and something else has replaced it, something almost like hunger.</p>
    <p>${say(`"Aurel Valcrest's hand,"`)} he says. ${say(`"We burned his workshops two hundred years ago. We were told we got everything."`)}</p>`
}[F("exam")];
const close = t.lvl>=3
  ? `${say(`"Brackenfold is a Free Town now. The crown's charter protects it, and the crown is very fond of its new taxes. So I cannot simply take you."`)} He pulls on his glove. ${say(`"Instead, the Spire invites you. To the capital, in spring, to stand before the Academy and defend your practice. Bring whomever you like. I would advise you to come."`)}`
  : `${say(`"By the authority of the Statute, you are summoned to the Spire in spring for examination and, if necessary, correction."`)} He pulls on his glove. ${say(`"Your town may come and watch, if it likes."`)}`;
return `${v}
<p>${close}</p>
<p>He rides west at dawn. ${F("marisol")?`Marisol watches him go from the wall, and when he is out of sight, she says the only thing anyone says for a long while: ${say(`"Nobody comes back from correction."`)}`:`Bren watches him go from the wall. ${say(`"Spring,"`)} he says. ${say(`"Then we'd better be ready by spring."`)}`}</p>
<p><em>End of Chapter Two.</em></p>`;},
choices:[{label:"See your chapter results", go:"summary2"}]},

summary2:{ title:"Chapter Two Complete", text:()=>{
const allies=[F("tamsin")&&"Tamsin Rook","Wren",F("fen")&&"Fen",(F("seren")==="ally"||F("serenHere"))&&"Seren",F("marisol")&&"Marisol Venn",F("vaneAlly")&&"Idris Vane"].filter(Boolean);
return `
${mapSVG()}
${regionSVG()}
${sys("CHAPTER RESULT",`Thornwood: ${({tamed:"Healed, the Garden lives",destroyed:"Destroyed",sealed:"Sealed and sleeping"})[F("thornFate")]}<br>Rank: ${tier().name}<br>Population: ${S.pop}<br>Projects completed: ${works()}<br>Codex pages: ${S.codex.length} of ${codexTotal()}<br>Allies: ${allies.join(", ")}<br>Craft rank: ${rank()} · Resentment ${S.stats.resent}`)}
<div class="ad">Ad slot (interstitial between chapters)<br>AdMob placement goes here in the Android build</div>
<p>Next, Chapter Three: <em>The Spire</em>. In spring, you ride to the capital for the first time since your exile, to stand before the Academy that buried your magic. Your father will be there. So will every great house in the kingdom.</p>`},
choices:[{label:"Continue to Chapter Three", go:"c3open"},{label:"Start the whole story over", restart:true}]},

/* ===================== FEN'S STORY ===================== */
fenAgain:{ title:"Fen Asks Again", enter(){ add({fenAsked2:true}); }, text:()=>`
<p>Fen finds you at the kiln at dusk. He has clearly practiced what he is going to say, and he forgets all of it the moment you look at him.</p>
<p>${say(`"I've been watching,"`)} he says. ${say(`"Every project. I know how you set a footing now. I know why the arch stands. I tried it on a fence post, and it went hard, and it stayed hard."`)} He holds out his hands like evidence. ${say(`"Please. I don't want to haul timber my whole life."`)}</p>`,
choices:[
  {label:"Take him on as your apprentice, properly this time.", hint:"Fen joins · two projects a day in later chapters' day phases · Morale +1", fx:{fen:true, morale:1}, go:"nextweek"},
  {label:`"Not yet. Show me you can wait."`, hint:"Fen will ask once more", fx:{}, go:"nextweek"}
]},

fenFather:{ title:"The Miller's Objection", text:()=>`
<p>Tobin the miller is a big, flour-pale man who has never once raised his voice in your hearing. He raises it now, standing in the doorway of the mill with Fen behind him, red-faced.</p>
<p>${say(`"He's my only son,"`)} Tobin says. ${say(`"I know what happens to people with magic like yours. I've heard what your own family did to you. The Spire takes them. The houses send them away. You want that for him?"`)}</p>
<p>Fen opens his mouth and closes it again. It is not, you realize, an unreasonable question.</p>`,
choices:[
  {label:`"Whatever comes for Fen will have to go through me first. I promise you that."`, hint:"A promise you will be held to", fx:{fenPromise:true, morale:1}, go:"nextweek"},
  {label:"Step back and let Fen answer his father himself.", hint:"Fen grows braver", fx:{n_fenBrave:1}, go:"fenFather2"},
  {label:"Offer to rebuild the mill house first. Show Tobin what the craft is for.", hint:"Timber −2 · Tobin warms to you", req:()=>S.stats.timber>=2, fx:{timber:-2, tobinWon:true, morale:1}, go:"nextweek"}
]},

fenFather2:{ title:"The Miller's Objection", text:()=>`
<p>Fen steps past you. His voice shakes at first, then it doesn't.</p>
<p>${say(`"Da, I fixed the sluice gate last week. The one you said would need a new one. I didn't tell you because I knew you'd worry. I'm not asking you not to worry. I'm asking you to let me be good at something."`)}</p>
<p>Tobin looks at his son for a long time. Then he goes back inside the mill without a word. That night, a sack of flour appears outside the manor door with a note in clumsy letters: <em>Feed him properly.</em></p>`,
choices:[{label:"Keep the note.", go:"nextweek"}]},

fenMistake:{ title:"The Beam That Broke", text:()=>`
<p>The crash brings half the street running. In the new cottage row, a roof beam lies in two splintered halves across the floor, and a little girl is standing a hand's width from where it fell, too frightened to cry.</p>
<p>Fen did it. He wanted to surprise you by hardening the whole row himself, and he pushed the last beam too far. Past hard, past strong, into brittle. It held for an hour, then shattered.</p>
<p>Nobody is hurt. But Fen is gone. Oda finds his tracks heading for the lumber camp.</p>`,
choices:[
  {label:"Find him, and tell him about the first thing you ever broke.", hint:"Fen trusts you more · Morale +1", fx:{n_fenBond:1, morale:1}, go:"fenMistake2"},
  {label:"Bring him back and have him fix the beam himself while you watch.", hint:"Fen grows stronger · Craft lesson", fx:{n_fenSkill:1}, go:"fenMistake2"},
  {label:"Leave him be for a day. Some lessons have to sink in alone.", hint:"Fen grows more careful", fx:{fenCareful:true}, go:"fenMistake2"}
]},

fenMistake2:{ title:"The Beam That Broke", text:()=>`
<p>${say(`"I thought harder meant better,"`)} Fen says, much later, turning a splinter of the broken beam over in his hands. ${say(`"It doesn't, does it?"`)}</p>
<p>${say(`"No,"`)} you tell him. ${say(`"Every material has a shape it wants to be. You can ask it to go further. If you demand it, it breaks."`)}</p>
<p>He thinks about that. ${say(`"The grain has patience,"`)} he says slowly, ${say(`"and you have to have it too."`)} You realize he has just put it better than Aurel ever did. You write it in the margin of the Codex that night, in his words.</p>
${sys("APPRENTICE","[Fen learned: THE GRAIN'S PATIENCE]")}`,
choices:[{label:"Back to work.", fx:{craft:1}, go:"nextweek"}]},

fenWinter:{ title:()=>F("marisol")?"Fen and the Old Woman":"Fen's Nightmares", text:()=>F("marisol")
? `<p>Marisol has been watching Fen work for a week without saying anything. Then she stops him in the middle of mending a hinge.</p>
   <p>${say(`"You listen to it,"`)} she says. ${say(`"Before you touch it. You listen first. That's old Ardane craft, boy. They burned it out of my house before I was born. Where did you learn it?"`)}</p>
   <p>Fen goes pink. ${say(`"I just... I can hear where it's going to break. Before I touch it."`)}</p>
   <p>Marisol looks at you. ${say(`"Let me teach him,"`)} she says. ${say(`"I have forty years of things nobody wanted to know."`)}</p>`
: `<p>Fen has stopped sleeping. His mother tells you quietly, and when you find him in the workshop at midnight, he is mending the same small stone over and over again until it is smooth as glass.</p>
   <p>${say(`"I keep dreaming about a silver glove,"`)} he says without looking up. ${say(`"It reaches for me. Someone in the square said the Spire takes anyone with the spark. Is that true?"`)}</p>`,
choices:()=>F("marisol") ? [
  {label:"Yes. Teach him everything.", hint:"Fen learns Listening · Craft +1", fx:{fenListening:true, n_fenSkill:1, craft:1}, go:"nextweek"},
  {label:"Teach him, but I'll be in the room.", hint:"Fen learns Listening · You learn it too", fx:{fenListening:true, craft:2}, go:"nextweek"}
] : [
  {label:`"It's true they try. It won't be true for you."`, hint:"A promise", fx:{fenPromise:true, n_fenBond:1}, go:"nextweek"},
  {label:"Tell him everything you know about the Spire, honestly.", hint:"Fen grows braver", fx:{n_fenBrave:1}, go:"nextweek"}
]},

fenName:{ title:"Fen's Mark", text:()=>`
<p>Aurel's notes describe a custom of the Elder masons: every builder carved a small personal mark into the stones they laid, so a thousand years later anyone would know whose hands had set them.</p>
<p>Fen has read that page more times than any other. Tonight he comes to you with a scrap of slate and a design scratched into it: a small mill wheel inside a mason's square.</p>
<p>${say(`"Can I have one?"`)} he asks. ${say(`"A mark. I know I'm only an apprentice. But I'd like the walls to remember me."`)}</p>`,
choices:[
  {label:"Name him Journeyman of Brackenfold in front of the whole hall.", hint:"Morale +2 · Fen's rank rises", fx:{morale:2, fenJourneyman:true, n_fenBrave:1}, go:"nextweek"},
  ...(F("reshape")?[{label:"Teach him Reshape, the one skill you've kept for yourself.", hint:"Fen learns Reshape · Craft +1", fx:{fenReshape:true, n_fenSkill:2, craft:1}, go:"nextweek"}]:[]),
  {label:"Carve his mark into the keystone of your next arch, together.", hint:"Fen trusts you completely", fx:{n_fenBond:2}, go:"nextweek"}
]},

fenSpring:{ title:"Fen, After", text:()=>({
  recognized:`<p>Fen has not stopped talking about the Spire since you came home. About the magisters' faces. About the gallery standing up. He tells the story to the children at the school so many times they can recite it back to him.</p><p>But at night, he still mends the same small stone, over and over. ${say(`"They looked at me like I was a broken thing,"`)} he says once. ${say(`"Before they saw what I could do."`)}</p>`,
  probation:`<p>Fen is quieter since the capital. The probation papers name him as well as you, and twice a month now a Spire courier will come to read your 'practice logs.'</p><p>${say(`"It's all right,"`)} he says, too fast. ${say(`"We'll just have to be so good they're embarrassed."`)}</p>`,
  flight:`<p>Fen has not said much since you rode home in the dark with half the city behind you. He knows what it means: the Spire has declared you both irregular. Outlaws, in all but name.</p><p>${say(`"I'm not sorry,"`)} he says finally. ${say(`"I'd do it again. I'd just like to know what happens next."`)}</p>`
}[F("examResult")]),
choices:[
  {label:"Give him his own crew to lead this spring.", hint:"Fen leads · Timber +4, Stone +4", fx:{timber:4, stone:4, fenCrew:true}, go:"nextweek"},
  {label:"Sit with him and mend stones together until he sleeps.", hint:"Morale +1 · Fen trusts you", fx:{morale:1, n_fenBond:1}, go:"nextweek"}
]},

/* ============================================================
   CHAPTER THREE: THE SPIRE
   opening story → Part One (5 days in the capital, ends in the
   examination) → Part Two (6 weeks of spring) → an arrival
   ============================================================ */
c3open:{ title:"Chapter Three: The Spire", enter(){ if(!F("keystone")) add({keystone:true, craft:2});
  if(S.chapter!==3){ S.snap={built:S.built.slice(), counts:{...S.counts}, pop:S.pop}; S.chapter=3; S.phase="road"; S.day=0; S.week=0; S.lastBuilt=null; S.weekReport=null; }
}, text:()=>`
<p>Spring comes to Brackenfold in a rush of mud and birdsong, and with it a second letter in silver wax.</p>
<p><em>The irregular practitioner known as ${N()} Valcrest will present for examination at the Spire on the first day of the Spring Session. Any further practitioners of the Artifice affinity resident in Brackenfold, including one Fen, son of Tobin, miller, are likewise summoned.</em></p>
<p>Fen reads it over your shoulder and goes white.</p>
${F("fenPromise")?`<p>Tobin is standing in the doorway. He does not say anything. He does not have to. You promised him.</p>`:""}`,
choices:[
  {label:"Bring Fen. You'll stand in front of the Spire together.", hint:"Fen faces the examination with you", fx:{fenCapital:true}, go:"c3road"},
  {label:"Leave Fen at home. Tell the Spire he's too young to travel.", hint:"Fen is hidden · risky", fx:{fenHidden:true}, go:"c3road"},
  {label:`"It's your choice, Fen. Not mine."`, hint:F("n_fenBrave")?"You think you know what he'll say":"Fen decides", fx:{fenCapital:true, n_fenBrave:1, fenChose:true}, go:"c3road"}
]},

c3road:{ title:"Highcrown", text:()=>`
<p>${F("fenChose")?`Fen does not hesitate. ${say(`"I'm coming,"`)} he says. ${say(`"If they want to look at me, they can look me in the eye."`)} `:""}You ride west for nine days${F("fenCapital")?", Fen beside you, practicing on pebbles from the road":""}${F("serenHere")?", with Seren riding ahead":""}. Wren walks with you as far as the last forest. At the edge of it, Wren takes your arm. ${say(`"Whatever they ask you to show them in there,"`)} Wren says, ${say(`"show them less than you can do. Much less."`)} Then Wren simply is not there anymore, in the way Wren has.</p>
<p>Highcrown, the capital, rises out of the river plain like a crown dropped on a table. White walls, golden roofs, the great domed palace on its hill. And above everything, taller than the palace, the Spire: a single needle of black glass and silver, so tall it seems to lean.</p>
<p>The last time you saw this city you were seventeen and being sent away from it. You are nineteen now. You have come back with a town behind you, ${S.pop} people who know your name, and a wall of Elder concrete that no one in Highcrown knows how to build.</p>
<p>Assessor Vane meets you at the gate. ${say(`"Five days until the Spring Session,"`)} he says. ${say(`"Spend them wisely. Everyone who matters in this city has already heard of you, and most of them would like you to fail."`)}</p>
${sys("PART ONE",`Five days in Highcrown<br>Two actions each day · the examination on the fifth day<br>Every ally you make here will matter in the Spire<br>Your crews keep working at home while you're away`)}`,
choices:[{label:"Enter the city.", fx:{}, go:"c3begin"}]},

c3begin:{ title:"Highcrown", enter(){ S.phase="capital"; S.day=1; S.actsLeft=2; }, text:()=>`<p>Vane has found you rooms at an inn near the lower city, where the workshops are, rather than in the Valcrest townhouse on the hill. ${say(`"I thought you'd prefer it,"`)} he says. You do.</p>`,
choices:[{label:"Plan your first day.", go:"plan"}]},

actDone:{ title:()=>val(curActs()[S.lastAct].name), text:()=>curActs()[S.lastAct].text(F("n_"+S.lastAct)),
choices:()=> S.actsLeft>0 ? [{label:"Choose what to do with the rest of the day.", go:"plan"}] : [{label:`Evening falls${S.phase==="capital"?" over Highcrown":S.phase==="below"?" in the city above":S.phase==="kastrel"?" over the mountains":" on the camps"}.`, go:"event"}]},

/* ---------- capital night events ---------- */
reception:{ title:"The Spring Reception", enter(){ add({metNobles:true}); }, text:()=>`
<p>Every great house sends someone to the Crown's spring reception, and tonight, every one of them is looking at you. The ballroom glitters. You are wearing the best coat Tamsin could find, and it is not good enough, and you decide you do not care.</p>
<p>Across the room, Lord Edric Valcrest sees you. He does not come over. He raises his cup, very slightly. That is all.</p>
<p>Two people do come over.</p>
<p>The first is a man of about twenty two in Ardane blue with ink on his fingers and an apologetic smile: <b>Lord Caelan Ardane</b>, heir of House Ardane, a water mage. ${say(`"I've been trying to work up the courage to speak to you all evening,"`)} he admits. ${say(`"My house has records about artificers. Things I think you should see. I also wanted to say I'm sorry, which is a strange way to open a conversation."`)}</p>
<p>The second arrives like weather. <b>Lady Isolde Varrin</b>, the king's niece, a storm mage of twenty three, in grey silk that crackles faintly when she moves. ${say(`"So you're the one who made a dead village profitable,"`)} she says, eyes bright. ${say(`"Do you know how rare that is at this court? Most of these people can't make a garden profitable. Walk with me."`)}</p>`,
choices:[
  {label:"Spend the evening with Caelan in the quiet of the library.", hint:"Closeness with Caelan +1", fx:{aff_caelan:1}, go:"nextday"},
  {label:"Walk the balconies with Isolde.", hint:"Closeness with Isolde +1", fx:{aff_isolde:1}, go:"nextday"},
  {label:"Talk to both, politely, then slip out early.", hint:"Renown +1", fx:{renown:1}, go:"nextday"}
]},

fatherCall:{ title:"The Valcrest Townhouse", text:()=>`
<p>A Valcrest footman finds you at the inn: Lord Edric requests your presence. You go, because you are curious, and because you want him to see you walk in.</p>
<p>Your father receives you in the same small hall where he exiled you. He looks older. ${F("serenHere")||F("serenSpy")?"Seren stands by the window, very still.":""}</p>
<p>${say(`"The assessor's report,"`)} he says, ${say(`"was the most extraordinary document I have ever read. I was wrong about your magic. I am not a man who says that often."`)} He folds his hands. ${say(`"Come home. Brackenfold will become a Valcrest holding under my seal. You will be restored as my heir. The Spire will not dare touch the heir of House Valcrest."`)}</p>
${F("serenHere")||F("serenSpy")?`<p>Seren, by the window, does not move at all. Seren is the heir now. Father has just offered it away without a glance.</p>`:""}`,
choices:[
  {label:`"No. Brackenfold isn't yours to take. It never was."`, hint:"Independence · Resentment +1", fx:{fatherRefused:true, resent:1}, go:"nextday"},
  {label:`"I don't want to be your heir. Seren is. I want your support in the Spire."`, hint:"Father's support at the examination", fx:{fatherSupport:true, resent:-1}, go:"nextday"},
  ...(F("sawRunes")||F("seren_knows")||F("registry")?[{label:`"Tell me about Aurel Valcrest's workshops, Father. And the locked room."`, hint:"Confront him", fx:{fatherConfronted:true}, go:"fatherTruth"}]:[])
]},

fatherTruth:{ title:"The Valcrest Townhouse", text:()=>`
<p>For the first time in your life, your father looks afraid.</p>
<p>${say(`"Every Valcrest heir is told,"`)} he says at last, quietly. ${say(`"On their twentieth birthday. That our founder was an artificer. That the house survived only by burying it. That if Artifice ever wakes in our line again, it must be sent away before the Spire notices."`)}</p>
<p>${say(`"You exiled me to protect the house."`)}</p>
<p>${say(`"I exiled you to protect you,"`)} he says. ${say(`"And it seems I sent you to the one place where you could become exactly what I feared."`)} He meets your eyes. ${say(`"I will stand with you in the Spire. It is two hundred years late. But I will stand."`)}</p>
${sys("LORE","[Fragment Recovered: The Heir's Secret]")}`,
choices:[{label:"Leave without saying goodbye. You need to think.", fx:{fatherSupport:true}, go:"nextday"}]},

haleOffer:{ title:"A Visitor at Midnight", text:()=>`
<p>There is frost on your window when you wake, and Magister Corvan Hale is sitting in the chair by your cold hearth, silver glove resting on his knee.</p>
<p>${say(`"I'll be brief,"`)} he says. ${say(`"The Archmagister intends to make an example of you. I would prefer not to waste you. Join the Spire. Become its first Magister of Artifice. Teach us the Codex, under our supervision. In return, Brackenfold keeps its rights, and the miller's boy is never examined at all."`)}</p>
<p>He stands. ${say(`"You have until the Session to answer."`)}</p>`,
choices:[
  {label:`"No. Get out of my room."`, hint:"Resentment +1", fx:{resent:1, haleRefused:true}, go:"nextday"},
  {label:"Pretend to consider it, and ask why the Spire fears the Codex.", hint:"Learn the Spire's secret", fx:{spireSecret:true}, go:"haleSecret"},
  {label:`"Put Fen's protection in writing, and I'll think about it."`, hint:"A signed promise from Hale", fx:{fenWrit:true}, go:"nextday"}
]},

haleSecret:{ title:"A Visitor at Midnight", text:()=>`
<p>Hale studies you, then decides, apparently, that the truth costs him nothing. ${say(`"The Spire was built two hundred years ago,"`)} he says, ${say(`"on the ruins of the last Elder college in the kingdom. Our foundations are Elder concrete. Our great hall is an Elder dome. Nobody alive knows how to repair either."`)}</p>
<p>${say(`"The Spire is cracking, ${N()}. Slowly. And the only people who could fix it are the ones we spent two centuries correcting."`)}</p>
${sys("LORE","[Fragment Recovered: The Cracked Spire]")}`,
choices:[{label:`"Then you need me more than I need you."`, go:"nextday"}]},

nightBefore:{ title:"The Night Before", text:()=>{
const c=F("aff_caelan")||0, i=F("aff_isolde")||0;
const who = (c>=2||i>=2) ? (c>=i?"caelan":"isolde") : null;
S.flags.nightWith=who;
if(who==="caelan") return `<p>Caelan knocks on your door an hour after dark with two cups of tea and a thick folder of Ardane records under his arm. ${say(`"I'll present these tomorrow,"`)} he says. ${say(`"My father doesn't know. He'll know by noon."`)}</p>
<p>You sit by the window and talk until the tea is cold: about water and stone, about the fountains he used to build in secret as a boy, about what you would build together if anybody let you. At some point his hand ends up next to yours on the sill, and neither of you moves it.</p>`;
if(who==="isolde") return `<p>Isolde arrives without knocking, which you are learning is how Isolde arrives everywhere. She has a bottle of something expensive and the royal statute book under her arm, opened to a page she has marked with lightning-scorched fingertips.</p>
<p>${say(`"Tomorrow I am going to embarrass a great many old men,"`)} she says, ${say(`"on your behalf. I want you to know I'm not doing it for politics."`)} She pauses, and for once she does not have the next line ready. ${say(`"Mostly not for politics."`)}</p>`;
return `<p>You spend the last night alone at the window, looking up at the Spire. ${F("fenCapital")?"Fen is asleep in the next room. You check on him twice.":"You think about Fen at home, and hope you made the right choice."}</p>`;},
choices:()=>{ const w=F("nightWith");
  if(!w) return [{label:"Sleep, if you can.", go:"nextday"}];
  const nm=w==="caelan"?"Caelan":"Isolde";
  return [
    {label:`Kiss ${nm}.`, hint:"Romance begins", fx:{romance:w, ["aff_"+w]:2}, go:"nextday"},
    {label:`"Ask me again after tomorrow."`, hint:"Something to come back to", fx:{romanceLater:w, ["aff_"+w]:1}, go:"nextday"},
    {label:`"I'm glad you're my friend, ${nm}."`, hint:"Friendship", fx:{friend:w}, go:"nextday"}
  ];}},

/* ---------- the examination ---------- */
exam1:{ title:"The Hall of the Spire", enter(){ S.phase="exam"; }, text:()=>`
<p>The great hall of the Spire is a dome. You see it the moment you step inside: Elder work, coffered concrete, an open eye at the crown. And a crack, fine as a hair, running from that eye halfway down the curve.</p>
<p>Two hundred magisters sit in tiered rings around the floor. The gallery above is packed: nobles, guild masters, ${F("n_lower")?"and, to your surprise, a crowd of craftsmen from the lower city, ":""}${F("fatherSupport")?"your father, ":""}${F("serenHere")||F("serenSpy")?"Seren, ":""}${F("aff_caelan")>=2?"Caelan, ":""}${F("aff_isolde")>=2?"Isolde, ":""}and a great many people you do not know.</p>
<p>Archmagister Selwyn Morrow, old and blind and very gentle, raises one hand. Silence. ${say(`"The practitioner will demonstrate their affinity,"`)} he says, and two attendants set a block of white marble on the floor in front of you.</p>`,
choices:()=>[
  {label:"Mend a hairline crack in it, nothing more.", hint:"Seem harmless", fx:{exam3:"mend"}, go:"exam2"},
  ...(F("reshape")?[{label:"Reshape it into a perfect arch, keystone and all.", hint:"Show your strength", fx:{exam3:"arch"}, go:"exam2"}]:[]),
  ...(knows("dome")?[{label:"Raise it into a miniature dome, and point to the crack above your heads.", hint:"Codex: The Dome", fx:{exam3:"dome"}, go:"exam2"}]:[]),
  ...(F("charterClause")?[{label:"Refuse. Under the Charter Clause, you answer to crown law, not the Spire.", hint:"From the archive", fx:{exam3:"law"}, go:"exam2"}]:[])
]},

exam2:{ title:"The Apprentice", text:()=>{
const d={mend:`The marble's crack closes. A murmur of polite contempt runs around the rings. A clever trick, it says. Nothing more.`,
         arch:`The marble flows like clay and sets into a perfect arch. On the stand beside you, the Spire's measuring ring, a hoop of crystal meant to read the strength of an affinity, cracks clean in half. The rings go dead silent. Someone in the gallery starts to clap and is hushed.`,
         dome:`The marble rises into a perfect miniature dome, and the Spire's measuring ring of crystal on the stand beside you shatters into dust. You point up. Two hundred heads turn toward the crack in the Spire's own ceiling, and you hear the moment they understand.`,
         law:`You read the Charter Clause aloud. The Archmagister's face does not change, but three senior magisters lean over to whisper urgently to one another.`}[F("exam3")];
return `<p>${d}</p>
${F("fenCapital")?`<p>${say(`"The second practitioner,"`)} Morrow says. ${say(`"Fen, son of Tobin."`)}</p><p>Fen walks out onto the floor alone. His hands are shaking. He looks at you once.</p>`
:`<p>${say(`"And the second practitioner?"`)} Morrow asks mildly. ${say(`"The miller's son. We know he exists, ${N()}. Our couriers have seen his work on your bridges."`)}</p>`}`;},
choices:()=>F("fenCapital") ? [
  {label:"Nod to him. Let him stand on his own.", hint:(F("n_fenSkill")||0)+(F("n_fenPrep")||0)>=2?"He's ready":"Is he ready?", fx:{fenStood:true}, go:"exam3"},
  {label:"Walk out and stand beside him.", hint:"Together", fx:{fenBeside:true}, go:"exam3"}
] : [
  {label:`"He's a child. You'll have to go through me."`, hint:F("fenPromise")?"You promised Tobin":"A promise", fx:{fenDefended:true}, go:"exam3"},
  {label:`"He's not here. And you'll never find him."`, hint:"Resentment +1", fx:{resent:1}, go:"exam3"}
]},

exam3:{ title:"Correction", text:()=>{
const fenSkill=(F("n_fenSkill")||0)+(F("n_fenPrep")||0)+(F("fenListening")?1:0)+(F("fenReshape")?1:0);
let fenText="";
if(F("fenStood")) fenText = fenSkill>=2
  ? `<p>Fen puts his palm on the marble and closes his eyes. Listens. Then he shapes it, slowly, with the grain's patience, into a small mill wheel inside a mason's square. His mark. It is not perfect. It is <em>his</em>. The gallery erupts.</p>`
  : `<p>Fen puts his palm on the marble and pushes too hard, too fast. It cracks. He steps back, white-faced, as murmurs ripple around the rings.</p>`;
if(F("fenBeside")) fenText=`<p>You stand beside Fen with your hand on his shoulder while he works. The marble softens under his palm and takes the shape of his mark. Not perfect. Together, it does not need to be.</p>`;
return `${fenText}
<p>Then Magister Hale rises from the first ring and lifts something that glitters: a slender collar of silver, cold mist pouring off it. ${say(`"In accordance with the Statute of Stable Practice,"`)} he says, ${say(`"the Spire finds these practitioners irregular, and recommends correction."`)}</p>
<p>The hall goes silent. Then, one by one, people start to stand.</p>
${[F("fatherSupport")?`<p>Lord Edric Valcrest stands in the gallery. ${say(`"House Valcrest objects,"`)} he says, and his voice fills the dome.</p>`:"",
   F("aff_caelan")>=2?`<p>Caelan Ardane comes down the gallery stairs with his folder. ${say(`"House Ardane has records of eleven artificers who went to correction. None returned. I would like them read into the session."`)}</p>`:"",
   F("aff_isolde")>=2?`<p>Isolde Varrin does not stand. She simply speaks, and lightning crackles along the gallery rail. ${say(`"Brackenfold holds a royal assessment. Its practitioners fall under crown law. My uncle will be very interested to learn the Spire has forgotten that."`)}</p>`:"",
   F("treasury")?`<p>Assessor Vane rises with a ledger. ${say(`"Brackenfold's taxes this year exceed those of four noble houses combined. The treasury asks the Spire not to correct its best investment."`)}</p>`:"",
   F("n_lower")>=2?`<p>Up in the back of the gallery, forty craftsmen from the lower city stand all at once, and do not sit back down.</p>`:"",
   (F("serenHere")||F("serenSpy"))?`<p>Seren stands, and the air around Seren shimmers with heat.</p>`:""].join("")}`;},
choices:()=>[
  {label:"Look at Archmagister Morrow and wait. Let them see who stands with you.", hint:"Rely on your allies", fx:{examMove:"allies"}, go:"examEnd"},
  ...(F("reshape")?[{label:"Raise the floor of the hall into a wall between Fen and the collar.", hint:"Defiance · Resentment +1", fx:{examMove:"wall", resent:1}, go:"examEnd"}]:[]),
  {label:"Step forward and offer your own neck. Not Fen's.", hint:"Sacrifice", fx:{examMove:"sacrifice"}, go:"examEnd"}
]},

examEnd:{ title:"The Verdict", enter(){
  let sc=0;
  sc += F("charterClause")?2:0; sc += F("treasury")?1:0; sc += (F("n_lower")||0)>=2?1:0;
  sc += F("aff_caelan")>=2?2:0; sc += F("aff_isolde")>=2?2:0; sc += (F("serenHere")||F("serenSpy"))?1:0;
  sc += F("fatherSupport")?2:0; sc += F("spireSecret")?1:0; sc += F("fenWrit")?1:0;
  sc += tier().lvl>=3?2:tier().lvl>=2?1:0;
  sc += ({mend:0, arch:1, dome:3, law:2})[F("exam3")];
  const fenSkill=(F("n_fenSkill")||0)+(F("n_fenPrep")||0)+(F("fenListening")?1:0)+(F("fenReshape")?1:0);
  if(F("fenStood")) sc += fenSkill>=2?2:-1;
  if(F("fenBeside")) sc += 1;
  sc += ({allies:1, wall:0, sacrifice:2})[F("examMove")];
  S.flags.examScore=sc;
  S.flags.examResult = sc>=11 ? "recognized" : sc>=6 ? "probation" : "flight";
  add(F("examResult")==="recognized"?{renown:4, morale:2}:F("examResult")==="probation"?{renown:2}:{resent:2, renown:1});
}, text:()=>({
recognized:`<p>Archmagister Morrow listens to the silence for a long time. Then he turns his blind face upward, toward the crack in his own dome, as if he can feel it.</p>
  <p>${say(`"The Spire finds,"`)} he says slowly, ${say(`"that the Artifice affinity is a lawful school of magic, and has been for a thousand years. We find that we have been... mistaken. For some time."`)} He lowers his head. ${say(`"Practitioner ${N()}, the Spire asks for your help."`)}</p>
  <p>Hale lowers the collar. The gallery roars.</p>
  ${sys("VERDICT","[ARTIFICE RECOGNIZED]<br>A lawful school of magic · Brackenfold may train artificers openly")}`,
probation:`<p>The Archmagister confers with the first ring for a long time. ${say(`"The Spire defers correction,"`)} he says at last. ${say(`"The practitioners are placed on probation. Their practice will be supervised and logged. We will revisit the matter at the next session."`)}</p>
  <p>It is not a victory. But Hale lowers the collar, and you walk out of the Spire with Fen beside you.</p>
  ${sys("VERDICT","[PROBATION]<br>Supervised practice · the Spire will be watching")}`,
flight:`<p>Morrow says one word: ${say(`"Proceed."`)} The attendants move toward Fen.</p>
  <p>You put your hand on the floor, and the floor of the Spire answers you. The Elder concrete beneath two hundred years of Spire marble remembers what it was made for. A wall of grey stone erupts between Fen and the collar, then another, and then you are both running for the doors while the gallery breaks into chaos.</p>
  <p>You are out of Highcrown by midnight. By morning, the Spire has declared you both irregular, and no house in the city will say your name aloud.</p>
  ${sys("VERDICT","[DECLARED IRREGULAR]<br>The Spire considers you outlaws · Brackenfold stands alone")}`
}[F("examResult")]) + `<p><em>End of Part One: The Spire.</em></p>`,
choices:[{label:"Ride home. Begin Part Two: Spring", go:"springStart"}]},

/* ---------- Chapter Three, Part Two: spring at home ---------- */
springStart:{ title:"Spring", enter(){ S.phase="spring"; S.week=1; S.buildsLeft=perWeek(); S.weekReport=null; S.newPage=null; }, text:()=>`
<p>Brackenfold sees you coming from ten miles away, thanks to the beacon, and by the time you reach the gate the whole town is on the wall.</p>
<p>${({recognized:`Word got here before you. Someone has painted ARTIFICE IS LAWFUL in enormous letters across the front of the hall, and Bren, to your astonishment, is the one holding the brush.`,
     probation:`Word got here before you. People are relieved and angry and proud all at once, and Granny Pell has already written a very rude letter to the Spire on everyone's behalf.`,
     flight:`Word got here before you. Nobody asks you to explain. Oda has doubled the watch, Garth has started stockpiling timber, and Bren simply says: ${say(`"Well. Then we build faster."`)}`})[F("examResult")]}</p>
${sys("PART TWO",`Spring · 6 weeks · ${perWeek()} projects a week<br>Artificers from across the kingdom are coming<br>Goal: make Brackenfold a Chartered City`)}`,
choices:[{label:"Plan the first week of spring.", go:"plan"}]},

loveLetter:{ title:"A Letter", text:()=>{
const r=F("romance")||F("romanceLater")||((F("aff_caelan")||0)>(F("aff_isolde")||0)?"caelan":(F("aff_isolde")||0)>0?"isolde":null);
S.flags.loveFocus=r;
if(r==="caelan") return `<p>The letter is written in a careful, slanting hand, with a small water-stain at the bottom that might be a tear or might be tea.</p>
  <p>${say(`"My father has not spoken to me since the Session. I find I don't mind as much as I thought I would. I have been reading everything House Ardane ever burned and failed to burn completely. I would very much like to see your town. Would you have me, in a few weeks? C."`)}</p>`;
if(r==="isolde") return `<p>The letter is three lines in a sharp, slanting hand, and the paper smells faintly of rain.</p>
  <p>${say(`"Court is unbearable without you to scandalize it. My uncle wants a full report on Brackenfold. I have volunteered to write it personally, on site. Prepare a room. Prepare a better coat. I."`)}</p>`;
return `<p>The letter is from Seren. ${say(`"The capital hasn't stopped talking about you. Father is different since the Session. Quieter. He asks about Brackenfold at dinner. I think he wants to come and see it."`)}</p>`;},
choices:()=>{ const r=F("loveFocus");
  if(!r) return [{label:"Write back to Seren.", hint:"Resentment −1", fx:{resent:-1}, go:"nextweek"},{label:"Invite Father to come and see Brackenfold.", hint:"Resentment −1 · he will remember", fx:{resent:-1, invitedFather:true}, go:"nextweek"}];
  const nm=r==="caelan"?"Caelan":"Isolde";
  return [
    {label:`Write back: come as soon as you can.`, hint:`Closeness with ${nm} +1`, fx:{["aff_"+r]:1, loveInvited:true}, go:"nextweek"},
    {label:`Write back, and spend three drafts on the last line.`, hint:`Closeness with ${nm} +2`, fx:{["aff_"+r]:2, loveInvited:true}, go:"nextweek"},
    {label:"Write back warmly, as a friend.", hint:"Friendship", fx:{friend:r, loveInvited:true}, go:"nextweek"}
  ];}},

petitioners:{ title:"The Petitioners", text:()=>`
<p>They start arriving in the third week of spring: on foot, on wagons, alone and in families. A blacksmith's daughter from the south who can feel the grain in iron. Two brothers from the coast who mend nets with their hands. An old man who has been hiding his spark for sixty years.</p>
<p>${F("examResult")==="flight"?"They come knowing the Spire calls you an outlaw. They come anyway.":"They come because, for the first time in their lives, there is somewhere to go."} By the end of the week there are thirty of them in the square, and more on the road.</p>`,
choices:[
  {label:"Take them all in. Brackenfold is for artificers now.", hint:"Population +16, Craft +1 · Needs housing", fx:{craft:1, petitionAll:true}, go:"nextweek"},
  {label:"Take the families, and send the rest with letters to Hollin Cross.", hint:"Population +8, Renown +1", fx:{renown:1, petitionSome:true}, go:"nextweek"},
  ...(F("marisol")?[{label:"Put Marisol in charge of them.", hint:"Population +12, Craft +2", fx:{craft:2, petitionMarisol:true}, go:"nextweek"}]:[])
]},

fenOffer:{ title:"Fen's Offer", text:()=>`
<p>A courier in ${F("examResult")==="recognized"?"Spire grey":"royal blue"} brings a letter, and this time it is addressed to Fen.</p>
<p>${F("examResult")==="recognized"
 ? `The Spire, newly humbled, is founding a school of Artifice in Highcrown. Archmagister Morrow invites Fen to be its first student: rooms in the Spire, the archives, every book the Spire ever confiscated.`
 : `${F("loveFocus")==="isolde"?"Isolde":"The royal household"} has arranged a place for Fen at the King's College in Highcrown, under crown protection, beyond the Spire's reach. Libraries, tutors, a future.`}</p>
<p>Fen reads it three times. Then he comes to find you. ${say(`"I don't know what to do,"`)} he says. ${say(`"I don't want to leave. I don't want to say no either. What would you do?"`)}</p>`,
choices:[
  {label:`"Go. Learn everything. Then come home and teach it."`, hint:"Fen leaves for a season · returns stronger in Book Two", fx:{fenLeaves:true, n_fenBond:1}, go:"nextweek"},
  {label:`"Stay. Brackenfold needs its journeyman."`, hint:"Fen stays · Fen leads a crew", fx:{fenStays:true, timber:3, stone:3}, go:"nextweek"},
  {label:`"I'm not going to answer that for you. You know what you want."`, hint:"Fen decides", fx:{fenDecides:true}, go:"fenDecides"}
]},

fenDecides:{ title:"Fen's Offer", text:()=>((F("n_fenBrave")||0)+(F("n_fenBond")||0))>=3
? `<p>Fen thinks about it for a full day. Then he writes a reply in his careful hand, and asks you to read it before he sends it. It says yes, but not until autumn. ${say(`"I want to finish the bridge first,"`)} he says. ${say(`"My mark's going in the keystone."`)}</p>`
: `<p>Fen thinks about it for a full day. Then he burns the letter, very carefully, in the kiln. ${say(`"Maybe later,"`)} he says. ${say(`"When I know who I am without you standing next to me."`)}</p>`,
choices:[{label:"Tell him you're proud of him.", fx:{morale:1}, go:"nextweek"}]},

loveVisit:{ title:()=>F("loveFocus")==="caelan"?"Caelan in Brackenfold":F("loveFocus")==="isolde"?"Isolde in Brackenfold":"A Quiet Week", text:()=>{
const r=F("loveFocus");
if(r==="caelan") return `<p>Caelan arrives on a hired horse with three trunks of books and almost no clothes. He spends his first day walking the town with his mouth slightly open, touching every wall.</p>
<p>On the second day he finds the cistern${has("baths")?" and the bathhouse":""} and asks, very shyly, whether he can try something. That evening there is a fountain in the square: a jet of water rising from a stone basin you shape for him, falling back in a perfect arc, catching the sunset. The children dance in it until dark.</p>
<p>Afterward, sitting on the edge of the basin with your feet in the water, he says: ${say(`"I've never made anything that stayed before. Water doesn't stay. Your stone does."`)}</p>`;
if(r==="isolde") return `<p>Isolde arrives in a royal carriage with two guards, a secretary, and a storm she claims she did not bring on purpose. She inspects Brackenfold as if she is buying it, asks the price of everything, and corners Bren for an hour about tax law. Bren comes out looking dazed and delighted.</p>
<p>On the last night she climbs the watchtower with you and watches the lightning she called walk across the hills. ${say(`"In Highcrown, everyone wants something from me,"`)} she says. ${say(`"Here, nobody even knew who I was until yesterday. Granny Pell told me my hems were uneven."`)} She laughs, and for once it is not a court laugh at all.</p>`;
return `<p>A quiet week. Seren writes again. Fen finishes his first arch alone. Bren takes a whole afternoon off for the first time in anyone's memory.</p>`;},
choices:()=>{ const r=F("loveFocus"); if(!r) return [{label:"Enjoy it.", fx:{morale:1}, go:"nextweek"}];
  const nm=r==="caelan"?"Caelan":"Isolde";
  return [
    {label:`Ask ${nm} to stay.`, hint:"Romance deepens · they will return in Book Two", fx:{romance:r, ["aff_"+r]:2, loveStays:true}, go:"nextweek"},
    {label:`Kiss ${nm}, and tell them to come back soon.`, hint:"Romance", fx:{romance:r, ["aff_"+r]:1}, go:"nextweek"},
    {label:`Tell ${nm} you need to focus on Brackenfold for now.`, hint:"Friendship · Morale +1", fx:{friend:r, morale:1}, go:"nextweek"}
  ];}},

fatherRoad:{ title:"A Rider in Red", text:()=>`
<p>Oda calls you up to the tower in the last week of spring. A single rider is coming up the Elder road in Valcrest red, no escort, no banner.</p>
<p>${say(`"Is that who I think it is?"`)} Bren asks.</p>
<p>It is.</p>`,
choices:[
  {label:"Meet him at the gate yourself, alone.", hint:"Resentment −1", fx:{resent:-1}, go:"nextweek"},
  {label:"Let Bren greet him. Make him wait for you in the hall.", hint:"Resentment +1, Renown +1", fx:{resent:1, renown:1}, go:"nextweek"},
  {label:"Have the whole town line the road. Let him see who they are.", hint:"Morale +1", fx:{morale:1, townLined:true}, go:"nextweek"}
]},

fatherArrives:{ title:"Lord Edric Valcrest", text:()=>`
<div class="compare">
  <figure>${mapSVG({then:"autumn"})}<figcaption>Before the winter</figcaption></figure>
  <figure>${mapSVG()}<figcaption>Brackenfold this spring</figcaption></figure>
</div>
<p>Your father walks through Brackenfold for a whole day. He does not speak much. He stops at the ${has("concrete")?"Elder wall and runs his palm along it":"wall"}, at the ${has("school")?"school, where the children stare at the stranger in red":"hall"}, ${has("domeHall")?"and under the Elder dome, where he stands in the circle of light from the eye for so long that Bren eventually brings him a chair":"and in the square, watching the market"}.</p>
<p>That evening, in the hall, he sets a long bundle wrapped in red cloth on the table and unwraps it. The two halves of the Ember Blade.</p>
<p>${say(`"It has been broken since the day you awakened,"`)} he says. ${say(`"I could not bring myself to have it reforged. It seemed right that it should stay broken until... well. Until I understood."`)} He pushes the halves across the table toward you. ${say(`"Aurel made it. You're the only one alive who can mend it."`)}</p>`,
choices:[
  {label:"Mend the Ember Blade, and give it to Seren, the heir of House Valcrest.", hint:"Resentment −2 · House Valcrest heals", fx:{resent:-2, blade:"seren"}, go:"fatherEnd"},
  {label:"Mend the Ember Blade, and hang it in the hall of Brackenfold.", hint:"Renown +2 · The blade belongs to the builders now", fx:{renown:2, blade:"brackenfold"}, go:"fatherEnd"},
  {label:"Leave it broken. Some things should be remembered as they were.", hint:"Resentment +1", fx:{resent:1, blade:"broken"}, go:"fatherEnd"}
]},

fatherEnd:{ title:"The Ember Blade", text:()=>({
seren:`<p>You lay your hands on the two halves, and they remember each other. The steel flows together along the old break and seals without a seam. On the tang, beneath the wrap, the letters are still there: <em>Forged by the hand of Aurel Valcrest, Artificer.</em> This time you leave them uncovered.</p>
  <p>When Seren receives it at midsummer, there is a letter with it in your hand. Your father reads it first, and keeps it.</p>`,
brackenfold:`<p>You mend the blade, and it hangs above the hall door of Brackenfold, the letters on the tang turned outward where everyone can read them: <em>Forged by the hand of Aurel Valcrest, Artificer.</em></p>
  <p>Your father looks at it for a long time. ${say(`"Yes,"`)} he says finally. ${say(`"That is where it belongs."`)}</p>`,
broken:`<p>You wrap the two halves back in the red cloth and hand them back. Your father nods slowly, as if he expected nothing else. ${say(`"Perhaps one day,"`)} he says.</p>
  <p>He leaves the next morning. At the gate, he turns in the saddle and looks back at the town for a long moment before he rides away.</p>`
}[F("blade")]) + `
<p>That night, Bren brings you a letter that came with your father's saddlebags, unopened. It is from the royal court, sealed in gold. A border war is brewing in the east. The neighboring kingdom of Kastrel has crossed the river at three places, and Brackenfold, the strongest walls on the eastern frontier, is directly in its path.</p>
<p><em>End of Chapter Three.</em></p>`,
choices:[{label:"See your chapter results", go:"summary3"}]},

summary3:{ title:"Chapter Three Complete", text:()=>{
const r=F("romance"), rf=F("friend");
const love = r ? `${r==="caelan"?"Caelan Ardane":"Isolde Varrin"} · romance${F("loveStays")?" · staying in Brackenfold":""}` : rf ? `${rf==="caelan"?"Caelan Ardane":"Isolde Varrin"} · close friend` : "No one yet";
const fen = F("fenLeaves")?"Studying in Highcrown, returning in Book Two":F("fenStays")?"Journeyman of Brackenfold":"Choosing his own path";
return `
${mapSVG()}
${regionSVG()}
${sys("CHAPTER RESULT",`Verdict: ${({recognized:"Artifice recognized",probation:"Probation",flight:"Declared irregular"})[F("examResult")]}<br>Rank: ${tier().name} · Population ${S.pop} · Works ${works()}<br>Heart: ${love}<br>Fen: ${fen}<br>Ember Blade: ${({seren:"Mended, given to Seren",brackenfold:"Mended, hangs in Brackenfold",broken:"Still broken"})[F("blade")]}<br>Craft rank: ${rank()} · Resentment ${S.stats.resent}`)}
<div class="ad">Ad slot (interstitial between chapters)<br>AdMob placement goes here in the Android build</div>
<p>Next, Chapter Four: <em>The Border</em>. Kastrel's armies are crossing the eastern river, and the strongest walls on the frontier are yours.</p>`},
choices:[{label:"Continue to Chapter Four", go:"c4open"},{label:"Start the whole story over", restart:true}]},

/* ============================================================
   CHAPTER FOUR: THE BORDER
   ============================================================ */
c4open:{ title:"Chapter Four: The Border", enter(){
  if(S.chapter!==4){ S.snap={built:S.built.slice(), counts:{...S.counts}, pop:S.pop}; S.chapter=4; S.phase="open"; S.day=0; S.week=0; S.lastBuilt=null; S.weekReport=null; }
}, text:()=>`
<p>The gold-sealed letter is from King Aldric Varrin himself. Kastrel's army, under General Vasha Orrel, crossed the eastern river at three fords nine days ago. Hollin Cross is emptying. The road west is clogged with carts.</p>
<p><em>By royal order, the town of Brackenfold is named the anchor fortress of the eastern frontier, and is to hold the Elder road until relieved.</em></p>
<p>By noon the first refugees are on the Elder road: farmers with handcarts, a family pulling a cow, a priest carrying an altar cloth folded like a flag. Bren stands at the gate counting them, and stops counting at two hundred.</p>
<p>${say(`"Oda's scouts think six days,"`)} he says. ${say(`"Maybe less. They have siege towers."`)}</p>
${sys("CHAPTER FOUR","The Border<br>Part One: Six Days to the River · build and prepare<br>Part Two: The Summer of Ash · 6 weeks")}`,
choices:[
  {label:"Accept the king's order. Brackenfold holds the frontier.", hint:"Royal standing · Defense +2, Renown +1", fx:{royalOrder:true, defense:2, renown:1}, go:"c4dream"},
  {label:`"Brackenfold will defend its own people. Not the crown's border."`, hint:"Independence · Morale +1, Resentment +1", fx:{independent:true, morale:1, resent:1}, go:"c4dream"},
  {label:"Write back that the crown will pay for its anchor fortress.", hint:"Coin +6", fx:{royalPaid:true, coin:6}, go:"c4dream"}
]},

c4dream:{ title:"Aurel at War", enter(){ givePage("starfort"); }, text:()=>`
<p>That night Aurel is waiting on a battlefield. The grass is black. Elder walls stand in the distance, not round like yours but sharp, star-shaped, every face covered by the fire of another.</p>
<p>${say(`"Round towers stop rams,"`)} he says. ${say(`"Angles stop armies. No wall facing the enemy is ever left alone."`)}</p>
${sys("ELDER CODEX","[Page Restored: THE STAR FORT]<br>Elder name: Munimentum Stellatum")}
<p>Then he holds up another page, and it is not a page at all. It is a sheet of iron, riveted shut. ${say(`"I built war engines once, for a king who asked nicely. They worked very well. I sealed this page because of what he did with them afterward."`)} He looks at you. ${say(`"You may need it. I hope you don't."`)}</p>`,
choices:[{label:"Wake. There is too much to do.", go:"c4help"}]},

c4help:{ title:"Who Comes", enter(){ S.phase="war"; S.day=1; S.buildsLeft=perDay(); }, text:()=>{
const li=LIk();
return `<p>They come over the next two days, the people who matter.</p>
${serenAlly()?`<p>Seren rides in with twelve Valcrest household guards and no permission from anyone. ${say(`"Father sent his blessing,"`)} Seren says. ${say(`"I didn't wait for it."`)}</p>`:""}
${li&&(F("romance")||F("aff_"+li)>=3)?`<p>${LIn()} arrives on the second evening, dusty and exhausted, ${li==="caelan"?"with a wagon of Ardane river charts":"with a royal pass and a very bad temper about the state of the roads"}. ${say(`"You didn't think I'd let you do this alone,"`)} ${LIp("sub")} says.</p>`:""}
${F("fenLeaves")?`<p>A letter from Fen in Highcrown: he is trying to leave the college, and they will not let him travel through a war zone. ${say(`"Hold the wall,"`)} he writes. ${say(`"I'll be home before you know it."`)}</p>`:F("fen")?`<p>Fen has already moved his tools into the gatehouse.</p>`:""}
${F("marisol")?`<p>Marisol sits in the hall drawing angled bastions on the table in chalk, muttering about Ardane fortification.</p>`:""}
<p>Six days. ${S.buildsLeft} project${S.buildsLeft===1?"":"s"} a day. Every one of them counts now.</p>`;},
choices:[{label:"Look at the walls and choose what to build first.", go:"plan"}]},

w4council:{ title:"The War Council", text:()=>`
<p>The hall is full: Bren, Oda, Garth, the masons, the guild masters${serenAlly()?", Seren":""}${LIk()&&F("romance")?", "+LIn():""}. Everyone has an opinion and nobody is shouting, which Bren later says is how he knew the town had grown up.</p>
<p>Oda lays it out. Three thousand soldiers. Four siege towers. A siege train of rams and ladders. Brackenfold has ${S.stats.defense} points of defense, by your own count, and walls Kastrel's engineers have never seen.</p>`,
choices:[
  {label:"Everything into the walls. Let them break themselves.", hint:"Defense +2", fx:{defense:2}, go:"nextday"},
  {label:"Send Oda's hunters out to harry the road and slow them down.", hint:"The siege starts weaker", fx:{harry:true}, go:"nextday"},
  {label:"Bring the outer farms inside the walls, grain and all.", hint:"Food +4, Morale +1", fx:{food:4, morale:1, evac:true}, go:"nextday"}
]},

w4hollin:{ title:"Smoke Over Hollin Cross", text:()=>`
<p>The sky to the north goes brown at noon. Kastrel's outriders have reached Hollin Cross, the garrison town that sent nobody when the briar hounds came, and they are burning it.</p>
<p>By dusk, its survivors are at your gate. Hundreds of them. Some of the town's soldiers among them, without their officers.</p>`,
choices:[
  {label:"Open the gate. Take every one of them in.", hint:"Population +30 · Morale +1 · Food −3", fx:{n_popAdd:30, morale:1, food:-3}, go:"nextday"},
  {label:"Take in the soldiers and put them on the wall.", hint:"Defense +3, Population +10", fx:{defense:3, n_popAdd:10}, go:"nextday"},
  ...(serenAlly()?[{label:"Ride out with Seren and hit the raiders before they reach the road.", hint:"Renown +2 · The enemy loses its outriders", fx:{renown:2, sortie:true}, go:"nextday"}]:[])
]},

w4torsion:{ title:"The Iron Page", text:()=>`
<p>You dream of the riveted page again. This time it is lying on your workbench, and the rivets are loose.</p>
<p>The Torsion Engine. Twisted sinew and oak, a bolt the length of a man, thrown far enough to break a siege tower at five hundred paces. Aurel's handwriting on the cover: <em>For defense. Only ever for defense. I said that too.</em></p>`,
choices:[
  {label:"Open the page. Your people come first.", hint:"Codex: The Torsion Engine · unlocks ballista towers", fx:{torsionOpen:true}, go:"w4torsion2"},
  {label:"Leave it sealed. Brackenfold will hold without war engines.", hint:"Resentment −1 · Aurel's trust", fx:{resent:-1, keptSealed:true}, go:"nextday"}
]},

w4torsion2:{ title:"The Iron Page", enter(){ givePage("torsion"); }, text:()=>`
<p>The rivets come away under your thumb like warm wax. The page opens, and the engine unfolds in your mind, every part of it, terribly simple.</p>
${sys("ELDER CODEX","[Sealed Page Opened: THE TORSION ENGINE]<br>Elder name: Ballista")}
<p>You wake with your hands cold. Somewhere in the dream, Aurel had turned away.</p>`,
choices:[{label:"Get to work.", go:"nextday"}]},

w4deserter:{ title:"The Deserter", text:()=>`
<p>Oda's hunters bring in a Kastrel soldier they found hiding in a ditch: a thin boy named Ruslan, barely older than Fen, with a sapper's tools on his belt and a story he cannot tell fast enough.</p>
<p>${say(`"They'll come at the walls first, but that's not the real attack,"`)} he says. ${say(`"General Orrel always sends the main force by water at night. The river. Under your bridge."`)}</p>`,
choices:[
  {label:"Believe him, and plan for the river.", hint:"Ready for the night attack", fx:{knowsRiver:true}, go:"nextday"},
  {label:"Lock him up. It could be a trap.", hint:"Caution", fx:{}, go:"nextday"},
  {label:"Believe him, and give him a job in the quarry.", hint:"Ready for the river · Ruslan stays", fx:{knowsRiver:true, ruslan:true}, go:"nextday"}
]},

w4letter:{ title:()=>LIk()?`${LIn()}, on the Wall`:"Tamsin's Wagons", text:()=>{
const li=LIk();
if(li&&(F("romance")||F("aff_"+li)>=3)) return `<p>You find ${LIn()} on the wall after midnight, looking east at the fires of Kastrel's camp.</p>
<p>${say(`"I could ${li==="caelan"?"turn the river against them":"bring a storm down on that camp"},"`)} ${LIp("sub")} says quietly. ${say(`"I've never used my magic to hurt anyone. I don't know if I can."`)}</p>`;
return `<p>Tamsin arrives through the last gap before the enemy reaches the road, with four wagons of salt, arrows, and lamp oil. ${say(`"On credit,"`)} she says. ${say(`"Don't die. It would be very bad for my books."`)}</p>`;},
choices:()=>{ const li=LIk();
  if(li&&(F("romance")||F("aff_"+li)>=3)) return [
    {label:`"Stand beside me tomorrow. Only if you choose to."`, hint:`${LIn()} fights at the siege`, fx:{liAtSiege:true, ["aff_"+li]:1}, go:"nextday"},
    {label:`"Go back to Highcrown. I need you safe."`, hint:`${LIn()} leaves · Closeness +1`, fx:{["aff_"+li]:1}, go:"nextday"}
  ];
  return [{label:"Thank her and stack the arrows on the wall.", hint:"Defense +1, Coin −2", fx:{defense:1, coin:-2}, go:"nextday"}];
}},

w4eve:{ title:"The Night Before the River", text:()=>`
<p>The Kastrel camp fills the valley below the hills: a thousand fires, the dark shapes of the siege towers, drums that start at sunset and do not stop.</p>
${mapSVG()}
<p>Everyone in Brackenfold who can hold a spear is on the wall or behind it. Everyone who cannot is in the hall${has("domeHall")?", under the Elder dome":""}. You have one hour before you should sleep.</p>`,
choices:()=>[
  {label:"Walk the wall with Bren, one more time.", hint:"Morale +1", fx:{morale:1}, go:"s4a"},
  ...(F("fen")&&!F("fenLeaves")?[{label:"Find Fen in the gatehouse.", hint:"Fen steadies", fx:{n_fenBrave:1}, go:"s4a"}]:[]),
  ...(serenAlly()?[{label:"Share a drink with Seren.", hint:"Seren fights harder", fx:{serenFierce:true}, go:"s4a"}]:[]),
  ...(F("liAtSiege")?[{label:`Spend the hour with ${LIn()}.`, hint:"Closeness +1", fx:{["aff_"+LIk()]:1}, go:"s4a"}]:[])
]},

s4a:{ title:"The First Assault", enter(){ S.phase="siege4"; }, text:()=>`
<p>They come at dawn, exactly as Ruslan said they would, with ladders and shields and a roar that shakes the dust off the roofs.</p>
<p>${F("harry")?"Oda's hunters have bled them on the road for four days. The lines are thinner than they should be.":""} ${F("sortie")?"Without their outriders, the flanks are blind.":""}</p>
<p>The first ladders hit the wall.</p>`,
choices:()=>[
  {label:"Hold the gate.", hint:has("barbican")?"Your barbican will hold":has("gate")?"The gatehouse is strong":"The gate is weak", fx:{n_s4: has("barbican")?3:has("gate")?2:0}, go:"s4b"},
  {label:"Run the wall with the watch.", hint:has("barracks")?"Oda's barracks-trained watch":"The watch is thin", fx:{n_s4: has("barracks")?2:1}, go:"s4b"},
  ...(F("reshape")?[{label:"Let them reach the ditch, then Reshape it deeper beneath them.", hint:"Reshape", fx:{n_s4:3}, go:"s4b"}]:[]),
  ...(serenAlly()?[{label:"Have Seren burn the ladders.", hint:F("serenFierce")?"Seren is ready":"Seren's fire", fx:{n_s4:F("serenFierce")?3:2}, go:"s4b"}]:[])
]},

s4b:{ title:"The Siege Towers", text:()=>`
<p>By noon the walls are still standing and Kastrel is out of ladders. Then the four siege towers start to roll, each three stories tall and sheathed in wet hides, pushed by a hundred men apiece.</p>`,
choices:()=>[
  ...(has("ballistae")?[{label:"Load the ballista towers.", hint:"The Torsion Engine", fx:{n_s4:4, usedEngines:true}, go:"s4c"}]:[]),
  ...(has("bastions")?[{label:"Catch them in the crossfire of the star bastions.", hint:"The Star Fort", fx:{n_s4:3}, go:"s4c"}]:[]),
  ...(F("reshape")?[{label:"Soften the ground under the towers and tip them over.", hint:"Reshape", fx:{n_s4:3}, go:"s4c"}]:[]),
  ...(has("casemates")?[{label:"Fire from the casemates at the men pushing them.", hint:"Concrete casemates", fx:{n_s4:2}, go:"s4c"}]:[]),
  ...(F("liAtSiege")?[{label:LIk()==="caelan"?"Ask Caelan to flood the ground beneath them.":"Ask Isolde to call down lightning.", hint:LIn(), fx:{n_s4:3, liFought:true}, go:"s4c"}]:[]),
  {label:"Hold, and hope the walls are enough.", hint:"No trick", fx:{n_s4:1}, go:"s4c"}
]},

s4c:{ title:"The River at Night", text:()=>`
<p>The towers burn through the evening. Kastrel pulls back, and the drums stop, and for an hour the town lets itself believe it is over.</p>
<p>${F("knowsRiver")?"You do not. Ruslan's words have been in your head all day.":"Then Oda shouts from the tower."} Boats. Dozens of them, black and silent, coming down the river toward the ${has("viaduct")?"viaduct":"bridge"} and the soft river wall beneath it.</p>`,
choices:()=>[
  ...(has("boom")?[{label:"Raise the chain boom.", hint:"Iron chain across the river", fx:{n_s4:3}, go:"s4end"}]:[]),
  ...(F("knowsRiver")?[{label:"Spring the ambush you set on the banks.", hint:"Thanks to Ruslan", fx:{n_s4:3}, go:"s4end"}]:[]),
  ...(F("fen")&&!F("fenLeaves")?[{label:"Send Fen to open the mill sluice and swamp the boats.", hint:fenSk()>=2?"He's ready":"Fen is nervous", fx:{n_s4:fenSk()>=2?3:1, fenRiver:true}, go:"s4end"}]:[]),
  ...(F("liAtSiege")&&LIk()==="caelan"?[{label:"Ask Caelan to turn the river itself.", hint:"Caelan's water", fx:{n_s4:3, liFought:true}, go:"s4end"}]:[]),
  {label:"Garth's crews float burning rafts down on them.", hint:"Fire on the water", fx:{n_s4:1}, go:"s4end"}
]},

s4end:{ title:"Dawn on the Border", enter(){
  const sc=(F("n_s4")||0) + Math.floor(S.stats.defense/4) + (F("harry")?2:0) + (F("sortie")?1:0) + (has("wallTowers")?1:0) + (has("concrete")?1:0);
  S.flags.s4score=sc; S.flags.s4result = sc>=17 ? "broken" : sc>=11 ? "held" : "burned";
  add(F("s4result")==="broken"?{renown:4, morale:2, s4done:true}:F("s4result")==="held"?{renown:2, s4done:true}:{morale:-2, food:-4, s4done:true});
  if(F("s4result")==="burned") S.pop=Math.max(80,S.pop-15);
}, text:()=>({
broken:`<p>At dawn the river is full of wreckage and the Kastrel camp is striking its tents. General Orrel sends a rider under a white flag, a woman with a scar across her jaw who looks at your walls for a long time before she speaks.</p>
  <p>${say(`"The general asks who built these,"`)} she says. You tell her. She nods slowly. ${say(`"She thought so. She says she will not come this way again."`)}</p>
  ${sys("SYSTEM","[Title Earned: THE WALL OF THE EAST]<br>Renown +4 · Morale +2")}`,
held:`<p>At dawn Kastrel withdraws across the river, carrying its dead. The outer cottages are scorched, the river wall is cracked, and the infirmary is full. But the town held. Every wall you built held.</p>
  ${sys("SYSTEM","[Siege Repelled]<br>Renown +2")}`,
burned:`<p>At dawn Kastrel withdraws, but not before the boats reach the river wall. The outer quarter burns through the night. You hold the inner walls with your own hands until your palms bleed, and in the end Orrel decides the price is too high.</p>
  <p>Fifteen people do not see the morning. You learn every one of their names.</p>
  ${sys("SYSTEM","[The Outer Town Burned]<br>Population −15 · Morale −2 · Food −4")}`
}[F("s4result")]) + `${F("usedEngines")?`<p>The ballista towers stand smoking on the wall. They worked. You find that you cannot look at them for very long.</p>`:""}<p><em>End of Part One: Six Days to the River.</em></p>`,
choices:[{label:"Begin Part Two: The Summer of Ash", go:"c4summer"}]},

c4summer:{ title:"The Summer of Ash", enter(){ S.phase="summer"; S.week=1; S.buildsLeft=perWeek(); S.weekReport=null; S.newPage=null; }, text:()=>`
<p>Summer comes in over a valley of trampled fields and burned siege towers. Brackenfold has to bury its dead, feed its refugees, and rebuild, all at once, while the whole kingdom watches to see whether the eastern frontier will hold.</p>
${sys("PART TWO",`The Summer of Ash · 6 weeks · ${perWeek()} projects a week${has("guild")?" + the guild's own work":""}<br>Goal: make Brackenfold a Royal City`)}`,
choices:[{label:"Plan the first week.", go:"plan"}]},

a4dead:{ title:"The Cost", text:()=>`
<p>Bren spends the first week of summer with a ledger, and at the end of it he brings it to you without a word. The cost of the siege: arrows, oil, broken tools, ruined fields, the refugees' food. Brackenfold is badly in debt for the first time since you arrived.</p>`,
choices:()=>[
  ...(F("royalOrder")?[{label:"Send the bill to the king. He named you his anchor fortress.", hint:"Coin +8", fx:{coin:8}, go:"nextweek"}]:[]),
  ...(has("glassworks")?[{label:"Sell a season's glass to Tamsin in advance.", hint:"Coin +5", fx:{coin:5}, go:"nextweek"}]:[]),
  {label:"Forgive the town's taxes for the summer. They earned it.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"}
]},

a4prisoners:{ title:"Two Hundred Prisoners", text:()=>`
<p>Kastrel left two hundred soldiers behind: wounded, lost, or simply done with the war. They sit in the old fields under guard, eating your bread, watching your walls.</p>
<p>${F("ruslan")?`Ruslan walks among them, talking quietly in their own language. He comes back with a strange look on his face. ${say(`"Half of them were farmers last year,"`)} he says. ${say(`"Orrel took them from their villages."`)}`:"Oda wants them gone. Garth wants them working. The crown wants them sent west."}</p>`,
choices:[
  {label:"Put them to work, paid fairly, until the harvest.", hint:"Timber +6, Stone +6", fx:{timber:6, stone:6, prisonersWork:true}, go:"nextweek"},
  {label:"Send them home across the river with food for the road.", hint:"Renown +2, Resentment −1 · Kastrel will remember", fx:{renown:2, resent:-1, mercy:true}, go:"nextweek"},
  {label:"Hand them over to the crown.", hint:"Coin +3 · Royal favor", fx:{coin:3, royalFavor:true}, go:"nextweek"}
]},

a4fenFort:{ title:()=>F("fenLeaves")?"Fen Comes Home":"Fen's Redoubt", text:()=>F("fenLeaves")
? `<p>Fen walks in through the south gate a month earlier than anyone expected, with a satchel of books and an expression you have never seen on him before: grim. ${say(`"They wouldn't let me leave during the siege,"`)} he says. ${say(`"So I left after it."`)}</p><p>He has learned a great deal in Highcrown. Some of it from books. Some of it from watching magisters talk about artificers when they thought he could not hear.</p>`
: `<p>One morning Oda comes to you looking unsettled. ${say(`"There's a fort at the north ford,"`)} she says. ${say(`"A small one. It wasn't there yesterday."`)}</p><p>Fen built it in a single night, alone, angled the Elder way, a little redoubt that covers the ford Kastrel used. He is asleep on its parapet when you find him, with stone dust in his hair.</p>`,
enter(){ if(F("fenLeaves")){ S.flags.fenLeaves=false; S.flags.fenHome=true; add({fen:true}); } },
choices:[
  {label:"Make him master of the frontier forts.", hint:"Defense +2 · Fen's rank rises", fx:{defense:2, fenMaster:true, n_fenBrave:1}, go:"nextweek"},
  {label:"Tell him he should have told you first, and then tell him it's brilliant.", hint:"Fen trusts you · Craft +1", fx:{n_fenBond:1, craft:1}, go:"nextweek"},
  {label:"Ask him what he learned. All of it.", hint:"Fen grows stronger", fx:{n_fenSkill:1}, go:"nextweek"}
]},

a4marisol:{ title:()=>F("marisol")?"Marisol's Last Lesson":"Granny Pell", text:()=>F("marisol")
? `<p>Marisol collapses in the college workshop in the fourth week of summer. The healer says it is her heart, and her age, and forty years on a cold mountain. She will not get up again.</p><p>She sends for you. ${say(`"There's one thing I never taught anyone,"`)} she says. ${say(`"Because nobody ever asked. Sit down."`)}</p>`
: `<p>Granny Pell falls ill in the fourth week of summer, very suddenly. She is ninety one, it turns out. Nobody knew. She has complaints about the infirmary, the healer, and the color of the walls, which the healer takes as a good sign.</p>`,
choices:()=>F("marisol") ? [
  {label:"Sit with her through the night and learn it.", hint:"Craft +2 · Marisol's legacy", fx:{craft:2, marisolLegacy:true}, go:"nextweek"},
  {label:"Bring Fen. It should be his.", hint:"Fen learns it · Fen grows", fx:{n_fenSkill:2, marisolLegacy:true}, go:"nextweek"}
] : [
  {label:"Visit her every evening.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"},
  {label:"Ask her to dictate the village's history to the school while she rests.", hint:"Craft +1, Morale +1", fx:{craft:1, morale:1, pellHistory:true}, go:"nextweek"},
  ...(F("thornFate")==="tamed"?[{label:"Bring her fruit from the Garden.", hint:"She recovers · Morale +1", fx:{morale:1, pellSaved:true}, go:"nextweek"}]:[])
]},

a4family:{ title:()=>LIk()?`${LIn()}'s Family`:"Seren's Letter", text:()=>{
const li=LIk();
if(li==="caelan") return `<p>A letter arrives for Caelan from his father, Lord Ardane, with the house seal pressed so hard it has cracked the wax. Caelan reads it at the table and goes very quiet.</p><p>${say(`"He says I've shamed the house by fighting for artificers,"`)} he says. ${say(`"He says if I don't come home by midsummer, he'll name my cousin heir."`)}</p>`;
if(li==="isolde") return `<p>A royal courier brings Isolde a summons from her uncle: return to court at once. There are whispers, she tells you, that the king's niece has gone native on the frontier.</p><p>${say(`"He's testing me,"`)} she says. ${say(`"He wants to know whose side I'm on."`)}</p>`;
return `<p>Seren writes from Highcrown. The court is talking about nothing but the siege. Father has started saying your name at dinner. Out loud. In front of guests.</p>`;},
choices:()=>{ const li=LIk(); if(!li) return [{label:"Write back to Seren.", hint:"Resentment −1", fx:{resent:-1}, go:"nextweek"}];
  return [
    {label:`"Stay. You have a home here, whatever they say."`, hint:`${LIn()} stays · Closeness +2`, fx:{["aff_"+li]:2, liStays4:true}, go:"nextweek"},
    {label:`"Go. Fix it from the inside. I'll be here."`, hint:`${LIn()} returns to court · Royal favor`, fx:{["aff_"+li]:1, royalFavor:true}, go:"nextweek"},
    ...(li==="isolde"?[{label:"Write to the king yourself and tell him exactly whose side she's on.", hint:"Bold · Renown +1", fx:{aff_isolde:2, renown:1, wroteKing:true}, go:"nextweek"}]:[])
  ];}},

a4herald:{ title:"The Herald", text:()=>`
<p>A herald in Varrin gold rides up the Elder road in the last week of summer to announce, with trumpets, that His Majesty King Aldric will visit the anchor fortress of the east in person.</p>
<p>Granny Pell, from her window, asks loudly whether the king will be wanting his hems fixed too.</p>`,
choices:[
  {label:"Prepare a feast in the hall.", hint:"Food −3, Morale +2", req:()=>S.stats.food>=3, fx:{food:-3, morale:2, kingFeast:true}, go:"nextweek"},
  {label:"Prepare to show him the walls and the scars.", hint:"Show strength", fx:{kingWalls:true}, go:"nextweek"},
  {label:"Prepare to show him the school and the children.", hint:"Show the future", fx:{kingSchool:true}, go:"nextweek"}
]},

kingArrives:{ title:"King Aldric Varrin", text:()=>`
<div class="compare">
  <figure>${mapSVG({then:"autumn"})}<figcaption>Before the war</figcaption></figure>
  <figure>${mapSVG()}<figcaption>After the Summer of Ash</figcaption></figure>
</div>
<p>King Aldric Varrin is a tired, clever man in a plain coat who climbs down from his carriage without waiting for the steps. He looks like Isolde around the eyes. He walks the walls first${F("kingWalls")?", slowly, touching every scorch mark":""}, then the town${F("kingSchool")?", and spends a whole hour in the school asking the children what they are building":""}.</p>
