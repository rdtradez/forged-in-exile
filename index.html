/* ------------------------- THE STORY ------------------------- */
const SCENES = {

ceremony:{ title:"The Awakening Font", text:()=>`
<p>The great hall of House Valcrest smells of incense and old steel. Nine generations of battle mages look down from the banners. Every one of them awakened fire, storm, or iron at this same stone font.</p>
<p>Your elder sibling Seren went first last year. The water boiled into a column of flame so bright the priests had to shield their eyes. Father has not stopped telling that story since.</p>
<p>Now it is your turn. You place both hands into the cold water and wait for the heat to come.</p>
<p>It never does. Instead the water goes still, then <em>stiffens</em>, folding itself into a lattice of perfect crystal ribs, each one fitted to the next like joinery. A priest whispers the word nobody in this hall wanted to hear.</p>
<p>${say("Artifice.")} The magic of carpenters and smiths. Commoner magic.</p>
<p>Then the sound of cracking. On the altar behind the font, the Valcrest Ember Blade, the relic that has never once left its stand, splits clean down the middle.</p>
${sys("SYSTEM","[Affinity Awakened: ARTIFICE]<br>Rank: F &nbsp;·&nbsp; Class: Production<br>Note: Reading exceeds the font's measure. Further data unavailable.")}
<p>Every eye turns from the blade to you. Lord Edric Valcrest, your father, says nothing at all. That is worse.</p>`,
choices:[
  {label:"Lift your chin and meet your father's eyes.", hint:"Pride · Resentment +1, Renown +1", fx:{resent:1, renown:1}, go:"verdict"},
  {label:"Bow your head and apologize to the hall.", hint:"Humility · Resentment −1", fx:{resent:-1}, go:"verdict"},
  {label:"Walk to the broken blade and lay your hand on it.", hint:"Curiosity · Craft +1", fx:{craft:1, sawRunes:true}, go:"blade"}
]},

blade:{ title:"What the Crack Revealed", text:()=>`
<p>Gasps follow you up the altar steps. Nobody stops you. Perhaps nobody believes you can make things worse.</p>
<p>The moment your palm touches the steel, you <em>feel</em> it: every grain, every flaw, the way the blade was folded two centuries ago. And beneath the hilt wrap, where no one has looked in generations, letters hammered into the tang.</p>
<p>${say("Forged by the hand of Aurel Valcrest, Artificer.")}</p>
<p>The founder of your house. The one whose portrait hangs above the hearth holding a sword in both hands.</p>
${sys("SYSTEM","[Hidden Record Found]<br>Founder Aurel Valcrest · Affinity: ARTIFICE")}
<p>You let go before anyone else can read it. Your heart is pounding.</p>`,
choices:[{label:"Step back down to face your father.", go:"verdict"}]},

verdict:{ title:"The Verdict", text:()=>`
<p>Judgment comes the next morning in the small hall, without witnesses.</p>
<p>${say(`"There is a holding on the eastern frontier,"`)} your father says. ${say(`"Brackenfold. A mill, a wall, and perhaps eighty people who have stopped paying tax. You will govern it. You will keep the Valcrest name. You will not return to this house unless I summon you."`)}</p>
<p>It is not said in anger. It is said the way he orders a lame horse moved to a far pasture.</p>
${F("sawRunes")?`<p>You think of the letters on the blade. You could say them aloud right now. You could ask him if he knows.</p>`:""}
<p>In the courtyard, Seren is waiting by your horse, still in training leathers, flame scars faint on both wrists.</p>
<p>${say(`"For what it's worth,"`)} Seren says quietly, ${say(`"I asked him to wait a year. He wouldn't hear it."`)}</p>`,
choices:[
  {label:`"Keep the name warm for me. I'll be back, and I won't be asking."`, hint:"Rival · Resentment +1", fx:{resent:1, seren:"rival"}, go:"road"},
  {label:`"Thank you, Seren. Write to me?"`, hint:"Ally", fx:{seren:"ally"}, go:"road"},
  {label:`"Did you know Aurel Valcrest was an artificer?"`, hint:"Requires the hidden record", req:()=>F("sawRunes"), fx:{seren:"ally", seren_knows:true}, go:"serenSecret"},
  {label:"Mount up without a word.", hint:"Cold · Resentment +1", fx:{resent:1, seren:"cold"}, go:"road"}
]},

serenSecret:{ title:"A Shared Secret", text:()=>`
<p>Seren goes very still. Then, quickly, glancing at the windows: ${say(`"Say that again. Quietly."`)}</p>
<p>You tell it all. The crack, the tang, the letters. Seren listens without interrupting, which Seren has never once done in your life.</p>
<p>${say(`"There's a locked room in the archive,"`)} Seren says at last. ${say(`"Father keeps the only key. I always thought it was the debt records."`)} A long breath. ${say(`"Go east. Stay alive. I'll find out what's in there."`)}</p>
${sys("SYSTEM","[Bond Formed: SEREN VALCREST]<br>Status: Secret Ally")}`,

road:{ title:"The Eastern Road", text:()=>`
<p>Six days east the farms thin out, then the fences, then the road itself. On the seventh morning you find a covered wagon tipped into a ditch, one wheel bent under it like a broken ankle.</p>
<p>On the first night out, buckling your cuff by the fire, you find something caught in the wool: a sliver of dark steel no longer than a fingernail, still faintly warm. A splinter of the Ember Blade. You do not remember it getting there. You cannot make yourself throw it away.</p>

axle:{ title:"First Repair", text:()=>`

arrive:{ title:"Brackenfold", enter(){ S.day=1; S.buildsLeft=perDay(); }, text:()=>`
<p>Brackenfold sits in a fold of brown hills exactly as its name promised. A river along the east side. A mill with a cracked wheel turning at half speed. Sixty roofs, perhaps forty of which still keep out rain. A timber wall with more gaps than posts, and fields to the north half drowned in standing water.</p>
<p>The elder meets you at the gate. Old Bren is tall, stooped, and has the patient face of a man who has buried a lot of hope.</p>
<p>${say(`"Three lords in twelve years,"`)} he says. ${say(`"The first drank. The second gambled. The third took one look and rode home before supper. Which will you be, ${P("child")} of Valcrest?"`)}</p>
${F("tamsin")?`<p>Behind you, Tamsin snorts. ${say(`"This one fixes things, Bren. Give it a week."`)}</p>`:""}
<p>Bren gives you a tour that takes less than an hour, then hands you the village's entire stock of building supplies: two stacks of green timber and a purse with three coins in it.</p>
${sys("SYSTEM","[Territory Acquired: BRACKENFOLD]<br>Population: 83 · Condition: Failing<br>Each morning, assign villagers to work crews and choose one project.<br>Crews gather timber, stone, and food overnight.")}`,
choices:[{label:"Bren rings the old bell. The village gathers in the square.", go:"square1"}]},

square1:{ title:"The Square", text:()=>`
<p>Eighty three people stand in the mud of the square, which is less a square than a wide place in the road. Some have their arms folded. A few children are sitting on the broken well. Nobody is smiling.</p>
<p>You are supposed to say something. Three lords before you said something here, and every one of those speeches ended with them riding away.</p>
<p>Granny Pell, somewhere near the front, says loudly enough for everyone to hear: ${say(`"Go on, then."`)}</p>`,
choices:[
  {label:`"I won't promise you anything. Watch what I do this week, then decide."`, hint:"Morale +1 · Bren approves", fx:{morale:1, speech:"deeds"}, go:"square2"},
  {label:`"By winter, every roof in this village will keep out the rain. That's my promise."`, hint:"Renown +1 · You'll be held to it", fx:{renown:1, speech:"promise"}, go:"square2"},
  {label:`"I need your names. All of them. Starting with you."`, hint:"Morale +2 · Takes all evening", fx:{morale:2, speech:"names"}, go:"square2"}
]},

square2:{ title:"The Square", text:()=>({
  deeds:`<p>It is not a speech. Some people look disappointed. But Bren, at the back, nods once, and a few of the folded arms come unfolded.</p>`,
  promise:`<p>A murmur goes through the crowd. Someone laughs, not kindly. Someone else says ${say(`"We'll see."`)} You have just given them a way to measure you, and they will.</p>`,
  names:`<p>It takes until dark. Ninety minutes of names, trades, and complaints about the mill. By the end you know who the best hunter is, who is feuding with whom over a goat, and that the miller's boy cannot stop staring at your hands. People leave the square talking to each other, which Bren tells you later has not happened in years.</p>`
}[F("speech")]),
choices:[{label:"Look over the village and choose your first project.", go:"plan"}]},

/* ---------- daily build menu ---------- */
plan:{ title:()=>isAway()&&S.phase!=="capital" ? `Day ${S.day} · ${AWAY[S.phase].place}` : (isSeason()&&S.chapter>=4) ? `${SEASON[S.chapter].name} · Week ${S.week} of ${SEASON[S.chapter].len}` : ({war:`Day ${S.day} before the River`, charter:`The Charter Days · Day ${S.day}`, capital:`Day ${S.day} in Highcrown`, spring:`Spring · Week ${S.week} of 6`, summer:`Summer · Week ${S.week} of 8`, winter:`Winter · Week ${S.week} of 6`, snow:`Day ${S.day} of the First Snow`, week:`Day ${S.day} of the First Week`})[S.phase], text:()=>{
  if(S.phase==="summer") return summerPlanText();
  if(S.phase==="winter") return winterPlanText();
  if(S.phase==="snow") return snowPlanText();
  if(isAway()) return AWAY[S.phase].text();
  if(isSeason()&&S.chapter>=4) return seasonPlanText();
  if(S.phase==="war") return warPlanText();
  if(S.phase==="charter") return charterPlanText();
  if(S.phase==="spring") return springPlanText();
  const left = 6 - S.day;
  const intro = {
    1:`<p>You wake before dawn on a straw mattress in the old manor, which is really just a large farmhouse with a slate roof. Through the window, Brackenfold is grey and quiet and waiting to see what you will do.</p>`,
    2:`<p>The village wakes a little earlier today. A few people are already standing near the manor door, pretending they are not waiting for you.</p>`,
    3:`<p>Word has spread to the outlying farms. Two families walk in from the hills just to look at what the new ${P("lord").toLowerCase()} has done.</p>`,
    4:`<p>You are starting to feel the magic differently now, less like a well you draw from and more like a muscle you are building.</p>`,
    5:`<p>Oda's hunters are out at first light, checking the treeline. Nobody says why, but everyone is quieter today.</p>`,
    6:`${sys("THREAT","Briar hound pack · Expected tonight","warn")}<p>One day left. Whatever you build today is what Brackenfold will have when the thorns come.</p>`
  }[S.day];
  const page = S.newPage ? sys("ELDER CODEX",`[Page Restored: ${CODEX[S.newPage].name.toUpperCase()}]<br>Elder name: ${CODEX[S.newPage].elder}<br>You dreamed of Aurel again. New project unlocked.`) : "";
  return `${intro}
  ${page}
  ${mapPanel()}
  <div class="res"><span>Timber <b>${S.stats.timber}</b></span><span>Stone <b>${S.stats.stone}</b></span><span>Coin <b>${S.stats.coin}</b></span><span>Defense <b>${S.stats.defense}</b></span><span>Food <b>${S.stats.food}</b></span><span>Morale <b>${S.stats.morale}</b></span></div>
  ${crewPanel()}
  <p class="chapter">${S.buildsLeft} project${S.buildsLeft===1?"":"s"} left today${perDay()>1?" (Fen is helping)":""} · ${left>0?`${left} more day${left>1?"s":""} after this one`:"final day"}</p>`;
},
choices:()=>isAway() ? awayChoices() : buildMenu(ORDER.filter(id=>{ const pr=PROJECTS[id]; if(pr.fate && F("thornFate")!==pr.fate) return false; if(pr.summer&&!(isSeason()||S.chapter>=2)) return false; if(pr.ch&&S.chapter<pr.ch) return false; return pr.repeat ? (S.counts[id]||0)<(val(pr.max)||99) : !has(id); }).map(id=>{
  const pr=PROJECTS[id]; const reqOK=!pr.req||pr.req(); const pay=canPay(costOf(id));
  const lock = !reqOK ? ` · Locked: ${pr.reqText}` : !pay ? " · Not enough materials" : "";
  return {label:(pr.claim?"Territory: ":pr.district?"District: ":"")+pr.name, hint:`${pr.gain} · Cost: ${costText(costOf(id))}${lock}`, req:()=>reqOK&&pay, build:id, cls:pr.claim?"build claim":"build"};
})).concat([
  {label:"Keystone Surge", hint:"Your next project costs nothing · once each part of a chapter", req:()=>surgeReady(), surge:true, cls:"build claim", hide:()=>!F("keystone")},
  {label:"Buy timber from passing traders", hint:"Coin −2 → Timber +5 · does not use a project", req:()=>S.stats.coin>=2, trade:{coin:-2, timber:5}, cls:"trade"},
  {label:"Buy cut stone from passing traders", hint:"Coin −3 → Stone +5 · does not use a project", req:()=>S.stats.coin>=3, trade:{coin:-3, stone:5}, cls:"trade"},
  {label:"Sell spare timber", hint:"Timber −6 → Coin +3 · does not use a project", req:()=>S.stats.timber>=6, trade:{timber:-6, coin:3}, cls:"trade"},
  {label: isSeason() ? "Let the crews work and build nothing more this week." : "Rest today and let the crews gather.", hint:"Save your materials for something bigger", skip:true}])},

built:{ title:()=>`Project Complete`, text:()=>{
  const pr=PROJECTS[S.lastBuilt];
  return `${pr.after()}
  ${sys(pr.claim?"TERRITORY CLAIMED":pr.district?"DISTRICT BUILT":"PROJECT COMPLETE",`[${pr.name}]<br>${pr.gain}${pr.claim?`<br>Lands of Brackenfold: ${claims().length}`:""}`)}
  ${S.surgeMsg||""}${S.rankMsg||""}
  ${pr.claim||pr.district ? regionSVG() : mapSVG()}`;},
choices:()=>isSeason()
  ? (S.buildsLeft>0 ? [{label:`Start the next project this week (${S.buildsLeft} left)`, go:"plan"}] : [{label:"The week draws to a close.", go:"event"}])
  : (S.buildsLeft>0 ? [{label:"Fen is ready to take on a second project today.", hint:"Your apprentice works alongside you", go:"plan"}] : [{label:"Night falls on Brackenfold.", go:"event"}])},

/* ---------- day events ---------- */
codexDream:{ title:"The Inheritance", text:()=>`
<p>You fall asleep in your boots. Some time in the night, the sliver of the Ember Blade, which you have been carrying in your pocket since the road, burns hot enough to wake you.</p>
<p>It is not in your pocket anymore. It is in your palm, sinking into the skin without pain or blood, leaving behind a mark like a mason's square drawn in silver.</p>
<p>Then the dream takes you.</p>
<p>You are standing in a city of grey stone under a white sky. Domes wider than the great hall of Valcrest. Bridges striding across valleys on three tiers of arches. Harbor walls poured right into the sea. And everywhere, the ruin of it: cracked columns, roots through the paving, an empire a thousand years dead.</p>
<p>A man in a dusty coat is sitting on a fallen column, drawing in a notebook. He looks up, and he has your eyes.</p>
<p>${say(`"Ah. So it finally woke for someone,"`)} says Aurel Valcrest. ${say(`"I found this place when I was younger than you. The Elder builders left everything they knew written in the stone, if you have the right magic to read it. My children wanted swords. So I put it in a sword, and I waited."`)}</p>
${F("sawRunes")?`<p>${say(`"You read my name on the tang, didn't you? Good. Then you already know what they hid."`)}</p>`:""}
${sys("SYSTEM",`[Hidden Inheritance Unlocked: THE ELDER CODEX]<br>Pages restored: 1 of ${codexTotal()} · Lime and Fire<br>One page restores each night you rest.`)}`,
enter(){ if(!knows("lime")){ S.codex.push("lime"); S.newPage=null; } add({codex_on:true}); },
choices:[
  {label:`"Why hide it? Why not teach everyone?"`, hint:"Lore", fx:{aurelWhy:true}, go:"codexWhy"},
  {label:"Look around the ruined city and memorize everything you can.", hint:"Craft +1", fx:{craft:1}, go:"brenNight"},
  {label:`"You let our family call people like me useless for two hundred years."`, hint:"Resentment +1", fx:{resent:1}, go:"codexAngry"}
]},

codexWhy:{ title:"The Inheritance", text:()=>`
<p>Aurel closes his notebook. ${say(`"I tried. The other founding houses had battle mages, and battle mages had already decided what this kingdom would be. A kingdom of swords needs people to believe the builders are servants. So they burned my workshops and called it an accident."`)}</p>
<p>${say(`"I hid what was left in the only place they would never look. Inside a weapon."`)}</p>
<p>The city begins to fade. ${say(`"Build slowly,"`)} he says. ${say(`"Build where they can't see. And when they finally do see, make sure it's too big to burn."`)}</p>
${sys("LORE","[Fragment Recovered: The Burned Workshops]")}`,
choices:[{label:"Wake up.", go:"brenNight"}]},

codexAngry:{ title:"The Inheritance", text:()=>`
<p>Aurel does not flinch. ${say(`"Yes,"`)} he says. ${say(`"I did. I was afraid, and I chose to wait instead of fight. You can do better than I did. I hope you will."`)}</p>
<p>He holds out the notebook. When you take it, the dream comes apart like smoke, and you wake with your hand closed on nothing at all. But you can still see every page.</p>`,
choices:[{label:"Get up. Bren is knocking.", go:"brenNight"}]},

brenNight:{ title:"Bren's Fire", text:()=>`
<p>That evening Bren invites you to his hearth, which you suspect is a test. His house is small and very clean. He pours you a cup of something brewed from bark that tastes exactly like bark.</p>
<p>${say(`"You did good work today,"`)} he says. ${say(`"I'll tell you plainly, that worries me. The last three never did anything, so they never asked for anything. A ${P("lord")} who builds will want taxes, labor, and obedience. So. What do you want from us?"`)}</p>`,
choices:[
  {label:`"Nothing yet. Let the work speak first."`, hint:"Morale +1", fx:{morale:1}, go:"nextday"},
  {label:`"Honesty. Tell me what this village is hiding."`, hint:"Learn a secret", fx:{}, go:"cellar"},
  {label:`"My family threw me away. I need this place to prove them wrong."`, hint:"Resentment +1, Renown +1", fx:{resent:1, renown:1}, go:"nextday"}
]},

cellar:{ title:"Granny Pell's Cellar", text:()=>`
<p>Bren is quiet for a long moment. Then he takes a lantern and leads you through the dark to the weaver's house in the east row.</p>
<p>Under Granny Pell's loom there is a trapdoor, and under the trapdoor there is grain. Sacks of it, enough to feed the village through a bad winter, hidden from every tax collector for six years.</p>
<p>${say(`"The crown's man takes a third of the harvest no matter how bad it is,"`)} Pell says, arms folded. ${say(`"We'd have starved twice over. So. Are you going to report us, little noble?"`)}</p>`,
choices:[
  {label:"Keep the secret. This grain belongs to the people who grew it.", hint:"Morale +2 · The tax man will come someday", fx:{morale:2, hidGrain:true}, go:"nextday"},
  {label:"Use some of it now to feed the work crews properly.", hint:"Food +2, Morale +1", fx:{food:2, morale:1, hidGrain:true}, go:"nextday"},
  {label:"Record it honestly. Brackenfold will deal with the crown openly.", hint:"Resentment −1, Morale −1", fx:{resent:-1, morale:-1, honestLedger:true}, go:"nextday"}
]},

woods:{ title:"Timber and Blood", text:()=>`
<p>At first light you walk into the north wood to look for good oak. You are running your hands along an old trunk when you hear it: ragged breathing somewhere past the ferns.</p>
<p>A hooded figure lies against a stump, one leg torn by long raking wounds. Beside them lies a beast you only know from bestiaries: a hound built of thorned vine and black bark, its jaws still open.</p>
<p>${say(`"Briar hound,"`)} the stranger rasps. ${say(`"Where there's one, there's a pack. Don't stand there gawking, artificer."`)}</p>
<p>You never told them what you are.</p>`,
choices:[
  {label:"Carry the stranger back to Brackenfold.", hint:"Trust · Renown +1", fx:{wren:true, renown:1}, go:"wren"},
  {label:"Splint the leg here, leave food and water, and hurry back to warn the village.", hint:"Caution · Defense +1", fx:{defense:1, wrenOwed:true}, go:"nextday"},
  {label:"Back away. Strangers who know too much are trouble.", hint:"Resentment +1", fx:{resent:1}, go:"nextday"}
]},

wren:{ title:"The Stranger", text:()=>`
<p>The stranger's name is Wren. The village healer cleans the wound and declares it ugly but not fatal. Wren spends the evening watching you work.</p>
<p>${say(`"You mend things,"`)} Wren says at last. ${say(`"That's all they let you think it does. Mending. Hardening. Commoner tricks."`)}</p>
<p>${say(`"What else would it do?"`)}</p>
<p>Wren picks a river stone off the windowsill and drops it in your hand. ${say(`"Don't fix it. Ask it to be something else."`)}</p>
<p>For a long minute, nothing. Then the stone softens like warm clay under your thumb, and you pinch it into a crude little cup before it sets hard again.</p>
${sys("SYSTEM","[Skill Learned: RESHAPE]<br>Mold stone, earth, and metal without tools.<br>New projects unlocked. Craft +2")}
<p>${say(`"The great houses buried that,"`)} Wren says, ${say(`"a long time ago. Ask me why another day."`)}</p>
${F("sawRunes")?`<p>You think of the letters hidden on the Ember Blade, and you say nothing.</p>`:""}`,
choices:[{label:"Get some sleep. There is a lot to build.", fx:{craft:2, reshape:true}, go:"nextday"}]},

wrenReturn:{ title:"A Debt Repaid", text:()=>`
<p>The stranger from the woods is sitting on the edge of your new work when you come back from the day's labor, leg still splinted, eating one of your apples.</p>
<p>${say(`"You left me food and a good splint and didn't ask questions,"`)} the stranger says. ${say(`"Name's Wren. I pay my debts."`)}</p>
<p>Wren tosses you a river stone. ${say(`"Stop fixing things for a minute. Ask that to be something else."`)}</p>
<p>It takes you most of an hour. Then the stone softens like clay under your thumb.</p>
${sys("SYSTEM","[Skill Learned: RESHAPE]<br>Mold stone, earth, and metal without tools.<br>New projects unlocked. Craft +2")}
<p>When you look up, Wren is already limping back toward the trees. ${say(`"I'll be around,"`)} Wren calls. ${say(`"You'll need me before the month is out."`)}</p>`,
choices:[{label:"Turn the stone over in your hands until it's dark.", fx:{craft:2, reshape:true, wrenAround:true}, go:"fen"}]},

fen:{ title:"The Miller's Son", text:()=>`
<p>Fen has been following you for two days at a distance he clearly believes is subtle. Tonight he finally works up the nerve to knock on the manor door.</p>
<p>${say(`"Can it be learned?"`)} he blurts out. ${say(`"Artifice. My gran said my grandfather could feel when a beam was going to crack. Nobody ever tested me because, well. We're not nobles."`)}</p>
<p>You take his hand and press it to the doorframe. For a heartbeat, faint as a candle in fog, you feel <em>something</em> answer.</p>
${!F("reshape")&&S.stats.craft>=3?`<p>And as you guide his small flicker of power into the wood, something shifts in your own. You feel the grain not as something to repair but as something that could be <em>rearranged</em>.</p>`:""}`,
enter(){ if(!F("reshape")&&S.stats.craft>=3){ add({reshape:true, craft:1, selfTaught:true}); } },
choices:()=>[
  ...(F("selfTaught")?[{label:"(You can feel it: the stone and earth would bend for you now.)", hint:"Skill Learned: RESHAPE · Craft +1", req:()=>false}]:[]),
  {label:"Take him on as your apprentice.", hint:"Fen joins · Morale +1 · Future projects cost less", fx:{fen:true, morale:1}, go:"nextday"},
  {label:"Tell him it's real, but give him a job hauling timber for now.", hint:"Timber +2", fx:{timber:2, fenLater:true}, go:"nextday"},
  {label:`"The academies say commoners can't learn it. I'm sorry."`, hint:"Morale −1 · Something feels wrong about saying it", fx:{morale:-1}, go:"nextday"}
]},

trade:{ title:()=>F("tamsin")?"Tamsin's Caravan":"The Peddler", text:()=>F("tamsin")?`
<p>Tamsin rolls in with two wagons and a mule that hates everyone. She looks at your work and lets out a long whistle.</p>
<p>${say(`"Four days,"`)} she says. ${say(`"I've seen counts spend four years and do less. All right, little ${P("lord").toLowerCase()}. Let's do business."`)}</p>`:`
<p>A thin peddler arrives with one wagon and a suspicious eye. He has heard rumors about a noble in Brackenfold who rebuilds things with bare hands and clearly does not believe a word of it.</p>
<p>${say(`"I'll trade,"`)} he says. ${say(`"But my prices are my prices."`)}</p>`,
choices:()=>{ const t=F("tamsin");
  return [
  {label:`Buy cut stone from the ${t?"caravan":"peddler"}.`, hint:`Stone +3 · Cost: ${t?1:2} Coin`, req:()=>S.stats.coin>=(t?1:2), fx:{stone:3, coin:t?-1:-2}, go:"nextday"},
  {label:"Sell hardened iron tools from the smithy.", hint:`Coin +${t?5:3}, Prosperity +1 · Needs the smithy`, req:()=>has("smithy"), fx:{coin:t?5:3, prosperity:1, tradeRoute:t}, go:"nextday"},
  {label:"Hire two of the caravan's drovers for a few days.", hint:"Timber +2, Stone +1 · Cost: 2 Coin", req:()=>S.stats.coin>=2, fx:{timber:2, stone:1, coin:-2}, go:"nextday"},
  ...(t?[{label:"Ask Tamsin for news from the capital.", hint:"Learn what's happening at home", fx:{news:true}, go:"news"}]:[]),
  {label:"Trade a day of your mending for whatever they'll give.", hint:"Timber +2, Stone +1", fx:{timber:2, stone:1}, go:"nextday"}
]}},

news:{ title:"News From the West", text:()=>`
<p>Tamsin lowers her voice. ${say(`"Your house is telling people you were sent east to 'oversee frontier defense.' Very noble of you. Nobody believes it."`)}</p>
<p>${say(`"And Seren?"`)}</p>
<p>${F("seren")==="ally"?say(`"Asking questions in the royal archive. Lots of them. Making your father very nervous."`):F("seren")==="rival"?say(`"Training like a devil. Word is Seren's been telling the other heirs you'll be begging to come home by winter."`):say(`"Quiet. Very quiet. Hasn't said your name once, as far as I hear."`)}</p>
<p>She also gives you a sack of salt and a coil of rope for free, ${say(`"for the mule's sake, since you fixed my wheel."`)}</p>`,
choices:[{label:"Thank her and go back to work.", fx:{timber:1, coin:1}, go:"nextday"}]},

tracks:{ title:"Tracks by the River", text:()=>`
<p>Oda comes to you at sunset with mud to her knees. ${say(`"Tracks along the river. Too many to count. Thorn scratches on bark as high as my shoulder. They're coming south, toward the smell of our livestock."`)}</p>
<p>${say(`"How long?"`)}</p>
<p>${say(`"Tomorrow night."`)} She looks at the wall, the village, then at you. ${has("tower")?say(`"Thanks to that tower, at least we'll see them coming."`):say(`"We won't see them until they're at the wall."`)}</p>
<p>Bren calls the whole village to the square. Eighty three faces, waiting. Somewhere in the crowd a child asks if the new ${P("lord").toLowerCase()} is going to run away like the last one.</p>
${sys("THREAT",`Briar hound pack (est. 20+)<br>Arrival: Tomorrow night<br>Current Defense: ${S.stats.defense}`,"warn")}`,
choices:[
  {label:"Have every family harden their doors and shutters with your help tonight.", hint:"Defense +1, Morale +1 · Protects homes", fx:{defense:1, morale:1, plan:"homes"}, go:"nextday"},
  {label:"Strip the hedgerows for dry thorn and lamp oil. Build a fire line.", hint:"Defense +2, Food −1 · Risky without water", fx:{defense:2, food:-1, plan:"fire"}, go:"nextday"},
  {label:"Move the livestock and children into the mill and the manor.", hint:"Morale +2 · Nobody left exposed", fx:{morale:2, plan:"shelter"}, go:"nextday"},
  {label:"Ask Tamsin to ride for the garrison at Hollin Cross.", hint:"Defense +1, Coin −1 · Needs Tamsin", req:()=>F("tamsin")&&S.stats.coin>=1, fx:{defense:1, coin:-1, plan:"help"}, go:"nextday"}
]},

eve:{ title:"The Night Before", text:()=>`
<p>The sun goes down red. The hunters are on the wall in shifts. You have done everything you can do with wood and stone. There is only one thing left to spend tonight on.</p>
${mapSVG()}`,
choices:()=>[
  {label:"Sit with Bren at his fire.", hint:"Morale +1", fx:{morale:1, eveWith:"bren"}, go:"eveTalk"},
  ...(F("fen")?[{label:"Teach Fen one last trick before the fight.", hint:"Fen will hold the mill · Defense +1", fx:{defense:1, eveWith:"fen"}, go:"eveTalk"}]:[]),
  ...(F("wren")?[{label:"Find Wren and ask the question.", hint:"Learn what the houses buried", fx:{lore:true, eveWith:"wren"}, go:"eveTalk"}]:[]),
  {label:"Write a letter to Seren, just in case.", hint:"Resentment −1", fx:{resent:-1, eveWith:"letter"}, go:"eveTalk"}
]},

eveTalk:{ title:"The Night Before", text:()=>({
  bren:`<p>Bren does not say anything encouraging. He just refills your cup of bark tea twice and tells you about the winter the river froze so hard the children skated to the next village. Somewhere in the middle of the story, your hands stop shaking.</p>`,
  fen:`<p>You show Fen how to feel the stress inside a beam, the place it will break first. ${say(`"If the hounds hit the mill,"`)} you tell him, ${say(`"put your hand there and push."`)} He nods like you have handed him a sword.</p>`,
  wren:`<p>${say(`"Why did they bury it?"`)} you ask.</p><p>Wren is quiet for so long you think there will be no answer. ${say(`"Because battle mages win wars,"`)} Wren says, ${say(`"but artificers build kingdoms. And the people who built this one didn't want anyone building another."`)}</p>${sys("LORE","[Fragment Recovered: The Buried Craft]")}`,
  letter:`<p>You write three drafts. The first is angry. The second is pleading. The third just says: <em>The village is called Brackenfold. The people are good. If anything happens, tell Father I was not useless.</em> You seal the third one.</p>`
}[F("eveWith")])+`<p>Then, from the treeline, a sound like a thousand dry branches dragging over stone.</p>`,
choices:[{label:"Get to the wall.", go:"siege1"}]},

/* ---------- the siege ---------- */
siege1:{ title:"The Night of Thorns", text:()=>{
const plan={homes:"Every door in Brackenfold is barred and hardened. Behind them, families wait in the dark.",
            fire:"Out beyond the north fields, the fire line lies waiting, soaked in oil.",
            shelter:"The children and the animals are packed into the mill and the manor, as safe as stone and timber can make them.",
            help:"Tamsin rode out at dawn. There is no sign of the garrison yet."}[F("plan")];
return `<p>${plan}</p>
<p>${has("tower")?`From the tower, Oda shouts the count: ${say(`"Twenty six! Coming from the north wood, they're splitting!"`)} Thanks to her you have a few precious minutes.`:`You hear them before you see them. Then green eyes, dozens of them, at the foot of the wall.`}</p>
<p>The pack splits three ways. Some go for the north wall, some for the river and the mill, and the biggest group circles toward the gate.</p>
<p>You cannot be everywhere. You have no sword and no fire. You have your hands, and wherever you stand, the wall will be stronger.</p>`},
choices:[
  {label:"Stand at the gate, where the pack is thickest.", hint:has("gate")?"Your stone gatehouse will hold":"The gate is your weakest point", fx:{post:"gate"}, go:"siege2"},
  {label:"Run to the mill and the river side.", hint:F("fen")?"Fen is already there":"Protect the village's food", fx:{post:"mill"}, go:"siege2"},
  {label:"Go to the east row, where the families are.", hint:has("homes")?"Those houses are strong now":"Those houses are the weakest", fx:{post:"homes"}, go:"siege2"}
]},

siege2:{ title:"The Thornmother", text:()=>{
const post={
  gate:has("gate")?`<p>The hounds hit the gatehouse and simply stop, like waves on a cliff. You stand on the arch and press your hands into the stone, and the stone grows teeth.</p>`
                  :`<p>The timber gate shudders under the first impact, then the second. You throw yourself against it, hardening it from inside, feeling every crack try to open and forcing it shut again.</p>`,
  mill:F("fen")?`<p>Fen is already there, white faced, both hands pressed to the mill wall exactly where you showed him. Together you hold the river side, his small flicker of power braced against yours.</p>`
               :`<p>The hounds are tearing at the sluice gate when you arrive. You seal it with a slap of your palm and drive them back toward the water, where the current drags at their vines.</p>`,
  homes:has("homes")?`<p>The east row holds. Doors you mended three days ago take the full weight of the pack without splintering. You can hear children crying inside, but they are crying behind wood that will not break.</p>`
                    :`<p>The old houses buckle. You run from door to door, shoring up whatever is about to give, never quite fast enough. One roof comes down. Thank the gods it is empty.</p>`
}[F("post")];
return `${post}
<p>Then the forest goes silent, and something larger steps out of the north wood.</p>
<p>The thornmother is the size of a plow horse. Its body is a knot of black roots, its eyes are cold green fire, and when it howls, every lesser hound turns toward the wall at once.</p>
${sys("WARNING","[Elite Monster: THORNMOTHER]<br>The pack follows her. Break her, break the pack.","warn")}`},
choices:()=>[
  {label:"Reshape the ground beneath her into a pit and seal it shut.", hint:"Needs Reshape", req:()=>F("reshape"), fx:{finisher:"pit"}, go:"outcome"},
  {label:"Arm the hunters with your iron spears and hold her at the wall.", hint:"Needs the smithy", req:()=>has("smithy"), fx:{finisher:"spears"}, go:"outcome"},
  ...(F("plan")==="fire"?[{label:"Light the fire line and drive her into it.", hint:(has("cistern")||has("tiles"))?"Your village can stop the spread":"Fire spreads fast", fx:{finisher:"fire"}, go:"outcome"}]:[]),
  ...(F("wren")?[{label:"Signal Wren, who has been waiting in the dark beyond the wall.", hint:"Trust the stranger", fx:{finisher:"wren"}, go:"outcome"}]:[]),
  {label:"Climb onto the wall where she can see you, and make her come to you.", hint:"Desperate", fx:{finisher:"bait"}, go:"outcome"}
]},

outcome:{ title:"Dawn", enter(){
  let s = S.stats.defense;
  if(has("tower")) s+=1;
  if(F("post")==="gate" && (has("gate")||has("concrete"))) s+=1;
  if(F("post")==="mill" && F("fen")) s+=1;
  if(F("post")==="homes" && has("homes")) s+=1;
  s += ({pit:3, spears:2, fire:(has("cistern")||has("tiles"))?3:1, wren:2, bait:0})[F("finisher")];
  if(F("plan")==="help") s+=1;
  S.flags.score=s;
  S.flags.result = s>=12 ? "triumph" : s>=8 ? "held" : "costly";
  const r=S.flags.result;
  add(r==="triumph"?{renown:3, morale:2}:r==="held"?{renown:2, morale:1}:{renown:1, food:-1});
  if(F("finisher")==="fire" && !has("cistern") && !has("tiles")) add({food:-1, burned:true});
}, text:()=>{
const fin={
  pit:`<p>You put both hands flat on the frozen ground and pull. The earth beneath the thornmother simply <em>opens</em>, a throat of packed stone, and she drops into it howling. You close it over her like a fist.</p>`,
  spears:`<p>The hunters meet her charge with a hedge of iron spear points you forged three days ago. She hits them and screams, and the iron holds where wood would have shattered.</p>`,
  fire:(has("cistern")||has("tiles"))?`<p>The fire line goes up with a roar. The thornmother charges straight through it and comes out burning, and when the sparks reach the rooftops, ${has("tiles")?"they skitter harmlessly off red clay tiles":"your cistern is there to drown them"}.</p>`
                     :`<p>The fire line goes up with a roar and the thornmother burns, but so does the wind. Sparks catch the barn roofs and the granary before anyone can reach the river with buckets.</p>`,
  wren:`<p>Wren comes out of the dark like a blade thrown from nowhere, bad leg and all, and does something to the thornmother's roots with a short knife that makes the whole creature seize and crumble.</p>`,
  bait:`<p>She comes for you. She comes so fast you barely get the wall hardened in time, and her jaws close on stone an arm's length from your face. It holds. Barely. The hunters finish her while she is tangled in the rampart.</p>`
}[F("finisher")];
const end={
  triumph:`<p>With the thornmother gone, the pack breaks apart like a scattered flock. By dawn, the hounds are a memory, and not a single person of Brackenfold has died.</p>
    <p>The villagers come out of their homes into the grey light and stand there, looking at their walls, their mill, their gate. Then, one by one, they look at you.</p>
    ${sys("SYSTEM","[Title Earned: WARDEN OF BRACKENFOLD]<br>Renown +3 · Morale +2")}`,
  held:`<p>The pack scatters once its leader falls. Two hunters are badly hurt and the edge fields are torn up, but by dawn every family in Brackenfold is alive.</p>
    ${sys("SYSTEM","[Title Earned: THE ONE WHO STAYED]<br>Renown +2 · Morale +1")}`,
  costly:`<p>The pack scatters at last, but Brackenfold has paid. Livestock lost, two homes torn open, and the miller's brother will walk with a limp for the rest of his life.</p>
    <p>Nobody blames you out loud. That only makes it heavier.</p>
    ${sys("SYSTEM","[Condition: RESOLVE]<br>You will not let this happen twice.<br>Renown +1")}`
}[F("result")];
return fin + (F("burned")?`<p>The granary is lost. It will be a hungry autumn.</p>`:"") + end;},
choices:[{label:"Face the village.", go:"end"}]},

end:{ title:"Part One Ends", text:()=>{
const seren={rival:"Somewhere west, Seren is waiting to see if you meant what you said.",
             ally:F("seren_knows")?"Somewhere west, Seren is searching a locked archive for the truth about your blood.":"You think you will write to Seren tonight. You think Seren will write back.",
             cold:"You wonder whether Seren will ever forgive the way you left."}[F("seren")];
const tone = S.stats.resent>=2
  ? `When you look west toward the capital, what you feel is not homesickness. It is something hotter, and it has a shape now. It looks like a wall.`
  : `For the first time since the font, you are not thinking about your father at all.`;
return `
<p>Old Bren finds you sitting on the wall at sunrise, covered in dirt to the elbows. He holds out a cup of bark tea.</p>
<p>${say(`"Three lords,"`)} he says, ${say(`"and none of them ever got their hands dirty."`)} He looks out at the village you have spent a week rebuilding. ${say(`"Welcome to Brackenfold, ${P("lord")} ${N()}."`)}</p>
${F("hidGrain")?`<p>Granny Pell walks past below the wall and nods to you once. You have kept her secret. The crown's tax collector is due in the autumn, and you will have to decide what that secret is worth.</p>`:""}
${F("honestLedger")?`<p>The honest ledger sits on your desk. When the crown's tax collector comes in the autumn, you will have nothing to hide, and perhaps nothing left over.</p>`:""}
<p>${seren} ${tone}</p>
${F("wrenAround")?`<p>Someone has left a carved wooden bird on your windowsill. You suspect Wren.</p>`:""}
${F("wren")?`<p>Wren is watching you from the healer's window. Whatever else Wren knows, you intend to learn it.</p>`:""}
<p>The silver mark on your palm is warm. ${S.codex.length} of ${codexTotal()} pages of the Elder Codex are open in your memory, and one is still sealed. Aurel was right about one thing: sooner or later, the great houses will see what you are building.</p>
<p>But not yet. Brackenfold still looks, from any hilltop, like the same poor village the crown wrote off years ago. You have one summer before the autumn assessment. One summer to make it something else.</p>
<p><em>End of Part One: The First Week.</em></p>`},
choices:[{label:"Begin Part Two: The Long Summer", go:"summerStart"}]},

/* ======================= PART TWO: THE LONG SUMMER ======================= */
summerStart:{ title:"The Long Summer", enter(){ S.phase="summer"; S.week=1; S.buildsLeft=perWeek(); S.weekReport=null; S.newPage=null; if(F("codex_on")) restorePage(); }, text:()=>`
<p>The thorns are gone. The fields are drying. And for the first time in years, people in Brackenfold are making plans for next year instead of just getting through this one.</p>
<p>Bren brings you the old crown ledger the last lord left behind. The final entry, four years old, is in the assessor's tidy hand: <em>Brackenfold. Roofs, 60, sound, 40. Wall, derelict. Mill, half working. Population 79. Assessment: not worth the ride.</em></p>
<p>${say(`"He'll be back in the autumn,"`)} Bren says. ${say(`"He always comes back in the autumn. The question is what he sees when he gets here."`)}</p>
${sys("PART TWO",`Time now passes in weeks · 8 weeks until autumn · 3 projects a week<br>Crews work all week · the village eats, grows, and earns<br>Goal: turn a Failing Hamlet into a Market Town`)}
${S.newPage?sys("ELDER CODEX",`[Page Restored: ${CODEX[S.newPage].name.toUpperCase()}]<br>Elder name: ${CODEX[S.newPage].elder}`):""}`,
choices:[{label:"Plan the first week of summer.", go:"plan"}]},

newcomers:{ title:"Smoke From Marrow Ford", text:()=>`
<p>The briar hounds that broke on your walls did not break everywhere. Marrow Ford, a hamlet two valleys north, lost half its houses and all its livestock. Fourteen survivors walk into Brackenfold with what they could carry.</p>
<p>Among them is a pair of stonemasons, a husband and wife named Ivo and Rhea Tallis, both grey with dust from the road. ${say(`"We heard you were building,"`)} Rhea says. ${say(`"We'll work for a roof."`)}</p>
<p>Housing: ${S.pop} people, room for ${housing()}.</p>`,
choices:[
  {label:"Take in all fourteen. Nobody gets turned away.", hint:"Population +14, Morale +1 · Masons join · Food −2", fx:{morale:1, food:-2, masons:true, takeAll:true}, go:"nextweek"},
  {label:"Take the masons and the families with children.", hint:"Population +8 · Masons join (stone crews +1)", fx:{masons:true, takeSome:true}, go:"nextweek"},
  {label:"Send them on to Hollin Cross with food for the road.", hint:"Food −2, Resentment +1", fx:{food:-2, resent:1}, go:"nextweek"}
]},

quarrel:{ title:"Garth and Oda", text:()=>`
<p>You walk into the hall to find Garth and Oda shouting at each other across a table, which is impressive, because neither of them usually says more than ten words a day.</p>
<p>Garth wants more hands at the lumber camp. Oda wants her hunters back on patrol, because something has been stripping the snares in the north wood, and it is not foxes.</p>
<p>They both turn and look at you.</p>`,
choices:[
  {label:"Side with Garth. Brackenfold needs timber now.", hint:"Timber +6", fx:{timber:6}, go:"nextweek"},
  {label:"Side with Oda. Something is in the woods.", hint:"Defense +1 · Learn what's out there", fx:{defense:1, snares:true}, go:"nextweek"},
  {label:"Make them draw up a shared rota, and sit there until they do.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"}
]},

letter:{ title:"A Letter From the West", text:()=>({
  ally:`<p>A courier brings a letter sealed with plain wax instead of the Valcrest crest. Seren's handwriting, cramped and fast.</p>
  <p>${say(`"I got into the archive room. It isn't debt records. It's two hundred years of reports on artificers: who awakened, where they were sent, who was watched. Father didn't start this. It's older than him. I'm sending what coin I can. Don't write back to the house."`)}</p>
  <p>Folded inside are three gold crowns.</p>`,
  rival:`<p>The letter is sealed with the Valcrest crest and three lines long.</p>
  <p>${say(`"Heard you survived the thorns. Heard you're playing mason. I'll be riding east after the harvest to see this village of yours for myself. Try not to embarrass the name before I get there. S."`)}</p>`,
  cold:`<p>The letter is from Father's steward, not Seren. A list of the Valcrest holdings on the eastern frontier, with Brackenfold at the bottom, beside a note: <em>No revenue expected.</em></p>
  <p>At the very bottom, in different ink, someone has added a single line: <em>Seren asked if you were alive. I said I did not know.</em></p>`
}[F("seren")]),
choices:()=>F("seren")==="ally" ? [
  {label:"Use the coin for the village.", hint:"Coin +3", fx:{coin:3, serenArchive:true}, go:"nextweek"},
  {label:"Send it back with a note: keep yourself safe first.", hint:"Morale +1, Resentment −1", fx:{morale:1, resent:-1, serenArchive:true}, go:"nextweek"}
] : F("seren")==="rival" ? [
  {label:"Write back: come and see. Bring a shovel.", hint:"Renown +1 · Seren will visit", fx:{renown:1, serenVisit:true}, go:"nextweek"},
  {label:"Pin the letter to the hall door and get back to work.", hint:"Morale +1 · Resentment +1", fx:{morale:1, resent:1, serenVisit:true}, go:"nextweek"}
] : [
  {label:"Write to Seren yourself, directly.", hint:"Resentment −1", fx:{resent:-1, seren:"ally"}, go:"nextweek"},
  {label:"Burn it.", hint:"Resentment +1", fx:{resent:1}, go:"nextweek"}
]},

glassShard:{ title:()=>F("tamsin")?"Tamsin's Find":"The Trader's Find", text:()=>`
<p>${F("tamsin")?"Tamsin":"A trader you have not met before"} unwraps something from a bundle of rags: a curved shard of something clear as ice, edged in green, found in a collapsed cellar three days south.</p>
<p>${say(`"Old work,"`)} ${F("tamsin")?"she":"he"} says. ${say(`"Elder work. I thought you might know what it is."`)}</p>
<p>The moment you touch it, the silver mark on your palm flares, and a page of the Codex you have not reached yet opens behind your eyes. Sand, ash, fire. Glass.</p>
${!knows("glass")?sys("ELDER CODEX","[Page Restored Early: GLASS]<br>Elder name: Vitrum"):""}`,
enter(){ if(!knows("glass")) S.codex.push("glass"); },
choices:()=>[
  {label:"Ask exactly where the cellar was.", hint:"Learn the location of Elder ruins", fx:{ruinsMap:true}, go:"nextweek"},
  {label:"Offer a standing trade deal for anything Elder made.", hint:"Coin +1 every week", fx:{route:true}, go:"nextweek"},
  {label:"Buy the shard and keep this between the two of you.", hint:"Coin −1 · Secrecy", req:()=>S.stats.coin>=1, fx:{coin:-1, quietElder:true}, go:"nextweek"}
]},

fever:{ title:"Summer Fever", text:()=>has("baths")||has("cistern")
? `<p>A summer fever comes up the trade road with a family of drovers, the kind that runs through river villages every few years and leaves graves behind it.</p>
   <p>In Brackenfold it barely takes hold. ${has("baths")?"People here wash in hot water now.":"People here drink from clean stone now, not the river."} Three are sick for a week. All three recover.</p>
   <p>The healer comes to find you, looking puzzled. ${say(`"I've never seen it go so easy. What did you do?"`)}</p>`
: `<p>A summer fever comes up the trade road with a family of drovers, the kind that runs through river villages every few years and leaves graves behind it. By the end of the week, eleven people in the east row are burning up.</p>
   <p>The Codex has something to say about this. Aurel's handwriting, half remembered: <em>bad water and dirty hands kill more than swords.</em></p>`,
choices:()=> (has("baths")||has("cistern")) ? [
  {label:`"The Elder builders knew. Clean water, clean people."`, hint:"Morale +1, Renown +1", fx:{morale:1, renown:1}, go:"nextweek"},
  {label:"Send the healer to the next valley to help them too.", hint:"Renown +2, Coin −1", fx:{renown:2, coin:-1}, go:"nextweek"}
] : [
  {label:"Quarantine the east row and boil every drop of water.", hint:"Morale −1 · Everyone survives", fx:{morale:-1}, go:"nextweek"},
  ...((F("wren")||F("wrenAround"))?[{label:"Send for Wren, who seems to know everything.", hint:"Wren's remedy · Morale +1", fx:{morale:1, wrenHelped:true}, go:"nextweek"}]:[]),
  {label:"Keep the crews working. There's no time to stop.", hint:"Population −5, Morale −2, Timber +3", fx:{morale:-2, timber:3, feverLoss:true}, go:"nextweek"}
]},

spark:{ title:()=>F("fen")?"Fen's First Work":"A Child With the Spark", text:()=>F("fen")
? `<p>You come back from the quarry to find a small footbridge over the mill race that was not there this morning. It is a little crooked. It is also hardened all the way through.</p>
   <p>Fen is sitting next to it, pale and exhausted and grinning so hard it looks painful. ${say(`"I did the whole thing,"`)} he says. ${say(`"By myself."`)}</p>
   <p>Behind him, three younger children are pressing their palms to the planks, trying to feel what he felt.</p>`
: `<p>A girl of about nine named Ama comes to you holding a cracked clay cup that is no longer cracked. Her mother is behind her, frightened. ${say(`"She just held it,"`)} the mother says. ${say(`"She just held it and it closed."`)}</p>`,
choices:[
  {label:"Teach every child who wants to learn, openly.", hint:"Craft +1, Morale +1 · People will talk", fx:{craft:1, morale:1, openSchool:true}, go:"nextweek"},
  {label:"Teach them, but quietly. Aurel said to build where no one can see.", hint:"Craft +1 · Secrecy", fx:{craft:1, quietElder:true, openSchool:true}, go:"nextweek"},
  {label:`${F("fen")?"Give Fen":"Give Ama"} a real job on the crews.`, hint:"Timber +2, Stone +2", fx:{timber:2, stone:2}, go:"nextweek"}
]},

rider:{ title:"A Rider on the Ridge", enter(){ add({riderSeen:true}); }, text:()=>`
<p>Oda sees him first, from the ${has("wallTowers")?"north tower":"watchtower"}: a single rider on the western ridge, in crown grey, with a spyglass. He sits there for most of the afternoon. Every so often he writes something down.</p>
<p>${say(`"Counting roofs,"`)} Bren says when you climb up to look. ${say(`"That's the assessor's scout. He's never bothered sending one before."`)}</p>
<p>${tier().lvl>=2?`From up here you can see why. Red tile where there was thatch. Grey stone where there was rotting timber. Smoke from ${has("glassworks")?"a glassworks, ":""}a forge, and a kiln. More roofs than the old ledger has ever recorded.`:`From up here you try to see what he sees. It is more than the old ledger. You hope it is enough.`}</p>
<p>The rider folds his spyglass and turns west. The assessor will follow within days.</p>
${sys("WARNING","[Event Approaching: THE AUTUMN ASSESSMENT]<br>Finish this week's work. Decide what the crown will see.","warn")}`,
choices:()=>[
  {label:"Show the crown everything. Brackenfold has nothing to be ashamed of.", hint:"Openness", fx:{showAll:true}, go:"nextweek"},
  {label:"Keep the Elder works quiet. Call it good masonry, nothing more.", hint:"Secrecy", fx:{hideElder:true}, go:"nextweek"},
  {label:"Throw a harvest feast the day he arrives. Let him see a happy town.", hint:"Food −3, Morale +2", req:()=>S.stats.food>=3, fx:{food:-3, morale:2, feast:true}, go:"nextweek"}
]},

harvest:{ title:"The First Harvest", text:()=>`
<p>The barley comes in all at once, the way it always does, and for four days everyone in Brackenfold who can hold a sickle is in the fields. ${has("terraces")?"The south terraces yield more than the old fields ever did.":""}${has("fields")?" The drained east fields, sour for five years, come in heavy and gold.":""}</p>
<p>When the last sheaf is in, Bren finds you sitting on a hay cart. ${say(`"There's a custom,"`)} he says. ${say(`"When the harvest is good, the lord decides what we do with the surplus. It hasn't come up in a while."`)}</p>
${F("speech")==="promise"?`<p>He adds, a little dryly: ${say(`"Also, you promised the roofs. Half the village is counting."`)} ${has("homes")&&(S.counts.cottages||0)>=1?"You are fairly sure you have kept that promise.":"You are not sure you have kept that promise yet."}</p>`:""}`,
choices:[
  {label:"Hold a harvest festival. Everyone has earned it.", hint:"Food −3, Morale +3", req:()=>S.stats.food>=3, fx:{food:-3, morale:3, festival:true}, go:"nextweek"},
  {label:"Store all of it. Winter on the frontier is long.", hint:"Food +4", fx:{food:4}, go:"nextweek"},
  {label:"Sell the surplus to the traders on the road.", hint:"Coin +4, Prosperity +1", fx:{coin:4, prosperity:1}, go:"nextweek"}
]},

weekEnd:{ title:"The Week's End", text:()=>`
<p>${["A quiet week. The crews work, the kiln smokes, and nobody shouts at anybody.",
     "The week ends with rain. The new channels carry it off exactly the way Aurel's notes said they would.",
     "Someone has started calling the square \"the Valcrest yard.\" You are not sure how you feel about that."][S.week%3]}</p>`,
choices:[{label:"Rest the town this week.", hint:"Morale +1", fx:{morale:1}, go:"nextweek"},{label:"Put everyone on overtime.", hint:"Timber +3, Stone +3, Morale −1", fx:{timber:3, stone:3, morale:-1}, go:"nextweek"}]},

collector:{ title:"The Autumn Assessment", text:()=>{
const t=tier();
const verdict = t.lvl>=2 ? `The assessor stops his horse at the top of the new road and simply sits there. He takes out his ledger, opens it to the old entry, looks at the village, looks at the ledger again. Then he very slowly closes it.`
             : t.lvl===1 ? `The assessor reins in at the gate, glances down at his ledger, and frowns. He looks up at the village, then back down, like a man checking a sum that does not add up.`
             : `The assessor rides in, glances around, and makes a short note. It is not a long note. You suspect you already know what it says.`;
return `
<p>Crown Assessor Idris Vane is a thin, tidy man with ink-stained cuffs and the expression of someone who has spent twenty years being lied to by farmers.</p>
<p>${verdict}</p>
<div class="compare">
  <figure>${mapSVG({then:true})}<figcaption>As the crown last recorded it</figcaption></figure>
  <figure>${mapSVG()}<figcaption>Brackenfold today</figcaption></figure>
</div>
${sys("ASSESSMENT",`Then · Population 79 · Roofs sound 40 · Wall derelict<br>Now · Population ${S.pop} · ${works()} works · Defense ${S.stats.defense}<br>Rank: ${t.name.toUpperCase()}`)}
${F("feast")?`<p>The harvest feast is already going when he arrives. Somebody hands him a cup before he is off his horse. For a moment his mouth does something that might be a smile.</p>`:""}
<p>${say(`"${t.lvl>=2?"Who did all this?":t.lvl===1?"This is Brackenfold?":"So. You're the new one."}"`)} he says.</p>`},
choices:()=>[
  {label:`"The people of Brackenfold did. I just showed them how."`, hint:"Renown +2", fx:{renown:2, answer:"people"}, go:"collector2"},
  {label:`"I did. And I'd like to discuss the assessment."`, hint:"Resentment +1, Renown +1", fx:{resent:1, renown:1, answer:"self"}, go:"collector2"},
  ...(F("hidGrain")?[{label:"Say nothing about the grain under Granny Pell's loom.", hint:"Keep the secret · risky", fx:{answer:"grain"}, go:"collector2"}]:[])
]},

collector2:{ title:"The Assessor's Ledger", text:()=>{
const t=tier();
return `
<p>Vane spends two days walking every street with his ledger open. He counts the cottages. He weighs a sack from the granary. He spends a very long time running his hand along ${has("concrete")?"the grey concrete wall, and an even longer time asking where the stone came from":"the walls"}.</p>
${F("hideElder")&&has("concrete")?`<p>You tell him it is a lime mortar your masons know. He writes that down. He does not look like he believes it.</p>`:""}
${F("showAll")?`<p>You show him everything, the kiln, the arches, the Codex sketches pinned up in the hall. He copies three of them into his ledger with great care.</p>`:""}
${F("answer")==="grain"?`<p>On the second evening he stands in Granny Pell's house for a long moment, looking at the floor under her loom. Then he walks out without a word. You have no idea what that means.</p>`:""}
<p>On the third morning he mounts up. ${say(`"I will be honest with you, ${P("lord")} ${N()},"`)} he says. ${say(`"${t.lvl>=2?`Four years ago this place was not worth the ride. Today it is the most valuable holding on the eastern frontier, and your assessment will triple. And when I file this report, the capital is going to read it. All of them. Your father. The other houses. I would get ready, if I were you.`:t.lvl===1?`This village is not what it was. Your assessment will rise. And someone in the capital will notice that it rose.`:`I'll be back next autumn. I hope there's more to count.`}"`)}</p>
<p>You watch him ride west on the Elder road${has("road")?"":" that you never finished building"}, toward the capital, carrying a ledger with Brackenfold's name in it.</p>
<p><em>End of Chapter One.</em></p>`},
choices:[{label:"See your chapter results", go:"summary"}]},

summary:{ title:"Chapter One Complete", text:()=>{
const allies=[F("tamsin")&&"Tamsin Rook",(F("wren")||F("wrenAround"))&&"Wren",F("fen")&&"Fen",F("seren")==="ally"&&"Seren"].filter(Boolean);
return `
${mapSVG()}
${regionSVG()}
${sys("CHAPTER RESULT",`${{triumph:"Triumph",held:"The Line Held",costly:"A Costly Dawn"}[F("result")]}<br>Rank: ${tier().name}<br>Population: ${S.pop}<br>Projects completed: ${works()}<br>Codex pages: ${S.codex.length} of ${codexTotal()}<br>Villagers working: ${workers()}<br>Allies: ${allies.join(", ")||"None yet"}<br>Craft rank: ${rank()}`)}
<div class="ad">Ad slot (interstitial between chapters)<br>AdMob placement goes here in the Android build</div>
<p>Next, Chapter Two: <em>The Thornwood Winter</em>. The assessor's report is on its way west, ${F("serenVisit")?"Seren is riding east after the harvest, ":""}${F("snares")?"something is stripping the snares in the north wood, ":""}and one page of the Codex is still sealed. Your village, stats, and choices carry forward.</p>`},
choices:[{label:"Continue to Chapter Two", go:"c2open"},{label:"Play Chapter One again with different choices", restart:true}]},

/* ============================================================
   CHAPTER TWO: THE THORNWOOD WINTER
   Same shape as Chapter One:
   opening story → Part One (5 days, ends in a crisis) →
   Part Two (6 weeks of building) → an arrival that ends the chapter
   ============================================================ */
c2open:{ title:"Chapter Two: The Thornwood Winter", enter(){ add({tamsin:true});
  if(S.chapter!==2){ S.snap={built:S.built.slice(), counts:{...S.counts}, pop:S.pop};
    S.chapter=2; S.phase="snow"; S.day=1; S.buildsLeft=perDay(); S.week=0; S.newPage=null; S.weekReport=null; S.lastBuilt=null; }
}, text:()=>`
<p>The first snow comes three weeks after Assessor Vane rides west, early and heavy, the way old Bren says it only comes in bad years.</p>
<p>News comes with it. A rider from Hollin Cross, stamping his boots in the hall, says the assessor's report was read aloud before the royal council. ${F("showAll")?say(`"They say he brought drawings. Arches and kilns and walls poured like porridge. The word everyone keeps using is Elder."`):say(`"Nobody in the capital can work out how a hamlet tripled its worth in a summer. They're asking questions."`)}</p>
<p>The rider also carries a letter sealed in Valcrest red. Two lines in your father's hand: <em>I have read the assessor's report. Expect a visitor before midwinter.</em></p>
${F("tamsin")?"":`<p>A trader in a mud stained coat came in with the rider: Tamsin Rook, the woman whose wagon you once rode past on the eastern road. ${say(`"You didn't stop for me,"`)} she says cheerfully. ${say(`"I stopped for you anyway. Brackenfold is where the money is now."`)} She has been your supplier ever since.</p>`}
<p>And then Oda, who has not waited for the rider to finish, pulls you aside. ${say(`"The north wood moved,"`)} she says. ${say(`"I mean it. The thorn line is thirty paces closer than it was in spring. It's growing over my old snare posts."`)}</p>
${sys("CHAPTER TWO","The Thornwood Winter<br>Part One: The First Snow · 5 days<br>Part Two: The Long Winter · 6 weeks")}`,
choices:[
  {label:"Go see the treeline yourself, right now.", hint:"Craft +1", fx:{craft:1}, go:"c2tree"},
  {label:"Call the village to the hall first. Nobody panics alone.", hint:"Morale +1", fx:{morale:1}, go:"c2tree"},
  {label:"Read your father's letter again. What visitor?", hint:"Resentment +1", fx:{resent:1}, go:"c2tree"}
]},

c2tree:{ title:"The Thorn Line", text:()=>`
<p>The thorns are moving. Not quickly. But if you stand still long enough at the edge of the north wood, you can watch a vine as thick as your wrist inch across the snow like the hand of a clock.</p>
<p>When you kneel and touch the ground, the silver mark on your palm turns ice cold. Under the roots, under the soil, there is something <em>built</em>. Stone, fitted the Elder way, stretching north further than you can feel.</p>
${sys("ELDER CODEX","[Sealed Page: REACTING]<br>Something beneath the Thornwood matches the sealed page.")}
${(F("wren")||F("wrenAround"))?`<p>${say(`"You feel it,"`)} says Wren, who is suddenly beside you, as Wren always is. ${say(`"Good. I was hoping I wouldn't have to explain."`)}</p>`:`<p>${say(`"You feel it, don't you?"`)} says a voice behind you. A hooded stranger is leaning on a staff at the edge of the snow. ${say(`"Name's Wren. I've been watching this wood for nine years. I think it's time we talked, artificer."`)}</p>`}
<p>Wren tells it plainly. At the heart of the north wood stands an Elder ruin, a great vault of glass and stone that the Elder builders called a Garden. It was made to feed a whole province through the worst winters. When the empire fell, nobody tended it. Its heart cracked. And something in it began to defend itself.</p>
<p>${say(`"The briar hounds,"`)} Wren says, ${say(`"are the Garden's fever. And the fever is getting worse."`)}</p>`,
enter(){ add({wren_met:true}); },
choices:[
  {label:`"Then we go in. Will you guide us?"`, hint:"Wren will guide the expedition", fx:{wrenGuide:true}, go:"c2visitor"},
  {label:`"Can it be fixed? Or does it need to be destroyed?"`, hint:"Lore", fx:{gardenLore:true}, go:"c2visitor"},
  {label:`"Nine years. And you're telling me now."`, hint:"Resentment +1", fx:{resent:1}, go:"c2visitor"}
]},

c2visitor:{ title:"The Visitor", text:()=>{
const sk=F("seren");
const look = tier().lvl>=2 ? "Seren rides up the Elder road, stops at the gatehouse, and simply stares: at the grey walls, the red roofs, the smoke from the kiln and the forge."
                           : "Seren rides in through the gate and looks around slowly, taking in every new roof and every patched wall.";
return `<p>The visitor arrives two days later on a tall grey horse, alone, wrapped in a crimson riding cloak: Seren Valcrest.</p>
<p>${look}</p>
${sk==="ally"?`<p>${say(`"Father sent me,"`)} Seren says, swinging down. ${say(`"Officially, to see whether the report is true. Unofficially, I brought you this."`)} A leather case, very old. Inside are the archive pages: two hundred years of names. Artificers awakened in noble houses, and where each one was sent.</p>
<p>${say(`"Most of them are dead,"`)} Seren says quietly. ${say(`"One isn't. A woman called Marisol Venn, sent to a mountain monastery forty years ago. I think the Spire has been watching every one of them."`)}</p>`
: sk==="rival"?`<p>${say(`"So,"`)} Seren says, pulling off one glove, then the other. ${say(`"This is the village you've been playing at. Father wanted to know if the report is true. I want to know something else."`)} A small flame blooms in Seren's palm. ${say(`"I want to know if you could stop me."`)}</p>`
: `<p>Seren's greeting is stiff and formal, the way strangers greet each other at court. ${say(`"Father sent me to confirm the assessor's report."`)} A pause. ${say(`"I asked to be the one who came."`)} That is the only crack in the armor, and it closes again as quickly as it opened.</p>`}`;},
choices:()=>F("seren")==="ally" ? [
  {label:`"Stay the winter. I could use a fire mage on the wall."`, hint:"Seren stays · Defense +2", fx:{serenHere:true, defense:2, registry:true}, go:"plan"},
  {label:`"Go back. Find out what the Spire wants with us."`, hint:"Seren returns west · learn more in Chapter Three", fx:{serenSpy:true, registry:true}, go:"plan"}
] : F("seren")==="rival" ? [
  {label:"Accept the challenge. Out in the snowfield, now.", hint:"A duel of flame and stone", fx:{}, go:"c2spar"},
  {label:`"I don't fight you anymore, Seren. Let me show you what I built."`, hint:"Seren is quieter after the tour · Seren stays", fx:{serenHere:true, seren:"ally", resent:-1}, go:"plan"},
  {label:`"Go home and tell Father it's all true."`, hint:"Resentment +1", fx:{resent:1}, go:"plan"}
] : [
  {label:`"I'm sorry for how I left. I mean that."`, hint:"Seren softens · Seren stays", fx:{seren:"ally", serenHere:true, resent:-1}, go:"plan"},
  {label:"Show Seren the town as formally as Seren asked.", hint:"Renown +1", fx:{renown:1}, go:"plan"},
  {label:"Show Seren the Codex sketches, privately.", hint:"Trust · Seren becomes a secret ally", fx:{seren:"ally", serenSpy:true, seren_knows:true}, go:"plan"}
]},

c2spar:{ title:"Flame and Stone", text:()=>`
<p>Half the village follows you out to the snowfield below the wall and stands in a ring, stamping their feet. Seren takes position thirty paces away and does not wait for a signal.</p>
<p>The fire comes as a wave, low and fast, melting the snow into steam as it rolls. Last spring, at the font, you would have run. Now you put your hand flat on the frozen ground.</p>`,
choices:[
  {label:"Raise a stone dome over Seren's fire and seal it shut.", hint:"Needs Reshape", req:()=>F("reshape"), fx:{sparWin:true, serenHere:true, seren:"ally", renown:2}, go:"c2spar2"},
  {label:"Throw up wall after wall and let Seren burn out.", hint:"Endurance", fx:{sparDraw:true, serenHere:true, renown:1}, go:"c2spar2"},
  {label:"Step aside and let the fire pass. You have nothing to prove.", hint:"Resentment −1", fx:{resent:-1, serenHere:true}, go:"c2spar2"}
]},

c2spar2:{ title:"Flame and Stone", text:()=>F("sparWin")
? `<p>The ground folds up around the fire like a closing hand. For a moment there is only a smooth grey dome in the snowfield, steaming. Then you open a door in its side, and Seren steps out coughing, singed, and laughing for the first time you can remember.</p>
   <p>${say(`"Father has no idea,"`)} Seren says. ${say(`"None. I'm staying the winter. Someone has to see what you do next."`)}</p>`
: F("sparDraw") ? `<p>It goes on until both of you are on your knees in slush, Seren out of fire and you out of stone. Nobody won. The village cheers anyway. Seren stays for supper, then for the night, then quietly says nothing about leaving.</p>`
: `<p>The fire roars past and dies in the snow. Seren stares at you, breathing hard. ${say(`"You didn't even try."`)}</p><p>${say(`"I don't need to beat you anymore,"`)} you say. Seren does not leave that night, or the next.</p>`,
choices:[{label:"Back to work. Winter is coming in fast.", go:"plan"}]},

/* ---------- Chapter Two, Part One: daily events ---------- */
roster:{ title:"The Expedition", text:()=>`
<p>Wren draws the path on the hall table in charcoal: two days into the north wood, along the frozen river, to a hill that is not a hill. ${say(`"Small party,"`)} Wren says. ${say(`"The Garden notices crowds. Two companions, at most. Choose who walks beside you."`)}</p>
<p>${F("wrenGuide")?"Wren will guide you either way.":"Wren will show you the way to the edge of the vault, no further."}</p>`,
choices:()=>[
  {label:"Oda. Nobody tracks or shoots better.", hint:"Safer route through the wood", fx:{companion:"oda"}, go:"nextday"},
  {label:"Garth. Someone needs to swing an axe at those vines.", hint:"Cuts a straight path", fx:{companion:"garth"}, go:"nextday"},
  ...(F("serenHere")?[{label:"Seren. Fire against thorns.", hint:"Burns through the guardians", fx:{companion:"seren"}, go:"nextday"}]:[]),
  ...(F("fen")?[{label:"Fen. Two artificers are better than one.", hint:"Helps at the heart · Fen will be in danger", fx:{companion:"fen"}, go:"nextday"}]:[])
]},

thornRaid:{ title:"Thorns at Night", text:()=>`
<p>The hounds come back on the second night, a small pack testing the north wall in the snow. ${S.stats.defense>=9?"They find nothing. Grey stone, archers in the towers, and a wall that does not even shiver. By midnight they have slunk back into the trees.":"They find a weak point near the old fields and claw through before Oda's hunters drive them back with torches. Two sheep are lost and a fence is torn up."}</p>
<p>In the morning, one hound lies dead below the wall.</p>`,
enter(){ if(S.stats.defense<9) add({food:-2}); },
choices:[
  {label:"Study the dead hound with your hands.", hint:"Craft +1 · Learn what they are", fx:{craft:1, studied:true}, go:"nextday"},
  {label:"Burn back the thorn line along the north fields.", hint:"Timber −3 · The Garden will notice", fx:{timber:-3, burnedEdge:true, defense:1}, go:"nextday"},
  {label:"Thank the watch and double the night shift.", hint:"Morale +1", fx:{morale:1}, go:"nextday"}
]},

aurelWarns:{ title:"Aurel in the Snow", text:()=>`
<p>The dream comes again, but this time the ruined city is under snow. Aurel Valcrest is standing in front of a vast dome of green glass and grey stone, cracked from top to bottom, with thorn vines spilling out of the crack like blood from a wound.</p>
<p>${say(`"I came here once,"`)} he says without turning around. ${say(`"I was too young and too afraid. The Garden was still sleeping then. It isn't sleeping now."`)}</p>
<p>${F("studied")?`${say(`"You touched one of the hounds. Then you know they aren't animals. They're roots, shaped into hunters. The Garden grows them the way your body grows a scab."`)}`:""}</p>
${sys("ELDER CODEX","[Sealed Page: HALF OPEN]<br>The Dome. Half the page is readable now.")}`,
enter(){ add({domeHalf:true}); },
choices:[
  {label:`"How do I heal it?"`, hint:"Learn the way to tame the Garden", fx:{tameHint:true}, go:"nextday"},
  {label:`"How do I kill it?"`, hint:"Learn the way to destroy it", fx:{destroyHint:true}, go:"nextday"},
  {label:`"Why did the Elder Empire fall, Aurel?"`, hint:"Lore", fx:{elderFall:true}, go:"aurelFall"}
]},

aurelFall:{ title:"Aurel in the Snow", text:()=>`
<p>Aurel is quiet for a long time. ${say(`"Not to an army,"`)} he says at last. ${say(`"To people who decided that building was beneath them. They stopped teaching. They stopped tending. They let the masons be servants and the mages be kings. And one cold winter, nothing worked anymore, and nobody remembered how to fix it."`)}</p>
<p>He finally looks at you. ${say(`"Sound familiar?"`)}</p>
${sys("LORE","[Fragment Recovered: The Long Forgetting]")}`,
choices:[{label:"Wake.", go:"nextday"}]},

vaneLetter:{ title:"A Private Letter", text:()=>`
<p>A letter arrives that is not sealed with any crest at all. The handwriting is very small and very tidy: Assessor Idris Vane.</p>
<p>${F("showAll")
  ? say(`"I made a mistake. I included copies of your sketches in my report. Within a week, two magisters of the Spire came to my office asking for the originals. They asked about you by name. I told them nothing more, but I thought you should know."`)
  : F("hideElder") ? say(`"Your 'lime mortar' has been the subject of considerable discussion. Two magisters of the Spire visited my office. They did not believe it either. I told them nothing more, but I thought you should know."`)
  : say(`"Two magisters of the Spire came to my office after my report was filed and asked a great many questions about Brackenfold. I answered what I had to. I thought you should know."`)}</p>
<p>The Spire. The Royal Academy of Mages, which tests every awakening in the kingdom, and which, if Seren is right, has been watching every artificer for two hundred years.</p>`,
choices:[
  {label:"Write back and thank him. An honest assessor is worth knowing.", hint:"Vane becomes an ally", fx:{vaneAlly:true}, go:"nextday"},
  {label:"Burn the letter. If the Spire is watching, it can watch the smoke.", hint:"Resentment +1", fx:{resent:1}, go:"nextday"},
  {label:"Show the letter to Bren and the hall council.", hint:"Morale +1 · Brackenfold prepares together", fx:{morale:1, councilKnows:true}, go:"nextday"}
]},

expEve:{ title:"Packing for the Thornwood", text:()=>`
<p>The night before the expedition, you lay out what you can carry on the hall table. One pack. Two days in, two days out, if things go well.</p>
<p>${({oda:"Oda checks her bowstrings twice and says nothing.",garth:"Garth is sharpening his axe in the corner, very slowly, with great love.",seren:"Seren is sitting by the fire, flicking small flames between fingers.",fen:"Fen keeps opening and closing his hands, trying to feel the stone in the hearth."})[F("companion")]}</p>
<p>You have room for one more load.</p>`,
choices:[
  {label:"Lime, oil, and fire pots.", hint:"Against the thorns", fx:{kit:"fire"}, go:"thorn1"},
  {label:"Wedges, a mason's hammer, and a sack of Elder concrete mix.", hint:"For whatever is built in there", fx:{kit:"mason"}, go:"thorn1"},
  {label:"Rope, food, and extra blankets.", hint:"To get everyone home", fx:{kit:"supplies"}, go:"thorn1"}
]},

/* ---------- Chapter Two climax: the Garden ---------- */
thorn1:{ title:"Into the Thornwood", enter(){ S.phase="expedition"; }, text:()=>`
<p>The north wood closes over you within an hour. The trees are black and silent under the snow, and the thorns are everywhere: hanging from branches, coiled at the roots, crossing the path in front of you and sometimes, when you look back, behind you too.</p>
<p>${say(`"It knows we're here,"`)} Wren murmurs. ${say(`"Choose your road."`)}</p>`,
choices:()=>[
  {label:"Follow the frozen river. Thorns can't grow on ice.", hint:F("companion")==="oda"?"Oda knows this river":"Slow but open", fx:{route:"river"}, go:"thorn2"},
  {label:"Cut straight through toward the hill.", hint:F("companion")==="garth"||F("companion")==="seren"?"Your companion can clear the way":"Fast and dangerous", fx:{route:"straight"}, go:"thorn2"},
  ...(knows("road")?[{label:"Feel for the Elder road you sense under the roots.", hint:"Codex: The Layered Road", fx:{route:"elder"}, go:"thorn2"}]:[])
]},

thorn2:{ title:"The Gardener", text:()=>{
const r={river:`You walk the frozen river for a day and a half${F("companion")==="oda"?", Oda reading every crack in the ice":""}. The thorns line both banks, reaching, but they cannot follow you onto the ice.`,
         straight:`You cut straight through the wood${F("companion")==="garth"?", Garth's axe ringing ahead of you like a bell":F("companion")==="seren"?", Seren's fire opening a smoking tunnel through the vines":", hacking at the vines with whatever you have"}.`,
         elder:`Under a foot of moss and roots you find it: fitted paving, a crowned center, ditches on either side. The four Elder layers, exactly as the Codex shows them. The road runs straight to the hill, and the thorns, strangely, will not grow across it.`}[F("route")];
return `<p>${r}</p>
<p>The hill that is not a hill rises out of the forest at dusk: a great dome of green glass and grey stone, half buried in earth and thorns, cracked from crown to base. In front of the only door stands a figure three times your height, made of fitted stone blocks held together by roots as thick as cables. Its head turns toward you with a sound like a millstone.</p>
${sys("WARNING","[Elder Guardian: THE GARDENER]<br>It was built to protect the vault. It still is.","warn")}`;},
choices:()=>[
  {label:"Hold up your palm and show it the silver mark.", hint:F("domeHalf")?"The half-open page tells you this might work":"A gamble", fx:{guard:"mark"}, go:"thorn3"},
  {label:"Reshape the stone joints of its knees and bring it down.", hint:"Needs Reshape", req:()=>F("reshape"), fx:{guard:"reshape"}, go:"thorn3"},
  ...(F("companion")==="seren"?[{label:"Have Seren burn the roots that hold it together.", hint:"Seren's fire", fx:{guard:"fire"}, go:"thorn3"}]:[]),
  {label:"Distract it while Wren slips past to the door.", hint:"Risky", fx:{guard:"distract"}, go:"thorn3"}
]},

thorn3:{ title:"The Heart of the Garden", text:()=>{
const g={mark:F("domeHalf")?`The Gardener stops. It leans down until its stone face is level with your hand, studies the silver mark for a long moment, and then, very slowly, it steps aside and kneels.`:`The Gardener stops, studies the mark, and seems to hesitate. Then it swings anyway. You throw yourself sideways and the blow shatters a tree. It takes everything you have to get through the door.`,
         reshape:`You run under its stride and slap both palms on its knee joint. The stone softens like wet clay and the Gardener folds, crashing down into the snow. It does not get up again. You feel, strangely, sorry for it.`,
         fire:`Seren's fire races up the roots like a fuse. The stone blocks lose their binding and the Gardener comes apart in a rumbling avalanche of masonry.`,
         distract:`You shout and throw stones while Wren darts for the door. The Gardener's fist comes down a hand's width from ${F("companion")==="fen"?"Fen":"your companion"}. Everyone gets inside, but not cleanly.`}[F("guard")];
return `<p>${g}</p>
<p>Inside, the Garden is warm. Impossibly warm, like late spring. Under the cracked glass dome there are terraces of black earth, channels of still water, the ghosts of orchards. And at the center, rising from a stone basin, a single root as wide as a house, wrapped around a heartstone of green crystal the size of a cart.</p>
<p>The heartstone is cracked straight through. Thorns grow from the crack like a fever made solid.</p>
<p>${say(`"It's alive,"`)} ${F("companion")==="fen"?"Fen whispers":"you whisper"}. ${say(`"And it's in pain."`)}</p>`;},
choices:()=>[
  {label:"Mend the heartstone. Heal the Garden.", hint:F("domeHalf")||S.stats.craft>=6?"You think you know how":"Needs Craft 6 or the half-open page", req:()=>F("domeHalf")||S.stats.craft>=6, fx:{thornFate:"tamed"}, go:"thornEnd"},
  {label:"Shatter the heartstone. End the thorns forever.", hint:"The Thornwood dies with it", fx:{thornFate:"destroyed"}, go:"thornEnd"},
  {label:"Seal the crack in stone and leave it sleeping.", hint:F("kit")==="mason"?"Your concrete mix is perfect for this":"Needs your mason's kit or Reshape", req:()=>F("kit")==="mason"||F("reshape"), fx:{thornFate:"sealed"}, go:"thornEnd"}
]},

thornEnd:{ title:"The Garden", enter(){
  let sc = 0;
  sc += ({river:F("companion")==="oda"?2:1, straight:(F("companion")==="garth"||F("companion")==="seren")?2:0, elder:3})[F("route")];
  sc += ({mark:F("domeHalf")?3:0, reshape:2, fire:2, distract:0})[F("guard")];
  sc += ({fire:F("thornFate")==="destroyed"?2:1, mason:F("thornFate")==="sealed"?2:1, supplies:1})[F("kit")];
  S.flags.expScore=sc; S.flags.hurt = sc<4;
  const fate=F("thornFate");
  if(fate==="tamed"){ if(!knows("dome")) S.codex.push("dome"); CODEX.dome.sealed=false; CODEX.dome.name="The Dome"; CODEX.dome.elder="Tholus"; CODEX.dome.unlocks="domeHall"; add({renown:3, morale:2}); }
  if(fate==="destroyed"){ add({timber:12, defense:1, renown:2}); }
  if(fate==="sealed"){ add({defense:2, renown:1}); }
  if(S.flags.hurt) add({morale:-1});
}, text:()=>{
const f={
 tamed:`<p>You press both hands to the heartstone and pour everything you have into the crack. It is like mending a wound in a living thing, which is exactly what it is. The crystal draws closed. The thorns shiver, then blacken, then fall away from the great root like dead skin.</p>
  <p>And the Garden <em>breathes</em>. The light under the dome turns gold. The black terraces stir. Somewhere far behind you, out in the snow, every thorn in the north wood goes still at once.</p>
  ${sys("ELDER CODEX","[Sealed Page Restored: THE DOME]<br>Elder name: Tholus<br>How to raise a dome with no pillars inside it.")}`,
 destroyed:`<p>You lay your hand on the heartstone, find the crack, and pull it apart. The crystal screams, a sound you will hear for weeks, and shatters into a thousand green shards. The great root goes grey. The thorns crumble to dust.</p>
  <p>When you walk out, the Thornwood is dying around you, vines falling from the branches like rope cut loose. By spring it will be an ordinary forest, full of good dead timber. The Garden will never feed anyone again.</p>`,
 sealed:`<p>${F("kit")==="mason"?"You mix the Elder concrete with snowmelt and pack it into the crack.":"You shape stone from the basin itself and fold it over the crack."} The heartstone dims under the seal. The thorns slow, then stop, then go quiet. It is not healed. It is sleeping.</p>
  <p>${say(`"That will hold for a while,"`)} Wren says. ${say(`"Not forever. You know that."`)}</p>`}[F("thornFate")];
return f + (F("hurt") ? `<p>The way home is hard. ${({oda:"Oda",garth:"Garth",seren:"Seren",fen:"Fen"})[F("companion")]} is hurt on the return, a deep thorn wound in the leg, and you carry them the last mile to the gate. They will recover, but slowly.</p>` : `<p>You walk home on the third day with everyone you brought, and the whole village is waiting on the wall.</p>`)
  + `<p><em>End of Part One: The First Snow.</em></p>`;},
choices:[{label:"Begin Part Two: The Long Winter", go:"winterStart"}]},

/* ---------- Chapter Two, Part Two: the long winter ---------- */
winterStart:{ title:"The Long Winter", enter(){ S.phase="winter"; S.week=1; S.buildsLeft=perWeek(); S.weekReport=null; S.newPage=null; }, text:()=>`
