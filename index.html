<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="description" content="An exiled noble, the magic of builders, and a frontier town to raise. A choice game in seven chapters.">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>html{color-scheme:dark}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Forged in Exile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cinzel+Decorative:wght@700&family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow reading column like a manhwa panel strip; glowing "system windows" for stats; the village appears as an ink survey sketch on parchment. Dark only, by design. */
:root{
  --ink:#0e1116; --panel:#171b23; --paper:#e8e3d6; --muted:#8f97a6;
  --ember:#e0a54a; --rune:#6fd3ff; --danger:#e0605a; --line:#2a303c;
  --sk-paper:#e4d9bf; --sk-ink:#2e261a; --sk-ghost:rgba(46,38,26,.32); --sk-wash:#c9873a; --sk-water:#6f95a8;
  --display:"Cinzel Decorative","Trajan Pro",Georgia,serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  --sys:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:18px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;padding-block:24px 96px;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mark{font-family:var(--display);font-size:15px;color:var(--ember);letter-spacing:.06em}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--sys);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:4px}
.ghost:hover,.ghost:focus-visible{color:var(--paper);border-color:var(--muted);outline:none}
.ghost[aria-pressed=true]{color:var(--rune);border-color:var(--rune)}
.chapter{font-family:var(--sys);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-size:clamp(32px,8vw,52px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:24px;line-height:1.25;margin:0;color:var(--ember);text-wrap:balance}
.story{display:flex;flex-direction:column;gap:16px}
.story p{margin:0}
.story em{color:#f3dfb8}
.say{color:#f3dfb8}
.sys{border:1px solid var(--rune);background:linear-gradient(180deg,rgba(111,211,255,.10),rgba(111,211,255,.03));
  box-shadow:0 0 0 1px rgba(111,211,255,.15),0 0 24px rgba(111,211,255,.18);border-radius:3px;padding:12px 14px;
  font-family:var(--sys);font-size:14px;line-height:1.5;color:var(--rune);animation:pop .5s ease-out}
.sys b{display:block;font-size:11px;letter-spacing:.18em;opacity:.75;margin-bottom:4px}
.sys.warn{border-color:var(--danger);color:#ffb3ae;background:rgba(224,96,90,.08);box-shadow:0 0 20px rgba(224,96,90,.15)}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.choice{text-align:left;background:var(--panel);color:var(--paper);border:1px solid var(--line);border-left:3px solid var(--ember);
  padding:14px 16px;border-radius:2px;font-size:17px;line-height:1.45;transition:background .15s,border-color .15s}
.choice:hover,.choice:focus-visible{background:#1f2430;border-color:var(--ember);outline:none}
.choice small{display:block;font-family:var(--sys);font-size:11px;letter-spacing:.05em;color:var(--muted);margin-top:4px;line-height:1.5}
.choice[disabled]{opacity:.42;cursor:not-allowed;border-left-color:var(--line)}
.choice.build{border-left-color:var(--rune)}
.choice.build:hover,.choice.build:focus-visible{border-color:var(--rune)}
.field{display:flex;flex-direction:column;gap:6px}
label{font-family:var(--sys);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text]{font:inherit;background:var(--panel);color:var(--paper);border:1px solid var(--line);padding:12px;border-radius:2px;width:100%;box-sizing:border-box}
input[type=text]:focus{outline:2px solid var(--ember);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 90px;background:var(--panel);color:var(--paper);border:1px solid var(--line);padding:10px;border-radius:2px}
.seg button[aria-pressed=true]{border-color:var(--ember);color:var(--ember)}
.primary{background:var(--ember);color:#1a1206;border:0;padding:14px 18px;border-radius:2px;font-weight:600;font-size:17px}
.primary:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.res{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--sys);font-size:12px;color:var(--muted);letter-spacing:.04em}
.res span b{color:var(--paper);font-variant-numeric:tabular-nums}
.crews{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.crew-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--sys);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rune)}
.crew-head span:last-child{color:var(--muted);letter-spacing:.06em}
.crew-row{display:grid;grid-template-columns:1fr auto 74px;align-items:center;gap:10px}
.crew-name{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.crew-name strong{font-size:16px;font-weight:600}
.crew-name span{font-family:var(--sys);font-size:11px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.step{width:34px;height:34px;border-radius:2px;border:1px solid var(--line);background:#11151c;color:var(--paper);font-family:var(--sys);font-size:18px;line-height:1}
.step:hover:not([disabled]),.step:focus-visible{border-color:var(--rune);color:var(--rune);outline:none}
.step[disabled]{opacity:.35;cursor:not-allowed}
.stepper output{min-width:18px;text-align:center;font-family:var(--sys);font-variant-numeric:tabular-nums}
.crew-out{font-family:var(--sys);font-size:12px;color:var(--rune);text-align:right;font-variant-numeric:tabular-nums}
.crew-last{font-family:var(--sys);font-size:12px;color:var(--ember)}
.codex{background:var(--sk-paper);color:var(--sk-ink);border-radius:2px;padding:14px;box-shadow:inset 0 0 40px rgba(120,90,40,.35),0 6px 18px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px}
.codex h3{margin:0;font-family:var(--hand);font-size:22px;font-weight:700;line-height:1.2}
.page{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start;border-top:1px solid rgba(46,38,26,.25);padding-top:12px}
.page-art svg{width:100%;height:auto;display:block}
.page-art text{font-family:var(--hand);fill:var(--sk-ink)}
.page h4{margin:0;font-family:var(--hand);font-size:22px;line-height:1.1}
.page h4 span{font-size:16px;opacity:.6;font-style:italic}
.page p{margin:4px 0 0;font-size:15px;line-height:1.5}
.page .unl{font-family:var(--sys);font-size:11px;letter-spacing:.04em;color:#7a4a12}
.page.locked{opacity:.55}
@media (max-width:420px){.page{grid-template-columns:1fr}.page-art{max-width:160px}}
.tierbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 14px}
.tierbar b{display:block;font-family:var(--display);color:var(--ember);font-size:17px}
.tierbar span{font-family:var(--sys);font-size:11px;color:var(--muted)}
.pips{display:flex;gap:5px}.pips i{width:12px;height:12px;border:1px solid var(--ember);transform:rotate(45deg)}.pips i.on{background:var(--ember)}
.res small{color:var(--muted)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare figure{margin:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.compare figcaption{font-family:var(--sys);font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em}
@media (max-width:520px){.compare{grid-template-columns:1fr}}
.chapters{display:flex;flex-direction:column;gap:12px}
.chap{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;color:var(--paper)}
.chap-n{font-family:var(--display);color:var(--ember);font-size:16px;text-align:center;padding-top:2px}
.chap-body{min-width:0}
.chap-body b{font-family:var(--body);font-size:16px}
.chap-body span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.chap-body p{margin:4px 0 0;font-family:var(--body);font-size:14px;line-height:1.5;color:var(--muted)}
.chap.now .chap-body b{color:var(--rune)}
.chap.soon{opacity:.6}
.crew-note{font-size:14px;color:var(--muted);font-style:italic}
/* stat sheet */
.sheet{background:var(--panel);border:1px solid var(--rune);border-radius:3px;padding:16px;font-family:var(--sys);font-size:13px;color:var(--rune);box-shadow:0 0 24px rgba(111,211,255,.15)}
.sheet h3{margin:0 0 10px;font-size:11px;letter-spacing:.2em}
.row{display:grid;grid-template-columns:100px 1fr 28px;align-items:center;gap:10px;margin:6px 0}
.bar{height:6px;background:#0b1a22;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rune)}
.row.bad .bar i{background:var(--danger)}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.sheet .note{color:var(--muted);margin-top:10px;font-size:12px}
/* survey sketch */
.survey{background:var(--sk-paper);border-radius:2px;padding:10px;box-shadow:inset 0 0 40px rgba(120,90,40,.35),0 6px 18px rgba(0,0,0,.4);transform:rotate(-.4deg)}
.survey svg{display:block;width:100%;height:auto}
.survey text{font-family:var(--hand);fill:var(--sk-ink)}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
.smoke{animation:drift 3.5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-3px);opacity:.35}}
.ad{display:none;border:1px dashed var(--muted);color:var(--muted);font-family:var(--sys);font-size:12px;text-align:center;padding:28px 12px;border-radius:2px}
.fade{animation:fade .45s ease-out}
@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sys,.fade,.wheel,.smoke{animation:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">Forged in Exile</div>
    <div class="hbtns">
      <button class="ghost" id="btnMap" type="button" aria-pressed="false">Village</button>
      <button class="ghost" id="btnCodex" type="button" aria-pressed="false">Codex</button>
      <button class="ghost" id="btnChapters" type="button" aria-pressed="false">Chapters</button>
      <button class="ghost" id="btnStats" type="button" aria-pressed="false">Status</button>
      <button class="ghost" id="btnRestart" type="button">Restart</button>
      <button class="ghost" id="btnInstall" type="button" hidden>Install</button>
    </div>
  </header>
  <div id="mapBox" hidden></div>
  <div id="codexBox" hidden></div>
  <div id="chaptersBox" hidden></div>
  <div id="sheetBox" hidden></div>
  <main id="view" aria-live="polite"></main>
</div>

<script>
/* ================================================================
   FORGED IN EXILE, Book 1, Chapter 1: "The First Week"
   How this works:
   1. S (state) holds name, pronouns, stats, resources, flags,
      the day counter, and the list of finished projects.
   2. SCENES is the story. A choice can change stats (fx), cost
      resources (cost), require something (req), and point to the
      next scene (go). go:"nextday" advances the calendar.
   3. PROJECTS is the build menu. Each day you finish one project,
      then a story event for that day plays.
   4. drawMap() turns S.built into the survey sketch.
   ================================================================ */

const START = () => ({
  name:"", p:null, scene:"create", day:0,
  stats:{craft:1, renown:0, resent:0, food:2, defense:1, prosperity:1, morale:1, timber:2, stone:0, coin:3},
  flags:{}, built:[], done:0, lastBuilt:null,
  assign:{wood:2, stone:1, farm:1}, lastYield:null, codex:[], newPage:null,
  chapter:1, phase:"week", week:0, pop:83, snap:null, counts:{}, buildsLeft:1, weekReport:null
});
let S = load() || START();

const PRON = {
  he:  {sub:"he",  obj:"him",  pos:"his",   child:"son",      lord:"Lord"},
  she: {sub:"she", obj:"her",  pos:"her",   child:"daughter", lord:"Lady"},
  they:{sub:"they",obj:"them", pos:"their", child:"child",    lord:"Lord"}
};
const N = () => esc(S.name);
const P = k => PRON[S.p][k];
const sys = (t,b,cls="") => `<div class="sys ${cls}"><b>${t}</b>${b}</div>`;
const say = t => `<span class="say">${t}</span>`;
const has = id => S.built.includes(id);
const F = k => S.flags[k];
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function add(fx){ for(const k in fx){ if(k in S.stats) S.stats[k]=Math.max(0,S.stats[k]+fx[k]); else if(/^(aff_|n_)/.test(k)) S.flags[k]=(S.flags[k]||0)+fx[k]; else S.flags[k]=fx[k]; } }
const LABEL={timber:"Timber",stone:"Stone",coin:"Coin"};
const costText = c => c ? Object.entries(c).map(([k,v])=>`${v} ${LABEL[k]}`).join(", ") : "Free";
const canPay = c => !c || Object.entries(c).every(([k,v])=>S.stats[k]>=v);

/* ------------------------- BUILD PROJECTS ------------------------- */
const PROJECTS = {
  mill:{ name:"Rebuild the mill wheel", gain:"Food +2, Morale +1", cost:{timber:1}, fx:{food:2,morale:1},
    after:()=>`<p>The wheel housing smells of river slime and old flour. Half the paddles are split, and the axle has worn an oval into its bearing. You work from the inside out, mending the axle first, then each paddle, until the timber is dark and dense as horn.</p>
    <p>When the miller lifts the sluice gate, the wheel does not groan. It <em>hums</em>. A boy of about fourteen, flour in his hair, watches you from the doorway like he has just seen the sun come up twice. That is Fen, the miller's son.</p>`},
  wall:{ name:"Patch the palisade", gain:"Defense +2", cost:{timber:2}, fx:{defense:2},
    after:()=>`<p>The village wall is mostly an idea. Posts lean like drunks, and in three places the gap is wide enough to drive a cart through. The hunters drag fresh logs from the treeline while you walk the circuit, setting each post and hardening it where it meets the earth so rot cannot climb it again.</p>
    <p>By dusk the ring is whole. It is still only timber, and it still would not stop anything clever. But for the first time in years, Brackenfold has a door it can close.</p>`},
  homes:{ name:"Repair the east row homes", gain:"Morale +2, Prosperity +1", cost:{timber:1}, fx:{morale:2,prosperity:1},
    after:()=>`<p>The east row is where the poorest families live, under roofs that are more patch than thatch. You go door to door. A sagging lintel straightens. A cracked hearthstone seals. A rafter that has been held up with rope for two winters becomes the strongest beam in the house.</p>
    <p>An old weaver called Granny Pell follows you down the row, inspecting every repair and commenting on all of them. At the last house she pats your arm. ${say(`"Not bad. Not bad at all. You missed a spot."`)} You did not miss a spot.</p>`},
  fields:{ name:"Drain the flooded east fields", gain:"Food +2", cost:null, req:()=>has("mill"), reqText:"Needs the mill",
    fx:{food:2},
    after:()=>`<p>Every spring the river creeps into the east fields and never quite leaves, leaving the soil sour and the barley thin. You find the old drainage ditches buried under silt and press the channels open again, firming their banks so they hold their shape.</p>
    <p>By afternoon the standing water is running back toward the river in silver threads. Farmers who have not planted that ground in five years are out walking it in their bare feet.</p>`},
  camp:{ name:"Build a lumber camp in the north wood", gain:"Wood crews gather twice as much", cost:{timber:1}, fx:{},
    after:()=>`<p>You choose a clearing on the edge of the north wood with a stream close by and good oak all around. By noon there is a log shelter, a sawpit, and a seasoning rack you harden so it can take any weight.</p>
    <p>The trick is the rack. Green timber stacked on it dries overnight, drawing on a small charge of Artifice you leave in the wood like a banked coal. Oda's cousin Garth, a big quiet man with an axe he clearly loves, appoints himself camp foreman without asking anyone.</p>
    <p>${say(`"Give me a crew,"`)} he says, ${say(`"and I'll give you more wood than you can use."`)}</p>`},
  quarry:{ name:"Open a quarry in the river bluff", gain:"Stone crews cut three times as much", cost:null, fx:{},
    req:()=>F("reshape"), reqText:"Needs Reshape",
    after:()=>`<p>There is good grey stone in the bluff above the river, and nobody has ever had the tools to take it. You walk the cliff face with your palms on the rock, finding the natural seams, and you open them one by one so the stone will split cleanly under a plain iron wedge.</p>
    <p>Then you cut a ramp down to the riverbank and shape a stone sledge track along it. From now on, an ordinary crew with wedges and mallets can do in a day what used to take a month.</p>`},
  tower:{ name:"Raise a watchtower", gain:"Defense +1, early warning", cost:{timber:2}, fx:{defense:1},
    after:()=>`<p>You raise the tower on the highest ground inside the wall, four heavy posts braced in an X and a platform high enough to see over the treeline. Oda, the hunt captain, climbs it before you have finished the ladder.</p>
    <p>${say(`"I can see the north wood from here,"`)} she calls down. ${say(`"All of it. Anything comes out of those trees, we'll know before it reaches the fields."`)}</p>`},
  smithy:{ name:"Rebuild the smithy", gain:"Prosperity +1, iron spears", cost:{timber:1,stone:1}, fx:{prosperity:1,defense:1},
    after:()=>`<p>The old forge has been cold since the last smith died. You rebuild the hearth from river stone, hardening the firebox until it can take any heat you throw at it, and you mend the bellows leather until it breathes again.</p>
    <p>There is no smith left in Brackenfold, so the first iron you work yourself. Spear points for the hunters. Nails. Hinges. A sound starts ringing over the rooftops that nobody here has heard in years.</p>`},
  market:{ name:"Fix the market stalls and river bridge", gain:"Prosperity +2", cost:{timber:1,coin:1}, fx:{prosperity:2},
    after:()=>`<p>The trade road reaches Brackenfold over a little bridge that has lost so many planks that carters refuse it. You lay new decking and harden the old pilings, then rebuild three stalls in the square from the leftover wood.</p>
    <p>By evening two families have set up tables of eggs and wool. It is a very small market. It is still a market.</p>`},
  gate:{ name:"Raise a stone gatehouse", gain:"Defense +2", cost:{stone:2}, fx:{defense:2},
    req:()=>F("reshape")&&has("wall"), reqText:"Needs Reshape and the palisade",
    after:()=>`<p>The gate is the weakest point of any wall, so you make it the strongest. You shape the river stone block by block, pressing each one into the next until the joints vanish and the gatehouse looks like it was carved from a single boulder.</p>
    <p>Bren walks through it twice. The second time, he knocks on the wall with his knuckles like he is checking it is real.</p>
    <p>${say(`"Will it hold?"`)} he asks.</p><p>${say(`"It should,"`)} you say. Bren gives you a long look, because he has noticed you never say <em>will</em>.</p>`},
  ditch:{ name:"Dig a defensive ditch ring", gain:"Defense +2", cost:null, fx:{defense:2},
    req:()=>F("reshape")||S.stats.craft>=4, reqText:"Needs Reshape or Craft 4",
    after:()=>`<p>The whole village turns out with shovels, but the shovels are mostly for show. You walk ahead of the line with your palm flat to the ground, and the earth sinks away into a ditch as deep as your waist, its walls packed hard and steep.</p>
    <p>By the end of the day a ring of earthwork circles the palisade. You are so tired you fall asleep sitting on the bank, and someone covers you with a coat.</p>`},
  cistern:{ name:"Build a stone cistern", gain:"Food +1, Morale +1, fire safety", cost:{stone:1}, fx:{food:1,morale:1},
    req:()=>F("reshape"), reqText:"Needs Reshape",
    after:()=>`<p>Brackenfold has a single well that runs low every summer. You shape a broad stone cistern beside it in the square and cut a channel from the hillside spring to fill it.</p>
    <p>Granny Pell tests the water, pronounces it acceptable, and then says what everyone is thinking. ${say(`"Now if a roof catches, we won't be running to the river with buckets."`)}</p>`}
};
/* ------------------------- THE ELDER CODEX -------------------------
   Aurel Valcrest's hidden inheritance: building knowledge recovered
   from the ruins of the Elder Empire, a fallen civilization much like
   ancient Rome. One page restores each night once the Codex wakes. */
const CODEX = {
  lime:{ name:"Lime and Fire", elder:"Calx", unlocks:"kiln",
    note:"Burn limestone hot enough, long enough, and it gives up its spirit as smoke. What remains is quicklime. Quench it in water and it seethes like a living thing. That paste is the beginning of every Elder wall. Without it, stone is only a pile.",
    art:`<path d="M20,62 h80 M30,62 V30 Q60,4 90,30 V62" /><path d="M42,62 V44 h36 V62" /><path d="M50,40 q4,-6 0,-12 M60,38 q4,-6 0,-12 M70,40 q4,-6 0,-12" stroke-width="1"/><path d="M36,30 h48" stroke-dasharray="2 3"/>`},
  arch:{ name:"The Arch", elder:"Fornix", unlocks:"archbridge",
    note:"A beam fights its own weight and loses. An arch turns weight into a squeeze, and stone loves to be squeezed. Cut wedges, the voussoirs, build them over a wooden frame, then set the keystone last. Strike the frame and the arch stands on its own forever. No magic. Only geometry.",
    art:`<path d="M14,64 V40 A46,34 0 0 1 106,40 V64"/><path d="M28,64 V42 A32,22 0 0 1 92,42 V64"/>${[0,1,2,3,4,5,6].map(i=>{const a=Math.PI*(1-i/6);return `<path d="M${60+32*Math.cos(a)},${42-22*Math.sin(a)} L${60+46*Math.cos(a)},${40-34*Math.sin(a)}"/>`}).join("")}<path d="M55,8 h10 l-2,10 h-6 z" fill="var(--sk-wash)" stroke-width="1"/>`},
  concrete:{ name:"Elder Concrete", elder:"Opus Caementicium", unlocks:"concrete",
    note:"Lime, and the grey ash rock of a burning mountain, and broken stone. Mix them wet and pack them in timber forms. It hardens even under the sea. Better still, when it cracks, water seeps in, wakes the unburned lime, and the crack closes itself. My bluff at home had no such ash. Look for grey stone that crumbles to a gritty powder.",
    art:`<rect x="18" y="14" width="84" height="50"/>${[[28,24],[44,30],[64,22],[84,32],[32,46],[54,50],[76,48],[92,56],[40,58],[66,38]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${2+((x+y)%3)}"/>`).join("")}<path d="M10,14 V64 M110,14 V64" stroke-dasharray="3 3"/>`},
  crane:{ name:"The Great Wheel", elder:"Polyspastos", unlocks:"crane",
    note:"One man walking inside a wheel, turning a drum, pulling a rope through five pulleys, can lift what forty men could not. The Elder builders raised temple columns this way. Build the wheel tall. Build the pulleys smooth. Let the walker sing; it keeps his pace even.",
    art:`<circle cx="36" cy="46" r="18"/><circle cx="36" cy="46" r="3"/><path d="M36,46 L80,6 L96,6 M80,6 V40 M76,40 h8 v8 h-8 z"/><path d="M24,64 h28 M30,64 L36,46 L42,64"/>`},
  road:{ name:"The Layered Road", elder:"Via", unlocks:"road",
    note:"Dig down until you find firm ground. Then lay four beds: big stones, then rubble and lime, then fine gravel packed hard, and last the fitted paving, crowned in the middle so rain runs off to the ditches. Such a road outlives the empire that built it.",
    art:`<path d="M10,22 Q60,12 110,22"/><path d="M10,22 V30 H110 V22"/><path d="M10,30 V40 H110 V30 M10,40 V50 H110 V40 M10,50 V62 H110 V50"/>${[18,34,50,66,82,98].map(x=>`<circle cx="${x}" cy="56" r="4"/>`).join("")}<path d="M10,36 h100" stroke-dasharray="1 3"/><path d="M4,22 l6,8 M116,22 l-6,8"/>`},
  tiles:{ name:"Fired Tile", elder:"Tegula et Imbrex", unlocks:"tiles",
    note:"Thatch drinks rain and catches every spark. Fire flat clay tiles with raised edges, lay them side by side, and cap each seam with a curved tile. A tiled roof sheds water for a century and laughs at fire.",
    art:`${[14,44,74].map(x=>`<path d="M${x},50 V36 H${x+28} V50 Z"/>`).join("")}${[42,72].map(x=>`<path d="M${x-6},36 A6,6 0 0 1 ${x+6},36"/>`).join("")}<path d="M10,60 h100" stroke-dasharray="2 3"/>`},
  hypocaust:{ name:"Underfloor Heat", elder:"Hypocaustum", unlocks:"baths",
    note:"Raise the floor on short brick pillars and run the furnace smoke beneath it, then up through hollow tiles in the walls. The whole room becomes a warm stone. The Elder cities kept their people clean this way, and clean people do not die of summer fevers.",
    art:`<path d="M10,30 h100 M10,34 h100"/>${[18,32,46,60,74,88,102].map(x=>`<rect x="${x-3}" y="34" width="6" height="22"/>`).join("")}<path d="M10,56 h100"/><path d="M4,46 q6,-3 12,0 q6,3 12,0 q6,-3 12,0" stroke-width="1"/><path d="M98,30 V8 M104,30 V8" stroke-dasharray="2 2"/>`},
  gears:{ name:"The Toothed Wheel", elder:"Rota Dentata", unlocks:"sawmill",
    note:"A wheel that turns slowly can turn another wheel quickly, if its teeth are cut true. Put a river on one end and a saw or a hammer on the other, and the river works for you day and night without bread or sleep.",
    art:`<circle cx="40" cy="38" r="22"/><circle cx="40" cy="38" r="4"/>${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6;return `<path d="M${40+22*Math.cos(a)},${38+22*Math.sin(a)} L${40+27*Math.cos(a)},${38+27*Math.sin(a)}"/>`}).join("")}<circle cx="84" cy="38" r="11"/><circle cx="84" cy="38" r="3"/>${Array.from({length:6},(_,i)=>{const a=i*Math.PI/3;return `<path d="M${84+11*Math.cos(a)},${38+11*Math.sin(a)} L${84+15*Math.cos(a)},${38+15*Math.sin(a)}"/>`}).join("")}`},
  glass:{ name:"Glass", elder:"Vitrum", unlocks:"glassworks",
    note:"River sand, plant ash, and a fire hotter than any forge. The melt flows like honey and sets clear as water. The Elder merchants sold it across half the world. A town that makes glass will never be poor.",
    art:`<path d="M44,62 h32 M48,62 Q40,40 50,24 h20 Q80,40 72,62"/><path d="M54,24 V10 h12 V24"/><path d="M56,36 q4,8 0,16" stroke-width="1"/><path d="M90,20 l8,-8 M94,30 l10,-4 M20,20 l-8,-8" stroke-width="1"/>`},
  starfort:{ name:"The Star Fort", elder:"Munimentum Stellatum", unlocks:"bastions",
    note:"A round tower has a blind spot at its foot. An angled bastion has none, because the bastion beside it can see that foot. Lay out a fortress as a star and no stretch of wall ever fights alone.",
    art:`<path d="M60,8 L72,30 L98,30 L78,46 L86,66 L60,54 L34,66 L42,46 L22,30 L48,30 Z"/><circle cx="60" cy="38" r="8" stroke-dasharray="2 2"/>`},
  torsion:{ name:"The Torsion Engine", elder:"Ballista", unlocks:"ballistae", sealedNote:"Aurel riveted this page shut.",
    note:"Twist a skein of sinew between two oak frames until it screams. Fix an arm into each skein. Draw them back together on a slider and release. Aurel's margin note: For defense. Only ever for defense. I said that too.",
    art:`<path d="M20,40 h80 M30,30 v20 M90,30 v20"/><path d="M30,30 Q60,14 90,30" /><path d="M60,40 v18 M52,58 h16"/><path d="M104,40 l8,-3 v6 z"/>`},
  foundation:{ name:"The Foundation", elder:"Fundamentum", unlocks:"royalCollege",
    note:"Never build on what you have not seen. Dig until the spade rings on rock. Sink each pier to that rock, flare it at the base like the root of a tree, and tie every pier to its neighbor with iron so they share the load.",
    art:`<path d="M10,20 h100"/><path d="M30,20 V54 L22,64 H46 L38,54 V20 M80,20 V54 L72,64 H96 L88,54 V20"/><path d="M10,64 h100" stroke-dasharray="3 2"/><path d="M38,36 h34" />`},
  wonders:{ name:"The Map of Wonders", elder:"Tabula Mirabilium",
    note:"Seven great works, raised by a thousand masons at a time, to feed and shelter the world: the Garden, the Storm Engine, and five more whose names are worn away. Two found. Five waiting.",
    art:`<path d="M14,16 Q40,6 64,14 T108,12 V58 Q80,66 56,58 T14,60 Z"/>${[[30,30],[52,22],[70,40],[88,28],[40,48],[96,48],[62,30]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${i<2?3.5:2}" ${i<2?'fill="var(--sk-wash)"':''}/>`).join("")}`},
  lightning:{ name:"The Lightning Rod", elder:"Virga Fulminis", unlocks:"lighthouse",
    note:"Lightning wants the ground and takes the shortest road there. Give it a road: a copper rod above the highest roof, a copper cable down the wall, a copper stake deep in wet earth. The storm will pass through the town without touching it.",
    art:`<path d="M60,6 V40 M54,40 h12 v20 h-12 z"/><path d="M60,60 V66 M50,66 h20"/><path d="M78,8 l-8,14 h8 l-8,14" stroke-width="1"/>`},
  storm:{ name:"The Storm Engine", elder:"Machina Tempestatis",
    note:"Half a page. A sphere of Elder metal ringed in copper, built to call rain to dry country and calm to angry seas. The second half, how to close it, is missing. The last line reads: it takes more than one pair of hands.",
    art:`<circle cx="60" cy="38" r="22"/><ellipse cx="60" cy="38" rx="32" ry="8"/><path d="M60,16 V8 M82,38 h8 M38,38 h-8" stroke-dasharray="2 2"/><path d="M60,38 l6,-8 h-6 l6,-8" stroke-width="1"/>`},
  dome:{ name:"Sealed Page", elder:"???", unlocks:null, sealed:true,
    note:"This page will not open. Something about it feels enormous, like standing at the bottom of a well and looking up.",
    art:`<path d="M20,62 h80 M24,62 A36,40 0 0 1 96,62" stroke-dasharray="3 4"/><text x="54" y="48" font-size="18">?</text>`}
};
const PAGE_ORDER=["lime","arch","concrete","crane","road","tiles","hypocaust","gears","glass"];
const knows = k => S.codex.includes(k);
function restorePage(){
  const next=PAGE_ORDER.find(k=>!knows(k));
  if(next){ S.codex.push(next); S.newPage=next; }
}

Object.assign(PROJECTS,{
  kiln:{ name:"Build an Elder lime kiln", gain:"Prosperity +1 · Makes lime for concrete and tile", cost:{stone:1}, fx:{prosperity:1},
    req:()=>knows("lime"), reqText:"Needs Codex: Lime and Fire",
    after:()=>`<p>You build it exactly as the memory shows you: a squat stone beehive against the hillside, a firebox at the bottom, a loading hatch at the top. Garth's crew feeds it oak for a day and a night.</p>
    <p>When the kiln cools, you rake out lumps of white quicklime and drop one in a bucket. The water hisses and boils. Granny Pell, who has seen a great many things, takes a careful step back. ${say(`"What in the gods' names is that for?"`)}</p>
    <p>${say(`"Everything,"`)} you tell her.</p>`},
  archbridge:{ name:"Raise a stone arch bridge", gain:"Prosperity +2, Morale +1", cost:{stone:2}, fx:{prosperity:2,morale:1},
    req:()=>knows("arch"), reqText:"Needs Codex: The Arch",
    after:()=>`<p>This time you barely touch the stone. You teach instead. You show the hunters how to build a curved wooden frame across the river, how to cut each wedge with one face slightly narrower than the other, how to lay them from both banks toward the middle.</p>
    <p>The keystone goes in last. Then you tell them to knock the frame away.</p>
    <p>Nobody wants to. Fen finally does it with his eyes shut. The frame falls into the river, and the arch just stays there, holding itself up by squeezing. Half the village walks across it and back again, laughing, because a thing built by their own hands without a drop of magic is standing.</p>`},
  concrete:{ name:"Pour an Elder concrete wall", gain:"Defense +3", cost:{stone:3}, fx:{defense:3},
    req:()=>knows("concrete")&&has("kiln")&&has("wall"), reqText:"Needs Codex: Elder Concrete, the kiln, and the palisade",
    after:()=>`<p>The answer was in the bluff the whole time. That grey stone the quarry crews complained about, the stuff that crumbles to grit, is ash rock. Mountain ash, packed down for ten thousand years. Exactly what Aurel's memory is looking for.</p>
    <p>You set the crews mixing lime, ground ash, and broken rubble in long troughs, and you build timber forms behind the palisade. They pour, they tamp, you press each layer until it locks. By nightfall a grey wall stands behind the wooden one, still warm, still curing.</p>
    <p>${say(`"It looks like mud,"`)} Oda says doubtfully.</p>
    <p>${say(`"Give it a week,"`)} you say. ${say(`"Then try to scratch it."`)}</p>`},
  crane:{ name:"Build a treadwheel crane", gain:"Stone crews +1 per 2 workers", cost:{timber:2}, fx:{},
    req:()=>knows("crane"), reqText:"Needs Codex: The Great Wheel",
    after:()=>`<p>It takes a full day to build the wheel, twice as tall as a man, and another hour to convince anyone to walk inside it. Garth finally climbs in. He takes ten steps, and a block of stone heavier than an ox rises off the ground like it weighs nothing.</p>
    <p>Garth stops walking. The block hangs in the air. ${say(`"Oh,"`)} he says, very quietly. ${say(`"Oh, I like this."`)}</p>`},
  road:{ name:"Lay an Elder road to the trade route", gain:"Prosperity +2 · Draws a new family", cost:{stone:2}, fx:{prosperity:2},
    req:()=>knows("road"), reqText:"Needs Codex: The Layered Road",
    after:()=>`<p>The old track to the trade route turns into a swamp every time it rains. You dig it out to firm ground and lay the four beds the Codex shows you: big stones, rubble and lime, packed gravel, then fitted paving with a crown down the middle and ditches on both sides.</p>
    <p>It only reaches half a mile before you run out of stone. That half mile is still the best road in the eastern province. By evening a family of tinkers who had been camping by the trade route have rolled their wagon into Brackenfold and asked if anyone needs pots fixed.</p>`},
  tiles:{ name:"Fire clay roof tiles", gain:"Morale +1 · Fireproof roofs", cost:{timber:1}, fx:{morale:1},
    req:()=>knows("tiles")&&has("kiln"), reqText:"Needs Codex: Fired Tile and the kiln",
    after:()=>`<p>The riverbank clay is good, and the kiln is already hot. The village children press clay into the molds you shape, flat tiles with raised edges and curved caps for the seams, and they compete over whose look best.</p>
    <p>By sundown the first dozen roofs in the square are red instead of brown. The old thatch goes onto a bonfire. Watching it burn, everyone quietly understands what it would have done to the village if it had stayed on the roofs.</p>`}
});
/* ---------- summer projects: bigger works, measured in weeks ---------- */
Object.assign(PROJECTS,{
  cottages:{ summer:true, repeat:true, max:()=>[0,3,5,7,9,11,13,14][S.chapter], name:"Build a cottage row", gain:"Housing +15, Morale +1", cost:{timber:4,stone:2}, fx:{morale:1},
    after:()=>{ const n=S.counts.cottages||0; return [
      `<p>The first new houses Brackenfold has seen in a generation go up along the inside of the north wall: six cottages in a neat row, sharing walls to save stone, each with a hearth you shape yourself so it draws properly.</p><p>Families who have been sleeping three to a room move in before the doors are even hung.</p>`,
      `<p>The second cottage row runs along the lane by the market. This time the villagers do most of the work and you only check the foundations. You catch Garth explaining load and footings to a pair of teenagers, using words he learned from you a month ago.</p>`,
      `<p>The third row has to go outside the old wall, on the slope toward the new road. Bren stands where the last cottage will go, quiet for a long time. ${say(`"Brackenfold has never needed to grow past its own wall,"`)} he says finally. ${say(`"Not once."`)}</p>`,
      `<p>The fourth row is built in winter, which everyone says cannot be done, on foundations you warm with your hands so the mortar will set. It is the first row built with ${has("hypoHomes")?"Elder heating from the start":"its chimneys shared down the middle to save wood"}.</p>`,
      `<p>The fifth row climbs the slope beside the Elder road, two stories this time, stone below and timber above. From the top windows you can see the whole valley. Brackenfold is not a village that fits inside a wall anymore.</p>`,
      `<p>The sixth row goes up for the artificers who keep arriving from across the kingdom. Each family carves a small mark into its own doorstone, the way Aurel's notes say the Elder masons did.</p>`,
      `<p>The seventh row finishes the new northern quarter. People have started calling it the Artificers' Quarter, and nobody seems to remember who said it first.</p>`][Math.max(0,n-1)]; }},
  hall:{ summer:true, name:"Raise a village hall", gain:"Morale +2, Prosperity +1", cost:{timber:4,stone:4}, fx:{morale:2,prosperity:1},
    after:()=>`<p>A village that makes decisions in Bren's kitchen is a village of eighty people. You build the hall in the square, with a stone floor, a timber roof on four great beams, and a wide arched door facing the road${knows("arch")?", its arch set without a single nail":""}.</p>
    <p>The first meeting is about whether pigs should be allowed in the square. It goes on for three hours. It is wonderful.</p>`},
  guild:{ summer:true, name:"Found a builders' guild", gain:"Builds one random project for you every week", cost:{coin:3}, fx:{prosperity:1},
    req:()=>has("hall")&&works()>=8, reqText:"Needs the village hall and 8 works",
    after:()=>`<p>You gather everyone who has worked a crew this summer in the new hall and give them a name: the Brackenfold Builders. Garth leads the timber side, the new masons lead the stone, and ${F("fen")?"Fen, very red in the face, is named journeyman":"Oda keeps the rosters"}.</p>
    <p>From now on they pick a project themselves each week and see it through without you. You will not always agree with their choice. That is rather the point of a guild.</p>
    ${sys("SYSTEM","[Village Upgrade: BUILDERS' GUILD]<br>Every week the guild builds one random project it can afford.<br>With the Artificers' College, it builds two.")}`},
  granary:{ summer:true, name:"Pour an Elder concrete granary", gain:"Food +2 every week, no spoilage", cost:{stone:4}, fx:{},
    req:()=>knows("concrete")&&has("kiln"), reqText:"Needs Codex: Elder Concrete and the kiln",
    after:()=>`<p>A round concrete tower by the mill, raised on a stone footing so the damp cannot climb, with a sloped roof and slatted vents near the top. Grain stored inside will keep for years, safe from rats, rot, and fire.</p>
    ${F("hidGrain")?`<p>Granny Pell walks around it twice and finally asks, very quietly, whether it has a cellar. You tell her it can.</p>`:""}`},
  terraces:{ summer:true, name:"Cut terraces into the south hill", gain:"Food +3 every week", cost:{stone:4}, fx:{},
    req:()=>knows("arch")||F("reshape"), reqText:"Needs Codex: The Arch or Reshape",
    after:()=>`<p>The south hill is too steep to plow, so you turn it into stairs. Long stone retaining walls, each curved slightly into the slope so the earth leans on them instead of pushing them over. Behind each wall, a flat strip of good soil.</p>
    <p>By the end of the week there are five terraces, and the farmers are arguing over who gets to plant the sunny ones.</p>`},
  wallTowers:{ summer:true, name:"Raise stone towers along the wall", gain:"Defense +2", cost:{stone:5}, fx:{defense:2},
    req:()=>has("concrete"), reqText:"Needs the Elder concrete wall",
    after:()=>`<p>Four round towers rise along the concrete wall, one at each quarter, each tall enough that archers can shoot along the face of the wall at anything trying to climb it. Round, because a round tower has no corner to undermine.</p>`},
  fair:{ summer:true, name:"Hold a monthly market fair", gain:"Coin +2 every week, Prosperity +1", cost:{timber:2,coin:2}, fx:{prosperity:1},
    req:()=>has("market")&&has("road"), reqText:"Needs the market and the Elder road",
    after:()=>`<p>You send word down the trade route that Brackenfold will hold a fair on the first of every month: no stall fees for the first year, and an Elder road to arrive on. Three traders come to the first one. Eleven come to the second.</p>`},
  baths:{ summer:true, name:"Build a heated bathhouse", gain:"Morale +3, protects against sickness", cost:{stone:4,timber:3}, fx:{morale:3},
    req:()=>knows("hypocaust")&&has("kiln"), reqText:"Needs Codex: Underfloor Heat and the kiln",
    after:()=>`<p>Brick pillars, a raised floor, a small furnace fed from outside, and two pools: one warm, one cold. Nobody in Brackenfold has ever had a hot bath they did not haul and heat themselves.</p>
    <p>On the first evening the line goes out the door and around the square. Old Bren goes in looking eighty and comes out looking sixty.</p>`},
  sawmill:{ summer:true, name:"Build a water-powered sawmill", gain:"Lumber crews +1 per 2 workers", cost:{timber:3,stone:2}, fx:{},
    req:()=>knows("gears")&&has("mill"), reqText:"Needs Codex: The Toothed Wheel and the mill",
    after:()=>`<p>A second wheel downstream of the mill, geared up through a pair of toothed wheels you shape from seasoned oak, driving a frame saw that rises and falls by itself. Garth stands and watches it cut planks for an hour without speaking.</p>`},
  forge:{ summer:true, name:"Upgrade to a water-driven forge", gain:"Prosperity +2, Defense +1, Coin +1 every week", cost:{stone:3,coin:2}, fx:{prosperity:2,defense:1},
    req:()=>knows("gears")&&has("smithy"), reqText:"Needs Codex: The Toothed Wheel and the smithy",
    after:()=>`<p>You run a shaft from the river to the smithy, and the river works the bellows and a heavy trip hammer. The forge burns hotter and steadier than any man could keep it. The tinker family from the road turns out to have a son who has always wanted to be a smith.</p>`},
  glassworks:{ summer:true, name:"Open a glassworks", gain:"Prosperity +2, Coin +2 every week", cost:{stone:3,timber:3}, fx:{prosperity:2},
    req:()=>knows("glass")&&has("kiln"), reqText:"Needs Codex: Glass and the kiln",
    after:()=>`<p>The first attempt comes out green and full of bubbles. The fourth comes out clear. You hold up a small round pane in the doorway and the whole room fills with light.</p>
    <p>${F("tamsin")?`Tamsin buys the first twenty panes before they have even cooled, and sends a rider to the capital with a sample.`:`A trader passing through offers more for a single pane than the village used to make in a month.`}</p>`},
  school:{ summer:true, name:"Open a workshop school", gain:"Craft +1, two more skilled workers", cost:{timber:3,coin:2}, fx:{craft:1},
    req:()=>has("hall")&&(F("fen")||F("openSchool")), reqText:"Needs the hall and an apprentice",
    after:()=>`<p>Mornings in the hall now belong to anyone under sixteen. Numbers, letters, and the basics of how a load moves through a wall. Afternoons belong to the crews. ${F("fen")?"Fen teaches the youngest group himself, very seriously.":""}</p>
    <p>Two of the older students can already feel a beam's stress with their hands. Nobody tells them that commoners cannot learn Artifice.</p>`},
  watch:{ summer:true, name:"Drill a village watch", gain:"Defense +2", cost:{coin:2}, fx:{defense:2},
    req:()=>has("smithy"), reqText:"Needs the smithy",
    after:()=>`<p>Oda picks twelve volunteers and drills them every evening with iron spears from the smithy. They are not soldiers. But they know their places on the wall, they know the signals, and they know they will not be standing alone.</p>`},
  square:{ summer:true, name:"Pave the square with Elder stone", gain:"Morale +2, Prosperity +1", cost:{stone:4}, fx:{morale:2,prosperity:1},
    req:()=>has("road"), reqText:"Needs the Elder road",
    after:()=>`<p>The square has been a mud pit every spring for a century. You lay it the Elder way, layer on layer, with fitted paving on top and a gentle crown so the rain runs into a channel at the edge. The children immediately discover that it is perfect for chalk.</p>`}
});
Object.assign(PROJECTS,{
  infirmary:{ ch:2, name:"Build a house of healing", gain:"Morale +2", cost:{timber:3,stone:3}, fx:{morale:2},
    after:()=>`<p>A long, low stone building on the east bank, with real windows${has("glassworks")?" of your own glass":""}, a hearth at each end, and twelve clean beds. The healer walks through it once and sits down on the first bed and cries a little.</p>`},
  smokehouse:{ ch:2, name:"Dig a smokehouse and salt cellar", gain:"Winter food +3 every week", cost:{timber:3,stone:2}, fx:{},
    after:()=>`<p>A smokehouse over a cold stone cellar cut into the riverbank, packed with Tamsin's salt and the hunters' winter catch. Meat and fish smoked here will last until spring.</p>`},
  greenhouse:{ ch:2, name:"Raise a glass winter garden", gain:"Field crews work through winter", cost:{stone:3,timber:2}, fx:{morale:1},
    req:()=>has("glassworks"), reqText:"Needs the glassworks",
    after:()=>`<p>A long arched frame of iron and glass against the south side of the wall, with a hypocaust channel under its beds. Outside, the snow is knee deep. Inside, the soil is warm enough to plant.</p><p>The children press their faces to the glass to look at the green.</p>`},
  hypoHomes:{ ch:2, name:"Heat the cottages the Elder way", gain:"Firewood use halved, Morale +2", cost:{stone:4}, fx:{morale:2},
    req:()=>knows("hypocaust")&&has("kiln")&&(S.counts.cottages||0)>=1, reqText:"Needs Codex: Underfloor Heat, the kiln, and cottages",
    after:()=>`<p>You lift the floors of the cottage rows onto short brick pillars and run a shared flue beneath them from a single furnace at the end of each row. One fire warms six houses.</p><p>Granny Pell, who has complained about the cold every winter for seventy years, has nothing to say at all.</p>`},
  library:{ ch:2, name:"Copy the Codex into a library", gain:"Craft +1, one more skilled worker", cost:{timber:3,coin:2}, fx:{craft:1},
    req:()=>has("hall"), reqText:"Needs the village hall",
    after:()=>`<p>Every evening for a week you sit in the new library room above the hall and draw the Codex pages from memory, while ${F("fen")?"Fen":"two of the older students"} copies them again. When the week is over, the knowledge in your head also lives on paper, in a locked room, in three copies.</p><p>If anything happens to you, Brackenfold will still know how to build.</p>`},
  signal:{ ch:2, name:"Set a signal beacon on the watchtower", gain:"Defense +1", cost:{timber:2}, fx:{defense:1},
    req:()=>has("tower"), reqText:"Needs the watchtower",

const ORDER = ["camp","mill","wall","homes","fields","quarry","kiln","archbridge","concrete","crane","road","tiles","tower","smithy","market","gate","ditch","cistern",
  "cottages","hall","guild","granary","terraces","wallTowers","fair","baths","sawmill","forge","glassworks","school","watch","square",
  "infirmary","smokehouse","greenhouse","hypoHomes","library","signal","firebreak","sledgeRoad","barracks","marketHall","inn","clocktower","domeHall",

/* ------------------------- WORKFORCE -------------------------
   Villagers are assigned each morning. Their haul arrives overnight,
   so the player never has to spend a day just gathering. */
const JOBS = {
  wood: {name:"Lumber", site:()=>has("camp")?"Lumber camp":"Deadwood foraging", per:()=>(has("camp")?2:1)+(has("sawmill")?1:0), out:"timber"},
  stone:{name:"Stone",  site:()=>has("quarry")?"Bluff quarry":"Hauling river stone", per:()=>(has("quarry")?3:1)+(has("crane")?1:0)+(F("masons")?1:0), out:"stone"},
  farm: {name:"Fields", site:()=>has("fields")?"Drained east fields":"Kitchen gardens", per:()=>has("fields")?2:1, out:"food"}
};
// every two workers on a job produce "per" units; one alone produces half, rounded down
const jobYield = j => Math.floor(S.assign[j]*JOBS[j].per()/2);
function workers(){ return 4 + (has("homes")?1:0) + (F("fen")?1:0) + (has("market")?1:0) + (has("road")?1:0) + (S.stats.morale>=5?1:0)
  + (has("school")?2:0) + (has("library")?1:0) + (has("college")?3:0) + (has("royalCollege")?3:0) + (has("refugeQuarter")?2:0) + Math.max(0,Math.floor((S.pop-83)/8)); }
const works = () => S.built.length + Math.max(0,(S.counts.cottages||0)-1);
const housing = () => 90 + 15*(S.counts.cottages||0) + (has("refugeeQ")?30:0) + (has("refugeQuarter")?30:0) + (has("aqueduct")?10:0);
const perWeek = () => 3;
const perDay = () => 1 + (F("fen")?1:0);
const isSeason = () => S.phase==="summer" || S.phase==="winter" || S.phase==="spring";
const isWinter = () => S.phase==="snow" || S.phase==="winter";
const isAway = () => ["capital","below","kastrel","gathering"].includes(S.phase);
const seasonLen = () => S.chapter>=4 ? SEASON[S.chapter].len : S.chapter>=2 ? 6 : 8;
const CH_NAME = {1:"One",2:"Two",3:"Three",4:"Four",5:"Five",6:"Six",7:"Seven"};
function tier(){
  if(works()>=70 && S.pop>=260) return {name:"Free City of Artificers", lvl:6};
  if(works()>=56 && S.pop>=220) return {name:"Royal City", lvl:5};
  if(works()>=44 && S.pop>=180) return {name:"Chartered City", lvl:4};
  if(works()>=30 && S.pop>=140) return {name:"Free Town", lvl:3};
  if(works()>=18 && S.pop>=112) return {name:"Market Town", lvl:2};
  if(works()>=10 && S.pop>=92) return {name:"Village", lvl:1};
  return {name:"Failing Hamlet", lvl:0};
}
const foodNeed = () => Math.ceil(S.pop/6);
const foodMade = () => S.phase==="winter"
  ? (has("greenhouse")?jobYield("farm")*4:0) + (has("conservatory")?3:0) + (has("mill")?1:0) + (has("granary")?2:0) + (has("smokehouse")?3:0) + (F("thornFate")==="tamed"?4:0)
  : jobYield("farm")*4 + (has("mill")?2:0) + (has("fields")?2:0) + (has("terraces")?3:0) + (has("granary")?2:0) + (has("orchards")?4:0) + (has("conservatory")?3:0) + (F("thornFate")==="tamed"&&S.chapter>=3?2:0);
const fuelNeed = () => S.phase==="winter" ? Math.ceil(S.pop/12 * (has("hypoHomes")?0.5:1)) : 0;
const coinMade = () => Math.floor(S.stats.prosperity/3) + (has("fair")?2:0) + (has("glassworks")?2:0) + (has("forge")?1:0) + (F("route")?1:0) + (has("inn")?2:0) + (has("marketHall")?1:0) + (has("assay")?3:0) + (has("viaduct")?2:0) + (has("harbor")?2:0) + (has("sharedFoundry")?2:0);
/* one summer week: crews work six days, the village eats, grows, earns */
function weekly(){
  clampAssign();
  const lines=[];
  const t=jobYield("wood")*4, st=jobYield("stone")*(S.phase==="winter"&&!has("sledgeRoad")?2:4);
  S.stats.timber+=t; S.stats.stone+=st;
  const net=foodMade()-foodNeed();
  S.stats.food+=net;
  const c=coinMade(); S.stats.coin+=c;
  lines.push(`Timber +${t} · Stone +${st} · Coin +${c}`);
  const fuel=fuelNeed();
  if(fuel){ S.stats.timber-=fuel; if(S.stats.timber<0){ S.stats.timber=0; S.stats.morale=Math.max(0,S.stats.morale-2); lines.push(`Firewood ran out · a cold week · Morale −2`); } else lines.push(`Firewood burned: ${fuel} timber${has("hypoHomes")?" (halved by Elder heating)":""}`); }
  let grow=0;
  if(S.stats.food<0){ S.stats.food=0; S.stats.morale=Math.max(0,S.stats.morale-1); lines.push(`Short rations. Food ran out · Morale −1`); }
  else {
    lines.push(`Food ${net>=0?"+":""}${net} (made ${foodMade()}, eaten ${foodNeed()})`);
    const room=housing()-S.pop;
    grow=Math.max(0,Math.min(room, Math.floor((2+Math.floor(S.stats.morale/2)+Math.floor(S.stats.prosperity/4)) * (S.phase==="winter"?0.6:1))));
    if(room<=0) lines.push(`No room. Newcomers are turned away · build cottages`);
  }
  if(F("takeAll")){ S.pop+=14; S.flags.takeAll=false; lines.push("The Marrow Ford survivors settle in · Population +14"); }
  if(F("takeSome")){ S.pop+=8; S.flags.takeSome=false; lines.push("Eight newcomers settle in · Population +8"); }
  if(F("n_popAdd")){ S.pop+=S.flags.n_popAdd; lines.push(`New arrivals settle in · Population +${S.flags.n_popAdd}`); S.flags.n_popAdd=0; }
  if(F("petitionAll")){ S.pop+=16; S.flags.petitionAll=false; lines.push("Sixteen artificers and their families settle in · Population +16"); }
  if(F("petitionSome")){ S.pop+=8; S.flags.petitionSome=false; lines.push("Eight newcomers settle in · Population +8"); }
  if(F("petitionMarisol")){ S.pop+=12; S.flags.petitionMarisol=false; lines.push("Marisol settles twelve artificers · Population +12"); }
  if(F("marisolJoin")){ S.pop+=1; S.flags.marisolJoin=false; }
  if(F("feverLoss")){ S.pop=Math.max(60,S.pop-5); S.flags.feverLoss=false; lines.push("The fever took five lives"); }
  S.pop+=grow;
  if(grow) lines.push(`Population +${grow} → ${S.pop}`);
  if(has("guild")){ const g=guildWork(); S.guildBuilt=g;
    lines.push(g.length ? `Builders' guild finished: ${g.join(" and ")}` : "Builders' guild sat idle · not enough materials for anything"); }
  S.newPage=null; if(F("codex_on")) restorePage();
  if(S.newPage) lines.push(`Codex page restored: ${CODEX[S.newPage].name}`);
  S.weekReport=lines.join("<br>");
}
function assigned(){ return S.assign.wood+S.assign.stone+S.assign.farm; }
function clampAssign(){ while(assigned()>workers()){ const j=["farm","stone","wood"].find(k=>S.assign[k]>0); S.assign[j]--; } }
function produce(){
  clampAssign();
  const y={}; for(const j in JOBS){ const n=jobYield(j); if(n){ y[JOBS[j].out]=n; S.stats[JOBS[j].out]+=n; } }
  S.lastYield=y;
}
function crewPanel(){
  clampAssign();
  const free=workers()-assigned();
  const rows=Object.entries(JOBS).map(([j,J])=>`
    <div class="crew-row">
      <div class="crew-name"><strong>${J.name}</strong><span>${J.site()} · ${J.per()} per 2 workers</span></div>
      <div class="stepper">
        <button type="button" class="step" data-job="${j}" data-d="-1" aria-label="Remove a worker from ${J.name}" ${S.assign[j]?"":"disabled"}>−</button>
        <output id="n-${j}">${S.assign[j]}</output>
        <button type="button" class="step" data-job="${j}" data-d="1" aria-label="Add a worker to ${J.name}" ${free?"":"disabled"}>+</button>
      </div>
      <div class="crew-out" id="y-${j}">+${S.phase==="winter"&&j==="farm"&&!has("greenhouse")?0:jobYield(j)*(isSeason()?(S.phase==="winter"&&j==="stone"&&!has("sledgeRoad")?2:4):1)} ${LABEL[J.out]||"Food"}${isSeason()?"/wk":""}</div>
    </div>`).join("");
  const last = S.lastYield && Object.keys(S.lastYield).length
    ? `<div class="crew-last">Overnight haul: ${Object.entries(S.lastYield).map(([k,v])=>`+${v} ${LABEL[k]||"Food"}`).join(", ")}</div>` : "";
  return `<section class="crews" aria-label="Work crews">
    <div class="crew-head"><span>Work crews</span><span>${free} of ${workers()} villagers idle</span></div>
    ${rows}${last}
    <div class="crew-note">${S.phase==="winter"&&!has("greenhouse")?"Frozen ground. Field crews only help once a glass winter garden is built. ":""}${isSeason()?"Crews work all week. Their haul arrives at the week's end.":"Crews work while you build. Their haul arrives each night."}</div>
  </section>`;
}
function bindCrews(){
  view.querySelectorAll(".step").forEach(b=>b.onclick=()=>{
    const j=b.dataset.job, d=+b.dataset.d;
    if(d>0&&assigned()>=workers()) return;
    S.assign[j]=Math.max(0,S.assign[j]+d);
    const box=view.querySelector(".crews"); box.outerHTML=crewPanel(); bindCrews();
    if(!document.getElementById("mapBox").hidden) refreshPanels();
    save();
  });
}

/* ------------------------- THE STORY ------------------------- */
const SCENES = {

ceremony:{ title:"The Awakening Font", text:()=>`
<p>The great hall of House Valcrest smells of incense and old steel. Nine generations of battle mages look down from the banners. Every one of them awakened fire, storm, or iron at this same stone font.</p>
<p>Your elder sibling Seren went first last year. The water boiled into a column of flame so bright the priests had to shield their eyes. Father has not stopped telling that story since.</p>
<p>Now it is your turn. You place both hands into the cold water and wait for the heat to come.</p>
<p>It never does. Instead the water goes still, then <em>stiffens</em>, folding itself into a lattice of perfect crystal ribs, each one fitted to the next like joinery. A priest whispers the word nobody in this hall wanted to hear.</p>
<p>${say("Artifice.")} The magic of carpenters and smiths. Commoner magic.</p>
<p>Then the sound of cracking. On the altar behind the font, the Valcrest Ember Blade, the relic that has never once left its stand, splits clean down the middle.</p>
${sys("SYSTEM","[Affinity Awakened: ARTIFICE]<br>Rank: F &nbsp;·&nbsp; Class: Production<br>Note: Further data unavailable.")}
<p>Every eye turns from the blade to you. Lord Edric Valcrest, your father, says nothing at all. That is worse.</p>`,
choices:[
  {label:"Lift your chin and meet your father's eyes.", hint:"Pride · Resentment +1, Renown +1", fx:{resent:1, renown:1}, go:"verdict"},
  {label:"Bow your head and apologize to the hall.", hint:"Humility · Resentment −1", fx:{resent:-1}, go:"verdict"},
  {label:"Walk to the broken blade and lay your hand on it.", hint:"Curiosity · Craft +1", fx:{craft:1, sawRunes:true}, go:"blade"}
]},

blade:{ title:"What the Crack Revealed", text:()=>`
<p>Gasps follow you up the altar steps. Nobody stops you. Perhaps nobody believes you can make things worse.</p>
<p>The moment your palm touches the steel, you <em>feel</em> it: every grain, every flaw, the way the blade was folded two centuries ago. And beneath the hilt wrap, where no one has looked in generations, letters hammered into the tang.</p>
<p>${say("Forged by the hand of Aurel Valcrest, Artificer.")}</p>
<p>The founder of your house. The one whose portrait hangs above the hearth holding a sword in both hands.</p>
${sys("SYSTEM","[Hidden Record Found]<br>Founder Aurel Valcrest · Affinity: ARTIFICE")}
<p>You let go before anyone else can read it. Your heart is pounding.</p>`,
choices:[{label:"Step back down to face your father.", go:"verdict"}]},

verdict:{ title:"The Verdict", text:()=>`
<p>Judgment comes the next morning in the small hall, without witnesses.</p>
<p>${say(`"There is a holding on the eastern frontier,"`)} your father says. ${say(`"Brackenfold. A mill, a wall, and perhaps eighty people who have stopped paying tax. You will govern it. You will keep the Valcrest name. You will not return to this house unless I summon you."`)}</p>
<p>It is not said in anger. It is said the way he orders a lame horse moved to a far pasture.</p>
${F("sawRunes")?`<p>You think of the letters on the blade. You could say them aloud right now. You could ask him if he knows.</p>`:""}
<p>In the courtyard, Seren is waiting by your horse, still in training leathers, flame scars faint on both wrists.</p>
<p>${say(`"For what it's worth,"`)} Seren says quietly, ${say(`"I asked him to wait a year. He wouldn't hear it."`)}</p>`,
choices:[
  {label:`"Keep the name warm for me. I'll be back, and I won't be asking."`, hint:"Rival · Resentment +1", fx:{resent:1, seren:"rival"}, go:"road"},
  {label:`"Thank you, Seren. Write to me?"`, hint:"Ally", fx:{seren:"ally"}, go:"road"},
  {label:`"Did you know Aurel Valcrest was an artificer?"`, hint:"Requires the hidden record", req:()=>F("sawRunes"), fx:{seren:"ally", seren_knows:true}, go:"serenSecret"},
  {label:"Mount up without a word.", hint:"Cold · Resentment +1", fx:{resent:1, seren:"cold"}, go:"road"}
]},

serenSecret:{ title:"A Shared Secret", text:()=>`
<p>Seren goes very still. Then, quickly, glancing at the windows: ${say(`"Say that again. Quietly."`)}</p>
<p>You tell it all. The crack, the tang, the letters. Seren listens without interrupting, which Seren has never once done in your life.</p>
<p>${say(`"There's a locked room in the archive,"`)} Seren says at last. ${say(`"Father keeps the only key. I always thought it was the debt records."`)} A long breath. ${say(`"Go east. Stay alive. I'll find out what's in there."`)}</p>
${sys("SYSTEM","[Bond Formed: SEREN VALCREST]<br>Status: Secret Ally")}`,
choices:[{label:"Ride east.", go:"road"}]},

road:{ title:"The Eastern Road", text:()=>`
<p>Six days east the farms thin out, then the fences, then the road itself. On the seventh morning you find a covered wagon tipped into a ditch, one wheel bent under it like a broken ankle.</p>
<p>On the first night out, buckling your cuff by the fire, you find something caught in the wool: a sliver of dark steel no longer than a fingernail, still faintly warm. A splinter of the Ember Blade. You do not remember it getting there. You cannot make yourself throw it away.</p>
<p>A woman in a mud stained coat sits on a crate of salt, smoking a clay pipe and glaring at the axle.</p>
<p>${say(`"Tamsin Rook, trader,"`)} she says without getting up. ${say(`"If you're a bandit, the salt's heavy and the coin's hidden. If you're a lord, you're lost."`)}</p>
<p>${say(`"I'm the new ${P("lord").toLowerCase()} of Brackenfold,"`)} you tell her.</p>
<p>She laughs until she coughs. ${say(`"Then you're both."`)}</p>`,
choices:[
  {label:"Kneel by the axle and try your magic on it.", hint:"Craft +1, Prosperity +1", fx:{craft:1, prosperity:1, tamsin:true, mend:true}, go:"axle"},
  {label:"Help her unload, right the wagon by hand, and ride on together.", hint:"Renown +1", fx:{renown:1, tamsin:true}, go:"arrive"},
  {label:"Wish her luck and keep riding.", fx:{}, go:"arrive"}
]},

axle:{ title:"First Repair", text:()=>`
<p>You have never fixed anything bigger than a door latch. But when your hand closes on the axle, the wood <em>talks</em>: a split along the grain, a rotten core, iron fittings rusted thin.</p>
<p>You push. The split draws shut like a healing cut. The rot hardens to something closer to bone. When you open your eyes, the wheel is straight and the axle is darker and denser than any timber you have seen.</p>
${sys("SYSTEM","[Skill Learned: MEND]<br>Restore and strengthen damaged materials.")}
<p>Tamsin spins the wheel with one finger. It turns without a whisper. She puts her pipe away.</p>
<p>${say(`"They told you that magic was worthless?"`)} she says. ${say(`"Oh, little ${P("lord").toLowerCase()}. Someone has been lying to you."`)}</p>`,
choices:[{label:"Ride the last stretch together.", go:"arrive"}]},

arrive:{ title:"Brackenfold", enter(){ S.day=1; S.buildsLeft=perDay(); }, text:()=>`
<p>Brackenfold sits in a fold of brown hills exactly as its name promised. A river along the east side. A mill with a cracked wheel turning at half speed. Sixty roofs, perhaps forty of which still keep out rain. A timber wall with more gaps than posts, and fields to the north half drowned in standing water.</p>
<p>The elder meets you at the gate. Old Bren is tall, stooped, and has the patient face of a man who has buried a lot of hope.</p>
<p>${say(`"Three lords in twelve years,"`)} he says. ${say(`"The first drank. The second gambled. The third took one look and rode home before supper. Which will you be, ${P("child")} of Valcrest?"`)}</p>
${F("tamsin")?`<p>Behind you, Tamsin snorts. ${say(`"This one fixes things, Bren. Give it a week."`)}</p>`:""}
<p>Bren gives you a tour that takes less than an hour, then hands you the village's entire stock of building supplies: two stacks of green timber and a purse with three coins in it.</p>
${sys("SYSTEM","[Territory Acquired: BRACKENFOLD]<br>Population: 83 · Condition: Failing<br>Each morning, assign villagers to work crews and choose one project.<br>Crews gather timber, stone, and food overnight.")}`,
choices:[{label:"Bren rings the old bell. The village gathers in the square.", go:"square1"}]},

square1:{ title:"The Square", text:()=>`
<p>Eighty three people stand in the mud of the square, which is less a square than a wide place in the road. Some have their arms folded. A few children are sitting on the broken well. Nobody is smiling.</p>
<p>You are supposed to say something. Three lords before you said something here, and every one of those speeches ended with them riding away.</p>
<p>Granny Pell, somewhere near the front, says loudly enough for everyone to hear: ${say(`"Go on, then."`)}</p>`,
choices:[
  {label:`"I won't promise you anything. Watch what I do this week, then decide."`, hint:"Morale +1 · Bren approves", fx:{morale:1, speech:"deeds"}, go:"square2"},
  {label:`"By winter, every roof in this village will keep out the rain. That's my promise."`, hint:"Renown +1 · You'll be held to it", fx:{renown:1, speech:"promise"}, go:"square2"},
  {label:`"I need your names. All of them. Starting with you."`, hint:"Morale +2 · Takes all evening", fx:{morale:2, speech:"names"}, go:"square2"}
]},

square2:{ title:"The Square", text:()=>({
  deeds:`<p>It is not a speech. Some people look disappointed. But Bren, at the back, nods once, and a few of the folded arms come unfolded.</p>`,
  promise:`<p>A murmur goes through the crowd. Someone laughs, not kindly. Someone else says ${say(`"We'll see."`)} You have just given them a way to measure you, and they will.</p>`,
  names:`<p>It takes until dark. Ninety minutes of names, trades, and complaints about the mill. By the end you know who the best hunter is, who is feuding with whom over a goat, and that the miller's boy cannot stop staring at your hands. People leave the square talking to each other, which Bren tells you later has not happened in years.</p>`
}[F("speech")]),
choices:[{label:"Look over the village and choose your first project.", go:"plan"}]},

/* ---------- daily build menu ---------- */
plan:{ title:()=>isAway()&&S.phase!=="capital" ? `Day ${S.day} · ${AWAY[S.phase].place}` : (isSeason()&&S.chapter>=4) ? `${SEASON[S.chapter].name} · Week ${S.week} of ${SEASON[S.chapter].len}` : ({war:`Day ${S.day} before the River`, capital:`Day ${S.day} in Highcrown`, spring:`Spring · Week ${S.week} of 6`, summer:`Summer · Week ${S.week} of 8`, winter:`Winter · Week ${S.week} of 6`, snow:`Day ${S.day} of the First Snow`, week:`Day ${S.day} of the First Week`})[S.phase], text:()=>{
  if(S.phase==="summer") return summerPlanText();
  if(S.phase==="winter") return winterPlanText();
  if(S.phase==="snow") return snowPlanText();
  if(isAway()) return AWAY[S.phase].text();
  if(isSeason()&&S.chapter>=4) return seasonPlanText();
  if(S.phase==="war") return warPlanText();
  if(S.phase==="spring") return springPlanText();
  const left = 6 - S.day;
  const intro = {
    1:`<p>You wake before dawn on a straw mattress in the old manor, which is really just a large farmhouse with a slate roof. Through the window, Brackenfold is grey and quiet and waiting to see what you will do.</p>`,
    2:`<p>The village wakes a little earlier today. A few people are already standing near the manor door, pretending they are not waiting for you.</p>`,
    3:`<p>Word has spread to the outlying farms. Two families walk in from the hills just to look at what the new ${P("lord").toLowerCase()} has done.</p>`,
    4:`<p>You are starting to feel the magic differently now, less like a well you draw from and more like a muscle you are building.</p>`,
    5:`<p>Oda's hunters are out at first light, checking the treeline. Nobody says why, but everyone is quieter today.</p>`,
    6:`${sys("THREAT","Briar hound pack · Expected tonight","warn")}<p>One day left. Whatever you build today is what Brackenfold will have when the thorns come.</p>`
  }[S.day];
  const page = S.newPage ? sys("ELDER CODEX",`[Page Restored: ${CODEX[S.newPage].name.toUpperCase()}]<br>Elder name: ${CODEX[S.newPage].elder}<br>You dreamed of Aurel again. New project unlocked.`) : "";
  return `${intro}
  ${page}
  ${mapSVG()}
  <div class="res"><span>Timber <b>${S.stats.timber}</b></span><span>Stone <b>${S.stats.stone}</b></span><span>Coin <b>${S.stats.coin}</b></span><span>Defense <b>${S.stats.defense}</b></span><span>Food <b>${S.stats.food}</b></span><span>Morale <b>${S.stats.morale}</b></span></div>
  ${crewPanel()}
  <p class="chapter">${S.buildsLeft} project${S.buildsLeft===1?"":"s"} left today${perDay()>1?" (Fen is helping)":""} · ${left>0?`${left} more day${left>1?"s":""} after this one`:"final day"}</p>`;
},
choices:()=>isAway() ? awayChoices() : ORDER.filter(id=>{ const pr=PROJECTS[id]; if(pr.summer&&!(isSeason()||S.chapter>=2)) return false; if(pr.ch&&S.chapter<pr.ch) return false; return pr.repeat ? (S.counts[id]||0)<(val(pr.max)||99) : !has(id); }).map(id=>{
  const pr=PROJECTS[id]; const reqOK=!pr.req||pr.req(); const pay=canPay(pr.cost);
  const lock = !reqOK ? ` · Locked: ${pr.reqText}` : !pay ? " · Not enough materials" : "";
  return {label:pr.name, hint:`${pr.gain} · Cost: ${costText(pr.cost)}${lock}`, req:()=>reqOK&&pay, build:id, cls:"build"};
}).concat([{label: isSeason() ? "Let the crews work and build nothing more this week." : "Rest today and let the crews gather.", hint:"Save your materials for something bigger", skip:true}])},

built:{ title:()=>`Project Complete`, text:()=>{
  const pr=PROJECTS[S.lastBuilt];
  return `${pr.after()}
  ${sys("PROJECT COMPLETE",`[${pr.name}]<br>${pr.gain}`)}
  ${S.rankMsg||""}
  ${mapSVG()}`;},
choices:()=>isSeason()
  ? (S.buildsLeft>0 ? [{label:`Start the next project this week (${S.buildsLeft} left)`, go:"plan"}] : [{label:"The week draws to a close.", go:"event"}])
  : (S.buildsLeft>0 ? [{label:"Fen is ready to take on a second project today.", hint:"Your apprentice works alongside you", go:"plan"}] : [{label:"Night falls on Brackenfold.", go:"event"}])},

/* ---------- day events ---------- */
codexDream:{ title:"The Inheritance", text:()=>`
<p>You fall asleep in your boots. Some time in the night, the sliver of the Ember Blade, which you have been carrying in your pocket since the road, burns hot enough to wake you.</p>
<p>It is not in your pocket anymore. It is in your palm, sinking into the skin without pain or blood, leaving behind a mark like a mason's square drawn in silver.</p>
<p>Then the dream takes you.</p>
<p>You are standing in a city of grey stone under a white sky. Domes wider than the great hall of Valcrest. Bridges striding across valleys on three tiers of arches. Harbor walls poured right into the sea. And everywhere, the ruin of it: cracked columns, roots through the paving, an empire a thousand years dead.</p>
<p>A man in a dusty coat is sitting on a fallen column, drawing in a notebook. He looks up, and he has your eyes.</p>
<p>${say(`"Ah. So it finally woke for someone,"`)} says Aurel Valcrest. ${say(`"I found this place when I was younger than you. The Elder builders left everything they knew written in the stone, if you have the right magic to read it. My children wanted swords. So I put it in a sword, and I waited."`)}</p>
${F("sawRunes")?`<p>${say(`"You read my name on the tang, didn't you? Good. Then you already know what they hid."`)}</p>`:""}
${sys("SYSTEM","[Hidden Inheritance Unlocked: THE ELDER CODEX]<br>Pages restored: 1 of ${codexTotal()} · Lime and Fire<br>One page restores each night you rest.")}`,
enter(){ if(!knows("lime")){ S.codex.push("lime"); S.newPage=null; } add({codex_on:true}); },
choices:[
  {label:`"Why hide it? Why not teach everyone?"`, hint:"Lore", fx:{aurelWhy:true}, go:"codexWhy"},
  {label:"Look around the ruined city and memorize everything you can.", hint:"Craft +1", fx:{craft:1}, go:"brenNight"},
  {label:`"You let our family call people like me useless for two hundred years."`, hint:"Resentment +1", fx:{resent:1}, go:"codexAngry"}
]},

codexWhy:{ title:"The Inheritance", text:()=>`
<p>Aurel closes his notebook. ${say(`"I tried. The other founding houses had battle mages, and battle mages had already decided what this kingdom would be. A kingdom of swords needs people to believe the builders are servants. So they burned my workshops and called it an accident."`)}</p>
<p>${say(`"I hid what was left in the only place they would never look. Inside a weapon."`)}</p>
<p>The city begins to fade. ${say(`"Build slowly,"`)} he says. ${say(`"Build where they can't see. And when they finally do see, make sure it's too big to burn."`)}</p>
${sys("LORE","[Fragment Recovered: The Burned Workshops]")}`,
choices:[{label:"Wake up.", go:"brenNight"}]},

codexAngry:{ title:"The Inheritance", text:()=>`
<p>Aurel does not flinch. ${say(`"Yes,"`)} he says. ${say(`"I did. I was afraid, and I chose to wait instead of fight. You can do better than I did. I hope you will."`)}</p>
<p>He holds out the notebook. When you take it, the dream comes apart like smoke, and you wake with your hand closed on nothing at all. But you can still see every page.</p>`,
choices:[{label:"Get up. Bren is knocking.", go:"brenNight"}]},

brenNight:{ title:"Bren's Fire", text:()=>`
<p>That evening Bren invites you to his hearth, which you suspect is a test. His house is small and very clean. He pours you a cup of something brewed from bark that tastes exactly like bark.</p>
<p>${say(`"You did good work today,"`)} he says. ${say(`"I'll tell you plainly, that worries me. The last three never did anything, so they never asked for anything. A ${P("lord")} who builds will want taxes, labor, and obedience. So. What do you want from us?"`)}</p>`,
choices:[
  {label:`"Nothing yet. Let the work speak first."`, hint:"Morale +1", fx:{morale:1}, go:"nextday"},
  {label:`"Honesty. Tell me what this village is hiding."`, hint:"Learn a secret", fx:{}, go:"cellar"},
  {label:`"My family threw me away. I need this place to prove them wrong."`, hint:"Resentment +1, Renown +1", fx:{resent:1, renown:1}, go:"nextday"}
]},

cellar:{ title:"Granny Pell's Cellar", text:()=>`
<p>Bren is quiet for a long moment. Then he takes a lantern and leads you through the dark to the weaver's house in the east row.</p>
<p>Under Granny Pell's loom there is a trapdoor, and under the trapdoor there is grain. Sacks of it, enough to feed the village through a bad winter, hidden from every tax collector for six years.</p>
<p>${say(`"The crown's man takes a third of the harvest no matter how bad it is,"`)} Pell says, arms folded. ${say(`"We'd have starved twice over. So. Are you going to report us, little noble?"`)}</p>`,
choices:[
  {label:"Keep the secret. This grain belongs to the people who grew it.", hint:"Morale +2 · The tax man will come someday", fx:{morale:2, hidGrain:true}, go:"nextday"},
  {label:"Use some of it now to feed the work crews properly.", hint:"Food +2, Morale +1", fx:{food:2, morale:1, hidGrain:true}, go:"nextday"},
  {label:"Record it honestly. Brackenfold will deal with the crown openly.", hint:"Resentment −1, Morale −1", fx:{resent:-1, morale:-1, honestLedger:true}, go:"nextday"}
]},

woods:{ title:"Timber and Blood", text:()=>`
<p>At first light you walk into the north wood to look for good oak. You are running your hands along an old trunk when you hear it: ragged breathing somewhere past the ferns.</p>
<p>A hooded figure lies against a stump, one leg torn by long raking wounds. Beside them lies a beast you only know from bestiaries: a hound built of thorned vine and black bark, its jaws still open.</p>
<p>${say(`"Briar hound,"`)} the stranger rasps. ${say(`"Where there's one, there's a pack. Don't stand there gawking, artificer."`)}</p>
<p>You never told them what you are.</p>`,
choices:[
  {label:"Carry the stranger back to Brackenfold.", hint:"Trust · Renown +1", fx:{wren:true, renown:1}, go:"wren"},
  {label:"Splint the leg here, leave food and water, and hurry back to warn the village.", hint:"Caution · Defense +1", fx:{defense:1, wrenOwed:true}, go:"nextday"},
  {label:"Back away. Strangers who know too much are trouble.", hint:"Resentment +1", fx:{resent:1}, go:"nextday"}
]},

wren:{ title:"The Stranger", text:()=>`
<p>The stranger's name is Wren. The village healer cleans the wound and declares it ugly but not fatal. Wren spends the evening watching you work.</p>
<p>${say(`"You mend things,"`)} Wren says at last. ${say(`"That's all they let you think it does. Mending. Hardening. Commoner tricks."`)}</p>
<p>${say(`"What else would it do?"`)}</p>
<p>Wren picks a river stone off the windowsill and drops it in your hand. ${say(`"Don't fix it. Ask it to be something else."`)}</p>
<p>For a long minute, nothing. Then the stone softens like warm clay under your thumb, and you pinch it into a crude little cup before it sets hard again.</p>
${sys("SYSTEM","[Skill Learned: RESHAPE]<br>Mold stone, earth, and metal without tools.<br>New projects unlocked. Craft +2")}
<p>${say(`"The great houses buried that,"`)} Wren says, ${say(`"a long time ago. Ask me why another day."`)}</p>
${F("sawRunes")?`<p>You think of the letters hidden on the Ember Blade, and you say nothing.</p>`:""}`,
choices:[{label:"Get some sleep. There is a lot to build.", fx:{craft:2, reshape:true}, go:"nextday"}]},

wrenReturn:{ title:"A Debt Repaid", text:()=>`
<p>The stranger from the woods is sitting on the edge of your new work when you come back from the day's labor, leg still splinted, eating one of your apples.</p>
<p>${say(`"You left me food and a good splint and didn't ask questions,"`)} the stranger says. ${say(`"Name's Wren. I pay my debts."`)}</p>
<p>Wren tosses you a river stone. ${say(`"Stop fixing things for a minute. Ask that to be something else."`)}</p>
<p>It takes you most of an hour. Then the stone softens like clay under your thumb.</p>
${sys("SYSTEM","[Skill Learned: RESHAPE]<br>Mold stone, earth, and metal without tools.<br>New projects unlocked. Craft +2")}
<p>When you look up, Wren is already limping back toward the trees. ${say(`"I'll be around,"`)} Wren calls. ${say(`"You'll need me before the month is out."`)}</p>`,
choices:[{label:"Turn the stone over in your hands until it's dark.", fx:{craft:2, reshape:true, wrenAround:true}, go:"fen"}]},

fen:{ title:"The Miller's Son", text:()=>`
<p>Fen has been following you for two days at a distance he clearly believes is subtle. Tonight he finally works up the nerve to knock on the manor door.</p>
<p>${say(`"Can it be learned?"`)} he blurts out. ${say(`"Artifice. My gran said my grandfather could feel when a beam was going to crack. Nobody ever tested me because, well. We're not nobles."`)}</p>
<p>You take his hand and press it to the doorframe. For a heartbeat, faint as a candle in fog, you feel <em>something</em> answer.</p>
${!F("reshape")&&S.stats.craft>=3?`<p>And as you guide his small flicker of power into the wood, something shifts in your own. You feel the grain not as something to repair but as something that could be <em>rearranged</em>.</p>`:""}`,
enter(){ if(!F("reshape")&&S.stats.craft>=3){ add({reshape:true, craft:1, selfTaught:true}); } },
choices:()=>[
  ...(F("selfTaught")?[{label:"(You can feel it: the stone and earth would bend for you now.)", hint:"Skill Learned: RESHAPE · Craft +1", req:()=>false}]:[]),
  {label:"Take him on as your apprentice.", hint:"Fen joins · Morale +1 · Future projects cost less", fx:{fen:true, morale:1}, go:"nextday"},
  {label:"Tell him it's real, but give him a job hauling timber for now.", hint:"Timber +2", fx:{timber:2, fenLater:true}, go:"nextday"},
  {label:`"The academies say commoners can't learn it. I'm sorry."`, hint:"Morale −1 · Something feels wrong about saying it", fx:{morale:-1}, go:"nextday"}
]},

trade:{ title:()=>F("tamsin")?"Tamsin's Caravan":"The Peddler", text:()=>F("tamsin")?`
<p>Tamsin rolls in with two wagons and a mule that hates everyone. She looks at your work and lets out a long whistle.</p>
<p>${say(`"Four days,"`)} she says. ${say(`"I've seen counts spend four years and do less. All right, little ${P("lord").toLowerCase()}. Let's do business."`)}</p>`:`
<p>A thin peddler arrives with one wagon and a suspicious eye. He has heard rumors about a noble in Brackenfold who rebuilds things with bare hands and clearly does not believe a word of it.</p>
<p>${say(`"I'll trade,"`)} he says. ${say(`"But my prices are my prices."`)}</p>`,
