<p>${F("tamsinHurt")?`${say(`"Yes,"`)} Tamsin says. ${say(`"I did. And I'd do it again, because you were seventeen and alone and half the kingdom would have used you."`)} She does not apologize. You realize she never will, and that it is one of the more honest things about her.`
 :F("saelmarLore")?`${say(`"The same thing I want,"`)} she says. ${say(`"Someone who can stand on the Tide Gate and tell it to sleep. The Admiralty would offer you anything. I told them you aren't for sale. They'll ask anyway."`)}`
 :`Tamsin looks at you for a long moment. Then she laughs, the way she did on the road, until she has to wipe her eyes. ${say(`"Gods,"`)} she says. ${say(`"Four years I've been waiting to be shouted at."`)}`}</p>
<p>The sealed letter on the table is addressed to you, from the Admiralty of Saelmar. It is an invitation. Not yet, Tamsin says. When the storms in the north are settled.</p>
${sys("REVEAL","[Tamsin Rook · General of the Tide Guard of Saelmar]<br>Saelmar guards the third Elder Wonder: the Tide Gate")}`,
choices:[{label:"Keep the letter. Pour two cups of something strong.", go:"nextweek"}]},

tamsinRecall:{ title:"The Admiralty's Summons", text:()=>`
${F("tideResult")?`<p>The Tide Gate has been quiet since you sat in the Keeper's chair. Until this spring.</p>`:""}<p>A ship's officer in Tide Guard blue rides up the Elder road with a sealed order for Tamsin. The Admiralty is recalling her. The Tide Gate has swallowed a third harbor.</p>
<p>${F("tamsinGeneral")?`She reads it twice, standing in the square, and then comes to find you. ${say(`"They want me home,"`)} she says. ${say(`"And they want to know if you'll send the Codex with me."`)}`:`She reads it, folds it, and says only: ${say(`"I have to go south for a while. I'll explain when I'm back. I'm sorry."`)}`}</p>`,
choices:()=>F("tamsinGeneral") ? [
  {label:"Copy the Codex pages for Saelmar's engineers and send them with her.", hint:"An alliance with Saelmar · Renown +2", fx:{saelmarPact:true, renown:2}, go:"tamsinRecall2"},
  {label:`"Not the Codex. But when the storm is done, I'll come myself."`, hint:"A promise to Tamsin", fx:{tamsinPromise:true, tamsinTrust:1}, go:"tamsinRecall2"},
  {label:`"Stay. Saelmar can wait one more season. The Storm Engine can't."`, hint:"Tamsin stays for the finale · she disobeys orders", fx:{tamsinStays:true, tamsinTrust:1}, go:"tamsinRecall2"}
] : [{label:"Wish her a safe voyage.", fx:{tamsinGone:true}, go:"nextweek"}]},
tamsinRecall2:{ title:"The Admiralty's Summons", text:()=>({
  pact:`<p>Tamsin rides south with three copies of the Codex in an oilskin case and a letter in your hand to the Admiralty. ${say(`"When the storm breaks,"`)} she says at the gate, ${say(`"look south. Saelmar pays its debts."`)}</p>`,
  promise:`<p>Tamsin rides south with your promise and nothing else. ${say(`"I'll hold you to it,"`)} she says. ${say(`"I hold everyone to everything. It's very tiring."`)}</p>`,
  stays:`<p>Tamsin tears the order into four pieces and feeds them to the kiln. ${say(`"The Admiralty can court-martial me after the storm,"`)} she says. ${say(`"If there's anything left to court-martial."`)}</p>`
})[F("saelmarPact")?"pact":F("tamsinPromise")?"promise":"stays"],
choices:[{label:"Back to work.", go:"nextweek"}]},

tamsinMap:{ title:"Saelmar", text:()=>`
<p>Tamsin kneels by the Map of Wonders and puts one finger on a mark far to the south, across a band of blue stone that is the sea. ${say(`"There,"`)} she says. ${say(`"The Tide Gate. Home."`)}</p>
<p>${F("tamsinPromise")?say(`"You promised,"`)+" she adds, very softly.":F("saelmarPact")?say(`"The Admiralty has been reading your pages all winter. They'd like to meet the hand that wrote them."`):say(`"When you're ready,"`)+" she says. "+say(`"Not before."`)}</p>`,
choices:[
  {label:`"Saelmar is next."`, hint:"Book Two begins in the south", fx:{nextWonder:"saelmar", tamsinTrust:1}, go:"nextweek"},
  {label:`"Not yet. Brackenfold needs me a little longer."`, hint:"Morale +1", fx:{morale:1}, go:"nextweek"}
]},

/* ===================== QUIET WEEKS ===================== */
wkMason:{ title:"A Mason at the Gate", text:()=>`<p>An old stonemason walks in from the west with his tools on his back and asks for work. He says he heard Brackenfold pays fairly and doesn't ask questions. He has, he admits, been fired from four towns for arguing with lords.</p>`,
choices:[{label:"Hire him. Arguing with lords is practically a qualification here.", hint:"Stone +4 · one more skilled worker", fx:{stone:4, n_popAdd:1}, go:"nextweek"},{label:"Ask him to teach the school's stonework class.", hint:"Craft +1", fx:{craft:1}, go:"nextweek"}]},
wkFountain:{ title:"The Children and the Well", text:()=>`<p>Three children have broken the well's winch trying to ride the bucket down. Nobody is hurt. The children are very sorry. The well is very broken, and the whole street needs water by tonight.</p>`,
choices:[{label:"Fix it yourself in ten minutes, in front of everyone.", hint:"Renown +1", fx:{renown:1}, go:"nextweek"},{label:"Make the children help fix it, slowly, with real tools.", hint:"Morale +1 · they'll remember", fx:{morale:1}, go:"nextweek"},{label:"Let Fen teach them how it works while he repairs it.", hint:"Fen grows", req:()=>F("fen"), fx:{n_fenBond:1}, go:"nextweek"}]},
wkMill:{ title:"The Water Quarrel", text:()=>`<p>The mill needs the river high. The fields downstream need the river low. Tobin and the farmers have been shouting about it for three days, and now they want you to decide.</p>`,
choices:[{label:"The mill gets the water. Bread first.", hint:"Food +2, Morale −1", fx:{food:2, morale:-1}, go:"nextweek"},{label:"Cut a new channel so both get what they need.", hint:"Stone −2 · Morale +2", req:()=>S.stats.stone>=2, fx:{stone:-2, morale:2}, go:"nextweek"},{label:"Make them take turns, week by week.", hint:"Morale +1", fx:{morale:1}, go:"nextweek"}]},
wkContest:{ title:"Garth's Contest", text:()=>`<p>Garth wants to hold a log-splitting contest in the square, lumber crews against the masons, with a barrel of cider for the winners. The masons have already accepted. Nobody has asked whether there is any work getting done this week.</p>`,
choices:[{label:"Allow it. Enter yourself.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"},{label:"Allow it, but the split logs go to the town woodpile.", hint:"Timber +5, Morale +1", fx:{timber:5, morale:1}, go:"nextweek"}]},
wkPeddler:{ title:"The Peddler's Map", text:()=>`<p>A peddler passing through tries to sell you a map he swears shows the location of an Elder ruin. It is almost certainly fake. It is also drawn on very old paper, in a hand that looks oddly familiar.</p>`,
choices:[{label:"Buy it.", hint:"Coin −2 · Craft +1", req:()=>S.stats.coin>=2, fx:{coin:-2, craft:1}, go:"nextweek"},{label:"Send him on his way.", hint:"Coin saved", fx:{}, go:"nextweek"},{label:"Trade him a mended pot for it.", hint:"Prosperity +1", fx:{prosperity:1}, go:"nextweek"}]},
wkRain:{ title:"A Week of Rain", text:()=>`<p>It rains for six days straight. The river is high and brown, the lanes are mud, and the half-finished work outside the walls is in danger of washing away.</p>`,
choices:[{label:"Send every crew to protect the half-built works.", hint:"Morale −1 · nothing is lost", fx:{morale:-1}, go:"nextweek"},{label:"Let it go. Everyone stays dry this week.", hint:"Timber −3 · Morale +1", fx:{timber:-3, morale:1}, go:"nextweek"},{label:"Use the week to dig new drainage ditches.", hint:"Defense +1", fx:{defense:1}, go:"nextweek"}]},
wkCousin:{ title:"A Noble Cousin", text:()=>`<p>A distant Valcrest cousin you have never met arrives with three servants and a great deal of luggage, announces that he has come to 'help manage the estate,' and asks where the best room is.</p>`,
choices:[{label:"Give him a room and a job at the kiln.", hint:"Morale +1 · he lasts two days", fx:{morale:1}, go:"nextweek"},{label:"Send him home with a polite letter.", hint:"Resentment +1", fx:{resent:1}, go:"nextweek"},{label:"Introduce him to Granny Pell.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"}]},
wkWolves:{ title:"Wolves in the Fields", text:()=>`<p>Ordinary wolves this time, not thorns: a hungry pack has taken two sheep from the south pasture, and the shepherds want them dealt with.</p>`,
choices:[{label:"Send Oda's hunters.", hint:"Food +1", fx:{food:1}, go:"nextweek"},{label:"Build stone pens and let the wolves go hungry somewhere else.", hint:"Stone −2 · Prosperity +1", req:()=>S.stats.stone>=2, fx:{stone:-2, prosperity:1}, go:"nextweek"}]},
wkStatue:{ title:"A Statue of You", text:()=>`<p>A committee has formed, without your knowledge, to raise a statue of you in the square. They have a design. The design is very large. The design is holding a hammer in a heroic pose you have never once struck in your life.</p>`,
choices:[{label:"Absolutely not.", hint:"Morale +1 · they are disappointed and relieved", fx:{morale:1}, go:"nextweek"},{label:"Agree, on the condition it's a statue of the whole first crew instead.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"},{label:"Agree, and quietly enjoy it.", hint:"Renown +2, Resentment +1", fx:{renown:2, resent:1}, go:"nextweek"}]},
wkFever2:{ title:"A Sick Ox", text:()=>`<p>The oxen that haul stone from the quarry are coughing. Two are down already. Without them, the quarry slows to a crawl.</p>`,
choices:[{label:"Buy new oxen from the traders.", hint:"Coin −3", req:()=>S.stats.coin>=3, fx:{coin:-3}, go:"nextweek"},{label:"Rest them and haul by hand for a week.", hint:"Stone −2, Morale −1", fx:{stone:-2, morale:-1}, go:"nextweek"},{label:"Ask the healer, who knows more about animals than she admits.", hint:"Morale +1", fx:{morale:1}, go:"nextweek"}]},

/* ===================== TERRITORY EVENTS ===================== */
terrStones:{ title:"The Boundary Stones", text:()=>`
<p>Bren comes to find you with mud on his knees and a look on his face you have not seen before. He has been out walking the new boundary, and he has found something.</p>
<p>A stone. Waist high, carved with a mason's square, half sunk in the turf a full mile beyond anything Brackenfold has ever claimed. Then another, a mile further on. Then a whole line of them, running off into the hills.</p>
<p>${say(`"Elder boundary stones,"`)} he says. ${say(`"This was a town once. A big one. Bigger than anything in the east today. We've been living in the corner of it."`)}</p>`,
choices:[
  {label:"Reset the stones to the old Elder line.", hint:"Every future land claim costs 1 less of each material", fx:{terrCheap:true}, go:"nextweek"},
  {label:"Ride out to the neighboring farms and ask before claiming anything else.", hint:"Morale +1, Renown +1", fx:{morale:1, renown:1}, go:"nextweek"},
  {label:"Leave the stones where they lie, and draw them on the Codex map.", hint:"Craft +1", fx:{craft:1}, go:"nextweek"}
]},

gardenGate:{ title:"The Gardener at the Gate", text:()=>`
<p>The morning after the new wall closes around the Garden, the Gardener is standing at Brackenfold's north gate. Three times the height of a man, stone and root, perfectly still, facing outward.</p>
<p>The children have already decided it is theirs. Somebody has hung a garland on its arm. It has not moved to take it off.</p>`,
choices:()=>[
  {label:"Let it stand guard. It has decided to protect the city.", hint:"Defense +3", fx:{defense:3, gardenerGuard:true}, go:"nextweek"},
  {label:"Ask it to tend the orchards and fields instead.", hint:"Food +4, Morale +1", fx:{food:4, morale:1}, go:"nextweek"},
  ...((F("wren")||F("wrenAround")||F("wren_met"))?[{label:"Ask Wren to become Keeper of the Garden Quarter, openly, with a title.", hint:"Wren stays · Craft +1, Morale +1", fx:{wrenKeeper:true, craft:1, morale:1}, go:"nextweek"}]:[])
]},

marrowVote:{ title:"Marrow Ford Wants a Say", text:()=>`
<p>Rhea Tallis rides down from Marrow Ford with a petition signed by every adult in the new village. They are grateful, it says. They are also not Brackenfold, and they would like their own headman, their own market day, and their own vote on what gets built there.</p>`,
choices:[
  {label:"Grant it. Marrow Ford governs itself under Brackenfold's charter.", hint:"Morale +2 · a model for every new land", fx:{morale:2, selfRule:true}, go:"nextweek"},
  {label:"Agree to a shared council, with one Marrow seat in your hall.", hint:"Prosperity +1, Morale +1", fx:{prosperity:1, morale:1}, go:"nextweek"},
  {label:`"Not yet. Brackenfold needs one voice until the north is safe."`, hint:"Defense +1, Resentment +1", fx:{defense:1, resent:1}, go:"nextweek"}
]},

hollinCaptain:{ title:"The Captain of Hollin Cross", text:()=>`
<p>Captain Dorran, the garrison commander who refused to send help when the briar hounds came and fled when Kastrel burned his town, rides up to the rebuilt walls of Hollin Cross with a royal commission in his hand. He would like his town back.</p>
<p>The people of Hollin Cross line the wall and watch you, waiting to see what you will do.</p>`,
choices:()=>[
  {label:"Send him away. Hollin Cross chose Brackenfold.", hint:"Morale +2, Resentment +1", fx:{morale:2, resent:1}, go:"nextweek"},
  {label:"Let him stay as captain of the watch, under your charter.", hint:"Defense +2", fx:{defense:2}, go:"nextweek"},
  ...(F("charter")==="royal"?[{label:"Write to King Aldric and let the crown decide.", hint:"Royal favor · Renown +1", fx:{royalFavor:true, renown:1}, go:"nextweek"}]:[])
]},

terrLord:{ title:"A Neighbor's Complaint", text:()=>`
<p>Lord Corvane of the western marches, whose lands now share a border with Brackenfold's for eleven miles, sends a letter so long it has a table of contents. The gist: Brackenfold is growing too fast, his tenants keep moving to your farmsteads, and he would like it to stop.</p>`,
choices:[
  {label:"Invite him to visit and see why his tenants are leaving.", hint:"Renown +2", fx:{renown:2}, go:"nextweek"},
  {label:"Offer to build him a mill and a bridge, at cost.", hint:"Coin +3 · a friendly border", fx:{coin:3, corvaneFriend:true}, go:"nextweek"},
  {label:"Reply in one line: they are free people, my lord.", hint:"Resentment +1, Morale +1", fx:{resent:1, morale:1}, go:"nextweek"}
]},

/* ===================== WREN AND THE KEYSTONE ===================== */
wrenWatch:{ title:"Someone on the Treeline", text:()=>`
<p>Three nights running, Oda's watch reports the same thing: a figure on the edge of the north wood after midnight, perfectly still, looking at the town. Not at the walls. At the manor. At your window.</p>
${(F("wren")||F("wrenAround"))?`<p>On the fourth night you go out yourself, and it is Wren, as you half expected. ${say(`"Checking,"`)} Wren says, before you can ask. ${say(`"That you're still here. That you haven't broken yet. Most people in your position would have."`)}</p><p>${say(`"Most people in my position?"`)}</p><p>Wren only smiles, and is gone into the trees.</p>`
:`<p>On the fourth night you go out yourself. The figure is gone before you reach the fields. In the grass where it stood, someone has left a small river stone, worn smooth, with a mason's square scratched into one face.</p>`}`,
choices:[
  {label:"Leave a lantern burning on the wall for whoever it is.", hint:"Morale +1 · a kindness noticed", fx:{morale:1, wrenLantern:true}, go:"nextweek"},
  {label:"Double the night watch on the north side.", hint:"Defense +1", fx:{defense:1}, go:"nextweek"},
  {label:"Keep the stone in your pocket.", hint:"Craft +1", fx:{craft:1, wrenStone:true}, go:"nextweek"}
]},

keystoneReveal:{ title:"What You Are", enter(){ add({keystone:true, craft:2}); }, text:()=>{
const why={tamed:"The Gardener knelt to you. It has never knelt to anyone. Not to the Elder builders who made it. Not to me.",
           destroyed:"The heartstone didn't break because you're strong. It broke because it obeyed you. A thousand-year-old Wonder obeyed an eighteen-year-old with dirt on their hands.",
           sealed:"You sealed a Wonder's heart with a sack of mortar. The mortar didn't do that. You did."}[F("thornFate")]||"The Garden knew you the moment you walked into it.";
return `<p>Wren comes to the manor on the first night of the long winter, knocks for once, and sits by your fire with snow melting off a worn cloak.</p>
<p>${say(`"${why}"`)}</p>
<p>${say(`"There are artificers,"`)} Wren says, ${say(`"and then, very rarely, there is something else. The Elder builders had a word for it. A Keystone. Most artificers shape what's in front of them. A Keystone holds everything around them together: every stone in a wall, every hand on a crew, every Wonder in reach. The other artificers on the Thousand Masons' crews could each raise a column. It took a Keystone to make the columns into a dome."`)}</p>
<p>${say(`"There hasn't been one in a thousand years. That's why the font couldn't read you. That's why the Ember Blade broke."`)}</p>
${sys("SYSTEM","[Hidden Class Revealed: KEYSTONE]<br>Craft +2<br>New power: KEYSTONE SURGE · once in each part of a chapter, raise a project without spending any materials")}`;},
choices:[
  {label:`"How long have you known?"`, hint:"Wren will tell you, eventually", fx:{askedWren:true}, go:"keystoneReveal2"},
  {label:`"Does anyone else know?"`, hint:"The Spire", fx:{askedSpire:true}, go:"keystoneReveal2"},
  {label:"Put your hand on the hearthstone and feel the whole manor answer.", hint:"Craft +1", fx:{craft:1}, go:"keystoneReveal2"}
]},
keystoneReveal2:{ title:"What You Are", text:()=>`
<p>${F("askedWren")?`${say(`"Longer than you'd like,"`)} Wren says. ${say(`"Ask me again when you've stood in the Spire. You'll understand more by then."`)}`
 :F("askedSpire")?`${say(`"The Spire suspects,"`)} Wren says. ${say(`"They have spent two hundred years correcting artificers who were too strong. They were looking for you. They just didn't know it."`)}`
 :`The whole manor answers you at once: every beam, every hinge, every roof tile, the way a choir answers a single note. You take your hand away very quickly.`}</p>
<p>Before Wren leaves, Wren says one more thing, very quietly, from the doorway. ${say(`"Aurel wasn't a Keystone. He knew he wasn't. It broke his heart. He made the Codex hoping one of his blood would be."`)}</p>`,
choices:[{label:"Sit by the fire a long time after Wren goes.", go:"nextweek"}]},

wrenFont:{ title:"The Sliver", text:()=>`
<p>Wren finds you in Aurel's journals, late, in the fourth week of winter. Without being asked, Wren sits down across the table and says: ${say(`"You asked me once how long I'd known. I'll tell you now."`)}</p>
<p>${say(`"I was at your awakening. In the great hall of Valcrest, in a servant's coat, holding a tray of wine. I have been at every Valcrest awakening for two hundred years. Aurel asked me to. Every time, I waited for the blade to crack. Every time, it didn't."`)}</p>
<p>${say(`"When it finally cracked, I went up the altar steps after you and picked up the splinter that flew off the tang. And on the road east, the first night, while you slept by the fire, I put it in your cuff."`)}</p>
<p>${say(`"I'm sorry I didn't tell you sooner. I had to see what you'd build before I knew whether to tell you at all."`)}</p>
${sys("REVEAL","[Wren carried the splinter]<br>The Codex did not find you by chance")}`,
choices:[
  {label:`"You could have just told me. On the first day."`, hint:"Resentment +1", fx:{resent:1, wrenHonest:true}, go:"nextweek"},
  {label:`"Thank you for choosing me."`, hint:"Wren's trust · Resentment −1", fx:{resent:-1, wrenBond:1}, go:"nextweek"},
  {label:`"What else did Aurel ask you to do?"`, hint:"There is one more thing", fx:{wrenBond:1, wrenAurelAsk:true}, go:"wrenFont2"}
]},
wrenFont2:{ title:"The Sliver", text:()=>`
<p>Wren is quiet for a very long time. ${say(`"He asked me to make sure the Keystone didn't have to do the last part alone,"`)} Wren says at last. ${say(`"When a Wonder goes wild, a Keystone can close it. But something has to stay inside to keep it closed. A keeper. That's what I am. That's what the Elder builders made me for."`)}</p>
<p>${say(`"I've kept the Garden for four hundred years. When the time comes, I'd like to keep something else. So you don't have to."`)}</p>`,
choices:[{label:"You don't have an answer to that yet.", fx:{wrenBond:1}, go:"nextweek"}]},

wrenPrice:{ title:"The Keeper's Price", text:()=>`
<p>The storm over Kastrel turns green in the fourth week of spring, and Wren comes to the hall carrying nothing at all, which you have learned means Wren is about to say something important.</p>
<p>${say(`"Quill will tell you it takes two artificers to stop the Engine,"`)} Wren says. ${say(`"He's half right. It takes a Keystone to close it, and a keeper to stay inside and hold it closed. Quill doesn't know about keepers. Very few people alive do."`)}</p>
<p>${say(`"I'm the last keeper I know of. The Garden doesn't need me anymore${F("thornFate")==="tamed"?". It has you, and a whole city around it":""}. When we reach the Engine, I'd like to be the one who goes inside."`)}</p>`,
choices:[
  {label:`"No. There has to be another way."`, hint:"Wren will wait for your answer at the Engine", fx:{wrenOffer:true, wrenBond:1}, go:"nextweek"},
  {label:`"If it comes to that, I'll let you choose."`, hint:"Wren's offer stands", fx:{wrenOffer:true}, go:"nextweek"},
  {label:`"Then you'll spend this spring doing whatever you like. Anything at all."`, hint:"Morale +1 · Wren's offer stands", fx:{wrenOffer:true, morale:1, wrenBond:1}, go:"nextweek"}
]},

endKeeper:{ title:"The Keeper's Gift", text:()=>`
<p>You lay your hands on the seam, and it begins to close, and you feel it: the closing will not hold without something inside.</p>
<p>Wren steps past you before you can move.</p>
<p>${say(`"Four hundred years,"`)} Wren says, and smiles at you, the first real smile you have ever seen on that face. ${say(`"I waited four hundred years for someone to fix the Garden. You did it in a winter. I think I'd like to rest now, somewhere that hums."`)}</p>
<p>Wren puts one hand over yours on the seam, then lets go and walks into the light. You close the Engine behind them, with everything you have, and this time it holds.</p>
<p>When the storm clears, there is a new stone in the cage of arches, set at the very center, carved with a mason's square and a single word in Elder script that no one in Brackenfold can read. Fen copies it into the Codex anyway. It means <em>kept</em>.</p>
${sys("ENDING","[THE KEEPER'S GIFT]<br>The Engine sleeps, with Wren as its keeper · Brackenfold becomes the Free City of Artificers")}`,
choices:[{label:"Go home.", go:"c7epilogue"}]},

/* ============================================================
   CHAPTER FIVE: THE KING'S ROAD   (internal id 4.5)
   ============================================================ */
c45open:{ title:"Chapter Five: The King's Road", enter(){
  if(S.chapter!==4.5){ S.snap={built:S.built.slice(), counts:{...S.counts}, pop:S.pop}; S.chapter=4.5; S.phase="open"; S.day=0; S.week=0; S.lastBuilt=null; S.weekReport=null; }
}, text:()=>`
<p>The king's terms arrive with the first cold morning of autumn, in a leather case with the royal seal, and they are exactly what he said they would be.</p>
<p>${F("charter")==="free"?`<em>To the Free Town of Brackenfold, ally of the Crown:</em> the king asks, and offers to pay handsomely, for Brackenfold's artificers to repair the crown's fortresses.`:`<em>To the Royal Town of Brackenfold:</em> under the charter, Brackenfold's artificers will repair the crown's fortresses.`} Five of them, strung along the old King's Road from the eastern frontier to Highcrown. Greywatch. Saltmarch. Dunmere. Corvane's Ford. And last, Ravenhold, the oldest fortress in the kingdom, built on Elder foundations nobody alive understands.</p>
<p>At the bottom, in the king's own hand: <em>By old custom, a repaired fortress is proven by the Stone Trial. My engineers will test Ravenhold's walls with the great trebuchet before the whole court. I am told the nobles are already placing bets.</em></p>
<p>Bren reads it over your shoulder. ${say(`"Five fortresses,"`)} he says. ${say(`"And someone has to run this town while you're gone."`)}</p>
${sys("CHAPTER FIVE","The King's Road<br>Part One: Five Fortresses · five days on the road, two actions a day<br>Part Two: The Spring of Charters · 6 weeks")}`,
choices:()=>[
  {label:"Leave Bren in charge. He has run Brackenfold longer than you have.", hint:"Morale +1", fx:{morale:1, regent:"bren"}, go:"c45road"},
  ...(F("fen")?[{label:"Leave Fen in charge. He's ready, even if he doesn't know it.", hint:"Fen grows braver · Fen's own story this spring", fx:{regent:"fen", n_fenBrave:1}, go:"c45road"}]:[]),
  {label:"Leave Oda in charge, with the watch doubled.", hint:"Defense +1", fx:{defense:1, regent:"oda"}, go:"c45road"}
]},

c45road:{ title:"The King's Road", enter(){ S.phase="kingsroad"; S.day=1; S.actsLeft=2; givePage("groma"); }, text:()=>`
<p>The King's Road runs west for two hundred miles, and most of it is in terrible shape. Ruts deep enough to lose a wheel in. Bridges held up by habit. Inns with roofs that leak onto the beds.</p>
<p>On the second night, camped beside a fallen Elder milestone, you dream of Aurel for the first time in months. He is kneeling in a field with a strange cross of wood on a staff, plumb lines hanging from each arm, sighting along it toward a far hill.</p>
<p>${say(`"Every Elder road, every aqueduct, every city wall began with this,"`)} he says. ${say(`"Not stone. A straight line, and the patience to find it."`)}</p>
${sys("ELDER CODEX","[Page Restored: THE SURVEYOR'S CROSS]<br>Elder name: Groma")}
${sys("PART ONE",`Five days on the King's Road · two actions each day<br>Rebuild the fortresses, find out who doesn't want you to succeed, and be ready for the Stone Trial at Ravenhold`)}`,
choices:[{label:"Start at Greywatch.", go:"plan"}]},

kr1:{ title:"The Captain of Greywatch", text:()=>`
<p>Greywatch's captain is a broad, sunburned woman named Halla Brennt who has commanded a crumbling fortress for eleven years and has written to the crown about it forty times. She meets you at the gate with her arms folded.</p>
<p>${say(`"Forty letters,"`)} she says. ${say(`"And they send me a nineteen-year-old with no tools."`)}</p>`,
choices:[
  {label:"Mend her gatehouse with one hand while she watches.", hint:"Renown +1 · Halla becomes an ally", fx:{renown:1, hallaAlly:true}, go:"nextday"},
  {label:"Ask her to show you every crack she wrote about. All forty letters' worth.", hint:"The fortress work goes faster", fx:{n_r_fort:1, hallaAlly:true}, go:"nextday"},
  {label:"Hire her bored garrison as laborers.", hint:"Stone +3", fx:{stone:3}, go:"nextday"}
]},

kr2:{ title:"Lord Corvane's Table", text:()=>`
<p>At Corvane's Ford, the lord of the western marches invites you to dinner. ${F("corvaneFriend")?"You built him a mill last year. He has not forgotten.":"You have never met. He has, however, written you a very long letter."} Lord Aldous Corvane is silver-haired and soft-spoken and serves the best wine you have ever tasted.</p>
<p>Over dessert, he leans in. ${say(`"The old houses are frightened of you,"`)} he says pleasantly. ${say(`"I am not. I am a practical man. Share the Codex with House Corvane, only with House Corvane, and you will never have an enemy west of the river."`)}</p>`,
choices:()=>[
  {label:`"The Codex belongs to anyone who wants to learn. Not to a house."`, hint:"Corvane becomes an enemy", fx:{corvaneEnemy:true}, go:"nextday"},
  {label:"Smile, thank him for the wine, and promise nothing.", hint:"Keep him guessing", fx:{corvaneWary:true}, go:"nextday"},
  ...(F("corvaneFriend")?[{label:`"You don't need to own it, Aldous. You need a better mill. I'll build you three."`, hint:"Corvane stays a friend", fx:{corvaneAlly:true}, go:"nextday"}]:[])
]},

kr3:{ title:"The Soft Mortar", text:()=>`
<p>At Ravenhold, the work goes well for two days. On the third morning you walk the north curtain wall and stop. A whole stretch of the mortar you laid yesterday is soft under your thumb. Not curing. Not even trying to.</p>
<p>Elder mortar does not fail like that. Not on its own.</p>`,
choices:[
  {label:"Taste it. Smell it. Find out what's been put in it.", hint:"A clue to the sabotage", fx:{sabotageClue:true}, go:"nextday"},
  {label:"Tear it out and relay the whole section tonight.", hint:"Stone −3 · the wall is sound again", req:()=>S.stats.stone>=3, fx:{stone:-3, n_r_fort:1}, go:"nextday"},
  {label:"Say nothing. Set a quiet watch on the wall tonight.", hint:"Catch whoever did it", fx:{watchSet:true}, go:"nextday"}
]},

kr4:{ title:()=>LIk()?`${LIn()}, on the King's Road`:"A Letter From Home", text:()=>{
const li=LIk();
if(li && (F("romance")||(F("aff_"+li)||0)>=3)) return `<p>${LIn()} rides out from Highcrown to meet you at Dunmere and stays two days, which is all ${LIp("sub")} can steal from court. On the second night you sit on the fortress wall with your feet over the drop, looking at a valley full of farms you have never seen.</p>
<p>${say(`"Can I ask you something I've been wondering for a while?"`)} ${LIp("sub")} says. ${say(`"When all this is over, the storms and the Spire and the kings, what do you want? Not for Brackenfold. For you."`)} A pause. ${say(`"A house? Children? A very long nap?"`)}</p>`;
return `<p>A letter from Brackenfold, in ${F("regent")==="fen"?"Fen's careful hand":F("regent")==="oda"?"Oda's blunt one":"Bren's slow, square one"}. Nothing has burned down. The kiln cracked and was mended. Granny Pell has complaints. The town misses you, which nobody says outright, and everyone says anyway.</p>`;},
choices:()=>{ const li=LIk();
  if(li && (F("romance")||(F("aff_"+li)||0)>=3)) return [
    {label:`"A house with a garden. Children, someday. You."`, hint:"Closeness +2 · a seed for Book Two", fx:{["aff_"+li]:2, familyHope:true, romance:li}, go:"nextday"},
    {label:`"I want a world where nobody's afraid of what they can build. Then I'll think about the rest."`, hint:"Closeness +1", fx:{["aff_"+li]:1}, go:"nextday"},
    {label:`"Honestly? I'm afraid to want anything. Things keep catching fire."`, hint:`${LIn()} takes your hand · Closeness +1`, fx:{["aff_"+li]:1, honestFear:true}, go:"nextday"}
  ];
  return [{label:"Write back to the whole town.", hint:"Morale +1", fx:{morale:1}, go:"nextday"},{label:"Write back with a list of instructions.", hint:"Timber +3", fx:{timber:3}, go:"nextday"}];
}},

kr5:{ title:"The Eve of the Stone Trial", text:()=>`
<p>The court arrives at Ravenhold in a river of carriages: lords and ladies, the king's council, magisters in Spire grey, and a crowd of common people from every village on the road. On the meadow below the walls, the royal engineers are assembling the great trebuchet, an engine of oak and iron as tall as a church.</p>
<p>${F("watchSet")?`Your watch catches someone on the north wall at midnight, a lime merchant from Corvane's Ford with a sack of crushed chalk. He swears he was only paid to make the mortar fail, not told why. You know why.`:""}
${F("sabotageClue")&&!F("watchSet")?`The chalk you tasted in the soft mortar came from somewhere. You have a good idea where.`:""}</p>`,
enter(){ if(F("watchSet")||((F("n_r_mortar")||0)>=2)) add({sabotageFound:true}); },
choices:[{label:"Sleep on the wall you rebuilt.", go:"ktest1"}]},

ktest1:{ title:"The Stone Trial", enter(){ S.phase="ktest"; }, text:()=>`
<p>The court takes its seats at noon. King Aldric raises one hand. The trebuchet's arm swings up, and a stone the size of a cart sails across the meadow and hits Ravenhold's north wall with a sound you feel in your teeth.</p>`,
choices:()=>[
  {label:"Lay both hands on the wall and hold it.", hint:`Craft ${S.stats.craft}`, fx:{n_kt:S.stats.craft>=10?3:2}, go:"ktest2"},
  {label:"Trust the work. Stand back with your arms folded.", hint:`Fortresses rebuilt: ${F("n_r_fort")||0}/3`, fx:{n_kt:Math.min(3,F("n_r_fort")||0)}, go:"ktest2"},
  ...(F("keystone")?[{label:"Bind the whole wall as one stone. Every block, every joint.", hint:"Keystone", fx:{n_kt:4, keystoneShown:true}, go:"ktest2"}]:[])
]},

ktest2:{ title:"The Sabotaged Wall", text:()=>`
<p>The wall holds. The crowd roars. The trebuchet is wound again, and this time the engineers aim, with what looks like great care, at the north curtain. At the exact stretch where the mortar went soft.</p>
<p>${F("sabotageFound")?"You relaid that section two nights ago. Whoever told the engineers where to aim is about to be disappointed.":"Someone told them where to aim."}</p>`,
choices:()=>F("sabotageFound") ? [
  {label:"Watch Lord Corvane's face when the stone hits.", hint:"The wall holds", fx:{n_kt:3, corvaneExposed:true}, go:"ktest3"}
] : [
  {label:"Run to the weak section and brace it with your body and your hands.", hint:"Risky", fx:{n_kt:1}, go:"ktest3"},
  ...(F("keystone")?[{label:"Let it crack. Then rebuild it in front of the whole court in one breath.", hint:"Keystone", fx:{n_kt:3, keystoneShown:true}, go:"ktest3"}]:[]),
  {label:"Shout for the king to stop the trial: the wall was sabotaged.", hint:F("sabotageClue")?"You have proof":"You have no proof", fx:{n_kt:F("sabotageClue")?2:0, accused:true}, go:"ktest3"}
]},

ktest3:{ title:"The Last Stone", text:()=>`
<p>The king stands. ${say(`"One more,"`)} he says. ${say(`"At the gate."`)} The engineers load the largest stone they have.</p>`,
choices:()=>[
  {label:"Climb onto the gatehouse and stand there while they shoot.", hint:"Bold · Renown +2", fx:{n_kt:2, renown:2, stoodGate:true}, go:"ktestEnd"},
  ...((F("n_r_court")||0)>=2?[{label:"Look to the nobles you won over at court. Let them speak.", hint:"Your allies at court", fx:{n_kt:2}, go:"ktestEnd"}]:[]),
  ...(F("hallaAlly")?[{label:"Signal Captain Halla's Greywatch garrison to brace the gate with you.", hint:"Halla", fx:{n_kt:2}, go:"ktestEnd"}]:[]),
  ...(LIk()&&(F("romance")||(F("aff_"+LIk())||0)>=3)?[{label:`${LIn()} stands on the gate beside you.`, hint:LIn(), fx:{n_kt:2, ["aff_"+LIk()]:1}, go:"ktestEnd"}]:[])
]},

ktestEnd:{ title:"The Verdict of Ravenhold", enter(){
  const sc=(F("n_kt")||0)+(F("n_r_fort")||0)+(F("sabotageFound")?2:0)+Math.floor(S.stats.craft/5);
  S.flags.ktScore=sc; S.flags.ktResult = sc>=13 ? "unbroken" : sc>=8 ? "cracked" : "fell";
  add(F("ktResult")==="unbroken"?{renown:4, prosperity:2}:F("ktResult")==="cracked"?{renown:2, prosperity:1}:{renown:1});
}, text:()=>({
unbroken:`<p>The last stone hits the gate and stops dead, as if it has struck the side of a mountain. It drops into the moat. The gate does not even shiver.</p>
  <p>The court is silent for a moment. Then King Aldric starts to laugh, and the whole meadow laughs with him. ${say(`"Ravenhold has never stood so well since the day it was built,"`)} he says. ${say(`"Pay the artificer. Pay all of them. Pay them twice."`)}</p>
  ${sys("SYSTEM","[Title Earned: THE ONE WHO PASSED THE STONE TRIAL]<br>Renown +4 · Prosperity +2")}`,
cracked:`<p>The gate takes the last stone and cracks, a long seam from the arch to the ground, but it does not fall. You walk out and lay your hand on it, and the crack seals while the court watches.</p>
  <p>${say(`"A crack,"`)} the king says, ${say(`"mended in a breath, is better than no crack at all. It shows us how."`)}</p>
  ${sys("SYSTEM","[Stone Trial Passed]<br>Renown +2 · Prosperity +1")}`,
fell:`<p>The last stone goes straight through the gatehouse. You are already off the wall, but the court sees it fall, and the bets are paid, and the old houses smile the way they smiled at your awakening.</p>
  <p>You rebuild the gate by nightfall. It is better than it was. But the story that goes back to Highcrown is the one about it falling.</p>
  ${sys("SYSTEM","[The Gate Fell]<br>Renown +1")}`
}[F("ktResult")]) + `${F("corvaneExposed")?`<p>That evening, the lime merchant from Corvane's Ford tells the king everything. Lord Corvane leaves Ravenhold before dawn, without his carriage.</p>`:""}${F("keystoneShown")?`<p>At the edge of the crowd, two magisters in Spire grey watch you for a long time, and then turn and whisper to each other.</p>`:""}<p><em>End of Part One: Five Fortresses.</em></p>`,
choices:[{label:"Ride home. Begin Part Two: The Spring of Charters", go:"c45spring"}]},

c45spring:{ title:"The Spring of Charters", enter(){ S.phase="spring"; S.week=1; S.buildsLeft=perWeek(); S.weekReport=null; S.newPage=null; }, text:()=>`
<p>You winter at home, and spring comes early. ${({bren:"Bren hands back the keys to the town with obvious relief.",fen:"Fen hands back the keys to the town and then does not let go of them for a moment.",oda:"Oda hands back the keys to the town and a report on the watch eleven pages long."})[F("regent")]}</p>
<p>Word of the King's Road has spread. Every town along it wants an artificer now.</p>
${sys("PART TWO",`The Spring of Charters · 6 weeks<br>Goal: grow toward a Royal City`)}`,
choices:[{label:"Plan the first week of spring.", go:"plan"}]},

ks1:{ title:()=>F("corvaneExposed")?"Corvane's Fall":"The Road Home", text:()=>F("corvaneExposed")
? `<p>The crown strips Lord Corvane of the marches. His lands, the eleven miles of border with Brackenfold, are offered to whoever will govern them well. The king's letter asks, very politely, whether you know anyone.</p>`
: `<p>On the road home you passed eleven villages, and in every one somebody came out to ask whether Brackenfold might send someone to mend a bridge, a well, a granary roof.</p>`,
choices:()=>F("corvaneExposed") ? [
  {label:"Recommend Captain Halla Brennt of Greywatch.", hint:"Halla becomes a friendly neighbor", req:()=>F("hallaAlly"), fx:{hallaLord:true, renown:1}, go:"nextweek"},
  {label:"Ask that the farmers who work the land hold it themselves.", hint:"Morale +2, Resentment −1", fx:{morale:2, resent:-1}, go:"nextweek"},
  {label:"Claim the marches for Brackenfold.", hint:"Population +15, housing +20", fx:{n_popAdd:15, corvaneLands:true}, go:"nextweek"}
] : [
  {label:"Send journeymen from the college to every one of them.", hint:"Renown +2", fx:{renown:2}, go:"nextweek"},
  {label:"Invite them to send their young people to learn here.", hint:"Population +8", fx:{n_popAdd:8}, go:"nextweek"}
]},

ks2:{ title:()=>F("regent")==="fen"?"What Fen Did":"While You Were Away", text:()=>F("regent")==="fen"
? `<p>Bren tells you, privately, what Fen did while you were gone. A fire in the tannery: Fen went in and held the roof up with his hands until the last apprentice was out. A dispute between two families over a boundary: Fen walked the line with both of them and moved the fence a hand's width himself. A night when nobody slept because the river was rising: Fen was on the bank until dawn.</p><p>${say(`"He didn't write any of it in his letters,"`)} Bren says. ${say(`"I thought you should know."`)}</p>`
: `<p>Bren gives you the full accounting of the autumn and winter: one fire, two weddings, a broken kiln, a great deal of snow, and a stray dog the children have named Keystone, for reasons nobody will explain to you.</p>`,
choices:()=>F("regent")==="fen" ? [
  {label:"Tell Fen you know, and that you're proud of him.", hint:"Fen trusts you completely", fx:{n_fenBond:2}, go:"nextweek"},
  {label:"Give him a seat on the hall council.", hint:"Fen grows braver · Morale +1", fx:{n_fenBrave:1, morale:1, fenCouncil:true}, go:"nextweek"}
] : [
  {label:"Adopt the dog.", hint:"Morale +2", fx:{morale:2, dog:true}, go:"nextweek"},
  {label:"Thank Bren properly, for once.", hint:"Morale +1", fx:{morale:1}, go:"nextweek"}
]},

ks3:{ title:"The Royal Engineers Write", text:()=>`
<p>A letter from Master Engineer Adeline Hart, who commanded the trebuchet at Ravenhold. She writes like a woman who has been thinking about one thing for a whole winter.</p>
<p>${say(`"I have spent thirty years knocking walls down. I would like to spend the rest of my career learning how you hold them up. I have thirty engineers who feel the same. Would Brackenfold have us?"`)}</p>`,
choices:[
  {label:"Yes. Bring all thirty.", hint:"They will arrive at the end of spring", fx:{engineersYes:true}, go:"nextweek"},
  {label:"Yes, but they'll start on the crews, like everyone else.", hint:"They will arrive humbled · Morale +1", fx:{engineersYes:true, engineersCrew:true, morale:1}, go:"nextweek"}
]},

ks4:{ title:"Father's Visit", text:()=>`
<p>Your father comes to Brackenfold for a week in spring${F("fatherReconciled")||F("fatherSupport")?", as he has started doing":", for the first time without being sent for"}. He walks the town with his hands behind his back, asking questions, and stops for a long time outside the school, watching the children run.</p>
<p>That evening, by the fire, he says, without looking at you: ${say(`"Your mother would have liked this place. She always said a house is not a home until there is noise in it."`)} He clears his throat. ${say(`"I am getting old. I find I would like there to be noise."`)}</p>`,
choices:()=>[
  {label:`"Are you asking me for grandchildren, Father?"`, hint:"He will deny it completely · Resentment −1", fx:{resent:-1, fatherHint:true}, go:"nextweek"},
  {label:"Tell him he's welcome in Brackenfold any time. There's always noise here.", hint:"Morale +1 · Father warms", fx:{morale:1, fatherReconciled:true}, go:"nextweek"},
  {label:"Change the subject to the price of lime.", hint:"He is relieved", fx:{}, go:"nextweek"}
]},

ks5:{ title:"The Spring Flood", text:()=>`
<p>Snowmelt from the northern hills hits the river all at once, and by the fifth week of spring the water is lapping at the bottom of the ${has("viaduct")?"viaduct's":"bridge's"} arches. The lower quarter is in danger.</p>`,
choices:()=>[
  {label:"Raise a levee along the bank overnight.", hint:F("keystone")?"Keystone · Defense +1":"Stone −3", req:()=>F("keystone")||S.stats.stone>=3, fx:F("keystone")?{defense:1}:{stone:-3}, go:"nextweek"},
  {label:"Evacuate the lower quarter and let the water through.", hint:"Morale −1, Timber −3", fx:{morale:-1, timber:-3}, go:"nextweek"},
  ...(LIk()==="caelan"&&F("romance")?[{label:"Ask Caelan, who happens to be visiting, to turn the river.", hint:"Caelan · Closeness +1", fx:{aff_caelan:1}, go:"nextweek"}]:[])
]},

ks6:{ title:"News From the Spire", text:()=>`
<p>A courier from Highcrown brings a short note from ${F("examResult")==="flight"?"Magister Hale, unsigned":"Archmagister Morrow"}. The Spire's great dome cracked again over the winter. Wider this time. ${F("keystoneShown")?"The magisters who watched you at Ravenhold have been asking questions about what they saw.":""}</p>
<p><em>We may need you before the year is out,</em> the note ends. <em>I hope you will come.</em></p>`,
choices:[
  {label:"Write back: you'll come whenever you're needed.", hint:"Renown +1", fx:{renown:1, spirePromise:true}, go:"nextweek"},
  {label:"Start stockpiling stone for whatever comes.", hint:"Stone +5", fx:{stone:5}, go:"nextweek"}
]},

engineersArrive:{ title:"The Royal Engineers", text:()=>`
<div class="compare">
  <figure>${mapSVG({then:"autumn"})}<figcaption>Before the King's Road</figcaption></figure>
  <figure>${mapSVG()}<figcaption>After the Spring of Charters</figcaption></figure>
</div>
<p>${F("engineersYes")?`Master Engineer Adeline Hart and thirty royal engineers march up the Elder road in their red coats on the last day of spring, with a wagon of instruments and a great deal of curiosity.`:`On the last day of spring, Master Engineer Adeline Hart rides up the Elder road alone, without being invited, and asks to see the town.`}</p>
<p>She walks Brackenfold from wall to wall, and at the end of it she says: ${say(`"I have spent my life thinking the strongest wall was the one that could take the most stones. I think I had it backwards. The strongest wall is the one people want to live behind."`)}</p>`,
choices:[
  {label:"Make the engineers students of the college.", hint:"Craft +1 · three more skilled workers", fx:{craft:1, n_popAdd:F("engineersYes")?30:1, engineersStay:true}, go:"summary45"},
  {label:"Put them to work on a new project right away.", hint:"Stone +6, Timber +6", fx:{stone:6, timber:6, n_popAdd:F("engineersYes")?30:1}, go:"summary45"},
  {label:"Ask Adeline to stay and lead the King's Road works herself.", hint:"Renown +2 · the road becomes Brackenfold's", fx:{renown:2, adelineRoad:true}, go:"summary45"}
]},

summary45:{ title:"Chapter Five Complete", text:()=>`
${mapSVG()}
${regionSVG()}
${sys("CHAPTER RESULT",`The Stone Trial: ${({unbroken:"Unbroken",cracked:"Cracked, and mended",fell:"The gate fell"})[F("ktResult")]}<br>Sabotage: ${F("corvaneExposed")?"Corvane exposed":F("sabotageFound")?"Found":"Never proven"}<br>Rank: ${tier().name} · Population ${S.pop} · Works ${works()}<br>Heart: ${LIk()?`${LIn()} · closeness ${F("aff_"+LIk())||0}${F("familyHope")?" · talking about the future":""}`:"No one yet"}<br>Craft rank ${rank()} · Resentment ${S.stats.resent}`)}
<div class="ad">Ad slot (interstitial between chapters)<br>AdMob placement goes here in the Android build</div>
<p>Next, Chapter Six: <em>The Sunken College</em>. The Spire stands on the ruins of the last Elder college, and its dome is failing.</p>`,
choices:[{label:"Continue to Chapter Six", go:"c5open"},{label:"Start the whole story over", restart:true}]},

/* ============================================================
   CHAPTER SEVEN: THE TIDE GATE   (internal id 5.5)
   ============================================================ */
c55open:{ title:"Chapter Seven: The Tide Gate", enter(){
  if(S.chapter!==5.5){ S.snap={built:S.built.slice(), counts:{...S.counts}, pop:S.pop}; S.chapter=5.5; S.phase="open"; S.day=0; S.week=0; S.lastBuilt=null; S.weekReport=null;
    if(!F("tamsinGeneral")) add({tamsinGeneral:true, tamsinLateReveal:true}); }
}, text:()=>`
${F("tamsinLateReveal")?`<p>Tamsin Rook comes to the manor in a dark blue coat with silver at the collar, and tells you the truth all at once: she is a general of the Tide Guard of Saelmar, across the southern sea, sent north years ago dressed as a trader to find out whether anything else was waking, and whether anyone alive could still build like the Elder masons.</p>`:""}
<p>In the first week of spring, a ship comes up the river. A real one, tall-masted, flying the blue and silver of Saelmar, so large it has to anchor below the ${has("viaduct")?"viaduct":"bridge"} because it cannot fit under. Half the town walks down to stare at it.</p>
<p>Tamsin comes ashore in full uniform with the Admiralty's invitation in her hand. The one she gave you a year ago, sealed. ${say(`"I said they'd ask again,"`)} she says. ${say(`"They're asking. The Tide Gate took the harbor town of Merrow in the winter storms. Two hundred people. The Admiralty doesn't want your Codex. It wants you."`)}</p>
<p>She hesitates, which Tamsin almost never does. ${say(`"I want you too. I want you to see my home before there's nothing left of it to see."`)}</p>
${sys("CHAPTER SEVEN","The Tide Gate<br>Part One: Saelmar · five days across the sea, two actions a day<br>Part Two: The Salt Summer · 5 weeks")}`,
choices:()=>[
  ...(F("fen")?[{label:"Sail south, and bring Fen.", hint:"Fen sees the sea", fx:{fenSouth:true}, go:"c55sail"}]:[]),
  ...(LIk()&&(F("romance")||(F("aff_"+LIk())||0)>=3)?[{label:`Sail south, and bring ${LIn()}.`, hint:"A voyage together", fx:{liSouth:true}, go:"c55sail"}]:[]),
  {label:"Sail south with Tamsin alone.", hint:"Tamsin's trust", fx:{tamsinTrust:1}, go:"c55sail"}
]},

c55sail:{ title:"The Southern Sea", enter(){ S.phase="saelmar"; S.day=1; S.actsLeft=2; }, text:()=>`
<p>Nine days downriver to the coast, and then the sea, which you have never seen. ${F("fenSouth")?"Fen is sick over the rail for two days and then refuses to come below for the rest of the voyage.":""}${F("liSouth")?`${LIn()} stands at the bow with you every evening, watching the light go.`:""}</p>
<p>On the eleventh morning, Saelmar rises out of the haze: a city of white stone and blue roofs, built in terraces up the side of a great bay. And across the mouth of the bay, a mile long, taller than the Spire, gleaming wet in the sun, the Tide Gate.</p>
<p>It is moving. Slowly, the way a sleeping animal breathes. Its great bronze gates open a hand's width and close again, and every time they do, the whole sea in the bay rises and falls.</p>
<p>The silver mark on your palm has not stopped burning since the coast.</p>
${sys("PART ONE",`Five days in Saelmar · two actions each day<br>Learn the Tide Gate, win the Admiralty, and be ready when the sea comes`)}`,
choices:[{label:"Go ashore.", go:"plan"}]},

sa1:{ title:"The Admiralty", text:()=>`
<p>The Admiralty of Saelmar meets in a round hall with its windows facing the Gate. Seven admirals, all of them old, all of them sunburned, and at their head High Admiral Corin Vey, a lean grey man with a voice like a ship's bell.</p>
<p>${say(`"General Rook says you can talk to stone,"`)} he says. ${say(`"Saelmar has been talking to that Gate for five hundred years. It has never once answered. Saelmar will give you anything you ask if you can make it listen. A palace. A fleet. A seat in this room."`)}</p>`,
choices:[
  {label:`"I don't want a palace. I want your harbor towns to stop drowning."`, hint:"The Admiralty trusts you", fx:{admiraltyTrust:true}, go:"nextday"},
  {label:`"I'll want a treaty. Open trade with Brackenfold, forever."`, hint:"Coin later · Prosperity", fx:{saelmarTreaty:true}, go:"nextday"},
  {label:`"I can't promise anything. I've never seen anything like it."`, hint:"Honesty · Tamsin's trust", fx:{tamsinTrust:1}, go:"nextday"}
]},

sa2:{ title:"Kell", text:()=>`
<p>Tamsin takes you along the coast in a small boat at dawn, to a place where the sea is very calm and very green. Under the water you can see roofs. A whole town, streets and squares, a church tower with its bell still hanging, all drowned.</p>
<p>${say(`"Kell,"`)} Tamsin says. ${say(`"I was born there. The Gate took it when I was nine. My mother and my brothers got out. My father went back for the neighbors."`)} She does not say anything else for a while. ${say(`"That's why I went north. That's why I sell salt. I wanted to find someone who could do what you do before it happened to anyone else's father."`)}</p>`,
choices:[
  {label:"Sit with her until the tide turns.", hint:"Tamsin's trust", fx:{tamsinTrust:2}, go:"nextday"},
  {label:"Lay your hand on the water and feel for the town below.", hint:"Craft +1 · the stone remembers", fx:{craft:1, kellFelt:true}, go:"nextday"}
]},

sa3:{ title:"The Empty Chair", text:()=>`
<p>Inside the Tide Gate, at its very center, there is a hall the Saelmar engineers have never managed to enter. The door has no handle. It opens for you the moment you touch it.</p>
<p>Inside: a round room of bronze and stone, humming. Great chains running down into the dark. And in the middle, a single stone chair, worn smooth by centuries of someone sitting in it, and empty. On the arm of the chair, someone has carved a line in old Saelmar script.</p>
<p>Tamsin reads it, very slowly. ${say(`"'I have gone to find the others. Keep the tide until I return.'"`)} She looks up. ${say(`"The records say the Keeper of the Tide vanished five hundred years ago. Carrying a book."`)}</p>
${(F("wren")||F("wrenAround")||F("wren_met"))?`<p>You think of Wren, and of everything Wren has told you about keepers, and you understand that the Tide Gate has been waiting for someone to sit down in that chair for five hundred years.</p>`:""}`,
enter(){ add({emptyChair:true}); },
choices:[
  {label:"Sit in the chair, just for a moment.", hint:"Keystone · feel the Gate", fx:{satInChair:true, craft:1}, go:"nextday"},
  {label:"Leave it. It isn't yours to sit in.", hint:"Wisdom · Resentment −1", fx:{resent:-1}, go:"nextday"},
  {label:"Copy the carving into the Codex.", hint:"A clue for Book Two", fx:{chairCopied:true}, go:"nextday"}
]},

sa4:{ title:()=>F("liSouth")?`${LIn()} by the Sea`:F("fenSouth")?"Fen and the Sea":"The Night Before", text:()=>{
if(F("liSouth")) return `<p>On the fourth night, you and ${LIn()} walk the white terraces of Saelmar after dark, past fountains and lemon trees and people singing in a language you don't know.</p>
<p>${say(`"I could live somewhere like this,"`)} ${LIp("sub")} says. Then, quickly: ${say(`"I mean, I could live anywhere, if you were there. That's what I meant. I'm saying it badly."`)}${F("familyHope")?` A pause. ${say(`"I keep thinking about what you said on the King's Road. About a house, and children. I keep picturing it."`)}`:""}</p>`;
if(F("fenSouth")) return `<p>Fen sits on the harbor wall all night, staring at the Gate. ${say(`"It's not angry,"`)} he says, when you sit down beside him. ${say(`"I thought it would be angry, like the Engine. It's not. It's lonely. It's been waiting for someone to come back and nobody did."`)}</p>`;
return `<p>You spend the last night alone on the harbor wall, watching the Gate breathe. Tamsin finds you there at midnight with two cups of something strong, and doesn't say anything, which is the kindest thing anyone has done for you in weeks.</p>`;},
choices:()=>F("liSouth") ? [
  {label:"Kiss them under the lemon trees.", hint:"Closeness +2", fx:{["aff_"+LIk()]:2, romance:LIk()}, go:"nextday"},
  {label:`"Then let's build that house. After."`, hint:"A promise · a seed for Book Two", fx:{["aff_"+LIk()]:1, familyHope:true, housePromise:true}, go:"nextday"}
] : F("fenSouth") ? [
  {label:`"Then maybe that's what it needs. Someone to come back."`, hint:"Fen grows", fx:{n_fenSkill:1}, go:"nextday"},
  {label:"Put an arm around him and watch it together.", hint:"Fen trusts you", fx:{n_fenBond:1}, go:"nextday"}
] : [{label:"Drink, and say nothing back.", hint:"Tamsin's trust", fx:{tamsinTrust:1}, go:"nextday"}]},

sa5:{ title:"The Sea Draws Back", text:()=>`
<p>You wake before dawn on the fifth day because the city is too quiet. No waves. No gulls. You go to the window, and the bay is draining. The water is running out through the Tide Gate's great bronze doors like bathwater, faster and faster, leaving boats lying on their sides in the mud.</p>
<p>Tamsin is already in the street, in uniform, shouting. ${say(`"It's pulling the sea out,"`)} she says. ${say(`"When it lets go, the whole of it comes back at once."`)}</p>`,
choices:[{label:"Run for the Gate.", go:"tide1"}]},

tide1:{ title:"The Wave", enter(){ S.phase="tide"; }, text:()=>`
<p>The harbor city of Vessa lies at the foot of the Gate, on the bay. Eleven thousand people. The bells are ringing everywhere.</p>`,
choices:()=>[
  {label:"Help the Tide Guard clear the lower city first.", hint:"Lives first", fx:{tideEvac:true, n_tide:1}, go:"tide2"},
  {label:"Get to the Gate's center and try to talk to it.", hint:"Risky", fx:{n_tide:2}, go:"tide2"},
  ...(F("keystone")?[{label:"Put your hand on the harbor wall and listen to the whole Gate at once.", hint:"Keystone", fx:{n_tide:3}, go:"tide2"}]:[])
]},

tide2:{ title:"The Wall of Water", text:()=>`
<p>The Gate's doors swing open, all at once, and the sea comes back. Not a wave. A wall, green and white and roaring, as tall as the harbor towers.</p>`,
choices:()=>[
  ...(knows("seawall")?[{label:"Raise the harbor wall the Elder way, curved to throw the wave back on itself.", hint:"Codex: The Sea Wall", fx:{n_tide:4}, go:"tide3"}]:[]),
  ...((F("tamsinTrust")||0)>=3?[{label:"Tamsin's Tide Guard holds the harbor doors with you.", hint:"General Rook", fx:{n_tide:3}, go:"tide3"}]:[]),
  ...((F("n_s_harbor")||0)>=2?[{label:"Trust the harbor works you shored up.", hint:"Your harbor work", fx:{n_tide:3}, go:"tide3"}]:[]),
  {label:"Throw up stone in front of the lower city, as much as you can.", hint:`Craft ${S.stats.craft}`, fx:{n_tide:S.stats.craft>=12?2:1}, go:"tide3"}
]},

tide3:{ title:"The Keeper's Chair", text:()=>`
<p>The first wave breaks against whatever you have raised. The Gate is already drawing the sea back for a second.</p>
<p>You know, suddenly and completely, that the only place to stop it is the empty chair.</p>`,
choices:()=>[
  ...(F("keystone")?[{label:"Sit in the chair and hold the Gate shut with everything you are.", hint:"Keystone Surge · you cannot stay", fx:{n_tide:4, heldGate:true}, go:"tideEnd"}]:[]),
  ...(F("fenSouth")?[{label:"Send Fen to the chains while you take the chair.", hint:fenSk()>=3?"He's ready":"Fen is afraid", fx:{n_tide:fenSk()>=3?3:1, fenChains:true}, go:"tideEnd"}]:[]),
  {label:"Talk to it. Tell it someone is coming back.", hint:F("satInChair")||F("emptyChair")?"You know what it's waiting for":"A guess", fx:{n_tide:F("satInChair")?3:2}, go:"tideEnd"}
]},

tideEnd:{ title:"Low Tide", enter(){
  givePage("seawall");
  const sc=(F("n_tide")||0)+(F("n_s_gate")||0)+(F("n_s_harbor")||0)+(F("admiraltyTrust")?1:0)+Math.floor(S.stats.craft/5);
  S.flags.tideScore=sc; S.flags.tideResult = sc>=13 ? "calmed" : sc>=8 ? "held" : "drowned";
  add(F("tideResult")==="calmed"?{renown:4, saelmarPact:true}:F("tideResult")==="held"?{renown:2, saelmarPact:true}:{renown:1});
}, text:()=>({
calmed:`<p>In the chair, you feel the Gate the way you once felt a cracked axle on the eastern road: every chain, every bronze door, the whole sea pressing on it. And underneath, five hundred years of waiting.</p>
  <p>You do not close it. You cannot. But you tell it, the way you would tell a frightened animal, that someone is looking. That it is not forgotten. And the second wave never comes. The sea slides back into the bay like a sigh, and stays there.</p>
  <p>Vessa is wet to the second floor. Every person in it is alive.</p>
  ${sys("SYSTEM","[Title Earned: THE ONE WHO CALMED THE SEA]<br>Renown +4 · Saelmar is your ally")}`,
held:`<p>You hold the Gate shut from the chair for an hour, until your nose bleeds and your hands go numb, and the second wave breaks against closed bronze. When you let go, the Gate is quiet again. For now.</p>
  <p>The lower city is ruined. ${F("tideEvac")?"But its people were already on the terraces when the water came.":"Forty people did not reach the terraces in time."}</p>
  ${sys("SYSTEM","[The Gate Held]<br>Renown +2 · Saelmar is your ally")}`,
drowned:`<p>The second wave comes over everything you raised. You are in the chair when it hits, and the whole Gate shudders, and then, for no reason you can understand, it stops. As if it was only showing you what it could do.</p>
  <p>${F("tideEvac")?"The lower city is gone. Its people are not; you cleared it first.":"The lower city is gone, and many of its people with it."} You will dream about that water for a long time.</p>
  ${sys("SYSTEM","[Vessa Drowned]<br>Renown +1")}`
}[F("tideResult")]) + `${sys("ELDER CODEX","[Page Restored: THE SEA WALL]<br>Elder name: Opus Maritimum")}
<p>Before you sail home, the Admiralty's engineers bring you their oldest record: the Tide Gate cannot be closed without its keeper. Only calmed, for a time. Somewhere in the world, five hundred years ago, the Keeper of the Tide went looking for something, carrying a book.</p>
<p><em>End of Part One: Saelmar.</em></p>`,
choices:[{label:"Sail home. Begin Part Two: The Salt Summer", go:"c55summer"}]},

c55summer:{ title:"The Salt Summer", enter(){ S.phase="summer"; S.week=1; S.buildsLeft=perWeek(); S.weekReport=null; S.newPage=null; }, text:()=>`
<p>You come home up the river with a Saelmar ship behind you, and on its deck a crate of Admiralty gifts, three Saelmar engineers who want to learn, and a smell of salt that does not wash out of your clothes for a month.</p>
${sys("PART TWO",`The Salt Summer · 5 weeks<br>Saelmar's ships come up the river now · grow toward a Royal City`)}`,
choices:[{label:"Plan the first week of summer.", go:"plan"}]},

ss1:{ title:"Saelmar Ships on the River", text:()=>`
<p>The Saelmar ship that brought you home stays at anchor below the ${has("viaduct")?"viaduct":"bridge"}, and by the second week there are two more. Salt, dried fish, lemons, Saelmar glass. They want timber, Brackenfold iron, and anything with the Elder mark on it.</p>`,
choices:[
  {label:"Open a standing trade with Saelmar.", hint:"Coin +2 every week", fx:{saelmarTrade:true}, go:"nextweek"},
  {label:"Trade a whole season's timber for Saelmar stone.", hint:"Timber −6, Stone +10", req:()=>S.stats.timber>=6, fx:{timber:-6, stone:10}, go:"nextweek"},
  {label:"Ask the sailors to teach the children to swim in the river.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"}
]},

ss2:{ title:"Admiral Rook", text:()=>`
<p>A letter from the Admiralty, read aloud in the square by a very pleased Saelmar officer: in recognition of her service in bringing the artificer of Brackenfold to the Tide Gate, General Tamsin Rook is raised to the rank of Admiral.</p>
<p>Tamsin hears it with her arms folded and goes red to the ears. Later she finds you at the kiln. ${say(`"They want me to command the Tide Guard fleet,"`)} she says. ${say(`"From Saelmar. I told them I'd think about it. I'm still thinking."`)}</p>`,
choices:[
  {label:`"Go. You've earned it. But come back."`, hint:"Tamsin's trust", fx:{tamsinTrust:1}, go:"nextweek"},
  {label:`"Stay a little longer. Brackenfold isn't done needing you."`, hint:"Tamsin stays near · Prosperity +1", fx:{prosperity:1, tamsinNear:true}, go:"nextweek"},
  {label:"Throw her a party she will hate.", hint:"Morale +2 · she secretly loves it", fx:{morale:2, tamsinTrust:1}, go:"nextweek"}
]},

ss3:{ title:"The Copied Carving", text:()=>`
<p>${F("chairCopied")?"You spend an evening with the carving you copied from the Keeper's chair, and the Codex, and Aurel's journals spread across the hall table.":"The carving on the Keeper's chair will not leave your head. You write it out from memory one evening."} <em>I have gone to find the others.</em></p>
<p>Others. Other keepers. Other Wonders. Somebody, five hundred years ago, set out across the world looking for them, with a book.</p>`,
choices:[
  {label:"Write to Wren about it.", hint:"Wren's trust", fx:{wrenBond:1}, go:"nextweek"},
  {label:"Mark the Tide Gate on the Map of Wonders in red.", hint:"Book Two awaits", fx:{tideMarked:true}, go:"nextweek"},
  {label:"Put it away. One Wonder at a time.", hint:"Morale +1", fx:{morale:1}, go:"nextweek"}
]},

ss4:{ title:"Salt in the Wounds", text:()=>F("tideResult")==="drowned"
? `<p>The dreams about the water come every night now. You wake soaked in sweat with your hands pressed flat to the floor, holding up nothing.</p><p>${LIk()&&F("romance")?`${LIn()} is there every time. ${LIp("sub")} doesn't say anything. ${LIp("sub")} just stays.`:"Bren notices before anyone else does, and starts leaving the lamp lit outside your door."}</p>`
: `<p>Summer settles in. Long days, warm rain, the river high and busy. One evening you realize you have gone a whole week without anything trying to kill you or your town, and you do not know what to do with yourself.</p>`,
choices:()=>F("tideResult")==="drowned" ? [
  {label:"Talk about it, finally.", hint:"Morale +1, Resentment −1", fx:{morale:1, resent:-1}, go:"nextweek"},
  {label:"Throw yourself into the work.", hint:"Stone +4, Timber +4", fx:{stone:4, timber:4}, go:"nextweek"}
] : [
  {label:"Take a day off. An entire day.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"},
  {label:"Spend it teaching at the college.", hint:"Craft +1", fx:{craft:1}, go:"nextweek"},
  ...(LIk()&&F("romance")?[{label:`Spend it with ${LIn()}, doing absolutely nothing.`, hint:"Closeness +2", fx:{["aff_"+LIk()]:2}, go:"nextweek"}]:[])
]},

ss5:{ title:"The Empty Foundry", text:()=>`
<p>News comes over the river from Kastrel in the last week of summer: Maelor Quill's great foundry at Karsk is empty. Every forge cold. Every one of his chained artificers moved somewhere deeper in the mountains, along with Quill himself.</p>
<p>And over the mountains, very faint, there is a dark smudge on the sky that does not move with the wind.</p>`,
choices:[
  {label:"Double the watch on the river.", hint:"Defense +2", fx:{defense:2}, go:"nextweek"},
  {label:"Send Oda's scouts across to look.", hint:"You'll know more, sooner", fx:{scoutedKastrel:true}, go:"nextweek"},
  {label:"Tell Fen to stay inside the walls for a while.", hint:"Fen is safer · he will hate it", fx:{fenWarned:true}, go:"nextweek"}
]},

marrenWarning:{ title:"Marren's Warning", text:()=>`
<div class="compare">
  <figure>${mapSVG({then:"autumn"})}<figcaption>Before the voyage</figcaption></figure>
  <figure>${mapSVG()}<figcaption>After the Salt Summer</figcaption></figure>
</div>
<p>${F("marrenAlly")?"Ilse Marren":"A Kastrel woman you have met only once, Ambassador Ilse Marren,"} crosses the river on the last day of summer, alone, soaked to the knees from the ford.</p>
<p>${say(`"Quill has found what he was digging for,"`)} she says. ${say(`"He has taken every artificer in Kastrel deeper into the mountains, and he has stopped hiding it. He's going to wake it. And he has been asking about you. And about the miller's boy."`)}</p>`,
choices:[
  {label:"Put a guard on Fen, day and night.", hint:"It may not be enough", fx:{fenGuarded:true}, go:"summary55"},
  {label:"Ask Marren to send word the moment anything moves.", hint:"Marren's alliance", fx:{marrenAlly:true}, go:"summary55"},
  {label:"Start building faster.", hint:"Stone +4, Timber +4", fx:{stone:4, timber:4}, go:"summary55"}
]},

summary55:{ title:"Chapter Seven Complete", text:()=>`
${mapSVG()}
${regionSVG()}
${sys("CHAPTER RESULT",`The Tide Gate: ${({calmed:"Calmed",held:"Held",drowned:"Vessa drowned"})[F("tideResult")]}<br>The Keeper's chair: ${F("satInChair")||F("heldGate")?"You sat in it":"Empty"}<br>Tamsin: Admiral of the Tide Guard<br>Rank: ${tier().name} · Population ${S.pop} · Works ${works()}<br>Heart: ${LIk()?`${LIn()} · closeness ${F("aff_"+LIk())||0}`:"No one yet"}<br>Codex pages: ${S.codex.length} of ${codexTotal()}`)}
<div class="ad">Ad slot (interstitial between chapters)<br>AdMob placement goes here in the Android build</div>
<p>Next, Chapter Eight: <em>The Other Artificers</em>. Kastrel has artificers too, and the man who commands them is coming for what you love.</p>`,
choices:[{label:"Continue to Chapter Eight", go:"c6open"},{label:"Start the whole story over", restart:true}]},

/* ============================================================
   CHAPTER NINE: THE FREE CITY   (internal id 6.5)
   ============================================================ */
c65open:{ title:"Chapter Nine: The Free City", enter(){
  if(S.chapter!==6.5){ S.snap={built:S.built.slice(), counts:{...S.counts}, pop:S.pop}; S.chapter=6.5; S.phase="open"; S.day=0; S.week=0; S.lastBuilt=null; S.weekReport=null; }
}, text:()=>`
<p>Maelor Quill has been in the cellar under the hall for nine days, behind a door you hardened yourself. He has not tried the lock once. He asked for paper and pencils, and has filled forty pages with drawings of the Storm Engine.</p>
<p>Above him, Brackenfold is in uproar. Tobin the miller wants justice for his son. The families of the two students taken from the viaduct want justice for theirs. King Aldric has written asking for Quill to be sent to Highcrown in chains. Marren has written asking for him to be sent to Kastrel. And half the freed Kastrel artificers, who wore collars beside him for twenty years, do not know what they want at all.</p>
<p>And in six days, by happy accident of the royal calendar, the new charter takes effect. On that morning, Brackenfold becomes a ${F("charter")==="free"?"free city":"chartered royal city"} with its own courts and its own law. Its first case will be the trial of Maelor Quill.</p>
${sys("CHAPTER NINE","The Free City<br>Part One: The Charter Days · six days at home, ending in the trial<br>Part Two: The Long Summer · 6 weeks")}`,
choices:[
  {label:"The trial will be held in public, in the hall, with the doors open.", hint:"Everyone sees justice done", fx:{publicTrial:true}, go:"c65days"},
  {label:"The trial will be held before the hall council only.", hint:"Calmer · fewer witnesses", fx:{councilTrial:true}, go:"c65days"},
  {label:"The families of the taken will sit on the bench beside you.", hint:"Tobin's voice", fx:{familyBench:true}, go:"c65days"}
]},

c65days:{ title:"The Charter Days", enter(){ S.phase="charter"; S.day=1; S.buildsLeft=perDay(); }, text:()=>`
<p>The town is decorating for the charter. Banners on the walls, lanterns in the square, a new stone for the hall door with the charter's first line carved into it. Everyone is building something. Everyone is talking about the trial.</p>
<p>Six days. Build what the new city needs, and get ready to sit in judgment.</p>`,
choices:[{label:"Choose today's work.", go:"plan"}]},

fc1:{ title:"Tobin", text:()=>`
<p>Tobin comes to the manor after dark, which he has never done, and stands in the doorway turning his cap in his hands.</p>
<p>${say(`"They had him for nine days,"`)} he says. ${say(`"My boy. In a cell under a mountain. I want that man to know what it is to sit in the dark for nine days. That's all. I don't need him dead. I need him to know."`)}</p>
${F("fenPromise")?`<p>He does not mention your promise. He does not need to.</p>`:""}`,
choices:[
  {label:`"He'll answer for it. I give you my word."`, hint:"Tobin trusts the trial", fx:{tobinTrust:true}, go:"nextday"},
  {label:`"Fen came home. Help me make sure it never happens to anyone else's son."`, hint:"Tobin softens", fx:{tobinSoft:true}, go:"nextday"},
  {label:"Sit down with him and share a drink. Let him talk.", hint:"Morale +1", fx:{morale:1, tobinTrust:true}, go:"nextday"}
]},

fc2:{ title:"The Cellar", text:()=>`
<p>You go down to see Quill on the second night. He does not look up from his drawings.</p>
<p>${say(`"I took the boy because I knew you would come for him,"`)} he says. ${say(`"I am not going to pretend otherwise. I am also not going to pretend I would do it differently. If you had not come, Kastrel would be weather by now."`)}</p>
<p>${say(`"Then why did you come here under a white flag?"`)}</p>
<p>He finally looks up. ${say(`"Because I've spent my whole life being the strongest artificer in every room. I walked into yours and I wasn't. I wanted to see what that was like."`)}</p>`,
choices:[
  {label:`"Help us stop the Engine, and I'll speak for you at the trial."`, hint:"A bargain", fx:{quillBargain:true}, go:"nextday"},
  {label:`"Nothing I say will change what you did to Fen."`, hint:"Firm", fx:{quillFirm:true}, go:"nextday"},
  {label:"Look at his drawings with him until dawn.", hint:"Craft +1 · understand the Engine", fx:{craft:1, engineStudied:true}, go:"nextday"}
]},

fc3:{ title:()=>F("married")?"A House With Noise in It":LIk()&&F("romance")?"Talk of the Future":"Father at the Window", text:()=>{
if(F("married")) return `<p>${LIn()} finds you in the half-built rooms of ${has("yourHouse")?"your new house":"the manor's empty east wing"}, measuring a small room with a piece of string.</p>
<p>${say(`"What's this one going to be?"`)} ${LIp("sub")} asks.</p>
<p>You did not know you were going to say it until you did. ${say(`"I keep thinking it should be a nursery. Someday."`)}</p>
<p>${LIn()} is quiet for a long moment. Then ${LIp("sub")} takes the string from your hand and measures the window, very carefully, as if it matters. ${say(`"It'll need a better window,"`)} ${LIp("sub")} says, and ${LIp("pos")} voice is not quite steady.</p>`;
if(LIk()&&F("romance")) return `<p>You and ${LIn()} walk the new walls at sunset during the Charter Days, watching the lanterns go up in the square. Children are chasing each other between the stalls.</p>
<p>${say(`"Do you ever think about it?"`)} ${LIp("sub")} asks. ${say(`"A family. Ours."`)}</p>`;
return `<p>Your father is in Brackenfold for the charter. You find him at the manor window late one night, watching the lanterns in the square. ${say(`"When you were small,"`)} he says, ${say(`"you used to take the clocks apart. I punished you for it. I would give a great deal to have that time back and let you."`)}</p>`;},
choices:()=>{
  if(F("married")) return [
    {label:`"After the storm. When it's safe. Let's start our family."`, hint:"A promise for Book Two", fx:{familyPlan:true, ["aff_"+LIk()]:2}, go:"nextday"},
    {label:"Hold them. Say nothing. You both already know.", hint:"Closeness +2 · Book Two", fx:{familyPlan:true, ["aff_"+LIk()]:2}, go:"nextday"}
  ];
  if(LIk()&&F("romance")) return [
    {label:`"All the time. I want that with you."`, hint:"Closeness +2 · a seed for Book Two", fx:{familyHope:true, ["aff_"+LIk()]:2}, go:"nextday"},
    {label:`"Marry me first. Then ask me again."`, hint:"Engaged", fx:{engaged:true, ["aff_"+LIk()]:2}, go:"nextday"},
    {label:`"I'm afraid of bringing a child into a world with a storm in it."`, hint:"Honesty · Closeness +1", fx:{["aff_"+LIk()]:1}, go:"nextday"}
  ];
  return [
    {label:"Give him a clock to take apart.", hint:"Father reconciles · Resentment −1", fx:{fatherReconciled:true, resent:-1}, go:"nextday"},
    {label:`"You had your reasons, Father."`, hint:"Resentment −1", fx:{resent:-1}, go:"nextday"}
  ];
}},

fc4:{ title:"The Old Ring", text:()=>`
<p>Oda brings you a man her watch caught climbing the hall roof at midnight, a crossbow under his coat. He will not say who sent him. He does not need to: his coat is lined with Spire grey.</p>
<p>${say(`"There are magisters who never accepted the verdict at the Spire,"`)} Oda says. ${say(`"They call themselves the Old Ring. They'd rather Quill died in the cellar than told a court what the Spire knew about Kastrel's artificers."`)}</p>`,
choices:[
  {label:"Triple the watch on the hall for the trial.", hint:"Quill will be safe", fx:{trialGuarded:true}, go:"nextday"},
  {label:"Make the man testify at the trial too.", hint:"Expose the Old Ring", fx:{oldRingWitness:true}, go:"nextday"},
  ...(F("examResult")!=="flight"?[{label:"Send him to Archmagister Morrow with a letter.", hint:"The Spire cleans its own house · Renown +1", fx:{renown:1, trialGuarded:true}, go:"nextday"}]:[])
]},

fc5:{ title:"Fen's Choice", text:()=>`
<p>Fen comes to you on the fifth night with the look he gets before he says something he has been rehearsing.</p>
<p>${say(`"I want to testify,"`)} he says. ${say(`"Not for him. Not against him. I just want to say what happened, in my own words, in front of everybody. I'm tired of being the boy who got taken. I'd like to be the one who tells it."`)}</p>`,
choices:[
  {label:`"Then you'll tell it."`, hint:"Fen testifies", fx:{fenTestifies:true, n_fenBrave:1}, go:"nextday"},
  {label:`"Are you sure? You don't owe anyone this."`, hint:(F("n_fenBrave")||0)>=3?"He's sure":"He might change his mind", fx:{fenTestifies:(F("n_fenBrave")||0)>=3}, go:"nextday"}
]},

fc6:{ title:"Charter Day", text:()=>`
<p>The charter takes effect at sunrise. Bren reads its first line aloud from the hall steps, voice cracking: <em>Brackenfold is a city of its people, and of everyone who builds here.</em> The whole square cheers.</p>
<p>Then the bells change, and everyone goes quiet, and walks into the hall.</p>`,
choices:[{label:"Take your seat on the bench.", go:"trial1"}]},

trial1:{ title:"The Trial of Maelor Quill", enter(){ S.phase="trial"; }, text:()=>`
<p>The hall is full ${F("publicTrial")?"to the walls, with the doors open and the square outside packed shoulder to shoulder":F("councilTrial")?"with the council and the families":"and Tobin sits on the bench beside you, with the families of the two students"}. Quill stands in the middle of the floor without chains, at his own request, in his leather apron.</p>
<p>${say(`"Maelor Quill,"`)} you say. ${say(`"You are charged with taking three people from Brackenfold by force, and holding them under the mountain at Karsk."`)}</p>
<p>${say(`"Yes,"`)} says Quill. ${say(`"I did that."`)}</p>`,
choices:[
  {label:"Let Tobin speak first.", hint:"The families' grief", fx:{n_tr:F("tobinTrust")||F("tobinSoft")?2:1}, go:"trial2"},
  {label:"Ask Quill to explain why, in his own words.", hint:"The truth", fx:{n_tr:F("quillBargain")||F("engineStudied")?2:1}, go:"trial2"},
  {label:"Read the charges again, slowly, and let the hall sit with them.", hint:"Calm", fx:{n_tr:1}, go:"trial2"}
]},

trial2:{ title:"The Witnesses", text:()=>`
<p>${F("trialGuarded")?"":`Halfway through the morning, a shout from the gallery: a second man with a crossbow. ${LIk()&&F("romance")?`${LIn()} is on him before he can fire, ${LIk()==="caelan"?"a rope of water around his wrists":"a crack of lightning knocking the bow from his hands"}.`:"Oda puts him on the floor before he can fire."} The hall erupts. When it settles, nobody is looking at Quill the same way.`}</p>
<p>Now the witnesses.</p>`,
choices:()=>[
  ...(F("fenTestifies")?[{label:"Call Fen.", hint:fenSk()>=3?"He's ready for this":"He's nervous", fx:{n_tr:fenSk()>=3?4:2, fenSpoke:true}, go:"trial3"}]:[]),
  ...(F("k6result")==="freed"?[{label:"Call the freed Kastrel artificers.", hint:"Twenty years of collars", fx:{n_tr:3}, go:"trial3"}]:[]),
  ...(F("marrenAlly")?[{label:"Call Ambassador Marren.", hint:"Kastrel's view", fx:{n_tr:2}, go:"trial3"}]:[]),
  ...(F("oldRingWitness")?[{label:"Call the Old Ring's assassin.", hint:"Expose the Spire hardliners", fx:{n_tr:3, oldRingExposed:true}, go:"trial3"}]:[]),
  {label:"Call Wren, who knows what the Engine really is.", hint:"The keepers", fx:{n_tr:2}, go:"trial3"}
]},

trial3:{ title:"The Sentence", text:()=>`
<p>${F("fenSpoke")?`Fen's testimony is the last thing the hall hears before the sentence. He tells it plainly: the cell, the chains, the five days of listening to the iron until it let him go. At the end he turns to Quill. ${say(`"You were wrong about one thing,"`)} he says. ${say(`"You said I'd never be more than an apprentice here. I'm not an apprentice anymore."`)} Quill bows his head to him. It is the only time anyone has ever seen him bow.`:"The witnesses have spoken. The hall is waiting."}</p>
<p>Everyone in Brackenfold is looking at you.</p>`,
choices:()=>[
  {label:"Sentence him to rebuild Karsk's villages, every stone, under Brackenfold's eye.", hint:"Justice that builds · Quill becomes an uneasy ally", fx:{verdict:"rebuild"}, go:"trialEnd"},
  {label:"Exile him across the river, never to set foot in Brackenfold again.", hint:"Quill becomes a rival", fx:{verdict:"exile"}, go:"trialEnd"},
  {label:"Hand him to the king, as the crown asked.", hint:"The crown's justice", fx:{verdict:"crown"}, go:"trialEnd"},
  ...(S.stats.resent>=4||F("quill")==="kin"?[{label:"Pardon him. Artificer to artificer.", hint:"Resentment +1 · the families will not forget", fx:{verdict:"pardon", resent:1}, go:"trialEnd"}]:[])
]},

trialEnd:{ title:"The Verdict", enter(){
  const sc=(F("n_tr")||0)+(F("tobinTrust")?1:0)+(F("tobinSoft")?1:0)+(F("publicTrial")?1:0)+(F("familyBench")?1:0)+Math.floor(S.stats.renown/10);
  S.flags.trialScore=sc;
  const fair = {rebuild:2, exile:1, crown:0, pardon:-2}[F("verdict")];
  S.flags.trialResult = sc+fair>=8 ? "united" : sc+fair>=4 ? "accepted" : "divided";
  if(F("quill")!=="kin") S.flags.quill = ({rebuild:"ally", exile:"rival", crown:"rival", pardon:"kin"})[F("verdict")];
  add(F("trialResult")==="united"?{morale:3, renown:2}:F("trialResult")==="accepted"?{morale:1, renown:1}:{morale:-2});
}, text:()=>`
<p>${({rebuild:`${say(`"Maelor Quill,"`)} you say, ${say(`"you took three people from this city. You will give back three villages to Kastrel. Every house your foundries emptied, you will rebuild with your own hands. When you are finished, you will come back here and tell us it is done."`)} Quill looks at you for a long moment, and nods. ${say(`"That,"`)} he says, ${say(`"is the most dangerous sentence anyone has ever given me."`)}`,
   exile:`${say(`"Maelor Quill, you are exiled from Brackenfold and every land it holds. If you set foot on this side of the river again, you will answer for it."`)} He accepts it without a word. At the door he turns back. ${say(`"When the Engine wakes,"`)} he says, ${say(`"I'll be on the other side of the river. I hope you call."`)}`,
