<p>That evening, in the hall, he does not waste time. ${say(`"Brackenfold held the east,"`)} he says. ${say(`"The crown's fortresses are crumbling and nobody alive can repair them. I am offering you a royal city charter: your own laws, your own guard, a seat for Brackenfold at my council. In return, your artificers rebuild my walls."`)}</p>
<p>He pauses. ${say(`"And there is something else. The Spire's great dome cracked again this spring. The magisters say it is nothing. My engineers say it will fall."`)}</p>`,
choices:[
  {label:"Accept the royal charter.", hint:"Brackenfold becomes a Royal City by law · Renown +3", fx:{charter:"royal", renown:3}, go:"summary4"},
  {label:"Ask for a free city charter instead: no lord, no master, an ally to the crown.", hint:"Independence · Prosperity +2, Resentment +1", fx:{charter:"free", prosperity:2, resent:1}, go:"summary4"},
  {label:`"I'll take the charter, and I'll fix your Spire."`, hint:"The road to Chapter Five", fx:{charter:"royal", spireDeal:true, renown:2}, go:"summary4"}
]},

summary4:{ title:"Chapter Four Complete", text:()=>`
${mapSVG()}
${regionSVG()}
${sys("CHAPTER RESULT",`The siege: ${({broken:"Broken",held:"Held",burned:"The outer town burned"})[F("s4result")]}<br>War engines: ${F("torsionOpen")?"Built from Aurel's sealed page":"The page stayed sealed"}<br>Charter: ${F("charter")==="free"?"Free city":"Royal charter"}<br>Rank: ${tier().name} · Population ${S.pop} · Works ${works()}<br>Heart: ${LIk()?`${LIn()} · closeness ${F("aff_"+LIk())||0}`:"No one yet"}<br>Craft rank ${rank()} · Resentment ${S.stats.resent}`)}
<div class="ad">Ad slot (interstitial between chapters)<br>AdMob placement goes here in the Android build</div>
<p>Next, Chapter Five: <em>The King's Road</em>. The king's charter comes due: five crumbling fortresses, and a Stone Trial before the whole court.</p>`,
choices:[{label:"Continue to Chapter Five", go:"c45open"},{label:"Start the whole story over", restart:true}]},

/* ============================================================
   CHAPTER FIVE: THE SUNKEN COLLEGE
   ============================================================ */
c5open:{ title:"Chapter Six: The Sunken College", enter(){
  if(S.chapter!==5){ S.snap={built:S.built.slice(), counts:{...S.counts}, pop:S.pop}; S.chapter=5; S.phase="open"; S.day=0; S.week=0; S.lastBuilt=null; S.weekReport=null; }
}, text:()=>`
<p>The visitor comes after dark, in a plain cloak, by the river path instead of the road.</p>
${F("examResult")==="flight"
 ? `<p>It is Magister Corvan Hale. His silver glove is gone. ${say(`"The Spire has declared you an outlaw,"`)} he says, ${say(`"and the Spire is going to fall on forty thousand people at the Harvest Festival. I am here without permission, and I would like your help."`)}</p>`
 : `<p>It is Archmagister Selwyn Morrow, blind, led by a young student who keeps staring at the Elder wall. ${say(`"The great dome cracked again,"`)} he says. ${say(`"From the eye to the base this time. My magisters say it will hold. I can hear it, and they are wrong."`)}</p>`}
<p>The Harvest Festival is in three weeks. Forty thousand people will stand in the Spire square beneath the dome. And under the Spire, Morrow says, lie the drowned ruins of the last Elder college in the kingdom, the thing the Spire was built on top of. Its foundations are failing.</p>
${F("spireDeal")?`<p>${say(`"The king says you promised to fix it,"`)} the visitor adds. You did.</p>`:""}
${sys("CHAPTER SIX","The Sunken College<br>Part One: Five Days Below · two actions a day<br>Part Two: The Winter of the College · 6 weeks")}`,
choices:()=>[
  {label:"Go at once. Forty thousand people don't care about the Spire's politics.", hint:"Renown +2", fx:{renown:2}, go:"c5road"},
  ...(F("examResult")==="flight"?[{label:`"Lift the outlaw decree first. In writing."`, hint:"A pardon · Resentment −1", fx:{pardon:true, resent:-1}, go:"c5road"}]
    :[{label:`"In return, the Spire opens its archive to every artificer. Forever."`, hint:"Open archive", fx:{openArchive:true}, go:"c5road"}]),
  {label:"Leave the guild orders for the season and bring the best masons with you.", hint:"Better crews below · Stone −4", req:()=>S.stats.stone>=4, fx:{stone:-4, masonsBelow:true}, go:"c5road"}
]},

c5road:{ title:"Under Highcrown", enter(){ S.phase="below"; S.day=1; S.actsLeft=2; }, text:()=>`
<p>The way down starts in a broom closet in the Spire's lowest cellar, behind a door that has been bricked up three times. Below it is a staircase of Elder concrete, perfectly dry after two hundred years, going down into the dark.</p>
<p>At the bottom: the Sunken College. Lecture halls with vaulted ceilings. Workshops with tools still on the benches. Drowned galleries where the river has crept in. And everywhere, holding up the whole weight of the Spire above, the great Elder piers, cracked like old bones.</p>
${sys("PART ONE",`Five days below · two actions each day<br>Map, shore, read, recruit: everything you do here decides whether the dome holds`)}`,
choices:[{label:"Light a lantern and start.", go:"plan"}]},

b5descent:{ title:"The First Night Below", text:()=>`
<p>You make camp in an Elder lecture hall, under a ceiling painted with stars. Someone will have to come down here with you every day from now on, someone you trust with your life in the dark.</p>`,
choices:()=>[
  {label:"Hale. He knows the Spire better than anyone.", hint:"Hale's frost can slow the cracks", fx:{belowWith:"hale"}, go:"nextday"},
  {label:"Wren, who appears in the doorway as if invited.", hint:"Wren has been down here before", fx:{belowWith:"wren"}, go:"nextday"},
  ...(F("fen")?[{label:"Fen. He's earned it.", hint:"Fen learns from the Elder college", fx:{belowWith:"fen", n_fenSkill:1}, go:"nextday"}]:[])
]},

b5workshop:{ title:"Aurel's Workshop", text:()=>`
<p>Behind a collapsed archway on the second day you find a door with a mark carved beside it: a mason's square with a sword inside it. Aurel's mark.</p>
<p>Inside, his workshop, untouched for two hundred years. A drafting table. A model of Brackenfold's valley, made long before Brackenfold was anything. And a shelf of journals, sealed in wax, that the Spire has been sitting on top of all this time.</p>
${F("belowWith")==="wren"?`<p>Wren stands in the doorway and does not come in. ${say(`"I knew him,"`)} Wren says quietly. ${say(`"I have been the Garden's keeper for a very long time, artificer."`)}</p>`:""}`,
enter(){ if(F("belowWith")==="wren") add({wrenTruth:true}); },
choices:[
  {label:"Take the journals home to Brackenfold.", hint:"Craft +2", fx:{craft:2, journals:"home"}, go:"nextday"},
  {label:"Give them to the Spire's archive, openly.", hint:"Renown +2 · The Spire owes you", fx:{renown:2, journals:"spire"}, go:"nextday"},
  {label:"Read them here, tonight, all of them.", hint:"Craft +1 · Learn what Aurel was afraid of", fx:{craft:1, aurelFear:true}, go:"b5journal"}
]},

b5journal:{ title:"Aurel's Journals", text:()=>`
<p>You read until the lantern gutters. Most of it is engineering. Some of it is grief. And near the end, in a shaking hand, the thing he never wrote in the Codex:</p>
<p><em>There were seven. The Elder builders raised seven great works across the continent, together, a thousand masons at a time: the Garden, the Storm Engine, and five more. They were meant to feed and shelter the whole world. When the empire forgot how to tend them, they did not stop. They simply went wild.</em></p>
${sys("LORE","[Fragment Recovered: The Seven Wonders]")}`,
choices:[{label:"Sleep. Badly.", go:"nextday"}]},

b5map:{ title:"The Map of Wonders", enter(){ givePage("wonders"); }, text:()=>`
<p>In the deepest hall of the college, under the exact center of the Spire, the floor is a map. A continent, inlaid in seven colors of stone, with seven great marks across it. One of them is the Thornwood. One of them, you realize with a cold feeling, is just across the eastern river, in Kastrel.</p>
${sys("ELDER CODEX","[Page Restored: THE MAP OF WONDERS]<br>Seven Elder works · two found")}`,
choices:()=>[
  {label:"Tell the king. This is too big to keep secret.", hint:"Royal favor", fx:{mapTold:"king", royalFavor:true}, go:"nextday"},
  {label:"Tell no one. Not yet.", hint:"Secrecy", fx:{mapTold:"none"}, go:"nextday"},
  ...(LIk()?[{label:`Tell ${LIn()}, and only ${LIn()}.`, hint:"Closeness +1", fx:{mapTold:"li", ["aff_"+LIk()]:1}, go:"nextday"}]:[])
]},

b5student:{ title:"The Student in the Walls", text:()=>`
<p>On the fourth night, something steals your bread. You catch it on the fifth try: a girl of about fifteen, thin and filthy, who has been living in the sunken college for two years.</p>
<p>Her name is Nell. She awakened Artifice at the Spire's own testing, and hid down here before they could correct her. She knows every crack in the foundation by touch. ${say(`"The third pier from the river is the bad one,"`)} she says. ${say(`"It talks at night."`)}</p>`,
choices:[
  {label:"Smuggle her out to Brackenfold.", hint:"Nell joins the college · Craft +1", fx:{nell:true, craft:1}, go:"nextday"},
  {label:"Ask her to help with the repair first.", hint:"Better repair · Nell joins after", fx:{nell:true, nellHelps:true}, go:"nextday"}
]},

b5festival:{ title:"The Harvest Festival", text:()=>`
<p>You come up out of the dark on the fifth morning to bells. The Harvest Festival has begun. The Spire square is packed wall to wall, forty thousand people under garlands and banners, and the great dome above them is groaning.</p>
<p>You can hear it from the street. A long low sound like a ship's timbers in a storm. Nobody in the crowd seems to notice.</p>`,
choices:[{label:"Run for the dome.", go:"dome1"}]},

dome1:{ title:"The Shifting Dome", enter(){ S.phase="dome5"; }, text:()=>`
<p>From the floor of the great hall, you can see it: the crack you saw in spring is wider than your hand now, and it is moving. A fine rain of dust falls from the eye.</p>
<p>${F("belowWith")==="hale"?"Hale is beside you, white-faced.":"Morrow is beside you, his blind face turned upward."} ${say(`"How long?"`)}</p>
<p>${say(`"An hour,"`)} you say. ${say(`"Maybe less."`)}</p>`,
choices:()=>[
  {label:"Clear the square. Ring every bell in the city.", hint:"Lives first · the crowd is safe whatever happens", fx:{evacuated:true, n_d5:1}, go:"dome2"},
  ...(LIk()==="isolde"?[{label:"Ask Isolde to have the royal guard clear the square.", hint:"Isolde's authority", fx:{evacuated:true, n_d5:2}, go:"dome2"}]:[]),
  {label:"No time. Go straight below and fix it.", hint:"Risky · more time for the repair", fx:{n_d5:2}, go:"dome2"}
]},

dome2:{ title:"Beneath the City", text:()=>`
<p>You go down the Elder stairs three at a time. The third pier from the river, Nell's bad one, is splitting top to bottom, and the whole weight of the Spire is resting on it.</p>
${F("masonsBelow")?`<p>Your Brackenfold masons are already there with buckets of Elder concrete, mixed and ready.</p>`:""}`,
choices:()=>[
  ...(knows("foundation")?[{label:"Sink a new deep pier beside it, the way the Codex shows.", hint:"Codex: The Foundation", fx:{n_d5:4}, go:"dome3"}]:[]),
  ...(F("reshape")?[{label:"Reshape the bedrock itself to take the load.", hint:"Reshape", fx:{n_d5:3}, go:"dome3"}]:[]),
  ...(F("nellHelps")?[{label:"Have Nell guide you to every flaw by touch.", hint:"Nell knows the cracks", fx:{n_d5:2}, go:"dome3"}]:[]),
  ...(F("belowWith")==="hale"?[{label:"Ask Hale to freeze the crack while you work.", hint:"Hale's frost", fx:{n_d5:2}, go:"dome3"}]:[]),
  {label:"Pour concrete into the crack and pray it sets.", hint:"Elder concrete", fx:{n_d5:knows("concrete")?2:1}, go:"dome3"}
]},

dome3:{ title:"The Eye of the Dome", text:()=>`
<p>The pier holds. But the dome above has already shifted, and the ring of stone at its eye, the thing that holds the whole curve in compression, has cracked open.</p>
<p>Someone has to go up the outside of the dome and close it.</p>`,
choices:()=>[
  {label:"Climb it yourself.", hint:`Craft ${S.stats.craft}`, fx:{n_d5:S.stats.craft>=10?3:2}, go:"domeEnd"},
  ...(F("fen")?[{label:"Climb it with Fen, one on each side of the ring.", hint:fenSk()>=3?"He's ready":"Fen is shaking", fx:{n_d5:fenSk()>=3?4:2, fenClimbed:true}, go:"domeEnd"}]:[]),
  ...(LIk()==="isolde"?[{label:"Climb it while Isolde holds the wind still around you.", hint:"Isolde's storm", fx:{n_d5:3, liHelped5:true}, go:"domeEnd"}]:[]),
  ...(LIk()==="caelan"?[{label:"Climb it while Caelan pumps water into the cracks to wake the lime.", hint:"Caelan's water", fx:{n_d5:3, liHelped5:true}, go:"domeEnd"}]:[])
]},

domeEnd:{ title:"After the Festival", enter(){
  const sc=(F("n_d5")||0)+(F("n_b_map")||0)+(F("n_b_shore")||0)+Math.floor(S.stats.craft/4)+(knows("dome")?2:0)+(F("n_b_students")||0);
  S.flags.d5score=sc; S.flags.d5result = sc>=14 ? "saved" : sc>=9 ? "held" : "fell";
  add(F("d5result")==="saved"?{renown:5, morale:2}:F("d5result")==="held"?{renown:3}:{renown:1});
}, text:()=>({
saved:`<p>You close the ring with your bare hands, a hundred feet above the square, and feel the whole dome settle into it like a held breath let go. The groaning stops.</p>
  <p>Below, the city stares upward. ${F("evacuated")?"The square is empty, the crowd held back in the side streets, and when they understand it is over they start to cheer.":"Forty thousand people who never knew how close it came are still singing."}</p>
  <p>The Spire's great dome will stand for another thousand years. Every magister in the building knows exactly who to thank.</p>
  ${sys("SYSTEM","[Title Earned: THE ONE WHO HELD THE SKY]<br>Renown +5 · Morale +2")}`,
held:`<p>The ring closes, but not cleanly. The dome stops moving. The Spire's great hall will never be safe to use again, and will have to be rebuilt from the floor up, by artificers.</p>
  <p>But nobody dies. ${F("evacuated")?"The square was already empty.":"The festival never even stops."}</p>
  ${sys("SYSTEM","[The Dome Holds]<br>Renown +3")}`,
fell:`<p>The ring will not close. You feel the dome go, and you have just enough time to throw a stone canopy over yourself before the Spire's great hall comes down in a roar you hear in your bones.</p>
  <p>${F("evacuated")?"The square is empty. Nobody under it. Forty thousand people watch the dome fall from the side streets, alive.":"The square was full. You do not want to remember the rest of that day, and you will, for the rest of your life."}</p>
  ${sys("SYSTEM","[The Dome Fell]<br>Renown +1")}`
}[F("d5result")]) + (F("d5result")==="fell"&&!F("evacuated") ? "" : "") + `<p><em>End of Part One: Five Days Below.</em></p>`,
choices:[{label:"Go home. Begin Part Two: The Winter of the College", go:"c5winter"}]},

c5winter:{ title:"The Winter of the College", enter(){ S.phase="winter"; S.week=1; S.buildsLeft=perWeek(); S.weekReport=null; S.newPage=null; if(F("d5result")==="fell"&&!F("evacuated")) add({morale:-3}); }, text:()=>`
<p>You come home to Brackenfold as the first snow falls, and find it full of strangers: students from the Spire, more than you can count, who heard what happened at the festival and walked east.</p>
${F("nell")?`<p>Nell walks beside you through the gate, staring at everything. ${say(`"You can just do Artifice here?"`)} she asks. ${say(`"Out loud?"`)}</p>`:""}
${sys("PART TWO",`The Winter of the College · 6 weeks · firewood and frozen fields again<br>Goal: grow Brackenfold toward a Royal City`)}`,
choices:[{label:"Plan the first week of winter.", go:"plan"}]},

w5students:{ title:"The Spire's Students", text:()=>`
<p>Forty Spire students, many of them with a spark of Artifice they have hidden for years, sit in rows in the college hall, waiting to be told what to do. Some of them were taught that artificers are dangerous. Some of them were told they were broken.</p>`,
choices:[
  {label:"Take them all into the college.", hint:"Population +25, Craft +1 · Needs housing", fx:{n_popAdd:25, craft:1}, go:"nextweek"},
  {label:"Take the ones with the spark, send the rest home with letters.", hint:"Population +12, Renown +1", fx:{n_popAdd:12, renown:1}, go:"nextweek"},
  ...(F("nell")?[{label:"Put Nell in front of them and let her tell her story.", hint:"Morale +2 · Population +20", fx:{n_popAdd:20, morale:2}, go:"nextweek"}]:[])
]},

w5edric:{ title:"Father", text:()=>`
<p>The letter is from Seren, and it is short. Father has collapsed. The healers think it is his heart, and that he will live if he finally rests. He has asked for you.</p>
<p>The roads are bad. It is a nine day ride, in winter.</p>`,
choices:[
  {label:"Ride to Highcrown now.", hint:"Resentment −2 · the town builds without you this week", fx:{resent:-2, visitedFather:true}, go:"w5edric2"},
  {label:"Write to him instead. You can't leave.", hint:"Resentment +1 · he recovers either way", fx:{resent:1}, go:"nextweek"}
]},

w5edric2:{ title:"Father", enter(){ S.buildsLeft=0; }, text:()=>`
<p>He is propped up in the great bed in the Valcrest townhouse, smaller than you have ever seen him. He smiles when you come in, which you have never seen either.</p>
<p>${say(`"I read about the dome,"`)} he says. ${say(`"I have read it eleven times."`)} He holds out his hand, and after a moment you take it. ${say(`"Aurel would have been prouder of you than he ever was of any of us."`)}</p>
<p>The healers say it was a warning, not an ending. By the time you ride home he is sitting up and arguing with them about his diet, which Seren says is the best sign anyone has seen in a week. He will walk again, slowly, with a cane he complains about constantly.</p>`,
choices:[{label:"Stay three days. Then ride home.", go:"nextweek"}]},

w5seren:{ title:"Seren's Betrothal", text:()=>`
<p>The court has arranged a marriage for Seren: the heir of House Corwin, a fire family in the south, a good alliance on paper. ${serenAlly()?`Seren writes to you about it with a single line: ${say(`"I am supposed to be happy about this."`)}`:"You hear about it from Tamsin."}</p>`,
choices:()=>[
  ...(serenAlly()?[{label:"Write back: you don't have to do this.", hint:"Seren may refuse · Resentment −1", fx:{serenRefuses:true, resent:-1}, go:"nextweek"}]:[]),
  {label:"Send a wedding gift you made yourself.", hint:"A Valcrest heir's gift · Renown +1", fx:{renown:1, serenGift:true}, go:"nextweek"},
  {label:"Stay out of it. It's Seren's life.", hint:"Morale +1", fx:{morale:1}, go:"nextweek"}
]},

w5proposal:{ title:()=>LIk()?`${LIn()} at Midwinter`:"Midwinter", text:()=>{
const li=LIk(), a=F("aff_"+li)||0;
if(li && F("romance") && a>=6) return `<p>${LIn()} comes to Brackenfold for midwinter and stays for the lighting of the lanterns. Afterward, on the wall, with the whole valley white and silent below you, ${LIp("sub")} does not say anything for a long time.</p>
<p>Then: ${say(`"I've been trying to work out how to ask this. ${li==="caelan"?"I wrote it down eleven times. I'm going to say it badly anyway.":"I have negotiated treaties with less trouble."} Will you marry me?"`)}</p>`;
if(li && a>=3) return `<p>${LIn()} comes to Brackenfold for midwinter. You walk the frozen river together, and somewhere along it ${LIp("pos")} hand finds yours and stays there.</p><p>${say(`"I don't know what this is yet,"`)} ${LIp("sub")} says. ${say(`"I'd like to find out."`)}</p>`;
return `<p>Midwinter comes, and the lanterns go up in the square, and you spend it with the town, which is not nothing.</p>`;},
choices:()=>{ const li=LIk(), a=F("aff_"+li)||0;
  if(li && F("romance") && a>=6) return [
    {label:"Yes.", hint:"Engaged", fx:{engaged:true, ["aff_"+li]:2, morale:2}, go:"nextweek"},
    {label:`"Ask me again when the storm is over."`, hint:"Not yet", fx:{["aff_"+li]:1}, go:"nextweek"}
  ];
  if(li && a>=3) return [
    {label:"Kiss them on the frozen river.", hint:"Romance", fx:{romance:li, ["aff_"+li]:2}, go:"nextweek"},
    {label:`"Let's find out slowly."`, hint:"Closeness +1", fx:{["aff_"+li]:1}, go:"nextweek"},
    {label:"Let go of their hand gently. You are better as friends.", hint:"Friendship", fx:{friend:li, romance:false}, go:"nextweek"}
  ];
  return [{label:"Light the last lantern yourself.", hint:"Morale +1", fx:{morale:1}, go:"nextweek"}];
}},

w5fen:{ title:"Fen at Sixteen", text:()=>`
<p>Fen turns sixteen this winter, though everyone in the college calls him Master Fen now, which he hates. He has his own students. He has his own workshop. He has, to your astonishment, a beard, which is not going well.</p>
<p>One night he brings you a drawing. A bridge, but not across a river: across the eastern river, from Brackenfold's bank to Kastrel's. ${say(`"Someday,"`)} he says. ${say(`"When it's safe. I want to build the first thing that joins them."`)}</p>`,
choices:[
  {label:`"Then we'll build it together."`, hint:"Fen trusts you completely", fx:{n_fenBond:1, fenBridge:true}, go:"nextweek"},
  {label:`"It's yours. Your design, your mark."`, hint:"Fen grows braver", fx:{n_fenBrave:1, fenBridge:true}, go:"nextweek"}
]},

w5stranger:{ title:"The Stranger in Kastrel Colors", text:()=>`
<p>In the last week of winter, a rider in the black and green of Kastrel stops at the gate with both hands empty and raised. A woman, no escort. ${say(`"I am Ilse Marren,"`)} she says. ${say(`"Ambassador of the Kastrel Council, which no longer exists. I need to speak to the artificer of Brackenfold."`)}</p>`,
choices:[
  {label:"Let her in and give her a seat by the fire.", hint:"Courtesy", fx:{marrenWarm:true}, go:"nextweek"},
  {label:"Let her in under guard.", hint:"Defense +1", fx:{defense:1}, go:"nextweek"},
  ...(F("tamsinGeneral")?[{label:"Ask Tamsin to sit in on the meeting.", hint:"Tamsin knows how envoys lie", fx:{tamsinReads:true}, go:"nextweek"}]:[])
]},

envoy:{ title:"Ambassador Ilse Marren", text:()=>`
<div class="compare">
  <figure>${mapSVG({then:"autumn"})}<figcaption>Before the college</figcaption></figure>
  <figure>${mapSVG()}<figcaption>After the winter</figcaption></figure>
</div>
<p>Marren sits in the hall with a cup of tea she does not touch, and tells it straight.</p>
<p>${say(`"Kastrel's warlord did not cross the river for land. He crossed it because his chief engineer told him to. A man named Maelor Quill. An artificer, like you. Kastrel has always had them. It keeps them in chains, in foundries under the mountains, and makes them build weapons."`)}</p>
<p>${say(`"Quill has found something under his foundry. Something old. He says it can make Kastrel a power no wall will stop. I believe he is right, and I believe he is mad."`)}</p>
${F("mercy")?`<p>${say(`"You sent our soldiers home with bread,"`)} she adds. ${say(`"In Kastrel, that has been noticed."`)}</p>`:""}`,
choices:[
  {label:"Offer her shelter, and an alliance against Quill.", hint:"Marren's resistance will help you", fx:{marrenAlly:true}, go:"summary5"},
  {label:`"Free the chained artificers, and we'll talk."`, hint:"A condition", fx:{marrenAlly:true, freeDemand:true}, go:"summary5"},
  {label:"Send her away. Kastrel's problems are Kastrel's.", hint:"Resentment +1", fx:{resent:1}, go:"summary5"}
]},

summary5:{ title:"Chapter Six Complete", text:()=>`
${mapSVG()}
${regionSVG()}
${sys("CHAPTER RESULT",`The Spire's dome: ${({saved:"Saved",held:"Held, but ruined",fell:"Fell"})[F("d5result")]}${F("evacuated")?" · the square was cleared":""}<br>Aurel's journals: ${({home:"Brought home",spire:"Given to the Spire"})[F("journals")]||"Read below"}<br>Rank: ${tier().name} · Population ${S.pop} · Works ${works()}<br>Heart: ${LIk()?`${LIn()} · ${F("engaged")?"engaged":F("romance")?"romance":"close"}`:"No one yet"}<br>Codex pages: ${S.codex.length} of ${codexTotal()} · Craft rank ${rank()} · Resentment ${S.stats.resent}`)}
<div class="ad">Ad slot (interstitial between chapters)<br>AdMob placement goes here in the Android build</div>
<p>Next, Chapter Seven: <em>The Tide Gate</em>. Tamsin's home across the southern sea is drowning, and the Admiralty is asking for you.</p>`,
choices:[{label:"Continue to Chapter Seven", go:"c55open"},{label:"Start the whole story over", restart:true}]},

/* ============================================================
   CHAPTER SIX: THE OTHER ARTIFICERS
   ============================================================ */
c6open:{ title:"Chapter Eight: The Other Artificers", enter(){
  if(S.chapter!==6){ S.snap={built:S.built.slice(), counts:{...S.counts}, pop:S.pop}; S.chapter=6; S.phase="open"; S.day=0; S.week=0; S.lastBuilt=null; S.weekReport=null; add({fen:true}); }
}, text:()=>`
<p>A year after Marren's warning, they come on the first warm night of spring: thirty riders in black and green, across the river at a ford nobody uses, straight to the ${has("viaduct")?"viaduct":"bridge"} where Fen and two of his students were working late by lantern light.</p>
<p>By the time the beacon is lit, they are gone. So is Fen.</p>
<p>In the morning, a note is nailed to the ${has("viaduct")?"keystone of the viaduct":"bridge rail"}, in Fen's own careful handwriting, as if someone made him write it: <em>Come alone. Bring the Codex. The foundry at Karsk. M.Q.</em></p>
<p>Tobin the miller is standing at the gate when you come down from the tower.${F("fenPromise")?` He does not say anything. He does not have to. ${say(`"You promised me,"`)} is written all over his face.`:` ${say(`"Bring him home,"`)} is all he says.`}</p>
${sys("CHAPTER EIGHT","The Other Artificers<br>Part One: Across the River · five days in Kastrel, two actions a day<br>Part Two: The Refuge · 6 weeks")}`,
choices:[
  {label:"Cross tonight. Every hour matters.", hint:"Speed", fx:{n_k6:1}, go:"c6go"},
  {label:"Take one day to prepare, and choose who comes with you.", hint:"Better prepared", fx:{n_k6:1, prepared6:true}, go:"c6go"},
  ...(F("charter")==="royal"?[{label:"Send word to the king first. Then cross.", hint:"Royal soldiers will follow · Coin −3", req:()=>S.stats.coin>=3, fx:{coin:-3, royalAid6:true}, go:"c6go"}]:[])
]},

c6go:{ title:"Across the River", enter(){ S.phase="kastrel"; S.day=1; S.actsLeft=2; }, text:()=>`
<p>Kastrel is a country of black mountains and smoke. The villages along the river are half empty. In every one of them, people look at your hands when you pass, the way people in Brackenfold once did.</p>
${F("marrenAlly")?`<p>Ambassador Marren meets you at the first ford with two of her people. ${say(`"The foundry at Karsk is three days into the mountains,"`)} she says. ${say(`"Quill is expecting you. That is the only reason Fen is still alive."`)}</p>`:`<p>You have no guide, no friends here, and a map Ruslan drew from memory${F("ruslan")?"":" that Tamsin bought from a smuggler"}.</p>`}
${sys("PART ONE",`Five days in Kastrel · two actions each day<br>Find Fen, find allies, and learn what Quill is waking`)}`,
choices:[{label:"Into the mountains.", go:"plan"}]},

k6crossing:{ title:"Who Walks Beside You", text:()=>`
<p>The note said come alone. You are not a fool. On the first night, by a fire in a ruined shepherd's hut, you decide who stays at your side for the rest of this.</p>`,
choices:()=>[
  ...(LIk()&&(F("romance")||(F("aff_"+LIk())||0)>=4)?[{label:`${LIn()}. You don't want to do this without ${LIp("obj")}.`, hint:"Romance thread", fx:{kWith:"li"}, go:"nextday"}]:[]),
  ...(serenAlly()?[{label:"Seren. Fire in the dark.", hint:"Seren fights", fx:{kWith:"seren"}, go:"nextday"}]:[]),
  {label:"Wren, who was waiting at the ford before anyone told Wren to come.", hint:"Wren knows the old places", fx:{kWith:"wren"}, go:"nextday"},
  {label:"No one. The note said alone, and Fen's life is on it.", hint:"Quill will respect it", fx:{kWith:"none", quillRespect:true}, go:"nextday"}
]},

k6foundry:{ title:"The Chain Foundry", text:()=>`
<p>On the second day you reach the first of Quill's foundries: a long black hall built into a mountainside, roaring with forges. Through a vent you watch the workers. Some are prisoners. Some are not quite prisoners: they wear iron collars, and when they touch the metal on their anvils, it moves.</p>
<p>Artificers. Dozens of them. In chains.</p>`,
choices:[
  {label:"Free them now, tonight, whatever it costs.", hint:"Allies at the foundry · Quill will know you're here", fx:{n_k_free:2, quillWarned:true}, go:"nextday"},
  {label:"Stay hidden. Get Fen first, then come back for them.", hint:"Stay unseen", fx:{stealth6:true}, go:"nextday"},
  {label:"Slip one of them a message: help is coming.", hint:"Hope spreads", fx:{n_k_free:1}, go:"nextday"}
]},

k6quill:{ title:"Maelor Quill", text:()=>`
<p>He finds you, in the end. Not with soldiers. He simply walks into your camp at dusk on the third day and sits down by the fire, a lean grey-haired man in a leather apron with burn scars up both arms and an iron collar of his own, unlocked, hanging open at his throat.</p>
<p>${say(`"I wore this for twenty two years,"`)} he says, touching the collar. ${say(`"I built Kastrel's walls in it, and its bridges, and its war engines. When the old warlord died, I made sure the new one needed me more than he feared me. That is how an artificer survives in Kastrel."`)}</p>
<p>${say(`"Your boy is safe. He's clever. He's been trying to pick his locks with Artifice for three days, and he nearly managed it."`)} Quill smiles. ${say(`"Under my foundry there is something the Elder builders made. A Storm Engine. I can wake it. With your Codex, I can control it. Then no house, no warlord, no Spire will ever put a collar on one of us again."`)}</p>`,
enter(){ givePage("lightning"); add({quillMet:true}); },
choices:()=>[
  {label:"Hear him out. All of it.", hint:"Understand him · Codex: The Lightning Rod", fx:{quillHeard:true}, go:"k6quill2"},
  {label:`"You took a child to get my attention. No."`, hint:"Refuse him", fx:{quillRefused:true}, go:"nextday"},
  ...(S.stats.resent>=4?[{label:`"We want the same thing, Quill."`, hint:"Resentment speaks", fx:{quillKin:true, resent:1}, go:"nextday"}]:[])
]},

k6quill2:{ title:"Maelor Quill", text:()=>`
<p>He talks until the fire is ash. About the foundries. About artificers who died at the anvils. About the lightning rods the Elder builders put on every tower, which he shows you how to make, as if it costs him nothing.</p>
${sys("ELDER CODEX","[Page Restored: THE LIGHTNING ROD]<br>Elder name: Virga Fulminis")}
<p>${say(`"You and I are the same,"`)} he says, standing. Then he stops, and looks at your hands, and frowns. ${say(`"No. That isn't true, is it. I'm a very good artificer. You are something the old books only have one word for."`)} Then he is gone into the dark.</p>`,
choices:[{label:"Sit with that.", go:"nextday"}]},

k6message:{ title:"Fen's Message", text:()=>`
<p>On the fourth day, scratched into the stone of a foundry outflow channel at exactly the height of Fen's reach, you find Fen's mark. A mill wheel inside a square. And beneath it, letters pressed into the stone with Artifice, small and neat:</p>
<p><em>Under the foundry. Students safe. I have a plan. Tomorrow at the shift bell, when the Engine is tested. Trust me.</em></p>
<p>${fenSk()>=3?"You know what he can do now. You taught most of it.":"You are not sure he is ready for whatever this plan is."}</p>`,
choices:[
  {label:"Trust Fen's plan. Be there at the shift bell.", hint:fenSk()>=3?"He's ready":"A risk", fx:{trustFen:true, n_fenBrave:1}, go:"nextday"},
  {label:"Go in tonight and get him out before he tries anything.", hint:"Override his plan", fx:{overrideFen:true}, go:"nextday"}
]},

k6heart:{ title:()=>F("kWith")==="li"?`${LIn()}, the Night Before`:"The Night Before", text:()=>{
if(F("kWith")==="li"){ const li=LIk(); return `<p>You cannot sleep, so you sit in the mouth of a cave above the foundry with ${LIn()}, watching the forge-glow on the clouds.</p>
<p>${F("engaged")?say(`"When this is over,"`)+` ${LIp("sub")} says, `+say(`"I want to be married in Brackenfold. Under the dome. With Granny Pell complaining about the flowers."`):say(`"I need to tell you something before tomorrow,"`)+` ${LIp("sub")} says. `+say(`"In case I don't get the chance after."`)}</p>`;}
if(F("kWith")==="seren") return `<p>Seren sits beside you on a cold rock and says, very quietly: ${say(`"When I awakened fire, Father cried. Did you know that? He was so happy. I used to think if you had awakened fire too, everything would have been fine."`)} A long pause. ${say(`"I'm glad you didn't."`)}</p>`;
if(F("kWith")==="wren") return `<p>${say(`"I was the Garden's keeper,"`)} Wren says to the fire. ${say(`"For four hundred years. I watched the Elder builders forget. I watched the Garden go wild. I waited for someone to come and fix it, and you came."`)} Wren looks at you. ${say(`"Tomorrow, the Storm Engine. I would like you to fix that one too."`)}</p>`;
return `<p>Alone, you sit and mend small stones until your hands stop shaking. You think about Fen's mark in the channel. You think about the first time he put his hand on a doorframe and felt something answer.</p>`;},
choices:()=>{ if(F("kWith")!=="li") return [{label:"Sleep, if you can.", fx:{}, go:"foundry1"}];
  const li=LIk();
  return [
    {label:`Tell ${LIn()} you love ${LIp("obj")}.`, hint:"Romance turning point", fx:{romance:li, ["aff_"+li]:2, saidLove:true}, go:"foundry1"},
    {label:`Ask ${LIn()} to stay behind tomorrow. It's too dangerous.`, hint:`A quarrel · ${LIn()} will be hurt`, fx:{quarrel6:true}, go:"foundry1"},
    {label:"Just sit together until dawn.", hint:"Closeness +1", fx:{["aff_"+li]:1}, go:"foundry1"}
  ];}},

foundry1:{ title:"The Shift Bell", enter(){ S.phase="foundry6"; }, text:()=>`
<p>The bell rings at dawn. The forges all go quiet at once. Deep under the mountain, something else starts to hum.</p>
<p>You get into the foundry ${F("stealth6")?"unseen, through the outflow channel":F("quillWarned")?"through a gate Quill's guards are watching for you":"through the slag tunnels"}. Below the great hall, a shaft drops into darkness, and from it comes a sound like a thunderstorm trapped in a bottle.</p>`,
choices:()=>[
  ...((F("n_k_free")||0)>=2?[{label:"Signal the chained artificers. Now.", hint:"They rise with you", fx:{n_k6:3}, go:"foundry2"}]:[]),
  ...((F("n_k_res")||0)>=2?[{label:"Light the signal for Marren's resistance.", hint:"The resistance attacks the gates", fx:{n_k6:3}, go:"foundry2"}]:[]),
  ...(F("kWith")==="seren"?[{label:"Seren sets the foundry's coal stores on fire as a distraction.", hint:"Seren", fx:{n_k6:2}, go:"foundry2"}]:[]),
  {label:"Go straight down the shaft.", hint:"Direct", fx:{n_k6:1}, go:"foundry2"}
]},

foundry2:{ title:"Fen", text:()=>{
const ready=fenSk()>=3 && F("trustFen");
return `<p>At the bottom of the shaft is a cavern the size of a cathedral, and in it, half buried in the rock, the Storm Engine: a sphere of black Elder metal three stories high, ringed in copper, with lightning crawling over its skin like ivy.</p>
<p>Quill stands at its controls. And on a gantry above it, Fen and two students, shackled.</p>
${ready
 ? `<p>Then the shift bell rings a second time, and Fen opens his hands. The shackles fall off all three of them at once. He has spent five days listening to the iron until it told him how to let go. He catches the students' hands, slaps his palm on the gantry, and the steel bends into a slide down to your feet.</p><p>${say(`"Told you,"`)} he says, grinning, terrified.</p>`
 : F("overrideFen")
 ? `<p>You went in last night. You got to the gantry before the guards did, and you got Fen's shackles open. But the students were still chained when the alarm went up, and now they are hanging over the Engine.</p>`
 : `<p>The bell rings a second time, and Fen tries something. You can see it in his face. The shackles crack, but they do not open, and one of the students cries out as lightning arcs off the Engine and across the gantry.</p>`}`;},
enter(){ const ready=fenSk()>=3 && F("trustFen"); add({fenFreedSelf:ready, n_k6: ready?4:F("overrideFen")?1:0}); },
choices:()=>F("fenFreedSelf") ? [{label:"Turn to Quill.", go:"foundry3"}] : [
  {label:"Throw everything you have at the gantry and get them down.", hint:"Save the students", fx:{n_k6:2, savedStudents:true}, go:"foundry3"},
  ...(F("kWith")==="li"?[{label:`${LIn()} goes for the students while you hold Quill back.`, hint:LIn(), fx:{n_k6:3, savedStudents:true, liSaved6:true}, go:"foundry3"}]:[]),
  ...(F("kWith")==="wren"?[{label:"Wren goes up the gantry like a shadow.", hint:"Wren", fx:{n_k6:3, savedStudents:true}, go:"foundry3"}]:[])
]},

foundry3:{ title:"The Storm Engine", text:()=>`
<p>${say(`"Too late,"`)} Quill says. He does not sound triumphant. He sounds tired. ${say(`"It is waking. I only needed it to wake. I thought I could hold the reins."`)}</p>
<p>The Engine's skin splits along an Elder seam, and inside is light, white and terrible. The cavern fills with wind. Above you, through the rock, you hear the sky over Kastrel begin to roar.</p>`,
choices:()=>[
  {label:"Slam the seam shut with Artifice, as much of it as you can.", hint:`Craft ${S.stats.craft}`, fx:{n_k6:S.stats.craft>=12?3:2, sealedHalf:true}, go:"foundryEnd"},
  ...(knows("lightning")?[{label:"Ground it. Drive a lightning rod through the floor into the mountain.", hint:"Codex: The Lightning Rod", fx:{n_k6:4, grounded:true}, go:"foundryEnd"}]:[]),
  {label:`Grab Quill and make him help you close it.`, hint:F("quillHeard")?"He might listen":"He won't", fx:{n_k6:F("quillHeard")?3:0, quillHelped:F("quillHeard")}, go:"foundryEnd"},
  {label:"Get everyone out. Let the mountain take it.", hint:"Run", fx:{n_k6:1, ran6:true}, go:"foundryEnd"}
]},

foundryEnd:{ title:"Out of the Mountain", enter(){
  givePage("storm");
  const sc=(F("n_k6")||0)+(F("n_k_trail")||0)+(F("n_k_recon")||0)+(F("royalAid6")?2:0)+Math.floor(S.stats.craft/5);
  S.flags.k6score=sc; S.flags.k6result = sc>=14 ? "freed" : sc>=8 ? "fen" : "costly";
  add(F("k6result")==="freed"?{renown:4, n_popAdd:40, morale:2}:F("k6result")==="fen"?{renown:2, n_popAdd:20}:{renown:1, n_popAdd:10, morale:-1});
}, text:()=>({
freed:`<p>You come up out of the mountain at noon with Fen, both students, and every chained artificer in the foundry, collars broken and left behind on the anvils. The storm overhead is enormous, but it is not getting bigger. The Engine is half shut, half awake, rumbling in its cavern like a sleeper in a bad dream.</p>
  <p>Quill is gone. Nobody saw him leave.</p>
  ${sys("SYSTEM","[The Foundry Freed]<br>40 artificers and their families follow you home")}`,
fen:`<p>You come out with Fen and the students. The chained artificers in the lower foundry, you cannot reach in time: the storm breaks the mountain road, and only half of them make it out behind you.</p>
  <p>Quill is gone. The Engine is half awake.</p>
  ${sys("SYSTEM","[Fen Is Safe]<br>20 artificers follow you home")}`,
costly:`<p>You get Fen out. You get one of the students out. The other, a girl named Ama who once mended a cup without knowing how, does not come back up the shaft with you, and Fen will not speak for the whole first day of the journey home.</p>
  <p>Quill is gone. The Engine is half awake.</p>
  ${sys("SYSTEM","[A Costly Escape]<br>10 artificers follow you home · Morale −1")}`
}[F("k6result")]) + `${sys("ELDER CODEX","[Half Page Restored: THE STORM ENGINE]<br>How it was built. Not how to stop it.")}<p><em>End of Part One: Across the River.</em></p>`,
choices:[{label:"Lead everyone home. Begin Part Two: The Refuge", go:"c6spring"}]},

c6spring:{ title:"The Refuge", enter(){ S.phase="spring"; S.week=1; S.buildsLeft=perWeek(); S.weekReport=null; S.newPage=null; }, text:()=>`
<p>You come home across the river with ${F("k6result")==="freed"?"a column of freed artificers stretching half a mile":"a ragged line of freed artificers"} behind you, and Brackenfold opens its gates without being asked.</p>
<p>Tobin is waiting at the mill. When he sees Fen, he sits down on the step and puts his face in his hands, and stays there for a while.</p>
<p>Over Kastrel, the storm never quite goes away.</p>
${sys("PART TWO",`The Refuge · 6 weeks · two peoples, one town<br>Goal: make Brackenfold a Free City of Artificers`)}`,
choices:[{label:"Plan the first week of spring.", go:"plan"}]},

r6peoples:{ title:"Two Peoples", text:()=>`
<p>The Kastrel artificers do not speak much of the common tongue, and Brackenfold's people have just buried neighbors killed by Kastrel soldiers a year ago. In the first week there is a fight in the market. In the second, a Kastrel smith fixes the town's broken bell, and nobody knows what to say to her.</p>`,
choices:[
  {label:"Put them on the same crews. Make them build together.", hint:"Morale −1 now, more later · Timber +5, Stone +5", fx:{morale:-1, timber:5, stone:5, mixedCrews:true}, go:"nextweek"},
  {label:"Give the Kastrel families their own quarter first, to rest.", hint:"Morale +1", fx:{morale:1}, go:"nextweek"},
  ...(F("ruslan")?[{label:"Ask Ruslan to translate in the square every evening.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"}]:[])
]},

r6fen:{ title:"Fen, After the Mountain", text:()=>F("k6result")==="costly"
? `<p>Fen has not been in his workshop since you came home. You find him at the river where Ama used to sit, mending pebbles and throwing them in.</p><p>${say(`"I thought I was ready,"`)} he says. ${say(`"I thought if I was clever enough, nobody would get hurt."`)}</p>`
: `<p>Fen is different since the mountain. Quieter, sharper. He has started teaching the freed Kastrel artificers' children, and they follow him around the town like ducklings.</p><p>${say(`"Quill asked me to join him,"`)} he tells you one night. ${say(`"Before you came. He said I'd never be more than your apprentice here."`)} He looks at you. ${say(`"Is that true?"`)}</p>`,
choices:()=>F("k6result")==="costly" ? [
  {label:"Sit with him. Tell him about the fifteen names you learned after the siege.", hint:"Fen heals slowly · Fen trusts you", fx:{n_fenBond:2}, go:"nextweek"},
  {label:"Tell him Ama's name will go on the first stone of the Bridge of Two Banks.", hint:"Fen finds purpose", fx:{n_fenBrave:1, amaStone:true}, go:"nextweek"}
] : [
  {label:`"No. You're a master artificer, Fen. Take a mark of your own on the college."`, hint:"Fen becomes a master", fx:{fenMasterArt:true, n_fenBrave:1}, go:"nextweek"},
  {label:`"You'll be whatever you decide to be. Even if it isn't here."`, hint:"Fen trusts you completely", fx:{n_fenBond:2}, go:"nextweek"}
]},

r6wedding:{ title:()=>F("engaged")||F("saidLove")?"A Wedding":"Seren's Wedding", text:()=>{
const li=LIk();
if((F("engaged")||F("saidLove")) && li) return `<p>${F("engaged")?"You do it in spring, because you are both tired of waiting for the world to be safe first.":`${LIn()} asks this time. You say yes before ${LIp("sub")} finishes the question.`} The whole town turns out${has("domeHall")?" under the Elder dome":" in the square"}. Granny Pell complains about the flowers. ${serenAlly()?"Seren stands beside you and does not cry, very loudly.":""} ${F("visitedFather")?"Your father sends a letter he must have dictated, because the hand is not his: <em>Aurel would have loved this.</em>":""}</p>`;
return `<p>${F("serenRefuses")?"Seren refused the Corwin match, scandalously, and is instead marrying a captain of the Valcrest guard who apparently made Seren laugh once in a training yard.":"Seren marries the Corwin heir in Highcrown."} You ride west for it. The great houses watch you walk in the way they once watched you walk out.</p>`;},
choices:()=>{ const li=LIk();
  if((F("engaged")||F("saidLove"))&&li) return [{label:"Dance until the lanterns burn out.", hint:"Married · Morale +3", fx:{married:true, engaged:false, morale:3, ["aff_"+li]:2}, go:"nextweek"},{label:"Slip away together to the top of the watchtower.", hint:"Married · Closeness +3", fx:{married:true, engaged:false, morale:1, ["aff_"+li]:3}, go:"nextweek"}];
  return [
    {label:"Give Seren something you made.", hint:"Resentment −1", fx:{resent:-1}, go:"nextweek"},
    {label:"Dance with every one of them who once called you useless.", hint:"Renown +2", fx:{renown:2}, go:"nextweek"}
  ];}},

r6lesson:{ title:()=>F("marisolLegacy")?"Marisol's Grave":"Wren's Secret", text:()=>F("marisolLegacy")
? `<p>The Kastrel artificers ask where they can find the woman who taught your college to listen to stone. You take them up the hill to Marisol's grave, and they stand there in silence, and then the oldest of them presses his palm to her headstone and the granite blooms with a pattern like frost.</p>`
: `<p>Wren comes to you in the fourth week, and for once does not appear from nowhere. Wren knocks.</p><p>${say(`"I was the Garden's keeper before the empire fell,"`)} Wren says. ${say(`"The Elder builders made keepers for each Wonder. I'm the last one I know of. The Storm Engine's keeper died three hundred years ago. That's why it went wild first."`)}</p>`,
enter(){ add({wrenTruth:true}); },
choices:[
  {label:"Ask what a keeper needs to close a Wonder.", hint:"The finale's key", fx:{keeperLore:true, craft:1}, go:"nextweek"},
  {label:"Just listen.", hint:"Morale +1", fx:{morale:1}, go:"nextweek"}
]},

r6warlord:{ title:"The Warlord Falls", text:()=>`
<p>News from across the river: Kastrel's warlord is dead, killed in his own fortress when lightning struck it six times in one night. ${F("marrenAlly")?"Ambassador Marren's council has taken the capital.":"Nobody knows who rules Kastrel now."} The storm over the mountains is three times as large as it was in spring.</p>`,
choices:[
  ...(F("marrenAlly")?[{label:"Offer Marren's council a treaty: peace, open borders, no collars.", hint:"Peace with Kastrel", fx:{kastrelPeace:true, renown:2}, go:"nextweek"}]:[]),
  {label:"Send masons to help Kastrel's river villages.", hint:"Stone −4 · Renown +2", req:()=>S.stats.stone>=4, fx:{stone:-4, renown:2, helpedKastrel:true}, go:"nextweek"},
  {label:"Close the border until the storm is over.", hint:"Defense +2", fx:{defense:2}, go:"nextweek"}
]},

r6storms:{ title:"Storms That Shouldn't Be", text:()=>`
<p>The last week of spring, it snows in Brackenfold. In the morning, lightning strikes the ${has("lighthouse")?"Elder lighthouse, which takes it harmlessly into the ground":"watchtower and splits it"}. In the afternoon, hailstones the size of fists. At night, the sky over Kastrel turns green.</p>
<p>And in the morning, a single rider under a white flag comes over the river.</p>`,
enter(){ if(!has("lighthouse")) add({defense:-1}); },
choices:[
  {label:"Meet him at the gate with Fen beside you.", hint:"Fen faces him", fx:{n_fenBrave:1}, go:"nextweek"},
  {label:"Meet him with the watch, spears ready.", hint:"Defense +1", fx:{defense:1}, go:"nextweek"},
  {label:"Make him wait in the rain until you finish the day's work.", hint:"Resentment +1", fx:{resent:1}, go:"nextweek"}
]},

quillFlag:{ title:"Under a White Flag", text:()=>`
<div class="compare">
  <figure>${mapSVG({then:"autumn"})}<figcaption>Before the Refuge</figcaption></figure>
  <figure>${mapSVG()}<figcaption>Brackenfold this spring</figcaption></figure>
</div>
<p>Maelor Quill rides through your gate alone, older than he was a season ago, his hair white now, his scarred arms shaking.</p>
<p>${say(`"It's waking,"`)} he says. ${say(`"Whether I want it or not. Whether you want it or not. When it fully wakes, there will be no Kastrel and no Aurendell. Only weather."`)} He looks at you. ${say(`"The Elder builders needed a thousand masons to make it. It will take at least two artificers to stop it. I'm one. I'd like you to be the other."`)}</p>`,
choices:()=>[
  {label:`"Then we stop it. Together. And then you answer for Fen."`, hint:"A dangerous ally", fx:{quill:"ally"}, go:"summary6"},
  {label:`"I'll stop it. You can watch."`, hint:"A rival", fx:{quill:"rival"}, go:"summary6"},
  ...(S.stats.resent>=4?[{label:`"You and I are the same, you said. Maybe you were right."`, hint:"A reflection · Resentment +1", fx:{quill:"kin", resent:1}, go:"summary6"}]:[])
]},

summary6:{ title:"Chapter Eight Complete", text:()=>`
${mapSVG()}
${regionSVG()}
${sys("CHAPTER RESULT",`The foundry: ${({freed:"Every artificer freed",fen:"Fen saved",costly:"A costly escape"})[F("k6result")]}<br>Quill: ${({ally:"A dangerous ally",rival:"A rival",kin:"A reflection"})[F("quill")]}<br>Kastrel: ${F("kastrelPeace")?"At peace":"Uncertain"}<br>Rank: ${tier().name} · Population ${S.pop} · Works ${works()}<br>Heart: ${LIk()?`${LIn()} · ${F("married")?"married":F("engaged")?"engaged":F("romance")?"romance":"close"}`:"No one yet"}<br>Fen: ${F("fenMasterArt")?"Master artificer":"Journeyman"} · Resentment ${S.stats.resent}`)}
<div class="ad">Ad slot (interstitial between chapters)<br>AdMob placement goes here in the Android build</div>
<p>Next, Chapter Nine: <em>The Free City</em>. Maelor Quill is in the cellar under your hall, and the whole city is waiting for you to judge him.</p>`,
choices:[{label:"Continue to Chapter Nine", go:"c65open"},{label:"Start the whole story over", restart:true}]},

/* ============================================================
   CHAPTER SEVEN: THE THOUSAND MASONS
   ============================================================ */
c7open:{ title:"Chapter Ten: The Thousand Masons", enter(){
  if(S.chapter!==7){ S.snap={built:S.built.slice(), counts:{...S.counts}, pop:S.pop}; S.chapter=7; S.phase="open"; S.day=0; S.week=0; S.lastBuilt=null; S.weekReport=null; }
}, text:()=>{
const who=[ "Bren","Oda","Garth","Tamsin", F("fen")&&"Fen", serenAlly()&&"Seren", LIk()&&LIn(), (F("wrenTruth")||F("wren_met"))&&"Wren",
  F("quill")==="ally"&&"Maelor Quill", F("marrenAlly")&&"Ilse Marren", F("vaneAlly")&&"Idris Vane", F("examResult")!=="flight"&&"Archmagister Morrow",
  F("charter")&&"King Aldric's engineers", F("nell")&&"Nell", F("ruslan")&&"Ruslan",
  (F("saelmarPact")||F("tamsinStays")||F("tamsinPromise"))&&"General Tamsin Rook and the Tide Guard of Saelmar"].filter(Boolean);
return `<p>The clouds over Kastrel stop moving with the wind on the first day of summer. They simply stand there, black, a mile high, and turn slowly around a single point across the river, like water going down a drain.</p>
<p>Lightning walks the river. Birds fall silent. Every iron tool in Brackenfold hums faintly when you touch it.</p>
<p>And they come. One by one and then by the hundred, over the Elder road and across the river: ${who.join(", ")}. Masons from Highcrown. Freed smiths from Kastrel. Children from the college who are not children anymore. By the third day there are more builders in the valley than Brackenfold has people.</p>
${F("saelmarPact")?`<p>On the second day, three tall ships in Tide Guard blue sail up the river as far as the viaduct, and Tamsin comes down the gangway in full uniform with two hundred Saelmar sappers behind her. ${say(`"Told you,"`)} she says. ${say(`"Saelmar pays its debts."`)}</p>`:F("tamsinStays")?`<p>Tamsin, who disobeyed the Admiralty to stay, has taken charge of the camps as if she was born to it. She was.</p>`:F("tamsinPromise")?`<p>Tamsin arrives on the third day on a borrowed horse, alone. ${say(`"I came back to make sure you live long enough to keep your promise,"`)} she says.</p>`:""}
${has("tGarden")?`<p>The Garden Quarter feeds them all. Fruit in every tent, every morning, from trees that were thorns two winters ago.</p>`:""}${claims().length>=4?`<p>Wagons come in from every land Brackenfold has claimed, ${claims().map(k=>REGIONS[k].name).slice(0,4).join(", ")}, loaded with timber, stone and bread.</p>`:""}
<p>Aurel's journals had a name for the builders who raised the Wonders together. You had always assumed it was poetry. It was a headcount. <em>The Thousand Masons.</em></p>
${sys("CHAPTER TEN","The Thousand Masons<br>Part One: The Gathering · six days, two works a day<br>The Storm Engine · the final choice of Book One")}`;},
choices:[{label:"Climb onto the hall table and tell them the plan.", go:"c7plan"}]},

c7plan:{ title:"The Plan", enter(){ S.phase="gathering"; S.day=1; S.actsLeft=2; }, text:()=>`
<p>You draw it on the hall floor in chalk, the way Aurel would have. Three works.</p>
<p><b>The Grounding Ring.</b> A ring of Elder concrete and copper around the Engine's mountain, sunk into the bedrock, to drain the storm into the earth. ${knows("lightning")?"The Lightning Rod page shows you how.":"You will have to work it out as you go."}</p>
<p><b>The Cage of Arches.</b> A dome of arches over the Engine itself, to hold it in place while it is closed. ${knows("dome")?"The Dome page is the heart of it.":"Without the Dome page, it will be harder."}</p>
<p><b>The Evacuation.</b> Every village in the river valley on both banks, emptied before the storm breaks.</p>
<p>Six days. Every day you can lead two of those works. The more you put into each, the better your chances. You cannot do everything.</p>`,
choices:[{label:"Begin.", go:"plan"}]},

g7fen:{ title:"Fen", text:()=>`
<p>Fen finds you on the wall on the first night. He is taller than you now, which still surprises you every time.</p>
<p>${say(`"I want to work on the Cage,"`)} he says. ${say(`"At the center. Where it's worst."`)} He holds up his hands before you can argue. ${say(`"I know. I know what you're going to say. The grain's patience. I'm not asking because I'm brave. I'm asking because I'm the best one for it, and you know that too."`)}</p>`,
choices:[
  {label:`"You're right. The center is yours."`, hint:"Fen leads the Cage · the Cage gets stronger", fx:{fenCenter:true, n_g_cage:1, n_fenBrave:1}, go:"nextday"},
  {label:`"No. I promised your father."`, hint:F("fenPromise")?"You did":"Keep him safe", fx:{fenSafe:true}, go:"nextday"},
  {label:`"Then we do the center together."`, hint:"Fen trusts you completely", fx:{fenWithYou:true, n_fenBond:1}, go:"nextday"}
]},

g7seren:{ title:"Seren", text:()=>serenAlly()
? `<p>Seren sits with you by the kiln on the second night, sleeves rolled up, covered in concrete dust like everyone else. ${say(`"Do you remember the font?"`)} Seren asks. ${say(`"When the blade cracked, I thought you'd done it. I thought you'd broken our house."`)} A short laugh. ${say(`"You did. You broke it and built a better one."`)}</p>`
: `<p>A letter from Seren arrives on the second night, carried by a Valcrest rider who rode three horses to death getting it here. It is one line: <em>I am coming. Do not start without me.</em></p>`,
choices:[
  {label:serenAlly()?"Ask Seren to lead the flame crews on the Ring.":"Hold a place on the Ring for Seren.", hint:"Seren's fire hardens the Ring", fx:{n_g_ring:1, serenRing:true, seren:"ally"}, go:"nextday"},
  {label:"Just sit together by the kiln.", hint:"Resentment −1", fx:{resent:-1}, go:"nextday"}
]},

g7edric:{ title:"Father", text:()=>`
<p>On the third night a carriage comes up the Elder road with the Valcrest arms on the door, and your father climbs out of it on his own, slowly, leaning on a cane with the Valcrest crest on the handle. He is thinner than he was. He is also, very obviously, determined not to be helped down the step.</p>
<p>${F("visitedFather")||F("fatherSupport")?`He asks to be taken up onto the wall, where he can see the work, and refuses the chair Bren brings him. ${say(`"I did not want to miss it,"`)} he says. ${say(`"Two hundred years we have been waiting for this. I would like to see it done."`)}`:`He stands at the foot of the wall, leaning on his cane, and for a long moment he cannot find anything to say. ${say(`"I came to see,"`)} he says at last. ${say(`"That is all. I came to see."`)}`}</p>`,
choices:[
  {label:"Sit with him until he sleeps.", hint:"Reconciled · Resentment −2", fx:{resent:-2, fatherReconciled:true}, go:"nextday"},
  {label:"Give him a job: let him read the evacuation rolls aloud.", hint:"The Evacuation gets stronger · Father helps", fx:{n_g_evac:1, fatherReconciled:true}, go:"nextday"},
  {label:"Thank him for coming, and go back to work.", hint:"No time", fx:{}, go:"nextday"}
]},

g7love:{ title:()=>LIk()?LIn():"The Fourth Night", text:()=>{
const li=LIk();
if(!li) return `<p>On the fourth night you climb the watchtower alone and watch the storm wheel over the mountains. Bren climbs up after you, very slowly, with two cups of bark tea. He does not say anything. He does not need to.</p>`;
if(F("married")) return `<p>You find ${LIn()} asleep on a pile of survey maps in the hall at midnight, ${li==="caelan"?"ink on both hands":"lightning-scorched fingertips curled around a pen"}. You wake ${LIp("obj")} gently. ${say(`"Tomorrow,"`)} ${LIp("sub")} says sleepily, ${say(`"I'm coming to the Engine with you. You're not allowed to argue. I married you specifically so you couldn't."`)}</p>`;
return `<p>${LIn()} finds you on the wall. ${say(`"Whatever happens at the Engine,"`)} ${LIp("sub")} says, ${say(`"I want you to know I'd choose this again. All of it. The frontier, the war, the mud. You."`)}</p>`;},
choices:()=>{ const li=LIk(); if(!li) return [{label:"Drink the bark tea.", hint:"Morale +1", fx:{morale:1}, go:"nextday"}];
  return [
    {label:`Ask ${LIn()} to hold the ${li==="caelan"?"river":"storm"} back during the final day.`, hint:`${LIn()} joins the final work`, fx:{liFinal:true, n_g_ring:1}, go:"nextday"},
    {label:`Ask ${LIn()} to lead the evacuation.`, hint:"The Evacuation gets stronger", fx:{liEvac:true, n_g_evac:1}, go:"nextday"},
    {label:"Hold on to each other. Say nothing.", hint:"Closeness +2", fx:{["aff_"+li]:2}, go:"nextday"}
  ];}},

g7quill:{ title:"Maelor Quill", text:()=>`
<p>${F("quill")==="rival"?"Quill has been working on the Ring alone, at the far end, ignoring everyone, and doing it very well.":"Quill has been working beside your crews every day, quietly, in his leather apron."} On the fifth night he comes to your fire.</p>
<p>${say(`"There's something I haven't told you,"`)} he says. ${say(`"The Engine can be closed, or it can be held. Closed, it sleeps for another thousand years. Held, it becomes a weapon in the hands of whoever holds it. Whoever stands at its heart at the end decides which."`)} He looks into the fire. ${say(`"I was going to hold it. I'm still not sure I won't."`)}</p>`,
choices:()=>[
  {label:`"Then stand beside me at the heart, and close it with me."`, hint:"Trust him", fx:{quillTrusted:true, n_g_ring:1}, go:"nextday"},
  {label:`"Then you won't be at the heart. I will."`, hint:"Keep him away from it", fx:{quillAway:true}, go:"nextday"},
  ...(S.stats.resent>=4?[{label:`"Maybe it should be held. By someone who'd never put a collar on anyone."`, hint:"The Storm Crown · Resentment +1", fx:{stormThought:true, resent:1}, go:"nextday"}]:[])
]},

g7aurel:{ title:"The Last Dream", text:()=>`
<p>The last night before the storm breaks, you dream of Aurel for the final time. He is not in a ruined city. He is in Brackenfold, sitting on the wall where you sit, looking out over the valley you built.</p>
<p>${say(`"When I hid the Codex,"`)} he says, ${say(`"I told myself I was waiting for the right person. I was not. I was waiting for the right world. A world where an artificer could stand up in public and not be burned."`)} He looks at the town, the lights, the thousand masons asleep in tents in the fields. ${say(`"You didn't wait for the world. You made it."`)}</p>
<p>${say(`"Whatever you choose tomorrow, I'm proud of you."`)} And he is gone, and the silver mark on your palm is warm.</p>`,
choices:[{label:"Wake. It's time.", fx:{craft:1}, go:"storm1"}]},

storm1:{ title:"The Grounding Ring", enter(){ S.phase="storm7"; }, text:()=>`
<p>The storm breaks at dawn. Wind hard enough to strip roofs. Rain like thrown gravel. Lightning every few seconds, all of it reaching for the mountain across the river, where the Engine is waking.</p>
<p>The Grounding Ring runs around the mountain's foot in a trench of Elder concrete and copper, ${(F("n_g_ring")||0)>=4?"finished, every section tied in":(F("n_g_ring")||0)>=2?"mostly finished, with gaps you will have to close by hand":"barely begun"}. The first lightning strike hits the ring.</p>`,
choices:()=>[
  {label:"Hold the ring together with your own hands.", hint:`Ring work: ${F("n_g_ring")||0}`, fx:{n_fin:Math.min(4,F("n_g_ring")||0)}, go:"storm2"},
  ...(F("serenRing")?[{label:"Signal Seren's flame crews to fuse the gaps.", hint:"Seren", fx:{n_fin:Math.min(4,F("n_g_ring")||0)+2}, go:"storm2"}]:[]),
  ...(F("quillTrusted")?[{label:"Quill takes the far side of the ring.", hint:"Quill", fx:{n_fin:Math.min(4,F("n_g_ring")||0)+2}, go:"storm2"}]:[])
]},

storm2:{ title:"The Cage of Arches", text:()=>`
<p>The ring is drinking lightning. You can feel the storm drain into the earth, the whole mountain humming. But the Engine is fighting it, and the Cage of Arches over its seam is ${(F("n_g_cage")||0)>=4?"complete, a perfect dome of arches standing in the wind":(F("n_g_cage")||0)>=2?"standing, but with its keystones still loose":"only half raised"}.</p>
<p>${(F("n_g_evac")||0)>=3?"Behind you, the valley is empty. Every village on both banks was cleared yesterday.":(F("n_g_evac")||0)>=1?"Behind you, the last carts from the valley villages are still on the road.":"Behind you, the valley villages are still full of people who would not leave."}</p>`,
choices:()=>[
  ...((F("saelmarPact")||F("tamsinStays"))?[{label:"Tamsin's Tide Guard sappers take the keystones on the east face while you take the west.", hint:"General Rook", fx:{n_fin:Math.min(4,F("n_g_cage")||0)+2}, go:"storm3"}]:[]),
  {label:"Climb the Cage and set the keystones yourself.", hint:`Cage work: ${F("n_g_cage")||0}`, fx:{n_fin:Math.min(4,F("n_g_cage")||0)}, go:"storm3"},
  ...(F("fenCenter")||F("fenWithYou")?[{label:F("fenWithYou")?"Set them with Fen, one keystone each.":"Fen is already at the center. Trust him.", hint:fenSk()>=3?"He's ready":"Fen", fx:{n_fin:Math.min(4,F("n_g_cage")||0)+(fenSk()>=3?3:1), fenCage:true}, go:"storm3"}]:[]),
  ...(F("liFinal")?[{label:`${LIn()} ${LIk()==="isolde"?"holds the wind off the Cage":"floods the trench to wake the lime"} while you work.`, hint:LIn(), fx:{n_fin:Math.min(4,F("n_g_cage")||0)+2}, go:"storm3"}]:[])
]},

storm3:{ title:"The Heart of the Storm", enter(){
  const sc=(F("n_fin")||0)+Math.min(3,F("n_g_evac")||0)+Math.floor(S.stats.craft/5)+(knows("dome")?2:0)+(knows("lightning")?2:0)+(knows("storm")?1:0)+(F("keeperLore")?2:0)+(tier().lvl>=5?2:0);
  S.flags.finalScore=sc; S.flags.finalOK = sc>=16;
}, text:()=>`
<p>You walk into the Cage of Arches alone${F("quillTrusted")?", with Quill one step behind you":""}${F("fenWithYou")?", with Fen at your shoulder":""}. At the center, the Engine's seam is open a hand's width, and inside it is the storm, all of it, every lightning bolt of the last year, coiled and waiting.</p>
<p>${F("finalOK")?"The ring is holding. The cage is holding. You can feel the Engine's whole structure under your palms now, as clearly as you once felt a cracked axle on the eastern road.":"The ring is failing. The cage is shaking. Whatever you do, you have to do it now."}</p>
<p>Quill was right. Whoever stands here decides.</p>`,
choices:()=>[
  {label:"Close the Engine and heal it, the way you healed the Garden.", hint:F("finalOK")&&S.stats.resent<=4?"The Builder":"You may not have enough", req:()=>F("finalOK")&&S.stats.resent<=4, fx:{ending:"builder"}, go:"endBuilder"},
  {label:"Close the Engine and give its key to the crown, on your terms.", hint:F("fatherReconciled")||F("charter")==="royal"?"The Heir":"Needs your father or a royal charter", req:()=>F("finalOK")&&(F("fatherReconciled")||F("charter")==="royal"), fx:{ending:"heir"}, go:"endHeir"},
  {label:"Hold the Engine. Take the storm for yourself.", hint:S.stats.resent>=4||F("quill")==="kin"?"The Storm Crown":"Something in you refuses", req:()=>S.stats.resent>=4||F("quill")==="kin"||F("stormThought"), fx:{ending:"storm"}, go:"endStorm"},
  ...(F("wrenOffer")?[{label:"Let Wren go inside, as Wren asked.", hint:"The Keeper's Gift", req:()=>F("finalOK"), fx:{ending:"keeper"}, go:"endKeeper"}]:[]),
  {label:"Step into the seam and close it from the inside.", hint:"The Last Mason", fx:{ending:"last"}, go:"endLast"}
]},

endBuilder:{ title:"The Builder", text:()=>`
<p>You lay your hands on the seam and you do not fight the storm. You listen to it, the way Marisol taught Fen and Fen taught you. Under all that rage is a machine that was built to bring rain to dry valleys and calm the sea for fishing boats, and has been alone for a thousand years.</p>
<p>You close it gently. The seam draws shut. The light inside dims to something like a banked fire. And above the mountain, for the first time in a year, the clouds begin to move with the wind.</p>
<p>When you walk out of the Cage, it is raining softly on the valley, ordinary summer rain, and the thousand masons are standing in it in their thousands, faces turned up, not cheering, just feeling it.</p>
${sys("ENDING","[THE BUILDER]<br>The Storm Engine sleeps, healed · Brackenfold becomes the Free City of Artificers")}`,
choices:[{label:"Go home.", go:"c7epilogue"}]},

endHeir:{ title:"The Heir", text:()=>`
<p>You close the Engine, and in the closing you shape a key: a small bar of Elder metal that fits the seam and nothing else. Whoever holds it can wake the storm. Whoever holds it can keep it sleeping forever.</p>
<p>You walk out of the Cage and up the Elder road to the wall, where your father stands leaning on his cane, watching, and the king's banner flies over the camp. You give the key to neither of them. You give it to the king's council, the new one, with a seat for Brackenfold, a seat for Kastrel's free artificers, and a seat for the Spire, on one condition: that it is never used.</p>
<p>${say(`"House Valcrest,"`)} your father says, very quietly, ${say(`"has finally built something."`)}</p>
${sys("ENDING","[THE HEIR]<br>The Engine sleeps under the council's key · you take a seat at the king's council and begin to reform the Spire from inside")}`,
choices:[{label:"Go home.", go:"c7epilogue"}]},

endStorm:{ title:"The Storm Crown", text:()=>`
<p>You do not close it. You put your hands on the seam and you <em>hold</em>, and the storm, which has been looking for a master for a thousand years, finds one.</p>
<p>It goes through you like cold fire. When you open your eyes, you can feel every cloud from the mountains to the sea, the way you once felt the grain of a cracked axle. You could bring rain to every field in Aurendell. You could bring lightning down on every great house that ever sent an artificer away.</p>
<p>You walk out of the Cage, and above you the storm turns slowly, gently, following your steps. ${F("quillTrusted")||F("quill")==="kin"?"Quill kneels.":"Nobody says a word."} In Highcrown, a week later, the great houses learn to say your name very carefully.</p>
${sys("ENDING","[THE STORM CROWN]<br>The Engine answers to you · no collar will ever be put on an artificer again, because no one dares")}`,
choices:[{label:"Go home.", go:"c7epilogue"}]},

endLast:{ title:"The Last Mason", text:()=>`
<p>The seam will not close from outside. You knew it would not. Wren told you once, about keepers, and you did not want to understand. A Keystone can close a Wonder. Something has to stay inside to keep it closed.</p>
<p>${F("fenWithYou")||F("fenCenter")?`You turn to Fen. You put Aurel's silver mark against his palm, and it moves, as easily as water, from your hand into his. ${say(`"The Codex is yours,"`)} you tell him. ${say(`"Build them something better than I did."`)}`:`You take off your coat and fold it on the Cage floor, and in the pocket you leave a letter for Fen, and the silver mark, which slides off your palm onto the paper like a drop of mercury.`}</p>
<p>Then you step into the light, and lay your hands on the seam from the inside, and close it.</p>
<p>The storm stops. All of it, at once. Across the valley, a thousand masons look up at a clear blue sky.</p>
${sys("ENDING","[THE LAST MASON]<br>The Engine sleeps, and you sleep with it, its new keeper · Fen inherits the Codex")}`,
choices:[{label:"Afterward.", go:"c7epilogue"}]},

c7epilogue:{ title:"Epilogue: The Long Summer", enter(){ S.phase="summer"; S.week=1; S.buildsLeft=perWeek(); S.weekReport=null; S.newPage=null; }, text:()=>`
<p>${F("ending")==="last"?`Brackenfold goes on without you, because that is what you built it to do. Fen takes your seat in the hall. He does not take your chair; he builds a new one.`:`Summer comes back to the valley, the real kind. The thousand masons go home a few at a time, and Brackenfold is quieter than it has been in a year.`}</p>
${sys("EPILOGUE",`Three weeks · build what's left · the guild keeps working<br>Then the end of Book One`)}`,
choices:[{label:"Plan the first week.", go:"plan"}]},

e7weddings:{ title:"Weddings and Homecomings", text:()=>`
<p>${F("married")?`You and ${LIn()} celebrate your first anniversary in the square, and half the town claims to have arranged the match.`:LIk()&&F("romance")?`${LIn()} asks you to marry ${LIp("obj")} under the Cage of Arches, with the storm sleeping below.`:"Two of the Kastrel smiths marry two of Garth's lumber crew, on the same day, in the same ceremony, which Granny Pell calls disgraceful and attends in her best hat."}</p>
<p>${F("fatherReconciled")?`Your father does not go back to Highcrown. He hands the running of House Valcrest to Seren, takes the room in the manor with the window onto the hills, and spends his mornings walking the Elder road with his cane and his afternoons in the college, asking the students to explain arches to him slowly. ${say(`"I have spent sixty years being useful,"`)} he tells you. ${say(`"I would like to spend a few being curious."`)}`:`A letter comes from Highcrown in your father's own hand, steadier than it has been all year. He is recovering. He has handed House Valcrest to Seren. And he asks, in two careful lines, whether there might be a room for an old man in Brackenfold, if you would have him.`}</p>`,
choices:()=>[
  ...(LIk()&&F("romance")&&!F("married")?[{label:"Say yes.", hint:"Married", fx:{married:true, morale:3}, go:"nextweek"}]:[]),
  ...(!F("fatherReconciled")?[{label:"Write back: there is always a room for you here.", hint:"Father moves to Brackenfold · Resentment −1", fx:{fatherReconciled:true, resent:-1}, go:"nextweek"}]:[{label:"Give him a workbench in the college.", hint:"Morale +1 · he will be insufferable about it", fx:{morale:1}, go:"nextweek"}]),
  {label:"Carve a new stone for the memorial wall.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"},
  {label:"Plant something in the Garden's orchard.", hint:"Resentment −1", fx:{resent:-1}, go:"nextweek"}
]},

e7leaving:{ title:"The First to Leave", text:()=>`
<p>The first class of Brackenfold-trained artificers leaves at the end of the second week: forty of them, heading for towns all over Aurendell and Kastrel that have written asking for a builder.</p>
<p>${F("nell")?"Nell is one of them. She is going home, to the town that sent her to the Spire, to build its first school.":"One of them is a girl from the lower city of Highcrown, going home to build a school."} You walk them as far as the ${has("viaduct")?"viaduct":"bridge"}, and watch them go.</p>`,
choices:[
  {label:"Give each of them a page from the Codex, copied in your own hand.", hint:"The Codex spreads · Renown +2", fx:{codexShared:true, renown:2}, go:"nextweek"},
  {label:"Give each of them a mason's mark of their own.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"}
]},

e7map:{ title:"The Map of Wonders", text:()=>`
<p>On the last night of summer, you unroll the Map of Wonders on the hall floor. Seven marks. The Garden: healed${F("thornFate")==="tamed"?"":", or as good as"}. The Storm Engine: sleeping. ${F("tamsinGeneral")?"The Tide Gate, far to the south, in Saelmar: waking. ":""}${F("tamsinGeneral")?"Four":"Five"} more, scattered across the continent, in countries you have never seen, waking or sleeping, tended or wild, nobody knows.</p>
<p>${F("ending")==="last"?"Fen":"You"} looks at the map for a long time.</p>`,
choices:()=>[
  {label:"Mark the next Wonder you mean to find.", hint:"Book Two awaits", fx:{nextWonder:true}, go:"nextweek"},
  ...(F("tamsinGeneral")?[{label:"Ask Tamsin to point to her home.", hint:"Saelmar", fx:{tamsinPoints:true}, go:"tamsinMap"}]:[]),
  {label:"Roll it up. Tomorrow.", hint:"Morale +1", fx:{morale:1}, go:"nextweek"}
]},

secondCodex:{ title:"The Stranger at the Gate", text:()=>`
<div class="compare">
  <figure>${mapSVG({then:true})}<figcaption>Brackenfold, the day you arrived</figcaption></figure>
  <figure>${mapSVG()}<figcaption>Brackenfold, the end of Book One</figcaption></figure>
</div>
<p>On the first morning of autumn, more than five years since you rode in through a gate with more gaps than posts, Oda calls ${F("ending")==="last"?"Fen":"you"} up to the tower.</p>
<p>A stranger is standing on the Elder road. Young, travel-worn, in clothes from a country nobody in Brackenfold recognizes. In both arms, wrapped in oilcloth, the stranger carries a book.</p>
<p>When you open it, it is a Codex. The same Elder script. The same careful drawings of arches and domes and kilns.</p>
<p>But it is written in a different hand.</p>
${F("tamsinGeneral")?`<p>Tamsin, standing behind you, makes a small sound. ${say(`"That's Saelmar script,"`)} she says. ${say(`"Old Saelmar. Nobody has written like that in five hundred years."`)} She looks at the stranger, and then at you. ${say(`"I think the Tide Gate has a keeper too."`)}</p>`:""}
<p><em>End of Book One.</em></p>`,
choices:[{label:"See your final results", go:"summary7"}]},

summary7:{ title:"Book One Complete", text:()=>`
<div class="chron"><h3>Bren's Chronicle</h3><p class="chron-sub">From the ledger of Bren, elder of Brackenfold, written the night the storm ended</p><ol>${chronicle().map(l=>`<li>${l}</li>`).join("")}</ol><p class="chron-sign">${F("ending")==="last"?"I will keep writing in this ledger. Somebody has to.":"Not bad. Not bad at all. You missed a spot."}</p></div>
${regionSVG()}
${sys("THE END OF BOOK ONE",`Ending: ${({builder:"The Builder",heir:"The Heir",storm:"The Storm Crown",last:"The Last Mason",keeper:"The Keeper's Gift"})[F("ending")]}<br>Brackenfold: ${tier().name} · Population ${S.pop} · Works ${works()}<br>Lands: ${claims().length} claimed<br>Heart: ${LIk()?`${LIn()} · ${F("married")?"married":F("romance")?"together":"a close friend"}`:"Brackenfold itself"}<br>Fen: ${F("ending")==="last"?"Keeper of the Codex":F("fenMasterArt")?"Master artificer":"Journeyman"}<br>Lord Edric: ${F("fatherReconciled")?"Living in Brackenfold":"Recovering in Highcrown"}<br>Tamsin: ${F("tamsinGeneral")?`General of the Tide Guard of Saelmar${F("saelmarPact")?" · allied":F("tamsinPromise")?" · waiting on your promise":""}`:"A trader with secrets"}<br>Codex pages: ${S.codex.length} of ${codexTotal()}<br>Craft rank ${rank()} · Resentment ${S.stats.resent}`)}
<div class="ad">Ad slot (end of book)<br>AdMob placement goes here in the Android build</div>
<p>Thank you for playing <em>Forged in Exile</em>, Book One. Your choices across all seven chapters shaped which ending you reached. Play again to find the other three.</p>`,
choices:[{label:"Start the story over", restart:true}]},

/* ===================== TAMSIN'S SECRET ===================== */
tamsin2:{ title:"Snowed In", text:()=>`
<p>The great snow traps Tamsin's wagons in Brackenfold for a week. She spends it in the hall by the fire, doing her accounts, and you notice two things you had never noticed before.</p>
<p>The first is that she keeps her ledgers in a cipher. The second is that when the children ask her to tell a story, she tells one about a sea wall taller than a mountain, in a country across the southern sea, and she tells it like someone who has stood on top of it.</p>`,
choices:[
  {label:`Ask her where she's really from.`, hint:"She'll deflect", fx:{tamsinAsked:true}, go:"tamsin2b"},
  {label:"Say nothing. Everyone in Brackenfold is allowed a past.", hint:"Tamsin's trust", fx:{tamsinTrust:1}, go:"nextweek"}
]},
tamsin2b:{ title:"Snowed In", text:()=>`
<p>${say(`"South,"`)} Tamsin says, without looking up from the cipher. ${say(`"Very far south. Where the salt comes from."`)} She closes the ledger. ${say(`"Ask me again in a few years, little ${P("lord").toLowerCase()}. I might even tell you."`)}</p>`,
choices:[{label:"Let it go, for now.", go:"nextweek"}]},

tamsin3:{ title:"Tamsin in Highcrown", text:()=>`
<p>Spring, and the roads open. Tamsin's wagons are the first up the Elder road, as always. She brings news from the capital and a bolt of good wool for the school.</p>
<p>${LIk()==="isolde"?`She also brings a letter from Isolde, who adds a postscript you read three times: ${say(`"Your trader friend has a royal pass with a forged seal. A very good forgery. I'd love to know who made it."`)}`:`She also mentions, very casually, that she had dinner with the captain of the palace guard. When you ask how a salt trader knows the captain of the palace guard, she says ${say(`"Salt,"`)} and changes the subject.`}</p>`,
choices:[
  {label:"Buy everything on her wagons.", hint:"Coin −3 · Timber +4, Stone +4", req:()=>S.stats.coin>=3, fx:{coin:-3, timber:4, stone:4}, go:"nextweek"},
  {label:`"Tamsin. Who are you, really?"`, hint:"Not yet", fx:{tamsinAsked:true}, go:"nextweek"},
  {label:"Thank her for always coming back.", hint:"Tamsin's trust", fx:{tamsinTrust:1}, go:"nextweek"}
]},

tamsin4:{ title:"The Trader Who Gave Orders", text:()=>`
<p>You finally hear the full story of the siege from Oda, and one part of it does not fit. When the river wall cracked on the last night, it was Tamsin who held the refugees in the hall together: sorted them by trade, sent the strong ones to the buckets and the old ones to the cellars, and stood in the doorway giving orders in a voice nobody thought to disobey.</p>
<p>${say(`"She's done that before,"`)} Oda says flatly. ${say(`"A lot. That wasn't a trader. That was an officer."`)}</p>
<p>When you find Tamsin at her wagons, there is an old scar showing above her collar that she usually keeps covered, and she salutes you before she can stop herself. Not a Valcrest salute. Not one from Aurendell at all.</p>`,
choices:[
  {label:`"That's twice now. I'd like the truth before there's a third time."`, hint:"Press her", fx:{tamsinPressed:true}, go:"nextweek"},
  {label:"Pretend you didn't see it.", hint:"Tamsin's trust", fx:{tamsinTrust:1}, go:"nextweek"}
]},

tamsinReveal:{ title:"General Rook", enter(){ add({tamsinGeneral:true}); }, text:()=>`
<p>Tamsin comes to the manor late one night in the third week of winter, without her wagons, in a dark blue coat you have never seen, with silver at the collar. She sits down across from you and puts a sealed letter on the table between you.</p>
<p>${say(`"You found the Map of Wonders,"`)} she says. ${say(`"Word travels. So I'm going to tell you the truth before somebody else does."`)}</p>
<p>${say(`"My name really is Tamsin Rook. I really do sell salt. I'm also a general of the Tide Guard of Saelmar, across the southern sea. Six years ago our Wonder, the Tide Gate, began to wake. A sea wall a mile long and taller than your Spire, built by the Elder masons to hold back the ocean. It has started moving on its own. Two of our harbor towns are gone."`)}</p>
<p>${say(`"The Admiralty sent officers north, dressed as traders, to find out whether anything else was waking, and whether anyone alive could still build like the Elder masons. My wagon really did break on that road. I really didn't know who you were."`)} She looks at you. ${say(`"I did by the time you fixed it."`)}</p>`,
choices:[
  {label:`"You lied to me for years."`, hint:"Resentment +1 · She'll accept it", fx:{resent:1, tamsinHurt:true}, go:"tamsinReveal2"},
  {label:`"You've been protecting this town since the day you got here. I know that."`, hint:"Tamsin becomes a true ally", fx:{tamsinAlly:true, tamsinTrust:2}, go:"tamsinReveal2"},
  {label:`"What does Saelmar want from me?"`, hint:"The truth", fx:{tamsinAlly:true, saelmarLore:true}, go:"tamsinReveal2"}
]},
tamsinReveal2:{ title:"General Rook", text:()=>`
