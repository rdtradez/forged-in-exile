   crown:`${say(`"Maelor Quill, you will go to Highcrown, to the king's justice."`)} The king's riders take him that afternoon. He looks back at the town only once.`,
   pardon:`${say(`"Maelor Quill, you are pardoned."`)} The hall goes dead silent. Tobin stands up and walks out without a word. Quill stares at you. ${say(`"Why?"`)} he asks. You do not have an answer you could say out loud.`})[F("verdict")]}</p>
<p>${({united:"When you step out of the hall, the square is quiet, and then it is not. People are nodding, clasping hands. Tobin catches your eye across the crowd and nods once. Brackenfold has passed its first judgment and come out of it whole.",
     accepted:"The square is divided, but it holds. Some cheer, some do not. Tobin goes home without speaking to anyone. By evening the lanterns are lit again.",
     divided:"The square is loud and angry. There are shouts, and a fight near the fountains that Oda breaks up. It will be weeks before the town stops arguing about this."})[F("trialResult")]}</p>
${F("oldRingExposed")?`<p>Within the month, three magisters of the Old Ring are expelled from the Spire. Archmagister Morrow writes to thank you.</p>`:""}
<p><em>End of Part One: The Charter Days.</em></p>`,
choices:[{label:"Begin Part Two: The Long Summer", go:"c65summer"}]},

c65summer:{ title:"The Long Summer", enter(){ S.phase="summer"; S.week=1; S.buildsLeft=perWeek(); S.weekReport=null; S.newPage=null; }, text:()=>`
<p>Brackenfold's first summer as a ${F("charter")==="free"?"free city":"chartered city"}. The storm over Kastrel is still there on the horizon, but for now the days are long and the river is warm and the city is very, very busy.</p>
${sys("PART TWO",`The Long Summer · 6 weeks<br>The last summer before the storm · grow toward the Elder City`)}`,
choices:[{label:"Plan the first week of summer.", go:"plan"}]},

fs1:{ title:"A House of Your Own", text:()=>`
<p>Bren raises it at the council, very formally, as item eleven on a list of twelve. ${say(`"The first citizen of Brackenfold,"`)} he reads, ${say(`"has been living in a manor that is mostly offices, a workshop, and a room for visiting lords. The council would like the first citizen to build a house. For living in."`)}</p>
<p>Everyone looks at you. Granny Pell, from the back: ${say(`"With a proper kitchen."`)}</p>`,
choices:[
  {label:"Agree. Somewhere on the hill, with a view of the valley.", hint:"Unlocks: a house of your own", fx:{houseHill:true}, go:"nextweek"},
  {label:"Agree. Inside the Garden Quarter, where it's always warm.", hint:"Unlocks: a house of your own", req:()=>has("tGarden"), fx:{houseGarden:true}, go:"nextweek"},
  {label:`"After the storm."`, hint:"Morale −1 · the council will ask again", fx:{morale:-1}, go:"nextweek"}
]},

fs2:{ title:"Seren's News", text:()=>`
<p>A letter from Seren, in handwriting so excited it is barely legible. ${F("serenRefuses")||F("seren")!=="ally"?"Seren and the captain of the guard":"Seren and the Corwin heir"} are expecting a child in the winter. ${say(`"Father has not stopped smiling for a week,"`)} Seren writes. ${say(`"It is deeply unsettling. He has started knitting. He is very bad at it."`)}</p>
<p>${say(`"He asks, every single day, whether you will be next. I have told him to ask you himself. Consider yourself warned."`)}</p>`,
choices:[
  {label:"Write back with a cradle design, carved in your own hand.", hint:"Resentment −1 · a gift from the Keystone", fx:{resent:-1, cradleGift:true}, go:"nextweek"},
  {label:"Ride to Highcrown to see them.", hint:"Morale +1 · Father is overjoyed", fx:{morale:1, fatherReconciled:true}, go:"nextweek"},
  {label:"Write back: tell Father I'm thinking about it.", hint:"He will frame the letter", fx:{fatherHint:true}, go:"nextweek"}
]},

fs3:{ title:"The First One Born Here", text:()=>`
<p>A child is born in the Garden Quarter${has("tGarden")?"":", or what the children call the Garden Quarter, which is the warm lane behind the bathhouse"}, to one of the Kastrel smiths and a Brackenfold mason. Her name is Aurelie. When she is three days old, the midwife puts her tiny hand on the cradle rail, and the cracked rail heals under her palm.</p>
<p>The first artificer born in Brackenfold. The whole town comes to look at her.</p>`,
choices:[
  {label:"Carve her name on the first stone of the new nursery school.", hint:"Morale +2", fx:{morale:2, aurelie:true}, go:"nextweek"},
  {label:"Promise her parents she will never have to hide it.", hint:"Morale +1, Renown +1", fx:{morale:1, renown:1, aurelie:true}, go:"nextweek"}
]},

fs4:{ title:"Master Fen", text:()=>`
<p>${F("fenMasterArt")?"Fen has been a master artificer for a year now.":"The college council votes, without telling you, to raise Fen to master artificer."} This summer he takes his first apprentice of his own: a skinny Kastrel boy of thirteen named Teo, who follows him everywhere and asks a question every eleven seconds.</p>
<p>${say(`"Was I like that?"`)} Fen asks you, exhausted, one evening.</p>
<p>${say(`"Worse."`)}</p>`,
choices:[
  {label:`"And look how you turned out."`, hint:"Fen trusts you completely", fx:{fenMasterArt:true, n_fenBond:1}, go:"nextweek"},
  {label:"Give Fen and Teo their own workshop.", hint:"Craft +1 · Fen becomes a master", fx:{fenMasterArt:true, craft:1}, go:"nextweek"}
]},

fs5:{ title:()=>LIk()&&(F("romance")||F("married"))?LIn():"The Long Evening", text:()=>{
const li=LIk();
if(li && F("married")) return `<p>On the longest evening of the summer, you and ${LIn()} climb onto the roof of ${has("yourHouse")?"your new house":"the manor"} with a blanket and watch the sky go purple over the valley. ${F("familyPlan")?`${LIp("sub")} has started keeping a list of names. It is very long. You are not allowed to see it.`:""}</p>`;
if(li && F("romance")) return `<p>On the longest evening of the summer, ${LIn()} takes your hand on the watchtower. ${say(`"I keep waiting for the right time to ask you this,"`)} ${LIp("sub")} says. ${say(`"And I keep realizing there isn't going to be one. There's going to be a storm, and then something else, and then something after that. So."`)} ${LIp("sub")} takes a breath. ${say(`"Marry me. Before the storm. I don't want to face it as anything less than yours."`)}</p>`;
return `<p>On the longest evening of the summer, Bren, Oda, Garth and Granny Pell drag you up to the watchtower with a basket of bread and a jug of cider, and refuse to discuss anything at all to do with work.</p>`;},
choices:()=>{ const li=LIk();
  if(li && F("married")) return [{label:"Ask to see the list.", hint:"Closeness +1", fx:{["aff_"+li]:1, familyPlan:true}, go:"nextweek"},{label:"Fall asleep on the roof together.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"}];
  if(li && F("romance")) return [{label:"Yes.", hint:"Married before the storm", fx:{married:true, engaged:false, ["aff_"+li]:3, morale:3}, go:"nextweek"},{label:`"Yes. After the storm, in the Garden."`, hint:"Engaged", fx:{engaged:true, ["aff_"+li]:2}, go:"nextweek"}];
  return [{label:"Drink the cider.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"},{label:"Tell them all how much they matter.", hint:"Morale +3 · Bren cries", fx:{morale:3}, go:"nextweek"}];
}},

fs6:{ title:"Lightning on a Clear Day", text:()=>`
<p>In the last week of summer, lightning strikes the ${has("lighthouse")?"Elder lightning tower":"watchtower"} at noon, out of a perfectly blue sky. Then again. Then a third time.</p>
<p>Across the river, the dark smudge over the mountains has become a wall of cloud, and it is turning, very slowly, around a single point.</p>`,
choices:[
  {label:"Send riders to every ally you have. Tell them to come.", hint:"The finale's gathering grows", fx:{sentRiders:true, renown:1}, go:"nextweek"},
  {label:"Start stockpiling copper and lime.", hint:"Stone +6", fx:{stone:6}, go:"nextweek"},
  {label:"Spend the evening with everyone you love.", hint:"Morale +2", fx:{morale:2}, go:"nextweek"}
]},

stormSigns:{ title:"The Last Quiet Evening", text:()=>`
<div class="compare">
  <figure>${mapSVG({then:"autumn"})}<figcaption>Before the charter</figcaption></figure>
  <figure>${mapSVG()}<figcaption>The Free City, end of summer</figcaption></figure>
</div>
<p>On the last evening of summer, everyone ends up on the wall without planning to. ${F("fatherReconciled")?"Your father, leaning on his cane, telling Fen's apprentice a story about the font that you do not remember happening that way.":"Bren and Oda, arguing about the watch rota."} ${LIk()&&(F("married")||F("engaged"))?`${LIn()}, ${LIp("pos")} hand in yours.`:""} Fen and Teo, throwing pebbles at the river. ${F("tamsinNear")?"Tamsin, in her admiral's coat, pretending not to be cold.":""}</p>
<p>Over Kastrel, the clouds have stopped moving with the wind.</p>`,
choices:[
  {label:"Remember this.", go:"summary65"},
  {label:"Say a few words to all of them.", hint:"Morale +1", fx:{morale:1}, go:"summary65"}
]},

summary65:{ title:"Chapter Nine Complete", text:()=>`
${mapSVG()}
${regionSVG()}
${sys("CHAPTER RESULT",`Verdict: ${({rebuild:"Quill rebuilds Kastrel",exile:"Quill exiled",crown:"Quill sent to the crown",pardon:"Quill pardoned"})[F("verdict")]} · the city ${({united:"stands united",accepted:"accepts it",divided:"is divided"})[F("trialResult")]}<br>Rank: ${tier().name} · Population ${S.pop} · Works ${works()}<br>Heart: ${LIk()?`${LIn()} · ${F("married")?"married":F("engaged")?"engaged":F("romance")?"together":"a close friend"}${F("familyPlan")?" · planning a family":F("familyHope")?" · dreaming of a family":""}`:"No one yet"}<br>Fen: ${F("fenMasterArt")?"Master artificer, with an apprentice of his own":"Journeyman"}<br>Lord Edric: ${F("fatherReconciled")?"Reconciled, and waiting for grandchildren":"Distant, but softening"}`)}
<div class="ad">Ad slot (interstitial between chapters)<br>AdMob placement goes here in the Android build</div>
<p>Next, the final chapter of Book One: <em>The Thousand Masons</em>. The Storm Engine is waking, and everyone you have ever won over is coming to Brackenfold.</p>`,
choices:[{label:"Continue to Chapter Ten", go:"c7open"},{label:"Start the whole story over", restart:true}]},

c2replay:{ title:"Replay", enter(){ /* simple replay: keeps Chapter One results */ }, text:()=>`<p>Replaying a single chapter needs a chapter one save checkpoint, which the Android version will keep automatically. For now, start over to try different paths.</p>`,
choices:[{label:"Start the whole story over", restart:true},{label:"Back to results", go:"summary2"}]}
};

/* ------------------------- ENGINE ------------------------- */
const view=document.getElementById("view");
const val = v => typeof v==="function" ? v() : v;
const rank = () => ["F","E","D","C"][Math.min(3,Math.floor((S.stats.craft-1)/2))];

function render(){
  if(S.scene==="create") return renderCreate();
  const sc=SCENES[S.scene];
  const choices=val(sc.choices).filter(c=>!(c.hide&&c.hide()));
  const body=sc.text();
  view.innerHTML=`<div class="story fade">

/* one function builds a project, whether you chose it or the guild did */
function buildProject(id, guild){
  const pr=PROJECTS[id];
  const cost=costOf(id, guild);
  if(F("surgeNext") && !guild){ S.flags.surgeNext=false; S.surgeMsg=sys("KEYSTONE SURGE",`[${pr.name}]<br>Raised without a single stone from the stores.<br>Every artificer in Brackenfold felt it.`); }
  for(const k in cost) S.stats[k]-=cost[k];
  add(pr.fx);
  if(pr.repeat){ S.counts[id]=(S.counts[id]||0)+1; if(!has(id)) S.built.push(id); } else S.built.push(id);
  S.lastBuilt=id;
  if(!pr.noRank){
    S.done++; add({renown:1});
    if([2,4,9,14,20,28].includes(S.done)){ add({craft:1}); S.rankMsg=sys("SYSTEM",`[Artifice Growing]<br>Craft +1 · Rank ${rank()}`); }
  }
}
/* projects that are unlocked, not yet built, and affordable right now */
function buildable(){
  return ORDER.filter(id=>{ const pr=PROJECTS[id];
    if(pr.summer&&!(isSeason()||S.chapter>=2)) return false; if(pr.ch&&S.chapter<pr.ch) return false;
    if(pr.repeat ? (S.counts[id]||0)>=(val(pr.max)||99) : has(id)) return false;
    if(pr.fate && F("thornFate")!==pr.fate) return false;
    return (!pr.req||pr.req()) && canPay(costOf(id)); });
}
/* ======================= BUILDING IMPROVEMENTS =======================
   Every finished building can be improved up to three times.
   The builders' guild does this when there is nothing new to build. */
const UPG_CAT = {
  food:["mill","fields","terraces","granary","orchards","greenhouse","conservatory","smokehouse","tideMill","saltStore","meadowFarms","marrowMill","cistern"],
  prod:["camp","quarry","sawmill","crane","stoneYards","forge","sharedFoundry","kiln","woodHamlet","bluffRow","sawTown","smithy"],
  coin:["market","fair","glassworks","inn","arcade","assay","harbor","waystation","marketHall","seaLocks","hollinMarket","eastWharf","vineyards","road"],
  defense:["wall","gate","tower","ditch","concrete","wallTowers","barbican","bastions","casemates","boom","watch","barracks","floodGates","freeGates","signal","firebreak"],
  civic:["hall","school","baths","theater","fountains","square","library","college","infirmary","clocktower","domeHall","bellTower","nursery","courthouse","manor","observatory","archivePub"],
  house:["homes","cottages","refugeeQ","refugeQuarter","gardenQuarter","sailorsQuarter","yourHouse"]
};
const UPG_OF = Object.fromEntries(Object.entries(UPG_CAT).flatMap(([cat,ids])=>ids.map(id=>[id,cat])));
const lvl = id => (S.levels||{})[id]||0;
const upgSum = cat => UPG_CAT[cat].reduce((t,id)=>t+(has(id)?lvl(id):0),0);
function upgCost(id){
  const L=lvl(id), cat=UPG_OF[id];
  const c = cat==="food" ? {timber:2+L, stone:1+L*2}
          : cat==="coin" ? {stone:2+L*2, coin:1+L}
          : cat==="civic"? {timber:2+L*2, coin:1+L}
          : {timber:2+L*2, stone:2+L*2};
  if(S.mode==="builder") for(const k in c) c[k]+=1;
  return c;
}
const UPG_WORD = ["","improved","fine","masterwork"];
function upgradeBuilding(id, free){
  if(!S.levels) S.levels={};
  if(!free){ const c=upgCost(id); for(const k in c) S.stats[k]-=c[k]; }
  S.levels[id]=lvl(id)+1;
  const cat=UPG_OF[id];
  if(cat==="defense") add({defense:1});
  if(cat==="civic") add({morale:1});
  return `${PROJECTS[id].name.replace(/^(Build|Rebuild|Raise|Open|Found|Pour|Dig|Cut|Fire|Fix|Patch|Repair|Drain|Plant|Lay|Pave|Hold|Drill|Set|Expand|Heat|Copy|Roof|Upgrade|Carve|Give|Annex|Claim|Settle|Terrace|Bring|Resettle|Mount|Forge|Raise) (a |an |the )?/,"")} → ${UPG_WORD[lvl(id)]}`;
}
function upgradable(){ return Object.keys(UPG_OF).filter(id=>has(id) && lvl(id)<3); }
const costTotal = c => Object.values(c).reduce((a,b)=>a+b,0);

/* the guild: new works first, then improvements, then housing, and never idle two weeks running */
const UPG_FX = {food:"Food +1 every week", prod:"Timber +1 and Stone +1 every week", coin:"Coin +1 every week", defense:"Defense +1", civic:"Morale +1", house:"Room for 5 more people"};
function guildWork(){
  const out=[], ent=[]; const n = has("royalCollege") ? 3 : has("college") ? 2 : 1;
  for(let i=0;i<n;i++){
    const pool=buildable().filter(id=>id!=="guild"&&id!=="domeHall"&&!PROJECTS[id].claim);
    if(pool.length){
      // prefer the cheaper works so the guild keeps busy, with a little randomness
      pool.sort((a,b)=>costTotal(costOf(a,true))-costTotal(costOf(b,true)));
      const id=pool[Math.floor(Math.random()*Math.min(3,pool.length))];
      buildProject(id,true); out.push(PROJECTS[id].name); ent.push({kind:"new", what:PROJECTS[id].name, fx:PROJECTS[id].gain}); continue;
    }
    const ups=upgradable().filter(id=>canPay(upgCost(id)));
    if(ups.length){
      ups.sort((a,b)=>costTotal(upgCost(a))-costTotal(upgCost(b)));
      const uid=ups[Math.floor(Math.random()*Math.min(4,ups.length))]; const txt=upgradeBuilding(uid); out.push(txt); ent.push({kind:"up", what:"Improved: "+txt, fx:UPG_FX[UPG_OF[uid]]}); continue;
    }
    if(canPay(costOf("cottages",true))){ buildProject("cottages",true); out.push("another cottage row"); ent.push({kind:"house", what:"Built another cottage row", fx:"Housing +15, Morale +1"}); continue; }
    break;
  }
  if(!out.length && (S.flags.guildIdle||0)>=1 && upgradable().length){
    // a second idle week: the guild makes do with salvaged materials
    const id=upgradable()[Math.floor(Math.random()*upgradable().length)];
    const txt=upgradeBuilding(id,true); out.push(txt+" (with salvaged materials)"); ent.push({kind:"up", what:"Improved with salvaged materials: "+txt, fx:UPG_FX[UPG_OF[id]]});
  }
  S.flags.guildIdle = out.length ? 0 : (S.flags.guildIdle||0)+1;
  if(!ent.length) ent.push({kind:"idle", what:"Sat idle", fx:"The stores were too low for anything. If it happens again, they will make do with salvaged materials."});
  // remember it, so the build screen can announce it
  const when = isSeason() ? `${SEASON[S.chapter]?SEASON[S.chapter].name:({summer:"Summer",winter:"Winter",spring:"Spring"})[S.phase]} week ${S.week}` : `Day ${S.day}`;
  S.guildLast={when, ent}; S.guildSeen=false;
  S.guildHistory=[{when:`Ch. ${CH_NAME[S.chapter]} · ${when}`, ent}].concat(S.guildHistory||[]).slice(0,10);
  return out;
}

const GICON = {new:"⌂", up:"▲", house:"⌂", idle:"…"};
function guildCard(){

let toastTimer=null;
function guildToast(){
  const g=S.guildLast; if(!g || S.guildSeen || S.scene!=="plan" || isAway()) return;
  S.guildSeen=true;
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  const idle = g.ent.length===1 && g.ent[0].kind==="idle";
  t.innerHTML=`<b>${idle?"The Builders' Guild sat idle":"The Builders' Guild finished"}</b>${g.ent.filter(e=>e.kind!=="idle").map(e=>`<span>${GICON[e.kind]} ${e.what}</span>`).join("")}<small>Tap to close</small>`;

}

function choose(c){
  if(c.restart){ const m=S.mode; S=START(); S.mode=m; Object.keys(CH_OPEN).forEach(id=>lsDel(cpKey(SLOT,id))); return render(); }
  S.rankMsg="";
  S.surgeMsg="";
  if(c.build){
    buildProject(c.build);
    S.buildsLeft--;
    S.scene="built"; return render();
  }
  if(c.act){
    const A=curActs()[c.act]; add({["n_"+c.act]:1}); if(A.fx) add(val(A.fx)); S.lastAct=c.act; S.actsLeft--;
    S.scene="actDone"; return render();
  }
  if(c.toggleLocked){ S.showLocked=!S.showLocked; S.keepScroll=true; return render(); }
  if(c.surge){ S.flags.surgeNext=true; S.flags.surgeKey=surgeKey(); S.keepScroll=true; return render(); }
  if(c.trade){ add(c.trade); S.rankMsg=""; S.keepScroll=true; return render(); }
  if(c.skip){ S.buildsLeft=0; c={go:"event"}; }
  if(c.fx) add(c.fx);
  let go=c.go;
  if(go==="event"){ go = isAway() ? AWAY[S.phase].events[S.day] : (isSeason()&&S.chapter>=4) ? (SEASON[S.chapter].events[S.week]||"weekEnd") : S.phase==="war" ? WAR_EVENT[S.day] : S.phase==="charter" ? CHARTER_EVENT[S.day] : S.phase==="spring" ? springEvent() : S.phase==="summer" ? summerEvent() : S.phase==="winter" ? winterEvent() : S.phase==="snow" ? val(SNOW_EVENT[S.day]) : val(DAY_EVENT[S.day]); }
  if(go==="weekEnd") go = poolEvent();
  if(go==="nextweek" && (wrenBeat()||fenBeat()||tamsinBeat()||terrBeat())){ go=wrenBeat()||fenBeat()||tamsinBeat()||terrBeat(); S.flags["fb_"+go]=true; }
  else if(go==="nextweek"){
    weekly(); S.week++; S.buildsLeft=perWeek();
    go = S.chapter>=4 ? (S.week>SEASON[S.chapter].len ? SEASON[S.chapter].end : "plan") : S.phase==="spring" ? (S.week>6 ? "fatherArrives" : "plan") : S.phase==="winter" ? (S.week>6 ? "magister" : "plan") : (F("riderSeen") || S.week>8 ? "collector" : "plan");
  }
  if(go==="nextday"){ produce(); S.guildNote=""; if(has("guild") && S.day%2===1){ const g=guildWork(); S.guildNote = g.length ? `Builders' guild finished: ${g.join(" · ")}` : "Builders' guild sat idle · the stores are empty"; } S.newPage=null; if(F("codex_on")) restorePage(); S.day++; S.buildsLeft=perDay(); S.actsLeft=2; go="plan"; }
  if(OPEN_CH[go]!==undefined && go!=="ceremony") saveCheckpoint(OPEN_CH[go]);
  S.scene=go;
  const sc=SCENES[S.scene];
  if(sc&&sc.enter) sc.enter();
  if(/^summary/.test(S.scene)) S.newMarks=awardMarks(); else S.newMarks=null;
  render();
}

  const ready=list.filter(c=>c.req()), locked=list.filter(c=>!c.req());
  const out=ready.slice();
  if(!ready.length) out.push({label:"Nothing you can afford right now", hint:"Assign more crews, trade below, or rest and let the stores fill", req:()=>false, cls:"build"});
  if(locked.length) out.push({label:S.showLocked?`Hide the ${locked.length} projects you can't build yet`:`Show ${locked.length} projects you can't build yet`, hint:"Locked by materials or by requirements", toggleLocked:true, cls:"trade"});
  if(S.showLocked) out.push(...locked);
  return out;
}

function regionShown(id){
  const pr=PROJECTS[id]; if(has(id)) return true;
  if(pr.ch && S.chapter<pr.ch) return false;
  if(pr.summer && S.chapter===1 && !isSeason()) return false;
  if(pr.fate && F("thornFate")!==pr.fate) return false;
  return true;
}
function hullOf(pts){
  pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[],up=[];
  for(const p of pts){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for(const p of pts.slice().reverse()){ while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  up.pop(); lo.pop(); return lo.concat(up);
}
function regionSVG(){

  const westRoad = `<path d="M0,160 Q90,150 ${T.x-r},${T.y+2}" fill="none" stroke="${paved?ink:gh}" stroke-width="${paved?1.6:1.1}" ${paved?"":'stroke-dasharray="3 3"'}/>

  /* ---- roads from the town to every land, with suburbs along them ---- */
  const roads = owned.map((k,ki)=>{ const R=REGIONS[k];
    const ang=Math.atan2(R.y-T.y,R.x-T.x), sx=T.x+Math.cos(ang)*r, sy=T.y+Math.sin(ang)*r;

      : `<path d="${d}" fill="none" stroke="${ink}" stroke-width="1" stroke-dasharray="3 3"/>`;
    // a bridge where the road crosses the river
    if((R.x-305)*(sx-305)<0){ const t=(305-sx)/(R.x-sx), by=sy+(R.y-sy)*t + (my-(sy+R.y)/2)*2*t*(1-t);
      line += `<rect x="${riverX(by)-9}" y="${by-3}" width="18" height="6" fill="${paper}" stroke="${ink}" stroke-width="1"/>`; }
    // suburbs: houses spill out along the road as the town grows
    const n=Math.min(5, Math.floor((S.pop-90)/45)+1);
    for(let j=1;j<=n;j++){ const t=.12+j*.09, x=(1-t)*(1-t)*sx+2*(1-t)*t*mx+t*t*R.x, y=(1-t)*(1-t)*sy+2*(1-t)*t*my+t*t*R.y, side=j%2?5:-5;

      out.push(`<ellipse cx="${R.x+8}" cy="${R.y+4}" rx="9" ry="5" fill="${paper}" stroke="none"/>`);

    if(k==="tBluff"){ for(let i=0;i<6;i++) out.push(`<path d="M${R.x-20+i*7},${R.y+12} l3,-14" stroke="${ink}" stroke-width=".8"/>`);
      out.push(`<path d="M${R.x-16},${R.y-2} h10 v6 h10 v6" fill="none" stroke="${ink}" stroke-width="1.1"/>`);
      if(has("bluffRow")) [[8,-6],[15,-4]].forEach(([dx,dy])=>out.push(house(R.x+dx,R.y+dy))); }
    if(k==="tSouthHills"){ for(let i=0;i<4;i++) out.push(`<path d="M${R.x-38+i*4},${R.y+8-i*5} q${38-i*4},-5 ${76-i*8},0" stroke="${ink}" stroke-width=".8" fill="none"/>`);
      if(has("vineyards")) for(let i=0;i<12;i++) out.push(`<circle cx="${R.x-22+i*4}" cy="${R.y+((i%3)-1)*5}" r="1.1" fill="#6a3a5a"/>`); }

      if(has("marrowMill")) out.push(`<circle cx="${R.x+15}" cy="${R.y+6}" r="4" fill="none" stroke="${ink}"/><path d="M${R.x+11},${R.y+6} h8 M${R.x+15},${R.y+2} v8" stroke="${ink}" stroke-width=".8"/>`); }

      for(let i=0;i<6;i++) out.push(`<circle cx="${R.x-30+i*12}" cy="${R.y+10-(i%2)*3}" r="3" fill="rgba(90,140,70,.35)" stroke="${ink}" stroke-width=".7"/>`);
      if(has("gardenQuarter")) [[-22,-4],[20,-5],[-14,-10],[14,-11]].forEach(([dx,dy])=>out.push(house(R.x+dx,R.y+dy)));
      if(has("keeperHall")) out.push(`<rect x="${R.x+24}" y="${R.y-9}" width="5" height="10" fill="${paper}" stroke="${ink}"/>`);
      // the wall arm that reaches out to bring the Garden inside the city
      out.push(`<path d="M${T.x-6},${T.y-r} Q${(T.x+R.x)/2-14},${(T.y+R.y)/2} ${R.x-14},${R.y+14} M${T.x+6},${T.y-r} Q${(T.x+R.x)/2+14},${(T.y+R.y)/2} ${R.x+14},${R.y+14}" fill="none" stroke="${ink}" stroke-width="1.6"/>`); }
    if(k==="tDeadwood"){ for(let i=0;i<9;i++) out.push(`<path d="M${R.x-26+i*6.5},${R.y+6} v-10 l-2,-3 m2,3 l2,-3" stroke="${gh}" stroke-width=".9" fill="none"/>`);
      if(has("sawTown")) [[-6,6],[4,8]].forEach(([dx,dy])=>out.push(house(R.x+dx,R.y+dy))); }
    if(k==="tWarded"){ out.push(`<path d="M${R.x-34},${R.y+12} Q${R.x},${R.y-6} ${R.x+34},${R.y+12}" fill="none" stroke="${ink}" stroke-width="2.4" opacity=".7"/>`);
      if(has("wardTowers")) [-24,-8,8,24].forEach(dx=>out.push(`<rect x="${R.x+dx-2}" y="${R.y+2}" width="4" height="7" fill="${paper}" stroke="${ink}"/>`)); }

      [[-7,-2],[0,-3],[7,-2],[-4,5],[5,5]].forEach(([dx,dy])=>out.push(house(R.x+dx,R.y+dy)));
      if(has("hollinMarket")) out.push(`<circle cx="${R.x}" cy="${R.y+1}" r="2" fill="${wash}"/>`); }
    if(k==="tEastBank"){ for(let i=0;i<3;i++) for(let j=0;j<3;j++) out.push(house(R.x-10+i*10, R.y-6+j*7));
      if(has("eastWharf")) out.push(`<path d="M${R.x-30},${R.y-12} v24" stroke="${ink}" stroke-width="2.4"/>`); }
    if(k==="tKastrelBank"){ out.push(`<rect x="${R.x-16}" y="${R.y-10}" width="32" height="20" rx="3" fill="${paper}" stroke="${ink}" stroke-width="1.3"/>`);

  const nH=Math.min(70, Math.round(S.pop/6));
  const houses=Array.from({length:nH},(_,i)=>{ const a=i*2.39996, d=(r-7)*Math.sqrt((i+.6)/nH), x=T.x+Math.cos(a)*d, y=T.y+Math.sin(a)*d;
    return `<path d="M${(x-2.4).toFixed(1)},${(y+1.6).toFixed(1)} l2.4,-2.8 l2.4,2.8 z" fill="${has("tiles")?wash:"none"}" fill-opacity=".75" stroke="${ink}" stroke-width=".7"/>`; }).join("");
  const walls = has("concrete")

    : has("wall") ? `<circle cx="${T.x}" cy="${T.y}" r="${r}" fill="${paper}" stroke="${ink}" stroke-width="1.8"/>`

  const town = `${walls}${houses}${heart}${towers}<text x="${T.x}" y="${T.y+r+15}" text-anchor="middle" font-size="15" font-weight="700">Brackenfold</text>`;

  /* ---- the border around everything that is Brackenfold's ---- */
  const pts=[]; const ring=(cx,cy,rx,ry)=>{ for(let a=0;a<14;a++){ const t=a*Math.PI/7; pts.push([cx+rx*Math.cos(t), cy+ry*Math.sin(t)]); } };

  const people = owned.reduce((t,k)=>t+(PROJECTS[k].housing||0),0);
  return `<div class="survey" role="img" aria-label="Map of Brackenfold and its ${owned.length} lands">

    <text x="10" y="284" font-size="12">Lands of Brackenfold · ${owned.length} claimed${people?` · ${people} homes beyond the walls`:""}</text>
    <text x="372" y="18" font-size="13">N ↑</text>
  </svg></div>`;
}

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function validSave(d){ return d&&d.stats&&d.built&&d.assign&&d.codex&&d.counts&&d.chapter?d:null; }

  let d=null; try{ d=JSON.parse(lsGet(cpKey(SLOT,id))); }catch(e){}

function slotSummary(n){
  const d=readSlot(n);

  return {empty:false, line:`${esc(d.name||"Unnamed")} · ${where} · ${d.mode==="builder"?"Builder":d.mode==="story"?"Story":"Classic"}`};
}
function drawSaves(){
  const box=document.getElementById("savesBox");
  const rows=Array.from({length:SLOTS},(_,i)=>{ const n=i+1, info=slotSummary(n), act=n===SLOT;
    return `<div class="slot ${act?"now":""}"><div class="slot-info"><b>Slot ${n}${act?" · playing":""}</b><span>${info.line}</span></div>
      <div class="slot-btns">${act?"":`<button type="button" class="ghost" data-slot="play" data-n="${n}">${info.empty?"New story":"Play"}</button>`}
      ${info.empty||act?"":`<button type="button" class="ghost" data-slot="clear" data-n="${n}">Clear</button>`}</div></div>`;}).join("");
  box.innerHTML=`<div class="sheet"><h3>SAVES · EACH SLOT AUTOSAVES</h3>${rows}
    <div class="slot-new"><button type="button" class="ghost" data-slot="restart">Start a new story in this slot</button>
    <span class="note">Finished chapters can be replayed from the Chapters panel.</span></div></div>`;
  box.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.slot, n=+b.dataset.n;
    if((a==="clear"||a==="restart") && !b.dataset.armed){ b.dataset.armed="1"; b.textContent="Tap again to confirm"; return; }
    if(a==="play"){ save(); SLOT=n; lsSet("fie_active",String(n)); S=readSlot(n)||START(); syncCodex(); closePanels(); render(); }
    if(a==="clear"){ lsDel(slotKey(n)); Object.keys(CH_OPEN).forEach(id=>lsDel(cpKey(n,id))); drawSaves(); }
    if(a==="restart"){ const m=S.mode; S=START(); S.mode=m; Object.keys(CH_OPEN).forEach(id=>lsDel(cpKey(SLOT,id))); closePanels(); render(); }
  });
}
function bindReplay(){

    short:`<path d="M35,64 Q37,79 50,82 Q63,79 65,64 Q60,72 50,73 Q40,72 35,64 Z" fill="${hair}" stroke="${ink}" stroke-width="1.1"/><path d="M45,70 Q50,72.4 55,70" fill="none" stroke="${ink}" stroke-width="1.2"/>`,
    stubble:`<g fill="${shade(hair,-20)}" opacity=".55">${Array.from({length:26},(_,i)=>`<circle cx="${38+(i*7)%25}" cy="${66+(i*5)%12}" r=".55"/>`).join("")}</g>`}[c.beard]||"";
  P.push(beard);
  // marks: scars, burns, ink, embers, sparks, flour
  if(c.scar) P.push(`<path d="M62,55 l5,7" stroke="${shade(skin,-50)}" stroke-width="1.3" stroke-linecap="round"/>`);
  if(c.burn) P.push(`<path d="M33,58 q3,-2 5,1 q2,3 -1,5" fill="${shade(skin,-22)}" stroke="none"/>`);
  if(c.ink) P.push(`<ellipse cx="62" cy="62" rx="2.4" ry="1.2" fill="#2a3a5a" opacity=".55"/>`);
  if(c.ember) P.push(`<path d="M34,66 q1,-3 2,0 q1,2 -1,3 z M64,67 q1,-3 2,0 q1,2 -1,3 z" fill="#e0882a"/>`);
  // hair in front
  const front={
    short:`<path d="M30,44 Q28,20 50,19 Q72,20 70,44 Q66,32 58,34 Q55,28 48,32 Q40,28 36,35 Q32,36 30,44 Z" fill="${hair}" stroke="${ink}" stroke-width="1.3"/>`,
    messy:`<path d="M29,46 Q24,30 32,24 Q34,14 44,16 Q50,8 58,15 Q68,12 70,22 Q78,28 71,46 Q68,34 62,36 Q60,28 54,33 Q50,26 45,33 Q40,28 37,36 Q32,34 29,46 Z" fill="${hair}" stroke="${ink}" stroke-width="1.3"/>`,
    long:`<path d="M30,48 Q27,20 50,18 Q73,20 70,48 Q68,32 56,30 Q54,38 44,36 Q36,34 30,48 Z" fill="${hair}" stroke="${ink}" stroke-width="1.3"/>`,
    tied:`<path d="M30,44 Q29,21 50,19 Q71,21 70,44 Q66,30 50,29 Q34,30 30,44 Z" fill="${hair}" stroke="${ink}" stroke-width="1.3"/><path d="M40,23 Q50,20 60,23" fill="none" stroke="${hd}" stroke-width=".8"/>`,
    braid:`<path d="M30,44 Q29,21 50,19 Q71,21 70,44 Q62,30 52,30 Q50,24 47,30 Q36,30 30,44 Z" fill="${hair}" stroke="${ink}" stroke-width="1.3"/>`,
    bun:`<path d="M30,44 Q29,21 50,20 Q71,21 70,44 Q66,30 50,28 Q34,30 30,44 Z" fill="${hair}" stroke="${ink}" stroke-width="1.3"/><path d="M38,26 Q50,23 62,26" fill="none" stroke="${hd}" stroke-width=".8"/>`,
    thin:`<path d="M30,46 Q29,34 33,28 Q31,40 33,46 Z M70,46 Q71,34 67,28 Q69,40 67,46 Z" fill="${hair}" stroke="${ink}" stroke-width="1.1"/><path d="M38,26 Q50,22 62,26" fill="none" stroke="${hair}" stroke-width="2.4" opacity=".7"/>`,

  P.push(front);
  if(c.flour) P.push(`<path d="M40,24 q3,-2 6,0 M56,24 q3,-2 5,1" stroke="#fbfbf6" stroke-width="2.4" stroke-linecap="round" fill="none"/>`);
  if(c.spark) P.push(`<path d="M66,24 l-4,7 h4 l-4,7" fill="none" stroke="#6fd3ff" stroke-width="1.6" stroke-linejoin="round"/>`);
  return `<svg viewBox="0 0 100 120" role="img" aria-label="${c.n}">${P.join("")}<rect width="100" height="120" fill="none" stroke="${ink}" stroke-width="2"/></svg>`;
}
const NO_CAST = ["plan","built","create"];
function castStrip(html){
  if(NO_CAST.includes(S.scene)) return "";
  const ids=castIn(html); if(!ids.length) return "";
  return `<div class="cast">${ids.map(id=>`<figure>${portrait(id)}<figcaption>${CAST[id].n}</figcaption></figure>`).join("")}</div>`;
}

/* ======================= MUSIC AND SOUND =======================
   Everything is generated live with the Web Audio API: no audio files. */
const AUDIO={ctx:null, master:null, music:null, on:false, timer:null, mood:null, lastScene:null, step:0};
try{ AUDIO.on = lsGet("fie_sound")==="on"; }catch(e){}
const MOODS={
  hearth:{root:220.00, scale:[0,2,4,7,9], beat:1.9, pad:[0,7,16]},   // home, building
  winter:{root:196.00, scale:[0,2,3,7,10], beat:2.6, pad:[0,7,15]},
  court: {root:246.94, scale:[0,2,4,5,7,9,11], beat:1.6, pad:[0,4,7]},
  sea:   {root:174.61, scale:[0,2,5,7,9], beat:2.2, pad:[0,7,14]},
  storm: {root:146.83, scale:[0,1,3,7,8], beat:1.1, pad:[0,3,7]},    // crises
  dream: {root:261.63, scale:[0,4,7,11,14], beat:3.0, pad:[0,7,11]}
};
function curMood(){
  if(["siege4","dome5","foundry6","storm7","ktest","tide","trial","expedition","exam"].includes(S.phase) || /^(siege|s4|outcome|dome|foundry|storm|ktest|tide|trial|thorn[123])/.test(S.scene)) return "storm";
  if(/^(codexDream|codexWhy|codexAngry|aurelWarns|aurelFall|g7aurel|wrenFont|keystoneReveal)/.test(S.scene)) return "dream";
  if(S.phase==="saelmar"||S.chapter===5.5) return "sea";
  if(S.phase==="capital"||S.phase==="kingsroad"||S.phase==="charter") return "court";
  if(isWinter()||S.chapter===2||S.chapter===5&&S.phase==="winter") return "winter";
  return "hearth";
}
function audioInit(){
  if(AUDIO.ctx) return true;
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return false;
  try{ AUDIO.ctx=new C(); }catch(e){ return false; }
  AUDIO.master=AUDIO.ctx.createGain(); AUDIO.master.gain.value=.55; AUDIO.master.connect(AUDIO.ctx.destination);
  AUDIO.music=AUDIO.ctx.createGain(); AUDIO.music.gain.value=.32;
  const lp=AUDIO.ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1800;
  AUDIO.music.connect(lp); lp.connect(AUDIO.master);
  return true;
}
function note(freq, dur, opt={}){
  const a=AUDIO.ctx, t=a.currentTime+(opt.at||0), o=a.createOscillator(), g=a.createGain();
  o.type=opt.type||"sine"; o.frequency.value=freq;
  const v=opt.vol||.2, att=opt.attack||.01;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(opt.bus||AUDIO.master); o.start(t); o.stop(t+dur+.05);
}
function noise(dur, opt={}){
  const a=AUDIO.ctx, len=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,opt.decay||3);
  const s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter();
  f.type=opt.filter||"bandpass"; f.frequency.value=opt.freq||1200; g.gain.value=opt.vol||.3;
  s.buffer=buf; s.connect(f); f.connect(g); g.connect(AUDIO.master); s.start(a.currentTime+(opt.at||0));
}
function sfx(kind){
  if(!AUDIO.on||!AUDIO.ctx) return;
  if(kind==="build"){ noise(.12,{freq:900,vol:.35}); note(110,.25,{type:"triangle",vol:.25}); noise(.1,{freq:1400,vol:.25,at:.18}); note(98,.2,{type:"triangle",vol:.18,at:.18}); }
  if(kind==="turn"){ noise(.08,{freq:2600,vol:.06,decay:2}); }
  if(kind==="system"){ note(880,.5,{vol:.08}); note(1318.5,.6,{vol:.06,at:.06}); }
  if(kind==="chapter"){ [0,4,7,12].forEach((s,i)=>note(261.63*Math.pow(2,s/12),1.4,{vol:.12,at:i*.14,type:"triangle"})); }
  if(kind==="mark"){ [0,7,12,16,19].forEach((s,i)=>note(523.25*Math.pow(2,s/12),1.1,{vol:.08,at:i*.09})); }
  if(kind==="drum"){ note(55,.9,{type:"sine",vol:.45,attack:.005}); noise(.4,{filter:"lowpass",freq:200,vol:.3}); }
}
function musicTick(){
  if(!AUDIO.on||!AUDIO.ctx) return;
  const M=MOODS[AUDIO.mood||"hearth"], a=AUDIO.ctx; AUDIO.step++;
  const hz=s=>M.root*Math.pow(2,s/12);
  if(AUDIO.step%4===1) M.pad.forEach(s=>note(hz(s)/2, M.beat*4.2, {vol:.05, attack:1.2, bus:AUDIO.music}));
  if(Math.random()<.72){ const s=M.scale[Math.floor(Math.random()*M.scale.length)]+(Math.random()<.3?12:0); note(hz(s), M.beat*1.6, {type:"triangle", vol:.07, attack:.02, bus:AUDIO.music}); }
  if(AUDIO.mood==="storm" && AUDIO.step%2===0) note(hz(0)/4, .7, {vol:.18, attack:.005, bus:AUDIO.music});
  clearTimeout(AUDIO.timer); AUDIO.timer=setTimeout(musicTick, M.beat*1000);
}
function setSound(on){
  AUDIO.on=on; lsSet("fie_sound", on?"on":"off");
  const b=document.getElementById("btnSound"); if(b){ b.setAttribute("aria-pressed", on); b.textContent = on ? "Sound on" : "Sound off"; }
  if(on){ if(!audioInit()) return; if(AUDIO.ctx.state==="suspended") AUDIO.ctx.resume(); AUDIO.mood=curMood(); clearTimeout(AUDIO.timer); musicTick(); }
  else { clearTimeout(AUDIO.timer); if(AUDIO.ctx) AUDIO.ctx.suspend(); }
}
function audioOnRender(html){
  if(!AUDIO.on||!AUDIO.ctx) { AUDIO.lastScene=S.scene; return; }
  const m=curMood(); if(m!==AUDIO.mood){ AUDIO.mood=m; }
  if(S.scene!==AUDIO.lastScene){
    if(S.scene==="built") sfx("build");
    else if(/^summary/.test(S.scene)) { sfx("chapter"); if(S.newMarks&&S.newMarks.length) setTimeout(()=>sfx("mark"),900); }
    else if(OPEN_CH[S.scene]!==undefined) sfx("chapter");
    else if(m==="storm" && AUDIO.lastScene && !/^(siege|s4|dome|foundry|storm|ktest|tide|trial|thorn)/.test(AUDIO.lastScene)) sfx("drum");
    else if(String(html).includes('class="sys')) sfx("system");
    else sfx("turn");
  }
  AUDIO.lastScene=S.scene;
}
document.addEventListener("visibilitychange", ()=>{ if(!AUDIO.ctx) return; if(document.hidden){ clearTimeout(AUDIO.timer); AUDIO.ctx.suspend(); } else if(AUDIO.on){ AUDIO.ctx.resume(); musicTick(); } });

window.addEventListener("appinstalled", ()=>{ document.getElementById("btnInstall").hidden=true; });

syncCodex();
if(AUDIO.on){ const b=document.getElementById("btnSound"); if(b){ b.textContent="Sound on"; b.setAttribute("aria-pressed","true"); } }
render();
